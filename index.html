ташована на рівні III шийного хребця (від м’якого піднебіння до входу в гортань).", "На рівні IV–V хребців лежить гортанна частина глотки.", "На рівні VI шийного хребця глотка переходить у стравохід."]}, {"n": "23.2", "q": "Чоловіка 49 років госпіталізовано в лікарню із опіком стравоходу. Через деякий час у чоловіка з’явилися симптоми запалення очеревини (перитоніту). Яка частина стравоходу ушкоджена?", "o": ["Черевна.", "Грудна.", "Шийна.", "Гортанна.", "Верхня."], "a": [0], "e": ["Черевна частина стравоходу вкрита очеревиною, тому її ушкодження дає перитоніт.", "Грудна частина лежить у середостінні, без очеревини.", "Шийна частина лежить на шиї.", "Гортанної частини стравоходу немає (є гортанна частина глотки).", "Верхньої частини як анатомічного відділу не виділяють."]}, {"n": "23.3", "q": "Під час проведення фіброезофагогастроскопії лікар виконує паліативне лікування раку стравоходу на рівні IV грудного хребця. Яка структура попереду і зліва прилягає до стінки стравоходу на цьому рівні?", "o": ["Роздвоєння трахеї.", "Дуга аорти.", "Правий головний бронх.", "Грудна протока.", "Непарна вена."], "a": [1], "e": ["Роздвоєння трахеї лежить на рівні IV–V хребців попереду, але не зліва.", "На рівні IV грудного хребця попереду і зліва до стравоходу прилягає дуга аорти (аортальне звуження).", "Правий головний бронх лежить праворуч.", "Грудна протока лежить позаду стравоходу.", "Непарна вена лежить позаду і праворуч."]}, {"n": "23.4", "q": "Внаслідок хімічного опіку виникла рубцева деформація слизової оболонки стравоходу з ушкодження складок, які з іншими структурами стінки органу сприяють процесу евакуації їжі. Які складки утворює слизова оболонка стравоходу в нормі?", "o": ["Колові.", "Поздовжні.", "Косі.", "Півмісяцеві.", "Складки відсутні."], "a": [1], "e": ["Колові складки характерні для тонкої кишки.", "Слизова оболонка стравоходу утворює поздовжні складки, що розправляються під час проходження їжі.", "Косі складки стравоходу не властиві.", "Півмісяцеві складки є в товстій кишці.", "Складки в стравоході є."]}, {"n": "23.5", "q": "У чоловіка 34 років рентгенологічно виявлена діафрагмова кила в стравохідному розтворі діафрагми. Які із зазначених анатомічних утворів, що розташовані в цьому отворі разом із стравоходом можуть бути стиснуті килою?", "o": ["Стовбури блукаючих нервів.", "Грудна протока.", "Правий симпатичний стовбур.", "Непарна вена.", "Напівнепарна вена."], "a": [0], "e": ["Через стравохідний розтвір діафрагми разом зі стравоходом проходять передній і задній блукаючі стовбури.", "Грудна протока проходить через аортальний розтвір.", "Симпатичний стовбур проходить між ніжками діафрагми.", "Непарна вена проходить між ніжками діафрагми.", "Півнепарна вена проходить між ніжками діафрагми ліворуч."]}, {"n": "23.6", "q": "У чоловіка 50 років під час МРТ-дослідження виявлена пухлина на задній поверхні шлунка у ділянці його воротарної частини. Який орган черевної порожнини прилягає до ураженої частини шлунка?", "o": ["Pancreas.", "Glandula suprarenalis.", "Ren.", "Hepar.", "Lien."], "a": [0], "e": ["До задньої поверхні воротарної частини шлунка прилягає підшлункова залоза (головка і тіло).", "Ліва надниркова залоза прилягає до тіла шлунка, вище.", "Ліва нирка прилягає до тіла шлунка.", "Печінка прилягає до передньої поверхні і малої кривини.", "Селезінка прилягає до дна шлунка."]}, {"n": "23.7", "q": "40-річному чоловіку, хворого на виразку шлунка була призначена ендоскопія. Під час обстеження лікарю слід пам’ятати, що нормальний рельєф слизової оболонки шлунка утворений:", "o": ["Коловими складками, ворсинками, ямочками.", "Шлунковими складками, полями, ямочками.", "Півмісяцевими складками, полями.", "Відхідниковими стовпами, полями, ямочками.", "Поперечними складками, ямочками."], "a": [1], "e": ["Колові складки і ворсинки характерні для тонкої кишки.", "Рельєф слизової шлунка утворюють шлункові складки, шлункові поля і шлункові ямочки.", "Півмісяцеві складки є в товстій кишці.", "Відхідникові стовпи є в прямій кишці.", "Поперечні складки шлунку не властиві."]}, {"n": "23.8", "q": "У чоловіка 34 років діагностовано аневризму передньої стінки грудної аорти у нижній її третині. На МРТ виявлено, що відбувається надмірний тиск аневризмою на стравохід. Як розташований стравохід по відношенню до аорти перед його входом у стравохідний розтвір діафрагми?", "o": ["Позаду і справа.", "Попереду і справа.", "Знизу.", "Попереду і зліва.", "Позаду і зліва."], "a": [3], "e": ["Позаду і справа від аорти стравохід не лежить.", "Стравохід у нижній частині відхиляється вліво, тому лежить попереду і зліва від аорти, а не справа.", "Знизу від аорти стравохід не розташований.", "Перед проходженням через діафрагму стравохід лежить попереду і ліворуч від аорти.", "Позаду від аорти стравохід не лежить."]}, {"n": "23.9", "q": "Під час проби Конна чоловік швидко випиває стакан рідкого контрастного барію, який створює у стравоході, що заповнюється, гідростатичний тиск і контрастна речовина потрапляє у шлунок. Яка частина шлунка під впливом цього тиску механічно розкривається?", "o": ["Склепіння шлунка.", "Дно шлунка.", "Кардіальна частина.", "Тіло.", "Воротарна частина."], "a": [2], "e": ["Склепіння шлунка (дно) лежить вище і відкриттям не реагує.", "Дно шлунка — найвища частина, тиск рідини його не «відкриває».", "Кардіальна частина з кардіальним отвором розкривається під тиском рідини в стравоході.", "Тіло шлунка — основна частина, не має отвору.", "Воротарна частина відкривається у дванадцятипалу кишку."]}, {"n": "23.10", "q": "Під час рентгенологічного дослідження шлунка у чоловіка 30 років у вертикальному положенні лікар констатує наявність повітря. У якій частині накопичується повітря?", "o": ["У дні.", "У тілі.", "У кардіальній.", "У ділянці малої кривини.", "У воротарній."], "a": [0], "e": ["У вертикальному положенні повітря збирається в найвищій частині — дні (склепінні) шлунка, утворюючи газовий міхур.", "Тіло лежить нижче дна.", "Кардіальна частина лежить нижче склепіння.", "Мала кривина — край шлунка, газ там не накопичується.", "Воротарна частина лежить найнижче праворуч."]}, {"n": "23.11", "q": "Під час рентгенологічного дослідження у чоловіка 35 років лікар спостерігає зниження моторики шлунка та процесу евакуації рентгенконтрасної маси до дванадцятипалої кишки. У якій послідовності рентгенконтрасна маса заповнює частини шлунка?", "o": ["Fundus gastricus, cardia, corpus gastricus, antrum pyloricum, canalis pyloricus, pylorus, ostium pyloricum.", "Cardia, fundus gastricus, corpus gastricus, antrum pyloricum, canalis pyloricus, pylorus, ostium pyloricum.", "Cardia, fundus gastricus, corpus gastricus, canalis pyloricus, antrum pyloricum, pylorus, ostium pyloricum.", "Cardia, corpus gastricus, fundus gastricus, antrum pyloricum, canalis pyloricus, pylorus, ostium pyloricum.", "Cardia, corpus gastricus, fundus gastricus, antrum pyloricum, pylorus, ostium pyloricum."], "a": [1], "e": ["Контраст спершу проходить кардіальний отвір, а не дно.", "Послідовність: кардіальна частина → дно → тіло → воротарна печера → воротарний канал → воротар → отвір воротаря.", "Печера воротаря передує каналу, а не навпаки.", "Дно заповнюється до тіла.", "Пропущено воротарний канал і порядок дна порушено."]}, {"n": "23.12", "q": "У жінки 30 років виникає страх перед вживанням їжі через можливе виникнення болю. Під час глибокої пальпації живота виникає біль у ділянках проєкції шлунка на переднюю черевну стінку. На які ділянки живота проєктується шлунок?", "o": ["Regio hypochondriaca sinistra et dextra, regio epigastrica.", "Regio hypochondriaca dextra, regio umbilicalis.", "Regio hypochondriaca dextra, regio epigastrica, regio umbilicalis.", "Regio hypochondriaca sinistra, regio epigastrica.", "Regio epigastrica."], "a": [3], "e": ["Шлунок майже не проєктується на праве підребер’я.", "Пупкова ділянка — лише при опущенні шлунка.", "Праве підребер’я займає печінка.", "Шлунок проєктується на ліве підребер’я і надчеревну ділянку.", "Надчеревна ділянка — лише частина проєкції."]}, {"n": "23.13", "q": "У чоловіка 44 років під час проведення магнітно-резонансного дослідження лікар виявив ушкодження стінки шлунка у ділянці кардіального отвору. Де розташований кардіальний отвір шлунка?", "o": ["Ліворуч від тіла шлунка на рівні X–XI грудних хребців.", "Справа від тіла шлунка на рівні X–XI грудних хребців.", "На рівні IX–X грудних хребців.", "На рівні I–II поперекових хребців", "На рівні II –III поперекових хребців."], "a": [0], "e": ["Кардіальний отвір лежить ліворуч від хребтового стовпа на рівні X–XI грудних хребців.", "Кардіальний отвір лежить ліворуч, а не праворуч.", "IX–X — завищений рівень.", "На рівні I поперекового хребця лежить воротар.", "II–III поперекові — надто низько."]}, {"n": "23.14", "q": "У дитини 10 років виявлена гастрогенна форма залізодефіцитної анемії. Лікарі пов’язують виникнення анемії з порушенням секреції власними залозами шлунку внутрішнього антианемічного фактора. Які клітини власних залоз шлунка продукують антианемічний фактор?", "o": ["Шийкові мукоцити.", "Парієтальні екзокриноцити.", "Головні екзокриноцити.", "Додаткові мукоцити.", "Ендокриноцити."], "a": [1], "e": ["Шийкові мукоцити виділяють слиз.", "Парієтальні екзокриноцити виробляють соляну кислоту і внутрішній фактор Касла.", "Головні екзокриноцити виробляють пепсиноген.", "Додаткові мукоцити виділяють слиз.", "Ендокриноцити виділяють гормони."]}, {"n": "23.15", "q": "Під час оперативного втручання з приводу видалення селезінки у хворого перев’язують судини, що розташовані в ligamentum gastrolienalе. Які органи черевної порожнини, окрім селезінки, пов’язані зі шлунком через дублікатуру очеревини?", "o": ["Підшлункова залоза, печінка.", "Печінка, поперечна ободова кишка, діафрагма.", "Печінка, поперечна ободова кишка, нирка.", "Поперечна ободова кишка, діафрагма, нирка.", "Поперечна ободова кишка, діафрагма, надниркові залози."], "a": [1], "e": ["Підшлункова залоза лежить заочеревинно і зв’язок зі шлунком не має.", "Шлунок зв’язаний з печінкою (печінково-шлункова), поперечною ободовою кишкою (шлунково-ободова), діафрагмою (шлунково-діафрагмова) і селезінкою.", "Нирка лежить заочеревинно, зв’язки зі шлунком немає.", "Нирка не має очеревинної зв’язки зі шлунком.", "Надниркові залози лежать заочеревинно."]}, {"n": "23.16", "q": "У чоловіка 46 років під час дослідження виявлена пухлина на задній поверхні шлунка у ділянці його дна. Який орган черевної порожнини прилягає до ураженої частини шлунка?", "o": ["Intestinum tenue.", "Duodenum.", "Ren.", "Hepar.", "Lien."], "a": [4], "e": ["Тонка кишка до дна шлунка не прилягає.", "Дванадцятипала кишка прилягає до воротаря.", "Нирка прилягає до тіла шлунка.", "Печінка прилягає до передньої поверхні і малої кривини.", "До задньої поверхні дна шлунка прилягає селезінка."]}, {"n": "23.17", "q": "Пацієнт 48 років скаржиться на печію, біль за грудниною та періодичну регургітацію. Під час гастроскопії виявлено гастроезофагеальний рефлюкс та ознаки початкової грижі стравохідного отвору діафрагми. Лікар виявив зміни стінки стравоходу в ділянці його переходу у шлунок. На рівні яких хребців знаходиться перехід стравоходу у шлунок?", "o": ["XI грудний хребець.", "XII грудний хребець.", "I поперековий хребець.", "II поперековий хребець.", "III поперековий хребець."], "a": [0], "e": ["Стравохід переходить у шлунок на рівні XI грудного хребця.", "XII грудний — нижче рівня кардії.", "I поперековий — рівень воротаря.", "II поперековий — надто низько.", "III поперековий — надто низько."]}, {"n": "23.18", "q": "Пацієнт 45 років звернувся до лікаря зі скаргами на біль у верхній частині живота та лівому підребер’ї після їди. Під час проведення УЗД виявлено значне розширення дна шлунка, що тисне на діафрагму та частково зміщує селезінку. Лікар пояснює, що дно шлунка має чітку анатомічну проєкцію на грудну клітку, що важливо для інтерпретації рентгенологічних та ультразвукових досліджень. На рівні якого міжребрового простору находиться дно шлунка?", "o": ["Пʼятого лівого міжребрового простору.", "Пʼятого правого міжребрового простору.", "Четвертого лівого міжребрового простору.", "Четвертого правого міжребрового простору.", "Третього лівого міжребрового простору."], "a": [0], "e": ["Дно шлунка досягає рівня V лівого міжребрового простору по середньоключичній лінії.", "Праворуч від серединної лінії дно не розташоване.", "IV лівий міжребровий простір — завищений рівень.", "Праворуч дна немає.", "III лівий міжребровий простір — надто високо."]}, {"n": "23.19", "q": "Дівчинка 6 років часто хворіє на запалення середнього вуха (отит) та має утруднене носове дихання. Під час огляду дитини лікар виявив гіпертрофію глоткових мигдаликів (аденоїди), які перекривають отвори слухових труб у носоглотці. Лікар пояснює, що порушення вентиляції середнього вуха пов’язане з анатомічними сполученнями глотки. Де вказано всі сполучення глотки?", "o": ["Сavitas nasi, cavitas oris, larynx, cavitas tympani, oesophagus.", "Сavitas nasi, cavitas oris, larynx, sinus maxillaris, oesophagus.", "Сavitas nasi, cavitas ovaris, larynx, cavitas tympani, oesophagus.", "Сavitas nasi, cavitas oris, larynx, cavitas tympani, gaster.", "Сavitas nasi, cavitas oris, cavitas tympani, oesophagus."], "a": [0], "e": ["Глотка сполучається з носовою порожниною (хоани), ротовою (зів), гортанню, барабанною порожниною (слухові труби) і стравоходом.", "З верхньощелепною пазухою глотка безпосередньо не сполучається.", "Порожнини яєчника не існує.", "Глотка переходить у стравохід, а не в шлунок.", "Пропущено гортань."]}, {"n": "23.20", "q": "Знання анатомічних звужень стравоходу важливе для прогнозування місць застрягання сторонніх тіл та методики проведення ендоскопічних процедур. Яке звуження стравоходу є анатомічним?", "o": ["Constrictio bronchialis.", "Constrictio aortica.", "Constrictio abdominalis.", "Constrictio thoracica oesophagi.", "Constrictio descendes aortae."], "a": [0], "e": ["Анатомічні звуження стравоходу — глоткове, бронхове і діафрагмове.", "Аортальне звуження — фізіологічне.", "Черевного звуження немає.", "Окремого «грудного звуження» не виділяють.", "Звуження низхідної аорти не існує."]}, {"n": "23.21", "q": "Хлопчика 6 років обстежує педіатр. У дитини наявні ознаки утрудненого носове дихання, хропіння під час сну. Мати зазначає, що дитина часто хворіє на ангіни, запалення середнього вуха (отит). Під час огляду у дитини виявлені збільшені піднебінні мигдалики, гіпертрофія глоткового мигдалика (аденоїди). Ці утвори входять до глоткового лімфоїдного кільця, яке є важливим бар’єром імунного захисту. Чим утворене глоткове лімфоїдне кільце Пирогова-Вальдейера?", "o": ["Tonsilla pharyngea, tonsillae tubaria, tonsilla lingualis, tonsillae palatinae.", "Tonsilla pharyngea, tonsilla tubaria, tonsilla lingualis.", "Tonsilla pharyngea, tonsilla tubaria, tonsilla palatina.", "Tonsilla lingualis, tonsillae palatina.", "Tonsilla tubaria, tosilla lingualis, tonsilla palatina."], "a": [0], "e": ["Лімфоїдне кільце утворюють глотковий, два трубні, язиковий і два піднебінні мигдалики.", "Пропущено піднебінні мигдалики.", "Пропущено язиковий мигдалик.", "Пропущено глотковий і трубні мигдалики.", "Пропущено глотковий мигдалик."]}, {"n": "23.22", "q": "Чоловік 50-ти років звернувся до лікаря зі скаргами на утруднене ковтання та біль за грудниною після випадкового проковтування рибної кістки. Під час проведення рентгеноскопії з контрастом стороннє тіло виявлено на рівні фізіологічного звуження стравоходу, де він перехрещується з лівим головним бронхом. Лікар пояснює, що це місце є одним із трьох звужень стравоходу, де найчастіше застрягають сторонні предмети. На якому рівні знаходиться бронхо-аортальне звуження стравоходу?", "o": ["III–IV грудний хребець", "IV–V грудний хребець.", "V–VI грудний хребець.", "VI–VII грудний хребець.", "VIII грудний хребець."], "a": [1], "e": ["III–IV грудні — дещо вище.", "Бронхо-аортальне звуження розташоване на рівні IV–V грудних хребців.", "V–VI — нижче біфуркації.", "VI–VII — надто низько.", "VIII — надто низько."]}, {"n": "23.23", "q": "Жінка 54-х років звернулася до лікаря зі скаргами на утруднене ковтання та біль за грудниною внаслідок випадкового проковтування шматочка кістки. Під час проведення рентгеноскопії з контрастом стороннє тіло виявлено на рівні, де стравохід перехрещується з дугою аорти. Лікар пояснює, що це місце є одним із звужень стравоходу, яке має важливе клінічне значення під час проведення ендоскопічних втручаннях. На якому рівні стравохід перехрещується з дугою аорти?", "o": ["IV грудний хребець", "V грудний хребець.", "VI грудний хребець.", "VII грудний хребець.", "VIII грудний хребець."], "a": [0], "e": ["Стравохід перехрещується з дугою аорти на рівні IV грудного хребця.", "V грудний — рівень лівого головного бронха.", "VI грудний — нижче.", "VII грудний — нижче.", "VIII грудний — нижче."]}, {"n": "23.24", "q": "Чоловік 60-ти років звернувся до лікаря зі скаргами на печію, біль за грудниною та регургітацію після їди. Під час проведення гастроскопії виявлено ознаки гастроезофагеального рефлюксу та початкову килу (грижу) стравохідного отвору діафрагми. Ці зміни локалізуються в ділянці діафрагмового звуження стравоходу, яке має чіткий анатомічний рівень. На рівні яких хребців розташовано діафрагмове звуження стравоходу?", "o": ["І–ІІІ грудні хребці.", "IV–V грудні хребці.", "V–VI грудні хребці.", "VI–VII грудні хребці.", "ІХ–Х грудні хребці."], "a": [4], "e": ["I–III грудні — рівень верхньої частини грудного відділу.", "IV–V — бронхо-аортальне звуження.", "V–VI — без звуження.", "VI–VII — без звуження.", "Діафрагмове звуження — на рівні IX–X грудних хребців у стравохідному розтворі."]}, {"n": "23.25", "q": "Чоловік 58 років звернувся до лікаря зі скаргами на постійний біль у верхній частині живота, що віддає в спину, нудоту та втрату ваги. Під час проведення КТ органів черевної порожнини виявлено пухлину на задній стінці тіла шлунка, яка росте у бік чепцевої сумки та стискає сусідні утвори позаду неї. Які органи розташовані позаду шлунка?", "o": ["Підшлункова залоза, ліва надниркова залоза, ліва нирка, поперечна ободова кишка.", "Печінка, жовчний міхур, стравохід, права нирка.", "Селезінка, хвіст підшлункової залози, висхідна ободова кишка.", "Поперечна ободова кишка, брижа поперечної ободової кишки, печінка.", "Діафрагма, печінка, селезінка, поперечна ободова кишка."], "a": [0], "e": ["Позаду шлунка (за чепцевою сумкою) лежать підшлункова залоза, ліва надниркова залоза, верхній кінець лівої нирки і поперечна ободова кишка.", "Печінка і жовчний міхур лежать праворуч і спереду.", "Висхідна ободова кишка лежить праворуч у животі.", "Печінка лежить спереду і праворуч.", "Діафрагма і печінка лежать зверху і спереду."]}, {"n": "23.26", "q": "Пацієнтка 52 років звернулася до лікаря зі скаргами на біль у верхній частині живота, що посилюється після жирної їжі, нудоту. Під час проведення УЗД виявлено збільшення жовчного міхура та ознаки хронічного холециститу та патологічні зміни органів, що розташовані справа від шлунка Які органи розташовуються праворуч від шлунка?", "o": ["Головка і тіло підшлункової залози, черевна частина аорти.", "Нутрощева поверхня лівої частки печінки, верхня частина дванадцятипалої кишки.", "Селезінка, хвіст підшлункової залози.", "Поперечна ободова кишка, брижа поперечної ободової кишки.", "Діафрагма, печінка, селезінка, серце."], "a": [1], "e": ["Підшлункова залоза і аорта лежать позаду.", "Праворуч від шлунка — нутрощева поверхня лівої частки печінки і верхня частина дванадцятипалої кишки.", "Селезінка лежить ліворуч.", "Поперечна ободова кишка лежить знизу.", "Серце лежить вище діафрагми."]}, {"n": "23.27", "q": "Чоловік 60 років звернувся до лікаря зі скаргами на біль у лівому підребер’ї, що посилюється після прийому їжі, слабкість. Під час проведення КТ черевної порожнини лікар звернув увагу на ознаки патологічних змін в органах, що розташовані ліворуч від шлунка. Ушкодження цих органів можуть імітувати шлунковий біль. Які органи топографічно розташовані зліва від шлунка?", "o": ["Головка і тіло підшлункової залози, черевна частина аорти.", "Печінка, жовчний міхур, стравохід.", "Селезінка, хвіст підшлункової залози.", "Поперечна ободова кишка, брижа поперечної ободової кишки.", "Діафрагма, печінка, селезінка, серце."], "a": [2], "e": ["Головка підшлункової залози лежить праворуч.", "Печінка і жовчний міхур лежать праворуч.", "Ліворуч від шлунка розташовані селезінка і хвіст підшлункової залози.", "Поперечна ободова кишка лежить знизу.", "Серце лежить вище діафрагми."]}, {"n": "23.28", "q": "Чоловіка 55 років госпіталізовано у лікарню із перфорацією передньої стінки шлунка на тлі виразкової хвороби, сильним болем. Під час проведення лапароскопії в черевній порожнині виявлено вільний газ і ексудат. Лікар пояснює, що «кинжальний» біль на тлі розриву стінки шлунка пояснюється тим, що відбулося подразнення очеревини. Як шлунок іззовні покритий очеревиною?", "o": ["Інтраперитонеально.", "Екстраперитонеально.", "Мезоперитонеально.", "Не покритий.", "Ретроперитонеально."], "a": [0], "e": ["Шлунок вкритий очеревиною з усіх боків — інтраперитонеально.", "Екстраперитонеально лежать, наприклад, нирки.", "Мезоперитонеально — печінка, висхідна і низхідна ободові кишки.", "Шлунок покритий очеревиною.", "Ретроперитонеально — дванадцятипала кишка, підшлункова залоза."]}, {"n": "23.29", "q": "До гастроентерологічного відділення лікарні звернувся 45-річний чоловік зі скаргами на часті епізоди блювання, особливо після прийому їжі. Під час проведення ендоскопії лікар виявив звуження частини шлунка через рубцеві зміни на тлі виразкової хвороби. Лікар пояснює, що саме в цій ділянці шлунка мʼязовий шар добре розвинений, що сприяє утворенню потужного мʼяза-замикача. У якій частині шлунка найкраще розвинений коловий шар мʼязової оболонки?", "o": ["Pars pylorica.", "Pars cardiaca.", "Fundus gastris.", "Corpus gastris.", "Curvatura major gastris."], "a": [0], "e": ["У воротарній частині коловий шар утворює потужний м’яз-замикач воротаря.", "У кардіальній частині коловий шар розвинений, але сфінктер слабший.", "У дні шлунка м’язовий шар тонкий.", "У тілі коловий шар звичайної товщини.", "Велика кривина — край шлунка, не окрема частина."]}, {"n": "23.30", "q": "До лікаря звернувся 40-річний пацієнт зі скаргами на печію та дискомфорт у верхній частині живота. Під час проведення гастроскопії лікар описує, що слизова оболонка шлунка має характерні ділянки — шлункові поля, на поверхні яких візуалузуються шлункові ямочки з численними дрібними отворами. Через ці отвори виділяється секрет, необхідний для травлення. Що відкривається в шлункові ямочки?", "o": ["Протоки шлункових залоз.", "Протоки підшлункових залоз.", "Протоки тонкокишкових залоз.", "Протоки стравохідних залоз.", "Протоки ендокринних залоз."], "a": [0], "e": ["У шлункові ямочки відкриваються протоки власних шлункових залоз.", "Підшлункова залоза відкривається в дванадцятипалу кишку.", "Тонкокишкові залози відкриваються в крипти кишки.", "Стравохідні залози відкриваються в стравохід.", "Ендокринні залози проток не мають."]}], "models": [["Травний тракт", "sf:8c4c69035f4f4773813533d7ca56e516", {"ru": "Пищеварительный тракт", "en": "Gastrointestinal tract"}], ["Шлунок пошарово", "sf:38fa0f0ce4cd466e9b21b40a43a5a967", {"ru": "Желудок послойно", "en": "Stomach in layers"}], ["Глотка і дно ротової порожнини", "sf:b262c70bf9bd49c2a5428581b754f24b", {"ru": "Глотка и дно полости рта", "en": "Pharynx and floor of the mouth"}]]}, {"id": "topic24", "title": "24. Тонка кишка. Товста кишка", "tr": {"ru": "24. Тонкая кишка. Толстая кишка", "en": "24. Small intestine. Large intestine"}, "questions": [{"n": "24.1", "q": "У чоловіка 27 років під час операції на дистальному відрізку клубової кишки, на відстані 70 см від сліпої кишки, виявлено сліпе випинання її стінки довжиною 5 см – дивертикул клубової кишки (divtrticuluv intestinslae ilei), або дивертикул Меккеля. Залишком якої онтогенетичної структури є дивертикул Меккеля?", "o": ["Пупково-кишкової протоки, або жовткової протоки.", "Анальної перетинки.", "Загальної брижі клубової і сліпої кишки.", "Зябрових кишень.", "Сечової протоки."], "a": [0], "e": ["Дивертикул Меккеля — залишок незарощеної жовткової (пупково-кишкової) протоки.", "Залишок анальної перетинки дає атрезію відхідника.", "Загальна брижа — варіант фіксації кишки, а не дивертикул.", "Зяброві кишені дають органи голови і шиї.", "Залишок сечової протоки (урахуса) пов’язаний із сечовим міхуром."]}, {"n": "24.2", "q": "Жінки 40 років звернулася до лікаря зі скаргами на постійний біль в черевній прожнині, блювоту, часті позиви на дефекацію, втрату ваги, прояви зниження імунного статусу. Під час проведення ендоскопічного обстеження лікар виявив значні патологічні зміни слизової оболонки тонкої кишки, особливо залоз Ліберкюна. Лікар запідозрив ушкодження тих із п'яти клітин, що вистеляють кишкові крипти, які продукують дефензини (біологічні активні речовини). Ці клітини захищають організм від інфекції, регулюючи нормальну мікрофлору в тонкій кишці. Ураження яких клітин запідозрив лікар?", "o": ["Стовпчастих епітеліоцитів з посмугованою облямівкою.", "Келихоподібних клітин.", "Ендокриноцитів.", "Стовпчастих епітеліоцитів без облямівки.", "Епітеліоцитів з ацидофільною зернистістю (клітин Пенета)."], "a": [4], "e": ["Стовпчасті епітеліоцити з облямівкою всмоктують поживні речовини.", "Келихоподібні клітини виділяють слиз.", "Ендокриноцити виділяють гормони.", "Клітини без облямівки — камбіальні, для оновлення епітелію.", "Клітини Панета (з ацидофільною зернистістю) на дні крипт виробляють дефензини і лізоцим."]}, {"n": "24.3", "q": "Після лапаротомії за Волковичем-Дьяконовим (розріз у правій пахвинній ділянці) в операційній рані хірург не виявив червоподібного відростка. Який анатомічний орієнтир відповідає основі червоподібного відростка?", "o": ["Місце сходження стрічок ободової кишки.", "Брижова стрічка ободової кишки.", "Чепцеві привіски.", "Клубовий сосочок.", "Чепцева стрічка."], "a": [0], "e": ["Основа червоподібного відростка лежить там, де сходяться три стрічки ободової кишки.", "Брижова стрічка — лише одна з трьох стрічок.", "Чепцеві привіски є на ободовій кишці, але не вказують на відросток.", "Клубовий сосочок лежить на межі клубової і сліпої кишок, вище відростка.", "Чепцева стрічка — одна з трьох; орієнтир — їх сходження."]}, {"n": "24.4", "q": "До приймального відділення звернувся чоловік із скаргами на біль у правій пахвинній ділянці живота, нудоту та підвищення температури. Лікар запідозрив гострий аппендицит. Під час пальпації живота відзначається локальна болючість у точці МакБерні (Mc Burney), куди проєктується основа червоподібного відростка. Як лікар визначив точку МакБерні на передній черевній стінці?", "o": ["На межі між зовнішньою і середньою третинами лінії, що з'єднує праву верхню передню клубову ость і пупок.", "На межі між середньою і внутрішньою третинами лінії, що з'єднує праву верхню передню клубову ость і пупок", "На межі середини лінії, що з'єднує праву верхню передню клубову ость і пупок", "На межі між зовнішньою і середньою третинами лінії, що з'єднує праву і ліву верхні передні клубові ості.", "На межі між середньою і внутрішньою третинами лінії, що з'єднує праву і ліву верхні передні клубові ості."], "a": [0], "e": ["Точка Мак-Бернея: межа зовнішньої і середньої третин лінії від правої верхньої передньої клубової ості до пупка.", "Межа середньої і внутрішньої третин цієї лінії не є точкою Мак-Бернея.", "Середина лінії до пупка не є класичною точкою.", "Межа зовнішньої і середньої третин міжостьової лінії — точка Ланца.", "Межа середньої і внутрішньої третин міжостьової лінії не має назви."]}, {"n": "24.5", "q": "До приймального відділення звернувся чоловік із скаргами на біль у правій пахвинній ділянці живота, нудоту та підвищення температури. Лікар запідозрив гострий аппендицит. Під час пальпації живота відзначається локальна болючість у точці Ланца, куди найчастіше проєктується основа червоподібного відростка. Як лікар визначив точку Ланца на передній черевній стінці?", "o": ["На межі між зовнішньою і середньою третинами лінії, що з'єднує праву верхню передню клубову ость і пупок.", "На межі між середньою і внутрішньою третинами лінії, що з'єднує праву верхню передню клубову ость і пупок", "На межі середини лінії, що з'єднує праву верхню передню клубову ость і пупок", "На межі між зовнішньою і середньою третинами лінії, що з'єднує праву і ліву верхні передні клубові ості.", "На межі між середньою і внутрішньою третинами лінії, що з'єднує праву і ліву верхні передні клубові ості."], "a": [3], "e": ["Межа зовнішньої і середньої третин остьово-пупкової лінії — точка Мак-Бернея.", "Ця точка не є точкою Ланца.", "Середина остьово-пупкової лінії не є точкою Ланца.", "Точка Ланца — межа правої (зовнішньої) і середньої третин лінії між верхніми передніми клубовими остями.", "Ліва частина міжостьової лінії не відповідає точці Ланца."]}, {"n": "24.6", "q": "Під час апендектомії у чоловіка 35 років виявлено найбільш важкодоступне ретроцекальне (позаду сліпої кишки) положення червоподібного відростка. Який відсоток випадків такого положення червоподібного відростка існує згідно статистики?", "o": ["10–13 %.", "17–20 %.", "21–25 %.", "40–45 %.", "60 %."], "a": [0], "e": ["Висхідне (ретроцекальне) положення відростка трапляється приблизно в 10–13 % випадків.", "17–20 % — присереднє положення.", "21–25 % — бічне положення.", "40–45 % — низхідне положення.", "60 % — не відповідає жодному варіанту."]}, {"n": "24.7", "q": "Під час апендектомії виявлено низхідне положення червоподібного відростка. Який відсоток випадків такого положення червоподібного відростка існує згідно статистики?", "o": ["4–5 %.", "11–13 %.", "17–20 %.", "25 %.", "40–45 %."], "a": [4], "e": ["4–5 % — рідкісні варіанти.", "11–13 % — висхідне положення.", "17–20 % — присереднє.", "25 % — бічне.", "Низхідне положення найчастіше — 40–45 %."]}, {"n": "24.8", "q": "До лікаря-проктолога звернулася жінка 57 років з скаргами на біль у ділянці відхідника під час дефекації, виділення крові з ануса. Після проведеного обстеження було діагностовано розширення та запалення вен в цій ділянці (геморой). Яка частина товстої кишки уражена запальним процесом?", "o": ["Сигмоподібна ободова кишка.", "Поперечна ободова кишка.", "Висхідна ободова кишка.", "Низхідна ободова кишка.", "Пряма кишка."], "a": [4], "e": ["Сигмоподібна кишка лежить вище і гемороїдальних вен не має.", "Поперечна ободова кишка лежить у верхньому поверсі живота.", "Висхідна ободова кишка лежить праворуч у животі.", "Низхідна ободова кишка лежить ліворуч у животі.", "Геморой — розширення вен відхідникового каналу прямої кишки."]}, {"n": "24.9", "q": "Лікар обстежує чоловіка 60 років зі скаргами на біль з локалізацією у правій бічній ділянці живота. Пальпаторно визначається нерухомий, щільний, пухлиноподібний утвір в кишці, яка проєктується на праву бічну ділянку живота. Яка частина товстої кишки імовірно уражена пухлиною?", "o": ["Низхідна ободова кишка.", "Висхідна ободова кишка.", "Сліпа кишка.", "Поперечна ободова кишка.", "Сигмоподібна ободова кишка."], "a": [1], "e": ["Низхідна ободова кишка проєктується ліворуч.", "Висхідна ободова кишка проєктується на праву бічну ділянку живота і фіксована (мезоперитонеально).", "Сліпа кишка проєктується на праву пахвинну ділянку.", "Поперечна ободова кишка проєктується на пупкову ділянку.", "Сигмоподібна кишка проєктується на ліву пахвинну ділянку."]}, {"n": "24.10", "q": "Лікар обстежує чоловіка 57 років зі скаргами на біль у поперековій ділянці з іррадіацією вниз живота. На МРТ лікар виявив збільшення розмірів лівої нирки на тлі порушення відтоку сечі у сечовід, стінку якого стискає пухлина товстої кишки. Яка частина товстої кишки здавлює стінку сечоводу?", "o": ["Поперечна ободова кишка.", "Сигмоподібна ободова кишка.", "Низхідна ободова кишка.", "Сліпа кишка.", "Висхідна ободова кишка."], "a": [1], "e": ["Поперечна ободова кишка лежить вище.", "Корінь брижі сигмоподібної кишки перехрещує лівий сечовід біля входу в малий таз, тому пухлина може його стискати.", "Низхідна ободова кишка лежить латеральніше сечоводу.", "Сліпа кишка лежить праворуч.", "Висхідна ободова кишка лежить праворуч."]}, {"n": "24.11", "q": "Лікар, обстежуючи дитину 12 років, під час проведення колонографії виявив незарощеним дивертикул Меккеля (diverticulum ileale patens) з утворенням пупкової нориці (fistula umdilicalis). Було призначено операцію. Яку кишку сполучає з пупком жовткова (пупкова) нориця?", "o": ["Висхідну ободову кишку.", "Низхідну ободову кишку.", "Порожню кишку.", "Клубову кишку.", "Сліпу кишку."], "a": [3], "e": ["Висхідна ободова кишка з жовтковою протокою не пов’язана.", "Низхідна ободова кишка з пупком не пов’язана.", "Жовткова протока пов’язана з дистальним відділом клубової, а не порожньої кишки.", "Жовткова нориця сполучає клубову кишку з пупком.", "Сліпа кишка не пов’язана з жовтковою протокою."]}, {"n": "24.12", "q": "До лікарні доставлено чоловіка 65 років з пухлиною у нижній третині прямої кишки, а саме − у стінці відхідникового каналу. Як вкривається очеревиною дана ділянка прямої кишки?", "o": ["Інтраперитонеально.", "Мезоперитонеально.", "Екстраперитонеально.", "Поза очеревиною.", "В залежності від фізіологічного стану органа."], "a": [2], "e": ["Інтраперитонеально лежить лише верхня частина прямої кишки.", "Мезоперитонеально — середня частина.", "Нижня частина прямої кишки (відхідниковий канал) лежить екстраперитонеально.", "Цей варіант означає те саме, але правильний термін — екстраперитонеально.", "Покриття очеревиною від фізіологічного стану не залежить."]}, {"n": "24.13", "q": "Обстежуючи секційний матеріал, патологоанатом помітив на внутрішній поверхні одного із відрізків кишки folliculi lymphatici aggregati (бляшки Пеєра). Якій кишці належить цей відрізок?", "o": ["Ileum.", "Jejunum.", "Colon descendens.", "Colon ascendens.", "Duodenum."], "a": [0], "e": ["Скупчені лімфоїдні вузлики (бляшки Пеєра) характерні для клубової кишки.", "У порожній кишці переважають поодинокі вузлики.", "У низхідній ободовій кишці бляшок Пеєра немає.", "У висхідній ободовій кишці бляшок Пеєра немає.", "У дванадцятипалій кишці бляшок Пеєра немає."]}, {"n": "24.14", "q": "Під час оперативного втручання з приводу резекції тонкої кишки хірург визначає анатомічні орієнтири для мобілізації дванадцятипало-порожньокишкового згину. Це важливо для запобігання ушкодження структури, що фіксує його до діафрагми, адже це забезпечує стабільність положення кишки. Чим фіксується дванадцятипало-порожньокишковий згин до задньої стінки черевної порожнини?", "o": ["Ligamentum suspensorium duodeni (Трейца).", "Plica duodenojejunalis.", "Plica duodenomesocolica", "Брижею порожньої кишки.", "Круглою зв’язкою печінки."], "a": [0], "e": ["Дванадцятипало-порожньокишковий згин фіксує підвішувальна зв’язка (м’яз Трейтца).", "Дванадцятипало-порожньокишкова складка лише обмежує заглибину біля згину.", "Ця складка лежить між кишкою і брижею ободової кишки.", "Брижа порожньої кишки починається нижче.", "Кругла зв’язка печінки лежить у серпоподібній зв’язці."]}, {"n": "24.15", "q": "Пацієнт із жовтяницею та болем у надчеревній ділянці живота проходить КТ-обстеження для уточнення причини обструкції жовчних шляхів. Радіолог звертає увагу на анатомічні орієнтири, щоб оцінити положення верхнього згину дванадцятипалої кишки. Яка скелетотопія верхнього згину дванадцятипалої кишки?", "o": ["L1.", "L2.", "L3.", "L4.", "L5."], "a": [0], "e": ["Верхній згин дванадцятипалої кишки лежить на рівні I поперекового хребця.", "На рівні L2 лежить низхідна частина.", "На рівні L3 лежить нижній згин.", "L4 — надто низько.", "L5 — надто низько."]}, {"n": "24.16", "q": "До гастроентеролога звернувся 52-річний чоловік зі скаргами на періодичний біль у верхній частині живота, жовтяницю та потемніння сечі. Під час лабораторного обстеження виявлено підвищення рівня білірубіну та ферментів печінки. Лікар запідозрив обструкцію жовчних шляхів і призначив ендоскопічне обстеження великого сосочка дванадцятипалої кишки (сосочка Фатера), через який відкриваються спільна жовчна протока та протока підшлункової залози. У який відділ дванадцятипалої кишки необхідно ввести фіброгастроскоп, щоб оглянути великий сосочок дванадцятипалої кишки?", "o": ["Низхідну частину дванадцятипалої кишки.", "D. В дванадцятипало-порожньокишковий згин дванадцятипалої кишки.", "Горизонтальну частину дванадцятипалої кишки.", "Верхню частину дванадцятипалої кишки.", "Висхідну частину дванадцятипалої кишки."], "a": [0], "e": ["Великий сосочок дванадцятипалої кишки лежить на присередній стінці низхідної частини.", "Дванадцятипало-порожньокишковий згин лежить далі, сосочка там немає.", "У горизонтальній частині великого сосочка немає.", "У верхній частині великого сосочка немає.", "У висхідній частині сосочка немає."]}, {"n": "24.17", "q": "До гастроентеролога звернувся 48-річний чоловік зі скаргами на періодичний біль у верхній частині живота, нудоту та блювання після прийому їжі. Під час ендоскопічного дослідження виявлено звуження на межі між шлунком і дванадцятипалою кишкою, що ускладнює проходження харчової маси. Патологічний процес локалізований в ділянці анатомічного утвору, який регулює перехід вмісту зі шлунка в тонку кишку. Який анатомічний утвір знаходиться на межі між шлунком і дванадцятипалою кишкою?", "o": ["Заслінка воротаря.", "Кутова вирізка.", "Мʼяз-замикач воротаря.", "Велика кривина.", "Мала кривина."], "a": [2], "e": ["Заслінка воротаря — складка слизової, а регулює прохід м’яз.", "Кутова вирізка лежить на малій кривині.", "На межі шлунка і дванадцятипалої кишки лежить м’яз-замикач воротаря, що регулює перехід вмісту.", "Велика кривина — край шлунка.", "Мала кривина — край шлунка."]}, {"n": "24.18", "q": "У хірургічне відділення лікарні доставлено 35-річного чоловіка з гострим болем у животі, нудотою та блюванням. Під час пальпації – живіт здутий, перистальтика ослаблена. На КТ виявлено ознаки кишкової непрохідності в ділянці тонкої кишки, яка має довгу брижу та високу рухливість. Лікар пояснив, що такі відділи тонкої кишки найбільш схильні до заворотів і непрохідності. Вкажіть брижові частини тонкої кишки:", "o": ["Jejunum, ileum.", "Jejunum.", "Ileum.", "Duodenum, ileum.", "Duodenum, jejunum."], "a": [0], "e": ["Брижові частини тонкої кишки — порожня і клубова кишки.", "Неповна відповідь — клубова теж брижова.", "Неповна відповідь — порожня теж брижова.", "Дванадцятипала кишка брижі не має.", "Дванадцятипала кишка брижі не має."]}, {"n": "24.19", "q": "До гастроентеролога звернувся 60-річний чоловік зі скаргами на періодичний біль у животі та закреп. Під час проведення колоноскопії важливо оглянути структури, що допомагають відрізнити ободову кишку від інших відділів травного тракту. Які анатомічні утвори характеризують ободову кишку?", "o": ["Мʼязові стрічки, випини, чепцеві підвіски.", "Мʼязові стрічки, випини, кишкові підвіски", "Сполучнотканинні стрічки, випини, чепцевіпідвіски.", "Сполучнотканинні стрічки, кишкові ворсинки, чепцеві підвіски", "Мʼязові стрічки, поодинокі лімфоїдні вузлики, чепцевіпідвіски."], "a": [0], "e": ["Ободову кишку вирізняють м’язові стрічки, випини (гаустри) і чепцеві привіски.", "Кишкових підвісок немає, правильно — чепцеві привіски.", "Стрічки утворені поздовжнім м’язовим шаром, не сполучною тканиною.", "Ворсинок у товстій кишці немає.", "Поодинокі лімфоїдні вузлики є і в тонкій кишці."]}, {"n": "24.20", "q": "До хірурга звернувся 55-річний чоловік з болем у правій половині живота. Під час комп'ютерно-томографічного обстеження виявлено заворот сигмоподібної ободової кишки. Під час операції лікар орієнтується на стрічки ободової кишки, що проходять уздовж поверхні кишки та слугують орієнтиром для знаходження судин і брижі. Які назви стрічок має ободова кишка залежно від їхнього положення?", "o": ["Чепцева, брижова, вільна.", "Шлункова, брижова, вільна.", "Чепцева, тонкокишкова, вільна.", "Чепцева, брижова, товстокишкова.", "Ободова, брижова, вільна."], "a": [0], "e": ["Стрічки ободової кишки: чепцева, брижова і вільна.", "Шлункової стрічки немає.", "Тонкокишкової стрічки немає.", "Товстокишкової стрічки немає.", "Ободової стрічки як окремої назви немає."]}, {"n": "24.21", "q": "До хірургічного відділення доставили 28-річного пацієнта з різким болем у нижній частині живота, нудотою та підвищенням температури. Під час огляду виявлено симптоми «гострого живота». УЗД та КТ виявило запалення дивертикула клубової кишки, що може імітувати апендицит. Лікар прийняв рішення про термінове оперативне втручання для підтвердження діагнозу та видалення патологічного утвору. Ревізію якої ділянки кишки необхідно зробити для виявлення дивертикула Меккеля?", "o": ["Клубової кишки на відстані 40–70 см від сліпої кишки.", "Висхідної ободової кишки.", "Низхідної ободової кишки.", "50 см порожньої кишки від підвішувальної зв’язки дванадцятипалої кишки (звʼязки Трейтца).", "За два метри до кінця клубової кишки."], "a": [0], "e": ["Дивертикул Меккеля шукають на клубовій кишці на відстані 40–70 см від сліпої кишки.", "На висхідній ободовій кишці його немає.", "На низхідній ободовій кишці його немає.", "На порожній кишці дивертикула Меккеля немає.", "2 метри від кінця клубової кишки — надто далеко."]}, {"n": "24.22", "q": "До рентгенологічного кабінету направили 62-річного чоловіка зі скаргами на хронічний закреп та періодичний біль у животі. Лікар призначив ірігоскопію для оцінки стану товстої кишки. Під час дослідження контрастна речовина вводиться через відхідниковий отвір і поступово заповнює всі відділи товстої кишки, що дозволяє оцінити її форму, положення та наявність патологічних змін. В якій послідовності заповнюються частини товстої кишки контрастною речовиною?", "o": ["Пряма кишка, сигмоподібна, низхідна, поперечна, висхідна ободові кишки, сліпа кишка.", "Пряма кишка, поперечна і висхідна ободові кишки, сліпа кишка.", "Пряма кишка, низхідна і висхідна ободові кишки, сліпа кишка.", "Пряма кишка, низхідна, поперечна і висхідна ободові кишки, сліпа кишка.", "Низхідна, поперечна і висхідна ободові кишки."], "a": [0], "e": ["Контраст іде ретроградно: пряма, сигмоподібна, низхідна, а рівні IV міжребрового простору нормальна, а нижній край у нормі не виходить з-під ребрової дуги; виступ на 4 см означає збільшення печінки.", "Печінка не зменшена, а збільшена.", "Нижня межа зміщена донизу, а не догори.", "Верхня межа в нормі, змістилася нижня.", "Нижній край, що виступає на 4 см, не є нормою."]}, {"n": "25.2", "q": "Лікар-терапевт оглядає чоловіка 55 років, хворого на панкреатит. Під час УЗД у пацієнта виявлено некроз тіла підшлункової залози. На рівні якого хребця, куди проєктується тiло пiдшлункової залози, виявлено некроз?", "o": ["I–II поперековий хребець.", "II–III поперековий хребець.", "IІІ–IV поперековий хребець.", "IV–V грудний хребець.", "ХII грудний хребець."], "a": [0], "e": ["Тіло підшлункової залози проєктується на рівні I (I–II) поперекового хребця.", "II–III поперекові — рівень головки та нижнього згину кишки.", "III–IV — надто низько.", "IV–V грудні — рівень середостіння.", "XII грудний — надто високо (рівень хвоста)."]}, {"n": "25.3", "q": "Під час оперативного втручання з приводу жовчно-кам'яної хвороби у чоловіка 45 років хірург повинен знайти спільну жовчну протоку. Між листками якої очеревинної зв’язки розташована спільна жовчна протока?", "o": ["Печінково-шлункової.", "Печінково-ниркової.", "Круглої зв’язки печінки.", "Печінково-дванадцятипалокишкової зв’язки.", "Венозної зв’язки."], "a": [3], "e": ["У печінково-шлунковій зв’язці лежать шлункові судини.", "Печінково-ниркова зв’язка не містить жовчної протоки.", "Кругла зв’язка — облітерована пупкова вена.", "Спільна жовчна протока лежить у правому вільному краї печінково-дванадцятипалокишкової зв’язки.", "Венозна зв’язка — залишок венозної протоки."]}, {"n": "25.4", "q": "У хірургічне відділення госпіталізовано чоловіка 45 років з різаною раною у правій підребровій ділянці живота. Під час ургентної операції хірург виявив, що ножем була ушкоджена печiнково-дванадцятипалокишкова зв’язка. Що розміщено в печiнково-дванадцятипалоеишковій зв’язцi?", "o": ["Спільна жовчна протока, права шлункова артерія.", "Ворiтна печінкова вена, верхня брижова артерія, спільна жовчна протока.", "Власна печiнкова артерія, нижня порожниста вена.", "Ворiтна печінкова вена, загальна печiнкова артерія та її гілки, спільна жовчна протока.", "Верхня брижова артерія, власна печiнкова артерія, міхурова протока."], "a": [3], "e": ["Права шлункова артерія іде по малій кривині, а не в цій зв’язці як основний утвір.", "Верхня брижова артерія лежить нижче.", "Нижня порожниста вена лежить позаду, заочеревинно.", "У печінково-дванадцятипалокишковій зв’язці лежать ворітна вена, печінкова артерія з гілками і спільна жовчна протока.", "Верхня брижова артерія і міхурова протока тут не проходять."]}, {"n": "25.5", "q": "За даними лабораторного дослідження у чоловіка 45 років в протоці підшлункової залози знайдена жовч. Визначте послідовність шляхів, якими жовч з печінки потрапила в протоку підшлункової залози.", "o": ["Спільна жовчна протока, протока підшлункової залози, загальна печінкова протока, міхурова протока.", "Загальна печінкова протока, спільна жовчна протока, печінково-підшлункова ампула, протока підшлункової залози.", "Міхурова протока, спільна жовчна протока, протока підшлункової залози.", "Загальна печінкова протока, міхурова протока, протока підшлункової залози.", "Загальна печінкова протока, міхурова протока, печінково-підшлункова ампула, спільна жовчна протока."], "a": [1], "e": ["Порядок проток переплутаний.", "Жовч іде загальною печінковою протокою → спільною жовчною протокою → печінково-підшлунковою ампулою, звідки може затікати в протоку підшлункової залози.", "Міхурова протока несе жовч із міхура, а не з печінки безпосередньо.", "Міхурова протока не сполучається з протокою підшлункової залози.", "Ампула лежить після спільної жовчної протоки, а не перед нею."]}, {"n": "25.6", "q": "Під час хірургічного втручання на органах черевної порожнини хірург обстежив чепцевий отвір, який обмежений печінково-дваннадцятипалокишковою зв’язкою спереду і хвостатою часткою печінки згори. Яка анатомічна структура є нижньою стінкою цього отвору?", "o": ["Головка підшлункової залози.", "Ворота печінки.", "Жовчний міхур.", "Дванадцятипала кишка.", "Тіло підшлункової залози."], "a": [3], "e": ["Головка підшлункової залози лежить нижче.", "Ворота печінки лежать вище і спереду.", "Жовчний міхур лежить на нутрощевій поверхні печінки.", "Нижньою стінкою чепцевого отвору є верхня частина дванадцятипалої кишки.", "Тіло підшлункової залози лежить ліворуч."]}, {"n": "25.7", "q": "Під час анатомічного розтину виявлено, що жовчний міхур розташований у ямці на нутрощевій поверхні печінки. Яка анатомічна структура відокремлює жовчний міхур від лівої частки печінки?", "o": ["Квадратна частка печінки.", "Хвостата частка печінки.", "Венозна зв’язка печінки.", "Ворота печінки.", "Кругла зв’язка печінки."], "a": [0], "e": ["Квадратна частка лежить між ямкою жовчного міхура і щілиною круглої зв’язки, тому відокремлює міхур від лівої частки.", "Хвостата частка лежить позаду воріт.", "Венозна зв’язка лежить позаду, у її щілині.", "Ворота печінки лежать поперечно.", "Кругла зв’язка є межею лівої частки, але між нею і міхуром лежить квадратна частка."]}, {"n": "25.8", "q": "Під час операції на підшлунковій залозі хірург оглянув орган, що оточує її головку знизу, справа та згори. Який орган оглянув хірург?", "o": ["Дванадцятипалу кишку.", "Поперечну ободову кишку.", "Шлунок.", "Селезінку.", "Нирку."], "a": [0], "e": ["Дванадцятипала кишка підковою охоплює головку підшлункової залози зверху, справа і знизу.", "Поперечна ободова кишка лежить нижче, з брижею спереду.", "Шлунок лежить спереду від залози.", "Селезінка лежить біля хвоста.", "Нирка лежить позаду."]}, {"n": "25.9", "q": "У чоловіка 40 років під час операції на печінці хірург обстежив ту її зв’язку, яка утворилась після народження на місці облітерованої пупкової вени. Яку зв’язку обстежив хірург?", "o": ["Круглу зв’язку печінки.", "Венозну зв’язку.", "Серпоподібну зв’язку.", "Вінцеву зв’язку.", "Печінково-ниркову зв’язку."], "a": [0], "e": ["Кругла зв’язка печінки — облітерована пупкова вена.", "Венозна зв’язка — облітерована венозна протока.", "Серпоподібна зв’язка — дублікатура очеревини.", "Вінцева зв’язка — перехід очеревини з діафрагми на печінку.", "Печінково-ниркова зв’язка — перехід очеревини на нирку."]}, {"n": "25.10", "q": "Лікар пальпує у жінки 43 років нижній край печінки. На якому рівні у здорової людини розташована нижня границя печінки по правій середньоключичній лінії?", "o": ["По краю ребрової дуги.", "На 4 см нижче краю ребрової дуги.", "На 4 см вище краю ребрової дуги.", "На 2 см нижче краю ребрової дуги.", "На 3 см нижче краю ребрової дуги."], "a": [0], "e": ["У здорової людини нижній край печінки по правій середньоключичній лінії збігається з краєм ребрової дуги.", "4 см нижче — ознака збільшення печінки.", "Вище ребрової дуги нижній край не розташований.", "2 см нижче — збільшення.", "3 см нижче — збільшення."]}, {"n": "25.11", "q": "Під час операції на підшлунковій залозі хірург виявив ураження додаткової протоки підшлункової залози в місці її впадіння в дванадцятипалу кишку. Як називається додаткова протока підшлункової залози?", "o": ["Ductus pancreaticus major (Wirsungi).", "Ductus pancreaticus accessorius (Santorini).", "Ductus choledochus.", "Ductus hepaticus communis.", "Ductus cysticus."], "a": [1], "e": ["Головна (Вірсунгова) протока відкривається на великому сосочку.", "Додаткова протока підшлункової залози — Санторінієва.", "Спільна жовчна протока несе жовч.", "Загальна печінкова протока — частина жовчних шляхів.", "Міхурова протока — протока жовчного міхура."]}, {"n": "25.12", "q": "У жінки 50 років з пухлиною підшлункової залози розвинулась механічна жовтяниця внаслідок здавлення тієї протоки, що утворилася шляхом злиття загальної печінкової протоки і міхурової протоки. Яка жовчна протока здавлена пухлиною?", "o": ["Ductus choledochus.", "Ductus hepaticus communis.", "Ductus cysticus.", "Ductus hepaticus dexter.", "Ductus hepaticus sinister."], "a": [0], "e": ["Спільна жовчна протока утворюється злиттям загальної печінкової і міхурової проток.", "Загальна печінкова протока утворена правою і лівою печінковими.", "Міхурова протока — одна з тих, що зливаються.", "Права печінкова протока лежить вище.", "Ліва печінкова протока лежить вище."]}, {"n": "25.13", "q": "Під час анатомічного розтину виявлено, що головна протока підшлункової залози (Вірсунгова протока) перед впадінням у дванадцятипалу кишку зливається із спільною жовчною протокою. Який анатомічний утвір утворюється в місці їх злиття?", "o": ["Печінково-підшлункова ампула.", "Міхурова протока.", "Спільна печінкова протока.", "Права печінкова протока.", "Ліва печінкова протока."], "a": [0], "e": ["Злиття протоки підшлункової залози і спільної жовчної протоки утворює печінково-підшлункову ампулу.", "Міхурова протока відходить від жовчного міхура.", "Спільна печінкова протока лежить вище.", "Права печінкова протока лежить у печінці.", "Ліва печінкова протока лежить у печінці."]}, {"n": "25.14", "q": "У жінки 40 років на тлі жовчнокам’яної хвороби розвинулась механічна жовтяниця. Під час обстеження у пацієнтки виявлено, що камінь знаходиться в загальній печінковій протоці. Які жовчні протоки утворюють загальну печінкову протоку?", "o": ["Ductus hepaticus communis et ductus cysticus.", "Ductus hepaticus dexter et sinister.", "Ductus hepaticus dexter et ductus cysticus.", "Ductus hepaticas sinister et ductus cysticus.", "Ductus hepaticus communis et ductus choledochus."], "a": [1], "e": ["Ці протоки зливаються у спільну жовчну протоку.", "Загальну печінкову протоку утворюють права і ліва печінкові протоки.", "Міхурова протока до загальної печінкової не входить.", "Міхурова протока до загальної печінкової не входить.", "Спільна жовчна протока лежить нижче."]}, {"n": "25.15", "q": "У чоловіка 49 років на тлі жовчнокам’яної хвороби розвинулась механічна жовтяниця. Під час обстеження встановлено, що камінь знаходиться в спільній жовчній протоці. Які жовчні протоки утворюють спільну жовчну протоку?", "o": ["Ductus hepaticus communis et ductus cysticus.", "Ductus hepaticus dexter et sinister.", "Ductus hepaticus dexter et ductus cysticus.", "Ductus hepaticas sinister et ductus cysticus.", "Ductus hepaticus communis et ductus choledochus."], "a": [0], "e": ["Спільну жовчну протоку утворюють загальна печінкова і міхурова протоки.", "Права і ліва печінкові протоки утворюють загальну печінкову.", "Права печінкова протока лежить вище.", "Ліва печінкова протока лежить вище.", "Спільна жовчна протока сама себе не утворює."]}, {"n": "25.16", "q": "У чоловіка 55 років, хворого на гепатит, процес в печінці супроводжується збільшенням її об’єму й розтягненням волокнистої капсули та серозної оболонки, що вкриває орган. Пальпаторно виявлено посилення болю у хворого при натисканні на пупок. Подразнення якої очеревинної зв'язки печінки при натисканні на пупкову ділянку живота забезпечує виникнення цього симптому?", "o": ["Ligamentum teres hepatis.", "Ligamentum triangulare dextrum.", "Ligamentum venosum.", "Ligamentum falciforme.", "Ligamentum coronarium."], "a": [0], "e": ["Кругла зв’язка печінки йде від пупка до печінки, тому тиск на пупок натягує її і посилює біль.", "Права трикутна зв’язка фіксує праву частку до діафрагми.", "Венозна зв’язка лежить на нутрощевій поверхні.", "Серпоподібна зв’язка йде до діафрагми і передньої стінки, а пупку відповідає її вільний край — кругла зв’язка.", "Вінцева зв’язка лежить на діафрагмовій поверхні."]}, {"n": "25.17", "q": "У чоловіка 34 років під час МРТ-обстеження діагностовано гепатит /запалення печінки/. Хвороба супроводжується збільшенням об'єму печінки, що призводить до розтягнення фіброзної капсули та серозної оболонки, що вкриває орган. Як очеревина вкриває печінку?", "o": ["Інтраперитонеально.", "Ретроперитонеально.", "Мезоперитонеально.", "Екстраперитонеально.", "Не вкриває взагалі."], "a": [2], "e": ["Печінка має ділянку без очеревини, тому не інтраперитонеальна.", "Печінка не лежить заочеревинно.", "Печінка вкрита очеревиною з трьох боків — мезоперитонеально (без голої ділянки).", "Екстраперитонеально лежать органи поза очеревиною.", "Очеревина вкриває більшу частину печінки."]}, {"n": "25.18", "q": "Жінку 40 років госпіталізовано в лікарню зі скаргами на біль оперізуючого характеру в надчеревній ділянці живота, що виникає після прийому гострої, жирної та смаженої їжі. Лікар підозрює у хворої запалення паренхіми підшлункової залози. Під час проведення додаткових методів дослідження (УЗД, МРТ) лікар враховує проєкцію підшлункової залози на ділянки живота. На які ділянці живота проєктується підшлункова залоза?", "o": ["Надчеревну і ліву підреброву ділянки.", "Надчеревну і праву підреброву ділянку.", "Ліву бічну і ліву підреброву ділянки.", "Пупкову і праву підреброву ділянки.", "Праву бічну і ліву бічну ділянки."], "a": [0], "e": ["Підшлункова залоза проєктується на надчеревну і ліву підреброву ділянки.", "Головка частково праворуч, але основна проєкція ліва.", "Ліва бічна ділянка — нижче.", "Пупкова ділянка — нижче.", "Бічні ділянки — нижче."]}, {"n": "25.19", "q": "У чоловіка 60 років на тлі злоякісної пухлини дванадцятипалої кишки у ділянці великого сосочка виникла обтураційна жовтяниця. Просвіт якої анатомічної структури стискає пухлина?", "o": ["Печінково-підшлункової ампули.", "Протоки підшлункової залози.", "Загальної печінкової протоки.", "Правої печінкової протоки.", "Лівої печінкової протоки."], "a": [0], "e": ["У великому сосочку відкривається печінково-підшлункова ампула — пухлина стискає її.", "Протока підшлункової залози впадає в ампулу, але жовтяниця через закриття ампули.", "Загальна печінкова протока лежить вище.", "Права печінкова протока лежить у печінці.", "Ліва печінкова протока лежить у печінці."]}, {"n": "25.20", "q": "Визначення розмірів печінки у чоловіка 34 років дало змогу встановити, що верхня її межа розміщена по правій пригруднинній лінії на рівні IV міжребрового простору; нижній її край проєктується спочатку вздовж правої ребрової дуги до місця зрощення IX і X ребрових хрящів, а далі – в надчеревній ділянці на середині відстані між мечоподібним відростком і пупком. Як оцінити розміри печінки?", "o": ["Печінка збільшена – нижня її межа зміщена донизу.", "Печінка зменшена – нижня її межа зміщена донизу.", "Печінка зменшена – нижня її межа зміщена догори.", "Печінка збільшена – верхня її межа зміщена догори.", "Розміри печінки в нормі."], "a": [4], "e": ["Описані межі нормальні.", "Печінка не зменшена.", "Печінка не зменшена.", "Верхня межа нормальна.", "Верхня межа на рівні IV міжребрового простору і нижній край посередині між мечоподібним відростком і пупком — норма."]}, {"n": "25.21", "q": "У чоловіка 45 років під час МРТ-обстеження виявлено наявність каменів у жовчних шляхах з локалізацією у спільній жовчній протоці. Під час оперативного втручання хірург виділяє спільну жовчну протоку між листками очеревинної зв'язки. Між листками якої звʼязки розташована спільна жовчна протока (ductus biliaris)?", "o": ["Венозної звʼязки.", "Печінково-дванадцятипалокишкової звʼязки.", "Круглої звʼязки печінки.", "Печінково-ниркової звʼязки.", "Печінково-шлункової звʼязки."], "a": [1], "e": ["Венозна зв’язка — залишок венозної протоки.", "Спільна жовчна протока лежить у печінково-дванадцятипалокишковій зв’язці.", "Кругла зв’язка — залишок пупкової вени.", "Печінково-ниркова зв’язка не містить протоки.", "У печінково-шлунковій зв’язці лежать шлункові судини."]}, {"n": "25.22", "q": "У лікарню госпіталізовано чоловіка 45 років з підозрою на рак головки підшлункової залози. В якій послідовності під час ультразвукового дослідження лікар має ретельно оглянути частини підшлункової залози?", "o": ["Головку, шийку, тіло, хвіст.", "Тіло, шийку, хвіст.", "Головку, шийку, хвіст.", "Тіло, головку, шийку.", "Головку. хвіст, хвостату частку."], "a": [0], "e": ["Підшлункову залозу оглядають від головки через шийку і тіло до хвоста.", "Пропущено головку.", "Пропущено тіло.", "Пропущено хвіст і порушено порядок.", "Хвостата частка належить печінці."]}, {"n": "25.23", "q": "У хірургічне відділення лікарні госпіталізовано чоловіка 45 років у важкому стані з колотою раною у правій підребровій ділянці живота і ознаками внутрішньочеревної кровотечі. З метою тимчасової зупинки кровотечі лікар наклав мʼякий затискач на печінково-дванадцятипалокишкову зв’язку ближче до дванадцятипалої кишки. Які утвори проходять у товщі цієї зв’язки?", "o": ["Черевний стовбур, права печінкова артерія, лімфатичні судини, нерви, лімфатичні вузли.", "Права і ліва печінкові артерії, лімфатичні судини, спільна жовчна протока, нерви, лімфатичні вузли.", "Загальна печінкова артерія, ворітна печінкова вена, спільна жовчна протока, нерви. лімфатичні судини.", "Загальна печінкова артерія, печінкові вени, спільна жовчна протока, нерви. лімфатичні судини.", "Загальна печінкова протока і ворітна печінкова вена, нерви, лімфатичні вузли."], "a": [2], "e": ["Черевний стовбур відходить від аорти, у зв’язку не входить.", "Права і ліва печінкові артерії відходять уже біля воріт печінки.", "У печінково-дванадцятипалокишковій зв’язці — печінкова артерія, ворітна вена, спільна жовчна протока, нерви і лімфатичні судини.", "Печінкові вени впадають у нижню порожнисту вену поза зв’язкою.", "Загальна печінкова протока лежить вище, у воротах."]}, {"n": "25.24", "q": "Чоловік 45 років страждає на цироз печінки з портальною гіпертензію. Хірург, готуючись до хірургічного втручання, орієнтується на морфофункціональний принцип поділу печінки, адже це важливо для визначення меж резекції та збереження життєздатних сегментів. Скільки частин, відділів і сегментів має печінка?", "o": ["4 частини, 6 відділів, 8 сегментів.", "2 частини, 5 відділів, 8 сегментів.", "2 частини, 4 відділи, 4 сегменти.", "2 частини, 2 відділи, 4 сегменти.", "4 частини, 2 відділи, 8 сегментів."], "a": [1], "e": ["Частин дві, а не чотири.", "Печінка поділяється на 2 частки (частини), 5 секторів (відділів) і 8 сегментів.", "Сегментів вісім, не чотири.", "Відділів п’ять, сегментів вісім.", "Частин дві, відділів п’ять."]}, {"n": "25.25", "q": "У чоловіка 56 років діагностовано гострий гепатит. При цій патології ушкоджуються структурно-функціональні одиниці паренхіми печінки. Чим представлена структурно-функціональна одиниця печінки людини?", "o": ["Часточкою печінки.", "Ворітною печінковою часточкою.", "Печінковим ацинусом.", "Сегментом печінки.", "Часткою печінки."], "a": [0], "e": ["Класично структурно-функціональною одиницею печінки вважають печінкову часточку.", "Ворітна часточка — альтернативна модель.", "Ацинус — альтернативна модель.", "Сегмент — хірургічна одиниця.", "Частка — макроскопічна частина."]}, {"n": "25.26", "q": "У чоловіка 55 років діагностовано гостре запалення слизової оболонки жовчного міхура. Спостерігається різке виснаження, наявна жовтяниця, виявлені сліди розчухів на шкірі. Під час огляду живота виявлені симптоми подразнення очеревини. Як розташований жовчний міхур по відношенню до очеревини?", "o": ["Екстраперитонеально.", "Мезоперитонеально.", "Інтраперитонеально.", "Знаходиться в spatium retroperitoneale.", "Не має відношення."], "a": [1], "e": ["Жовчний міхур частково вкритий очеревиною.", "Жовчний міхур вкритий очеревиною з трьох боків — мезоперитонеально.", "Із боку печінки міхур не вкритий очеревиною.", "Міхур не лежить заочеревинно.", "Міхур має відношення до очеревини."]}, {"n": "25.27", "q": "Під час фіброгастродуоденоскопії лікар оглядає низхідну частину дванадцятипалої кишки у чоловіка 23 років. На якому утворі низхідної частини дванадцятипалої кишки відкривається додаткова протока підшлункової залози?", "o": ["На півмісяцевій складці.", "На ворсинці.", "На коловій складці.", "На малому сосочку поздовжньої складки.", "На великому сосочку поздовжньої складки."], "a": [3], "e": ["Півмісяцеві складки є в товстій кишці.", "На ворсинках протоки не відкриваються.", "На колових складках протоки не відкриваються.", "Додаткова протока відкривається на малому сосочку, вище великого.", "На великому сосочку відкривається печінково-підшлункова ампула."]}, {"n": "25.28", "q": "Чоловіку 54 років під час УЗД-дослідження діагностовано пухлину печінки. Готуючись до хірургічного видалення пухлини, хірург планує видалення хвостатої частки печінки (частку Спігелія). На які утвори, що обмежують хвостату частку печінки, буде орієнтуватися лікар під час операції?", "o": ["Ворота печінки, борозну нижньої порожнистої вени, щілину венозної зв’язки.", "Щілину венозної звʼязки, ямку жовчного міжура, ворота печінки.", "Борозну нижньої порожнистої вени, ворота печінки, щілину круглої зв’язки печнки.", "Ямку жовчного міхура, щілину венозної звʼязки.", "Щілину круглої звʼязки, борозну нижньої порожнистої вени, ворота печінки."], "a": [0], "e": ["Хвостата частка обмежена воротами печінки (спереду), борозною нижньої порожнистої вени (праворуч) і щілиною венозної зв’язки (ліворуч).", "Ямка жовчного міхура обмежує квадратну частку.", "Щілина круглої зв’язки обмежує квадратну частку.", "Ямка жовчного міхура не обмежує хвостату частку.", "Щілина круглої зв’язки обмежує квадратну частку."]}, {"n": "25.29", "q": "У пацієнта діагностовано одну із некротичних форм гострого панкреатиту. У який із очеревинних просторів відразу може поширитися гній?", "o": ["Чепцеву сумку.", "Печінкову сумку.", "Передшлункову сумку.", "Лівий бічний канал.", "Правий бічний канал."], "a": [0], "e": ["Підшлункова залоза лежить у задній стінці чепцевої сумки, тому гній поширюється в неї.", "Печінкова сумка лежить праворуч під печінкою.", "Передшлункова сумка лежить попереду шлунка.", "Лівий бічний канал лежить ліворуч у нижньому поверсі.", "Правий бічний канал лежить праворуч у нижньому поверсі."]}, {"n": "25.30", "q": "Жінка 30 років скаржиться на сильну спрагу, сухість у роті, які з’явилися після сильного нервового перенапруження. При лабораторному дослідженні виявлено підвищення рівня глюкози в крові до 10 ммоль/л. Захворювання якої ендокринної залози виявили у жінки?", "o": ["Підшлункової.", "Щитоподібної.", "Яєчника.", "Надниркової.", "Шишкоподібної."], "a": [0], "e": ["Гіперглікемія і спрага — ознаки цукрового діабету, тобто порушення ендокринної частини підшлункової залози (острівців Лангерганса).", "Щитоподібна залоза регулює обмін речовин, але не рівень глюкози безпосередньо.", "Яєчник виробляє статеві гормони.", "Надниркова залоза підвищує глюкозу при стресі, але стійка гіперглікемія — ознака патології підшлункової залози.", "Шишкоподібна залоза регулює ритми."]}], "models": [["Печінка (скан препарату)", "sf:fc93d73972814c9ca5f2df4851c72976", {"ru": "Печень (скан препарата)", "en": "Liver (specimen scan)"}], ["Підшлункова залоза і дванадцятипала кишка", "sf:b34ba50e38fd455bae43bd07b7ed2d3b", {"ru": "Поджелудочная железа и двенадцатиперстная кишка", "en": "Pancreas and duodenum"}], ["Травний тракт", "sf:8c4c69035f4f4773813533d7ca56e516", {"ru": "Пищеварительный тракт", "en": "Gastrointestinal tract"}]]}, {"id": "topic25b", "title": "25. Очеревина", "tr": {"ru": "25. Брюшина", "en": "25. Peritoneum"}, "questions": [{"n": "25.1", "q": "У жінки 36 років, що госпіталізована зі скаргами на різкий біль внизу живота та запаморочення, під час обстеження діагностовано позаматкову вагітність із розривом стінки маткової труби та внутрішньочеревною кровотечею. Лікар припускає, що кров буде накопичуватися в найнижчому відділі очеревинної порожнини у положенні пацієнтки лежачи на спині. У якому просторі очеревинної порожнини буде накопичуватися кров?", "o": ["Прямокишково-матковій заглибині.", "У заочеревинному просторі.", "Брижовій пазусі.", "Підшлунковій сумці.", "Печінковій сумці."], "a": [0], "e": ["Прямокишково-маткова заглибина — найнижча частина очеревинної порожнини у жінки, тут збирається кров.", "Заочеревинний простір не належить до очеревинної порожнини.", "Брижові пазухи лежать вище, у середньому поверсі.", "Підшлункової сумки немає; є передшлункова, печінкова і чепцева.", "Печінкова сумка лежить у верхньому поверсі."]}, {"n": "25.2", "q": "Чоловіка 45 років госпіталізовано у хірургічне відділення лікарні зі скаргами на раптовий гострий біль у надчеревній ділянці живота. Після обстеження встановлено діагноз: перфоративна (проривна) виразка задньої стінки шлунка. У хворого наявні ознаки подразнення очеревини. У який очеревинний утвір вилився вміст шлунка в момент перфорації?", "o": ["У чепцеву сумку.", "У печінкову сумку.", "У передшлункову сумку.", "У ліву брижову пазуху.", "У праву брижову пазуху."], "a": [0], "e": ["Задня стінка шлунка звернена до чепцевої сумки, тому вміст виливається туди.", "Печінкова сумка лежить праворуч під печінкою.", "Передшлункова сумка лежить попереду шлунка.", "Ліва брижова пазуха лежить у нижньому поверсі.", "Права брижова пазуха лежить у нижньому поверсі."]}, {"n": "25.3", "q": "Жінка 35 років звернулася до лікаря зі скаргами на різкий біль внизу живота, слабкість та запаморочення. Під час проведення ультразвукового дослідження виявлено вільну рідину у найглибшому відділі очеревинної порожнини – прямокишково-матковій заглибині (Douglas pouch), що свідчить про внутрішню кровотечу. Лікар прийняв рішення виконати діагностично-лікувальну пункцію цієї заглибини. Крізь яку частину склепіння піхви здійснюють доступ до прямокишково-маткової заглибини?", "o": ["Задню.", "Передню.", "Будь-яку.", "Бічну ліву.", "Бічну праву."], "a": [0], "e": ["Прямокишково-маткова заглибина прилягає до заднього склепіння піхви, через нього роблять пункцію.", "Переднє склепіння прилягає до міхурово-маткової заглибини.", "Доступ можливий лише через заднє склепіння.", "Бічні склепіння прилягають до судин і сечоводів.", "Бічні склепіння прилягають до судин і сечоводів."]}, {"n": "25.4", "q": "У чоловіка 40 років під час ревізії органів черевної порожнини виявлено перфорацію передньої стінки шлунка на тлі виразкової хвороби. У якому очеревинному утворі виявив хірург кров і вміст шлунка?", "o": ["Чепцеву сумку.", "Передшлункову сумку.", "Правий бічний канал.", "Лівий бічний канал.", "Печінкову сумку."], "a": [1], "e": ["Чепцева сумка лежить позаду шлунка.", "Передня стінка шлунка звернена в передшлункову сумку.", "Правий бічний канал лежить нижче.", "Лівий бічний канал лежить нижче.", "Печінкова сумка лежить праворуч під печінкою."]}, {"n": "25.5", "q": "Жінка 25 років госпіталізована в хірургічне відділення лікарні з підозрою на розрив селезінки внаслідок травматичного ушкодження. Визначаючи місце хірургічного доступу та плану операції, хірург враховує відношення селезінки до очеревини. Як розміщена селезінка по відношенню до очеревини?", "o": ["Ретроперитонеально.", "Мезоперитонеально.", "Інтраперитонеально.", "Екстраперитонеально.", "Зовсім не вкриває."], "a": [2], "e": ["Селезінка не заочеревинна.", "Мезоперитонеально лежать печінка, висхідна і низхідна кишки.", "Селезінка вкрита очеревиною з усіх боків (крім воріт) — інтраперитонеально.", "Екстраперитонеально — органи поза очеревиною.", "Очеревина вкриває селезінку."]}, {"n": "25.6", "q": "У чоловіка 34 років діагностовано одну із некротичних форм гострого панкреатиту. Інтенсивний біль при цій хворобі пов'язаний з подразненням очеревини, що вкриває ушкоджену тканину підшлункової залози. Як очеревина покриває підшлункову залозу?", "o": ["Покриває тільки задню стінку.", "Мезоперитонеально.", "Інтраперитонеально.", "Екстраперитонеально.", "Розташована в заочеревинному просторі."], "a": [3], "e": ["Очеревина вкриває лише передню, а не задню поверхню залози.", "Мезоперитонеально залоза не вкрита.", "Залоза не вкрита з усіх боків.", "Підшлункова залоза лежить екстраперитонеально (ретроперитонеально): очеревина вкриває лише її передню поверхню.", "Залоза справді лежить у заочеревинному просторі, але питання про вид покриття — екстраперитонеально."]}, {"n": "25.7", "q": "У хірургічне відділення лікарні госпіталізовано чоловіка 26 років із проникаючим пораненням передньої черевної стінки. Під час операції виявлено ураження правої і лівої шлункових артерій, які розташовані в очеревинній структурі – малому чепці (omentum minus). Між листками якої зв’язки, що утворює малий чепець, проходять ушкоджені артерії?", "o": ["Ligamentum gastrocolicum.", "Ligamentum hepatoduodenale.", "Ligamentum hepatorenale.", "Ligamentum triangulare sinistrum.", "Ligamentum hepatogastricum."], "a": [4], "e": ["Шлунково-ободова зв’язка не входить до малого чепця.", "Печінково-дванадцятипалокишкова зв’язка містить ворітну вену, артерію і протоку.", "Печінково-ниркова зв’язка не входить до малого чепця.", "Ліва трикутна зв’язка фіксує печінку до діафрагми.", "Права і ліва шлункові артерії лежать у печінково-шлунковій зв’язці вздовж малої кривини."]}, {"n": "25.8", "q": "Чоловік 45 років звернувся до хірурга зі скаргами на випинання під шкірою в ділянці передньої черевної стінки, яке збільшується під час кашлю та фізичному навантаженні. Оглядаючи хворого, лікар запідозрив наявність грижі та пояснив, що вони найчастіше виникають у місцях, де м’язи та апоневрози не забезпечують достатньої підтримки. У яких «слабких» місцях передньої черевної стінки найчастіше виникають кили?", "o": ["Біла лінія живота, пупкове кільце, пахвинний канал.", "Ліва підреброва ділянка.", "Піхва прямого мʼяза живота.", "Стегнове кільце.", "М’язова затока."], "a": [0], "e": ["Кили найчастіше виходять через білу лінію живота, пупкове кільце і пахвинний канал.", "Підреброва ділянка не є слабким місцем.", "Піхва прямого м’яза міцна.", "Стегнове кільце — слабке місце, але не передньої черевної стінки.", "М’язова затока не є місцем кил."]}, {"n": "25.9", "q": "У чоловіка 36 років, хворого на виразкову хворобу шлунка, спостерігається «чорний кал», або «хвороба Гіппократа» – дьогтьоподібні чорні випорожнення при шлунковій кровотечі. Інтенсивний біль при цій хворобі пов’язаний з подразненням очеревини. Як очеревина покриває шлунок?", "o": ["Вкриває тільки задню стінку.", "Мезоперитонеально.", "Інтраперитонеально.", "Екстраперитонеально.", "Розташований в заочеревинному просторі."], "a": [2], "e": ["Очеревина вкриває не лише задню стінку.", "Шлунок не мезоперитонеальний.", "Шлунок вкритий очеревиною з усіх боків — інтраперитонеально.", "Шлунок не екстраперитонеальний.", "Шлунок не лежить заочеревинно."]}, {"n": "25.10", "q": "Чоловік 22 років під час ДТП отримав травму живота. На МРТ-зображенні виявлено ушкодження селезінки та шлунка. Призначена ургентна операція. Під час оперативного втручання хірург виявив ушкодження ligamentum gastrolienalе та кровотечу із судин, що розташовані між листками цієї зв'язки. Лікар провів також ревізію всіх органів, які пов'язані очеревинними зв'язками зі шлунком. Які органи черевної порожнини, крім селезінки, пов’язані зі шлунком через дублікатуру очеревини?", "o": ["Підшлункова залоза, печінка.", "Печінка, поперечна ободова кишка, діафрагма.", "Печінка, поперечна ободова кишка, нирка.", "Поперечна ободова кишка, діафрагма, нирка.", "Поперечна ободова кишка, діафрагма, надниркові залози."], "a": [1], "e": ["Підшлункова залоза зв’язок зі шлунком не має.", "Шлунок пов’язаний з печінкою, поперечною ободовою кишкою, діафрагмою і селезінкою.", "Нирка лежить заочеревинно.", "Нирка не має зв’язки зі шлунком.", "Надниркові залози не мають зв’язки зі шлунком."]}, {"n": "25.11", "q": "У жінки 45 років на МРТ-зображенні виявлена пухлина висхідної частини дванадцятипалої кишки, що стискає початок брижі тонкої кишки і викликає больвий синдром на тлі подразнення очеревини. Під час оперативного втручання хірургу необхідно виділити початок брижі тонкої кишки. Де знаходиться в нормі це місце?", "o": ["У ділянці сигмоподібної ободової кишки.", "У ділянці дванадцятипало-порожньокишкового згину.", "В правому брижовому синусі.", "У ділянці правого згину ободової кишки.", "У ділянці лівого згину ободової кишки."], "a": [1], "e": ["Сигмоподібна кишка має окрему брижу.", "Корінь брижі тонкої кишки починається біля дванадцятипало-порожньокишкового згину (ліворуч від L2).", "Права брижова пазуха лежить праворуч від кореня брижі.", "Правий згин ободової кишки до брижі тонкої кишки не належить.", "Лівий згин ободової кишки лежить вище."]}, {"n": "25.12", "q": "Підлітка 16 років госпіталізовано в лікарню з ножовим пораненням живота. Під час пальпації правої бічної ділянки живота у хлопця посилюється біль, наявні ознаки подразнення очеревини. Лікар передбачає накопичення крові в утворі очеревинної порожнини, що розташований збоку від висхідної ободової кишки. Який утвір очеревинної порожнини присередньо обмежує висхідна ободова кишка?", "o": ["Права брижова пазуха.", "Правий бічний канал.", "Печінкову сумку.", "Залобковий простір.", "Чепцеву сумку."], "a": [1], "e": ["Права брижова пазуха лежить присередньо від висхідної кишки.", "Правий бічний канал лежить між висхідною ободовою кишкою і бічною стінкою живота; кишка обмежує його присередньо.", "Печінкова сумка лежить вище.", "Залобковий простір лежить позаду лобка.", "Чепцева сумка лежить позаду шлунка."]}, {"n": "25.13", "q": "Чоловіку 30 років виконують оперативне втручання на цибулині дванадцятипалої кишки з приводу виразкової хвороби. Хірургу необхідно зупинити кровотечу із судини, що проходить у печінково-дванадцятипалокишковій зв’язці. Які утвори розташовані між листками печінково-дванадцятипалокишкової зв’язки?", "o": ["Ліва шлункова артерія, ворітна печінкова вена, спільна жовчна протока, лімфатичні судини.", "Спільна жовчна протока, ворітна печінкова вена, загальна печінкова артерія, нерви, лімфатичні судини та лімфатичні вузли.", "Права шлунково-чепцева артерія, спільна жовчна протока, ворітна печінкова вена, лімфатичні судини.", "Міхурова протока, ворітна печінкова вена, права шлункова артерія, лімфатичні судини.", "Власна печінкова артерія, ворітна печінкова вена, міхурова протока, лімфатичні судини."], "a": [1], "e": ["Ліва шлункова артерія лежить у печінково-шлунковій зв’язці.", "У печінково-дванадцятипалокишковій зв’язці — спільна жовчна протока, ворітна вена, загальна печінкова артерія, нерви і лімфатичні судини та вузли.", "Права шлунково-чепцева артерія лежить у великому чепці.", "Міхурова протока лежить вище, біля міхура.", "Міхурова протока лежить вище, біля міхура."]}, {"n": "25.14", "q": "У чоловіка 60 років діагностовано пухлину верхньої третини прямої кишки. Як очеревина вкриває цей відділ прямої кишки?", "o": ["Інтраперитонеально.", "Мезоперитонеально.", "Екстраперитонеально.", "В заочеревинному просторі.", "Не має відношення."], "a": [0], "e": ["Верхня третина прямої кишки вкрита очеревиною з усіх боків — інтраперитонеально.", "Мезоперитонеально — середня третина.", "Екстраперитонеально — нижня третина.", "Верхня частина не лежить заочеревинно.", "Очеревина вкриває верхню третину."]}, {"n": "25.15", "q": "Чоловік 56 років направлений в онкологічне відділення для проведення комп'ютерно-томографічне обстеження з приводу пухлини правої нирки. Після проведення КТ та лабораторних досліджень прийнято рішення виконати нефректомію (видалення нирки). Для правильного планування оперативного доступу хірург повинен враховувати топографічні особливості нирки, її відношення до очеревини. Яке нирка розташована по відношенню до очеревини?", "o": ["Ретроперитонеальне.", "Мезоперитонеальне.", "Інтраперитонеальне.", "Інтраперитонеальне з утворенням зв’язок", "Не має відношення"], "a": [0], "e": ["Нирка лежить ретроперитонеально (позаочеревинно).", "Нирка не мезоперитонеальна.", "Нирка не інтраперитонеальна.", "Нирка не утворює очеревинних зв’язок.", "Нирка вкрита очеревиною спереду."]}, {"n": "25.16", "q": "Під час оперативного втручання та ревізії утворів очеревинної порожнини у чоловіка 45 років, що страждає на портальну гіпертензію, лікар проводить ревізію очеревинних зв’язок печінки. Особливу увагу хірург приділив серпоподібній зв’язці печінки, між листками якої проходять ушкоджені v.v. paraumbilicales та lig. teres hepatis. Яка судина після облітерації у новонародженого перетворюється на сполучнотканинну зв’язку – lig. teres hepatis, що проходить від пупка до печінки?", "o": ["Vena umbilicalis.", "Arteria umbilicalis.", "Ductus venosus.", "Ductus arteriosus.", "Arteria hepatica propria."], "a": [0], "e": ["Кругла зв’язка печінки — облітерована пупкова вена.", "Пупкові артерії стають присередніми пупковими зв’язками.", "Венозна протока стає венозною зв’язкою.", "Артеріальна протока стає артеріальною зв’язкою.", "Власна печінкова артерія функціонує все життя."]}, {"n": "25.17", "q": "Чоловіка 50 років госпіталізовано у хірургічне відділення лікарні з гострим запаленням жовчного міхура. Об’єктивно: чоловік різко виснажений, наявна жовтяниця зі слідами розчухів на шкірі. Під час пальпації живота виявлені симптоми подразнення очеревини. Яке відношення до очеревини має наповнений жовчний міхур?", "o": ["Екстраперитонеально.", "Мезоперитонеально.", "Інтраперитонеально.", "Знаходиться в spatium retroperitoneale.", "Не має відношення."], "a": [1], "e": ["Жовчний міхур частково вкритий очеревиною.", "Жовчний міхур вкритий очеревиною з трьох боків — мезоперитонеально.", "Із боку печінки міхур не вкритий очеревиною.", "Міхур не лежить заочеревинно.", "Міхур має відношення до очеревини."]}, {"n": "25.18", "q": "Через чепцевий отвір (отвір Вінслова) присінок чепцевої сумки сполучається з правим підпечінковим закутком печінкової сумки. Цю ділянку ретельно перевіряє хірург. Які утвори формують чепцевий отвір?", "o": ["Lig. hepatoduodenale, lig. hepatorenale, lobus caudatus, pars superior duodeni.", "Lig. hepatoduodenale, lig. hepatorenale, facies visceralis hepatis.", "Lig. hepatoduodenale, lig. hepatorenale, pars descendens duodeni.", "Facies visceralis hepatis, lig. hepatorenale, lig. hepatogastricum.", "Lig. hepatoduodenale, pars superior duodeni, lig. venosum."], "a": [0], "e": ["Чепцевий отвір: спереду печінково-дванадцятипалокишкова зв’язка, ззаду печінково-ниркова, зверху хвостата частка, знизу верхня частина дванадцятипалої кишки.", "Пропущено нижню межу — дванадцятипалу кишку.", "Низхідна частина лежить нижче.", "Печінково-шлункова зв’язка не обмежує отвір.", "Венозна зв’язка не обмежує отвір."]}, {"n": "25.19", "q": "У жінки 53 років діа
