ентгенограму кісток нижньої кінцівки у жінки 60 років, звернув увагу на зміни структури наколінної поверхні однієї з кісток. У якій кістці спостерігає травматолог?", "o": ["Os coxae.", "Os femoris.", "Patella.", "Tibia.", "Fibula."], "a": [1], "e": ["Кульшова кістка має кульшову западину, а не наколінну поверхню.", "Наколінна поверхня (facies patellaris) — на передній поверхні дистального кінця стегнової кістки; з нею з'єднується наколінок.", "Наколінок має суглобову поверхню, але «наколінна поверхня» — утвір стегнової кістки.", "Великогомілкова кістка має верхню суглобову поверхню для виростків стегна.", "Малогомілкова кістка не бере участі в колінному суглобі."]}, {"n": "9.4", "q": "До певного віку у дітей на рентгенограмі можна бачити хрящові прошарки між кістками в ділянці кульшової западини. У якому віці відбувається повне зрощення кісток, що утворюють кульшову западину?", "o": ["5–6.", "9–10.", "11–13.", "13–16.", "17–20."], "a": [3], "e": ["У 5–6 років кістки западини ще розділені Y-подібним хрящем.", "У 9–10 років хрящ ще зберігається.", "У 11–13 років зрощення лише починається.", "Кістки кульшової западини повністю зростаються у 13–16 років.", "У 17–20 років зрощення вже давно завершене."]}, {"n": "9.5", "q": "Під час розслаблення пасивних «затяжок» стопи її склепіння опускаються, стопа сплощується, що призводить до плоскостопості. Які кістки беруть участь у формуванні найвищого поперечного склепіння стопи?", "o": ["Плеснові кістки.", "П'яткова кістка, кубоподібна кістка.", "Човноподібна, клиноподібні, кубоподібна", "Кубоподібна, п'яткова, плеснові кістки.", "Плеснові кістки, п'яткова кістка."], "a": [2], "e": ["Плеснові кістки утворюють передню, нижчу частину поперечного склепіння.", "П'яткова і кубоподібна кістки утворюють бічне поздовжнє склепіння.", "Найвище поперечне склепіння утворюють човноподібна, клиноподібні та кубоподібна кістки.", "Ці кістки утворюють бічне поздовжнє склепіння.", "Плеснові та п'яткова кістки — кінцеві точки опори поздовжніх склепінь."]}, {"n": "9.6", "q": "Студент вивчає статеві ознаки та відмінності таза дорослої людини, порівнюючи жіночий і чоловічий таз. Він констатує, що у чоловіків підлобковий кут гострий і становить 50–60°, а у жінок — значно більший. Яка величина підлобкового кута у жінок?", "o": ["55–65°.", "60–65°.", "65–70°.", "70–75°.", "75–100°."], "a": [4], "e": ["55–65° — значення, близьке до чоловічого кута.", "60–65° — близько до чоловічого кута.", "65–70° — менше за жіночий кут.", "70–75° — менше за типовий жіночий кут.", "У жінок підлобковий кут тупий — приблизно 75–100° (дуга)."]}, {"n": "9.7", "q": "Під час вибору акушером тактики проведення пологів важливим є вимірювання поперечного діаметра виходу з малого таза. Цей розмір повинен бути дещо більшим за розмір головки плода. Між якими кістковими утворами акушер розміщує ніжки тазоміра?", "o": ["Сідничими горбами.", "Нижніми гілками лобкових кісток.", "Нижніми передніми клубовими остями.", "Остями сідничих кісток.", "Межовими лініями."], "a": [0], "e": ["Поперечний діаметр виходу з малого таза вимірюють між внутрішніми поверхнями сідничих горбів.", "Нижні гілки лобкових кісток обмежують підлобковий кут.", "Нижні передні клубові ості — над кульшовою западиною, до виходу таза не належать.", "Сідничі ості використовують для вимірювання міжостьового розміру порожнини, а не виходу.", "Межова лінія — це межа входу в малий таз."]}, {"n": "9.8", "q": "Після невдалого стрибка з висоти спортсмен був доставлений у травматологічне відділення лікарні зі скаргами на різкий біль та набряк у ділянці правої стопи. Під час обстеження права стопа у її задній третині різко болюча при пальпації, наявний крововилив на підошві, рухи у надп'ятково-гомілковому суглобі можливі у повному обсязі. Яка кістка ушкоджена?", "o": ["П'яткова кістка.", "Великогомілкова кістка.", "Надп'яткова кістка.", "Фаланги пальців стопи.", "Малогомілкова кістка."], "a": [0], "e": ["П'яткова кістка утворює задню третину стопи; падіння на п'яти з висоти — типовий механізм її перелому.", "Великогомілкова кістка належить гомілці, а не стопі.", "Надп'яткова кістка утворює надп'ятково-гомілковий суглоб; рухи в ньому збережені.", "Фаланги розташовані в передній частині стопи.", "Малогомілкова кістка — кістка гомілки."]}, {"n": "9.9", "q": "Хокеїст внаслідок падіння на коліно відчув різкий біль та хруст у ділянці лівого колінного суглоба. Під час огляду виявлено сильний набряк тканин у лівій колінній ділянці та верхній третині лівої гомілки, крововилив і біль на передній поверхні лівого колінного суглоба. Яка кістка ушкоджена?", "o": ["Наколінок.", "Малогомілкова кістка.", "Сіднича кістка.", "Стегнова кістка.", "Великогомілкова кістка."], "a": [0], "e": ["Наколінок лежить на передній поверхні колінного суглоба й ламається при падінні на коліно.", "Малогомілкова кістка — бічна кістка гомілки, не на передній поверхні коліна.", "Сіднича кістка — частина таза.", "Стегнова кістка ламається в іншому місці при такому механізмі.", "Великогомілкова кістка лежить нижче, на гомілці."]}, {"n": "9.10", "q": "Після автомобільної аварії у водія спостерігається деформація у середній третині лівої гомілки, сильний біль, особливо під час спроби рухати лівою нижньою кінцівкою. З рани виступає кінець кістки тригранного перерізу. Яка кістка ушкоджена?", "o": ["Великогомілкова кістка.", "Малогомілкова кістка.", "Стегнова кістка.", "Наколінок.", "Надп'яткова кістка."], "a": [0], "e": ["Тіло великогомілкової кістки має тригранну форму перерізу, а передній край розташований під шкірою.", "Малогомілкова кістка тонка, менш тригранна, розташована глибше.", "Стегнова кістка — у стегні, а не в гомілці.", "Наколінок — сесамоподібна кістка біля колінного суглоба.", "Надп'яткова кістка — кістка стопи."]}, {"n": "9.11", "q": "Будівник упав з висоти та вдарився лівою половиною тіла, після чого відчув сильний біль у верхній третині лівого стегна. Чоловік не може стати на ліву ногу, рухи у кульшовому суглобі лівої нижньої кінцівки виконати не вдається, посилюється набряк, з'являються ознаки крововиливу. Яка кістка ушкоджена?", "o": ["Стегнова.", "Малогомілкова кістка.", "Крижова", "Наколінок.", "Лобкова."], "a": [0], "e": ["Біль у верхній третині стегна і неможливість рухів у кульшовому суглобі вказують на перелом стегнової кістки.", "Малогомілкова кістка — на гомілці.", "Крижова кістка — у тазі, не в стегні.", "Наколінок — у колінній ділянці.", "Лобкова кістка — частина таза."]}, {"n": "9.12", "q": "У чоловіка 56 років діагностовано перелом кістки одразу над її присередньою кісточкою (malleolus medialis). Яка кістка була ушкоджена?", "o": ["Femur.", "Tibia.", "Fibula.", "Patella.", "Talus."], "a": [1], "e": ["Стегнова кістка не має кісточок.", "Присередня кісточка (malleolus medialis) — виступ дистального кінця великогомілкової кістки.", "Малогомілкова кістка утворює бічну кісточку.", "Наколінок не має кісточок.", "Надп'яткова кістка зчленовується з кісточками, але сама кісточок не має."]}, {"n": "9.13", "q": "У чоловіка 25 років після спортивної травми діагностовано перелом бічної кісточки (malleolus lateralis). Яка кістка ушкоджена?", "o": ["Великогомілкова кістка.", "Малогомілкова кістка", "Стегнова кістка.", "Наколінок.", "П'яткова кістка."], "a": [1], "e": ["Великогомілкова кістка утворює присередню кісточку.", "Бічна кісточка — дистальний кінець малогомілкової кістки.", "Стегнова кістка не має кісточок.", "Наколінок не має кісточок.", "П'яткова кістка не має кісточок."]}, {"n": "9.14", "q": "У чоловіка 45 років після падіння діагностовано перелом кістки, що утворює западину, яка разом зі стегновою кісткою утворює articulatio coxae. Яка кістка ушкоджена?", "o": ["Стегнова кістка.", "Кульшова кістка.", "Крижова кістка.", "Великогомілкова кістка.", "Малогомілкова кістка."], "a": [1], "e": ["Стегнова кістка дає головку, а не западину.", "Кульшова западина утворена кульшовою кісткою (зрощені клубова, сіднича і лобкова).", "Крижова кістка не утворює кульшового суглоба.", "Великогомілкова кістка не утворює кульшового суглоба.", "Малогомілкова кістка не утворює кульшового суглоба."]}, {"n": "9.15", "q": "Жінка 86 років госпіталізована у лікарню з травмою, отриманою під час падіння. Рентгенологічно діагностовано перелом кістки правої кінцівки, при чому лінія перелому проходить через великий і малий вертлюги цієї кістки. Перелом якої кістки діагностовано у жінки?", "o": ["Humerus.", "Os femoris.", "Radius.", "Ulna.", "Tibia."], "a": [1], "e": ["Плечова кістка має горбки, а не вертлюги.", "Великий і малий вертлюги — на проксимальному кінці стегнової кістки; вертлюгові переломи типові для літніх.", "Променева кістка не має вертлюгів.", "Ліктьова кістка не має вертлюгів.", "Великогомілкова кістка не має вертлюгів."]}, {"n": "9.16", "q": "У жінок у вертикальному положенні тіла площина верхнього отвору малого таза нахилена вперед і вниз, утворюючи з горизонтальною площиною кут 55–60° — нахил таза (inclinatio pelvis). Чим обмежена верхня межа малого таза?", "o": ["Linea intermedia.", "Linea arcuata.", "Linea glutea inferior.", "Linea glutea anterior.", "Linea (sulcus) limitans."], "a": [4], "e": ["Linea intermedia — на клубовому гребені, між зовнішньою і внутрішньою губами.", "Linea arcuata — лише частина межової лінії на клубовій кістці.", "Нижня сіднична лінія — на зовнішній поверхні клубової кістки.", "Передня сіднична лінія — на зовнішній поверхні клубової кістки.", "Верхню межу малого таза утворює межова лінія (linea terminalis)."]}, {"n": "9.17", "q": "Чоловік 25 років отримав спортивну травму нижньої кінцівки. Після рентгенологічного обстеження діагностовано перелом кістки нижньої кінцівки. Лінія перелому проходить між основою та верхівкою цієї кістки. Перелом якої кістки встановлено у чоловіка?", "o": ["Fibula.", "Os coxae.", "Os femoris.", "Patella.", "Tibia."], "a": [3], "e": ["Малогомілкова кістка має голівку і кісточку.", "Кульшова кістка не має основи та верхівки.", "Стегнова кістка має головку та виростки.", "Наколінок має основу (вгорі) і верхівку (внизу).", "Великогомілкова кістка має виростки та присередню кісточку."]}, {"n": "9.18", "q": "У лікарню звернулася жінка 67 років із травмою стопи. Під час рентгенологічного обстеження діагностовано перелом кістки стопи, яка своєю основою прилягає до присередньої клиноподібної кістки. Перелом якої кістки має місце?", "o": ["Os metatarsale I.", "Os cuboideum.", "Os naviculare.", "Os metatarsale III.", "Calcaneus."], "a": [0], "e": ["I плеснова кістка основою з'єднується з присередньою клиноподібною кісткою.", "Кубоподібна кістка з'єднується з IV–V плесновими кістками.", "Човноподібна кістка з'єднується з клиноподібними, а не з основою плеснових.", "III плеснова кістка з'єднується з бічною клиноподібною кісткою.", "П'яткова кістка не з'єднується з клиноподібними."]}, {"n": "9.19", "q": "Травматолог виявив на рентгенограмі стопи у постраждалого перелом кістки, яка має суглобову поверхню, що з'єднує її з усіма клиноподібними кістками. Перелом якої кістки діагностував лікар?", "o": ["Os metatarsale I.", "Os cuboideum.", "Os naviculare.", "Talus.", "Calcaneus."], "a": [2], "e": ["I плеснова кістка з'єднується лише з присередньою клиноподібною.", "Кубоподібна кістка з'єднується з бічною клиноподібною, але не з усіма.", "Човноподібна кістка спереду має суглобові поверхні для всіх трьох клиноподібних кісток.", "Надп'яткова кістка з'єднується з човноподібною, а не з клиноподібними.", "П'яткова кістка з'єднується з кубоподібною."]}, {"n": "9.20", "q": "До поліклініки звернувся чоловік 43 років з виробничою травмою стопи. На рентгенограмі виявлено перелом кістки заплесна, яка контактує з IV і V плесновими кістками. Перелом якої кістки діагностував лікар?", "o": ["Calcaneus.", "Os naviculare.", "Os cuneiforme mediale.", "Os cuboideum.", "Talus."], "a": [3], "e": ["П'яткова кістка з'єднується з кубоподібною, але не з плесновими.", "Човноподібна кістка з'єднується з клиноподібними.", "Присередня клиноподібна кістка з'єднується з I плесновою.", "Кубоподібна кістка спереду з'єднується з основами IV та V плеснових кісток.", "Надп'яткова кістка не контактує з плесновими."]}, {"n": "9.21", "q": "Жінка 45 років звернулася до лікаря-травматолога зі скаргами на біль в одному із суглобів нижньої кінцівки. На рентгенограмі виявлено суттєві зміни в ділянці facies lunata. На якій кістці нижньої кінцівки є півмісяцева поверхня?", "o": ["Patella.", "Tibia.", "Os coxae.", "Os femoris.", "Fibula."], "a": [2], "e": ["Наколінок не має півмісяцевої поверхні.", "Великогомілкова кістка не має півмісяцевої поверхні.", "Півмісяцева поверхня (facies lunata) — суглобова частина кульшової западини кульшової кістки.", "Стегнова кістка має головку, яка зчленовується з півмісяцевою поверхнею.", "Малогомілкова кістка не має півмісяцевої поверхні."]}, {"n": "9.22", "q": "Лікар-рентгенолог під час дослідження рентгенограми звертає увагу на зміни вушкоподібної поверхні однієї із кісток тазового пояса. Яка кістка нижньої кінцівки має вушкоподібну поверхню?", "o": ["Os femoris.", "Fibula.", "Tibia.", "Os sacrum.", "Patella."], "a": [3], "e": ["Стегнова кістка не має вушкоподібної поверхні.", "Малогомілкова кістка не має вушкоподібної поверхні.", "Великогомілкова кістка не має вушкоподібної поверхні.", "Вушкоподібна поверхня є на бічній частині крижової кістки (і на клубовій кістці) — утворює крижово-клубовий суглоб.", "Наколінок не має вушкоподібної поверхні."]}, {"n": "9.23", "q": "Лікар-невролог під час обстеження жінки 46 років попередньо діагностує стиснення затульного нерва в місці його прилягання до затульної борозни (sulcus obturatorius) на одній із кісток тазового пояса. На якій кістці нижньої кінцівки знаходиться затульна борозна?", "o": ["Patella.", "Fibula.", "Os femoris.", "Tibia.", "Os coxae."], "a": [4], "e": ["Наколінок не має затульної борозни.", "Малогомілкова кістка не має затульної борозни.", "Стегнова кістка не має затульної борозни.", "Великогомілкова кістка не має затульної борозни.", "Затульна борозна — на верхній гілці лобкової кістки, тобто кульшової кістки."]}, {"n": "9.24", "q": "У лікарню госпіталізовано чоловіка 28 років з переломом кістки нижньої кінцівки. На рентгенограмі лінія перелому візуалізується уздовж тіла кістки, одразу проксимальніше від її присереднього та бічного виростків. Яка кістка зазнала перелому?", "o": ["Talus.", "Os femoris.", "Os coxae.", "Fibula.", "Tibia."], "a": [1], "e": ["Надп'яткова кістка не має виростків.", "Присередній і бічний виростки є на дистальному кінці стегнової кістки; перелом над ними — надвиростковий перелом стегна.", "Кульшова кістка не має виростків.", "Малогомілкова кістка не має виростків.", "Великогомілкова кістка має виростки на проксимальному кінці, але лінія перелому описана над ними уздовж тіла, що характерно для стегна."]}, {"n": "9.25", "q": "Травматолог виявив на рентгенограмі у чоловіка 45 років перелом кістки нижньої кінцівки одразу над бічною кісточкою. Перелом якої кістки спостерігає лікар в даному випадку?", "o": ["Os coxae.", "Fibula.", "Talus.", "Tibia.", "Os femoris."], "a": [1], "e": ["Кульшова кістка не має кісточок.", "Бічна кісточка належить малогомілковій кістці.", "Надп'яткова кістка не має кісточок.", "Великогомілкова кістка має присередню кісточку.", "Стегнова кістка не має кісточок."]}, {"n": "9.26", "q": "У лікарню госпіталізовано жінку 52 років з травмою нижньої кінцівки. Після рентгенологічного обстеження лікарем діагностовано перелом дистального наростку кістки з ушкодженням її присередньої кісточки, кісточкової борозни. Перелом якої кістки діагностовано у жінки?", "o": ["Fibula.", "Talus.", "Os femoris.", "Calcaneus.", "Tibia."], "a": [4], "e": ["Малогомілкова кістка має бічну кісточку.", "Надп'яткова кістка не має кісточок.", "Стегнова кістка не має кісточок.", "П'яткова кістка не має кісточок.", "Присередня кісточка і кісточкова борозна — на дистальному кінці великогомілкової кістки."]}, {"n": "9.27", "q": "Травматолог під час операції на одному із суглобів нижньої кінцівки підшиває зв'язку, відірвану від переднього міжвиросткового поля. До якої кістки лікар фіксує відірвану зв'язку?", "o": ["Tibia.", "Os femoris.", "Fibula.", "Calcaneus.", "Talus."], "a": [0], "e": ["Переднє міжвиросткове поле — на верхній поверхні великогомілкової кістки; від нього починається передня хрестоподібна зв'язка.", "Стегнова кістка має міжвиросткову ямку, а не поле.", "Малогомілкова кістка не має міжвиросткового поля.", "П'яткова кістка не має міжвиросткового поля.", "Надп'яткова кістка не має міжвиросткового поля."]}, {"n": "9.28", "q": "До травматологічного відділення лікарні доставлено чоловіка 28 років зі спортивною травмою. Під час обстеження діагностовано відрив волокон внутрішньокапсульної зв'язки в одному із суглобів нижньої кінцівки, яка в нормі починається від заднього міжвиросткового поля. До якої кістки лікар фіксує відірвану зв'язку?", "o": ["Os femoris.", "Tibia", "Calcaneus.", "Talus.", "Fibula."], "a": [1], "e": ["Стегнова кістка має міжвиросткову ямку, а не поле.", "Заднє міжвиросткове поле розташоване на великогомілковій кістці; від нього йде задня хрестоподібна зв'язка.", "П'яткова кістка не має міжвиросткового поля.", "Надп'яткова кістка не має міжвиросткового поля.", "Малогомілкова кістка не має міжвиросткового поля."]}, {"n": "9.29", "q": "Внаслідок падіння з висоти жінка 27 років отримала травму нижньої кінцівки. Після проведення рентгенологічного обстеження діагностовано перелом кістки нижньої кінцівки. Лінія перелому проходить через середину linea aspera. Яка кістка нижньої кінцівки ушкоджена?", "o": ["Fibula.", "Tibia.", "Talus.", "Os femoris.", "Os coxae."], "a": [3], "e": ["Малогомілкова кістка не має шорсткої лінії.", "Великогомілкова кістка має камбалоподібну лінію, а не шорстку.", "Надп'яткова кістка не має шорсткої лінії.", "Шорстка лінія (linea aspera) — на задній поверхні тіла стегнової кістки.", "Кульшова кістка не має шорсткої лінії."]}, {"n": "9.30", "q": "Внаслідок падіння з висоти жінка 27 років отримала травму кісток тазового пояса. Після проведення рентгенологічного обстеження діагностовано перелом кістки. Лінія перелому проходить уздовж дугоподібної лінії. Яка кістка травмована?", "o": ["Стегнова.", "Крижова.", "Клубова.", "Лобкова.", "Сіднича."], "a": [2], "e": ["Стегнова кістка не має дугоподібної лінії.", "Крижова кістка не має дугоподібної лінії.", "Дугоподібна лінія (linea arcuata) — на внутрішній поверхні клубової кістки, частина межової лінії.", "Лобкова кістка має гребінь, що продовжує межову лінію.", "Сіднича кістка не має дугоподібної лінії."]}], "models": [["Нижня кінцівка", "o3d:lower-limb", {"ru": "Нижняя конечность", "en": "Lower limb"}], ["Кульшова ділянка і таз", "o3d:zone-hip", {"ru": "Тазобедренная область и таз", "en": "Hip and pelvis"}], ["Гомілковостопний суглоб і стопа", "o3d:zone-ankle", {"ru": "Голеностопный сустав и стопа", "en": "Ankle and foot"}]]}, {"id": "topic10", "title": "10. З’єднання хребтового стовпа. З’єданння грудної клітки. Зʼєднання черепа", "tr": {}, "questions": [{"n": "10.1", "q": "Чоловік 52 років звернувся до лікаря-нейрохірурга зі скаргами на біль під час обертання голови в шийному відділі хребтового стовпа. Рентгенологічно виявлені патологічні зміни в серединному атланто-осьовому суглобі. До якого типу суглобів за формою суглобових поверхонь та функцією відноситься серединний атланто-осьовий суглоб?", "o": ["Bicondilaris.", "Trochlearis.", "Cylindrica.", "Spheroidea.", "Elipsoidea."], "a": [2], "e": ["Двовиростковий суглоб має дві опуклі суглобові поверхні (наприклад, колінний).", "Блокоподібний суглоб — різновид циліндричного з напрямним гребенем (міжфалангові суглоби).", "Серединний атланто-осьовий суглоб — циліндричний (обертовий), одноосьовий: атлант обертається навколо зуба.", "Кулястий суглоб — багатоосьовий (плечовий).", "Еліпсоподібний суглоб — двоосьовий (променево-зап'ястковий)."]}, {"n": "10.2", "q": "У чоловіка 34 років діагностовано артроз скронево-нижньощелепного суглоба. Рухи в суглобі різко обмежені. До яких суглобів належить скронево-нижньощелепний суглоб за формою суглобових поверхонь та кількістю осей оберта "Головка ребра з тілами хребців утворює справжній суглоб — діартроз.", "Синдесмоз — сполучнотканинне з'єднання.", "Синостоз — кісткове зрощення."]}, {"n": "10.11", "q": "Чоловіка 30 років зі скаргами на нестерпний біль у колінному суглобі оглядає лікар. Після обстеження виявлено ушкодження анатомічних утворів, наявність яких у порожнині суглоба характеризує суглоб «як комплексний». Що є ознакою комплексного суглоба?", "o": ["Наявність більше двох суглобових поверхонь.", "Суглобова капсула.", "Суглобовий меніск, внутрішньосуглобові зв'язки, синовіальні складки.", "Суглобова порожнина.", "Зовнішні зв'язки, які укріплюють суглоб."], "a": [2], "e": ["Більше двох суглобових поверхонь — ознака складного, а не комплексного суглоба.", "Капсула є в усіх суглобах.", "Комплексний суглоб має внутрішньосуглобові утвори: диск або меніски, зв'язки, синовіальні складки.", "Суглобова порожнина є в усіх суглобах.", "Зовнішні зв'язки є в багатьох суглобах і комплексність не визначають."]}, {"n": "10.12", "q": "У чоловіка 45 років, хворого на менінгоенцефаліт, лікар виконує пункцію мозочково-мозкової цистерни в точці, розташованій в місці перехресту серединної лінії і лінії, що з'єднує нижні краї соскоподібних відростків скроневої кістки. Під час пункції голка проходить через атланто-потиличну перетинку. До якого виду з'єднань належить атланто-потилична перетинка?", "o": ["Синхондроз.", "Синдесмоз.", "Синсаркоз.", "Синостоз.", "Діартроз."], "a": [1], "e": ["Синхондроз — хрящове з'єднання.", "Атланто-потилична перетинка — різновид синдесмозу (сполучнотканинна мембрана).", "Синсаркоз — м'язове з'єднання.", "Синостоз — кісткове з'єднання.", "Діартроз — справжній суглоб."]}, {"n": "10.13", "q": "Пункція бічних шлуночків кінцевого мозку у новонароджених дітей виконується через шкіру в бічному куті fonticulus frontalis. До якого виду з'єднань відноситься тім'ячко?", "o": ["Синхондроз.", "Синдесмоз.", "Симфіз.", "Синостоз.", "Вклинення."], "a": [1], "e": ["Синхондроз — хрящове з'єднання.", "Тім'ячка — перетинчасті ділянки сполучної тканини, тобто синдесмоз.", "Симфіз — хрящове з'єднання зі щілиною.", "Синостоз — кісткове зрощення.", "Вклинення — з'єднання зуба з коміркою."]}, {"n": "10.14", "q": "У чоловіка 34 років після падіння з висоти діагностовано компресійний перелом тіл хребців у шийному відділі хребтового стовпа. Під час МРТ обстеження, крім лінії перелому, лікар виявив ушкодження міжхребцевих дисків (грижу Шморля). До якого виду з'єднань належать міжхребцеві диски?", "o": ["Діартроз.", "Синдесмоз.", "Синсаркоз.", "Синостоз.", "Синхондроз."], "a": [4], "e": ["Діартроз — справжній суглоб.", "Синдесмоз — зв'язки, а диск — це хрящ.", "Синсаркоз — м'язове з'єднання.", "Синостоз — кісткове з'єднання.", "Міжхребцеві диски — волокнистий хрящ, тобто синхондроз."]}, {"n": "10.15", "q": "Під час стрибків у воду спортсмен отримав травму шийного відділу хребтового стовпа. На рентгенограмі лікар виявив ушкодження суглобових поверхонь атланто-потиличного суглоба. До яких суглобів відноситься атланто-потиличний суглоб за формою суглобових поверхонь та кількістю осей обертання?", "o": ["Циліндричний, одновісний.", "Сідлоподібний, одновісний.", "Двовиростковий, двовісний.", "Кулястий, багатовісний.", "Плоский, багатовісний."], "a": [2], "e": ["Циліндричний одноосьовий — серединний атланто-осьовий суглоб.", "Сідлоподібні суглоби двоосьові, а не одноосьові.", "Атланто-потиличний суглоб — двовиростковий (еліпсоподібний), двоосьовий.", "Кулястий — багатоосьовий (плечовий).", "Плоский суглоб — між суглобовими відростками хребців."]}, {"n": "10.16", "q": "До лікаря-хірурга звернувся чоловік 65 років зі скаргами на біль у шийному відділі хребтового стовпа, який посилюється під час розгинання шиї. Під час обстеження у чоловіка виявлені патологічні зміни в синдесмозі, який з'єднує передні поверхні тіл хребців. Якою зв'язкою представлений цей синдесмоз?", "o": ["Задньою поздовжньою.", "Передньою поздовжньою.", "Надостьовою.", "Карковою.", "Жовтою."], "a": [1], "e": ["Задня поздовжня зв'язка проходить по задніх поверхнях тіл хребців у хребтовому каналі.", "Передня поздовжня зв'язка з'єднує передні поверхні тіл хребців і обмежує розгинання.", "Надостьова зв'язка з'єднує верхівки остистих відростків.", "Каркова зв'язка — продовження надостьової на шиї.", "Жовті зв'язки з'єднують дуги хребців."]}, {"n": "10.17", "q": "Під час падіння з висоти жінка 40 років отримала травму. Рентгенологічно у хворої діагностовано компресійний перелом тіла поперекового хребця, збільшення кривини лордоза у поперековому відділі хребтового стовпа. Ушкодження якої зв'язки може призвести до такої зміни кривини хребтового стовпа?", "o": ["Передньої поздовжньої зв'язки.", "Задньої поздовжньої зв'язки.", "Жовтої зв'язки.", "Надостьової зв'язки.", "Міжпоперечної зв'язки."], "a": [0], "e": ["Передня поздовжня зв'язка обмежує розгинання; її ушкодження збільшує поперековий лордоз.", "Задня поздовжня зв'язка обмежує згинання.", "Жовта зв'язка з'єднує дуги.", "Надостьова зв'язка обмежує згинання.", "Міжпоперечні зв'язки обмежують бічні нахили."]}, {"n": "10.18", "q": "Жінка 47 років після падіння звернулася до лікаря-хірурга зі скаргами на гострий біль у куприковій ділянці. Під час обстеження виявлено ушкодження зв'язки, яка укріплює крижово-куприкове з'єднання та за будовою подібна до надостьової і жовтих зв'язок. Яка зв'язка зазнала ушкодження?", "o": ["Глибока задня крижово-куприкова зв'язка.", "Поверхнева задня крижово-куприкова зв'язка.", "Бічна крижово-куприкова зв'язка.", "Передня крижово-куприкова зв'язка.", "Глибока зв'язка."], "a": [1], "e": ["Глибока задня крижово-куприкова зв'язка — продовження задньої поздовжньої зв'язки.", "Поверхнева задня крижово-куприкова зв'язка — продовження надостьової й жовтих зв'язок.", "Бічна крижово-куприкова зв'язка — аналог міжпоперечних.", "Передня крижово-куприкова зв'язка — продовження передньої поздовжньої.", "«Глибока зв'язка» — неповна назва; вона відповідає задній поздовжній."]}, {"n": "10.19", "q": "Жінку 60 років із травмою грудної клітки після ДТП доставлено до травматологічного пункту лікарні. Під час рентгенологічного обстеження діагностовано ушкодження з'єднання другого правого ребра з грудниною. Які види з'єднань мають місце між хрящовою частиною II ребра і грудниною?", "o": ["Діартроз, синдесмоз.", "Синостоз, синдесмоз.", "Симфіз, синдесмоз.", "Синхондроз, синдесмоз.", "Геміартроз, синдесмоз."], "a": [3], "e": ["Діартроз за ключем не обрано. ⚠️ За багатьма підручниками II–VII ребра утворюють з грудниною справжні суглоби (діартроз) — уточніть у викладача.", "Синостоз — кісткове зрощення, тут його немає.", "Симфіз — хрящове з'єднання з щілиною.", "За ключем тесту — синхондроз і синдесмоз (хрящ ребра та зв'язки).", "Геміартроз — перехідна форма (напівсуглоб)."]}, {"n": "10.20", "q": "Чоловік 40 років упав із другого поверху і травмував грудну клітку. Під час рентгенологічного обстеження встановлено ушкодження з'єднання мечоподібного відростка з тілом груднини. Який вид з'єднання утворює мечоподібний відросток груднини з її тілом?", "o": ["Синостоз.", "Геміартроз.", "Синдесмоз.", "Симфіз.", "Діартроз."], "a": [0], "e": ["З'єднання мечоподібного відростка з тілом груднини у дорослих стає синостозом (кісткове зрощення).", "Геміартроз — напівсуглоб.", "Синдесмоз — сполучнотканинне з'єднання.", "Симфіз — хрящове з'єднання з щілиною (часто між рукояткою і тілом груднини).", "Діартроз — справжній суглоб."]}, {"n": "10.21", "q": "У новонародженої дитини виявлено спинномозкову грижу в ділянці XII грудного хребця. Незрощення якої анатомічної структури призвело до випинання спинного мозку за межі хребтового стовпа?", "o": ["Дуги хребця.", "Тіла хребця.", "Міжхребцевого диску.", "Суглобових відростків.", "Остистого відростка."], "a": [0], "e": ["Незрощення дуги хребця (spina bifida) дозволяє спинному мозку випинатися назад.", "Тіло хребця розташоване спереду від спинного мозку.", "Міжхребцевий диск з'єднує тіла.", "Суглобові відростки не закривають хребтовий канал ззаду.", "Остистий відросток — частина дуги, але дефект стосується всієї дуги."]}, {"n": "10.22", "q": "У чоловіка 45 років лікар підозрює запалення оболон головного мозку. Для отримання спинномозкової рідини хворому необхідно виконати діагностичну люмбальну пункцію між дугами поперекових хребців LIII–LIV. Крізь яку зв'язку повинна проникнути голка при виконанні пункції?", "o": ["Жовту зв'язку.", "Клубово-поперекову.", "Передню поздовжню.", "Задню поздовжню.", "Міжпоперечні зв'язки."], "a": [0], "e": ["Жовта зв'язка з'єднує дуги хребців, її проколює голка при люмбальній пункції.", "Клубово-поперекова зв'язка йде від поперечних відростків до клубового гребеня.", "Передня поздовжня зв'язка — на передній поверхні тіл.", "Задня поздовжня зв'язка — у хребтовому каналі на задній поверхні тіл.", "Міжпоперечні зв'язки — між поперечними відростками."]}, {"n": "10.23", "q": "Під час проведення поперекової (люмбальної) пункції для отримання спинномозкової рідини пункційну голку з мандреном вводять по серединній лінії між остистими відростками LIII–LIV хребців, через надостьову зв'язку. Який вид з'єднання між хребцями утворює надостьова зв'язка?", "o": ["Diarthrosis.", "Synostosis.", "Syndesmosis.", "Membrana.", "Symphysis."], "a": [2], "e": ["Діартроз — справжній суглоб.", "Синостоз — кісткове з'єднання.", "Надостьова зв'язка — сполучнотканинне з'єднання, тобто синдесмоз.", "Мембрана — різновид синдесмозу, але не зв'язка.", "Симфіз — хрящове з'єднання."]}, {"n": "10.24", "q": "Під час огляду дівчинки віком 2 роки 5 місяців лікар виявив незакриття переднього тім'ячка. У якому віці в нормі відбувається закриття fonticulus anterior?", "o": ["На 2–3 місяці життя.", "На 4–6 місяці життя.", "На другому році життя.", "На першому році життя.", "На третьому році життя."], "a": [2], "e": ["2–3 місяці — термін закриття заднього тім'ячка.", "4–6 місяців — ще рано для переднього тім'ячка.", "Переднє тім'ячко закривається на другому році життя.", "На першому році життя переднє тім'ячко ще відкрите.", "Третій рік — уже затримка закриття."]}, {"n": "10.25", "q": "Чоловік 30 років травмував крижову кістку. У травмпункті під час рентгенологічного обстеження діагностували ушкодження серединного гребеня крижової кістки. Який вид з'єднання, що утворився між крижовими хребцями внаслідок їх зрощення, ушкоджено?", "o": ["Синхондроз.", "Синостоз.", "Синдесмоз.", "Діартроз.", "Геміартроз."], "a": [1], "e": ["Синхондроз — з'єднання хрящем, у дорослих між крижовими хребцями його вже немає.", "Крижові хребці зростаються кістковою тканиною — синостоз.", "Синдесмоз — з'єднання сполучною тканиною.", "Діартроз — справжній суглоб.", "Геміартроз — напівсуглоб."]}, {"n": "10.26", "q": "У дівчинки віком 7 місяців лікар виявив незакриття заднього тім'ячка. У якому віці в нормі у дітей закривається fonticulus posterior?", "o": ["До 2-місячного віку.", "До народження.", "До 6-місячного віку.", "До кінця першого року життя.", "До кінця другого року життя."], "a": [0], "e": ["Заднє тім'ячко закривається до 2 місяців.", "До народження закриваються лише бічні тім'ячка у частини дітей.", "До 6 місяців — затримка закриття заднього тім'ячка.", "До кінця першого року — пізно для заднього тім'ячка.", "До кінця другого року закривається переднє тім'ячко."]}, {"n": "10.27", "q": "У чоловіка 30 років травмовано скронево-нижньощелепний суглоб. Під час оперативного втручання виявлено ушкодження структури, яка забезпечує відповідність суглобових поверхонь у цьому суглобі. Яка структура зазнала ушкодження в articulatio temporomandibularis?", "o": ["Диск.", "Меніск.", "Губа.", "Складка.", "Зв'язка."], "a": [0], "e": ["Суглобовий диск у скронево-нижньощелепному суглобі вирівнює невідповідність поверхонь.", "Меніски є в колінному суглобі.", "Суглобова губа є в плечовому та кульшовому суглобах.", "Синовіальні складки є в багатьох суглобах, але відповідність не створюють.", "Зв'язки укріплюють суглоб, але не вирівнюють поверхні."]}, {"n": "10.28", "q": "Жінка 40 років звернулася до лікаря-невролога зі скаргами на біль та обмеження рухів у поперековому відділі хребтового стовпа. Під час проведення комп'ютерно-томографічного обстеження лікар виявив ушкодження з'єднання між LV поперековим хребцем і крижовою кісткою. Які відростки п'ятого поперекового хребця беруть участь в утворенні цього суглоба?", "o": ["Processus articulares superiores.", "Processus articulares inferiores.", "Processus articulares superiores et inferiores.", "Processus articulares superiores et processus transversus.", "Processus articulares inferiores et processus transversus."], "a": [1], "e": ["Верхні суглобові відростки L5 з'єднуються з L4.", "Нижні суглобові відростки L5 з'єднуються з верхніми суглобовими відростками крижової кістки.", "Верхні відростки не беруть участі в з'єднанні з крижовою кісткою.", "Поперечні відростки не є суглобовими.", "Поперечні відростки не беруть участі в суглобі."]}, {"n": "10.29", "q": "Під час проходження військово-лікарської комісії (ВЛК) у чоловіка 25 років виявлено зменшення поперечного розміру грудної клітки та виражене випинання грудної клітки вперед. Який тип грудної клітки має місце в цьому випадку?", "o": ["Килеподібна грудна клітка.", "Бочкоподібна грудна клітка.", "Плоска грудна клітка.", "Лійкоподібна грудна клітка.", "Конічна грудна клітка."], "a": [0], "e": ["Килеподібна грудна клітка: поперечний розмір зменшений, груднина випнута вперед.", "Бочкоподібна — розширена в передньо-задньому напрямку, без випинання груднини.", "Плоска — передньо-задній розмір малий.", "Лійкоподібна — заглибина в нижній частині груднини.", "Конічна — розширюється донизу."]}, {"n": "10.30", "q": "У чоловіка 30 років лікар діагностував остеохондропатію. На рентгенограмі виявлено патологічні зміни в ділянці з'єднання I ребра з грудниною. Який вид з'єднання існує між першим ребром і грудниною?", "o": ["Diarthrosis.", "Synostosis.", "Syndesmosis.", "Synchondrosis.", "Symphysis."], "a": [3], "e": ["Діартроз — справжній суглоб; I ребро з грудниною його не утворює.", "Синостоз може з'явитися з віком, але типово — синхондроз.", "Синдесмоз — зв'язкове з'єднання.", "Хрящ I ребра з'єднується з грудниною безпосередньо — синхондроз.", "Симфіз — хрящове з'єднання зі щілиною."]}], "models": [["Хребтовий стовп", "sf:d6694f4a47ff4dc989f1aa1ce408ca1d", {"ru": "Позвоночный столб", "en": "Vertebral column"}], ["Грудна клітка", "sf:0f1aa77bf02e4d438f8630bd6c53b12e", {"ru": "Грудная клетка", "en": "Thoracic cage"}], ["Череп з підписами (шви)", "o3d:overview-skull", {"ru": "Череп с подписями (швы)", "en": "Labelled skull (sutures)"}]]}, {"id": "topic11", "title": "11. З’єднання верхньої кінцівки (juncturae membri superioris)", "tr": {}, "questions": [{"n": "11.1", "q": "Під час падіння на відведену руку пацієнт отримав травму плечової ділянки. Випинається надплечовий відросток лопатки, під ключицею пальпується головка плечової кістки. Активні рухи в плечовому суглобі відсутні. Які рухи в плечовому суглобі можливі в нормі?", "o": ["Flexio, extensio, rotatio.", "Flexio, extensio, abductio, adductio, rotatio, circumductio.", "Flexio, supinatio, pronatio.", "Flexio, extensio, rotatio, circumductio.", "Flexio, extensio, abductio, adductio."], "a": [1], "e": ["Неповний перелік: плечовий суглоб також дозволяє відведення, приведення і коловий рух.", "Плечовий суглоб кулястий, багатоосьовий: згинання, розгинання, відведення, приведення, обертання та коловий рух.", "Супінація і пронація відбуваються в променево-ліктьових суглобах, а не в плечовому.", "Пропущено відведення та приведення.", "Пропущено обертання та коловий рух."]}, {"n": "11.2", "q": "У пацієнта 65 років після падіння на витягнуту руку з'явився біль у ділянці анатомічної табакерки, набряк і обмеження рухів у променево-зап'ястковому суглобі. На рентгенограмі виявлено перелом човноподібної кістки зап'ястка без зміщення. На знімку також визначається розширення та накопичення рідини в S-подібній суглобовій щілині складного блокоподібного та одноосьового суглоба. Яке з'єднання кісток верхньої кінцівки ушкоджене?", "o": ["Променево-зап'ястковий суглоб (art. radiocarpalis).", "Середньозап'ястковий суглоб (articulationes mediocarpalis).", "Зап'ястково-п'ясткові суглоби (articulationes carpometacarpales).", "П'ястково-фалангові суглоби (articulationes metacarpophalangeae).", "Акроміально-ключичний суглоб (art. acromioclavicularis)."], "a": [1], "e": ["Променево-зап'ястковий суглоб еліпсоподібний, двоосьовий, щілина не S-подібна.", "Середньозап'ястковий суглоб — між проксимальним і дистальним рядами, має S-подібну щілину, за формою складний блокоподібний.", "Зап'ястково-п'ясткові суглоби (крім I пальця) — плоскі, малорухомі.", "П'ястково-фалангові суглоби — кулясті (еліпсоподібні), не S-подібні.", "Акроміально-ключичний суглоб належить поясу верхньої кінцівки, а не кисті."]}, {"n": "11.3", "q": "У чоловіка 56 років рентгенологічно виявлено багатоуламковий перелом головки плечової кістки з розривом капсули плечового суглоба. До якої анатомічної структури плечової кістки прикріплюється суглобова капсула плечового суглоба?", "o": ["Шийка лопатки.", "Надплечовий кінець ключиці.", "Анатомічна шийка плечової кістки.", "Хірургічна шийка плечової кістки.", "Дельтоподібна горбистість."], "a": [2], "e": ["Шийка лопатки — місце прикріплення капсули з боку лопатки, а не плечової кістки.", "Ключиця не бере участі в плечовому суглобі.", "Капсула плечового суглоба прикріплюється до анатомічної шийки плечової кістки.", "Хірургічна шийка розташована нижче, поза капсулою.", "Дельтоподібна горбистість — на тілі кістки, далеко від суглоба."]}, {"n": "11.4", "q": "До травматологічного пункту доставлено чоловіка 38 років із травмою правої кисті. Під час огляду виявлено різану рану в ділянці підвищення великого пальця правої кисті. Проксимальна фаланга І пальця не згинається. У якому суглобі порушені рухи?", "o": ["П'ястково-фаланговому суглобі.", "Зап'ястково-п'ястковому суглобі першого пальця.", "Міжфаланговому суглобі.", "Міжзап'ясткових суглобах.", "Променево-зап'ястковому суглобі."], "a": [0], "e": ["Згинання проксимальної фаланги відбувається в п'ястково-фаланговому суглобі.", "Зап'ястково-п'ястковий суглоб рухає п'ясткову кістку, а не фалангу.", "Міжфаланговий суглоб рухає дистальну фалангу відносно проксимальної.", "Міжзап'ясткові суглоби — між кістками зап'ястка.", "Променево-зап'ястковий суглоб рухає кисть загалом."]}, {"n": "11.5", "q": "Чоловік 45 років після падіння на долонну поверхню кисті скаржиться на біль і обмеження рухів в articulatio radiocarpalis. Під час обстеження виявлено ушкодження долонного краю зап'ясткової суглобової поверхні променевої кістки та головчастої кістки. Яка зв'язка, що з'єднує ці утвори, ушкоджена?", "o": ["Ligamentum collaterale carpi radiale.", "Ligamentum radiocarpale dorsale.", "Ligamentum collaterale carpi ulnare.", "Ligamentum radiocarpale palmare.", "Ligamentum ulnocarpale palmare."], "a": [3], "e": ["Променева колатеральна зв'язка йде від шилоподібного відростка променевої кістки до човноподібної.", "Тильна променево-зап'ясткова зв'язка розташована на тильній поверхні.", "Ліктьова колатеральна зв'язка йде від шилоподібного відростка ліктьової кістки.", "Долонна променево-зап'ясткова зв'язка йде від долонного краю променевої кістки до кісток зап'ястка, зокрема головчастої.", "Долонна ліктьово-зап'ясткова зв'язка починається від ліктьової кістки."]}, {"n": "11.6", "q": "У підлітка 13 років діагностовано травматичний вивих у плечовому суглобі з розривом зв'язки, що бере участь в утворенні «склепіння плеча». Яка зв'язка травмована?", "o": ["Ligamentum coracoacromiale.", "Ligamentum coracoclaviculare.", "Ligamentum coracohumerale.", "Ligamentum acromioclaviculare.", "Ligamentum conoideum."], "a": [0], "e": ["Дзьобо-надплечова зв'язка разом з акроміоном і дзьобоподібним відростком утворює склепіння плеча.", "Дзьобо-ключична зв'язка з'єднує лопатку з ключицею.", "Дзьобо-плечова зв'язка укріплює капсулу плечового суглоба зверху.", "Надплечово-ключична зв'язка укріплює акроміально-ключичний суглоб.", "Конусоподібна зв'язка — частина дзьобо-ключичної."]}, {"n": "11.7", "q": "У чоловіка 28 років під час інтенсивного тренування в спортзалі з'явився біль у ділянці підвищення великого пальця кисті (eminentia thenar) та неможливість протиставлення (опозиції) великого пальця іншим пальцям. Під час обстеження виявлено нестабільність у сідлоподібному суглобі кисті. Яке з'єднання кісток верхньої кінцівки ушкоджене?", "o": ["Зап'ястково-п'ястковий суглоб великого пальця (art. carpometacarpalis pollicis).", "П'ястково-фаланговий суглоб великого пальця (art. metacarpophalangea pollicis).", "Міжфаланговий суглоб великого пальця (art. interphalangea pollicis).", "Променево-зап'ястковий суглоб (art. radiocarpalis).", "Міжзап'ясткові суглоби (articulationes intercarpales)."], "a": [0], "e": ["Зап'ястково-п'ястковий суглоб великого пальця — сідлоподібний; він забезпечує протиставлення.", "П'ястково-фаланговий суглоб великого пальця не є сідлоподібним.", "Міжфаланговий суглоб — блокоподібний.", "Променево-зап'ястковий суглоб — еліпсоподібний.", "Міжзап'ясткові суглоби плоскі."]}, {"n": "11.8", "q": "У жінки 60 років унаслідок виробничої травми ушкоджено articulatio radiocarpalis із розривом зв'язок і ураженням суглобових поверхонь. До якого типу суглобів за формою суглобових поверхонь належить articulatio radiocarpalis?", "o": ["Articulatio sellaris.", "Articulatio elipsoidea.", "Articulatio condylaris.", "Articulatio plana.", "Articulatio cotylica."], "a": [1], "e": ["Сідлоподібний — зап'ястково-п'ястковий суглоб великого пальця.", "Променево-зап'ястковий суглоб еліпсоподібний, двоосьовий.", "Виростковий — колінний, скронево-нижньощелепний.", "Плоскі — міжзап'ясткові суглоби.", "Чашоподібний — кульшовий суглоб."]}, {"n": "11.9", "q": "У підлітка ушкоджена проксимальна суглобова поверхня променево-зап'ясткового суглоба. Чим вона утворена?", "o": ["Facies articularis carpalis radii et circumferentia articularis ulnae.", "Facies articularis carpalis radii.", "Facies articularis carpalis radii, discus articularis.", "Os scaphoideum, os lunatum, os triquetrum.", "Os scaphoideum, os lunatum, os pisiforme."], "a": [2], "e": ["Суглобове коло ліктьової кістки утворює дистальний променево-ліктьовий суглоб.", "Неповна відповідь: крім променевої кістки є ще суглобовий диск.", "Проксимальну поверхню утворюють зап'ясткова поверхня променевої кістки та суглобовий диск.", "Ці кістки утворюють дистальну (зап'ясткову) поверхню суглоба.", "Горохоподібна кістка не входить до променево-зап'ясткового суглоба."]}, {"n": "11.10", "q": "Жінка 65 років, яка страждає на остеопороз, впала на витягнуту ліву руку. Вона звернулася до лікаря зі скаргами на сильний біль і деформацію в ліктьовій ділянці. Найімовірніший діагноз — задній вивих у ліктьовому суглобі з можливим супутнім переломом вінцевого відростка ліктьової кістки. Яке зчленування відіграє найбільшу роль у стабільності ліктьового суглоба?", "o": ["Головки променевої кістки з головочкою виростка плечової кістки.", "Головки променевої кістки з променевою вирізкою ліктьової кістки.", "Блоку плечової кістки з блокоподібною вирізкою ліктьової кістки.", "Головки плечової кістки з суглобовою западиною лопатки.", "Шийки променевої кістки з кільцеподібною зв'язкою."], "a": [2], "e": ["Плечо-променеве зчленування менше впливає на стабільність.", "Проксимальний променево-ліктьовий суглоб забезпечує обертання.", "Блок плечової кістки з блоковою вирізкою ліктьової кістки — основа стабільності ліктьового суглоба.", "Це плечовий, а не ліктьовий суглоб.", "Кільцеподібна зв'язка утримує головку променевої кістки, але не є головним стабілізатором."]}, {"n": "11.11", "q": "У баскетболіста — вивих в articulatio carpometacarpalis pollicis, травмовані зв'язки суглоба, суглобові поверхні кістки-трапеції та основи І-ої п'ясткової кістки. Який за формою суглобових поверхонь articulatio carpometacarpalis pollicis?", "o": ["Articulatio elipsoidea.", "Articulatio plana.", "Articulatio sellaris.", "Articulatio condylaris.", "Articulatio spheroidea."], "a": [2], "e": ["Еліпсоподібний — променево-зап'ястковий суглоб.", "Плоскі — міжзап'ясткові суглоби.", "Зап'ястково-п'ястковий суглоб великого пальця — сідлоподібний.", "Виростковий — колінний суглоб.", "Кулястий — плечовий суглоб."]}, {"n": "11.12", "q": "До травматологічного пункту доставлено чоловіка 38 років із травмою верхньої кінцівки. Під час рентгенологічного обстеження діагностовано внутрішньосуглобовий перелом проксимального епіфіза плечової кістки. Яка структура плечової кістки ушкоджена?", "o": ["Головка плечової кістки.", "Хірургічна шийка.", "Гребінь великого горбка.", "Гребінь малого горбка.", "Малий горбок."], "a": [0], "e": ["Головка плечової кістки знаходиться всередині суглоба.", "Хірургічна шийка — поза суглобом.", "Гребінь великого горбка — поза суглобом.", "Гребінь малого горбка — поза суглобом.", "Малий горбок — поза суглобом."]}, {"n": "11.13", "q": "У чоловіка 56 років діагностовано посттравматичний вивих плечового суглоба. У пацієнта ушкоджена зв'язка, що утворює склепіння плеча. Яка зв'язка ушкоджена?", "o": ["Дзьобо-плечова зв'язка.", "Сухожилок довгої голівки двоголового м'яза плеча.", "Дзьобо-надплечова зв'язка.", "Дзьобо-ключична зв'язка.", "Поперечна зв'язка лопатки."], "a": [2], "e": ["Дзьобо-плечова зв'язка укріплює капсулу, але не утворює склепіння.", "Сухожилок довгої голівки двоголового м'яза проходить через порожнину суглоба.", "Дзьобо-надплечова зв'язка утворює склепіння плеча.", "Дзьобо-ключична зв'язка з'єднує лопатку з ключицею.", "Верхня поперечна зв'язка лопатки перекидається над вирізкою лопатки."]}, {"n": "11.14", "q": "У чоловіка 78 років, хворого на ревматоїдний артрит, виявлено обмеження рухів в суглобах кисті, незначна припухлість п'ястково-фалангового суглоба I пальця. Який за формою і функцією п'ястково-фаланговий суглоб I пальця?", "o": ["Articulatio sellaris.", "Articulatio spheroidea.", "Articulatio ginglymus.", "Articulatio elipsoidea.", "Articulatio plana."], "a": [3], "e": ["Сідлоподібним є зап'ястково-п'ястковий суглоб великого пальця.", "Кулястими є п'ястково-фалангові суглоби II–V пальців.", "Блокоподібні — міжфалангові суглоби.", "За ключем тесту п'ястково-фаланговий суглоб I пальця — еліпсоподібний.", "Плоскі — міжзап'ясткові суглоби."]}, {"n": "11.15", "q": "У чоловіка 45 років діагностовано артроз articulatio sternoclavicularis, який призвів до обмеження рухів у плечовому суглобі. До якого суглоба за функцією наближається груднинно-ключичний суглоб?", "o": ["Articulatio spheroidea.", "Articulatio plana.", "Articulatio trochoidea.", "Articulatio sellaris.", "Articulatio cotylica."], "a": [0], "e": ["Груднинно-ключичний суглоб сідлоподібний, але завдяки диску функціонально наближається до кулястого.", "Плоскі суглоби — малорухомі.", "Обертовий суглоб — одноосьовий.", "За формою він сідлоподібний, але питання про функцію.", "Чашоподібний — кульшовий суглоб."]}, {"n": "11.16", "q": "У людей похилого віку incisura scapulae може бути сприйнята як вогнище дегенерації кістки, особливо при вапнюванні зв'язки, яка разом з incisura scapulae утворює отвір. Яка власна зв'язка лопатки звапнована?", "o": ["Ligamentum sternoclaviculare anterius.", "Ligamentum transversum scapulae inferius.", "Ligamentum coracoacromiale.", "Ligamentum coracohumerale.", "Ligamentum transversum scapulae superius."], "a": [4], "e": ["Передня груднинно-ключична зв'язка належить груднинно-ключичному суглобу.", "Нижня поперечна зв'язка лопатки перекидається біля шийки лопатки, а не над вирізкою.", "Дзьобо-надплечова зв'язка утворює склепіння плеча.", "Дзьобо-плечова зв'язка йде до плечової кістки.", "Верхня поперечна зв'язка лопатки разом з вирізкою утворює отвір для надлопаткового нерва."]}, {"n": "11.17", "q": "У чоловіка 56 років діагностовано артрит articulatio cubiti, ознакою якого є біль та зменшення обсягу рухів. Відносно яких осей виконуються рухи в ліктьовому суглобі?", "o": ["Лобової, вертикальної.", "Лобової, стрілової.", "Стрілової, вертикальної.", "Вертикальної.", "Лобової, стрілової, вертикальної."], "a": [0], "e": ["Згинання/розгинання — навколо лобової осі, пронація/супінація — навколо вертикальної.", "Навколо стрілової осі в ліктьовому суглобі рухів немає.", "Згинання навколо лобової осі не враховано.", "Згинання не враховано.", "Відведення і приведення (стрілова вісь) у ліктьовому суглобі неможливі."]}, {"n": "11.18", "q": "У жінки 56 років, хворої на ревматоїдний артрит, виникла деформація міжфалангових суглобів кисті. Рухи в суглобах обмежені. Які рухи виконуються в міжфалангових суглобах у нормі?", "o": ["Circumductio.", "Abductio, adductio.", "Rotatio.", "Flexio, extensio.", "Supinatio, pronatio."], "a": [3], "e": ["Коловий рух можливий у багатоосьових суглобах.", "Відведення і приведення — у п'ястково-фалангових суглобах.", "Обертання в міжфалангових суглобах неможливе.", "Міжфалангові суглоби блокоподібні: тільки згинання і розгинання.", "Супінація і пронація — у променево-ліктьових суглобах."]}, {"n": "11.19", "q": "У підлітка важка травма — зруйновані суглобові поверхні променево-зап'ясткового суглоба (articulatio radiocarpalis), розірвані зв'язки, рухи в суглобі неможливі. Які рухи виконуються в articulatio radiocarpalis в нормі?", "o": ["Rotatio, flexio, extensio.", "Flexio, extensio, abductio, adductio, circumductio.", "Extensio, abductio, adductio.", "Flexio, abductio, adductio, rotatio.", "Rotatio, abductio, adductio."], "a": [1], "e": ["Обертання в променево-зап'ястковому суглобі неможливе.", "Еліпсоподібний суглоб: згинання, розгинання, відведення, приведення і коловий рух.", "Пропущено згинання та коловий рух.", "Обертання неможливе.", "Обертання неможливе, пропущено згинання і розгинання."]}, {"n": "11.20", "q": "У чоловіка 78 років після травми кисті виник біль в ділянці основи п'ясткової кістки І пальця, що посилювався при осьовому навантаженні та ротації. На рентгенограмі — звуження суглобової щілини. Яке з'єднання кісток верхньої кінцівки ушкоджено?", "o": ["Зап'ястково-п'ястковий суглоб великого пальця.", "П'ястково-фаланговий суглоб великого пальця.", "Міжфаланговий суглоб великого пальця.", "Променево-зап'ястковий суглоб.", "Міжзап'ясткові суглоби."], "a": [0], "e": ["Біль в основі I п'ясткової кістки при ротації та осьовому навантаженні — ознака ураження зап'ястково-п'ясткового суглоба великого пальця.", "П'ястково-фаланговий суглоб розташований біля голівки п'ясткової кістки.", "Міжфаланговий суглоб — між фалангами.", "Променево-зап'ястковий суглоб — проксимальніше.", "Міжзап'ясткові суглоби — між кістками зап'ястка."]}, {"n": "11.21", "q": "Внаслідок травми (падіння) у чоловіка 45 років виник повний вивих надплечового кінця ключиці. Пальпація ділянки надплечово-ключичного суглоба дуже болюча. Які зв'язки були розірвані під час травми?", "o": ["Ligg. acromioclaviculare, trapezoideum, conoideum.", "Ligg. sternoclavicularia anterius et posterius.", "Ligg. costoclaviculare, interclaviculare.", "Ligg. glenohumeralia.", "Ligg. coracohumerale, coracoclaviculare."], "a": [0], "e": ["При повному вивиху надплечового кінця ключиці розриваються надплечово-ключична та обидві частини дзьобо-ключичної зв'язки (трапецієподібна й конусоподібна).", "Груднинно-ключичні зв'язки укріплюють інший кінець ключиці.", "Реброво-ключична і міжключична зв'язки — біля груднинного кінця.", "Суглобово-плечові зв'язки укріплюють плечовий суглоб.", "Дзьобо-плечова зв'язка належить плечовому суглобу."]}, {"n": "11.22", "q": "У чоловіка 56 років виникла виробнича травма кисті. Рентгенологічно встановлено перелом кісток, які утворюють між собою, в механічному відношенні, тверду основу кисті. Які суглоби ушкоджені?", "o": ["Articulatio carpometacarpalis pollicis.", "Articulationes carpometacarpales, intercarpales.", "Articulatio interphalangeae manus.", "Articulatio radiocarpalis.", "Articulatio metacarpophalangeae."], "a": [1], "e": ["Зап'ястково-п'ястковий суглоб великого пальця — рухомий.", "Тверду основу кисті утворюють кістки зап'ястка і II–V п'ясткові кістки, з'єднані міжзап'ястковими та зап'ястково-п'ястковими суглобами.", "Міжфалангові суглоби рухомі.", "Променево-зап'ястковий суглоб рухомий.", "П'ястково-фалангові суглоби рухомі."]}, {"n": "11.23", "q": "Чоловік 78 років посковзнувся на тротуарі і при падінні вдарився кистю; він скаржиться на біль, обмеження рухів в променево-зап'ястковому суглобі. Які рухи можливі в променево-зап'ястковому суглобі?", "o": ["Flexio, extensio, rotatio.", "Flexio, extensio, abductio, adductio, circumductio.", "Flexio, extensio, circumductio.", "Abductio, adductio, rotatio.", "Abductio, adductio, circumductio."], "a": [1], "e": ["Обертання в променево-зап'ястковому суглобі неможливе.", "Еліпсоподібний суглоб: згинання, розгинання, відведення, приведення і коловий рух.", "Пропущено відведення і приведення.", "Обертання неможливе.", "Пропущено згинання і розгинання."]}, {"n": "11.24", "q": "Під час військових навчань у медичний пункт госпіталізовано пораненого з осколковою раною кисті. На рентгенограмі виявлено перелом головок п'ясткових кісток. Які суглоби кисті травмовані?", "o": ["Articulatio radiocarpalis.", "Articulatio intercarpales.", "Articulatio mediocarpalis.", "Articulatio carpometacarpalis pollicis.", "Articulatio metacarpophalangeae."], "a": [4], "e": ["Променево-зап'ястковий суглоб не включає п'ясткових кісток.", "Міжзап'ясткові суглоби — між кістками зап'ястка.", "Середньозап'ястковий суглоб — між рядами зап'ястка.", "Зап'ястково-п'ястковий суглоб I пальця утворений основою I п'ясткової кістки.", "Головки п'ясткових кісток утворюють п'ястково-фалангові суглоби."]}, {"n": "11.25", "q": "У дитини 6 років діагностовано надсуглобовий надвиростковий перелом плечової кістки з ушкодженням присереднього капсульно-зв'язкового апарата. Яка зв'язка ушкоджена?", "o": ["Ligamentum anulare radii.", "Ligamentum quadratum.", "Ligamentum collaterale ulnare.", "Ligamentum collaterale radiale.", "Ligamentum transversum humeri."], "a": [2], "e": ["Кільцеподібна зв'язка охоплює головку променевої кістки.", "Квадратна зв'язка — між шийкою променевої кістки і ліктьовою кісткою.", "Ліктьова колатеральна зв'язка — присередня, йде від присереднього надвиростка.", "Променева колатеральна зв'язка — бічна.", "Поперечна зв'язка плеча — біля міжгорбкової борозни."]}, {"n": "11.26", "q": "На КТ-зображенні лікар виявив у чоловіка 45 років перелом ключиці в ділянці конусоподібного горбка на нижній поверхні ключиці. Рухи в суглобі обмежені внаслідок ушкодження зв'язки, що фіксується до tuberculum conoideum. Яка зв'язка фіксується до tuberculum conoideum claviculae?", "o": ["Ligamentum coracoclaviculare.", "Ligamentum sternoclaviculare anterius.", "Ligamentum sternoclaviculare posterius.", "Ligamentum coracoacromiale.", "Ligamentum interclaviculare."], "a": [0], "e": ["Дзьобо-ключична (її конусоподібна частина) фіксується до конусоподібного горбка ключиці.", "Передня груднинно-ключична зв'язка — біля груднинного кінця.", "Задня груднинно-ключична зв'язка — біля груднинного кінця.", "Дзьобо-надплечова зв'язка не кріпиться до ключиці.", "Міжключична зв'язка з'єднує груднинні кінці обох ключиць."]}, {"n": "11.27", "q": "У дитини 8 років після падіння на долонну поверхню кисті з'явився біль у зап'ястковій ділянці кисті біля «анатомічної табакерки». На рентгенограмі — перелом кісток проксимального ряду зап'ястка. Суглобову поверхню якого суглоба утворюють кістки проксимального ряду зап'ястка?", "o": ["Міжзап'ясткових суглобів.", "Променево-зап'ясткового суглоба.", "Зап'ястково-п'ясткових суглобів.", "П'ястково-фалангових суглобів.", "Дистального променево-ліктьового суглоба."], "a": [1], "e": ["Міжзап'ясткові суглоби — між кістками одного ряду.", "Кістки проксимального ряду утворюють дистальну суглобову поверхню променево-зап'ясткового суглоба.", "Зап'ястково-п'ясткові суглоби утворені дистальним рядом.", "П'ястково-фалангові суглоби утворені п'ястковими кістками і фалангами.", "Дистальний променево-ліктьовий суглоб утворений кістками передпліччя."]}, {"n": "11.28", "q": "У підлітка травмована ділянка променево-зап'ясткового суглоба (articulatio radiocarpalis). На рентгенограмі виявлено перелом трьох проксимальних кісток зап'ястка. Які кістки зап'ястка формують суглобову поверхню променево-зап'ясткового суглоба?", "o": ["Човноподібна, півмісяцева, тригранна кістки.", "Човноподібна, півмісяцева кістки, кістка-трапеція.", "Півмісяцева кістка, кістка-трапеція, горохоподібна кістка.", "Трапецієподібна, головчаста, гачкувата кістки.", "Човноподібна, півмісяцева, горохоподібна кістки."], "a": [0], "e": ["Човноподібна, півмісяцева і тригранна кістки утворюють суглобову поверхню променево-зап'ясткового суглоба.", "Трапеція належить до дистального ряду.", "Трапеція і горохоподібна не входять у суглоб.", "Це кістки дистального ряду.", "Горохоподібна кістка не входить у суглобову поверхню."]}, {"n": "11.29", "q": "При переломі променевої кістки у чоловіка 34 років лікар наклав гіпсову пов'язку так, щоб вона фіксувала обидва променево-ліктьові суглоби. Лікар виконав це тому, що ці суглоби є:", "o": ["Комбінованими.", "Комплексними.", "Складними.", "Двоосьовими.", "Багатоосьовими."], "a": [0], "e": ["Проксимальний і дистальний променево-ліктьові суглоби комбіновані: працюють одночасно.", "Комплексні суглоби мають внутрішньосуглобові диски або меніски.", "Складний суглоб має більше двох суглобових поверхонь в одній капсулі.", "Ці суглоби одноосьові.", "Ці суглоби одноосьові."]}, {"n": "11.30", "q": "Зсув яких суглобових поверхонь вийде за межі фізіологічної норми при вивиху плечового суглоба?", "o": ["Головка плечової кістки і суглобова западина лопатки.", "Головка плечової кістки й надплечовий відросток лопатки.", "Головка плечової кістки й надплечовий кінець ключиці.", "Суглобова западина лопатки й надплечовий кінець ключиці.", "Суглобова западина лопатки і груднинний кінець ключиці."], "a": [0], "e": ["При вивиху плечового суглоба зміщуються головка плечової кістки та суглобова западина лопатки.", "Головка плечової кістки з акроміоном не утворює суглоба.", "Головка плечової кістки не з'єднується з ключицею.", "Це не суглобові поверхні одного суглоба.", "Груднинний кінець ключиці з'єднується з грудниною."]}], "models": [["Верхня кінцівка з суглобами", "o3d:upper-limb", {"ru": "Верхняя конечность с суставами", "en": "Upper limb with joints"}], ["Обертальна манжета плеча", "o3d:rotator-cuff", {"ru": "Вращательная манжета плеча", "en": "Rotator cuff"}], ["Кисть і зап'ясток", "o3d:hand", {"ru": "Кисть и запястье", "en": "Hand and wrist"}]]}, {"id": "topic12", "title": "12. З’єднання нижньої кінцівки (juncturae membri inferioris)", "tr": {}, "questions": [{"n": "12.1", "q": "При переломі тазової кістки у чоловіка 45 років був травмований nervus obturatorius, який виходить на стегно через закритий волокнистою перетинкою затульний отвір. До якого типу з'єднань відноситься membrana obturatoria?", "o": ["Синхондроз.", "Синостоз.", "Синдесмоз.", "Діартроз.", "Півсуглоб."], "a": [2], "e": ["Синхондроз — з'єднання хрящем.", "Синостоз — кісткове зрощення.", "Затульна перетинка — волокниста сполучнотканинна мембрана, тобто синдесмоз.", "Діартроз — справжній суглоб.", "Півсуглоб — перехідна форма, як лобковий симфіз."]}, {"n": "12.2", "q": "У чоловіка 36 років діагностована травма тазового пояса з переломом клубової кістки у ділянці нижньої передньої ості. При цьому уражені волокна капсульної зв'язки кульшового суглоба, що фіксується в місці перелому. Волокна якої зв'язки ушкоджені?", "o": ["Ligamentum capitis femoris.", "Zona orbicularis (пояс Вебера).", "Ligamentum transversum acetabuli.", "Ligamentum iliofemorale (зв'язка Бертіна).", "Ligamentum ischiofemorale."], "a": [3], "e": ["Зв'язка головки стегнової кістки лежить усередині суглоба, від ямки головки до вирізки западини.", "Коловий пояс — циркулярні волокна капсули навколо шийки стегна.", "Поперечна зв'язка западини перекидається над вирізкою кульшової западини.", "Клубово-стегнова зв'язка (Бертіна) починається від нижньої передньої клубової ості.", "Сідничо-стегнова зв'язка починається від сідничої кістки."]}, {"n": "12.3", "q": "Лікар-гінеколог вивчає у жінки 20 років розміри великого таза. Чим утворений pelvis major?", "o": ["Крилами клубових кісток і тілом LV.", "Крилами клубових кісток і тілом LIV.", "Крилами клубових кісток і тілом SI.", "Крилами клубових кісток, тілом LIV–LV.", "Крилами клубових кісток, тілом LV–SI."], "a": [0], "e": ["Великий таз обмежений крилами клубових кісток і тілом V поперекового хребця ззаду.", "Тіло LIV лежить вище великого таза.", "SI належить до малого таза (мис).", "LIV не бере участі в утворенні великого таза.", "SI входить до межі малого таза."]}, {"n": "12.4", "q": "Під час вибору акушером тактики ведення пологів дуже важливим є вимір поперечного діаметра (diameter transversa) входу в малий таз, який повинен бути дещо більшим за розмір головки плода. Який зовнішній розмір таза треба виміряти, щоб відняти від нього 14–15 см, чи поділити навпіл, щоб отримати розмір diameter transversa?", "o": ["Distantia interspinosa.", "Distantia intercristalis.", "Distantia intertrochanterica.", "Conjugata externa.", "Conjugata mediana."], "a": [1], "e": ["Міжостьова відстань не використовується для обчислення поперечного діаметра входу.", "Від міжгребеневої відстані (28–30 см) віднімають 14–15 см або ділять навпіл, щоб отримати поперечний діаметр входу.", "Міжвертлюгова відстань — інший зовнішній розмір.", "Від зовнішньої кон'югати віднімають 9–10 см для справжньої кон'югати.", "Серединна кон'югата — внутрішній розмір."]}, {"n": "12.5", "q": "Під час ультразвукового дослідження у вагітної жінки лікар передбачає надмірно велику вагу плода і вирішує питання щодо можливості народжування самостійно. Для остаточного діагнозу акушер ретельно вимірює зовнішні розміри таза. Використовуючи тазомір, акушер визначив відстань між верхнім краєм лобкового симфіза і остистим відростком V поперекового хребця. Який розмір визначив лікар і чому він дорівнює в нормі?", "o": ["Conjugata externa (20–21 см).", "Distantia interspinosa (25–27 см).", "Distantia intercristalis (28–30 см).", "Distantia intertrochanterica (30–32 см).", "Conjugata mediana (12,0–12,5 см)."], "a": [0], "e": ["Відстань від верхнього краю симфізу до остистого відростка LV — зовнішня кон'югата, 20–21 см.", "Міжостьова відстань — між передніми верхніми клубовими остями.", "Міжгребенева відстань — між клубовими гребенями.", "Міжвертлюгова відстань — між великими вертлюгами.", "Серединна кон'югата — внутрішній розмір від мису до нижнього краю симфізу."]}, {"n": "12.6", "q": "Вивчаючи рентгенограму дитини 9 місяців, лікар виявив недорозвинення кульшової западини з формуванням вродженого вивиху головки стегнової кістки в articulatio coxae. В тілах сідничої та лобкової кісток виявлені центри скостеніння. В тілі клубової кістки ядро відсутнє. На якому місяці в нормі з'являється центр скостеніння в клубовій кістці?", "o": ["5.", "6.", "7.", "8.", "9."], "a": [3], "e": ["5-й місяць не відповідає ключу тесту.", "6-й місяць не відповідає ключу тесту.", "7-й місяць не відповідає ключу тесту.", "За ключем тесту — 8-й місяць. ⚠️ У більшості підручників ядро клубової кістки з'являється першим, на 3–4-му місяці внутрішньоутробного розвитку; уточніть у викладача.", "9-й місяць не відповідає ключу тесту."]}, {"n": "12.7", "q": "У футболіста під час гри травмована нижня кінцівка у колінній ділянці. Обстежуючи спортсмена, лікар діагностував розрив внутрішньокапсульної зв'язки, що з'єднує між собою передні кінці обох менісків. Яка це зв'язка?", "o": ["Ligamentum meniscofemorale anterius.", "Ligamentum meniscofemorale posterius.", "Ligamentum cruciatum anterius.", "Ligamentum transversum genus.", "Ligamentum cruciatum posterius."], "a": [3], "e": ["Передня меніско-стегнова зв'язка йде від заднього кінця бічного меніска до стегна.", "Задня меніско-стегнова зв'язка йде від заднього кінця бічного меніска до присереднього виростка стегна.", "Передня хрестоподібна зв'язка з'єднує стегно з великогомілковою кісткою.", "Поперечна зв'язка коліна з'єднує передні кінці обох менісків.", "Задня хрестоподібна зв'язка з'єднує стегно з великогомілковою кісткою."]}, {"n": "12.8", "q": "У чоловіка 57 років під час падіння травмований надп'ятково-гомілковий суглоб. До яких суглобів відноситься articulatio talocruralis за формою суглобової поверхні і числом осей обертання?", "o": ["Циліндричний, одновісний.", "Блокоподібний, одновісний.", "Гвинтоподібний.", "Сідлоподібний, двохосьовий.", "Двовиростковий, двохосьовий."], "a": [1], "e": ["Циліндричний одноосьовий суглоб — серединний атланто-осьовий.", "Надп'ятково-гомілковий суглоб блокоподібний, одноосьовий: тільки згинання і розгинання.", "Гвинтоподібний — плечо-ліктьовий суглоб (різновид блокоподібного).", "Сідлоподібний — зап'ястково-п'ястковий суглоб великого пальця.", "Двовиростковий — колінний суглоб."]}, {"n": "12.9", "q": "У чоловіка 56 років, хворого на цукровий діабет, хірург видаляє дистальну частину стопи на рівні суглоба Лісфранка. Цей суглоб легко розчленовується тільки при розсіченні зв'язки, яку ще називають «ключем суглоба». Яку зв'язку перетинає хірург?", "o": ["Ligg. tarsometatarsalia dorsalia.", "Ligg. tarsometatarsalia plantaria.", "Ligamentum calcaneocuboideum plantare.", "Ligamentum cuneometatarsale interosseum.", "Ligamentum cuneocuboideum plantare."], "a": [3], "e": ["Тильні заплесно-плеснові зв'язки укріплюють суглоб, але не є ключем.", "Підошвові заплесно-плеснові зв'язки укріплюють суглоб, але не є ключем.", "Підошвова п'ятково-кубоподібна зв'язка належить суглобу Шопара.", "Міжкісткова клино-плеснова зв'язка (між присередньою клиноподібною і II плесновою) — ключ суглоба Лісфранка.", "Підошвова клино-кубоподібна зв'язка — між клиноподібною і кубоподібною кістками."]}, {"n": "12.10", "q": "При розслабленні пасивних «затягувань» стопи склепіння опускаються, стопа сплощується, що призводить до плоскостопості. Склепінна конструкція стопи підтримується завдяки формі кісток, міцності зв'язок (пасивні «затягування») і тонусу м'язів (активні «затягування»). Які зв'язки зміцнюють поздовжні склепіння стопи?", "o": ["Довга підошвова зв'язка, підошвова п'ятково-човноподібна зв'язка, підошвовий апоневроз.", "Підошвова клино-кубоподібна зв'язка, підошвовий апоневроз.", "Підошвова клино-човноподібна зв'язка, підошвовий апоневроз.", "Довга підошвова зв'язка, підошвові клино-човноподібні зв'язки.", "Довга підошвова зв'язка, підошвова клино-кубоподібна зв'язка."], "a": [0], "e": ["Поздовжні склепіння укріплюють довга підошвова, підошвова п'ятково-човноподібна зв'язки та підошвовий апоневроз.", "Клино-кубоподібна зв'язка укріплює поперечне склепіння.", "Клино-човноподібна зв'язка — не головна для поздовжніх склепінь.", "Клино-човноподібні зв'язки не є основними; пропущено апоневроз.", "Клино-кубоподібна зв'язка укріплює поперечне склепіння."]}, {"n": "12.11", "q": "У чоловіка 45 років виявлено ножове поранення сідничної ділянки з ураженням м'яза, судин і нервів, що проходять у малому сідничому отворі. Які зв'язки утворюють малий сідничий отвір?", "o": ["Ligamentum sacrotuberale, ligamentum sacrospinale.", "Ligamentum sacrotuberale, ligamentum iliolumbale.", "Ligamentum sacrotuberale, ligamentum sacroiliacum interosseum.", "Ligamentum sacrospinale, ligamentum sacroiliacum interosseum.", "Ligamentum sacrospinale, ligamentum iliolumbale."], "a": [0], "e": ["Малий сідничий отвір обмежений крижово-горбовою та крижово-остьовою зв'язками і малою сідничою вирізкою.", "Клубово-поперекова зв'язка не обмежує сідничі отвори.", "Міжкісткова крижово-клубова зв'язка укріплює крижово-клубовий суглоб.", "Міжкісткова крижово-клубова зв'язка не обмежує отворів.", "Клубово-поперекова зв'язка — від поперечних відростків LIV–LV до клубового гребеня."]}, {"n": "12.12", "q": "Студент, вивчаючи статеві ознаки і відмінності таза дорослої людини, порівнюючи жіночий і чоловічий таз, констатує, що у чоловіків підлобковий кут гострий (50–60 градусів), а у жінок — значно більший. Скільки градусів становить підлобковий кут у жінок?", "o": ["55–60°.", "60–65°.", "65–70°.", "70–75°.", "75–100°."], "a": [4], "e": ["55–60° — близько до чоловічого кута.", "60–65° — менше за жіночий кут.", "65–70° — менше за жіночий кут.", "70–75° — менше за типовий жіночий кут.", "У жінок підлобковий кут тупий, приблизно 75–100°."]}, {"n": "12.13", "q": "Під час пологів головка плода зупинилась біля входу в малий таз. Чим утворена межова лінія (linea terminalis), яка розділяє таз на два відділи — великий і малий?", "o": ["Linea arcuata, promontorium.", "Linea arcuata, promontorium, margo inferior symphysis pubis.", "Promontorium, linea arcuata, pecten ossis pubis, margo superior symphysis pubis.", "Linea arcuata, symphysis pubis, basis ossis sacri.", "Cornu sacrale, linea arcuata, symphysis pubis."], "a": [2], "e": ["Не враховано лобкові кістки та симфіз.", "Нижній край симфізу не входить до межової лінії.", "Межова лінія: мис, дугоподібні лінії клубових кісток, гребені лобкових кісток і верхній край симфізу.", "Основа крижової кістки не є частиною межової лінії, крім мису.", "Крижові ріжки розташовані внизу крижової кістки."]}, {"n": "12.14", "q": "При виборі акушером тактики ведення пологів дуже важливим є вимір справжньої кон'югати (conjugata vera, seu gynecologica), розмір якої повинен бути дещо більшим за розмір головки плода. Чому дорівнює розмір conjugata vera в нормі?", "o": ["7–8 см.", "8–9 см.", "9–9,5 см.", "9,5–10 см.", "10,5–11 см."], "a": [4], "e": ["7–8 см — значне звуження таза.", "8–9 см — звужений таз.", "9–9,5 см — звужений таз.", "9,5–10 см — нижня межа, менше норми.", "Справжня кон'югата в нормі — 10,5–11 см."]}, {"n": "12.15", "q": "Під час УЗД у вагітної жінки лікар діагностував надмірно великий розмір плода і вирішує питання про тактику ведення пологів. Для остаточного діагнозу акушер ретельно вимірює зовнішні розміри таза. Використовуючи тазомір, акушер визначив відстань між передніми верхніми остями клубових кісток. Який розмір визначив лікар у жінки і чому він дорівнює?", "o": ["Distantia interspinosa (25–27 см).", "Distantia intercristalis (28–30 см).", "Distantia intertrochanterica (30–32 см).", "Conjugata externa (20–21 см).", "Diameter obliquus (12 см)."], "a": [0], "e": ["Відстань між передніми верхніми клубовими остями — distantia interspinosa, 25–27 см.", "Міжгребенева відстань — між найвіддаленішими точками клубових гребенів.", "Міжвертлюгова відстань — між великими вертлюгами.", "Зовнішня кон'югата — від симфізу до LV.", "Косий діаметр — внутрішній розмір входу."]}, {"n": "12.16", "q": "Після травми нижньої кінцівки у чоловіка 49 років значно обмежені рухи у кульшовому суглобі. Яким є кульшовий суглоб за формою суглобових поверхонь і числом осей обертання?", "o": ["Articulatio trochoidea.", "Articulatio ginglymus.", "Articulatio sellaris.", "Articulatio spheroidea.", "Articulatio cotylica."], "a": [4], "e": ["Обертовий суглоб — одноосьовий.", "Блокоподібний суглоб — одноосьовий.", "Сідлоподібний суглоб — двоосьовий.", "Кулястий суглоб — так класифікують плечовий; кульшовий — його різновид.", "Кульшовий суглоб — чашоподібний (горіхоподібний) різновид кулястого, багатоосьовий."]}, {"n": "12.17", "q": "У чоловіка 45 років виникла травма articulatio genus. У пацієнта ушкоджені додаткові утвори в порожнині суглоба, які збільшують конгруентність суглобових поверхонь. Внаслідок цього цей суглоб відноситься до комплексних суглобів. Які утвори зазнали ушкодження?", "o": ["Диски.", "Меніски.", "Хрящова губа.", "Вивороти синовіальної оболонки.", "Зв'язки."], "a": [1], "e": ["Диски є у скронево-нижньощелепному та груднинно-ключичному суглобах.", "Меніски колінного суглоба збільшують конгруентність поверхонь, тому суглоб комплексний.", "Хрящова губа є в плечовому та кульшовому суглобах.", "Вивороти синовіальної оболонки — кишені суглобової порожнини.", "Зв'язки укріплюють суглоб, але не роблять його комплексним."]}, {"n": "12.18", "q": "Під час обстеження лікар виявив у чоловіка 67 років остеосаркому малогомілкової кістки. Пухлина стискає судину, яка проходить через отвір в товщі міжкісткової перетинки гомілки. До якого типу з'єднання відноситься міжкісткова перетинка?", "o": ["Синхондроз.", "Синдесмоз.", "Синсаркоз.", "Синостоз.", "Діартроз."], "a": [1], "e": ["Синхондроз — з'єднання хрящем.", "Міжкісткова перетинка гомілки — волокниста мембрана, синдесмоз.", "Синсаркоз — з'єднання м'язами.", "Синостоз — кісткове зрощення.", "Діартроз — справжній суглоб."]}, {"n": "12.19", "q": "У чоловіка 56 років, хворого на цукровий діабет, виникла гангрена пальців стопи. Лікар планує екзартикуляцію дистальної частини стопи в поперечному суглобі заплесна (Шопара). Для проведення цього втручання необхідне розсічення зв'язки, яку називають «ключем суглоба». Яку зв'язку необхідно перерізати?", "o": ["Ligamentum bifurcatum.", "Ligamentum calcaneocuboideum plantare.", "Ligamentum plantare longum.", "Ligamentum calcaneonaviculare plantare.", "Ligamentum talonaviculare."], "a": [0], "e": ["Роздвоєна зв'язка (ligamentum bifurcatum) — ключ суглоба Шопара.", "Підошвова п'ятково-кубоподібна зв'язка укріплює суглоб, але не ключ.", "Довга підошвова зв'язка укріплює склепіння.", "Підошвова п'ятково-човноподібна зв'язка підтримує головку надп'яткової кістки.", "Надп'ятково-човноподібна зв'язка — тильна, не ключ суглоба."]}, {"n": "12.20", "q": "До певного віку у дітей на рентгенограмі можна бачити хрящові прошарки між кістками в ділянці кульшової западини. У якому віці відбувається повне зрощення кісток, що утворюють кульшову западину?", "o": ["5–6.", "9–10.", "11–13.", "13–16.", "18–24."], "a": [3], "e": ["У 5–6 років кістки западини ще розділені хрящем.", "У 9–10 років хрящ ще є.", "У 11–13 років зрощення лише починається.", "Кістки кульшової западини повністю зростаються у 13–16 років.", "У 18–24 роки зрощення вже завершене."]}, {"n": "12.21", "q": "У чоловіка 56 років травма кульшової ділянки. При цьому уражена зв'язка, яка проходить у товщі волокнистої перетинки капсули кульшового суглоба. Волокна якої зв'язки ушкоджені?", "o": ["Ligamentum capitis femoris.", "Zona orbicularis (пояс Вебера).", "Ligamentum transversum acetabuli.", "Ligamentum iliofemorale (зв'язка Бертіна).", "Ligamentum ischiofemorale."], "a": [1], "e": ["Зв'язка головки стегнової кістки лежить усередині суглоба.", "Коловий пояс (zona orbicularis) — волокна в товщі волокнистої перетинки капсули, що охоплюють шийку стегна.", "Поперечна зв'язка западини перекидається над вирізкою западини.", "Клубово-стегнова зв'язка — зовнішня, найпотужніша.", "Сідничо-стегнова зв'язка — зовнішня, на задній поверхні."]}, {"n": "12.22", "q": "У футболіста під час гри травмована нижня кінцівка в колінній ділянці. Обстежуючи спортсмена, лікар діагностував ушкодження присереднього меніска колінного суглоба та відрив від нього внутрішньосуглобової зв'язки. Яка зв'язка в articulatio genus ушкоджена?", "o": ["Ligamentum meniscofemorale anterius.", "Ligamentum meniscofemorale posterius.", "Ligamentum cruciatum anterius.", "Ligamentum transversum genus.", "Ligamentum cruciatum posterius."], "a": [3], "e": ["Передня меніско-стегнова зв'язка пов'язана з бічним меніском.", "Задня меніско-стегнова зв'язка пов'язана з бічним меніском.", "Передня хрестоподібна зв'язка йде від стегна до великогомілкової кістки.", "Поперечна зв'язка коліна з'єднує передні кінці менісків, у тому числі присереднього.", "Задня хрестоподібна зв'язка йде від стегна до великогомілкової кістки."]}, {"n": "12.23", "q": "У жінки під час падіння травмована зв'язка надп'ятково-гомілкового суглоба, яка починається від присередньої кісточки великогомілкової кістки та прикріплюється до човноподібної, надп'яткової і п'яткової кісток. Яка зв'язка ушкоджена?", "o": ["Ligamentum collaterale mediale.", "Ligamentum collaterale laterale.", "Ligamentum talofibulare anterius.", "Ligamentum talofibulare posterius.", "Ligamentum cuneocuboideum plantare."], "a": [0], "e": ["Присередня (дельтоподібна) обхідна зв'язка починається від присередньої кісточки й кріпиться до човноподібної, надп'яткової і п'яткової кісток.", "Бічна обхідна зв'язка починається від бічної кісточки.", "Передня надп'ятково-малогомілкова зв'язка — частина бічного комплексу.", "Задня надп'ятково-малогомілкова зв'язка — частина бічного комплексу.", "Підошвова клино-кубоподібна зв'язка — на підошві."]}, {"n": "12.24", "q": "У людини крижово-клубовий суглоб малорухомий і дуже міцний. Навіть маса тулуба не може змістити крижову кістку вниз і вперед. Яка зв'язка, що укріплює цей суглоб, є найміцнішою?", "o": ["Ligamentum sacroiliacum anterius.", "Ligamentum sacroiliacum interosseum.", "Ligamentum sacroiliacum posterius.", "Ligamentum iliolumbale.", "Ligamentum sacrotuberale."], "a": [1], "e": ["Передні крижово-клубові зв'язки тонкі.", "Міжкісткові крижово-клубові зв'язки — найміцніші, з'єднують горбистості крижової та клубової кісток.", "Задні крижово-клубові зв'язки міцні, але слабші за міжкісткові.", "Клубово-поперекова зв'язка з'єднує LIV–LV з клубовою кісткою.", "Крижово-горбова зв'язка обмежує сідничі отвори."]}, {"n": "12.25", "q": "У жінки при вертикальному положенні тіла площина верхнього отвору малого таза нахилена вперед і вниз, утворюючи з горизонтальною площиною кут — нахил таза (inclinatio pelvis). Чому дорівнює цей кут у ранньому дитинстві?", "o": ["40°.", "45–50°.", "50–60°.", "60–65°.", "75–100°."], "a": [0], "e": ["У ранньому дитинстві нахил таза менший — близько 40°.", "45–50° — проміжне значення.", "50–60° — нахил таза дорослої людини.", "60–65° — більший за норму.", "75–100° — величина підлобкового кута у жінок."]}, {"n": "12.26", "q": "У жінки 56 років діагностовано внутрішньосуглобовий перелом стегнової кістки. На МРТ-зображенні візуалізується зміщення головки стегнової кістки по відношенню до кульшової западини. Яка зв'язка, що фіксує головку стегнової кістки до кульшової западини, ушкоджена?", "o": ["Зв'язка головки стегнової кістки.", "Коловий пояс.", "Стегновий нерв.", "Затульний нерв.", "Затульна артерія."], "a": [0], "e": ["Зв'язка головки стегнової кістки з'єднує головку стегна з кульшовою западиною.", "Коловий пояс охоплює шийку стегна, а не фіксує головку до западини.", "Стегновий нерв — не зв'язка.", "Затульний нерв — не зв'язка.", "Затульна артерія — не зв'язка (її гілка проходить у зв'язці головки)."]}, {"n": "12.27", "q": "На рентгенограмі кісток тазового пояса візуалізуються всі три частини тазової кістки, відокремлені широкими проміжками, що відповідають на рентгенограмі хрящу. До якого віку можлива візуалізація хряща між частинами тазової кістки?", "o": ["До 10 років.", "До 16 років.", "До 20 років.", "До 22 років.", "До 25 років."], "a": [1], "e": ["До 10 років хрящ ще видно, але це не верхня межа.", "Хрящ між частинами тазової кістки видно приблизно до 16 років.", "До 20 років кістки вже зрослися.", "До 22 років кістки вже зрослися.", "До 25 років кістки вже зрослися."]}, {"n": "12.28", "q": "У жінки 65 років травма кульшового суглоба. Виявлений внутрішньосуглобовий крововилив. Яка зв'язка розірвана, що в нормі перешкоджає надмірному розгинанню, приведенню і обертанню досередини стегна у кульшовому суглобі?", "o": ["Ligamentum transversum acetabuli.", "Ligamentum capitis femoris.", "Zona orbicularis (пояс Вебера).", "Ligamentum iliofemorale (зв'язка Бертіна).", "Ligamentum ischiofemorale."], "a": [3], "e": ["Поперечна зв'язка западини доповнює кульшову западину.", "Зв'язка головки стегнової кістки — внутрішньосуглобова.", "Коловий пояс охоплює шийку стегна.", "Клубово-стегнова зв'язка гальмує розгинання, приведення та обертання стегна досередини.", "Сідничо-стегнова зв'язка гальмує обертання досередини, але не є головною."]}, {"n": "12.29", "q": "У чоловіка 45 років, хворого на цукровий діабет, виникла гангрена пальців стопи. Лікар виконує екзартикуляцію дистальної частини стопи в поперечному суглобі заплесна (суглобі Шопара), розсікаючи при цьому ligamentum bifurcatum (яку ще називають «ключем суглоба»). Які суглоби стопи утворюють поперечний суглоб заплесна (суглоб Шопара)?", "o": ["Articulatio calcaneocuboidea, articulatio cuneonavicularis.", "Articulatio calcaneocuboidea, articulatio subtalaris.", "Articulati
