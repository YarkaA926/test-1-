ие лимфатического узла", "en": "Lymph node structure"}], ["Травний тракт", "sf:8c4c69035f4f4773813533d7ca56e516", {"ru": "Пищеварительный тракт", "en": "Gastrointestinal tract"}]]}, {"id": "topic31b", "title": "31. Залози внутрішньої секреції", "tr": {"ru": "31. Железы внутренней секреции", "en": "31. Endocrine glands"}, "questions": [{"n": "31.1", "q": "До ендокринологічного відділення направлено пацієнтку 45 років для оперативного втручання з приводу вузлового зоба. Під час операції хірург повинен бути особливо обережним, щоб не ушкодити прищитоподібні залози, які розташовані на задній поверхні щитоподібної залози, адже вони регулюють кальцієвий обмін і функцію нервово-м’язової системи. Скільки в нормі прищитоподібних залоз?", "o": ["2.", "4.", "6.", "8.", "16."], "a": [1], "e": ["Двох залоз замало: зазвичай є верхня і нижня пара.", "У нормі прищитоподібних залоз чотири (дві верхні і дві нижні).", "Шість — можливий варіант, але не норма.", "Вісім — не норма.", "Шістнадцять — не норма."]}, {"n": "31.2", "q": "У чоловіка 45 років, хворого на цукровий діабет, спостерігаються скарги на сухість у ротовій порожнині, постійний свербіж шкіри, яка вкрита численними фурункулами. Відзначається різке зниження зору, біль у ділянці серця та кінцівках, що пов’язано з розвитком поліневриту. Під час обстеження виявлені ознаки мікро- та макроангіопатії. Лабораторні дослідження показали, що рівень глюкози в крові значно перевищує норму. Функція якого гормону знижена у цього пацієнта?", "o": ["Трийодтиронину.", "Кальцитоніну.", "Паратирину.", "Інсуліну.", "Глюкогону."], "a": [3], "e": ["Трийодтиронін — гормон щитоподібної залози.", "Кальцитонін знижує рівень кальцію.", "Паратирин регулює кальцій.", "Цукровий діабет пов’язаний з нестачею інсуліну, що знижує рівень глюкози.", "Глюкагон підвищує рівень глюкози."]}, {"n": "31.3", "q": "До ендокринолога звернулася 45-річна жінка зі скаргами на відчуття тиску в ділянці шиї, утруднене ковтання та періодичний біль у цій зоні. При огляді лікар виявив збільшення щитоподібної залози, пальпаторно – нерівномірну щільність тканини та наявність вузлів. УЗД показало неоднорідність структури паренхіми та підозрілі гіпоехогенні ділянки, що можуть свідчити про злоякісне перетворення паренхіми. Якої будови паренхіма щитоподібної залози в нормі?", "o": ["Трабекулярної.", "Фолікулярної.", "Альвеолярної.", "Трубчастої.", "Ацинарної."], "a": [1], "e": ["Трабекулярна будова характерна для надниркових залоз і печінки.", "Паренхіма щитоподібної залози складається з фолікулів, заповнених колоїдом.", "Альвеолярна будова — у молочних залоз.", "Трубчаста будова — у потових залоз.", "Ацинарна будова — у підшлункової залози."]}, {"n": "31.4", "q": "До ендокринолога звернувся 17-річний хлопець з ознаками затримки статевого дозрівання. Під час огляду лікар відзначив недорозвиненість зовнішніх статевих органів, відсутність волосся на статевій ділянці та тулубі, гіпотрофію м’язів. Зріст пацієнта значно перевищує середній для його віку, що пояснюється затримкою процесів скостеніння епіфізарних зон, а також наявною диспропорцією тіла (довгі кінцівки, вузькі плечі). Аналіз сперми показав відсутність сперматозоїдів. Лабораторне дослідження крові виявило низький рівень тестостерону. Які клітини в нормі продукують тестостерон у чоловічому організмі?", "o": ["Інтерстиційні ендокриноцити (клітини Лейдіга) паренхіми яєчка.", "Парафолікулярні ендокриноцити (С-клітини) щитоподібної залози.", "Інсулоцити острівців підшлункової залози.", "Норепінефроцити мозкової речовини надниркових.", "Епінефроцити мозкової речовини надниркових залоз."], "a": [0], "e": ["Тестостерон виробляють інтерстиційні клітини Лейдіга яєчка.", "С-клітини виробляють кальцитонін.", "Інсулоцити виробляють інсулін і глюкагон.", "Норепінефроцити виробляють норадреналін.", "Епінефроцити виробляють адреналін."]}, {"n": "31.5", "q": "У чоловіка 45 років виявлено порушення функції щитоподібної залози. Під час обстеження зафіксовано зменшення у крові кількості гормонів (трийодтиронину і тетрайодтиронину) гормонів, що потрапляють в кровоносне русло із структурно-функціональної одиниці щитоподібної залози. Що є структурно-функціональною одиницею щитоподібної залози?", "o": ["Часточки.", "Строма.", "Частки.", "Тироцити.", "Фолікули."], "a": [4], "e": ["Часточка — група фолікулів.", "Строма — сполучна тканина.", "Частки — великі частини органа.", "Тироцити — клітини фолікула.", "Структурно-функціональна одиниця щитоподібної залози — фолікул."]}, {"n": "31.6", "q": "Лікар обстежує у новонародженого щитоподібну залозу і враховує походження залози. До якої групи за походженням належить щитоподібна залоза?", "o": ["Групи адреналової системи.", "Неврогенної групи.", "Бранхіогенних залоз.", "Ентодермальних залоз кишкової трубки.", "Мезодермальних залоз."], "a": [2], "e": ["Адреналова група — надниркові залози.", "Неврогенна група — гіпофіз, епіфіз.", "Щитоподібна залоза належить до бранхіогенних залоз (похідних глоткового апарату).", "Ентодермальні залози кишки — підшлункова залоза.", "Мезодермальні — кірка наднирників, статеві залози."]}, {"n": "31.7", "q": "У чоловіка 56 років під час проведення УЗД обстеження виявлено пухлиноподібний утвір щитоподібної залози. Лікар пальпаторно підтвердив наявність вузла у збільшеному перешийку щитоподібної залози. На рівні якого утвору пальпується перешийок щитоподібної залози?", "o": ["Під’язикової кістки.", "V хряща трахеї.", "Щитоподібного хряща.", "Верхніх рогів щитоподібного хряща.", "Дуги перснеподібного хряща, I–III хрящів трахеї."], "a": [4], "e": ["Під’язикова кістка лежить вище.", "V хрящ трахеї — нижче.", "Щитоподібний хрящ лежить вище перешийка.", "Верхні роги — значно вище.", "Перешийок лежить на рівні дуги перснеподібного хряща і I–III хрящів трахеї."]}, {"n": "31.8", "q": "У жінки 20 років після народження дитини відсутня лактація, що може бути ознакою низького рівня окситоцину в кровоносному руслі. Які ядра гіпоталамуса продукують окситоцин?", "o": ["Присереднє та бічне сосочкові ядра.", "Надперехресне та передзорове.", "Пришлуночкове та надзорове ядра.", "Вентроприсереднє та дорсоприсереднє ядра гіпоталамуса.", "Лійкове ядро та передзорове."], "a": [2], "e": ["Сосочкові ядра пов’язані з пам’яттю.", "Надперехресне ядро регулює добові ритми.", "Окситоцин і вазопресин виробляють пришлуночкове і надзорове ядра.", "Ці ядра регулюють апетит.", "Лійкове ядро виробляє рилізинг-фактори."]}, {"n": "31.9", "q": "У чоловіка 39 років виявлено позитивний симптом Труссо – при перетягуванні плеча джгутом до зникнення пульсу на 2–3 хвилини настає типова тетанічна контрактура кисті у вигляді «руки акушера». Зниження в крові якого гормону прищитоподібних залоз може викликати тетанію?", "o": ["Трийодтиронину.", "Тетрайодтиронину.", "Тиротропіну.", "Кальцитоніну.", "Паратирину."], "a": [4], "e": ["Трийодтиронін — тиреоїдний гормон.", "Тетрайодтиронін — тиреоїдний гормон.", "Тиротропін — гормон гіпофіза.", "Кальцитонін знижує кальцій.", "Нестача паратирину спричиняє гіпокальціємію і тетанію."]}, {"n": "31.10", "q": "У чоловіка 30 років виявлена хромофорна аденома гіпофізу. Рентгенологічно визначається збільшення розмірів пухлини за останні півроку і деформація турецького сідла. Чоловіку призначене трансназальне введення радіоактивної речовини в гіпофізну ямку з мотою деструкції гіпофіза. Близькість розташування якої пазухи дозволяє здійснити цей оперативний доступ?", "o": ["Sinus maxillaris.", "Sinus sphenoidalis.", "Sinus frontalis.", "Sinus cavernosus.", "Cellulae ethmoidales."], "a": [1], "e": ["Верхньощелепна пазуха лежить далеко.", "Клиноподібна пазуха лежить під турецьким сідлом, що дає трансназальний доступ до гіпофіза.", "Лобова пазуха лежить спереду.", "Печериста пазуха — венозна, збоку від сідла.", "Решітчасті комірки лежать спереду."]}, {"n": "31.11", "q": "У чоловіка 34 років спостерігається типова клінічна картина дифузного токсичного зоби (хвороби Грейвса): виражений екзофтальм, значне збільшення щитоподібної залози, загальна слабкість у м’язах, тремтіння кінцівок, підвищена збудливість, а також прогресуюче схуднення, незважаючи на збережений апетит. Під час лабораторного обстеження виявлено значне підвищення концентрації якого гормону в крові пацієнта?", "o": ["Паратирину.", "Кальцитоніну.", "Тетрайодтиронину.", "Тиротропіну.", "Інсуліну."], "a": [2], "e": ["Паратирин регулює кальцій.", "Кальцитонін знижує кальцій.", "Хвороба Грейвса — надлишок тироксину (тетрайодтироніну).", "Тиротропін при хворобі Грейвса знижений.", "Інсулін не пов’язаний."]}, {"n": "31.12", "q": "У жінки 22 років спостерігається випадіння і стоншення волосся та вугровий висип на шкірі обличчя та тулуба. У крові виявлено підвищення рівня тестостерону. Функція яких залоз може бути порушеною?", "o": ["Прищитоподібні залози.", "Щитоподібна залоза.", "Шишкоподібна залоза.", "Надниркові залози і яєчники.", "Підшлункова залоза."], "a": [3], "e": ["Прищитоподібні залози регулюють кальцій.", "Щитоподібна залоза не виробляє андрогенів.", "Шишкоподібна залоза — мелатонін.", "Андрогени у жінок виробляють надниркові залози і яєчники.", "Підшлункова залоза — інсулін."]}, {"n": "31.13", "q": "У чоловіка 40 років спостерігаються напади тетанії, проявами якої є мимовільні скороченнями м’язів верхньої кінцівки та лиця. Під час нападу формується характерне положення кисті («рука акушера») та вираз обличчя у вигляді «сардонічної посмішки». Відомо, що причиною цього стану є дефіцит паратгормона, який призводить до гіпокальціємії та підвищеної нервово-м’язової збудливості. Патологія якої залози є причиною розвитку цього стану у пацієнта?", "o": ["Щитоподібної залози.", "Прищитоподібних залоз.", "Гіпофіза.", "Надниркових залоз.", "Підшлункової залози."], "a": [1], "e": ["Щитоподібна залоза виробляє тироксин і кальцитонін.", "Паратгормон виробляють прищитоподібні залози.", "Гіпофіз не виробляє паратгормону.", "Надниркові залози — кортикостероїди.", "Підшлункова залоза — інсулін."]}, {"n": "31.14", "q": "До дитячого ендокринолога звернулися батьки 10-річної дівчинки, які помітили зміни у зовнішності дитини протягом останнього року. Голос дівчинки став грубішим, з’явилося інтенсивне оволосіння на обличчі, грудях та в ділянці живота. Під час огляду лікар виявив гіпертрофію клітора та часткове зрощення великих соромітних губ, при цьому внутрішні жіночі статеві органи (матка, яєчники) збережені. Такі ознаки свідчать про розвиток жіночого несправжнього гермафродитизму, що, зазвичай, пов’язано з надмірною продукцією андрогенів. Патологію якого органа повинен запідозрити лікар у цьому випадку?", "o": ["Матки", "Гіпофіза.", "Щитоподібної залози.", "Прищитоподібних залоз.", "Надниркових залоз."], "a": [4], "e": ["Матка андрогенів не виробляє.", "Гіпофіз не виробляє андрогенів.", "Щитоподібна залоза — тиреоїдні гормони.", "Прищитоподібні — паратгормон.", "Надлишок андрогенів у дівчинки — патологія кіркової речовини надниркових залоз."]}, {"n": "31.15", "q": "До лікаря-терапевта звернувся 38-річний чоловік зі скаргами на швидкий набір маси тіла, відкладання жира переважно в ділянці тулуба та обличчя. Пацієнт також відзначає слабкість у м’язах та появу червоних смуг розтягнення на шкірі живота і стегон. При огляді лікар виявив характерні ознаки: «місяцеподібне» обличчя, ожиріння центрального типу, атрофію м’язів кінцівок. Після проведення лабораторних та інструментальних досліджень встановлено діагноз: хвороба Кушинга, що пов’язана з гіперфункцією кіркової речовини надниркових залоз. Яких поверхонь і країв не мають надниркові залози?", "o": ["Діафрагмової поверхні.", "Передньої поверхні.", "Задньої поверхні.", "Верхнього краю.", "Ниркової поверхні."], "a": [0], "e": ["Надниркові залози мають передню, задню і ниркову поверхні, діафрагмової поверхні немає.", "Передня поверхня є.", "Задня поверхня є.", "Верхній край є.", "Ниркова поверхня є."]}, {"n": "31.16", "q": "До ендокринолога звернулися батьки 12-річного хлопчика, які помітили, що у дитини з’явилися ознаки статевого дозрівання значно раніше, ніж у його однолітків: збільшення зовнішніх статевих органів, поява волосся на статевій ділянці, зміна голосу. При огляді лікар підтвердив передчасну статеву зрілість. Відомо, що в нормі продукується гормон (мелатонин), який гальмує активацію гіпоталамо-гіпофізарно-гонадної взаємодії та затримує початок статевого дозрівання. Цей гормон синтезується залозою, що відноситься до проміжному мозку. Яка залоза продукує мелатонин?", "o": ["Шишкоподібна залоза.", "Гіпофіз.", "Таламус.", "Гіпоталамус.", "Епіталамус."], "a": [0], "e": ["Мелатонін виробляє шишкоподібна залоза (епіфіз).", "Гіпофіз не виробляє мелатоніну.", "Таламус — сенсорний центр.", "Гіпоталамус виробляє рилізинг-гормони.", "Епіталамус включає епіфіз, але залоза — шишкоподібна."]}, {"n": "31.17", "q": "У чоловіка 50 років під час проведення магнітно-резонансної томографії голови виявлено значне збільшення розмірів турецького сідла, а також деформацію передніх нахилених відростків клиноподібної кістки. Пухлина якої ендокринної залози може викликати подібне руйнування кісткових структур черепа?", "o": ["Glandula pinealis.", "Hypophysis.", "Glandula suprarenalis.", "Thymus.", "Glandula thyroidea."], "a": [1], "e": ["Шишкоподібна залоза лежить у мозку, не в сідлі.", "Пухлина гіпофіза руйнує турецьке сідло.", "Надниркова залоза — у черевній порожнині.", "Тимус — у середостінні.", "Щитоподібна залоза — на шиї."]}, {"n": "31.18", "q": "У жінки діагностовано синдром Конна, який характеризується наявністю аденоми клубочкової зони кіркової речовини надниркових залоз. Ця пухлина призводить до надмірної секреції специфічних гормонів, що викликає розвиток стійкої артеріальної гіпертензії, порушення водно-електролітного балансу та гіпокаліємію. Який гормон синтезується в клубочковій зоні кіркової речовини надниркових залоз?", "o": ["Альдостерон.", "Кортизол, кортикостерон.", "Андростендіол.", "Андрогени, естрогени, прогестерон.", "Адреналін, норадреналін."], "a": [0], "e": ["Клубочкова зона виробляє мінералокортикоїди — альдостерон.", "Кортизол — пучкова зона.", "Андрогени — сітчаста зона.", "Статеві гормони — сітчаста зона.", "Адреналін — мозкова речовина."]}, {"n": "31.19", "q": "У чоловіка 35 років діагностовано синдром Іценко–Кушинга (гіперадренокортицизм) як наслідок надмірної продукції глюкокортикоїдів. Клінічна картина включає виражене ожиріння з характерним відкладенням жиру на тулубі та обличчі, артеріальну гіпертензію, гіперглікемію та глюкозурію, остеопороз, атрофію статевих залоз, імпотенцію. Розвиток цього симптомокомплексу пов’язаний з ураженням паренхіми надниркових залоз. Якими структурними компонентами представлена паренхіма надниркових залоз?", "o": ["Фолікулами.", "Перекладками.", "Кірковою та мозковою речовиною.", "Острівцями.", "Часточками."], "a": [2], "e": ["Фолікули — щитоподібна залоза.", "Перекладки — строма.", "Паренхіма надниркових залоз — кіркова і мозкова речовина.", "Острівці — підшлункова залоза.", "Часточки — тимус, щитоподібна залоза."]}, {"n": "31.20", "q": "У пацієнта діагностовано порушення функції щитоподібної залози. Під час лабораторного обстеження встановлено зниження концентрації основних тиреоїдних гормонів — трийодтироніну та тетрайодтироніну (тироксину) у крові, що свідчить про гіпофункцію залози. Цей стан може супроводжуватися уповільненням обміну речовин, загальною слабкістю, набряками та іншими клінічними проявами. Вкажіть, яка структура є основною структурно-функціональною одиницею щитоподібної залози?", "o": ["Тироцит.", "Фолікул.", "Часточка.", "Строма.", "Частка."], "a": [1], "e": ["Тироцит — клітина фолікула.", "Структурно-функціональна одиниця щитоподібної залози — фолікул.", "Часточка — група фолікулів.", "Строма — сполучна тканина.", "Частка — велика частина органа."]}, {"n": "31.21", "q": "У чоловіка 40 років діагностовано хворобу Реклінгхаузена, яка розвивається внаслідок гіперфункції прищитоподібних залоз. Під час обстеження виявлено численні патологічні зміни: наявність каменів у нирках (нефролітіаз), деформацію кісток грудної клітки та кінцівок, відсутність зубів, а також часті спонтанні переломи, що свідчить про тяжкі порушення кальцієво-фосфорного обміну. Який гормон виявлено у значно підвищеній концентрації в плазмі крові цього пацієнта?", "o": ["Кальцитонін", "Паратгормон.", "Трийодтиронін.", "Тетрайодтиронін.", "Тиротропін."], "a": [1], "e": ["Кальцитонін знижує кальцій.", "При гіперпаратиреозі (хвороба Реклінгхаузена) підвищений паратгормон.", "Трийодтиронін — тиреоїдний гормон.", "Тетрайодтиронін — тиреоїдний гормон.", "Тиротропін — гіпофіз."]}, {"n": "31.22", "q": "У жінки діагностовано інсулому — пухлину, що розвивається з β-клітин острівців Лангерганса. Внаслідок надмірної секреції інсуліну виникає різке зниження рівня глюкози в крові (гіпоглікемія). Клінічні прояви включають повторювані напади, які починаються з вираженої слабкості, відчуття голоду, тривоги та страху, тремтіння кінцівок, серцебиття, підвищеного потовиділення. Яка залоза уражена інсуломою?", "o": ["Щитоподібна залоза.", "Прищитоподібні залози.", "Гіпофіз.", "Надниркові залози.", "Підшлункова залоза."], "a": [4], "e": ["Щитоподібна залоза інсуліну не виробляє.", "Прищитоподібні — паратгормон.", "Гіпофіз — тропні гормони.", "Надниркові — стероїди і катехоламіни.", "Інсулома — пухлина β-клітин острівців підшлункової залози."]}, {"n": "31.23", "q": "У чоловіка з підозрою на гіперпаратиреоз лікар проводить перевірку симптома Хвостека. Під час легкого постукування перкусійним молоточком по щоці в ділянці проєкції лицевого нерва спостерігається мимовільне скорочення м’язів обличчя. Така реакція є характерною ознакою тетанії, що свідчить про підвищену нервово-м’язову збудливість. Знижена концентрація якого гормону прищитоподібних залоз у крові може призвести до розвитку тетанії?", "o": ["Кальцитоніну.", "Паратирину.", "Трийодтиронину.", "Тетрайодтироніну.", "Тиротропіну."], "a": [1], "e": ["Кальцитонін знижує кальцій.", "Нестача паратирину спричиняє гіпокальціємію і тетанію (симптом Хвостека).", "Трийодтиронін — тиреоїдний гормон.", "Тетрайодтиронін — тиреоїдний гормон.", "Тиротропін — гіпофіз."]}, {"n": "31.24", "q": "До лікаря звернувся пацієнт із симптомами гострого стресу: різке підвищення артеріального тиску, прискорене серцебиття, розширення зіниць, блідість шкіри та відчуття тривоги. Такі прояви пов’язані з активацією симпато-адреналової системи та підвищеною секрецією гормонів мозкової речовини надниркових залоз. Які гормони синтезують ендокриноцити мозкової речовини надниркових залоз?", "o": ["Глюкокортикоїди.", "Мінералокортикоїди.", "Статеві гормони.", "Окситоцин.", "Адреналін та норадреналін."], "a": [4], "e": ["Глюкокортикоїди — пучкова зона кірки.", "Мінералокортикоїди — клубочкова зона.", "Статеві гормони — сітчаста зона.", "Окситоцин — гіпоталамус.", "Мозкова речовина виробляє адреналін і норадреналін."]}, {"n": "31.25", "q": "Підвищення статевої активності у тварин і птахів у весняний період пояснюють зниженням секреції гормонів шишкоподібної залози, що відбувається під впливом яскравого освітлення та збільшення тривалості світлового дня. Така особливість дозволяє розглядати епіфіз як своєрідний «біологічний годинник», який регулює сезонні та добові ритми організму. Вкажіть, який гормон синтезується шишкоподібним тілом (corpus pineale)?", "o": ["Лютропін.", "Мелатонін та серотонін.", "Пролактин.", "Меланотропін.", "Паратирин"], "a": [1], "e": ["Лютропін — гіпофіз.", "Шишкоподібне тіло виробляє мелатонін і серотонін.", "Пролактин — гіпофіз.", "Меланотропін — гіпофіз.", "Паратирин — прищитоподібні залози."]}, {"n": "31.26", "q": "У клініку госпіталізовано чоловіка 45 років з ознаками гострої надниркової недостатності, відомої як синдром Уотергауза-Фрідеріксена. Пацієнт скаржиться на сильний біль у животі, повторні епізоди блювання, виражену артеріальну гіпотонію, гіпоглікемію, а також загальну слабкість. При обстеженні виявлено азотемію та множинні крововиливи у шкіру та слизові оболонки. Цей синдром розвивається внаслідок критичного зниження продукції глюкокортикоїдів клітинами надниркових залоз. Які клітини синтезують глюкокортикоїди?", "o": ["Ендокриноцити клубочкової зони.", "Ендокриноцити пучкової зони.", "Ендокриноцити сітчастої зони.", "Епінефроцити мозкової речовини.", "Норепінероцити."], "a": [1], "e": ["Клубочкова зона — альдостерон.", "Глюкокортикоїди синтезують клітини пучкової зони.", "Сітчаста зона — статеві гормони.", "Епінефроцити — адреналін.", "Норепінефроцити — норадреналін."]}, {"n": "31.27", "q": "Жінка 40 років звернулася до ендокринолога із ознаками гормонального дисбалансу: порушенням менструального циклу, появою ознак маскулінізації, а також змінами обміну речовин. Лікар запідозрив патологію кіркової речовини надниркових залоз, зокрема сітчастої зони. Які гормони синтезують ендокриноцити сітчастої зони надниркових залоз?", "o": ["Статеві гормони.", "Глюкокортикоїди.", "Мінералокортикоїди.", "Окситоцин.", "Адреналін, норадреналін."], "a": [0], "e": ["Сітчаста зона виробляє статеві гормони (андрогени).", "Глюкокортикоїди — пучкова зона.", "Мінералокортикоїди — клубочкова зона.", "Окситоцин — гіпоталамус.", "Катехоламіни — мозкова речовина."]}, {"n": "31.28", "q": "У жінки 30 років діагностовано хромофобну аденому гіпофіза. За даними рентгенологічного дослідження встановлено значне збільшення розмірів пухлини протягом останніх трьох місяців, що призвело до деформації турецького сідла. З метою деструкції гіпофіза жінці призначено трансназальне введення радіоактивної речовини безпосередньо в гіпофізну ямку. Крізь який анатомічний утвір, поверхня якої утворює стінку турецького сідла, здійснюється оперативний доступ через носові ходи?", "o": ["Sinus maxillaris.", "Sinus sphenoidalis.", "Sinus frontalis.", "Sinus cavernosus.", "Celiulae ethmoidaies."], "a": [1], "e": ["Верхньощелепна пазуха далеко від сідла.", "Верхня стінка клиноподібної пазухи утворює дно турецького сідла.", "Лобова пазуха лежить спереду.", "Печериста пазуха — венозна.", "Решітчасті комірки лежать спереду."]}, {"n": "31.29", "q": "До ендокринолога звернувся пацієнт із симптомами: зміни маси тіла, коливання артеріального тиску, підвищена дратівливість та порушення терморегуляції. Лікар призначив лабораторне дослідження рівня тиреотропного гормону (ТТГ), що синтезується в аденогіпофізі. Які основні функції виконує тиреотропний гормон гіпофіза?", "o": ["Стимулює ріст і дозрівання клітин щитоподібної залози, стимулює синтез і секрецію тиреоїдних гормонів.", "Стимулює ріст і дозрівання клітин кіркового шару надниркових залоз, синтез і вивільнення гормонів.", "Стимулює ріст і дозрівання фолікулів яєчника з наступним виходом з них есторгенів.", "Сприяє росту і розвитку кісток та інших тканин у ранньому віці.", "Ініціація та підтримання лактації."], "a": [0], "e": ["Тиреотропний гормон стимулює ріст клітин щитоподібної залози і секрецію тиреоїдних гормонів.", "Це функція АКТГ.", "Це функція ФСГ.", "Це функція гормону росту.", "Це функція пролактину."]}, {"n": "31.30", "q": "До ендокринологічного відділення звернувся пацієнт із симптомами порушення функції надниркових залоз: виражена слабкість, зниження артеріального тиску, зміни пігментації шкіри та порушення обміну речовин. Лікар призначив аналіз на рівень адренокортикотропного гормону (АКТГ), що синтезується в аденогіпофізі. Які основні функції виконує адренокортикотропний гормон гіпофіза?", "o": ["Стимулює ріст і дозрівання клітин щитоподібної залози, стимулює синтез і секрецію тиреоїдних гормонів.", "Стимулює ріст і дозрівання клітин кіркового шару надниркових залоз, синтез і вивільнення гормонів.", "Стимулює ріст і дозрівання фолікулів яєчника з наступним виходом з них есторгенів.", "Сприяє росту і розвитку кісток та інших тканин у ранньому віці.", "Ініціація та підтримання лактації."], "a": [1], "e": ["Це функція ТТГ.", "АКТГ стимулює кіркову речовину надниркових залоз і секрецію її гормонів.", "Це функція ФСГ.", "Це функція гормону росту.", "Це функція пролактину."]}, {"n": "31.31", "q": "До ендокринолога звернувся пацієнт із симптомами порушення обміну речовин: вираженою слабкістю, зниженням артеріального тиску, гіпоглікемією та схудненням. Лікар запідозрив недостатність кіркової речовини надниркових залоз, зокрема пучкової зони. Які гормони синтезують ендокриноцити пучкової зони надниркових залоз?", "o": ["Глюкокортикоїди.", "Мінералокортикоїди.", "Статеві гормони.", "Окситоцин.", "Адреналін та норадреналін."], "a": [0], "e": ["Пучкова зона виробляє глюкокортикоїди.", "Мінералокортикоїди — клубочкова зона.", "Статеві гормони — сітчаста зона.", "Окситоцин — гіпоталамус.", "Катехоламіни — мозкова речовина."]}], "models": [["Щитоподібна залоза", "sf:4400ccceaf62468aa6be1f2e99a6586a", {"ru": "Щитовидная железа", "en": "Thyroid gland"}], ["Нирки, наднирники і судини", "sf:17e3f54d85f34fafa53c752a9bc88b8d", {"ru": "Почки, надпочечники и сосуды", "en": "Kidneys, adrenals and vessels"}], ["Підшлункова залоза і дванадцятипала кишка", "sf:b34ba50e38fd455bae43bd07b7ed2d3b", {"ru": "Поджелудочная железа и двенадцатиперстная кишка", "en": "Pancreas and duodenum"}], ["Головний мозок", "sf:c973679113d740cb80d0b65f07ad17dc", {"ru": "Головной мозг", "en": "Brain"}]]}, {"id": "topic32", "title": "32. Узагальнення: спланхнологія", "tr": {"ru": "32. Обобщение: спланхнология", "en": "32. Review: splanchnology"}, "questions": [{"n": "32.1", "q": "У новонародженої дитини протягом першої доби педіатр помітив, що при смоктанні молоко потрапляє до носової порожнини. Про яку ваду розвитку свідчить цей факт?", "o": ["Атрезія стравоходу.", "Звуження стравоходу.", "Атрезія відхідника.", "Незрощення піднебінних відростків піднебінної кістки.", "Заяча губа."], "a": [3], "e": ["При атрезії стравоходу молоко зригується, а не потрапляє в ніс.", "Звуження стравоходу затримує їжу, але не спрямовує її в ніс.", "Атрезія відхідника не пов’язана зі смоктанням.", "Незрощення піднебінних відростків дає розщілину піднебіння — ротова порожнина сполучається з носовою.", "Заяча губа — дефект губи, сполучення з носом не обов’язкове."]}, {"n": "32.2", "q": "Мати привела на консультацію до стоматолога дитину з вадою язика. Лікар встановив аплазію (вроджена вада) м’язів язика. З чого розвиваються ці м’язи:", "o": ["Мезодерми нижньощелепних відростків І-ої зябрової дуги.", "Мезодерми верхньощелепних відростків І-ої зябрової дуги.", "Потиличних міотомів.", "Мезодерми ІІІ, ІV зябрових дуг.", "Мезодерми ІІ-ої зябрової дуги."], "a": [2], "e": ["Нижньощелепні відростки I дуги дають жувальні м’язи.", "Верхньощелепні відростки дають кістки обличчя.", "М’язи язика розвиваються з потиличних міотомів.", "III–IV дуги дають м’язи глотки і гортані.", "II дуга дає мімічні м’язи."]}, {"n": "32.3", "q": "Травмованому 25 років з переломом нижньої щелепи та кісток стінок носової порожнини проведена імобілізація (нижня щелепа фіксована до верхньої). Діастеми і міжзубні проміжки відсутні. Куди провести зонд для харчування хворого?", "o": ["Замолярну ямку (простір).", "Замолярний трикутник.", "Змикальну щілину.", "Щито-язикову протоку.", "Мигдаликову пазуху."], "a": [0], "e": ["Замолярний простір позаду останніх зубів сполучає присінок із власне ротовою порожниною.", "Замолярний трикутник — ділянка щелепи, не прохід.", "Змикальна щілина закрита.", "Щитоподібно-язикова протока заростає.", "Мигдаликова пазуха лежить у зіві."]}, {"n": "32.4", "q": "У деяких дітей переважає ротове дихання внаслідок надмірного розростання лімфоїдної тканини. Розростанням яких структур це зумовлено?", "o": ["Язикового мигдалика.", "Піднебінного мигдалика.", "Глоткового мигдалика.", "Трубного лівого.", "Трубного правого."], "a": [2], "e": ["Язиковий мигдалик носового дихання не порушує.", "Піднебінні мигдалики лежать у зіві.", "Розростання глоткового мигдалика (аденоїди) закриває хоани.", "Трубний мигдалик невеликий.", "Трубний мигдалик невеликий."]}, {"n": "32.5", "q": "У дитини зі скаргами на біль за грудниною, що посилюється при ковтанні та супроводжується кашлем, рентгенологічно виявлено стороннє тіло у товщі стінки стравоходу на рівні 5 грудного хребця. У ділянці якого звуження стравоходу пошкоджена його стінка?", "o": ["Проходження крізь діафрагму.", "Прилеглої дуги аорти.", "Перехрестя з лівим головним бронхом.", "Переходу у шлунок.", "Переходу глотки у стравохід."], "a": [2], "e": ["Діафрагмове звуження — на рівні IX–X хребців.", "Аортальне звуження — на рівні IV хребця.", "Бронхове звуження (перехрестя з лівим головним бронхом) — на рівні V грудного хребця.", "Перехід у шлунок — на рівні XI хребця.", "Перехід глотки в стравохід — на рівні VI шийного хребця."]}, {"n": "32.6", "q": "У хворого з опіком стравоходу через деякий час з’явилися симптоми запалення очеревини (перитоніту). Яка частина стравоходу пошкоджена?", "o": ["Черевна.", "Грудна.", "Шийна.", "Гортанна.", "Верхня."], "a": [0], "e": ["Черевна частина стравоходу вкрита очеревиною, тому її ушкодження дає перитоніт.", "Грудна частина лежить у середостінні.", "Шийна частина лежить на шиї.", "Гортанної частини стравоходу немає.", "Верхньої частини як відділу немає."]}, {"n": "32.7", "q": "В хірургічне відділення поступив хворий з різаною раною в правій підреберній ділянці. Під час ургентної операції хірург виявив, що ножем була пошкоджена печiнково-дванадцятипала зв'язка. Що розміщено в печiнково-дванадцятипалiй зв'язцi?", "o": ["Спільна жовчна протока, шлункова артерія.", "Ворiтна вена, верхня брижова артерія.", "Печiнкова артерія.", "Ворiтна печінкова вена, печiнкова артерія, спільна жовчна протока.", "Верхня брижова артерія, печiнкова артерія."], "a": [3], "e": ["Шлункові артерії лежать у печінково-шлунковій зв’язці.", "Верхня брижова артерія лежить нижче.", "Неповна відповідь.", "У печінково-дванадцятипалій зв’язці — ворітна вена, печінкова артерія і спільна жовчна протока.", "Верхня брижова артерія сюди не входить."]}, {"n": "32.8", "q": "У хворого, 60 років, внаслідок злоякісної пухлини великого сосочка дванадцятипалої кишки виникла обтураційна жовтяниця. Просвіт якої анатомічної структури стискується пухлиною?", "o": ["Міхурової протоки.", "Печінково-підшлункової ампули.", "Спільної печінкової протоки.", "Правої печінкової протоки.", "Лівої печінкової протоки."], "a": [1], "e": ["Міхурова протока лежить вище.", "У великому сосочку відкривається печінково-підшлункова ампула.", "Спільна печінкова протока лежить вище.", "Права печінкова протока — у печінці.", "Ліва печінкова протока — у печінці."]}, {"n": "32.9", "q": "Лікар виявив у дитини 14 років локальне враження паренхіми легені. Які структурно-функціональні одиниці складають паренхіму легені?", "o": ["Субсегменти.", "Сегменти.", "Частки.", "Ацинуси.", "Часточки."], "a": [3], "e": ["Субсегменти — хірургічні одиниці.", "Сегменти — хірургічні одиниці.", "Частки — макроскопічні частини.", "Паренхіму легені утворюють ацинуси.", "Часточки складаються з ацинусів."]}, {"n": "32.10", "q": "Лікар вирішує обстежити корінь легені у хлопчика 10 років і бере до уваги, що він входить у ворота легені. Яку ділянку легені буде обстежувати лікар?", "o": ["Основу легені.", "Верхівку легені.", "Середостінну поверхню.", "Діафрагмову поверхню.", "Міжчасткову поверхню."], "a": [2], "e": ["Основа легені звернена до діафрагми.", "Верхівка — найвища частина.", "Ворота легені розташовані на середостінній поверхні.", "Діафрагмова поверхня — основа.", "Міжчасткові поверхні — у щілинах."]}, {"n": "32.11", "q": "У дитини запалення легені ускладнилося ексудативним плевритом. В якому з перерахованих анатомічних утворень в основному накопичується серозна рідина?", "o": ["Sinus obliquus pericardii.", "Recessus costodiaphragmaticus pleurae.", "Recessus phrenicomediastinalis pleurae.", "Sinus transversus pericardii.", "Recessus costomediastinalis pleurae."], "a": [1], "e": ["Коса пазуха — осердя.", "Реброво-діафрагмовий закуток — найглибший, тут накопичується рідина.", "Діафрагмово-середостінний закуток малий.", "Поперечна пазуха — осердя.", "Реброво-середостінний закуток малий."]}, {"n": "32.12", "q": "У дівчинки 12 років при бронхоскопічному обстеженні лікар виявив зміни слизової оболонки трахеї в ділянці yтвору, який межує зi стравоходом. У ділянці якого утвору трахеї змінена слизова оболонка у дівчинки?", "o": ["Paries membranaceus.", "Carina tracheae.", "Lig. cricotracheale.", "Ligg. аnularia.", "Cartilagines tracheales."], "a": [0], "e": ["Перетинчаста стінка трахеї прилягає до стравоходу.", "Кіль — виступ у біфуркації.", "Перснеподібно-трахейна зв’язка — вгорі.", "Кільцеві зв’язки — між хрящами.", "Хрящі трахеї спереду і з боків."]}, {"n": "32.13", "q": "Лікар видаляє у дівчинки 13 років верхній язичковий сегмент. Ділянку якої частки легені у дівчинки видаляє лікар?", "o": ["Lobus inferior dexter.", "Lobus superior dexter.", "Lobus medius pulmonis dextri.", "Lobus inferior sinister.", "Lobus superior sinister."], "a": [4], "e": ["Права нижня частка язичкових сегментів не має.", "Права верхня частка не має язичкових сегментів.", "Середня частка має бічний і присередній сегменти.", "Ліва нижня частка — базальні сегменти.", "Язичкові сегменти належать верхній частці лівої легені."]}, {"n": "32.14", "q": "У хворого лівостороння защемлена пахвинна кила (грижа). У грижовому мішку петля кишки, яка має поздовжні стрічки та чепцеві привіски. Відрізок якої кишки защемлено?", "o": ["Прямої.", "Сигмоподібної.", "Клубової.", "Порожньої.", "Сліпої."], "a": [1], "e": ["Пряма кишка стрічок не має.", "Стрічки і чепцеві привіски — ознаки ободової кишки; ліворуч у пахвинній ділянці лежить сигмоподібна.", "Клубова кишка — тонка, без стрічок.", "Порожня кишка — тонка, без стрічок.", "Сліпа кишка лежить праворуч."]}, {"n": "32.15", "q": "Хворому з кишковою непрохідністю проведено резекцію частини поперечної ободової кишки. Скріз яку кількість листків вісцеральної очеревини здійснюється доступ до поперечної ободової кишки?", "o": ["1", "2", "3", "4", "5"], "a": [3], "e": ["Одного листка недостатньо.", "Двох листків недостатньо.", "Трьох листків недостатньо.", "Великий чепець, що прикриває поперечну ободову кишку, складається з чотирьох листків очеревини.", "П’яти листків немає."]}, {"n": "32.16", "q": "Серед багаточисельних причин чоловічого безпліддя може бути враження інтерстиціальних клітин Лейдіга і їх функції, яка пов`язана продукцією чоловічих гормонів. Де знаходяться ці клітини?", "o": ["В паренхімі яєчка.", "В над`яєчнику.", "В паренхімі передміхурової залози.", "В сім’яній залозі.", "Сечовому міхурі."], "a": [0], "e": ["Клітини Лейдіга розташовані в паренхімі (стромі) яєчка.", "Надъяєчник — рудимент.", "Передміхурова залоза не має клітин Лейдіга.", "Сім’яна залоза виробляє рідину.", "Сечовий міхур — не залоза."]}, {"n": "32.17", "q": "У літнього чоловіка ускладнений акт сечoвиведення. Яка частина сечівника найчастіше за віком звужується?", "o": ["Pars prostatica.", "Ostium urethrae externum.", "Fossa navicularis urethrae.", "Pars membranacea.", "Pars spongiosa."], "a": [0], "e": ["З віком розростається простата і звужує передміхурову частину сечівника.", "Зовнішній отвір з віком не звужується.", "Човноподібна ямка — розширення.", "Перетинчаста частина вузька від природи.", "Губчаста частина з віком не звужується."]}, {"n": "32.18", "q": "На гістологічних препаратах яєчка виявлено наявність сперматогенного епітелію. В яких структурах яєчка є цей епітелій?", "o": ["Rete testis.", "Tubuli seminiferi recti.", "Tubuli seminiferi contorti.", "Ductuli efferentes testis.", "Ductuli aberrantes."], "a": [2], "e": ["Сітка яєчка проводить сперматозоїди.", "Прямі канальці проводять.", "Сперматогенний епітелій — у звивистих сім’яних канальцях.", "Виносні проточки проводять.", "Відхильні проточки — рудименти."]}, {"n": "32.19", "q": "В процесі опускання яєчко доходить до передньої стінки живота (до глибокого кільця пахвинного канала) і, опускаючись в калитку, огортається оболонками, які є похідними м’язів, фасцій і шкіри передньої стінки живота. Похідним чого є m. cremaster?", "o": ["M. transversus abdominis.", "M. obliguus externus abdominis.", "M. psoas major.", "M. pyramidalis.", "M. rectus abdominis."], "a": [0], "e": ["М’яз-підіймач яєчка — похідна поперечного (і внутрішнього косого) м’язів живота.", "Зовнішній косий м’яз дає зовнішню сім’яну фасцію.", "Великий поперековий м’яз не бере участі.", "Пірамідальний м’яз не бере участі.", "Прямий м’яз не бере участі."]}, {"n": "32.20", "q": "Сім’явипорскувальна протока утворюється злиттям сім’явиносної протоки і вивідної протоки сім’яного пухирця і відкривається в:", "o": ["Pars prostatica urethra masculina.", "Pars spongiosa urethra masculina.", "Pars membranacea uretrha masculina.", "Ductuli prostatici.", "Rete testis."], "a": [0], "e": ["Сім’явипорскувальна протока відкривається в передміхурову частину сечівника.", "Губчаста частина приймає протоки цибулинно-сечівникових залоз.", "У перетинчасту частину протоки не відкриваються.", "Проточки простати — інші протоки.", "Сітка яєчка — у яєчку."]}, {"n": "32.21", "q": "В гінекологічне відділення поступила жінка, в якої діагностована киста яєчника. В результаті оперативного втручання яєчник був видалений. Лікар оглянув орган зовні. Яких поверхонь, країв чи кінців немає в яєчнику?", "o": ["Extremitas uterina.", "Facies medialis.", "Facies lateralis.", "Extremitas medialis.", "Margo liber."], "a": [3], "e": ["Матковий кінець є.", "Присередня поверхня є.", "Бічна поверхня є.", "Присереднього кінця в яєчника немає (є трубний і матковий).", "Вільний край є."]}, {"n": "32.22", "q": "В поліклініку, до гінеколога звернулась жінка, 35 років, зі скаргами на болі внизу живота. Лікар всебічно обстежив жінку і поставив діагноз – ендометрит (запалення ендометрію). Поверхня ендометрія гладенька і лише в каналі шийки матки знаходяться складки. Яка назва цих складок?", "o": ["Plicae palmatae.", "Plicae cervicales.", "Columna rugarum anterior.", "Columna rugarum posterior.", "Plicae longitudinalаe."], "a": [0], "e": ["Складки каналу шийки матки — пальмоподібні.", "Шийкових складок як терміну немає.", "Передній стовп — піхва.", "Задній стовп — піхва.", "Поздовжніх складок у шийці немає."]}, {"n": "32.23", "q": "В акушерсько-гінекологічному відділі під час пологів у жінки, 28 років, були розриви промежини, яку клініцисти називають промежиною у вузькому розумінні. Між якими анатомічними утвореннями знаходиться ця ділянка?", "o": ["Відхідником і куприком.", "Присінком піхви і відхідником.", "Відхідником і сідничими горбами.", "Куприком і зовнішніми статевими органами.", "Куприком і сідничими горбами."], "a": [1], "e": ["Між відхідником і куприком — задня частина ділянки.", "Промежина у вузькому розумінні — між присінком піхви і відхідником.", "Між відхідником і горбами — ямки.", "Від куприка до статевих органів — широке розуміння.", "Між куприком і горбами — задня межа."]}, {"n": "32.24", "q": "В гінекологічне відділення поліклініки звернулась жінка 30 років, яка поскаржилась на неможливість завагітніти. Лікар оглянув хвору і виявив, що в неї матка знаходиться в положенні retroflexio uteri. Це положення визначається:", "o": ["Кутом між тілом і шийкою матки, відкритому назад.", "Кутом між тілом і шийкою матки, відкритому вперед.", "Дном матки, направленому вперед.", "Дном матки, направленому назад.", "Нахилом матки вліво."], "a": [0], "e": ["Retroflexio — кут між тілом і шийкою, відкритий назад.", "Кут вперед — anteflexio.", "Дно вперед — anteversio.", "Дно назад — retroversio.", "Нахил убік — lateropositio."]}, {"n": "32.25", "q": "В клінічну лікарню поступив хворий чоловік, 48 років, з симптомами гострої ниркової недостатності, причиною якої явились тяжкі порушення серцевого ритму. Це привело до порушення ниркового кровотоку в системі кровоносних судин нефрону. Яких утворів, в тому числі і кровоносних, немає в системі нефрона?", "o": ["Arteriola glomerularis afferens.", "Arteriola glomerularis efferens.", "Pars distalis tubuli nephroni.", "A. arcuata.", "Glomerulus."], "a": [3], "e": ["Приносна артеріола належить судинній системі нефрона.", "Виносна артеріола належить судинній системі нефрона.", "Дистальна частина канальця — частина нефрона.", "Дугова артерія лежить на межі кірки і мозкової речовини і до нефрона не належить.", "Клубочок — частина нефрона."]}, {"n": "32.26", "q": "В фіксації нирок особливе місце має ниркова фасція. Вона, за допомогою тяжів волокнистої сполучної тканини, які пронизують жирову капсулу, з’єднується з волокнистою капсулою нирок. Чим утворена ниркова фасція?", "o": ["Переднирковим і позанирковим листками.", "Верхньонирковим і нижньонирковим листками.", "Присереднім і бічним листками.", "Передньоверхнім і задньонижнім листками.", "Передньоприсереднім і задньобічним листками."], "a": [0], "e": ["Ниркова фасція складається з переднього і заднього листків.", "Верхнього і нижнього листків немає.", "Присереднього і бічного листків немає.", "Таких листків немає.", "Таких листків немає."]}, {"n": "32.27", "q": "Після оперативного втручання у чоловіка, 48 років, з приводу пухлини нирки, необхідне всебічне обстеження внутрішніх структур органа. Мікроскопічне дослідження нирки дає можливість визначити структурно-функціональну одиницю нирки - нефрон. Які структури не входить до складу нефрона?", "o": ["Ductulli papillares.", "Glomerulus corpusculi renalis.", "Corpusculum renalis.", "Ansa nephroni.", "Pars proximalis, pars distalis tubuli nephroni."], "a": [0], "e": ["Сосочкові протоки належать до збірних шляхів, не до нефрона.", "Клубочок — частина нефрона.", "Ниркове тільце — частина нефрона.", "Петля — частина нефрона.", "Канальці — частина нефрона."]}, {"n": "32.28", "q": "В урологічне відділення по швидкій допомозі доставили жінку, 45 років, з нестерпними болями в ділянці черевної порожнини. При обстежені виявлено наявність каменю в ділянці верхнього відділу тазової частини сечоводу. Через які звуження пройшов камінь і викликав нестерпний біль у хворої?", "o": ["Звуження при переході з ниркової миски у сечовід і звуження при переході черевної частини в тазову.", "Звуження в верхній третині черевної частини сечоводу.", "Звуження в нижній третині тазової частини сечоводу.", "Звуження в середній третині тазової частини сечоводу.", "Звуження у внутрішньостінковій частині сечоводу."], "a": [0], "e": ["Камінь пройшов звуження при переході миски в сечовід і на межі черевної і тазової частин.", "Окремого звуження у верхній третині черевної частини немає.", "Нижнє звуження нижче каменя.", "Середина тазової частини — нижче.", "Внутрішньостінкове звуження — нижче."]}, {"n": "32.29", "q": "Оперативне втручання на нирці потребувало рентгенологічного дослідження сечовивідних шляхів нирки, ниркової пазухи. Що знаходяться в нирковій пазусі?", "o": ["Calices renales minores, calices renales majores, pelvis renalis.", "Corpusculum renalis.", "Ansa nephroni.", "Pars proximalis, pars distalis tubuli nephroni.", "Tubulus renalis colligens."], "a": [0], "e": ["У нирковій пазусі — малі і великі чашечки та ниркова миска.", "Ниркове тільце — у кірці.", "Петля — у мозковій речовині.", "Канальці — у паренхімі.", "Збірні трубочки — у паренхімі."]}, {"n": "32.30", "q": "Після народження дитини в нирці є повна кількість нефронів. В якому віці починають формуватися нефрони?", "o": ["На 6 тижні внутрішньоутробного розвитку.", "На 10 тижні врутрішньоутробного розвитку.", "На 30 тижні внутрішньоутробного розвитку", "У новонароджених.", "На першому році життя."], "a": [1], "e": ["На 6-му тижні лише закладається остаточна нирка.", "Нефрони починають формуватися приблизно на 8–10-му тижні внутрішньоутробного розвитку.", "На 30-му тижні нефрогенез уже завершується.", "У новонароджених нові нефрони не утворюються.", "На першому році нефрони не утворюються."]}, {"n": "32.31", "q": "У хворого внаслідок дефіциту паратгормона розвинулась тетанія – напади мимовільного скорочення м’язів верхньої кінцівки, лиця. При цьому виникає характерне положення кисті та міміки (так звані «рука акушера» та «сардонічна посмішка». Патологія якої залози у хворого?", "o": ["Щитоподібної.", "Прищитоподібних.", "Гіпофіза.", "Надниркових залоз.", "Підшлункової залози."], "a": [1], "e": ["Щитоподібна залоза паратгормону не виробляє.", "Паратгормон виробляють прищитоподібні залози.", "Гіпофіз не виробляє паратгормону.", "Надниркові — стероїди.", "Підшлункова — інсулін."]}, {"n": "32.32", "q": "Лікар, обстежуючи жінку зі збільшеною щитоподібною залозою, запідозрив злоякісне перетворення її паренхіми. Якої будови паренхіма залози в нормі?", "o": ["Трабекулярної.", "Фолікулярної.", "Альвеолярної.", "Трубчастої.", "Ацинарної."], "a": [1], "e": ["Трабекулярна будова — наднирники.", "Паренхіма щитоподібної залози — фолікулярна.", "Альвеолярна — молочна залоза.", "Трубчаста — потові залози.", "Ацинарна — підшлункова залоза."]}, {"n": "32.33", "q": "У хворого, 12 років, відмічена передчасна статева зрілість. Яка залоза проміжного мозку виробляє гормон, що гальмує передчасне статеве дозрівання?", "o": ["Еpiphysis.", "Hypophysis.", "Glandula suprarenalis.", "Hypothalamus.", "Mesencephalon."], "a": [0], "e": ["Епіфіз виробляє мелатонін, що гальмує статеве дозрівання.", "Гіпофіз стимулює гонади.", "Надниркова залоза не належить до мозку.", "Гіпоталамус виробляє рилізинг-гормони.", "Середній мозок — не залоза."]}, {"n": "32.34", "q": "У хворого – синдром Іценко-Кушинга (гіперадрено-кортицизм). Цей симптомокомплекс характеризується ожирінням, артеріальною гіпертензією, підвищеним рівнєм цукру у крові, сечі, остеопорозом, атрофією статевих залоз, імпотенцією і пов’язаний з ураженням паренхіми надниркових залоз. Чим представлена паренхіма надниркових залоз?", "o": ["Фолікулами.", "Перекладками.", "Кірковою та мозковою речовиною.", "Острівцями.", "Часточками."], "a": [2], "e": ["Фолікули — щитоподібна залоза.", "Перекладки — строма.", "Паренхіма надниркових залоз — кіркова і мозкова речовина.", "Острівці — підшлункова залоза.", "Часточки — тимус."]}, {"n": "32.35", "q": "Лікар обстежує у новонародженого щитоподібну залозу і враховує походження залози. До якої групи за походженням належить щитоподібна залоза?", "o": ["Бранхіогенних залоз.", "Ентодермальних залоз кишкової трубки.", "Мезодермальних залоз.", "Групи адреналової системи.", "Неврогенної групи."], "a": [0], "e": ["Щитоподібна залоза належить до бранхіогенних залоз.", "Ентодермальні залози кишки — підшлункова залоза.", "Мезодермальні — кірка наднирників.", "Адреналова група — наднирники.", "Неврогенна група — гіпофіз, епіфіз."]}, {"n": "32.36", "q": "У жінки після народження дитини відсутня лактація, що може бути ознакою низького рівня окситоцину в кровоносному руслі жінки. Які ядра гіпоталамуса продукують окситоцин?", "o": ["Пришлуночкове ядро.", "Передзорове.", "Лійкове ядро.", "Ядро сосочкоподібного тіла.", "Надзорове."], "a": [0], "e": ["Окситоцин переважно виробляє пришлуночкове ядро гіпоталамуса.", "Передзорове ядро регулює терморегуляцію.", "Лійкове ядро — рилізинг-фактори.", "Сосочкові ядра пов’язані з пам’яттю.", "Надзорове ядро переважно виробляє вазопресин."]}, {"n": "32.37", "q": "До лікаря звернувся хворий, 15 років, у якого відмічається блідість шкіри, пастозність, добре розвинена жирова клітковина, збільшена загруднинна залоза. Обстеження хворого показало, що така клінічна картина спостерігається при зобнолімфатичному стані, в якому велику роль відіграє загруднинна залоза. Чим представлена паренхіма цього органу?", "o": ["Білою і червоною пульпою.", "Кірковою і мозковою речовиною.", "Червоним і білястим тілом.", "Залозистою паренхімою.", "Жовтим і білястим тілом."], "a": [1], "e": ["Пульпа — селезінка.", "Паренхіма тимусу — часточки з кірковою і мозковою речовиною.", "Червоне і біле тіло — не тимус.", "Залозиста паренхіма — простата.", "Жовте тіло — яєчник."]}, {"n": "32.38", "q": "До дільничного лікаря в черговий раз звернувся хворий чоловік 25 років, який дуже часто страждає різними інфекційними хворобами. Лікар, обстеживши хворого, відмітив наявність первинного імунодефіциту, який проявляється недостатністю клітинного гуморального імунітету і причиною цього може бути дефект диференціювання стовбурових клітин. Де знаходяться ці клітини?", "o": ["В червоному кістковому мозку.", "В жовтому кістковому мозку.", "В В-залежних зонах периферійних органів імунної системи.", "В загруднинній залозі.", "В селезінці."], "a": [0], "e": ["Стовбурові клітини знаходяться в червоному кістковому мозку.", "Жовтий мозок — жировий.", "У В-залежних зонах — зрілі В-клітини.", "У тимусі дозрівають Т-клітини.", "Селезінка — периферійний орган."]}, {"n": "32.39", "q": "До дільничного лікаря звернувся хворий чоловік 18 років зі скаргами на дуже часті запальні процеси в верхніх та нижніх дихальних шляхах (риніти, ларингити, бронхіти, запалення легень). Лікар направив хворого на імунологічне дослідження. В результаті обстеження встановлено: недостатність клітинного імунітету, який забезпечуються Т- лімфоцитами. В якому органі вони продукуються?", "o": ["В селезінці.", "В печінці.", "В лімфатичних вузликах.", "В мигдаликах.", "В загруднинній залозі."], "a": [4], "e": ["У селезінці Т-клітини лише заселяють Т-зони.", "Печінка — ембріональне кровотворення.", "У вузликах — В-клітини.", "Мигдалики — периферійні.", "Т-лімфоцити дозрівають у загруднинній залозі."]}, {"n": "32.40", "q": "При обстеженні хворого зі скаргами на часті захворювання органів дихання, постійну слабкість. Лікар запідозрив пошкодження органів імунної системи. Детальне обстеження хворого дало можливість поставити діагноз – СНІД. При цьому захворюванні вражаються органи, які продукують клітини, які забезпечують клітинний і гуморальний імунітет - В-лімфоцити і претимічні лімфоцити. Який це орган?", "o": ["Кістковий мозок.", "Селезінка.", "Мигдалики.", "Паракортикальна зона лімфатичних вузлів.", "Періартеріальна зона лімфатичних вузликів."], "a": [0], "e": ["Кістковий мозок продукує В-лімфоцити і попередників Т-лімфоцитів.", "Селезінка — периферійний орган.", "Мигдалики — периферійні.", "Паракортикальна зона — Т-зона вузла.", "Періартеріальна зона — у селезінці."]}, {"n": "32.41", "q": "В хірургічне відділення дитячої лікарні поступив хлопчик з підозрою на розрив селезінки. Під час лапаратомії орієнтиром для знаходження селезінки служить ліве підребір`я. Між якими ребрами розміщений цей орган?", "o": ["ІХ і ХІ ребрами.", "ІХ і ХІІ ребрами.", "Х і ХІ ребрами.", "Х і ХІІ ребрами.", "ІХ і Х ребрами."], "a": [0], "e": ["Селезінка розміщена між IX і XI ребрами.", "IX–XII — надто широко.", "X–XI — неповно.", "X–XII — надто низько.", "IX–X — неповно."]}, {"n": "32.42", "q": "В хірургічне відділення поступила жінка з підозрою на інфаркт селезінки, який наступив після септичного ендокардиту (захворювання внутрішньої оболонки серця). При оперативному втручанні хірург звертає увагу на те, як покритий цей орган очеревиною і визначає, що селезінка знаходиться:", "o": ["Інтраперітонеально.", "В порожнині очеревини.", "В заочеревинному просторі.", "Екстраперітонеально.", "Мезоперітонеально."], "a": [0], "e": ["Селезінка вкрита очеревиною з усіх боків — інтраперитонеально.", "Органи не лежать у порожнині очеревини, а покриті нею.", "Не заочеревинно.", "Не екстраперитонеально.", "Не мезоперитонеально."]}], "models": [["Травний тракт", "sf:8c4c69035f4f4773813533d7ca56e516", {"ru": "Пищеварительный тракт", "en": "Gastrointestinal tract"}], ["Дихальні шляхи і легені", "sf:1cd55d26c1254ab7a5d0845fb9a207fe", {"ru": "Дыхательные пути и лёгкие", "en": "Airways and lungs"}], ["Нирки, наднирники і судини", "sf:17e3f54d85f34fafa53c752a9bc88b8d", {"ru": "Почки, надпочечники и сосуды", "en": "Kidneys, adrenals and vessels"}], ["Очеревинна порожнина з підписами", "sf:37b682f3d5864f1b8e218a0fc2edfa14", {"ru": "Брюшинная полость с подписями", "en": "Peritoneal cavity (labelled)"}]]}, {"id": "topic33a", "title": "33. Вступ до ЦНС. Спинний мозок: зовнішня будова", "tr": {"ru": "33. Введение в ЦНС. Спинной мозг: внешнее строение", "en": "33. Introduction to the CNS. Spinal cord: external structure"}, "questions": [{"n": "33.1", "q": "У хворого виявлені симптоми ураження соматомотонейронів передніх рогів спинного мозку. Через яку борозну спинного мозку виходять аксони цих нейронів?", "o": ["Sulcus anterolateralis.", "Sulcus posterolateralis.", "Sulcus medianus posterior.", "Fissura mediana anterior.", "Sulcus intermedius posterior."], "a": [0], "e": ["Аксони мотонейронів передніх рогів виходять через передньобічну борозну, утворюючи передні корінці.", "Через задньобічну борозну входять задні (чутливі) корінці.", "Задня серединна борозна розділяє задні канатики.", "Передня серединна щілина розділяє передні канатики.", "Задня проміжна борозна розділяє тонкий і клиноподібний пучки."]}, {"n": "33.2", "q": "Дитині проводять спинномозкову пункцію між 4-5 поперековими хребцями. З якою метою вибрано данне місце для маніпуляції?", "o": ["Щоб не ушкодити ganglion sensorium n.spinalis.", "Щоб не ушкодити filum terminale.", "Щоб потрапити в canalis centralis.", "Щоб не ушкодити intumescentia lumbosacralis.", "Щоб потрапити в spatium subarachnoideum, не ушкодивши medulla spinalis."], "a": [4], "e": ["Спинномозкові вузли лежать у міжхребцевих отворах, пункція їх не зачіпає.", "Кінцева нитка тонка і безпечно зміщується голкою.", "Центральний канал дуже вузький, у нього не пунктують.", "Попереково-крижове потовщення лежить вище, на рівні Th X–Th XII.", "Нижче L II спинного мозку немає, тому голка потрапляє в підпавутинний простір, не ушкоджуючи мозок."]}, {"n": "33.3", "q": "Хворий госпіталізований в лікарню з переломом хребтового стовпа після дорожньо-транспортної пригоди. За допомогою рентгенологічного методу дослідження встановлено ушкодження шийного відділу спинного мозку на його границі зі довгастим мозком. Чому відповідає верхня границя medulla spinalis?", "o": ["Місцю виходу корінців СI спинномозкових нервів.", "Передньобічній борозні.", "Верхньому краю щитоподібного хряща гортані.", "Шийному потовщенню.", "Трійчасто-лицевій лінії."], "a": [0], "e": ["Верхня межа спинного мозку — місце виходу корінців першого шийного нерва (рівень великого отвору).", "Передньобічна борозна — поздовжня, межею не є.", "Щитоподібний хрящ лежить на рівні C IV–V.", "Шийне потовщення лежить нижче.", "Трійчасто-лицевої лінії немає на спинному мозку."]}, {"n": "33.4", "q": "Дитині встановлено діагноз – запалення середньої оболони спинного мозку. Яка оболона ушкоджена?", "o": ["Pia mater spinalis.", "Dura mater spinalis.", "Aracnoidea spinalis.", "Tunica serosa.", "Tunica adventitia."], "a": [2], "e": ["М’яка оболона — внутрішня.", "Тверда оболона — зовнішня.", "Середня оболона спинного мозку — павутинна.", "Серозної оболонки в мозку немає.", "Адвентиції в мозку немає."]}, {"n": "33.5", "q": "При дослідженні спинного мозку у плода встановлено, що спинний мозок займає всю довжину хребтового каналу. На якому місяці внутрішньоутробного розвитку можна спостерігати це явище?", "o": ["На 3.", "На 6.", "На 8.", "На 9.", "На 7."], "a": [0], "e": ["До 3-го місяця внутрішньоутробного розвитку спинний мозок займає весь хребтовий канал.", "На 6-му місяці мозок уже коротший за канал.", "На 8-му місяці мозок закінчується вище.", "На 9-му місяці — на рівні L III.", "На 7-му місяці мозок уже коротший."]}, {"n": "33.6", "q": "В філогенезі центральна нервова система проходить 3 етапи розвитку. Для яких істот характерна вузлова нервова система?", "o": ["Для людини.", "Для птахів.", "Для риб.", "Для безхребетних.", "Для кишковопорожнинних."], "a": [3], "e": ["У людини трубчаста нервова система.", "У птахів трубчаста.", "У риб трубчаста.", "Вузлова (гангліонарна) нервова система характерна для безхребетних (членистоногих, червів).", "У кишковопорожнинних дифузна (сітчаста) система."]}, {"n": "33.7", "q": "Хлопчик госпіталізований в лікарню з переломом хребтового стовпа. За допомогою рентгенологічного методу дослідження встановлено ушкодження шийного відділу спинного мозку на його границі зі довгастим мозком. Чому відповідає верхня границя medulla spinalis?", "o": ["Місцю виходу корінців СI спинномозкових нервів.", "Передньобічній борозні.", "Верхньому краю щитоподібного хряща гортані.", "Шийному потовщенню.", "Трійчасто-лицевій лінії."], "a": [0], "e": ["Верхня межа спинного мозку — місце виходу корінців першого шийного нерва.", "Передньобічна борозна — поздовжня.", "Щитопод function getBits(tid,n){ const s=ST.solved[tid]; const a=new Uint8Array(Math.ceil(n/8)); if(s){ try{ const b=atob(s); for(let i=0;i<b.length&&i<a.length;i++) a[i]=b.charCodeAt(i);}catch(e){} } return a; }
function setBit(tid,n,idx){ const a=getBits(tid,n); a[idx>>3]|=1<<(idx&7); ST.solved[tid]=btoa(String.fromCharCode.apply(null,a)); }
function orBits(x,y){ let a='',b=''; try{a=atob(x);}catch(e){} try{b=atob(y);}catch(e){} let r=''; for(let i=0;i<Math.max(a.length,b.length);i++) r+=String.fromCharCode((a.charCodeAt(i)||0)|(b.charCodeAt(i)||0)); return btoa(r); }
function countBits(tid,n){ const a=getBits(tid,n); let c=0; for(let i=0;i<n;i++) if(a[i>>3]&(1<<(i&7))) c++; return c; }
const TOTAL_Q = DATA.reduce((s,t)=>s+t.questions.length,0);
function solvedTotal(){ return DATA.reduce((s,t)=>s+countBits(t.id,t.questions.length),0); }
function progPct(){ return TOTAL_Q?Math.round(solvedTotal()/TOTAL_Q*100):0; }

// ---------- helpers ----------
const L = () => I[ST.settings.lang]||I.uk;
const $ = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const LET = ['A','B','C','D','E','F'];
const haptic = t => { if(!ST.settings.haptic) return; try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t); } catch(e){} };
const ask = (msg, yes) => { if (tg && tg.showConfirm && inTg) { try { return tg.showConfirm(msg, ok => ok && yes()); } catch(e){} } if (confirm(msg)) yes(); };
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1600); }
function tt(t){ const l=ST.settings.lang; return (l!=='uk' && t.tr && t.tr[l]) || t.title; }
function qv(q){ const l=ST.settings.lang; const x=(l!=='uk'&&q.tr&&q.tr[l]); return x?{q:x.q,o:x.o,e:x.e||q.e,tr:true}:{q:q.q,o:q.o,e:q.e,tr:l==='uk'}; }
function setBack(fn){
  if (!tg || !tg.BackButton) { setBack._h=fn; return; }
  try { if(setBack._h) tg.BackButton.offClick(setBack._h); } catch(e){}
  setBack._h=fn;
  if (fn){ tg.BackButton.onClick(fn); tg.BackButton.show(); } else tg.BackButton.hide();
}
function applyTheme(){
  const th=ST.settings.theme; let dark;
  if (th==='auto') dark = tg && tg.colorScheme ? tg.colorScheme==='dark' : (window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  else dark = th==='dark';
  document.documentElement.classList.toggle('dark', !!dark);
  document.documentElement.style.setProperty('--fs', ST.settings.font==='l'?'18.5px':'16px');
  document.documentElement.lang = ST.settings.lang;
  try { if(tg&&inTg){ const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); tg.setHeaderColor&&tg.setHeaderColor(bg); tg.setBackgroundColor&&tg.setBackgroundColor(bg);} } catch(e){}
}
if (tg && tg.onEvent) tg.onEvent('themeChanged', ()=>{ if(ST.settings.theme==='auto') applyTheme(); });

// ---------- header ----------
function header(active){
  const l=L();
  return `<h1>🩺 MedQuiz<span class="sp"></span><button class="ib" onclick="rating()" title="${l.rating}">🏆</button><button class="ib" onclick="profileScr()" title="${l.profile}">👤</button><button class="ib" onclick="settingsScr()" title="${l.settings}">⚙️</button></h1>
  <div class="tabs"><button class="${active==='t'?'on':''}" onclick="home()">${l.tests}</button><button class="${active==='a'?'on':''}" onclick="atlas()">${l.atlas}</button></div>`;
}

// ---------- 3D ----------
let curModel=null, prevBack=null;
function mUrl(src){ return src.startsWith('sf:') ? `https://sketchfab.com/models/${src.slice(3)}/embed?autostart=1&ui_infos=0&ui_watermark=0&ui_hint=2&dnt=1` : `https://caskanatomy.info/open3dviewer/?model=${src.slice(4)}`; }
function mPage(src){ return src.startsWith('sf:') ? `https://sketchfab.com/models/${src.slice(3)}` : mUrl(src); }
function mName(m){ const l=ST.settings.lang; return (m[2]&&m[2][l])||m[0]; }
function modelBtns(list){ return list.map(m=>`<button class="mitem" onclick='openModel(${JSON.stringify(m).replace(/'/g,"&#39;")})'>🧊 <span>${esc(mName(m))}</span><span class="src">${m[1].startsWith('sf:')?'Sketchfab':'Open3DModel'}</span></button>`).join(''); }
function openModel(m){
  closeSheet(); curModel=m; const l=L();
  document.getElementById('vTitle').textContent=mName(m);
  document.getElementById('vExt').textContent=l.ext;
  document.getElementById('vFrame').src=mUrl(m[1]);
  document.getElementById('vCredit').textContent = m[1].startsWith('sf:') ? l.credSF : l.credO;
  document.getElementById('viewer').classList.add('on');
  prevBack=setBack._h||null; setBack(closeViewer);
}
function closeViewer(){ document.getElementById('viewer').classList.remove('on'); document.getElementById('vFrame').src='about:blank'; setBack(prevBack); }
function openExt(){ const u=mPage(curModel[1]); try{ if(tg&&tg.openLink&&inTg) return tg.openLink(u); }catch(e){} window.open(u,'_blank'); }
function showTopicModels(i){
  const t=DATA[i], l=L();
  document.getElementById('sheetIn').innerHTML=`<div class="gh" style="margin-top:0">${l.models}: ${esc(tt(t))}</div>${modelBtns(t.models)}<button class="btn sec" style="margin-top:6px" onclick="closeSheet()">${l.close}</button>`;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
function atlas(){
  S=null; setBack(null); const l=L();
  let h=header('a');
  ATLAS.forEach(g=>{ h+=`<div class="gh">${esc((g[2]&&g[2][ST.settings.lang])||g[0])}</div>`+modelBtns(g[1]); });
  h+=`<p class="note" style="margin-top:14px">${l.modelTip}</p>`;
  $.innerHTML=h; window.scrollTo(0,0);
}

// ---------- home ----------
let S=null;
function home(){
  S=null; setBack(null); const l=L();
  let h=header('t');
  const sol=solvedTotal();
  h+=`<div class="stat"><div class="card"><b>${progPct()}%</b><small>${l.progress} · ${sol}/${TOTAL_Q}</small></div><div class="card"><b>${ST.correct}</b><small>${l.corrTot}</small></div></div>`;
  DATA.forEach((t,i)=>{
    const st=ST.stats[t.id]; const n=t.questions.length; const sv=countBits(t.id,n);
    h+=`<div class="card topic" onclick="start(${i})"><div class="t">${esc(tt(t))}</div>
      <div class="s">${n} ${l.q} · ✓ ${sv}/${n}${st?` · ${l.last}: ${st.last}% · ${l.best}: ${st.best}%`:''}</div>
      ${t.models&&t.models.length?`<button class="m3d" onclick="event.stopPropagation();showTopicModels(${i})">🧊 ${l.models} (${t.models.length})</button>`:''}</div>`;
  });
  $.innerHTML=h;
}

// ---------- quiz ----------
function start(i, onlyIdx){
  const t=DATA[i];
  let items=t.questions.map((q,idx)=>({q,idx}));
  if (onlyIdx) items=items.filter(x=>onlyIdx.includes(x.idx));
  if (ST.settings.shuffleQ) items=shuffle(items);
  items=items.map(x=>{ let order=x.q.o.map((_,k)=>k); if(ST.settings.shuffleO) order=shuffle(order); return {idx:x.idx,q:x.q,order}; });
  S={ti:i,items,pos:0,picked:null,wrong:[],right:0,partial:!!onlyIdx};
  setBack(()=>ask(L().exitQ, home));
  render();
}
function render(){
  const l=L(), t=DATA[S.ti], it=S.items[S.pos], total=S.items.length, answered=S.picked!==null, v=qv(it.q);
  let h=`<div class="top"><button class="back" onclick="ask(L().exitQ, home)">${l.topics}</button>
    <span>${t.models&&t.models.length?`<button class="m3d" style="margin:0 8px 0 0" onclick="showTopicModels(${S.ti})">🧊 3D</button>`:''}${S.pos+1} / ${total} · ✓ ${S.right}</span></div>
    <div class="bar"><i style="width:${(S.pos+(answered?1:0))/total*100}%"></i></div>
    ${!v.tr?`<p class="note" style="margin:8px 0 0">${l.noTr}</p>`:''}
    <div class="q">${esc(v.q)}</div>`;
  it.order.forEach((k,pos)=>{
    let cls='opt';
    if (answered){ cls+=' locked'; if(it.q.a.includes(k)) cls+=' ok'; else if(S.picked===k) cls+=' bad'; else cls+=' dim'; }
    let ex='';
    if (answered && ST.settings.showEx && v.e && v.e[k]) ex=`<span class="ex"><b>${it.q.a.includes(k)?l.right:l.wrong}</b> ${esc(v.e[k])}</span>`;
    h+=`<button class="${cls}" ${answered?'disabled':''} onclick="pick(${k})"><span class="l">${LET[pos]}</span><span class="tx"><span>${esc(v.o[k])}</span>${ex}</span></button>`;
  });
  if (answered) h+=`<div class="foot"><div class="in"><button class="btn" onclick="next()">${S.pos+1<total?l.next:l.result}</button></div></div>`;
  $.innerHTML=h;
}
function pick(k){
  if (S.picked!==null) return;
  const it=S.items[S.pos], t=DATA[S.ti];
  S.picked=k;
  if (it.q.a.includes(k)){ S.right++; ST.correct++; setBit(t.id,t.questions.length,it.idx); haptic('success'); save(true);
    render(); if (ST.settings.autoNext) setTimeout(()=>{ if(S&&S.picked===k&&S.items[S.pos]===it) next(); }, 900); return; }
  S.wrong.push(S.pos); haptic('error'); render();
}
function next(){ S.pos++; S.picked=null; window.scrollTo(0,0); if (S.pos>=S.items.length) return result(); render(); }
function result(){
  const l=L(), total=S.items.length, pct=Math.round(S.right/total*100), t=DATA[S.ti];
  if (!S.partial){ const st=ST.stats[t.id]||{best:0,runs:0}; ST.stats[t.id]={best:Math.max(st.best,pct),last:pct,runs:st.runs+1}; save(true); }
  setBack(home);
  let h=`<h1>${l.result}</h1><div class="card"><div class="big">${S.right} / ${total}</div><div class="mut">${pct}%</div>`;
  const w=S.wrong.map(p=>S.items[p]);
  if (w.length) h+=`<button class="btn" onclick="start(${S.ti}, [${w.map(x=>x.idx)}])">${l.repeat} (${w.length})</button><div style="height:10px"></div>`;
  h+=`<div class="row"><button class="btn sec" onclick="start(${S.ti})">${l.again}</button><button class="btn sec" onclick="home()">${l.toTopics}</button></div></div>`;
  if (w.length){
    h+=`<div class="card"><b>${l.mistakes}</b><div style="height:8px"></div>`;
    w.forEach(it=>{ const v=qv(it.q); h+=`<div class="rev"><b>${esc(it.q.n)}</b> ${esc(v.q)}<br><b class="g">✓ ${esc(it.q.a.map(k=>v.o[k]).join('; '))}</b>${ST.settings.showEx&&v.e?`<br><span style="color:var(--muted)">${esc(v.e[it.q.a[0]])}</span>`:''}</div>`; });
    h+='</div>';
  }
  $.innerHTML=h; window.scrollTo(0,0);
}

// ---------- settings ----------
function seg(key,opts){ return `<div class="seg">${opts.map(([v,lab])=>`<button class="${ST.settings[key]===v?'on':''}" onclick="setS('${key}','${v}')">${lab}</button>`).join('')}</div>`; }
function chk(key,lab){ return `<label class="sw"><span>${lab}</span><input type="checkbox" ${ST.settings[key]?'checked':''} onchange="setS('${key}',this.checked,1)"></label>`; }
function setS(k,v,noRender){ ST.settings[k]=v; ST._ts=Date.now(); save(); applyTheme(); if(!noRender) settingsScr(); }
function settingsScr(){
  S=null; const l=L(); setBack(home);
  let h=`<div class="top"><button class="back" onclick="home()">${l.topics}</button></div><h1>⚙️ ${l.settings}</h1><div class="card">
   <div class="sw"><span>${l.theme}</span>${seg('theme',[['auto',l.auto],['light','☀️'],['dark','🌙']])}</div>
   <div class="sw"><span>${l.lang}</span>${seg('lang',[['uk','УКР'],['ru','РУС'],['en','ENG']])}</div>
   <div class="sw"><span>${l.font}</span>${seg('font',[['n','A'],['l','A+']])}</div>
   ${chk('showEx',l.showEx)}${chk('shuffleQ',l.shQ)}${chk('shuffleO',l.shO)}${chk('autoNext',l.autoNext)}${chk('haptic',l.haptic)}
  </div>
  <p class="note">${inTg?l.syncTg:l.syncLocal}</p>
  <div style="height:8px"></div>
  <button class="btn sec" onclick="ask(L().resetQ, resetAll)">${l.reset}</button>`;
  $.innerHTML=h; window.scrollTo(0,0);
}
function resetAll(){ ST.stats={}; ST.solved={}; ST.correct=0; save(true); toast(L().done); settingsScr(); }

// ---------- profile ----------
function profileScr(){
  S=null; const l=L(); setBack(home);
  const p=ST.profile||{name:(tgUser&&[tgUser.first_name,tgUser.last_name].filter(Boolean).join(' '))||'',uni:UNIS[0],fac:'',course:1,group:'',rating:true};
  const uniIsOther=p.uni&&!UNIS.includes(p.uni);
  let h=`<div class="top"><button class="back" onclick="home()">${l.topics}</button></div><h1>👤 ${l.profile}</h1>
  <p class="note">${l.profHint}</p><div class="card">
   <div class="lab">${l.name}</div><input class="inp" id="pName" maxlength="40" value="${esc(p.name||'')}">
   <div class="lab">${l.uni}</div><select class="inp" id="pUni" onchange="document.getElementById('pUniO').style.display=this.value==='__o'?'block':'none'">
     ${UNIS.map(u=>`<option ${p.uni===u?'selected':''}>${esc(u)}</option>`).join('')}<option value="__o" ${uniIsOther?'selected':''}>${l.other}…</option></select>
   <input class="inp" id="pUniO" style="margin-top:6px;display:${uniIsOther?'block':'none'}" maxlength="80" value="${uniIsOther?esc(p.uni):''}">
   <div class="lab">${l.fac}</div><input class="inp" id="pFac" maxlength="60" value="${esc(p.fac||'')}">
   <div class="row"><div><div class="lab">${l.course}</div><select class="inp" id="pCourse">${[1,2,3,4,5,6].map(c=>`<option ${+p.course===c?'selected':''}>${c}</option>`).join('')}</select></div>
   <div><div class="lab">${l.group}</div><input class="inp" id="pGroup" maxlength="20" value="${esc(p.group||'')}"></div></div>
   <label class="sw" style="margin-top:8px"><span>${l.inRating}</span><input type="checkbox" id="pRating" ${p.rating!==false?'checked':''}></label>
  </div>
  <button class="btn" onclick="saveProfile()">${l.save}</button>
  ${ST.profile?`<div style="height:10px"></div><button class="btn sec" onclick="ask(L().delProfQ, delProfile)">${l.delProf}</button>`:''}
  <p class="note" style="margin-top:12px">${inTg?l.syncTg:l.syncLocal}</p>`;
  $.innerHTML=h; window.scrollTo(0,0);
}
function saveProfile(){
  const g=id=>document.getElementById(id);
  let uni=g('pUni').value; if(uni==='__o') uni=g('pUniO').value.trim();
  const name=g('pName').value.trim();
  if(!name){ g('pName').focus(); return; }
  ST.profile={name,uni:uni||UNIS[0],fac:g('pFac').value.trim(),course:+g('pCourse').value,group:g('pGroup').value.trim(),rating:g('pRating').checked};
  save(true); toast(L().saved); home();
}
function delProfile(){ const old=ST.profile; ST.profile=null; save(); if(old) pushRating(true); home(); }

// ---------- rating (Supabase REST) ----------
function uid(){ if (tgUser) return 'tg'+tgUser.id; let u=localStorage.getItem('mq_uid'); if(!u){ u='w'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('mq_uid',u);} return u; }
const rOn = () => !!(CONFIG.supabaseUrl && CONFIG.supabaseKey);
function sbH(extra){ const h={apikey:CONFIG.supabaseKey,'Content-Type':'application/json'}; if(/^eyJ/.test(CONFIG.supabaseKey)) h.Authorization='Bearer '+CONFIG.supabaseKey; return Object.assign(h,extra||{}); }
function sb(path, opt){ opt=opt||{}; opt.headers=sbH(opt.headers); return fetch(CONFIG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/'+path, opt); }
function pushRating(remove){
  if (!rOn()) return;
  const p=ST.profile;
  if (remove || !p || p.rating===false){ sb('leaderboard?id=eq.'+encodeURIComponent(uid()),{method:'DELETE'}).catch(()=>{}); return; }
  const row={id:uid(),name:p.name,university:p.uni,faculty:p.fac||'',course:p.course,grp:p.group||'',solved:solvedTotal(),total:TOTAL_Q,correct:ST.correct,updated_at:new Date().toISOString()};
  sb('leaderboard',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)}).catch(()=>{});
}
function rating(){
  S=null; const l=L(); setBack(home);
  let h=`<div class="top"><button class="back" onclick="home()">${l.topics}</button></div><h1>🏆 ${l.rating}</h1>`;
  const p=ST.profile;
  h+=`<div class="stat"><div class="card"><b>${progPct()}%</b><small>${l.myProg}</small></div><div class="card"><b>${ST.correct}</b><small>${l.corrTot}</small></div></div>`;
  if (!rOn()){ $.innerHTML=h+`<div class="card note">${l.ratingOff}</div>`; return; }
  if (!p){ $.innerHTML=h+`<div class="card"><p class="note" style="margin-top:0">${l.ratingNeedProf}</p><button class="btn" onclick="profileScr()">${l.fillProf}</button></div>`; return; }
  h+=`<div class="card"><div class="gh" style="margin-top:0">${l.ratingOf}</div><div class="note">${esc(p.uni)} · ${p.course} ${l.course_n}</div><div id="lbList" style="margin-top:8px" class="note">${l.loading}</div></div>`;
  $.innerHTML=h;
  pushRating();
  sb('leaderboard?select=id,name,grp,solved,total,correct&university=eq.'+encodeURIComponent(p.uni)+'&course=eq.'+p.course+'&order=solved.desc,correct.desc&limit=100')
   .then(r=>r.ok?r.json():Promise.reject()).then(rows=>{
     const el=document.getElementById('lbList'); if(!el) return;
     if(!rows.length){ el.textContent=l.empty; return; }
     const me=uid();
     el.className=''; el.innerHTML=rows.map((r,i)=>{ const pct=r.total?Math.round(r.solved/r.total*100):0;
       return `<div class="lb ${r.id===me?'me':''}"><div class="r">${i<3?['🥇','🥈','🥉'][i]:i+1}</div><div class="n"><div>${esc(r.name)}</div>${r.grp?`<small>${esc(r.grp)}</small>`:''}</div><div class="p">${pct}%<small>${r.correct} ${l.correct}</small></div></div>`; }).join('');
   }).catch(()=>{ const el=document.getElementById('lbList'); if(el) el.textContent=l.err; });
}

// ---------- boot ----------
applyTheme();
home();
cloudLoad(()=>{ applyTheme(); if(!S && document.querySelector('#app .stat') && document.querySelector('#app .topic')) home(); save(); if(ST.profile) pushRating(); });
</script>
