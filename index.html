гностована коса пахвинна грижа. Де розташовано глибоке пахвинне кільце (вхідний отвір у пахвинний канал)?", "o": ["В надміхуровій ямці.", "В стегновому кільці.", "Збоку від бічної пупкової складки.", "В м’язовій затоці.", "Присередньо від бічної пупкової складки."], "a": [2], "e": ["Надміхурова ямка лежить між серединною і присередньою складками.", "Стегнове кільце — вхід у стегновий канал.", "Глибоке пахвинне кільце лежить у бічній пахвинній ямці, збоку від бічної пупкової складки.", "М’язова затока лежить під пахвинною зв’язкою.", "Присередньо від бічної складки — присередня пахвинна ямка (пряма кила)."]}, {"n": "25.20", "q": "Чоловіка 60 років госпіталізовано в урологічне відділення зі скаргами на затримку сечі протягом двох діб. Призначена пункція сечового міхура. Як можна провести пункцію сечового міхура через передню черевну стінку не торкаючись очеревини?", "o": ["Тільки у чоловіків.", "При порожньому сечовому міхурі.", "Тільки у дітей.", "Тільки у жінок.", "При наповненному (розтягнутому) сечовому міхурі."], "a": [4], "e": ["Стать не має значення.", "Порожній міхур лежить за лобком і пункція неможлива.", "Вік не має значення.", "Стать не має значення.", "Наповнений міхур піднімається над лобком і відтісняє очеревину догори, тому його пунктують позаочеревинно."]}, {"n": "25.21", "q": "Чоловіку 40 років з діагнозом «гострий живіт» була проведена лапаротомія. Під час операції хірург провів ревізію стінок чепцевої сумки через чепцевий отвір. З яким простором очеревинної порожнини з’єднує чепцевий отвір чепцеву сумку?", "o": ["З передшлунковою сумкою.", "З правим бічним каналом.", "З лівим бічним каналом.", "З підпечінковим закутком печінкової сумки.", "З заочеревинним простором."], "a": [3], "e": ["Передшлункова сумка не сполучається з чепцевою через цей отвір.", "Правий бічний канал лежить нижче.", "Лівий бічний канал лежить нижче.", "Чепцевий отвір сполучає чепцеву сумку з підпечінковим закутком печінкової сумки.", "Заочеревинний простір не є частиною очеревинної порожнини."]}, {"n": "25.22", "q": "Чоловіка 69 років госпіталізовано в урологічне відділення зі скаргами на відсутність сечовиділення протягом доби, біль у надлобковій ділянці та відчуття переповненого сечового міхура. Лікар планує катетеризацію сечового міхура, Уролог використовує хірургічний доступ та тактику проведення пункції, враховуючи анатомічні особливості покриття очеревиною стінки сечового міхуха, щоб уникнути ураження серозної оболонки. Як вкритий наповнений сечовий міхур очеревиною?", "o": ["Мезоперитонеально.", "Ретроперитонеально.", "Інтраперитонеально.", "Екстраперитонеально.", "Зовсім не вкриває."], "a": [0], "e": ["Наповнений сечовий міхур вкритий очеревиною з трьох боків — мезоперитонеально.", "Порожній міхур — ретроперитонеальний.", "Інтраперитонеально міхур не лежить.", "Екстраперитонеально лежить порожній міхур.", "Очеревина вкриває міхур."]}, {"n": "25.23", "q": "Пацієнт 50 років переніс операцію на шлунку. Через кілька днів з’явилися скарги на високу температуру, біль в правій підребровій ділянці живота та утруднене дихання. Під час проведення КТ черевної порожнини виявлено скупчення гнійного ексудату під діафрагмою (піддіафрагмовий абсцесс). Лікар визначає, в якому очеревинному утворі локалізується абсцесс, щоб правильно виконати дренаж очеревинної порожнини. У якому очеревинному просторі локалізується піддіафрагмовий абсцес?", "o": ["Правому бічному каналі.", "Чепцевій сумці.", "Передшлунковій сумці.", "Лівому бічному каналі.", "Печінковій сумці."], "a": [4], "e": ["Правий бічний канал лежить нижче.", "Чепцева сумка лежить позаду шлунка.", "Передшлункова сумка лежить ліворуч.", "Лівий бічний канал лежить нижче.", "Правий піддіафрагмовий простір входить до печінкової сумки."]}, {"n": "25.24", "q": "Чоловіку 45 років із підозрою на виразку дванадцятипалої кишки терміново проведене лапароскопічне обстеження. Під час операції хірург оцінює стан очеревини та її взаємозв’язок із дванадцятипалою кишкою, щоб визначити імовірність поширення запального процесу в заочеревинний простір. Як очеревина вкриває дванадцятипалу кишку?", "o": ["Екстраперитонеально.", "Мезоперитонеально.", "Інтраперитонеально.", "Інтраперитонеально, мезоперитонеально", "Не вкриває взагалі."], "a": [0], "e": ["Дванадцятипала кишка переважно лежить екстраперитонеально (лише цибулина вкрита з усіх боків).", "Мезоперитонеально — неточно.", "Інтраперитонеально лежить лише початок (цибулина).", "Неправильне поєднання.", "Очеревина вкриває кишку спереду."]}, {"n": "25.25", "q": "У чоловіка 47 років лікар підозрює спайкову хворобу на тлі перенесеного перитоніту. Хірург оглядає лапароскопічно петлі тонкої кишки, ступінь рухливості порожньої та клубової кишок, наявніть спайок, стан нутрощевого листка очеревини, який вкриває петлі тонкої кишки. Як очеревина вкриває порожню та клубову кишки?", "o": ["Екстраперитонеально.", "Мезоперитонеально.", "Мезоперитонеально, інтраперитонеально.", "Не вкриває", "Інтраперитонеально."], "a": [4], "e": ["Порожня і клубова кишки не екстраперитонеальні.", "Тонка кишка не мезоперитонеальна.", "Неправильне поєднання.", "Очеревина вкриває кишки.", "Порожня і клубова кишки вкриті очеревиною з усіх боків і мають брижу — інтраперитонеально."]}, {"n": "25.26", "q": "Чоловіка 25 років госпіталізовано в хірургічне відділення лікарні із ознаками кишкової непрохідності. Під час КТ-обстеження лікар оцінює положення частин товстої кишки та їх фіксацію. Особливу увагу приділяють тим чатинам, які не мають брижі, адже вони менш рухомі та частіше піддаються компресії і патологічним змінам. Які відділи товстої кишки не мають брижі?", "o": ["Висхідна і низхідна ободові кишки.", "Поперечна ободова кишка.", "Сигмоподібна ободова кишка.", "Червоподібний відросток.", "Клубова кишка."], "a": [0], "e": ["Висхідна і низхідна ободові кишки лежать мезоперитонеально і брижі не мають.", "Поперечна ободова кишка має брижу.", "Сигмоподібна кишка має брижу.", "Червоподібний відросток має брижу.", "Клубова кишка належить до тонкої кишки."]}, {"n": "25.27", "q": "У пацієнта діагностовано одну з некротичних форм гострого панкреатиту. У який з очеревинних просторів відразу поширюється ексудат?", "o": ["Чепцеву сумку.", "Печінкову сумку.", "Передшлункову сумку.", "Лівий бічний канал.", "Правий бічний канал."], "a": [0], "e": ["Підшлункова залоза лежить у задній стінці чепцевої сумки, тому ексудат іде туди.", "Печінкова сумка лежить праворуч.", "Передшлункова сумка лежить попереду.", "Лівий бічний канал лежить нижче.", "Правий бічний канал лежить нижче."]}, {"n": "25.28", "q": "Чоловік 38 років звернувся зі скаргами на випинання в правій пахвинній ділянці живота, яке збільшується при фізичному навантаженні та під час кашлю. Оглядаючи хворого, хірург виявив косу пахвинну килу (грижу), що проходить через пахвинний канал. Перед оперативним втручанням лікар повинен чітко визначити анатомічні орієнтири вхідного отвору грижі в пахвинний канал, щоб уникнути ушкодження судин та нервів. Де знаходиться ділянка воріт грижі у пахвинний канал?", "o": ["Збоку від бічної пупкової складки.", "В мʼязовій затоці.", "Присередньо від бічної пушкової складки.", "В стегновому кільці.", "В надміхуровій ямці."], "a": [0], "e": ["Коса пахвинна кила входить у глибоке пахвинне кільце — збоку від бічної пупкової складки (бічна пахвинна ямка).", "М’язова затока лежить під пахвинною зв’язкою.", "Присередньо від бічної складки — ворота прямої кили.", "Стегнове кільце — ворота стегнової кили.", "Надміхурова ямка — місце надміхурової кили."]}, {"n": "25.29", "q": "У жінки 45 років під час обстеження діагностовано стегнову килу. Лікар пропальпував грижовий мішок у стегновому каналі біля його вихідного отвору, ретельно оглянувши цей анатомічний утвір. Який анатомічни утвір є вихідним отвором стегнової кили?", "o": ["Підшкірний розтвір.", "Пахвинне глибоке кільце.", "Пахвинне поверхневе кільце.", "Стегнове кільце.", "Пахвинна присередня ямка"], "a": [0], "e": ["Вихідним отвором стегнового каналу є підшкірний розтвір широкої фасції.", "Глибоке пахвинне кільце — вхід у пахвинний канал.", "Поверхневе пахвинне кільце — вихід пахвинного каналу.", "Стегнове кільце — вхідний отвір стегнового каналу.", "Присередня пахвинна ямка — місце прямої кили."]}], "models": [["Очеревинна порожнина з підписами", "sf:37b682f3d5864f1b8e218a0fc2edfa14", {"ru": "Брюшинная полость с подписями", "en": "Peritoneal cavity (labelled)"}], ["Очеревинна порожнина", "sf:fd154bccb96141dcbfb566fe8533c0d2", {"ru": "Брюшинная полость", "en": "Peritoneal cavity"}], ["Травний тракт", "sf:8c4c69035f4f4773813533d7ca56e516", {"ru": "Пищеварительный тракт", "en": "Gastrointestinal tract"}]]}, {"id": "topic26", "title": "26. Зовнішній ніс, носова порожнина, гортань", "tr": {"ru": "26. Наружный нос, полость носа, гортань", "en": "26. External nose, nasal cavity, larynx"}, "questions": [{"n": "26.1", "q": "Чоловік 55 років звернувся до лікаря зі скаргами на осиплість голосу, що триває понад 2 місяці, відчуття стороннього тіла в горлі та легкий дискомфорт при ковтанні. Курить понад 20 років. Під час ларингоскопії лікар виявив пухлиноподібний утвір на слизовій оболонці тої частини гортані, що вкрита багатошаровим плоским незроговілим епітелієм. У ділянці якого утвору виявлена пухлина у чоловіка?", "o": ["Plicae vocale.", "Plicae vestibulare.", "Plicae aryepiglotticae.", "Cartilagines arytenoideae.", "Arcus cartilaginis cricoideae."], "a": [0], "e": ["Голосові складки вкриті багатошаровим плоским незроговілим епітелієм, тут часто виникають пухлини у курців.", "Присінкові складки вкриті війчастим епітелієм.", "Черпакувато-надгортанні складки переважно вкриті війчастим епітелієм.", "Черпакуваті хрящі — хрящі, а не ділянка слизової з таким епітелієм.", "Дуга перснеподібного хряща лежить у підголосниковій порожнині з війчастим епітелієм."]}, {"n": "26.2", "q": "У лікарню госпіталізовано 17-річного юнака після спортивної травми зі скаргами на біль, набряк та деформацію носа. Лікар підозрює ушкодження хрящових утворів. Під час обстеження на МРТ виявлено травмований хрящ, що має вертикальне розташування і обмежує простір між загальними носовими ходами (meatus communis nasi). Який хрящ травмовано?", "o": ["Cartilago septi nasi.", "Cartilago nasi lateralis.", "Cartilago alaris minor.", "Cartilago alaris major.", "Cartilago arytenoidea."], "a": [0], "e": ["Хрящ носової перегородки лежить вертикально і розділяє праву і ліву половини носа (загальні носові ходи).", "Бічний хрящ носа утворює бічну стінку спинки носа.", "Малі крильні хрящі лежать у крилах носа.", "Великий крильний хрящ оточує ніздрю.", "Черпакуватий хрящ належить гортані."]}, {"n": "26.3", "q": "Лікар виявив у чоловіка 23 років ушкодження хряща зовнішнього носа, який оточує ніздрі. Який хрящ травмований?", "o": ["Cartilago alaris major.", "Cartilago alarеs minorеs.", "Cartilago cricoidea.", "Сartilago arytenoidea.", "Cartilago vomeronasalis."], "a": [0], "e": ["Великий крильний хрящ оточує ніздрю присереднєю і бічною ніжками.", "Малі крильні хрящі дрібні, лежать позаду великого.", "Перснеподібний хрящ належить гортані.", "Черпакуватий хрящ належить гортані.", "Леміщево-носовий хрящ лежить біля перегородки."]}, {"n": "26.4", "q": "У жінки 40 років на тлі довготривалого запалення слизової оболонки носової порожнини з’явилися симптоми запалення слизової оболонки верхньощелепної пазухи (гайморит). Через який утвір стало можливим розповсюдження інфекції з носової порожнини у верхньощелепну пазуху?", "o": ["Клино-піднебінний отвір.", "Решітчасті комірки.", "Півмісяцевий розтвір.", "Решітчасту лійку.", "Клино-решітчастий закуток."], "a": [2], "e": ["Клино-піднебінний отвір веде в крилопіднебінну ямку.", "Решітчасті комірки — окремі пазухи.", "Верхньощелепна пазуха відкривається в півмісяцевий розтвір середнього носового ходу.", "Через решітчасту лійку відкривається лобова пазуха.", "У клино-решітчастий закуток відкривається клиноподібна пазуха."]}, {"n": "26.5", "q": "Лікар, обстежуючи жінку 35 років, запідозрив порушення іннервації гортані. Виконуючи ендоскопічне дослідження, лікар виявив, що один із хрящів гортані частково перекриває вхід у присінок гортані. Функція якого хряща, що обмежовує присінок гортані, порушена?", "o": ["Надгортанника.", "Щитоподібного хряща.", "Перснеподібного хряща.", "Черпакуватого хряща.", "Трахейного хряща."], "a": [0], "e": ["Надгортанник обмежує вхід у гортань спереду і прикриває його під час ковтання.", "Щитоподібний хрящ входу в гортань не обмежує.", "Перснеподібний хрящ лежить нижче.", "Черпакуваті хрящі обмежують вхід ззаду, але не перекривають його.", "Трахейні хрящі належать трахеї."]}, {"n": "26.6", "q": "У чоловіка 30 років на МРТ виявлено запалення клиноподібної пазухи. Під час огляду лікар спостерігає відтік мутної рідини з отвору цієї пазухи. У який утвір носової порожнини спочатку потрапляє рідина з клиноподібної пазухи?", "o": ["Meatus nasi inferior.", "Infundibulum ethmoidale.", "Meatus nasi medius.", "Recessus sphenoethmoidalis.", "Meatus nasi communis. ."], "a": [3], "e": ["У нижній носовий хід відкривається носо-сльозова протока.", "Решітчаста лійка — частина середнього ходу для лобової пазухи.", "Середній хід приймає лобову, верхньощелепну пазухи і передні комірки.", "Клиноподібна пазуха відкривається в клино-решітчастий закуток над верхньою раковиною.", "Спільний хід лежить біля перегородки."]}, {"n": "26.7", "q": "Жінка 50 років звернулася до лікаря зі скаргами на хронічний нежить. МРТ-обстеження виявило запалення задніх решітчастих комірок. З яким носовим ходом сполучаються задні решітчасті комірки?", "o": ["Верхнім носовим ходом.", "Середнім носовим ходом.", "Нижнім носовим ходом.", "Спільним носовим ходом.", "Носоглотковим ходом."], "a": [0], "e": ["Задні решітчасті комірки відкриваються у верхній носовий хід.", "У середній хід відкриваються передні і середні комірки.", "У нижній хід відкривається носо-сльозова протока.", "Спільний хід лежить між раковинами і перегородкою.", "Носоглотковий хід веде до хоан."]}, {"n": "26.8", "q": "Жінка 33 років звернулася до лікаря зі скаргою на ускладнення носового дихання. Після обстеження лікар виявив викривлення кістки, яка майже вся утворює задньонижню частину кісткової носової перегородки. Яка кістка викривлена?", "o": ["Верхня щелепа (maxilla).", "Нижня щелепа (mandibula).", "Вилична кістка (os zygomaticum).", "Леміш (vomer).", "Піднебінна кістка (os palatinum)."], "a": [3], "e": ["Верхня щелепа утворює дно і бічну стінку носової порожнини.", "Нижня щелепа не входить до носа.", "Вилична кістка не належить до перегородки.", "Леміш утворює задньонижню частину кісткової носової перегородки.", "Піднебінна кістка утворює задню частину дна і бічну стінку."]}, {"n": "26.9", "q": "До оториноларинголога звернувся 25-річний чоловік із гострим запаленням слизової оболонки носової порожнини (ринітом). Через кілька днів розвинулися ускладнення: запальний процес із носової порожнини поширився в очну ямку, викликаючи подразнення кон’юнктиви та набряк повік. Це свідчить про поширення інфекції через утвір, що сполучає ці порожнини. Через який анатомічний утвір інфекція найімовірніше потрапляє з носової порожнини в очну ямку?", "o": ["Ductus nasolacrimalis.", "Foramen ethmoidale anteriоr.", "Infundibulum.", "Foramen ethmoidale posteriоr.", "Meatus nasopharyngeus."], "a": [0], "e": ["Носо-сльозова протока сполучає очну ямку (сльозовий мішок) з нижнім носовим ходом.", "Передній решітчастий отвір веде в передню черепну ямку.", "Решітчаста лійка веде в лобову пазуху.", "Задній решітчастий отвір веде в черепну ямку.", "Носоглотковий хід веде в глотку."]}, {"n": "26.10", "q": "У лікарню каретою швидкої медичної допомоги госпіталізовано чоловіка 30 років з травмою носа. Під час проведення рентгенолонічного обстеження лікар виявив перелом кістки черепа, що обмежує верхній край грушоподібного отвору кісткової носової порожнини. Яка кістка ушкоджена в даному випадку?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [3], "e": ["Сльозова кістка лежить у присередній стінці очної ямки.", "Верхня щелепа обмежує грушоподібний отвір збоку і знизу.", "Лобова кістка утворює перенісся вище отвору.", "Верхній край грушоподібного отвору утворений нижніми краями носових кісток.", "Решітчаста кістка лежить глибше."]}, {"n": "26.11", "q": "До оториноларинголога звернулася мати 6-річної дитини зі скаргами на утруднене носове дихання, хропіння під час сну та часті носові кровотечі. Для оцінки стану дитини лікар ретельно оглядає всі утвори носової порожнини та її сполучення з приносовими пазухами, оскільки від кожної частини носової порожнини існує свій шлях розповсюдження інфекції. На які частини поділяється носова порожнина?", "o": ["Присінок носа, власно носова порожнина.", "Зовнішній ніс, присінок носа.", "Присінок носа, носова порожнина.", "Присінок носа, порог носа, хоани.", "Зовнішній ніс, носові ходи і раковини."], "a": [0], "e": ["Носова порожнина поділяється на присінок носа і власне носову порожнину.", "Зовнішній ніс не є частиною носової порожнини.", "Присінок і власне порожнина — правильно, але «носова порожнина» тут неточна назва.", "Поріг носа і хоани — межі, а не частини.", "Зовнішній ніс і ходи — неточний поділ."]}, {"n": "26.12", "q": "Чоловік 42-х років звернувся до оториноларинголога зі скаргами на постійну закладеність однієї половини носової порожнини та рецидивуючі синусити (запалення слизової оболонки приносових пазух). Під час огляду лікар підозрює значне викривлення носової перегородки (septum nasi). Які частини має носова перегородка?", "o": ["Перетинчаста, хрящова, кісткова.", "Перетинчаста, кісткова, шкіряна.", "Перетинчаста, м’язова, хрящова.", "Мʼязова, кісткова, хрящова.", "Жирова, кісткова, хрящова."], "a": [0], "e": ["Носова перегородка має перетинчасту, хрящову і кісткову частини.", "Шкіряної частини немає.", "М’язової частини немає.", "М’язової частини немає.", "Жирової частини немає."]}, {"n": "26.13", "q": "Чоловік 55 років звернувся до лікаря зі скаргами на сильний головний біль у лобовій ділянці, нежить, а також на підвищення температури тіла. Додаткове обстеження виявило у пацієнти запалення слизової оболонки носової порожнини та приносової пазухи – етмоїдит. Існує ризик поширення інфекції до передньої черепної та очної ямки. Через який утвір інфекція може потрапити у передню черепну ямку?", "o": ["Клино-піднебінний отвір.", "Дірчасті отвори.", "Півмісяцевий розтвір.", "Носо-сльозова протока", "Клино-решітчастий закуток."], "a": [1], "e": ["Клино-піднебінний отвір веде в крилопіднебінну ямку.", "Через отвори дірчастої пластинки решітчастої кістки носова порожнина сполучається з передньою черепною ямкою.", "Півмісяцевий розтвір веде у верхньощелепну пазуху.", "Носо-сльозова протока веде в очну ямку.", "Клино-решітчастий закуток веде у клиноподібну пазуху."]}, {"n": "26.14", "q": "Дитину із хронічним гнійним синуситом, що не піддається консервативному лікуванню, готують до функціональної ендоскопічної хірургії пазух (FESS), успіх якої спрямований на відновлення дренажу через середній носовий хід. З якими утворами сполучається середній носовий хід?", "o": ["Клиноподібною пазухою, задніми та середніми решітчастими комірками.", "Верхньощелепною пазухою, лобовою пазухою, передніми решітчастими комірками.", "Носо-сльозовою протокою.", "Верхньощелепною пазухою, лобовою пазухою, носо-сльозовою протокою.", "Носо-сльозовою протокою, клиноподібною пазухою, середніми решітчастими комірками."], "a": [1], "e": ["Клиноподібна пазуха і задні комірки відкриваються вище.", "Середній носовий хід сполучається з верхньощелепною, лобовою пазухами і передніми (середніми) решітчастими комірками.", "Носо-сльозова протока відкривається в нижній хід.", "Носо-сльозова протока відкривається в нижній хід.", "Клиноподібна пазуха і протока відкриваються не в середній хід."]}, {"n": "26.15", "q": "У пацієнта ендоскопічно виявлено поліп на верхній стінці носової порожнини, який майже повністю закриває простір між носовою перегородкою та бічною стінкою. Хірургу необхідно чітко знати анатомічні особливості та сполучення спільного носового ходу (meatus nasi communis), щоб безпечно видалити новоутворення. З якими структурами сполучається спільний носовий хід зверху?", "o": ["Клиноподібною пазухою, задніми та середніми решітчастими комірками.", "Верхньощелепною пазухою, лобовою пазухою, передніми решітчастими комірками.", "Дірчастими отворами дірчастої пластинки решітчастої кістки.", "Верхньощелепною пазухою, лобовою пазухою, носо-сльозовою протокою.", "Носо-сльозовою протокою, клиноподібною пазухою, середніми решітчастими комірками."], "a": [2], "e": ["Ці утвори сполучаються з верхнім ходом і закутком.", "Ці утвори сполучаються з середнім ходом.", "Зверху спільний носовий хід через дірчасту пластинку сполучається з передньою черепною ямкою.", "Ці утвори належать до середнього і нижнього ходів.", "Ці утвори належать до різних ходів."]}, {"n": "26.16", "q": "У приймальне відділення лікарні госпіталізовано чоловіка з гострим набряком слизової оболонки гортані та ознаками обструкції дихальних шляхів, що вимагає негайного хірургічного втручання – конікотомії. Щоб швидко та безпечно провести маніпуляцію, лікар повинен точно знати скелетотопію та синтопію гортані. На яку шийну ділянку проєктується гортань?", "o": ["На передню шийну ділянку", "На задню шийну ділянку.", "На бічну шийну ділянку.", "На підборідний трикутник.", "На піднижньощелепний трикутник."], "a": [0], "e": ["Гортань лежить у передній ділянці шиї.", "Задня ділянка шиї — потилична, гортані там немає.", "Бічна ділянка шиї лежить збоку.", "Підпідборідний трикутник лежить вище під’язикової кістки.", "Піднижньощелепний трикутник лежить вище."]}, {"n": "26.17", "q": "Пацієнт отримав травму шиї внаслідок ДТП. Під час обстеження хірург діагностував ушкодження гортані і має швидко локалізувати його шляхом екстреної трахеостомії або інтубації. Для точної ідентифікації місця ушкодження та уникнення травмування оточуючих структур, важливо знати скелетотопію гортані. На рівні яких хребців розміщена гортань?", "o": ["I–II шийні хребців.", "III–IV шийні хребців.", "IV–V шийні хребців", "IV–VI шийні хребців.", "VI–VII шийні хребців."], "a": [3], "e": ["I–II шийні — рівень носоглотки.", "III–IV — дещо високо.", "IV–V — неповний діапазон.", "Гортань у дорослого лежить на рівні IV–VI шийних хребців.", "VI–VII — рівень трахеї."]}, {"n": "26.18", "q": "50-річний чоловік із вузловим зобом скаржиться на відчуття тиску в передній шийній ділянці та утруднене дихання, що може бути спричинене тиском щитоподібної залози на сусідні утвори. При плануванні операції на щитоподібній залозі, хірург має чітко знати топографію органів шиї. Що розташовується попереду гортані?", "o": ["Підпідʼязикові мʼязи.", "Надпідʼязикові мʼязи.", "Гортанна частина глотки.", "Судинно-нервовий пучок шиї.", "Підʼязикова кістка."], "a": [0], "e": ["Попереду гортані лежать підпід’язикові м’язи (і щитоподібна залоза).", "Надпід’язикові м’язи лежать вище під’язикової кістки.", "Гортанна частина глотки лежить позаду гортані.", "Судинно-нервовий пучок лежить збоку.", "Під’язикова кістка лежить вище гортані."]}, {"n": "26.19", "q": "Чоловіку 45 років із пухлиною гортані заплановано хірургічне втручання. Хірург має ретельно оцінити розташування пухлини, щоб уникнути ушкодження сусідніх органів під час оперативного втручання. Що розташовується позаду гортані?", "o": ["Підпідʼязикові мʼязи.", "Надпідʼязикові мʼязи.", "Гортанна частина глотки.", "Судинно-нервовий пучок шиї.", "Підʼязикова кістка."], "a": [2], "e": ["Підпід’язикові м’язи лежать попереду.", "Надпід’язикові м’язи лежать вище.", "Позаду гортані лежить гортанна частина глотки.", "Судинно-нервовий пучок лежить збоку.", "Під’язикова кістка лежить вище."]}, {"n": "26.20", "q": "До лікаря звернувся 55-річний чоловік зі скаргами на стійку осиплість голосу (дисфонію). Під час ларингоскопії лікар виявив доброякісне новоутворення (папілому), що розташовано на вільному верхньому краю еластичного конуса (conus elasticus). Який анатомічний утвір гортані уражений у пацієнта?", "o": ["Голосові звʼязки.", "Чотирикутна перетинка.", "Присінкові звʼязки.", "Надгортанник.", "Шлуночок гортані."], "a": [0], "e": ["Вільний верхній край еластичного конуса утворює голосові зв’язки.", "Чотирикутна перетинка утворює присінкові зв’язки.", "Присінкові зв’язки — нижній край чотирикутної перетинки.", "Надгортанник — хрящ.", "Шлуночок гортані лежить між складками."]}, {"n": "26.21", "q": "50-річний пацієнт скаржиться на тривалу відсутність відчуття запаху (аносмію), що виникла на тлі хронічного запалення слизової оболонки носової порожнини. Набряк і гіпертрофія слизової оболонки призвели до порушення функції рецепторів нюхового нерва. У якій ділянці носової порожнини розташовані нюхові рецептори?", "o": ["У ділянці concha nasi superior.", "У ділянці meatus nasi communis.", "У ділянці concha nasi inferior.", "У ділянці meatus nasopharyngeus.", "У ділянці bulla ethmoidalis."], "a": [0], "e": ["Нюхова ділянка розташована на слизовій верхньої носової раковини і верхньої частини перегородки.", "Спільний носовий хід — дихальна ділянка.", "Нижня раковина — дихальна ділянка.", "Носоглотковий хід — дихальна ділянка.", "Решітчастий пухир лежить у середньому ході."]}, {"n": "26.22", "q": "35-річний чоловік звернувся до оториноларинголога зі скаргами на тривалий головний біль, відчуття тиску, гнійні виділення з носа. Під час риноскопії (обстеження носової порожнини) лікар виявив гній, що витікає безпосередньо через решітчасту лійку. Яка приносова пазуха сполучається з носовою порожниною через решітчасту лійку?", "o": ["Лобова пазуха.", "Клиноподібна пазуха.", "Верхньощелепна пазуха.", "Задні решітчасті комірки.", "Передні решітчасті комірки."], "a": [0], "e": ["Лобова пазуха відкривається через решітчасту лійку в середній носовий хід.", "Клиноподібна пазуха відкривається в клино-решітчастий закуток.", "Верхньощелепна пазуха відкривається в півмісяцевий розтвір.", "Задні комірки відкриваються у верхній хід.", "Передні комірки відкриваються в середній хід, не через лійку."]}, {"n": "26.23", "q": "5-річну дитину доставлено у лікарню з пораненням у передньому трикутнику шиї. Під час обстеження виявлено ураження одного із з’єднань гортані, що розташоване між нижнім краєм перснеподібного хряща гортані та першим трахейним хрящем. Це ушкодження потребує негайної хірургічної корекції. Яка зв’язка ушкоджена?", "o": ["Ligamentum cricotracheale.", "Ligamentum vocale.", "Ligamentum cricopharyngeum.", "Ligamentum ceratocricoideum.", "Ligamentum cricothyroideum medianum."], "a": [0], "e": ["Перснеподібно-трахейна зв’язка з’єднує нижній край перснеподібного хряща з першим трахейним хрящем.", "Голосова зв’язка натягнута між щитоподібним і черпакуватим хрящами.", "Перснеподібно-глоткова зв’язка йде до глотки.", "Ріжково-перснеподібна зв’язка біля суглоба.", "Серединна перснеподібно-щитоподібна зв’язка лежить між щитоподібним і перснеподібним хрящами."]}, {"n": "26.24", "q": "3-річну дитину екстрено госпіталізовано з ознаками гострого ларингіту (несправжній круп) та прогресуючою задишкою. Під час огляду лікар діагностував набряк слизової оболонки в найвужчій частині порожнини гортані. Цей відділ є критичним у дітей, оскільки його звуження, навіть на 1 мм, значно зменшує прохід для повітря. У якому відділі порожнини гортані у дитини лікар виявив запалення?", "o": ["Glottis.", "Vestibulum laryngis.", "Aditus laryngis.", "Cavitas infraglottica.", "Ventriculus laryngis."], "a": [0], "e": ["Найвужча частина порожнини гортані — голосник (голосова щілина).", "Присінок — ширша верхня частина.", "Вхід у гортань широкий.", "Підголосникова порожнина ширша (хоча у дітей набряк тут теж небезпечний).", "Шлуночок — бічна кишеня."]}, {"n": "26.25", "q": "Лікар проводить ларингоскопію у дитини та виявляє пухлину на слизовій оболонці в присінку гортані. Новоутворення розташовано вздовж нижнього вільного краю чотирикутної пластинки (membrana quadrangularis). Точне визначення цього краю є необхідним для встановлення стадії пухлинного процесу та планування лікування. Яка зв’язка утворена нижніми краями membrana quadrangularis?", "o": ["Ligamentum vestibulare.", "Ligamentum vocale.", "Ligamentum thyroepiglotticum.", "Ligamentum thyrohyoideum laterale.", "Ligamentum thyrohyoideum medianum."], "a": [0], "e": ["Нижній край чотирикутної перетинки утворює присінкову зв’язку.", "Голосова зв’язка утворена еластичним конусом.", "Щитоподібно-надгортанна зв’язка кріпить надгортанник.", "Бічна щито-під’язикова зв’язка лежить поза гортанню.", "Серединна щито-під’язикова зв’язка лежить поза гортанню."]}, {"n": "26.26", "q": "У пацієнта виявлено порушення ковтання: їжа потрапляє в присінок порожнини гортані, викликаючи кашель і ризик аспірації. Лікар запідозрив параліч або ураження м’яза, який є ключовим для захисту дихальних шляхів, оскільки він тягне надгортанник назад і нахиляє його, закриваючи вхід до гортані. Який м’яз не виконує свою функцію у пацієнта?", "o": ["Musculus thyroepiglitticus.", "Musculus aryepiglotticus.", "Musculus arytenoideus transversus.", "Musculus cricoarytenoideus posterior.", "Musculus cricoarytenoideus lateralis."], "a": [1], "e": ["Щито-надгортанний м’яз піднімає надгортанник і розширює вхід.", "Черпакувато-надгортанний м’яз нахиляє надгортанник назад і закриває вхід у гортань.", "Поперечний черпакуватий м’яз звужує голосову щілину.", "Задній перснечерпакуватий м’яз розширює голосову щілину.", "Бічний перснечерпакуватий м’яз звужує щілину."]}, {"n": "26.27", "q": "До лікаря звернувся 45-річний чоловік зі скаргами на осиплість голоса (дисфонію) та відчуття стороннього тіла в горлі. Під час ларингоскопії (обстеження гортані) лікар діагностував гостре запалення слизової оболонки гортані, особливо виражене в місці з'єднання непарного хряща гортані з трахеєю. В місці якого хряща виявлено запалення?", "o": ["Перснеподібного хряща.", "Щитоподібного хряща.", "Черпакуватого хряща.", "Клиноподібного хряща.", "Ріжкуватого хряща."], "a": [0], "e": ["Непарний хрящ, що з’єднується з трахеєю, — перснеподібний.", "Щитоподібний хрящ з’єднується з під’язиковою кісткою.", "Черпакуватий хрящ — парний.", "Клиноподібний хрящ — парний.", "Ріжкуватий хрящ — парний."]}, {"n": "26.28", "q": "До лікаря звернулася 15-річна дівчина зі скаргами на порушення голосоутворення, проявами якого є важкість підвищити тон та швидка стомлюваність при розмові. Обстеження виявило функціональне порушення роботи м’язa гортані, який відповідає за натяг голосових зв’язок шляхом нахилу щитоподібного хряща вперед і донизу. Який м’яз гортані виконує цю функцію?", "o": ["Musculus cricothyroideus.", "Musculus arytenoidei obliquus.", "Musculus vocales.", "Musculus thyroepiglotticus.", "Musculus cricoarytenoideus posterior."], "a": [0], "e": ["Перснеподібно-щитоподібний м’яз нахиляє щитоподібний хрящ вперед і натягує голосові зв’язки.", "Косий черпакуватий м’яз звужує вхід.", "Голосовий м’яз регулює напругу частин зв’язки, але не нахиляє хрящ.", "Щито-надгортанний м’яз розширює вхід.", "Задній перснечерпакуватий м’яз розширює щілину."]}, {"n": "26.29", "q": "40-річна жінка звернулася до лікаря зі скаргами на задишку (утруднене дихання), особливо під час фізичного навантаження. При проведенні ларингоскопії лікар виявив, що під час вдиху голосова щілина (rima glottidis) залишається вузькою і не відбувається її розширення. Це свідчить про параліч певних м’язів гортані. Які мʼязи розширюють голосову щілину?", "o": ["Musculi cricoarytenoidei posteriores, musculi thyroepiglotticus.", "Musculi cricoarytenoidei laterales, musculi thyroepiglotticus.", "Musculi vocales, musculi thyroepiglotticus.", "Musculi arytenoidei obliqui, musculi thyroepiglotticus.", "Musculi thyroarytenoidei, musculi thyroepiglotticus."], "a": [0], "e": ["Голосову щілину розширюють задні перснечерпакуваті м’язи; щито-надгортанні розширюють вхід у гортань.", "Бічні перснечерпакуваті м’язи звужують щілину.", "Голосові м’язи натягують зв’язки.", "Косі черпакуваті м’язи звужують вхід.", "Щито-черпакуваті м’язи звужують щілину."]}, {"n": "26.30", "q": "Батьки 3-річної дитини звернулися до лікаря зі скаргами на інтенсивний кашель, осиплість голосу (дисфонію) та утруднене дихання. Під час ларингоскопії лікар діагностував гостре запалення слизової оболонки гортані, локалізоване у вузькому просторі між голосовими складками (plicae vocales) знизу та присінковими складками (plicae vestibulares) зверху. У якій ділянці порожнини гортані (cavitas laryngis) виявлене запалення?", "o": ["У присінковій щилині.", "У голоснику.", "У присінку гортані.", "У підголосниковій порожнині.", "У голосовій щілині."], "a": [1], "e": ["Присінкова щілина — щілина між присінковими складками.", "Голосник — проміжна частина між присінковими складками зверху і голосовими знизу.", "Присінок лежить над присінковими складками.", "Підголосникова порожнина лежить нижче голосових складок.", "Голосова щілина — лише щілина між голосовими складками."]}, {"n": "26.31", "q": "До лікаря звернувся 55-річний чоловік зі скаргами на стійку осиплість голосу (дисфонію). Під час ларингоскопії лікар виявив доброякісне новоутворення (папілому), що розташовано на вільному верхньому краю еластичного конуса (conus elasticus). Який анатомічний утвір гортані уражений у пацієнта?", "o": ["Голосові звʼязки.", "Чотирикутна перетинка.", "Присінкові звʼязки.", "Надгортанник.", "Шлуночок гортані."], "a": [0], "e": ["Вільний верхній край еластичного конуса утворює голосові зв’язки.", "Чотирикутна перетинка утворює присінкові зв’язки.", "Присінкові зв’язки — нижній край чотирикутної перетинки.", "Надгортанник — хрящ.", "Шлуночок гортані лежить між складками."]}], "models": [["Гортань: хрящі, м'язи, зв'язки", "sf:3b247ff11b104e24acbb1c453f5bad46", {"ru": "Гортань: хрящи, мышцы, связки", "en": "Larynx: cartilages, muscles, ligaments"}], ["Сагітальний розріз черепа (носова порожнина)", "sf:5e73a548332742c8bc722d5f14ae35f0", {"ru": "Сагиттальный разрез черепа (носовая полость)", "en": "Sagittal section of skull (nasal cavity)"}], ["Дихальні шляхи і легені", "sf:1cd55d26c1254ab7a5d0845fb9a207fe", {"ru": "Дыхательные пути и лёгкие", "en": "Airways and lungs"}]]}, {"id": "topic27", "title": "27. Трахея, бронхи, легені. Плевра. Середостіння", "tr": {"ru": "27. Трахея, бронхи, лёгкие. Плевра. Средостение", "en": "27. Trachea, bronchi, lungs. Pleura. Mediastinum"}, "questions": [{"n": "27.1", "q": "Жінці 70 років проведена бронхоскопія з приводу підозри на пухлину бронхів. Під час введення бронхоскопа лікар відчув опір і після чого у пацієнтки з’явилися скарги на біль за грудниною, утруднене ковтання та підшкірну крепітацію (подібно до хрустіння снігу) в ділянці шиї. Під час рентгенографії виявлено підшкірну емфізему та ознаки медіастинальної емфіземи (руйнування стінок альвеол, що призводить до зменшення загальної площі газообміну). Ушкодження розташовано в ділянці стінки трахеї, що межує зі стравоходом. Який утвір трахеї межує із стравоходом?", "o": ["Передня поверхня трахеї.", "Перетинчаста стінка трахеї.", "Волокнистом’язово-хрящова оболонка трахеї.", "Трахейні хрящі.", "Кіль трахеї."], "a": [1], "e": ["Передня поверхня трахеї утворена хрящовими півкільцями і звернена до щитоподібної залози.", "Задня перетинчаста (м’язова) стінка трахеї без хрящів прилягає до стравоходу.", "Волокнисто-м’язово-хрящова оболонка охоплює всю трахею, а не лише задню стінку.", "Трахейні хрящі відкриті ззаду і стравоходу не торкаються.", "Кіль трахеї — виступ усередині біфуркації."]}, {"n": "27.2", "q": "Жінка 40 років пройшла рентгенологічне обстеження органів грудної порожнини. Лікар-рентгенолог виявив ознаки запалення лімфатичних вузлів, що розташовані нижче кореня легені, у точці переходу пристінкової плеври у нутрощеву. Для точного опису локалізації патологічного процесу йому необхідно знати особливості розташування легеневої зв'язки. Де знаходиться легенева зв’язка (ligamentum pulmonale)?", "o": ["На середостінній поверхні легені.", "На верхвці легені.", "На міжчастковій поверхні легені.", "На діафрагмовій поверхні легені.", "На ребровій поверхні легені."], "a": [0], "e": ["Легенева зв’язка — дублікатура плеври нижче кореня легені на середостінній поверхні.", "На верхівці легенева зв’язка не розташована.", "На міжчастковій поверхні зв’язки немає.", "На діафрагмовій поверхні зв’язки немає.", "На ребровій поверхні зв’язки немає."]}, {"n": "27.3", "q": "Кардіохірург проводить операцію на серці. Під час хірургічного втручання він здійснює ревізію анатомічного простору, що розташований між двома плевральними порожнинами. Цей простір містить життєво важливі органи, включаючи серце, трахею, великі судини та стравохід. Для точного документування операції лікарю необхідно вказати анатомічне визначення середостіння. Яке основне визначення для середостіння (mediastinum)?", "o": ["Комплекс органів.", "Порожнина.", "Комплекс серця і судин.", "Комплекс м’язів і фасцій.", "Частина плевральної порожнини."], "a": [0], "e": ["Середостіння — комплекс органів між правою і лівою плевральними порожнинами.", "Середостіння не є порожниною.", "Крім серця і судин там трахея, стравохід, нерви тощо.", "М’язи і фасції — не основний вміст середостіння.", "Середостіння лежить між плевральними порожнинами, а не в них."]}, {"n": "27.4", "q": "У чоловіка 50 років діагностовано запалення легені, яке ускладнилося ексудативним плевритом (накопичення в плевральній порожнині серозної рідини). Для проведення торакоцентезу (дренування) лікарю необхідно визначити найглибший резервний закуток між пристінковим та нутрощевим листками плеври, де рідина накопичується під дією сили тяжіння. У якому із перерахованих анатомічних утворів буде накопичується серозна рідина при ексудативному плевриті?", "o": ["Recessus costodiaphragmaticus pleurae.", "Recessus vertebromediastinalis", "Recessus phrenicomediastinalis pleurae.", "Sinus transversus pericardii.", "Recessus costomediastinalis pleurae."], "a": [0], "e": ["Реброво-діафрагмовий закуток — найглибший і найнижчий, тут накопичується рідина.", "Хребтово-середостінний закуток неглибокий.", "Діафрагмово-середостінний закуток малий.", "Поперечна пазуха належить осердю.", "Реброво-середостінний закуток лежить спереду і менший."]}, {"n": "27.5", "q": "Хірург проводить сегментектомію у чоловіка 40 років з приводу локалізованого новоутворення. Обсяг оперативного втручання передбачає видалення верхнього язичкового сегмента (segmentum lingulare superius). Для точного визначення анатомічних меж та завершення операції лікарю необхідно чітко вказати, до якої частки та якої саме легені належить цей сегмент. Ділянку якої частки легені у чоловіка видаляє лікар?", "o": ["Lobus superior pulmonis dexter.", "Lobus inferior pulmonis dexter.", "Lobus medius pulmonis dextri.", "Lobus inferior pulmonis sinister.", "Lobus superior pulmonis sinister."], "a": [4], "e": ["Права верхня частка язичкових сегментів не має.", "Права нижня частка язичкових сегментів не має.", "Середня частка правої легені має бічний і присередній сегменти.", "Ліва нижня частка — базальні сегменти.", "Верхній і нижній язичкові сегменти належать верхній частці лівої легені."]}, {"n": "27.6", "q": "Чоловік 37 років з дитинства хворіє на туберкульоз, що призвів до незворотних змін у легеневій паренхімі. Йому була призначена лобектомія – оперативне втручання, під час якого була повністю видалена середня частка правої легені. Для оцінки обсягу видаленої тканини та її подальшого гістологічного дослідження, лікарю необхідно чітко знати, з яких саме бронхо-легеневих сегментів складається ця частка. Які сегменти були видалені у чоловіка?", "o": ["Segmentum laterale et mediale.", "Segmentum anterius et posterius.", "Segmentum lingulare superius et inferius.", "Segmentum basale mediale et laterale.", "Segmentum anterius et apicale."], "a": [0], "e": ["Середня частка правої легені складається з бічного і присереднього сегментів.", "Передній і задній сегменти належать верхній частці.", "Язичкові сегменти належать лівій легені.", "Базальні сегменти належать нижній частці.", "Передній і верхівковий сегменти належать верхній частці."]}, {"n": "27.7", "q": "Під час торакоскопії у чоловіка 34 років лікар виявив спайковий процес у плевральній порожнині. Було виявлено, що волокнисті тяжі (спайки) з’єднують пристінкову плевру (яка вистеляє стінки грудної порожнини) з нутрощевою плеврою, що покриває верхівковий сегмент правої легені. Для точного опису локалізації цього ураження лікарю необхідно назвати найвищу ділянку плевральної порожнини. Де знаходяться волокнисті тяжі (спайки), що з’єднують пристінкову плевру з нутрощевою плеврою?", "o": ["Cupula pleurae.", "Recessus costodiaphragmaticus.", "Recessus costomediastinalis.", "Recessus phrenicomediastinalis.", "Recessus vertebromediastinalis."], "a": [0], "e": ["Купол плеври — найвища частина плевральної порожнини над верхівкою легені.", "Реброво-діафрагмовий закуток лежить унизу.", "Реброво-середостінний закуток лежить спереду.", "Діафрагмово-середостінний закуток лежить унизу присередньо.", "Хребтово-середостінний закуток лежить ззаду."]}, {"n": "27.8", "q": "У чоловіка 60 років рентгенологічно підтверджено гостре запалення паренхіми правої легені (пневмонія). При цій патології ураження легеневих ацинусів призводить до значного порушення газообміну між повітрям та кров’ю. Кожен ацинус є територією розгалуження найдрібніших повітроносних шляхів. Територією розгалуження якого бронха (за порядком гілкування) є ацинус?", "o": ["Одної кінцевої бронхіоли.", "Часточкової бронхіоли.", "Часткового бронха.", "Сегментного бронха.", "Альвеолярної бронхіоли."], "a": [0], "e": ["Ацинус — розгалуження однієї кінцевої бронхіоли (дихальні бронхіоли, альвеолярні ходи, мішечки).", "Часточкова бронхіола дає кілька кінцевих бронхіол.", "Частковий бронх — набагато більша одиниця.", "Сегментний бронх — набагато більша одиниця.", "Альвеолярних бронхіол як окремого рівня немає."]}, {"n": "27.9", "q": "Під час дозвілля в дихальні шляхи хлопчика 8 років потрапило стороннє тіло. Після проведення бронхоскопії виявлена маленька пластикова іграшка в місці розгалудження трахеї на головні бронхи. На рівні яких грудних хребців скелетотопічно розташована біфуркація трахеї?", "o": ["ThI–ThII.", "ThII–ThIII.", "ThIII–ThIV.", "ThIV–ThV.", "ThV–ThVI."], "a": [3], "e": ["ThI–ThII — рівень початку грудної частини трахеї.", "ThII–ThIII — вище біфуркації.", "ThIII–ThIV — дещо високо.", "Біфуркація трахеї розташована на рівні IV–V грудних хребців.", "ThV–ThVI — нижче біфуркації."]}, {"n": "27.10", "q": "У хірургічне відділення лікарні госпіталізовано чоловіка 30 років із ножовим пораненням грудної клітки справа та ознаками пневмотораксу (проникнення повітря в плевральну порожнину). Перкуторно нижня границя правої легені по середньоключичній лінії піднялася на рівень 5 ребра. На рівні якого ребра розташована нижня межа легені по середньоключичній лінії в нормі?", "o": ["6 ребра.", "7 ребра.", "8 ребра.", "9 ребра.", "10 ребра."], "a": [0], "e": ["У нормі нижня межа легені по середньоключичній лінії — VI ребро.", "VII ребро — по передній пахвовій лінії.", "VIII ребро — по середній пахвовій лінії.", "IX ребро — по задній пахвовій лінії.", "X ребро — по лопатковій лінії."]}, {"n": "27.11", "q": "Пацієнт проходить комплексне обстеження органів грудної порожнини. Під час проведення МРТ-дослідження на середостінній поверхні правої легені лікар визначає утвори, що входять і виходять із органа, формуючи radix pulmonis, та має правильно визначити їхнє взаємне розташування по вертикалі. В ділянці воріт правої легені зверху донизу анатомічно розташовані:", "o": ["Головний бронх, легенева артерія, дві легеневі вени.", "Легенева артерія, головний бронх, дві легеневі вени.", "Дві легеневі вени, головний бронх, легенева артерія.", "Дві легеневі вени, легенева артерія, головний бронх.", "Головний бронх, дві легеневі артерії, дві легеневі вени."], "a": [0], "e": ["У корені правої легені зверху вниз: головний бронх, легенева артерія, легеневі вени.", "Так розташовані утвори кореня лівої легені.", "Вени лежать унизу.", "Вени лежать унизу.", "Легенева артерія одна."]}, {"n": "27.12", "q": "Чоловіку 67 років проводять правобічну пульмонектомію (видалення правої легені) з приводу злоякісної пухлини. Після розтину середостінної плеври насам перед необхідно перев’язати легеневі вени, щоб зменшити можливість розповсюдження (диссемінації) пухлинних клітин. Щоб уникнути помилки, хірургу потрібно згадати порядок розташування анатомічних утворів кореня лівої легені. Як розташовуються анатомічні утвори кореня лівої легені в напрямку зверху вниз?", "o": ["Головний бронх, легенева артерія, легеневі вени.", "Легенева артерія, головний бронх, легеневі вени.", "Легенева артерія, легеневі вени, головний бронх.", "Легеневі вени, легенева артерія, головний бронх.", "Головний бронх, легенева артерія, легеневі вени."], "a": [1], "e": ["Так розташовані утвори кореня правої легені.", "У корені лівої легені зверху вниз: легенева артерія, головний бронх, легеневі вени.", "Бронх лежить між артерією і венами.", "Вени лежать унизу.", "Так розташовані утвори правої легені."]}, {"n": "27.13", "q": "Жінка 30 років звернулася до сімейного лікаря зі скаргами на дискомфорт у грудній клітці. За результатами високоточної комп’ютерної томографії пульмонолог виявив патологічні зміни у присередньому сегменті (segmentum mediale) легені. Для постановки точного діагнозу та планування лікування лікарю необхідно знати, до якої частки і якої саме легені (правої чи лівої) входить цей сегмент. Яка частка і якої легені ушкоджена у жінки, якщо патологічний процес локалізовано у присередньому сегменті?", "o": ["Середня частка правої легені.", "Нижня частка правої легені.", "Верхня частка правої легені.", "Нижня частка лівої легені.", "Верхня частка лівої легені."], "a": [0], "e": ["Присередній сегмент належить середній частці правої легені.", "У нижній частці є присередній базальний сегмент, але це інша назва.", "Верхня частка правої легені має верхівковий, задній і передній сегменти.", "Ліва нижня частка не має присереднього сегмента.", "Ліва верхня частка має язичкові сегменти."]}, {"n": "27.14", "q": "У чоловіка 60-ти років під час рентгенологічного обстеження органів грудної порожнини лікар виявив пухлину в одному із бронхів. Враховуючи особливості розташування утворів у грудній порожнині, лікар відзначає, що уражений бронх перетинає дуга аорти. Ця топографічна особливість є визначальною для ідентифікації сторони ураження та порядку поділу бронхового дерева. У якому бронху розташована пухлина, якщо відомо, що цей бронх перетинає аорта?", "o": ["Лівому головному бронху.", "Правому головному бронху.", "Правому верхньому частковому бронху.", "Лівому верхньому частковому бронху.", "Середньому частковому бронху."], "a": [0], "e": ["Через лівий головний бронх перекидається дуга аорти.", "Через правий головний бронх перекидається непарна вена.", "Правий верхній частковий бронх аорта не перетинає.", "Лівий верхній частковий бронх лежить нижче.", "Середній частковий бронх є лише праворуч."]}, {"n": "27.15", "q": "Під час торакальної операції у чоловіка 40 років лікар обстежує ліву легеню і виявляє невеликий крововилив у ділянці, де орган прилягає до серця. Ця ділянка залишає на легені глибоке заглиблення, відоме як серцеве втиснення (impressio cardiaca). Для точного опису розташування крововиливу в операційному журналі лікарю необхідно вказати, на якій саме поверхні легені розташоване це втиснення. На якій поверхні легені пацієнта знаходиться крововилив у ділянці серцевого втиснення?", "o": ["Середостінній поверхні лівої легені.", "Середостінній поверхні правої легені.", "Діафрагмовій поверхні лівої легені.", "Діафрагмовій поверхні правої легені.", "Хребтовій частині правої легені."], "a": [0], "e": ["Серцеве втиснення розташоване на середостінній поверхні і глибше виражене на лівій легені.", "На правій легені втиснення менше; тут описано ліву.", "Діафрагмова поверхня звернена до діафрагми.", "Діафрагмова поверхня звернена до діафрагми.", "Хребтова частина звернена до хребта."]}, {"n": "27.16", "q": "До хірурга направлений 50-річний чоловік для обстеження дихальних шляхів у зв’язку з необхідністю проведення трахеостомії (створення штучного отвору трахеї). Для точного визначення місця розрізу хірург повинен чітко знати вертикальні межі органу, щоб уникнути травмування сусідніх утворів (щитоподібної залози, судин, нервів) та визначити місце локалізації трахеї. На рівні яких хребців розташована трахея?", "o": ["VII шийний хребець – IV-V грудний хребець.", "VII шийний хребець – IV грудний хребець.", "VI шийний хребець – V грудний хребець.", "VII шийний хребець – III грудний хребець.", "V шийний хребець – IV грудний хребець."], "a": [2], "e": ["Початок трахеї — на рівні нижнього краю VI шийного хребця, не VII.", "Неточно — трахея починається вище.", "Трахея лежить від VI шийного до V грудного хребця (біфуркація).", "Біфуркація лежить нижче III грудного хребця.", "V шийний — рівень гортані."]}, {"n": "27.17", "q": "Студенти на практичному занятті візуалізують на КТ-зображенні ворота легень – заглиблення на середостінній поверхні. Щоб правильно орієнтуватися під час проведення процедури він має чітко знати, які саме анатомічні утвори входять у легеню через ці ворота, формуючи корінь легені. Які анатомічні утвори входять у легеню через її ворота?", "o": ["Головний бронх, легенева артерія, бронхові гілки, нерви.", "Головний бронх, дві легеневі вени, лімфатичні судини, нерви.", "Головний бронх, дві легеневі артерії, нерви.", "Дві легеневі вени, лімфатичні судини, лімфатичні вузли, нерви.", "Головний бронх, легенева артерія, легеневі вени, лімфатичні судини, нерви."], "a": [0], "e": ["Через ворота в легеню входять головний бронх, легенева артерія, бронхові артерії (гілки) і нерви.", "Легеневі вени і лімфатичні судини виходять з легені.", "Легенева артерія одна.", "Вени і лімфатичні судини виходять.", "Вени і лімфатичні судини виходять, а не входять."]}, {"n": "27.18", "q": "У 60-річного чоловіка, після перенесеної пневмонію, виконується контрольне обстеження легень за допомогою комп’ютерної томографії. Для точного розуміння стану кровообігу та відтоку лімфи з легеневої тканини необхідно чітко ідентифікувати утвори, що виходять з легені через її ворота. Які із наведених утворів виходять із воріт легені?", "o": ["Головний бронх, легенева артерія, нерви.", "Дві легеневі вени, бронхові вени, лімфатичні судини.", "Головний бронх, дві легеневі вени, нерви.", "Дві легеневі вени, лімфатичні судини.", "Головний бронх, легенева артерія, нерви."], "a": [1], "e": ["Бронх і артерія входять, а не виходять.", "З воріт легені виходять дві легеневі вени, бронхові вени і лімфатичні судини.", "Головний бронх входить.", "Неповно — пропущено бронхові вени.", "Бронх і артерія входять."]}, {"n": "27.19", "q": "Чоловік 65 років госпіталізований у лікарню із обструктивним захворюванням легень. Лікар-пульмонолог, плануючи проведення бронхоскопії, ретельно вивчає будову повітроносних шляхів. Знання цієї складної мережі є критичним для безпечного проведення процедури та досягнення ураженої ділянки. Дайте визначення, що таке бронхове дерево?", "o": ["Розгалуження бронхів, починаючи від головного бронха і закінчуючи кінцевими бронхіолами.", "Розгалуження бронхів, починаючи від головного бронха і закінчуючи дихальними бронхіолами.", "Розгалуження бронхів, починаючи від дихальних бронхіол і закінчуючи альвеолами.", "Розгалуження бронхів, починаючи від сегментного бронха і закінчуючи кінцевими бронхіолами.", "Система розгалужень бронхіол, альвеолярних ходів та мішечків, які належать до кінцевої бронхіоли."], "a": [0], "e": ["Бронхове дерево — розгалуження від головного бронха до кінцевих бронхіол.", "Дихальні бронхіоли належать до альвеолярного дерева.", "Це альвеолярне дерево (ацинус).", "Бронхове дерево починається від головного бронха.", "Це визначення ацинуса."]}, {"n": "27.20", "q": "Під час обстеження дитини з підозрою на пневмонію лікар за допомогою комп’ютерної томографії виявив ураження паренхіми легені. Щоб точно класифікувати тип ураження (бронхіоліт, пневмонія) та визначити його поширення, необхідно розуміти, з яких найменших структурно-функціональних одиниць складається паренхіма легень. Які структурно-функціональні одиниці утворюють паренхіму легені?", "o": ["Ацинуси.", "Бронхіоли.", "Частки.", "Сегменти.", "Часточки."], "a": [0], "e": ["Паренхіму легені утворюють ацинуси — структурно-функціональні одиниці.", "Бронхіоли — частина повітроносних шляхів.", "Частки — великі анатомічні одиниці.", "Сегменти — хірургічні одиниці.", "Часточки складаються з ацинусів."]}, {"n": "27.21", "q": "У чоловіка 65 років під час діагностичної бронхоскопії виявлено злоякісне новоутворення. Пухлина розташована в головному бронсі, який лежить нижче від легеневої артерії у ділянці воріт легені. Точне знання цього взаємного розташування структур необхідне лікарю для планування хірургічного втручання та підтвердження сторони ураження. Який головний бронх уражений пухлиною, якщо відомо, що він розташований в ділянці воріт легені нижче легеневої артерії?", "o": ["Лівий головний бронх.", "Правий головний бронх.", "Правий верхній частковий бронх.", "Лівий верхній частковий бронх.", "Середній частковий бронх."], "a": [0], "e": ["Лівий головний бронх у воротах лежить нижче легеневої артерії.", "Правий головний бронх лежить вище легеневої артерії.", "Правий верхній частковий бронх лежить найвище.", "Лівий верхній частковий бронх — гілка головного.", "Середній частковий бронх є лише праворуч."]}, {"n": "27.22", "q": "У чоловіка 60 років з багаторічним стажем куріння, лікар проводить бронхоскопію з метою діагностики новоутворення. Виявлена пухлина розташована в головному бронсі, що проходить під дугою аорти. Знання цієї топографічної особливості критично важливе для визначення сторони ураження та оцінки ризиків оперативного втручання. У якому бронху розташована пухлина?", "o": ["Лівому головному бронху.", "Правому головному бронху.", "Правому верхньому частковому бронху.", "Лівому верхньому частковому бронху.", "Середньому частковому бронху."], "a": [0], "e": ["Під дугою аорти проходить лівий головний бронх.", "Правий головний бронх огинає непарна вена.", "Правий верхній частковий бронх лежить праворуч.", "Лівий верхній частковий бронх відходить нижче.", "Середній частковий бронх є лише праворуч."]}, {"n": "27.23", "q": "Під час бронхоскопічного обстеження чоловіка 40 років лікар оглядає місце поділу трахеї на головні бронхи. Лікар оглядає анатомічний утвір в місці біфуркації трахеї, який є важливим орієнтиром для діагностики та лікування, є місцем локалізації патологічних процесів. Як називається виступ, що розташований у просвіті трахеї в місці її роздвоєння на головні бронхи?", "o": ["Carina.", "Valva.", "Valvula.", "Crista.", "Tuberculum."], "a": [0], "e": ["Кіль трахеї (carina) — виступ у місці роздвоєння трахеї.", "Valva — клапан.", "Valvula — заслінка.", "Crista — гребінь.", "Tuberculum — горбок."]}, {"n": "27.24", "q": "Лікар проводить обстеження органів грудної порожнини у пацієнта перед плановою операцією. Під час аускультації правої легені хірург вислухав хрипи (дихальні шуми) над ключицею, що є характерною ознакою при туберкульозі у верхівковому сегменті верхньої частки легені. Куди проєктується верхівка правої легені спереду?", "o": ["На рівні ключиці.", "На 3-4 см вище першого ребра.", "На рівні остистого відростка шостого шийного хребця.", "На 3-4 см вище ключиці.", "На 3-4 см вище груднини."], "a": [1], "e": ["Верхівка виступає над ключицею.", "Верхівка легені спереду виступає на 3–4 см вище I ребра (на 2–3 см вище ключиці).", "Рівень остистого відростка VII шийного хребця — задня проєкція.", "Над ключицею верхівка виступає на 2–3 см.", "Над грудниною верхівка не проєктується."]}, {"n": "27.25", "q": "Лікар проводить обстеження пацієнта з підозрою на плеврит (запалення плеври) та скупчення рідини (ексудату) в плевральній порожнині. Для безпечного проведення торакоцентезу (проколу стінки грудної порожнини для видалення рідини) необхідно знати той закуток плевральної порожнини, де найчастіше накопичується рідина. Цей закуток (пазуха) є резервною кишенею, утвореною листками плеври. Вкажіть чим утворений реброво-діафрагмова пазуха (sinus costodiaphragmaticus)?", "o": ["Між пристінковими листками, при переході ребрової частини плеври на діафрагмову частину.", "Між нутрощевим листками, при переході ребрової частини плеври на діафрагмову частину.", "Між пристінковими листками, при переході ребрової частини плеври на середостінну частину.", "Між нутрощевими листками, при переході ребрової частини плеври на середостінну частину.", "Ребровою і міжчастковою частинами плеври."], "a": [0], "e": ["Реброво-діафрагмова пазуха утворена пристінковою плеврою при переході ребрової частини в діафрагмову.", "Нутрощева плевра пазух не утворює.", "Перехід ребрової в середостінну частину утворює реброво-середостінний закуток.", "Нутрощева плевра пазух не утворює.", "Міжчасткова плевра пазух не утворює."]}, {"n": "27.26", "q": "Хірург проводить діагностичну торакоскопію (огляд плевральної порожнини) у пацієнта з підозрою на фіброз легеневої тканини. Лікар оглядає нутрощеву плевру — тонку серозну оболонку, що безпосередньо покриває легеню. Для точного опису розташування виявлених змін лікарю необхідно чітко розрізняти анатомічні частини плеври. Які частини має вісцеральна плевра?", "o": ["Реброва, діафрагмова, середостінна.", "Серцева, діафрагмова, середостінна.", "Реброва, хребтова, середостінна.", "Реброва, серцева, середостінна.", "Реброва, діафрагмова, пристінкова."], "a": [0], "e": ["За анатомічною класифікацією частини мають пристінкова плевра: реброва, діафрагмова, середостінна (нутрощева покриває відповідні поверхні легені).", "Серцевої частини плеври немає.", "Хребтової частини немає.", "Серцевої частини немає.", "Пристінкова плевра — окремий листок."]}, {"n": "27.27", "q": "Хірург проводить лобектомію (видалення частки) на правій легені у чоловіка 60 років. За результатами КТ-дослідження, патологічний процес розташований між двома частками правої легені. Щоб точно визначити межі видалення, лікарю необхідно ідентифікувати fissura horizontalis, оскільки вона є анатомічною межею, що відокремлює ці дві частки одна від одної. Які частки правої легені відділяються горизонтальною щілиною?", "o": ["Верхня і середня частки правої легені.", "Середня і нижня частки правої легені.", "Верхня і нижня частки лівої легені.", "Верхня і нижня частки правої легені.", "Верхівка і основа лівої легені."], "a": [0], "e": ["Горизонтальна щілина відділяє верхню і середню частки правої легені.", "Середню і нижню частки відділяє коса щілина.", "Ліва легеня горизонтальної щілини не має.", "Верхню і нижню частки правої легені відділяє коса щілина.", "Верхівка і основа — не частки."]}, {"n": "27.28", "q": "Хірург проводить чоловіку 65 років сегментектомію на лівій легені. Для точного планування доступу лікарю необхідно чітко ідентифікувати fissura obliqua, оскільки це єдина велика борозна, яка відділяє ушкоджену частку легені від здорової тканини. Які частки лівої легені відділяються косою щілиною?", "o": ["Верхня і середня частки правої легені.", "Середня і нижня частки правої легені.", "Верхня і нижня частки лівої легені.", "Верхівка і основа лівої легені.", "Верхівка і купол плеври."], "a": [2], "e": ["Ліва легеня середньої частки не має.", "Ліва легеня середньої частки не має.", "Коса щілина лівої легені відділяє верхню і нижню частки.", "Верхівка і основа — не частки.", "Купол плеври не є частиною легені."]}, {"n": "27.29", "q": "У чоловіка 50 років діагностовано бронхіоліт — запалення найдрібніших повітроносних шляхів. Лікарю необхідно визначити межі поширення запального процесу, який знаходиться на стику між провідною (транспортною) та респіраторною (газообмінною) частинами легеневої тканини. Ці кінцеві відділи провідних бронхіол дають початок утворам, де вперше з’являються альвеоли. Вкажіть, при розгалуженні яких структур утворюються дихальні бронхіоли (bronchioli respiratorii)?", "o": ["Bronchioli terminales.", "Bronchus lobularis.", "Bronchus lobaris.", "Bronchus segmentalis.", "Bronchioli respiratorii."], "a": [0], "e": ["Дихальні бронхіоли утворюються при розгалуженні кінцевих бронхіол.", "Часточковий бронх розгалужується на кінцеві бронхіоли.", "Частковий бронх — набагато вищий рівень.", "Сегментний бронх — набагато вищий рівень.", "Дихальні бронхіоли розгалужуються далі на альвеолярні ходи."]}, {"n": "27.30", "q": "Рентгенолог обстежує чоловіка з підозрою на наявність рідини (ексудату) у плевральній порожнині. На КТ-зображенні лікар бачить ексудат у найбільш присередньо розташованій частині плевральної порожнини. Цей простір формується у місці, де плевра переходить з діафрагми на середостінну поверхню легені. Чим обмежений діафрагмово-середостінний закуток (recessus phrenicomediastinalis)?", "o": ["Ребровою і діафрагмовою частинами плеври.", "Нутрощевою і ребровою частиною плеври.", "Ребровою і середостінною частинами плеври.", "Діафрагмовою і середостінною частинами плеври.", "Нутрощевою і пристінковою плеврою."], "a": [3], "e": ["Реброва і діафрагмова частини утворюють реброво-діафрагмовий закуток.", "Нутрощева плевра закутків не утворює.", "Реброва і середостінна утворюють реброво-середостінний закуток.", "Діафрагмово-середостінний закуток утворений діафрагмовою і середостінною частинами пристінкової плеври.", "Між нутрощевою і пристінковою лежить вся плевральна порожнина."]}], "models": [["Дихальні шляхи і легені", "sf:1cd55d26c1254ab7a5d0845fb9a207fe", {"ru": "Дыхательные пути и лёгкие", "en": "Airways and lungs"}], ["Гортань, трахея і бронхи", "sf:8458de63d0734776aa901615cf1f15ca", {"ru": "Гортань, трахея и бронхи", "en": "Larynx, trachea and bronchi"}], ["Серце", "sf:33c93ec8f852471cad6270f1c089e5fe", {"ru": "Сердце", "en": "Heart"}]]}, {"id": "topic28", "title": "28. Сечова система", "tr": {"ru": "28. Мочевая система", "en": "28. Urinary system"}, "questions": [{"n": "28.1", "q": "В урологічне відділення клінічної лікарні госпіталізовано чоловіка 46 років, якому виконують оперативне втручання на нирці. Під час операції хірургу необхідно накласти м'який судинний затискач на утвори ниркової ніжки в ділянці ниркових воріт. Які анатомічні утвори не приймають участь в формуванні ниркової ніжки?", "o": ["Ниркова миска.", "Ниркова артерія.", "Ниркові вени.", "Лімфатичні судини.", "Сечовід."], "a": [4], "e": ["Ниркова миска частково виходить із воріт і входить до ниркової ніжки.", "Ниркова артерія — основний компонент ніжки.", "Ниркова вена — компонент ніжки.", "Лімфатичні судини входять до ніжки.", "Сечовід починається нижче воріт і до ниркової ніжки не належить."]}, {"n": "28.2", "q": "Особливу роль в фіксації нирок відіграє ниркова фасція. Вона за допомогою тяжів волокнистої сполучної тканини, що пронизують жирову капсулу, з’єднується з волокнистою капсулою нирок. Чим утворена ниркова фасція?", "o": ["Переднирковим і позанирковим листками.", "Верхньонирковим і нижньонирковим листками.", "Присереднім і бічним листками.", "Передньо-верхнім і задньо-нижнім листками.", "Передньо-присереднім і задньо-бічним листками."], "a": [0], "e": ["Ниркова фасція складається з переднього (переднирковий) і заднього (позаднирковий) листків.", "Верхнього і нижнього листків немає.", "Присереднього і бічного листків немає.", "Таких листків немає.", "Таких листків немає."]}, {"n": "28.3", "q": "У чоловіка 48 років, прооперованого з приводу видалення правої нирки на тлі злоякісної пухлини, необхідно провести патогістологічне дослідження. Мікроскопічне дослідження нирки дало можливість визначити множинне ушкодження структурно-функціональних одиниць нирки – нефронів. Які утвори не відносяться до структур нефрона?", "o": ["Ductulli papillares.", "Glomerulus.", "Corpusculum renalis.", "Ansa nephroni.", "Pars proximalis, pars distalis tubuli nephroni."], "a": [0], "e": ["Сосочкові протоки належать до збірних шляхів, а не до нефрона.", "Клубочок — частина ниркового тільця нефрона.", "Ниркове тільце — початок нефрона.", "Петля нефрона — частина канальців нефрона.", "Проксимальна і дистальна частини канальця входять до нефрона."]}, {"n": "28.4", "q": "Жінці 56 років проведена цистоскопія (ендоскопічне дослідження сечового міхура), під час проведення якої лікар має можливість оглянути слизову оболонку сечового міхура. Обстеження порожнини сечового міхура підтвердило, що в ділянці trigonum vesicae відсутні складки слизової оболонки. Які утвори, що обумовлюють цю особливість стінки сечового міхура, відсутні в ділянці трикутника сечового міхура?", "o": ["Tela submucosa.", "Tunica mucosa.", "Tunica muscularis.", "Lamina propria mucosae.", "Lamina muscularis mucosae."], "a": [0], "e": ["У трикутнику сечового міхура немає підслизової основи, тому слизова не утворює складок.", "Слизова оболонка в трикутнику є.", "М’язова оболонка в трикутнику є.", "Власна пластинка слизової в трикутнику є.", "М’язова пластинка слизової у міхурі не виражена, складки зумовлює підслизова основа."]}, {"n": "28.5", "q": "До уролога звернувся чоловік 58 років зі скаргами на біль внизу живота. Під час проведення МРТ органів малого таза справа була виявлена пухлина органа, який перетинає внутрішню клубову артерію на рівні входу до порожнини малого таза. Який орган сечової системи у чоловіка в порожнині малого таза перетинається із правою внутрішньою клубовою артерією?", "o": ["Тазова частина сечовода.", "Внутрішньостінкова частина сечовода.", "Сечовий міхур.", "Середина черевної частини сечовода.", "Сечівник."], "a": [0], "e": ["Тазова частина сечовода біля входу в малий таз перехрещує клубові судини.", "Внутрішньостінкова частина лежить у стінці міхура.", "Сечовий міхур лежить нижче, за лобком.", "Черевна частина лежить вище, на великому поперековому м’язі.", "Сечівник виходить з міхура."]}, {"n": "28.6", "q": "Перед проведенням оперативного втручання на нирці у чоловіка 54 років виконано КТ-обстеження сечовивідних шляхів нирки та ниркової пазухи. Лікар виявив ушкодження утворів сечової системи, розташованих у нирковій пазусі. Ушкодження яких утворів у нирковій пазусі виявив лікар?", "o": ["Calices renales minores, calices renales majores, pelvis renalis.", "Corpusculum renalis.", "Ansa nephroni.", "Pars proximalis, pars distalis tubuli nephroni.", "Tubulus renalis colligens."], "a": [0], "e": ["У нирковій пазусі розташовані малі і великі чашечки, ниркова миска (а також судини, нерви, жир).", "Ниркове тільце лежить у кірковій речовині.", "Петля нефрона лежить у мозковій речовині.", "Канальці лежать у паренхімі.", "Збірні трубочки лежать у паренхімі."]}, {"n": "28.7", "q": "Під час рентгенологічого дослідження у жінки 40 років було виявлено, що нирки розташовані дещо нижче, ніж повинні бути в нормі. Як відомо, нормальне топографічне розміщення нирок забезпечує її фіксуючий апарат. Який утвір не приймає участі у фіксації нирки?", "o": ["Волокниста капсула нирки.", "Ниркова ніжка.", "М’язове ложе нирки.", "Внутрішньочеревний тиск.", "Діафрагмово-ниркова зв’язка."], "a": [0], "e": ["Волокниста капсула щільно прилягає до нирки, але не є її фіксуючим апаратом.", "Ниркова ніжка фіксує нирку.", "М’язове ложе фіксує нирку.", "Внутрішньочеревний тиск утримує нирку.", "Діафрагмово-ниркова фасціальна зв’язка також утримує нирку."]}, {"n": "28.8", "q": "Чоловік 40 років тривалий час перебував під завалом після ракетного обстрілу. Після звільнення у постраждалого спостерігаються біль у поперековій ділянці, ознаки травматичного шоку та симптоми можливого розчавлення м’язів. Лікар швидкої медичної допомоги приймає рішення провести паранефральну блокаду для знеболення та профілактики рефлекторних порушень. Перед виконанням маніпуляції він повинен чітко орієнтуватися в анатомічних межах паранефрального простору. Чим обмежений паранефральний простір?", "o": ["Передній і задній листок ниркової фасції.", "Передній листок ниркової фасції і очеревина.", "Задній листок ниркової фасції і очеревина.", "Ниркова фасція і жирова капсула.", "Жирова капсула і волокниста капсула."], "a": [0], "e": ["Паранефральний простір (жирова капсула) лежить між переднім і заднім листками ниркової фасції.", "Між переднім листком і очеревиною — заочеревинний простір.", "Між заднім листком і очеревиною простору немає.", "Жирова капсула заповнює простір, а не обмежує його.", "Між жировою і волокнистою капсулами щілинного простору немає."]}, {"n": "28.9", "q": "Жінка 40 років звернулася до лікаря зі скаргами на утруднене сечовипускання. Під час цистоскопії лікар звернув увагу на особливості будови стінки сечового міхура. М’язова оболонка цього органа складається з трьох шарів гладких м’язів (зовнішнього поздовжнього, коловий та внутрішнього поздовжнього), які функціонально об’єднані в один м’яз. Під час скорочення цього м'яза сечовий міхур зменшується в об’ємі, і сеча виводиться через сечівник назовні. Який м’яз забезпечує процес сечовипускання?", "o": ["Musculus detrusor vesicae.", "Musculus pubovesicalis.", "Musculus rectovesicalis.", "Musculus vesicoprostaticus.", "Musculus vesicovaginalis."], "a": [0], "e": ["Три шари м’язової оболонки міхура утворюють м’яз-виштовхувач сечі.", "Лобково-міхуровий м’яз фіксує міхур.", "Прямокишково-міхуровий м’яз — тяж до прямої кишки.", "Міхурово-передміхуровий м’яз — у чоловіків.", "Міхурово-піхвовий м’яз — у жінок."]}, {"n": "28.10", "q": "В урологічне відділення лікарні госпіталізований хлопчик 10 років з вродженою вадою ниркової артерії. Для визначення оперативного доступу до нирок лікарю необхідно враховувати проєкцію правої і лівої нирок на XIІ ребро. Як розташовано XII ребро відносно правої і лівої нирок?", "o": ["XII ребро перетинає: задню поверхню лівої нирки посередині, правої нирки ближче до верхнього кінця.", "XII ребро перетинає: задню поверхню правої нирки посередині, лівої нирки ближче до верхнього кінця.", "XII ребро перетинає задню поверхню і правої і лівої нирок нижче середини.", "XII ребро не перетинає праву нирку, а ліву ближче до верхнього кінця.", "XII ребро не перетинає ліву нирку, а праву посередині."], "a": [0], "e": ["XII ребро перетинає ліву нирку посередині, праву — ближче до верхнього кінця (права лежить нижче).", "Права нирка лежить нижче лівої.", "Ребро перетинає нирки по-різному.", "XII ребро перетинає обидві нирки.", "XII ребро перетинає обидві нирки."]}, {"n": "28.11", "q": "Під час огляду нирки на лобовому зрізі студенти звертають увагу на те, що кіркова речовина нирки не гомогенна, а складається із світлих та темних ділянок. Чим представлені світлі ділянки?", "o": ["Radii medullares.", "Pars convoluta.", "Pyramides renales.", "Columnae renales.", "Раpillае renales."], "a": [0], "e": ["Світлі ділянки кіркової речовини — мозкові промені (променева частина).", "Звивиста частина темна (містить клубочки).", "Піраміди належать мозковій речовині.", "Ниркові стовпи — продовження кіркової речовини між пірамідами.", "Сосочки — верхівки пірамід."]}, {"n": "28.12", "q": "Пацієнт 46 років звернувся зі скаргами на біль у поперековій ділянці та порушення сечовиділення. Під час ультразвукового дослідження виявлено розширення ниркової миски, що може бути пов’язане зі спазмом або порушенням перистальтики сечовода. Відомо, що нормальний рух сечі по сечоводу забезпечується ритмічними перистальтичними скороченнями його м’язової оболонки. В чому полягає особливість будови м’язової оболонки сечовода?", "o": ["На всьому протязі сечовода в мʼязовій оболонці три шари.", "У верхніх двох третинах сечовода з мʼязовій оболонці три шари, в нижньому – два.", "У верхніх двох третинах сечовода в мʼязовій оболонці два шари, а в нижньому – три.", "На всьому протязі сечовода в мʼязовій оболонці два шари.", "У верхньому і нижньому відділах сечовода в мʼязовій оболонці три шари, в середньому – два."], "a": [2], "e": ["Шари різняться за протягом.", "Навпаки: три шари внизу.", "У верхніх двох третинах — два шари, у нижній третині — три (додається зовнішній поздовжній).", "Внизу три шари.", "Розподіл інший."]}, {"n": "28.13", "q": "У жінки 50 років гіпертонічна хвороба пов’язана з підвищенням рівня ангіотензину II, який виробляють клітини юкстагломерулярного апарату (ЮГА) нирки. Які клітини є антагоністами ЮГА – знижують артеріальний тиск.", "o": ["Юкстагломерулярні клітини.", "Епітеліоцити щільної плями.", "Юкставаскулярні клітини (Гурмагтіга).", "Мезангіальні клітини.", "Ниркові інтерстиційні клітини."], "a": [4], "e": ["Юкстагломерулярні клітини виробляють ренін (підвищують тиск).", "Щільна пляма контролює натрій.", "Клітини Гурмагтіга — частина ЮГА.", "Мезангіальні клітини — опорні в клубочку.", "Інтерстиційні клітини мозкової речовини виробляють простагландини, що знижують тиск."]}, {"n": "28.14", "q": "У клінічну лікарню госпіталізовано жінку 55 років з діагнозом гломерулонефрит (тяжке дифузне ураження клубочків нефрона). Для успішного проведення хірургічного втручання та збереження максимального обсягу здорової тканини, лікарю необхідно ідентифікувати топографію клубочків нефрона. Де розташований цей компонент нефрона?", "o": ["Pars radiata.", "Pars convoluta.", "Pelvis renalis.", "Columnae renales.", "Pyramides renales."], "a": [1], "e": ["Променева частина містить канальці, клубочки там відсутні.", "Клубочки (ниркові тільця) лежать у звивистій частині кіркової речовини.", "Ниркова миска — сечовивідний шлях.", "Ниркові стовпи містять тільця, але основна частина — звивиста.", "Піраміди — мозкова речовина."]}, {"n": "28.15", "q": "Для успішного проведення хірургічного втручання та збереження максимального обсягу здорової тканини, лікарю вкрай необхідно знати особливості внутрішньої будови нирки та її кровоносних судин. Ці знання дають можливість поділити речовину нирки на сегменти та частки, до яких входять кіркові часточки. Які утвори формують часточки нирки?", "o": ["Pars radiata та pars convoluta, обмежені міжчасточковими артеріями і венами.", "Pyramides renales, обмежені міжчастковими артеріями і венами.", "Calyx renalis minor і papilla renalis.", "Calyx renalis major.", "Pelvis renalis."], "a": [0], "e": ["Кіркова часточка — мозковий промінь з прилеглою звивистою частиною, обмежена міжчасточковими судинами.", "Піраміда з кірковою речовиною — це частка, не часточка.", "Мала чашечка і сосочок — сечовивідні структури.", "Велика чашечка — сечовивідна структура.", "Ниркова миска — сечовивідна структура."]}, {"n": "28.16", "q": "У дитяче урологічне відділення лікарні госпіталізований хлопчик 12 років, у якого виявлена вкрай рідка аномалія розвитку нирок – геn anularis. Унаслідок зрощення яких утворів нирки спостерігається ця вада розвитку?", "o": ["При зрощенні присередніх країв обох нирок.", "При зрощенні тільки верхніх кінців правої і лівої нирок.", "При зрощенні тільки нижніх кінців правої і лівої нирок.", "При зрощенні верхнього кінця одної нирки з присереднім краєм другої.", "При зрощенні нижніх і верхніх кінців правої і лівої нирок."], "a": [4], "e": ["Зрощення присередніх країв — галетоподібна нирка.", "Зрощення верхніх кінців — підковоподібна нирка (рідше).", "Зрощення нижніх кінців — підковоподібна нирка.", "Зрощення кінця з краєм — S- або L-подібна нирка.", "Кільцеподібна нирка — зрощення і верхніх, і нижніх кінців обох нирок."]}, {"n": "28.17", "q": "У дитяче нефрологічне відділення лікарні звернулися батьки 6-річної дитини зі скаргами на періодичний біль у дитини в поперековій ділянці та утруднене сечовипускання. Дитині проведено ультразвукове дослідження та урографію. Виявлено, що малі та великі ниркові чашечки безпосередньо впадають у розширений сечовід. Який у дитини виявлено варіант розвитку ниркової миски?", "o": ["Зародкова форма.", "Фетальна форма.", "Зріла форма.", "Деревоподібна форма.", "Ампульна форма"], "a": [0], "e": ["Зародкова форма — малі і великі чашечки впадають безпосередньо в розширений сечовід, миски немає.", "Фетальна форма — є миска, великих чашечок немає.", "Зріла форма — є великі чашечки і миска.", "Деревоподібна — інша назва зрілої форми.", "Ампульна — інша назва фетальної форми."]}, {"n": "28.18", "q": "До дитячого нефролога звернулися батьки 8-річної дитини зі скаргами на наявність у дитини набряку тканин обличчя та нижніх кінцівок, зменшення добової кількості сечі. В аналізі сечі – протеїнурія, мікрогематурія. Лікар запідозрив порушення процесу утворення первинної сечі через зміну тиску в капілярах клубочка ниркового тільця. Під час проведення доплерографії виявлено звуження приносної артеріоли клубочка, що впливає на фільтрацію плазми крові. Яка особливість артеріол клубочка в нормі забезпечує високий тиск крові (близько 50 мм рт. ст.) у капілярах судинного клубочка і є необхідною умовою для першої фази сечоутворення?", "o": ["Діаметр vas efferens більший ніж в ansae vasorum hemocapillaria.", "Діаметр vas efferens більший за діаметр vas afferens.", "Діаметр vas efferens менший за діаметр vas afferens.", "Діаметри однакові.", "Діаметр vas efferens менший, ніж в ansae vasorum hemocapillana."], "a": [2], "e": ["Капіляри не порівнюють із виносною артеріолою за тиском таким чином.", "Ширша виносна артеріола знизила б тиск.", "Виносна артеріола вужча за приносну, тому в клубочку тиск високий.", "При однакових діаметрах тиск був би нижчим.", "Порівняння з капілярами не пояснює високого тиску."]}, {"n": "28.19", "q": "В урологічне відділення лікарні госпіталізовано чоловіка 57 років, у якого при ендоскопічному дослідженні виявлено камінь у ділянці правого вічка сечовода. Який анатомічний утвір може бути орієнтиром для знаходження вічок сечоводів під час ендоскопічного обстеження слизової оболонки сечового міхура?", "o": ["Trigonum vesicae.", "Арех vesicae.", "Corpus vesicae.", "Cervix vesicae.", "Оstium urethrae internum."], "a": [0], "e": ["Вічка сечоводів лежать у кутах трикутника сечового міхура.", "Верхівка міхура лежить спереду вгорі.", "Тіло — основна частина міхура.", "Шийка міхура переходить у сечівник.", "Внутрішній отвір сечівника — передній кут трикутника, але орієнтир — весь трикутник."]}, {"n": "28.20", "q": "До нефрологічного відділення лікарні госпіталізовано 60-річного чоловіка зі скаргами на наявність крові у сечі (гематурія), загальну слабкість та біль у поперековій ділянці. Лікар запідозрив патологію ниркової паренхіми, оскільки гематурія часто пов’язана з ушкодженням її структур. Для уточнення діагнозу призначено УЗД та лабораторні дослідження. Що включає ниркова паренхіма?", "o": ["Білясте і жовте тіло.", "Залозиста паренхіма та мʼязова речовина.", "Біла і червона пульпа.", "Складна розгалужена альвеолярна залоза.", "Кіркова та мозкова речовина."], "a": [4], "e": ["Біле і жовте тіло — структури яєчника.", "Залозиста і м’язова речовина — простата.", "Біла і червона пульпа — селезінка.", "Альвеолярна залоза — молочна залоза.", "Ниркова паренхіма складається з кіркової і мозкової речовини."]}, {"n": "28.21", "q": "У хлопчика 8 років після ультразвукового дослідження виявлено, що у ниркову миску мішкоподібної форми безпосередньо впадають малі ниркові чашечки, а великі ниркові чашечки відсутні. Який у дитини варіант розвитку ниркової миски?", "o": ["Зародкова форма.", "Фетальна форма.", "Зріла форма.", "Деревоподібний.", "Ампульний тип."], "a": [1], "e": ["Зародкова форма — миски немає.", "Фетальна форма — малі чашечки впадають у мішкоподібну миску, великих чашечок немає.", "Зріла форма має великі чашечки.", "Деревоподібна — зріла форма.", "Ампульна — інша назва фетальної, але правильна відповідь — фетальна форма."]}, {"n": "28.22", "q": "У дівчинки 11 років порушена фільтрація плазми крові через фільтраційний бар’єр ниркового тільця (утворення первинної сечі) у зв’язку зі зміною діаметра виносних клубочкових артеріол. Яка структурна особливість артеріол клубочка нефрона забезпечує високий тиск крові (50 мм ртутного стовпа) у капілярах судинного клубочка і є необхідною умовою для першої фази сечоутворення?", "o": ["Діаметр vas efferens більший за діаметр vas afferens.", "Діаметр vas efferens менший за діаметр vas afferens.", "Діаметри vas efferens і vas afferens однакові.", "Діаметр vas efferens менший, ніж в ansae vasorum hemocapillaria.", "Діаметр vas efferens більший ніж в ansae vasorum hemocapillaria."], "a": [1], "e": ["Ширша виносна артеріола знизила б тиск.", "Виносна артеріола вужча за приносну — це підтримує високий тиск у клубочку.", "При однако
