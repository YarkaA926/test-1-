tus capitis posterior minor, musculus rectus capitis posterior major."], "a": [1], "e": ["Остистий м'яз голови і нижній косий не прикріплюються до верхньої каркової лінії.", "До верхньої каркової лінії прикріплюються трапецієподібний і ремінний м'яз голови.", "Верхній косий м'яз голови прикріплюється над нижньою карковою лінією.", "Найдовший м'яз голови прикріплюється до соскоподібного відростка.", "Задні прямі м'язи голови прикріплюються до нижньої каркової лінії."]}, {"n": "13.15", "q": "У чоловіка 50 років діагностовано ушкодження гілок плечового сплетення, які іннервують трункофугальні м'язи спини. Чоловік не може підняти верхній кут лопатки, наблизити лопатку до хребтового стовпа. Який м'яз ушкоджений?", "o": ["Musculus latissimus dorsi.", "Musculus spinalis.", "Musculus levator scapulae.", "Musculus serratus posterior superior.", "Musculus serratus posterior inferior."], "a": [2], "e": ["Найширший м'яз спини рухає плече.", "Остистий м'яз — автохтонний.", "М'яз-підіймач лопатки піднімає верхній кут лопатки й наближає його до хребта.", "Верхній задній зубчастий м'яз піднімає ребра.", "Нижній задній зубчастий м'яз опускає ребра."]}, {"n": "13.16", "q": "У потерпілого колото-різана рана в поперековій ділянці спини. Ушкоджені волокна м'яза спини, що обмежують поперековий трикутник. Який м'яз ушкоджений?", "o": ["Найширший м'яз спини.", "Трапецієподібний м'яз.", "Великий ромбоподібний м'яз.", "Верхній задній зубчастий м'яз.", "Нижній задній зубчастий м'яз."], "a": [0], "e": ["Найширший м'яз спини обмежує поперековий трикутник присередньо.", "Трапецієподібний м'яз розташований вище.", "Великий ромбоподібний м'яз — у лопатковій ділянці.", "Верхній задній зубчастий м'яз — у верхній частині грудної клітки.", "Нижній задній зубчастий м'яз обмежує поперековий ромб, а не трикутник."]}, {"n": "13.17", "q": "Після травми чоловік 45 років не може виконати обертання у суглобах хребтового стовпа. Які аутохтонні м'язи спини беруть участь у обертанні хребтового стовпа?", "o": ["Musculus levator scapulae, musculus multifidus.", "Musculus latissimus dorsi, musculus levator scapulae.", "Musculus multifidus, musculus rhomboideus minor.", "Musculus rhomboideus major, musculus splenius capitis.", "Musculus erector spinae, musculus transversospinalis."], "a": [4], "e": ["М'яз-підіймач лопатки не належить до автохтонних.", "Ці м'язи не є автохтонними.", "Малий ромбоподібний м'яз не є автохтонним.", "Великий ромбоподібний м'яз не є автохтонним.", "М'яз-випрямляч хребта і поперечно-остистий м'яз (автохтонні) обертають хребтовий стовп."]}, {"n": "13.18", "q": "У чоловіка 60 років діагностовано ушкодження задніх гілок спинномозкових нервів справа, які іннервують автохтонні глибокі м'язи спини. Чоловіку важко розігнути спину, нахиляти хребет вправо, важко видихати. Функція якого м'яза спини порушена?", "o": ["Musculus levator scapulae.", "Musculus latissimus dorsi.", "Musculus rhomboideus minor.", "Musculus rhomboideus major.", "Musculus erector spinae."], "a": [4], "e": ["М'яз-підіймач лопатки іннервується з плечового сплетення.", "Найширший м'яз спини іннервується грудо-спинним нервом.", "Малий ромбоподібний м'яз іннервується дорсальним нервом лопатки.", "Великий ромбоподібний м'яз іннервується дорсальним нервом лопатки.", "М'яз-випрямляч хребта розгинає спину, нахиляє її вбік і опускає ребра; іннервується задніми гілками."]}, {"n": "13.19", "q": "У потерпілого після падіння з висоти рентгенологічно підтверджено перелом поперечних відростків правих LIII–LIV поперекових хребців та ушкодженням м'язів, що від них починаються. У чоловіка виникає інтенсивний біль при нахилі хребтового стовпа вправо. Функція якого м'яза постраждала?", "o": ["Musculus rotatores.", "Musculus trapezius.", "Musculus intertransversarii.", "Musculus interspinalis.", "Musculus erector spinae."], "a": [2], "e": ["Обертачі з'єднують поперечний відросток з остистим вище розташованого хребця.", "Трапецієподібний м'яз не починається від поперечних відростків поперекових хребців.", "Міжпоперечні м'язи з'єднують поперечні відростки сусідніх хребців і нахиляють хребет убік.", "Міжостисті м'язи з'єднують остисті відростки.", "М'яз-випрямляч хребта починається переважно від крижової кістки та клубового гребеня."]}, {"n": "13.20", "q": "У чоловіка 50 років рентгенологічно діагностовано перелом остистих відростків XI–XII грудних та I–II поперекових хребців, перелом XI–XII ребер, відрив волокон m. serratus posterior inferior. Яка функція musculus serratus posterior inferior?", "o": ["Опускання ребер під час видиху.", "Підняття ребер при вдиху.", "Розгинання хребтового стовпа.", "Приведення лопатки.", "Відведення лопатки."], "a": [0], "e": ["Нижній задній зубчастий м'яз опускає нижні ребра при видиху.", "Підняття ребер — функція верхнього заднього зубчастого м'яза.", "Розгинання хребта — функція випрямляча.", "Приведення лопатки — функція ромбоподібних і трапецієподібного м'язів.", "Відведення лопатки — функція переднього зубчастого м'яза."]}, {"n": "13.21", "q": "У чоловіка 59 років виявлено випинання в поперековій ділянці. Діагностована кила поперекового трикутника. Руйнування якої фасції, що в нормі підсилює поперекову ділянку, відбулося при формуванні кили?", "o": ["Fascia thoracolumbalis.", "Fascia superficialis.", "Fascia cervicalis.", "Fascia pectoralis.", "Fascia profunda."], "a": [0], "e": ["Грудо-поперекова фасція підсилює поперекову ділянку й утворює дно поперекового трикутника.", "Поверхнева фасція не є головним підсилювачем поперекової ділянки.", "Шийна фасція розташована на шиї.", "Грудна фасція розташована на грудях.", "«Глибока фасція» — загальна назва, не конкретна фасція цієї ділянки."]}, {"n": "13.22", "q": "При ураженні якого м'яза спостерігається «крилоподібна лопатка»?", "o": ["Musculus trapezius.", "Musculus rhomboideus.", "Musculus serratus anterior.", "Musculus latissimus dorsi.", "Musculus erector spinae."], "a": [2], "e": ["При ураженні трапецієподібного м'яза лопатка опускається, але «крила» немає.", "Ромбоподібні м'язи приводять лопатку до хребта.", "При паралічі переднього зубчастого м'яза присередній край лопатки відстає від грудної клітки — «крилоподібна лопатка».", "Найширший м'яз спини рухає плече.", "М'яз-випрямляч хребта на лопатку не діє."]}, {"n": "13.23", "q": "У чоловіка 45 років після травми виникає біль при зведенні лопаток. Який м'яз спини, окрім ромбоподібних м'язів, виконує таку ж функцію при двосторонньому скороченні?", "o": ["Musculus trapezius.", "Musculus serratus posterior inferior.", "Musculus serratus anterior.", "Musculus latissimus dorsi.", "Musculus erector spinae."], "a": [0], "e": ["Трапецієподібний м'яз при двосторонньому скороченні зводить лопатки.", "Нижній задній зубчастий м'яз опускає ребра.", "Передній зубчастий м'яз відводить лопатку від хребта.", "Найширший м'яз спини рухає плече.", "М'яз-випрямляч хребта на лопатки не діє."]}, {"n": "13.24", "q": "У чоловіка 45 років після травми спини обмежені рухи у плечовому суглобі. При ушкодженні волокон якого м'яза спини виникає порушення функції плечового суглоба?", "o": ["Musculus rhomboideus.", "Musculus erector spinae.", "Musculus trapezius.", "Musculus latissimus dorsi.", "Musculus serratus anterior."], "a": [3], "e": ["Ромбоподібний м'яз рухає лопатку.", "М'яз-випрямляч хребта не діє на плечовий суглоб.", "Трапецієподібний м'яз рухає лопатку, а не плече.", "Найширший м'яз спини прикріплюється до плечової кістки й рухає плече.", "Передній зубчастий м'яз не належить до м'язів спини."]}, {"n": "13.25", "q": "Після травми у чоловіка 45 років виник різкий біль під час привертання та приведення плеча, хворому важко розігнути верхню кінцівку в плечовому суглобі. Який м'яз ушкоджений?", "o": ["Musculus latissimus dorsi.", "Musculi multifidi.", "Musculus trapezius.", "Musculus serratus posterior.", "Musculus erector spinae."], "a": [0], "e": ["Найширший м'яз спини привертає, приводить і розгинає плече.", "Багатороздільні м'язи — автохтонні.", "Трапецієподібний м'яз рухає лопатку.", "Задні зубчасті м'язи рухають ребра.", "М'яз-випрямляч хребта діє на хребет."]}, {"n": "13.26", "q": "У підлітка в травматологічному відділенні лікарні діагностований травматичний вивих плеча з розривом ligamentum coracoacromiale, яка утворює «склепіння» плечового суглоба. Також спостерігається порушення функції м'яза спини внаслідок відриву м'язових волокон від надплечового відростка лопатки. Який м'яз ушкоджений?", "o": ["Musculus latissimus dorsi.", "Musculi multifidi.", "Musculus trapezius.", "Musculus serratus posterior.", "Musculus erector spinae."], "a": [2], "e": ["Найширший м'яз спини прикріплюється до плечової кістки.", "Багатороздільні м'язи — глибокі автохтонні.", "Трапецієподібний м'яз прикріплюється до надплечового відростка лопатки.", "Задні зубчасті м'язи прикріплюються до ребер.", "М'яз-випрямляч хребта прикріплюється до хребців і ребер."]}, {"n": "13.27", "q": "Жінка 36 років травмувала спину і звернулася до хірурга зі скаргами на біль у лівій підлопатковій ділянці, особливо під час вдиху. Під час проведення МРТ-дослідження виявлено перелом нижніх чотирьох ребер зліва та відрив волокон м'яза, що прикріплюється до них. Який м'яз ушкоджений?", "o": ["Musculus latissimus dorsi.", "Musculus multifidi.", "Musculus trapezius.", "Musculus serratus posterior inferior.", "Musculus erector spinae."], "a": [3], "e": ["Найширший м'яз спини прикріплюється до плечової кістки.", "Багатороздільні м'язи прикріплюються до хребців.", "Трапецієподібний м'яз прикріплюється до лопатки й ключиці.", "Нижній задній зубчастий м'яз прикріплюється до чотирьох нижніх ребер.", "М'яз-випрямляч хребта прикріплюється до ребер і хребців, але не так."]}, {"n": "13.28", "q": "У лікарню доставлений чоловік 27 років з глибокою різаною раною присереднього відділу передньої плечової ділянки. Оглядаючи рану, хірург виявив ушкодження сухожилка м'яза спини в місці його прикріплення до гребеня малого горбка плечової кістки. Який м'яз ушкоджено?", "o": ["Найширший м'яз спини.", "Трапецієподібний м'яз.", "Великий ромбоподібний м'яз", "Малий ромбоподібний м'яз.", "М'яз-підіймач лопатки."], "a": [0], "e": ["Сухожилок найширшого м'яза спини прикріплюється до гребеня малого горбка плечової кістки.", "Трапецієподібний м'яз прикріплюється до лопатки й ключиці.", "Великий ромбоподібний м'яз прикріплюється до лопатки.", "Малий ромбоподібний м'яз прикріплюється до лопатки.", "М'яз-підіймач лопатки прикріплюється до верхнього кута лопатки."]}, {"n": "13.29", "q": "Під час обстеження рваної рани в межах правої лопаткової ділянки хірург виявив відрив волокон одного із м'язів спини від присереднього краю лопатки вище її ості. Відрив якого м'яза спостерігає хірург?", "o": ["Musculus rhomboideus major.", "Musculus rhomboideus minor.", "Musculus latissimus dorsi.", "Musculus trapezius.", "Musculus serratus posterior inferior."], "a": [1], "e": ["Великий ромбоподібний м'яз прикріплюється до присереднього краю нижче ості.", "Малий ромбоподібний м'яз прикріплюється до присереднього краю лопатки вище ості.", "Найширший м'яз спини прикріплюється до плечової кістки.", "Трапецієподібний м'яз прикріплюється до ості та акроміона.", "Нижній задній зубчастий м'яз прикріплюється до ребер."]}, {"n": "13.30", "q": "У чоловіка 60 років під час проведення комп'ютерної томографії виявлено ушкодження ядра черепного нерва в довгастому мозку. У хворого порушена іннервація м'язів спини. Який м'яз ушкоджено?", "o": ["Musculus rhomboideus major, musculus splenius capitis.", "Musculus latissimus dorsi.", "Musculus serratus posterior superior, musculus serratus posterior inferior.", "Musculus levator scapulae.", "Musculus trapezius."], "a": [4], "e": ["Ромбоподібний і ремінний м'язи іннервуються спинномозковими нервами.", "Найширший м'яз спини іннервується грудо-спинним нервом.", "Задні зубчасті м'язи іннервуються міжребровими нервами.", "М'яз-підіймач лопатки іннервується дорсальним нервом лопатки.", "Трапецієподібний м'яз іннервується додатковим нервом (XI пара), ядро якого лежить у довгастому та спинному мозку."]}], "models": [["М'язи верхньої частини спини (препарат)", "sf:85159e313b434023ac044011ea752a10"], ["М'язи, що з'єднують тулуб з рукою", "o3d:upper-limb-axio-appendicular-muscles&subset=muscle-and-ligament-parts-hidden"], ["М'язи всього тіла", "sf:d32f5724fc294048888d03d215b9a1ff"]]}, {"id": "topic14", "title": "14. М’язи і фасції грудей та живота. Піхва прямого м’яза живота. Пахвинний канал. Біла лінія живота", "questions": [{"n": "14.1", "q": "У чоловіка 40 років діагностовано перитоніт (запалення очеревини). Хірург проводить серединну лапаротомію по linea alba. Чим вона утворена?", "o": ["Fascia transversalis, fascia superficialis.", "Апоневрозами musculus obliquus externus abdominis, musculus obliquus internus abdominis, musculus transversus abdominis.", "Апоневрозами musculus obliquus externus abdominis, musculus obliquus internus abdominis.", "Апоневрозом musculus obliquus externus abdominis, musculus quadratus lumborum.", "Musculus pyramidalis, апоневрозом musculus transversus abdominis."], "a": [1], "e": ["Поперечна і поверхнева фасції не утворюють білої лінії.", "Біла лінія утворена переплетенням апоневрозів зовнішнього косого, внутрішнього косого та поперечного м'язів живота обох боків.", "Пропущено апоневроз поперечного м'яза живота.", "Квадратний м'яз попереку розташований на задній стінці живота.", "Пірамідальний м'яз лише напружує білу лінію, але не утворює її."]}, {"n": "14.2", "q": "У чоловіка 50 років на передній стінці живота під шкірою лікар виявив вип'ячування. Хірург підозрює у пацієнта наявність кили. У яких місцях передньої стінки живота можливо утворення кил?", "o": ["В ділянці піхви прямого м'яза живота, пупкового кільця.", "В підребрових ділянках, отворах пахвинного каналу.", "В ділянці білої лінії живота, пупкового кільця, отворах пахвинного каналу.", "В ділянці стегнового кільця, пупкового кільця.", "В ділянці м'язової затоки, білої лінії живота."], "a": [2], "e": ["Піхва прямого м'яза — щільна, кили тут утворюються рідко.", "У підребрових ділянках кил зазвичай немає.", "Слабкі місця передньої стінки живота: біла лінія, пупкове кільце, пахвинний канал.", "Стегнове кільце — на стегні під пахвинною зв'язкою, не на передній стінці живота.", "М'язова затока — на стегні, через неї проходять м'язи."]}, {"n": "14.3", "q": "Під час обстеження у жінки 25 років пальпуються збільшені лімфатичні вузли під пахвинною зв'язкою, що є потовщенням апоневрозу одного із м'язів живота. Похідним апоневрозу якого м'яза вона є?", "o": ["Musculus obliquus externus abdominis.", "Musculus obliquus internus abdominis.", "Musculus transversus abdominis.", "Musculus rectus abdominis.", "Musculus pyramidalis."], "a": [0], "e": ["Пахвинна зв'язка — підвернутий нижній край апоневрозу зовнішнього косого м'яза живота.", "Внутрішній косий м'яз лише починається від пахвинної зв'язки.", "Поперечний м'яз живота частково починається від пахвинної зв'язки.", "Прямий м'яз живота не утворює пахвинної зв'язки.", "Пірамідальний м'яз лежить біля лобкової кістки."]}, {"n": "14.4", "q": "У підлітка після падіння з висоти на МРТ діагностовано перелом ключиці з відривом волокон м'яза, що починається від її присередньої частини. Хлопця турбує біль, що посилюється під час рухів — спробі привести руку до тулуба, обертати її до середини. Який м'яз грудної клітки ушкоджено?", "o": ["Musculus pectoralis minor.", "Musculus serratus anterior.", "Musculus subclavius.", "Musculus transversus thoracis.", "Musculus pectoralis major."], "a": [4], "e": ["Малий грудний м'яз починається від ребер, а не від ключиці.", "Передній зубчастий м'яз починається від ребер.", "Підключичний м'яз прикріплюється до ключиці, але не приводить плече.", "Поперечний м'яз грудей лежить на внутрішній поверхні груднини.", "Великий грудний м'яз (ключична частина) починається від присередньої половини ключиці, приводить і привертає плече."]}, {"n": "14.5", "q": "Внаслідок травми у чоловіка 30 років на рентгенограмі візуалізується відрив дзьобоподібного відростка лопатки. Який м'яз грудної клітки, що фіксується до дзьобоподібного відростка, втратив свою функцію?", "o": ["Musculus pectoralis major.", "Musculus subclavius.", "Musculus serratus anterior.", "Musculus pectoralis minor.", "Musculus transversus thoracis."], "a": [3], "e": ["Великий грудний м'яз прикріплюється до гребеня великого горбка плечової кістки.", "Підключичний м'яз прикріплюється до ключиці.", "Передній зубчастий м'яз прикріплюється до присереднього краю лопатки.", "Малий грудний м'яз прикріплюється до дзьобоподібного відростка лопатки.", "Поперечний м'яз грудей прикріплюється до хрящів ребер."]}, {"n": "14.6", "q": "У дитини 10 років внаслідок падіння під час обстеження діагностований вивих ключиці в груднинно-ключичному суглобі та відрив волокон м'яза, що укріплює цей суглоб. Який м'яз грудної клітки зміцнює цей суглоб?", "o": ["Musculus pectoralis minor.", "Musculus serratus anterior.", "Musculus subclavius.", "Musculus pectoralis major.", "Musculus transversus thoracis."], "a": [2], "e": ["Малий грудний м'яз прикріплюється до дзьобоподібного відростка.", "Передній зубчастий м'яз рухає лопатку.", "Підключичний м'яз тягне ключицю донизу та присередньо, укріплюючи груднинно-ключичний суглоб.", "Великий грудний м'яз рухає плече.", "Поперечний м'яз грудей опускає ребра."]}, {"n": "14.7", "q": "Чоловіка 50 років госпіталізовано в лікарню з гострим болем в черевній порожнині. Хворому призначена термінова операція, під час якої необхідно зробити доступ до черевної порожнини. В якому місці треба зробити розтин тканин передньої черевної стінки, щоб уникнути значної крововтрати гілок нервів?", "o": ["По бічному краю прямого м'яза живота справа.", "Через прямий м'яз живота.", "По білій лінії живота.", "Над пахвинною зв'язкою справа.", "Над пахвинною зв'язкою зліва."], "a": [2], "e": ["По бічному краю прямого м'яза проходять нерви й судини до нього.", "Розтин через м'яз ушкоджує судини й нерви.", "Біла лінія майже без судин і нервів — найменш травматичний доступ.", "Над пахвинною зв'язкою — пахвинний канал і судини.", "Над пахвинною зв'язкою зліва — пахвинний канал і судини."]}, {"n": "14.8", "q": "У клініку госпіталізовано дитину з підозрою на наявність пахвинної кили. Під час проведення пальпації пахвинної ділянки живота справа лікар виявив випинання грижового мішка в межах поверхневого пахвинного кільця. Чим обмежене поверхневе пахвинне кільце?", "o": ["Crus mediale, crus laterale, fibrae intercrurales, ligamentum reflexum.", "Ligamentum reflexum, crus mediale, crus laterale, arcus iliopectineus.", "Margo falciformis, cornu superius, cornu inferius.", "Ligamentum inguinale, ligamentum reflexum, arcus iliopectineus.", "Ligamentum inguinale, ligamentum lacunare, ligamentum pectineum."], "a": [0], "e": ["Поверхневе пахвинне кільце обмежене присередньою та бічною ніжками, міжніжковими волокнами і загнутою зв'язкою.", "Клубово-гребінна дуга розділяє судинну й м'язову затоки.", "Серпоподібний край і ріжки обмежують підшкірний отвір стегна.", "Ці утвори обмежують інші простори.", "Ці зв'язки обмежують стегнове кільце."]}, {"n": "14.9", "q": "Під час обстеження жінки 25 років лікарем виявлені збільшені лімфатичні вузли, які лікар пальпує на присередній стінці пахвової ямки. Який м'яз грудної клітки формує присередню стінку пахвової ямки?", "o": ["Musculus pectoralis minor.", "Musculus pectoralis major.", "Musculus serratus posterior superior.", "Musculus serratus posterior inferior.", "Musculus serratus anterior."], "a": [4], "e": ["Малий грудний м'яз — у передній стінці пахвової ямки.", "Великий грудний м'яз утворює передню стінку.", "Верхній задній зубчастий м'яз — на спині.", "Нижній задній зубчастий м'яз — на спині.", "Передній зубчастий м'яз утворює присередню стінку пахвової ямки."]}, {"n": "14.10", "q": "Під час падіння жінка 60 років травмувала нижню частину тіла груднини та мечоподібний відросток. У хворої виникає різкий біль при видиху. Лікар пояснив біль скороченням м'язів, що починаються від цих утворів груднини. Скорочення яких м'язів викликає цей біль?", "o": ["Musculus pectoralis major.", "Musculi transversi thoracis.", "Musculi intercostales externi.", "Musculi subcostales.", "Musculi intercostales intimi."], "a": [1], "e": ["Великий грудний м'яз починається від груднини, але не опускає ребра.", "Поперечні м'язи грудей починаються від нижньої частини груднини та мечоподібного відростка й опускають ребра при видиху.", "Зовнішні міжреброві м'язи — м'язи вдиху.", "Підреброві м'язи — на задній стінці грудної клітки.", "Найглибші міжреброві м'язи — бічні частини."]}, {"n": "14.11", "q": "У чоловіка 34 років — ножове поранення в IV міжребровому проміжку по білягруднинній лінії. Під час огляду рани лікар виявив ушкодження м'язових волокон та волокон membrana intercostalis externa на межі між кістковою і хрящовою частинами IV–V ребер. Продовженням яких м'язів грудної клітки є зовнішня міжреброва перетинка?", "o": ["Musculi intercostales interni.", "Musculi levatores costarum.", "Musculi intercostales externi.", "Musculi transversi thoracis.", "Musculi subcostales."], "a": [2], "e": ["Внутрішні міжреброві м'язи продовжуються внутрішньою перетинкою ззаду.", "Підіймачі ребер — на задній поверхні.", "Спереду між хрящами ребер зовнішні міжреброві м'язи замінюються зовнішньою міжребровою перетинкою.", "Поперечні м'язи грудей лежать на внутрішній поверхні груднини.", "Підреброві м'язи — ззаду."]}, {"n": "14.12", "q": "У чоловіка 30 років діагностовано косу пахвинну килу. Лікар пальпує грижовий мішок кили у пахвинному каналі, звертаючи увагу на посилення болю при пальпації його передньої та нижньої стінки. Чим утворена нижня стінка пахвинного каналу?", "o": ["Ligamentum lacunare.", "Ligamentum inguinale.", "Fascia transversalis.", "Musculus transversus abdominis.", "Апоневрозом musculus obliquus externus abdominis."], "a": [1], "e": ["Лакунарна зв'язка лежить присередньо, біля стегнового кільця.", "Нижню стінку пахвинного каналу утворює пахвинна зв'язка.", "Поперечна фасція утворює задню стінку.", "Поперечний м'яз утворює верхню стінку (разом з внутрішнім косим).", "Апоневроз зовнішнього косого м'яза утворює передню стінку."]}, {"n": "14.13", "q": "У дитини 10 років після травми сечостатевої ділянки промежини виник орхіт (запалення яєчка). Серед оболонок яєчка виділяють м'яз-підіймач яєчка (musculus cremaster). Похідним якого м'яза живота є m. cremaster?", "o": ["Musculus rectus abdominis.", "Musculus obliquus internus abdominis.", "Musculus pyramidalis.", "Musculus transversus abdominis.", "Musculus quadratus lumborum."], "a": [1], "e": ["Прямий м'яз живота не дає м'яза-підіймача яєчка.", "М'яз-підіймач яєчка — похідний внутрішнього косого м'яза живота (з поперечним).", "Пірамідальний м'яз лежить біля лобка.", "Поперечний м'яз дає лише частину волокон, основний — внутрішній косий.", "Квадратний м'яз попереку — на задній стінці."]}, {"n": "14.14", "q": "У чоловіка 45 років — міжреброва невралгія. Порушена іннервація глибоких аутохтонних м'язів грудної клітки. У хворого відбувається посилення болю при вдиху. Які м'язи є м'язами вдиху?", "o": ["Musculi intercostales interni.", "Musculi subcostales.", "Musculi transversi thoracis.", "Musculi intercostales externi.", "Musculi intercostales intimi."], "a": [3], "e": ["Внутрішні міжреброві м'язи — м'язи видиху.", "Підреброві м'язи — м'язи видиху.", "Поперечні м'язи грудей — м'язи видиху.", "Зовнішні міжреброві м'язи піднімають ребра — м'язи вдиху.", "Найглибші міжреброві м'язи — м'язи видиху."]}, {"n": "14.15", "q": "Чоловік 45 років звернувся до хірурга зі скаргами на випинання в правій пахвинній ділянці, яке збільшується при напруженні та супроводжується болем. Під час обстеження виявлено косу пахвинну килу, грижовий мішок якої вийшов із пахвинного каналу через поверхневе пахвинне кільце. Для проведення хірургічного втручання лікар планує зробити розтин передньої стінки пахвинного каналу. Чим утворена передня стінка пахвинного каналу?", "o": ["Fascia transversalis.", "Ligamentum inguinale.", "Aponeurosis musculi obliqui externi abdominis.", "Musculus transversus abdominis.", "Ligamentum lacunare."], "a": [2], "e": ["Поперечна фасція утворює задню стінку.", "Пахвинна зв'язка утворює нижню стінку.", "Передню стінку пахвинного каналу утворює апоневроз зовнішнього косого м'яза живота.", "Поперечний м'яз утворює верхню стінку.", "Лакунарна зв'язка не утворює стінок каналу."]}, {"n": "14.16", "q": "У травмованого юнака ушкоджена плечова кістка. На рентгенограмі лікар виявив лінію перелому вздовж cristae tuberculi majoris. У хлопця обмежені рухи в плечовому суглобі. Біль посилюється при приведенні та обертанні досередини верхньої кінцівки. Який м'яз грудної клітки прикріплюється до cristae tuberculi majoris humeri?", "o": ["Musculus pectoralis major.", "Musculus pectoralis minor.", "Musculus serratus anterior.", "Musculus subclavius.", "Musculus transversus thoracis."], "a": [0], "e": ["Великий грудний м'яз прикріплюється до гребеня великого горбка плечової кістки.", "Малий грудний м'яз прикріплюється до дзьобоподібного відростка.", "Передній зубчастий м'яз прикріплюється до лопатки.", "Підключичний м'яз прикріплюється до ключиці.", "Поперечний м'яз грудей прикріплюється до ребер."]}, {"n": "14.17", "q": "Одним із етапів кесаревого розтину є горизонтальне розсікання піхви прямого м'яза живота. Чим утворена передня стінка піхви прямого м'яза живота в нижній його третині?", "o": ["Aponeurosis musculus transversi abdominis, musculus obliquus internus abdominis.", "Aponeurosis musculus transversus abdominis, musculus pyramidalis.", "Aponeurosis musculus obliquus internus abdominis, musculus obliquus externus abdominis.", "Aponeurosis musculus transversus abdominis, musculus obliquus externus abdominis.", "Aponeurosis musculus transversus abdominis, musculus obliquus internus abdominis, musculus obliquus externus abdominis."], "a": [4], "e": ["Пропущено апоневроз зовнішнього косого м'яза.", "Пірамідальний м'яз лежить у піхві, але не утворює стінки.", "Пропущено апоневроз поперечного м'яза.", "Пропущено апоневроз внутрішнього косого м'яза.", "Нижче дугоподібної лінії всі три апоневрози проходять спереду, утворюючи передню стінку піхви."]}, {"n": "14.18", "q": "Дитину 12 років каретою швидкої медичної допомоги доставлено у лікарню. Під час МРТ-обстеження лікарі підтвердили попередній діагноз: перелом XII ребра справа, ушкодження поперечних відростків LI та LII поперекових хребців, що призвело до відриву м'язових волокон, що прикріплюються до цих утворів. Функція якого м'яза живота ушкоджена?", "o": ["Musculus quadratus lumborum.", "Musculus pyramidalis.", "Musculus obliquus externus abdominis.", "Musculus obliquus internus abdominis.", "Musculus transversus abdominis."], "a": [0], "e": ["Квадратний м'яз попереку прикріплюється до XII ребра та поперечних відростків LI–LIV.", "Пірамідальний м'яз лежить біля лобка.", "Зовнішній косий м'яз починається від зовнішньої поверхні ребер.", "Внутрішній косий м'яз прикріплюється до хрящів нижніх ребер.", "Поперечний м'яз починається від внутрішньої поверхні хрящів ребер."]}, {"n": "14.19", "q": "Чоловік 45 років після великого фізичного навантаження почав скаржитися на біль вздовж прямого м'яза живота. На які ділянки живота проєктується прямий м'яз живота?", "o": ["Regiones hypochondriacae dextra et sinistra, regio epigastrica.", "Regio epigastrica, regio umbilicalis, regio pubica.", "Regio umbilicalis, regiones laterales dextra et sinistra.", "Regiones inguinales dextra et sinistra, regio pubica.", "Regiones hypochondriacae dextra et sinistra, regiones laterales dextra et sinistra, regiones inguinales dextra et sinistra."], "a": [1], "e": ["Прямий м'яз проходить по середині, а не в підребрових ділянках.", "Прямий м'яз живота проєктується на надчеревну, пупкову та лобкову ділянки.", "Бічні ділянки — місце косих м'язів.", "Пахвинні ділянки — біля пахвинного каналу.", "Ці ділянки — бічні, там косі м'язи."]}, {"n": "14.20", "q": "Чоловіка 45 років госпіталізовано в хірургічне відділення лікарні з приводу косої пахвинної кили. Лікар використовує під час операції знання проєкції поверхневого та глибокого пахвинних кілець, топографії стінок пахвинного каналу, особливо орієнтуючись на нижню стінку, яка добре візуалізована. Який анатомічний утвір є нижньою стінкою пахвинного каналу?", "o": ["Ligamentum lacunare.", "Ligamentum reflexum.", "Ligamentum umbilicale medianum.", "Ligamentum umbilicale mediale.", "Ligamentum inguinale."], "a": [4], "e": ["Лакунарна зв'язка не є стінкою каналу.", "Загнута зв'язка обмежує поверхневе кільце.", "Серединна пупкова зв'язка — залишок сечової протоки.", "Присередня пупкова зв'язка — залишок пупкової артерії.", "Нижня стінка пахвинного каналу — пахвинна зв'язка."]}, {"n": "14.21", "q": "У лікарню госпіталізована жінка 37 років з травмою грудної клітки. У хворої виявлена підшкірна гематома, рентгенологічно підтверджено перелом верхніх дев'яти ребер, відрив м'язових волокон, що починаються від зовнішньої поверхні кісткової частини цих ребер і прикріплюються вздовж присереднього краю та кута лопатки. Який м'яз ушкоджений?", "o": ["Musculus pectoralis minor.", "Musculus pectoralis major.", "Musculus serratus posterior superior.", "Musculus serratus posterior inferior.", "Musculus serratus anterior."], "a": [4], "e": ["Малий грудний м'яз починається від III–V ребер і прикріплюється до дзьобоподібного відростка.", "Великий грудний м'яз прикріплюється до плечової кістки.", "Верхній задній зубчастий м'яз прикріплюється до II–V ребер.", "Нижній задній зубчастий м'яз — до нижніх ребер.", "Передній зубчастий м'яз починається від I–IX ребер і прикріплюється до присереднього краю та нижнього кута лопатки."]}, {"n": "14.22", "q": "Під час оперативного втручання в заочеревинному просторі черевної порожнини лікар, видаляючи злоякісну пухлину, ушкодив стінку підребрової артерії та волокна м'яза, який прикріплюється до нижнього краю XII ребра, тіла XII грудного та поперечних відростків LI–LIV поперекових хребців. Волокна якого м'яза ушкоджені?", "o": ["Musculus quadratus lumborum.", "Musculus pyramidalis.", "Musculus obliquus externus abdominis.", "Musculus obliquus internus abdominis.", "Musculus transversus abdominis."], "a": [0], "e": ["Квадратний м'яз попереку прикріплюється до XII ребра, тіла XII грудного й поперечних відростків LI–LIV.", "Пірамідальний м'яз лежить біля лобка.", "Зовнішній косий м'яз розташований спереду і збоку.", "Внутрішній косий м'яз розташований збоку.", "Поперечний м'яз — у бічній стінці живота."]}, {"n": "14.23", "q": "Лікар виконує лапароскопічну операцію у чоловіка 43 років з приводу пупкової кили. Під час ревізії внутрішньої поверхні передньої стінки черевної порожнини лікар орієнтується на дугоподібну лінію, яка є важливим орієнтиром і відповідає границі між верхньою та нижньою частинами задньої пластинки піхви прямого м'яза живота. Нижні краї апоневрозів яких м'язів утворюють цю лінію?", "o": ["Musculus obliquus externus abdominis et musculus obliquus internus abdominis.", "Musculus obliquus internus abdominis et musculus transversus abdominis.", "Musculus obliquus externus abdominis et musculus transversus abdominis.", "Musculus rectus abdominis et musculus obliquus internus abdominis.", "Musculus rectus abdominis et musculus pyramidalis."], "a": [1], "e": ["Зовнішній косий м'яз завжди проходить спереду від прямого м'яза.", "Дугоподібна лінія — нижній край задньої стінки піхви, утвореної апоневрозами внутрішнього косого і поперечного м'язів.", "Зовнішній косий м'яз не входить до задньої стінки.", "Прямий м'яз — вміст піхви, а не її стінка.", "Прямий і пірамідальний м'язи — вміст піхви."]}, {"n": "14.24", "q": "У новонародженої дитини діагностована коса пахвинна кила, вхідний отвір (глибоке пахвинне кільце) якої розташований в бічній пахвинній ямці на внутрішній поверхні передньої стінки черевної порожнини. Під час операції хірург запобіг кровотечі з нижньої надчеревної артерії, що лежить в основі очеревинної складки. Яка очеревинна складка розташована присередньо від глибокого пахвинного кільця?", "o": ["Plica umbilicalis mediana.", "Plica umbilicalis lateralis.", "Plica umbilicalis medialis.", "Plica duodenojejunalis.", "Plicae semilunares coli."], "a": [1], "e": ["Серединна пупкова складка — по серединній лінії, з залишком сечової протоки.", "Бічна пупкова складка містить нижні надчеревні судини й лежить присередньо від глибокого пахвинного кільця.", "Присередня пупкова складка містить залишок пупкової артерії.", "Дванадцятипало-порожньокишкова складка — у черевній порожнині біля кишки.", "Півмісяцеві складки — у товстій кишці."]}, {"n": "14.25", "q": "У лікарню госпіталізовано чоловіка 23 років з колото-різаною раною у правій пахвинній ділянці живота. Під час обробки рани у пацієнта хірург виявив ушкодження апоневрозу м'яза, що розташований поверхнево під шкірою. Який м'яз ушкоджений?", "o": ["Musculus rectus abdominis.", "Musculus pyramidalis.", "Musculus obliquus externus abdominis.", "Musculus obliquus internus abdominis.", "Musculus transversus abdominis."], "a": [2], "e": ["Прямий м'яз розташований у піхві біля серединної лінії.", "Пірамідальний м'яз — біля лобкового симфізу.", "Зовнішній косий м'яз живота найповерхневіший, його апоневроз лежить під шкірою в пахвинній ділянці.", "Внутрішній косий м'яз лежить глибше.", "Поперечний м'яз — найглибший."]}, {"n": "14.26", "q": "У лікарню госпіталізовано чоловіка 35 років з різаною раною в ділянці кутів X–XII ребра. Під час огляду хворого виявлено розрив м'язів, волокна яких прямують від кутів вгору, перекидаючись через одне-два ребра та фіксуються до вищерозташованих ребер. Які м'язи ушкоджено?", "o": ["Musculi pectoralis major et minor.", "Musculi transversi thoracis.", "Musculi intercostales externi.", "Musculi subcostales.", "Musculi intercostales interni et intimi."], "a": [3], "e": ["Великий і малий грудні м'язи — спереду.", "Поперечні м'язи грудей — на внутрішній поверхні груднини.", "Зовнішні міжреброві м'язи йдуть між сусідніми ребрами.", "Підреброві м'язи йдуть від кутів нижніх ребер, перекидаються через 1–2 ребра.", "Внутрішні та найглибші міжреброві м'язи йдуть між сусідніми ребрами."]}, {"n": "14.27", "q": "Лікар виконує лапароскопічне оперативне втручання у чоловіка 45 років з приводу пахвинної кили. Для знаходження глибокого пахвинного кільця хірург орієнтується на контур складки пристінкової очеревини, збоку від якої розташоване це кільце. Яку складку шукає лікар під час операції?", "o": ["Plica umbilicalis mediana.", "Plica umbilicalis lateralis.", "Plica umbilicalis medialis.", "Plica duodenojejunalis.", "Plicae semilunares coli."], "a": [1], "e": ["Серединна пупкова складка — по серединній лінії.", "Глибоке пахвинне кільце лежить збоку від бічної пупкової складки.", "Присередня пупкова складка — присередньо від присередньої ямки.", "Дванадцятипало-порожньокишкова складка — біля кишки.", "Півмісяцеві складки — у товстій кишці."]}, {"n": "14.28", "q": "У дитини 2 років проведено лапароскопічне дослідження з приводу прямої пахвинної кили, вхідний отвір якої розташований в присередній пахвинній ямці. Лікар знаходить цю ямку між очеревинними складками на внутрішній поверхні передньої черевної стінки. Яка очеревинна складка розташована присередньо від fossa inguinalis medialis?", "o": ["Plica umbilicalis mediana.", "Plica umbilicalis lateralis.", "Plica umbilicalis medialis.", "Plica duodenojejunalis.", "Plicae semilunares coli."], "a": [0], "e": ["За ключем — серединна пупкова складка. ⚠️ Анатомічно присередня пахвинна ямка лежить між бічною та присередньою пупковими складками, тобто присередньо від неї — plica umbilicalis medialis; схоже на помилку в ключі.", "Бічна пупкова складка лежить збоку (латерально) від присередньої ямки.", "Присередня пупкова складка безпосередньо обмежує присередню пахвинну ямку з присереднього боку.", "Дванадцятипало-порожньокишкова складка — біля кишки.", "Півмісяцеві складки — у товстій кишці."]}, {"n": "14.29", "q": "Чоловіка 45 років після дорожньо-транспортної пригоди госпіталізовано у лікарню з рваною раною у пупковій ділянці живота. Хворого турбує інтенсивний біль при спробі нахилу тулуба вперед та при напруженні передньої черевної стінки. Під час огляду рани лікар виявив розсічені посмуговані м'язові волокна. Який м'яз ушкоджений?", "o": ["Musculus rectus abdominis.", "Musculus pyramidalis.", "Musculus obliquus externus abdominis.", "Musculus obliquus internus abdominis.", "Musculus transversus abdominis."], "a": [0], "e": ["Прямий м'яз живота — посмугований, у пупковій ділянці, згинає тулуб вперед.", "Пірамідальний м'яз — біля лобка.", "Зовнішній косий м'яз — переважно збоку.", "Внутрішній косий м'яз — збоку.", "Поперечний м'яз — збоку й глибоко."]}, {"n": "14.30", "q": "У лікарню доставлено чоловіка 24 років з косою пахвинною килою. Під час огляду у пацієнта виявлено пухлиноподібне вип'ячування в пахвинній ділянці живота, що збільшується при фізичному навантаженні. Під час оперативного втручання лікар визначає, що ворота кили розташовані в овальній ямочці поперечної фасції, яка відповідає глибокому пахвинному кільцю. Як визначити проєкцію глибокого пахвинного кільця на шкіру?", "o": ["Біля нижньої передньої клубової ості.", "На 1 см вище лобкового симфізу.", "На 1,5 см вище середини пахвинної зв'язки.", "На 1 см вище середини пахвинної зв'язки.", "Проєктується посередині пахвинної зв'язки."], "a": [2], "e": ["Нижня передня клубова ость — над кульшовою западиною.", "Над лобковим симфізом проєктується поверхневе кільце, а не глибоке.", "Глибоке пахвинне кільце проєктується на 1,5 см вище середини пахвинної зв'язки.", "1 см — недостатньо.", "Посередині зв'язки — не глибоке кільце."]}], "models": [["Грудні м'язи і передній зубчастий", "o3d:upper-limb-axio-appendicular-muscles&subset=muscle-and-ligament-parts-hidden"], ["М'язи всього тіла", "sf:d32f5724fc294048888d03d215b9a1ff"]]}, {"id": "topic15", "title": "15. М’язи голови (musculi capitis)", "questions": [{"n": "15.1", "q": "30-річний чоловік звернувся до стоматолога зі скаргою на розлади жування, у нього виникає біль при поверненні назад висунутої вперед нижньої щелепи. Лікар передбачає ушкодження волокон жувального м'яза, який відповідає за ретракцію нижньої щелепи. Який м'яз тягне висунуту нижню щелепу назад?", "o": ["Скроневий м'яз (передні волокна).", "Скроневий м'яз (задні волокна).", "Присередній крилоподібний м'яз.", "Бічний крилоподібний м'яз.", "Жувальний м'яз."], "a": [1], "e": ["Передні волокна скроневого м'яза піднімають нижню щелепу.", "Задні волокна скроневого м'яза тягнуть висунуту нижню щелепу назад.", "Присередній крилоподібний м'яз піднімає щелепу і зміщує її в протилежний бік.", "Бічний крилоподібний м'яз висуває щелепу вперед.", "Жувальний м'яз піднімає нижню щелепу."]}, {"n": "15.2", "q": "Під час ДТП водій отримав тяжкі ушкодження голови, серед яких був перелом виличної дуги. Унаслідок цієї травми порушена функція жувального м'яза, що починається двома головками від виличної дуги. Функція якого м'яза порушена?", "o": ["Musculus masseter.", "Musculus orbicularis oris.", "Musculus buccinator.", "Musculus procerus.", "Musculus risorius."], "a": [0], "e": ["Жувальний м'яз починається двома частинами (поверхневою й глибокою) від виличної дуги та виличної кістки.", "Коловий м'яз рота — мімічний, оточує ротову щілину.", "Щічний м'яз починається від щелеп і крило-нижньощелепного шва.", "М'яз гордіїв починається від носової кістки.", "М'яз сміху починається від фасції жувального м'яза."]}, {"n": "15.3", "q": "У чоловіка 54 років діагностовано неврит лицевого нерва. Повікова щілина праворуч розширена, помітно більша ніж ліва, хворий не може зажмурити праве око. Функція якого мімічного м'яза порушена?", "o": ["Musculus zygomaticus major.", "Musculus corrugator supercilii.", "Musculus procerus.", "Musculus occipitofrontalis (venter frontalis).", "Musculus orbicularis oculi."], "a": [4], "e": ["Великий виличний м'яз тягне кут рота догори й назовні.", "М'яз-змарщувач брови зводить брови.", "М'яз гордіїв утворює поперечні складки на переніссі.", "Лобове черевце піднімає брови.", "Коловий м'яз ока змикає повіки; при його паралічі око не закривається."]}, {"n": "15.4", "q": "У чоловіка 60-років під час огляду виявлена глибока колото-різана рана щічної ділянки голови. Під час бійки були ушкоджені м'язові волокна, крізь які проходить привушна протока привушної слинної залози. Який м'яз голови пронизує ця протока?", "o": ["Musculus buccinator.", "Musculus risorius.", "Musculus orbicularis oris.", "Musculus masseter.", "Musculus levator anguli oris."], "a": [0], "e": ["Привушна протока пронизує щічний м'яз і відкривається на рівні другого верхнього великого кутнього зуба.", "М'яз сміху лежить поверхнево.", "Коловий м'яз рота оточує ротову щілину.", "Привушна протока лише огинає жувальний м'яз ззовні.", "М'яз-підіймач кута рота лежить вище, у ікловій ямці."]}, {"n": "15.5", "q": "У чоловіка 54 років під час обстеження діагностовано неврит трійчастого нерва. Хворий не може притиснути з великою силою нижні кутні зуби до верхніх кутніх зубів. Функція яких м'язів порушена в першу чергу?", "o": ["Мімічні м'язи.", "Надпід'язикові м'язи.", "Підпід'язикові м'язи.", "Жувальні м'язи.", "Скелетні м'язи язика."], "a": [3], "e": ["Мімічні м'язи іннервуються лицевим нервом.", "Надпід'язикові м'язи опускають нижню щелепу.", "Підпід'язикові м'язи опускають під'язикову кістку.", "Жувальні м'язи піднімають нижню щелепу й іннервуються трійчастим нервом (нижньощелепною гілкою).", "М'язи язика іннервуються під'язиковим нервом."]}, {"n": "15.6", "q": "Чоловік 25 років отримав травму привушно-жувальної ділянки голови. Під час проведення МРТ-дослідження у хворого виявлено деформацію суглобового диску, розрив капсули скронево-нижньощелепного суглоба та ушкодження м'язових волокон, що вплітаються в ці анатомічні утвори. Який м'яз прикріплюється до капсули скронево-нижньощелепного суглоба та до суглобового диска?", "o": ["Musculus pterygoideus lateralis.", "Musculus pterygoideus medialis.", "Musculus masseter.", "Musculus temporalis.", "Musculus buccinator."], "a": [0], "e": ["Бічний крилоподібний м'яз прикріплюється до шийки нижньої щелепи, капсули та диска скронево-нижньощелепного суглоба.", "Присередній крилоподібний м'яз прикріплюється до кута нижньої щелепи зсередини.", "Жувальний м'яз прикріплюється до кута нижньої щелепи ззовні.", "Скроневий м'яз прикріплюється до вінцевого відростка.", "Щічний м'яз — мімічний."]}, {"n": "15.7", "q": "У чоловіка 56 років — глибока різана рана на привушно-жувальній ділянці голови. Під час огляду лікар обробив краї рани в ділянці крило-нижньощелепного шва, наклав затискач на фасцію, що зрощується з цим швом. Яка це фасція?", "o": ["Fascia parotidea.", "Fascia masseterica.", "Fascia temporalis (lamina superficialis).", "Fascia temporalis (lamina profunda).", "Fascia buccopharyngea."], "a": [4], "e": ["Привушна фасція покриває привушну залозу.", "Жувальна фасція покриває жувальний м'яз.", "Поверхнева пластинка скроневої фасції кріпиться до виличної дуги.", "Глибока пластинка скроневої фасції кріпиться до виличної дуги зсередини.", "Щічно-глоткова фасція покриває щічний м'яз і глотку та зрощується з крило-нижньощелепним швом."]}, {"n": "15.8", "q": "Чоловік 23 років після травми обличчя не може підняти брови, широко розплющити очі. Лікар запідозрив ушкодження однієї з гілок лицевого нерва. Який м'яз втратив свою функцію?", "o": ["Musculus occipitofrontalis (venter frontalis).", "Musculus orbicularis oculi (pars palpebralis).", "Musculus orbicularis oculi (pars orbitalis).", "Musculus zygomaticus major.", "Musculus procerus."], "a": [0], "e": ["Лобове черевце потилично-лобового м'яза піднімає брови й утворює поперечні складки на лобі.", "Повікова частина колового м'яза ока змикає повіки.", "Очноямкова частина колового м'яза ока примружує око.", "Великий виличний м'яз піднімає кут рота.", "М'яз гордіїв опускає шкіру між бровами."]}, {"n": "15.9", "q": "Внаслідок травми привушно-жувальної ділянки голови у чоловіка 34 років виникло утруднення рухів в скронево-нижньощелепному суглобі. На КТ-зображенні лікар виявив відрив вінцевого відростка нижньої щелепи. Який м'яз, що прикріплюється до вінцевого відростка, втратив свою функцію?", "o": ["Musculus temporalis.", "Musculus masseter.", "Musculus pterygoideus lateralis.", "Musculus pterygoideus medialis.", "Musculus levator anguli oris."], "a": [0], "e": ["Скроневий м'яз прикріплюється до вінцевого відростка нижньої щелепи.", "Жувальний м'яз прикріплюється до жувальної горбистості кута щелепи.", "Бічний крилоподібний м'яз прикріплюється до шийки нижньої щелепи.", "Присередній крилоподібний м'яз прикріплюється до крилоподібної горбистості.", "М'яз-підіймач кута рота — мімічний."]}, {"n": "15.10", "q": "Після черепно-мозкової травми голови хлопчик 13 років не може рухати назад висунуту вперед нижню щелепу. Який м'яз ушкоджений?", "o": ["Musculus temporalis.", "Musculus masseter.", "Musculus pterygoideus lateralis.", "Musculus pterygoideus medialis.", "Musculus levator anguli oris."], "a": [0], "e": ["Задні волокна скроневого м'яза тягнуть висунуту нижню щелепу назад.", "Жувальний м'яз піднімає щелепу, лише трохи висуває її вперед.", "Бічний крилоподібний м'яз висуває щелепу вперед.", "Присередній крилоподібний м'яз піднімає щелепу.", "М'яз-підіймач кута рота — мімічний."]}, {"n": "15.11", "q": "При введенні міорелаксантів (препарати, що розслаблюють скелетні м'язи) під час оперативного втручання хворий не може самостійно дихати та переводиться на ШВЛ. Який м'яз, що є дихальним м'язом та частиною черевного пресу, не виконує свою функцію під дією препаратів?", "o": ["Musculus serratus anterior.", "Musculi intercostales interni.", "Musculi intercostales externi.", "Musculus phrenicus.", "Musculus pectoralis major."], "a": [3], "e": ["Передній зубчастий м'яз рухає лопатку.", "Внутрішні міжреброві м'язи — м'язи видиху, але не черевного пресу.", "Зовнішні міжреброві м'язи — м'язи вдиху, але не черевного пресу.", "Діафрагма — головний дихальний м'яз і частина черевного пресу.", "Великий грудний м'яз — допоміжний м'яз вдиху."]}, {"n": "15.12", "q": "Під час обстеження чоловіка 23 років виявлено, що він не може скласти губи трубочкою. На порушення функції якого м'яза вказують дані симптоми?", "o": ["Підшкірного м'яза шиї.", "Жувального м'яза.", "М'яза сміху.", "Великого виличного м'яза.", "Колового м'яза рота."], "a": [4], "e": ["Підшкірний м'яз шиї відтягує кут рота донизу.", "Жувальний м'яз піднімає щелепу.", "М'яз сміху тягне кут рота вбік.", "Великий виличний м'яз тягне кут рота вгору і вбік.", "Коловий м'яз рота стискає губи й витягує їх уперед — «трубочкою»."]}, {"n": "15.13", "q": "У чоловіка 45 років із хронічним кашлем та ожирінням під час проведення комп'ютерної томографії виявлено діафрагмову килу. В межах яких утворів діафрагми вона найчастіше виникає?", "o": ["Hiatus aorticus.", "Foramen venae cavae.", "Trigonum lumbocostalis, trigonum sternocostalis.", "Hiatus oesophageus.", "Fascia diaphragmatica."], "a": [2], "e": ["Аортальний розтвір обмежений ніжками діафрагми, кили тут рідко.", "Отвір нижньої порожнистої вени — у сухожилковому центрі.", "Слабкі місця діафрагми — попереково-реброві й груднинно-реброві трикутники, де немає м'язових волокон.", "Стравохідний розтвір теж може бути місцем кили, але за ключем — трикутники.", "Діафрагмова фасція — покрив, а не слабке місце."]}, {"n": "15.14", "q": "У чоловіка 45 років діагностовано вогнепальне поранення черевної порожнини з ушкодженням стінки аорти в місці переходу її грудної частини в черевну через аортальний розтвір діафрагми. Які утвори обмежують аортальний розтвір діафрагми?", "o": ["Trigonum lumbocostale.", "Crus dextrum et crus sinistrum.", "Trigonum sternocostale.", "Hiatus oesophageus.", "Foramen venae cavae."], "a": [1], "e": ["Попереково-ребровий трикутник — слабке місце, а не аортальний розтвір.", "Аортальний розтвір обмежений правою й лівою ніжками поперекової частини діафрагми.", "Груднинно-ребровий трикутник — спереду.", "Стравохідний розтвір — вище і лівіше.", "Отвір нижньої порожнистої вени — у сухожилковому центрі."]}, {"n": "15.15", "q": "У чоловіка 54 років під час МРТ-обстеження виявлена злоякісна пухлина стравоходу в ділянці стравохідного розтвору діафрагми. Де в діафрагмі знаходиться цей отвір?", "o": ["В правій ребровій частині.", "В лівій ребровій частині.", "Між crus dextrum et sinistrum поперекової частини.", "В груднинній частині.", "В сухожилковому центрі."], "a": [2], "e": ["Права реброва частина не має стравохідного розтвору.", "Ліва реброва частина не має стравохідного розтвору.", "Стравохідний розтвір утворений правою і лівою ніжками поперекової частини.", "Груднинна частина не має великих отворів.", "У сухожилковому центрі — отвір нижньої порожнистої вени."]}, {"n": "15.16", "q": "У чоловіка 43 років після травматичного ушкодження на КТ виявлено перелом вінцевого відростка нижньої щелепи. У хворого порушені рухи у скронево-нижньощелепному суглобі. Який м'яз прикріплюється до вінцевого відростка і втратив функцію?", "o": ["Musculus temporalis.", "Musculus masseter.", "Musculus pterygoideus lateralis.", "Musculus pterygoideus medialis.", "Musculus levator anguli oris."], "a": [0], "e": ["Скроневий м'яз прикріплюється до вінцевого відростка нижньої щелепи.", "Жувальний м'яз прикріплюється до кута щелепи.", "Бічний крилоподібний м'яз прикріплюється до шийки нижньої щелепи.", "Присередній крилоподібний м'яз прикріплюється до внутрішньої поверхні кута.", "М'яз-підіймач кута рота — мімічний."]}, {"n": "15.17", "q": "У жінки 32 років після травми голови виникає больовий синдром при висуванні нижньої щелепи вперед. Який м'яз висуває нижню щелепу вперед?", "o": ["Musculus zygomaticus major.", "Musculus pterygoideus lateralis.", "Musculus mylohyoideus.", "Musculus zygomaticus minor.", "Musculus mentalis."], "a": [1], "e": ["Великий виличний м'яз — мімічний.", "Бічний крилоподібний м'яз (при двобічному скороченні) висуває нижню щелепу вперед.", "Щелепно-під'язиковий м'яз опускає щелепу та піднімає під'язикову кістку.", "Малий виличний м'яз — мімічний.", "Підборідний м'яз — мімічний."]}, {"n": "15.18", "q": "Карета швидкої медичної допомоги доставила в лікарню чоловіка з черепно-мозковою травмою. Після рентгенологічного обстеження лікар виявив перелом виличної дуги з відривом м'язових волокон, що фіксуються до неї. Волокна якого м'яза починаються від виличної дуги?", "o": ["Musculus temporalis.", "Musculus pterygoideus lateralis.", "Musculus mylohyoideus.", "Musculus pterygoideus medialis.", "Musculus masseter."], "a": [4], "e": ["Скроневий м'яз починається від скроневої ямки.", "Бічний крилоподібний м'яз починається від крилоподібного відростка й великого крила клиноподібної кістки.", "Щелепно-під'язиковий м'яз починається від нижньої щелепи.", "Присередній крилоподібний м'яз починається від крилоподібної ямки.", "Жувальний м'яз починається від виличної дуги."]}, {"n": "15.19", "q": "У жінки 45 років після травми очного яблука діагностовано гнійне запалення м'яких тканин очної ямки, яке пізніше поширилось у підскроневу ямку. Унаслідок захворювання порушена функція м'яза голови, який починається від верхньої та присередньої стінки підскроневої ямки. Функція якого м'яза порушена?", "o": ["Musculus temporalis.", "Musculus pterygoideus lateralis.", "Musculus pterygoideus medialis.", "Musculus zygomaticus minor.", "Musculus masseter."], "a": [1], "e": ["Скроневий м'яз починається від скроневої ямки.", "Бічний крилоподібний м'яз починається від верхньої та присередньої стінок підскроневої ямки (підскронева поверхня великого крила і бічна пластинка крилоподібного відростка).", "Присередній крилоподібний м'яз починається від крилоподібної ямки.", "Малий виличний м'яз — мімічний.", "Жувальний м'яз починається від виличної дуги."]}, {"n": "15.20", "q": "У хірургічне відділення лікарні госпіталізовано чоловіка 22 років з вогнепальним пораненням голови. Після рентгенологічного обстеження діагностовано перелом крилоподібного відростка клиноподібної кістки та відрив м'язових волокон, що починаються в крилоподібній ямці крилоподібного відростка. Функція якого м'яза ушкоджена?", "o": ["Musculus temporalis.", "Musculus pterygoideus lateralis.", "Musculus pterygoideus medialis.", "Musculus zygomaticus minor.", "Musculus masseter."], "a": [2], "e": ["Скроневий м'яз починається від скроневої ямки.", "Бічний крилоподібний м'яз починається від бічної пластинки ззовні.", "Присередній крилоподібний м'яз починається в крилоподібній ямці крилоподібного відростка.", "Малий виличний м'яз — мімічний.", "Жувальний м'яз починається від виличної дуги."]}, {"n": "15.21", "q": "У чоловіка 34 років діагностовано вивих головки нижньої щелепи в скронево-нижньощелепному суглобі. Під час травми ушкоджений м'яз, волокна якого прикріплюються до крилоподібної ямочки в ділянці шийки виросткового відростка нижньої щелепи. Функція якого м'яза ушкоджена?", "o": ["Musculus temporalis.", "Musculus pterygoideus lateralis.", "Musculus pterygoideus medialis.", "Musculus zygomaticus minor.", "Musculus masseter."], "a": [1], "e": ["Скроневий м'яз прикріплюється до вінцевого відростка.", "Бічний крилоподібний м'яз прикріплюється до крилоподібної ямочки шийки нижньої щелепи.", "Присередній крилоподібний м'яз прикріплюється до крилоподібної горбистості.", "Малий виличний м'яз — мімічний.", "Жувальний м'яз прикріплюється до жувальної горбистості."]}, {"n": "15.22", "q": "У чоловіка 34 років діагностовано вивих нижньої щелепи в скронево-нижньощелепному суглобі. Під час травми ушкоджені волокна бічного крилоподібного м'яза, які прикріплюються в ділянці шийки нижньої щелепи. До якого утвору прикріплюється бічний крилоподібний м'яз?", "o": ["Крилоподібної горбистості.", "Крилоподібної ямки.", "Крилоподібного відростку.", "Крилоподібної ямочки.", "Musculus masseter."], "a": [3], "e": ["Крилоподібна горбистість — місце прикріплення присереднього крилоподібного м'яза.", "Крилоподібна ямка — на клиноподібній кістці, місце початку присереднього крилоподібного м'яза.", "Крилоподібний відросток — місце початку.", "Бічний крилоподібний м'яз прикріплюється до крилоподібної ямочки на шийці нижньої щелепи.", "Жувальний м'яз — це м'яз, а не місце прикріплення."]}, {"n": "15.23", "q": "У відділення щелепно-лицевої хірургії госпіталізовано чоловіка 45 років з вогнепальним пораненням суглоба, в утворенні якого бере участь нижня щелепа (mandibula). Лікар встановив ушкодження суглобових поверхонь обох кісток, що утворюють цей суглоб. Яка кістка, крім нижньої щелепи, ушкоджена?", "o": ["Клиноподібна кістка (os sphenoidale).", "Скронева кістка (os temporale).", "Верхня щелепа (maxilla).", "Вилична кістка (os zygomaticum).", "Потилична кістка (os occipitale)."], "a": [1], "e": ["Клиноподібна кістка не утворює скронево-нижньощелепного суглоба.", "Скронево-нижньощелепний суглоб утворений нижньою щелепою і скроневою кісткою.", "Верхня щелепа не утворює суглоба з нижньою.", "Вилична кістка не утворює суглоба з нижньою щелепою.", "Потилична кістка утворює суглоб з атлантом."]}, {"n": "15.24", "q": "У відділення щелепно-лицевої хірургії госпіталізовано чоловіка 32 років з черепно-мозковою травмою, що сталася під час дорожньо-транспортної пригоди. Після обстеження лікар діагностував перелом нижньої щелепи. На рентгенограмі лінія перелому проходить вздовж косої лінії, від якої починаються м'язові волокна. Хворий не може виштовхнути назовні вміст ротової порожнини і повітря (загасити свічку). Функція якого м'яза порушена?", "o": ["M. temporalis.", "M. pterygoideus lateralis.", "M. pterygoideus medialis.", "M. zygomaticus minor.", "M. buccinator."], "a": [4], "e": ["Скроневий м'яз піднімає щелепу.", "Бічний крилоподібний м'яз висуває щелепу.", "Присередній крилоподібний м'яз піднімає щелепу.", "Малий виличний м'яз піднімає верхню губу.", "Щічний м'яз (починається від щелеп у ділянці косої лінії) притискає щоки та виштовхує повітря з рота."]}, {"n": "15.25", "q": "У чоловіка 45 років, що потрапив в нейрохірургічне відділення, виявлена гематома (крововилив) в скроневій ділянці голови. Після обстеження лікар діагностував порушення функції м'яза, який починається від кісток черепа, що утворюють скроневу ямку. Функція якого м'яза порушена?", "o": ["Musculus temporalis.", "Musculus pterygoideus lateralis.", "Musculus pterygoideus medialis.", "Musculus zygomaticus minor.", "Musculus masseter."], "a": [0], "e": ["Скроневий м'яз починається від кісток, що утворюють скроневу ямку.", "Бічний крилоподібний м'яз починається від підскроневої ямки.", "Присередній крилоподібний м'яз починається від крилоподібної ямки.", "Малий виличний м'яз — мімічний.", "Жувальний м'яз починається від виличної дуги."]}, {"n": "15.26", "q": "У дитячу лікарню карета швидкої медичної допомоги доставила дитину 8 місяців з травмою голови після падіння з пеленального стола. Під час огляду лікар виявив крововилив у скроневій ділянці голови, ушкодження м'яких тканин та м'язових волокон скроневого м'яза. Від стінки якої ямки починаються волокна скроневого м'яза?", "o": ["Fossa cranii anterior.", "Fossa temporalis.", "Fossa infratemporalis.", "Fossa cranii media.", "Fossa cranii posterior."], "a": [1], "e": ["Передня черепна ямка — всередині черепа.", "Скроневий м'яз починається від стінок скроневої ямки.", "Від підскроневої ямки починаються крилоподібні м'язи.", "Середня черепна ямка — всередині черепа.", "Задня черепна ямка — всередині черепа."]}, {"n": "15.27", "q": "Під час обстеження чоловіка 56 років виявлено, що хворий не може загасити сірник чи надути повітряну кульку. На порушення функції якого м'яза вказують дані симптоми?", "o": ["Щічного м'яза.", "Жувального м'яза.", "М'яза сміху.", "Великого виличного м'яза.", "Колового м'яза рота."], "a": [0], "e": ["Щічний м'яз виштовхує повітря з рота; при його слабкості неможливо загасити сірник чи надути кульку.", "Жувальний м'яз піднімає щелепу.", "М'яз сміху тягне кут рота вбік.", "Великий виличний м'яз тягне кут рота вгору.", "Коловий м'яз рота стискає губи, але виштовхує повітря головно щічний."]}, {"n": "15.28", "q": "У чоловіка 43 років під час огляду лікар виявив, що права носо-губна складка розгладжена, розширена права повікова щілина (її не вдається закрити під час зажмурювання, тому що повіки не змикаються). На порушення функції якого м'яза вказують дані симптоми?", "o": ["М'яза-підіймача верхньої повіки.", "Жувального м'яза.", "М'яза гордіїв.", "Великого виличного м'яза.", "Колового м'яза ока."], "a": [4], "e": ["М'яз-підіймач верхньої повіки піднімає повіку (окоруховий нерв).", "Жувальний м'яз не впливає на повіки.", "М'яз гордіїв утворює складки на переніссі.", "Великий виличний м'яз — бере участь у носогубній складці, але повік не змикає.", "Коловий м'яз ока змикає повіки; при паралічі лицевого нерва око не закривається."]}, {"n": "15.29", "q": "У чоловіка 43 років після переохолодження спостерігається однобічний парез м'язів лиця, зниження слуху, відсутнє сльозовиділення, порушене ковтання. Лікар запідозрив неврит лицевого нерва та ушкодження утворів, що є похідними однієї зябрової дуги. З якої зябрової дуги розвиваються мімічні м'язи та нерв, що їх іннервує?", "o": ["I зябрової дуги, щелепної.", "II зябрової дуги, під'язикової.", "III зябрової дуги.", "III-V зябрової дуги.", "IV–V зябрової дуги."], "a": [1], "e": ["Із I (щелепної) дуги розвиваються жувальні м'язи та трійчастий нерв.", "Із II (під'язикової) дуги розвиваються мімічні м'язи та лицевий нерв.", "Із III дуги — шило-глотковий м'яз і язикоглотковий нерв.", "III–V дуги дають м'язи глотки й гортані.", "IV–V дуги — м'язи гортані й глотки, блукаючий нерв."]}, {"n": "15.30", "q": "У відділення щелепно-лицевої хірургії з вогнепальним пораненням госпіталізовано чоловіка 36 років. Після огляду хворого та рентгенологічного обстеження лікар виявив, що куля пройшла крізь кістку черепа біля підборідного отвору (foramen mentale) з ушкодженням судинно-нервового пучка та однойменного м'яза лиця. Крізь яку кістку пройшла куля?", "o": ["Верхню щелепу (maxilla).", "Леміш (vomer).", "Виличну кістку (os zygomaticum).", "Нижню щелепу (mandibula).", "Піднебінну кістку (os palatinum)."], "a": [3], "e": ["Верхня щелепа має підочноямковий отвір.", "Леміш — кістка носової перегородки.", "Вилична кістка має вилично-лицевий отвір.", "Підборідний отвір розташований на тілі нижньої щелепи.", "Піднебінна кістка має піднебінні отвори."]}], "models": [["Жувальний м'яз", "sf:6608f6a82eae49c18e4b1ce852557fb2"], ["М'язи всього тіла", "sf:d32f5724fc294048888d03d215b9a1ff"]]}];
const ATLAS = [["Скелет", [["Весь скелет", "o3d:overview-skeleton"], ["Скелет тулуба", "sf:601a448ecdcc446fae033341c601f7d2"]]], ["Череп", [["Череп з підписами", "o3d:overview-skull"], ["Череп — розібраний на кістки", "o3d:exploded-skull"], ["Кістки черепа різними кольорами", "sf:d1d1aed420424c8db784391ad8261a2f"], ["Сагітальний розріз черепа", "sf:5e73a548332742c8bc722d5f14ae35f0"], ["Клиноподібна кістка", "sf:bbcdb2732b6f405090369221fa7fa0e5"], ["Скронева кістка", "sf:fed5c349bc4a4455b9cf0892eaa5e727"]]], ["Хребет і грудна клітка", [["Типи хребців", "sf:9cd7985cec8942ed8507c76f235bd6b3"], ["Хребтовий стовп", "sf:d6694f4a47ff4dc989f1aa1ce408ca1d"], ["Грудна клітка", "sf:0f1aa77bf02e4d438f8630bd6c53b12e"]]], ["Верхня кінцівка", [["Верхня кінцівка", "o3d:upper-limb"], ["Кисть і зап'ясток", "o3d:hand"], ["Обертальна манжета плеча", "o3d:rotator-cuff"], ["М'язи плеча", "o3d:upper-limb-arm-muscles&subset=ligament-parts-hidden"], ["М'язи передпліччя (передня група)", "o3d:upper-limb-forearm-anterior-compartment-muscles"]]], ["Нижня кінцівка", [["Нижня кінцівка", "o3d:lower-limb"], ["Кульшова ділянка і таз", "o3d:zone-hip"], ["Колінний суглоб: зв'язки", "sf:efd5b74b3c7046bf93d6dcafcd88c0a7"], ["Гомілковостопний суглоб і стопа", "o3d:zone-ankle"]]], ["М'язи", [["М'язи всього тіла", "sf:d32f5724fc294048888d03d215b9a1ff"], ["М'язи верхньої частини спини", "sf:85159e313b434023ac044011ea752a10"], ["М'язи, що з'єднують тулуб з рукою", "o3d:upper-limb-axio-appendicular-muscles&subset=muscle-and-ligament-parts-hidden"], ["Жувальний м'яз", "sf:6608f6a82eae49c18e4b1ce852557fb2"]]]];

const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){}
  if (tg.colorScheme === 'dark') document.documentElement.classList.add('dark');
} else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.classList.add('dark');
}
const ask = (msg, yes) => { if (tg && tg.showConfirm) { try { return tg.showConfirm(msg, ok => ok && yes()); } catch(e){} } if (confirm(msg)) yes(); };
const haptic = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t); } catch(e){} };

// ---------- storage ----------
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let stats = store.get('stats') || {};     // {topicId: {best:%, last:%, runs:n}}
let settings = store.get('settings') || {shuffleQ:true, shuffleO:false};

// ---------- state ----------
let S = null; // current session
const $ = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const LET = ['A','B','C','D','E','F'];

function setBack(fn){
  if (!tg || !tg.BackButton) return;
  try { tg.BackButton.offClick(setBack._h); } catch(e){}
  if (fn){ setBack._h = fn; tg.BackButton.onClick(fn); tg.BackButton.show(); } else tg.BackButton.hide();
}

// ---------- 3D ----------
let curModel=null, prevBack=null;
function mUrl(src){ return src.startsWith('sf:') ? `https://sketchfab.com/models/${src.slice(3)}/embed?autostart=1&ui_infos=0&ui_watermark=0&ui_hint=2&dnt=1` : `https://caskanatomy.info/open3dviewer/?model=${src.slice(4)}`; }
function mPage(src){ return src.startsWith('sf:') ? `https://sketchfab.com/models/${src.slice(3)}` : mUrl(src); }
function mSrcName(src){ return src.startsWith('sf:') ? 'Sketchfab' : 'Open3DModel'; }
function modelBtns(list){ return list.map((m,i)=>`<button class="mitem" onclick='openModel(${JSON.stringify(m).replace(/'/g,"&#39;")})'>🧊 <span>${esc(m[0])}</span><span class="src">${mSrcName(m[1])}</span></button>`).join(''); }
function openModel(m){
  closeSheet(); curModel=m;
  document.getElementById('vTitle').textContent=m[0];
  document.getElementById('vFrame').src=mUrl(m[1]);
  document.getElementById('vCredit').textContent = m[1].startsWith('sf:') ? 'Модель з Sketchfab (автор вказаний на сторінці моделі). Якщо модель не завантажилась — натисніть «↗ Окремо».' : 'Open3DModel, Leiden University Medical Center та ін., ліцензія CC BY-SA. Підписи англійською/латиною. Структури можна вмикати й вимикати в меню моделі.';
  document.getElementById('viewer').classList.add('on');
  prevBack=setBack._h||null; setBack(closeViewer);
}
function closeViewer(){ document.getElementById('viewer').classList.remove('on'); document.getElementById('vFrame').src='about:blank'; setBack(prevBack); }
function openExt(){ const u=mPage(curModel[1]); try{ if(tg&&tg.openLink) return tg.openLink(u); }catch(e){} window.open(u,'_blank'); }
function showTopicModels(i){
  const t=DATA[i];
  document.getElementById('sheetIn').innerHTML=`<div class="gh" style="margin-top:0">3D-моделі: ${esc(t.title)}</div>${modelBtns(t.models)}<button class="btn sec" style="margin-top:6px" onclick="closeSheet()">Закрити</button>`;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
let homeTab='tests';
function atlas(){
  S=null; setBack(null); homeTab='atlas';
  let h='<h1>🩺 MedQuiz</h1><div class="tabs"><button onclick="home()">Тести</button><button class="on">3D-атлас</button></div>';
  ATLAS.forEach(g=>{ h+=`<div class="gh">${esc(g[0])}</div>`+modelBtns(g[1]); });
  h+='<p class="note" style="margin-top:14px">Модель обертається пальцем, масштаб — двома пальцями. Моделі завантажуються з інтернету. Якщо модель не відкривається всередині Telegram, натисніть «↗ Окремо» — вона відкриється в браузері.</p>';
  $.innerHTML=h; window.scrollTo(0,0);
}

// ---------- screens ----------
function home(){
  S = null; setBack(null); homeTab='tests';
  let h = '<h1>🩺 MedQuiz</h1><div class="tabs"><button class="on">Тести</button><button onclick="atlas()">3D-атлас</button></div>';
  DATA.forEach((t,i) => {
    const st = stats[t.id];
    h += `<div class="card topic" onclick="start(${i})">
      <div class="t">${esc(t.title)}</div>
      <div class="s">${t.questions.length} питань${st ? ` · останній: ${st.last}% · кращий: ${st.best}%` : ''}</div>${t.models&&t.models.length?`<button class="m3d" onclick="event.stopPropagation();showTopicModels(${i})">🧊 3D-моделі (${t.models.length})</button>`:''}</div>`;
  });
  h += `<div class="card">
    <label class="sw"><span>Перемішувати питання</span><input type="checkbox" ${settings.shuffleQ?'checked':''} onchange="setS('shuffleQ',this.checked)"></label>
    <label class="sw"><span>Перемішувати варіанти відповідей</span><input type="checkbox" ${settings.shuffleO?'checked':''} onchange="setS('shuffleO',this.checked)"></label>
  </div>`;
  $.innerHTML = h;
}
function setS(k,v){ settings[k]=v; store.set('settings',settings); }

function start(i, onlyIdx){
  const t = DATA[i];
  let items = t.questions.map((q,idx) => ({q, idx}));
  if (onlyIdx) items = items.filter(x => onlyIdx.includes(x.idx));
  if (settings.shuffleQ) items = shuffle(items);
  items = items.map(x => {
    let order = x.q.o.map((_,k)=>k);
    if (settings.shuffleO) order = shuffle(order);
    return {idx:x.idx, q:x.q, order};
  });
  S = {ti:i, items, pos:0, picked:null, wrong:[], right:0, partial: !!onlyIdx};
  setBack(() => ask('Вийти з тесту? Прогрес не збережеться.', home));
  render();
}

function render(){
  const it = S.items[S.pos], total = S.items.length;
  const answered = S.picked !== null;
  let h = `<div class="top"><button class="back" onclick="ask('Вийти з тесту? Прогрес не збережеться.', home)">← Теми</button>
    <span>${DATA[S.ti].models&&DATA[S.ti].models.length?`<button class="m3d" style="margin:0 8px 0 0" onclick="showTopicModels(${S.ti})">🧊 3D</button>`:''}${S.pos+1} / ${total} · ✓ ${S.right}</span></div>
    <div class="bar"><i style="width:${(S.pos + (answered?1:0))/total*100}%"></i></div>
    <div class="q">${esc(it.q.q)}</div>`;
  it.order.forEach((k,pos) => {
    let cls = 'opt';
    if (answered){
      cls += ' locked';
      const isRight = it.q.a.includes(k);
      if (isRight) cls += ' ok';
      else if (S.picked === k) cls += ' bad';
      else cls += ' dim';
    }
    let ex = '';
    if (answered && it.q.e && it.q.e[k]) {
      const right = it.q.a.includes(k);
      ex = `<span class="ex"><b>${right ? '✓ Правильно.' : '✗ Ні.'}</b> ${esc(it.q.e[k])}</span>`;
    }
    h += `<button class="${cls}" ${answered?'disabled':''} onclick="pick(${k})"><span class="l">${LET[pos]}</span><span class="tx"><span>${esc(it.q.o[k])}</span>${ex}</span></button>`;
  });
  if (answered){
    h += `<div class="foot"><div class="in"><button class="btn" onclick="next()">${S.pos+1<total?'Далі →':'Результат'}</button></div></div>`;
  }
  $.innerHTML = h;
  
}

function pick(k){
  if (S.picked !== null) return;
  const it = S.items[S.pos];
  S.picked = k;
  if (it.q.a.includes(k)){ S.right++; haptic('success'); }
  else { S.wrong.push(S.pos); haptic('error'); }
  render();
}
function next(){
  S.pos++; S.picked = null;
  window.scrollTo(0,0);
  if (S.pos >= S.items.length) return result();
  render();
}

function result(){
  const total = S.items.length, pct = Math.round(S.right/total*100);
  const t = DATA[S.ti];
  if (!S.partial){
    const st = stats[t.id] || {best:0, runs:0};
    stats[t.id] = {best: Math.max(st.best, pct), last: pct, runs: st.runs+1};
    store.set('stats', stats);
  }
  setBack(home);
  let h = `<h1>Результат</h1><div class="card"><div class="big">${S.right} / ${total}</div><div class="mut">${pct}%</div>`;
  const wrongItems = S.wrong.map(p => S.items[p]);
  if (wrongItems.length){
    h += `<button class="btn" onclick="start(${S.ti}, [${wrongItems.map(x=>x.idx)}])">Повторити помилки (${wrongItems.length})</button><div style="height:10px"></div>`;
  }
  h += `<div class="row"><button class="btn sec" onclick="start(${S.ti})">Ще раз</button><button class="btn sec" onclick="home()">До тем</button></div></div>`;
  if (wrongItems.length){
    h += '<div class="card"><b>Помилки</b><div style="height:8px"></div>';
    wrongItems.forEach(it => {
      h += `<div class="rev"><b>${esc(it.q.n)}</b> ${esc(it.q.q)}<br><b class="g">✓ ${esc(it.q.a.map(k=>it.q.o[k]).join('; '))}</b>${it.q.e ? `<br><span style="color:var(--muted)">${esc(it.q.e[it.q.a[0]])}</span>` : ''}</div>`;
    });
    h += '</div>';
  }
  $.innerHTML = h;
  window.scrollTo(0,0);
}

home();
</script>
</body>
</html>
