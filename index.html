<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MedQuiz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#1b1f24; --muted:#6b7280; --line:#e3e6ea;
  --accent:#2f6fed; --accent-t:#fff;
  --ok-bg:#d9f5df; --ok-line:#2da44e; --ok-t:#12501f;
  --bad-bg:#fde0e0; --bad-line:#e5484d; --bad-t:#7a1418;
  --fs:16px;
}
.dark{
  --bg:#12151a; --card:#1c2128; --text:#e8ebef; --muted:#9aa4b2; --line:#2c333c;
  --accent:#4c8dff; --accent-t:#fff;
  --ok-bg:#12351d; --ok-line:#3fb950; --ok-t:#b8f0c4;
  --bad-bg:#401618; --bad-line:#f85149; --bad-t:#ffc9c7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:1.25em;margin:4px 0 14px;display:flex;align-items:center;gap:8px}
h1 .sp{flex:1}
.ib{border:0;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:1em;font-weight:600;background:var(--accent);color:var(--accent-t);cursor:pointer}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.row{display:flex;gap:10px}.row>*{flex:1}
.topic{cursor:pointer}
.topic .t{font-weight:600}
.topic .s{color:var(--muted);font-size:.82em;margin-top:4px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.88em;margin-bottom:8px}
.back{background:none;border:0;color:var(--accent);font-size:.95em;padding:4px 0;cursor:pointer}
.q{font-size:1.06em;margin:12px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;font-size:1em;cursor:pointer}
.opt .l{flex:0 0 26px;height:26px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-t)}
.opt.ok .l{background:var(--ok-line);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-t)}
.opt.bad .l{background:var(--bad-line);color:#fff}
.opt.locked{cursor:default}
.opt.dim{opacity:.8}
.opt .tx{display:flex;flex-direction:column;gap:6px}
.opt .ex{font-size:.85em;line-height:1.4;color:var(--muted)}
.opt.ok .ex{color:var(--ok-t);opacity:.9}
.opt.bad .ex{color:var(--bad-t);opacity:.9}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.foot .in{max-width:640px;margin:0 auto}
.big{font-size:2.75em;font-weight:800;text-align:center;margin:10px 0 0}
.mut{color:var(--muted);text-align:center;margin-bottom:12px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw input[type=checkbox]{width:22px;height:22px;flex:0 0 auto}
.seg{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:10px;flex:0 0 auto}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:8px;font-size:.85em;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text)}
.lab{font-size:.82em;color:var(--muted);margin:10px 0 4px}
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1em}
.rev{font-size:.88em;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rev:last-child{border:0;margin:0;padding:0}
.rev b.g{color:var(--ok-line)}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;border-radius:9px;padding:9px;font-size:.92em;font-weight:600;background:transparent;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--text)}
.m3d{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:8px;padding:4px 9px;cursor:pointer}
.mitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font-size:.94em;cursor:pointer}
.mitem .src{margin-left:auto;font-size:11px;color:var(--muted)}
.gh{font-weight:700;margin:16px 0 8px;font-size:.94em}
.note{font-size:.8em;color:var(--muted);line-height:1.4}
.pill{display:inline-block;font-size:.75em;padding:2px 8px;border-radius:20px;background:var(--line);color:var(--muted)}
.lb{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border:0}
.lb .r{width:28px;text-align:center;font-weight:800;color:var(--muted)}
.lb .n{flex:1;min-width:0}
.lb .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .n small{color:var(--muted)}
.lb .p{text-align:right;font-weight:700}
.lb .p small{display:block;font-weight:400;color:var(--muted);font-size:.75em}
.lb.me{background:var(--ok-bg);border-radius:10px;padding-left:6px;padding-right:6px}
.stat{display:flex;gap:10px;margin-bottom:12px}
.stat .card{flex:1;margin:0;text-align:center}
.stat b{display:block;font-size:1.5em}
.stat small{color:var(--muted);font-size:.78em}
#viewer{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#viewer.on{display:flex}
#viewer .vt{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#viewer .vt b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer .vt button{border:0;background:var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
#viewer iframe{flex:1;border:0;width:100%;background:#000}
#viewer .vc{font-size:11px;color:var(--muted);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .in{background:var(--bg);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.88em;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:.92}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetIn"></div></div>
<div id="viewer"><div class="vt"><b id="vTitle"></b><button onclick="openExt()" id="vExt"></button><button onclick="closeViewer()">✕</button></div><iframe id="vFrame" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe><div class="vc" id="vCredit"></div></div>
<div id="toast"></div>
<script>
const DATA = [{"id": "topic1", "title": "1. Анатомічна номенклатура. Осі і площини тіла людини. Форма та пропорції тіла людини. Загальні ознаки хребців. Характерні ознаки будови шийних, грудних, поперекових хребців.", "tr": {"ru": "1. Анатомическая номенклатура. Оси и плоскости тела человека. Форма и пропорции тела человека. Общие признаки позвонков. Характерные признаки строения шейных, грудных, поясничных позвонков.", "en": "1. Anatomical nomenclature. Axes and planes of the human body. Body shape and proportions. General features of vertebrae. Characteristic features of cervical, thoracic and lumbar vertebrae."}, "questions": [{"n": "1.1", "q": "Тіло людини складається з семи основних частин: голови, шиї, тулуба, верхніх та нижніх кінцівок. Який варіант вказує латинською послідовно сім частин тіла людини зверху вниз?", "o": ["Caput, collum, truncus, membri superiores et inferiores.", "Caput, thorax, abdomen, membri superiores et inferiores.", "Cranium, thorax, abdomen, membri superiores et inferiores.", "Caput, truncus, membri superiores et inferiores.", "Collum, abdomen, membri superiores et inferiores."], "a": [0], "e": ["Усі сім частин у правильному порядку зверху вниз: голова, шия, тулуб, верхні та нижні кінцівки.", "Thorax (груди) і abdomen (живіт) — це відділи тулуба, а не окремі частини тіла; шию пропущено.", "Cranium — це череп, а не голова; thorax і abdomen — відділи тулуба.", "Пропущено шию (collum), тому частин менше, ніж сім.", "Пропущено голову (caput); abdomen — лише відділ тулуба."], "tr": {"ru": {"q": "Тело человека состоит из семи основных частей: головы, шеи, туловища, верхних и нижних конечностей. Какой вариант указывает на латыни последовательно семь частей тела человека сверху вниз?", "o": ["Caput, collum, truncus, membri superiores et inferiores.", "Caput, thorax, abdomen, membri superiores et inferiores.", "Cranium, thorax, abdomen, membri superiores et inferiores.", "Caput, truncus, membri superiores et inferiores.", "Collum, abdomen, membri superiores et inferiores."], "e": ["Все семь частей в правильном порядке сверху вниз: голова, шея, туловище, верхние и нижние конечности.", "Thorax (грудь) и abdomen (живот) — отделы туловища, а не отдельные части тела; шея пропущена.", "Cranium — это череп, а не голова; thorax и abdomen — отделы туловища.", "Пропущена шея (collum), поэтому частей меньше семи.", "Пропущена голова (caput); abdomen — лишь отдел туловища."]}, "en": {"q": "The human body consists of seven main parts: head, neck, trunk, upper and lower limbs. Which option lists in Latin, in order from top to bottom, the seven parts of the human body?", "o": ["Caput, collum, truncus, membri superiores et inferiores.", "Caput, thorax, abdomen, membri superiores et inferiores.", "Cranium, thorax, abdomen, membri superiores et inferiores.", "Caput, truncus, membri superiores et inferiores.", "Collum, abdomen, membri superiores et inferiores."], "e": ["All seven parts in the correct top-to-bottom order: head, neck, trunk, upper and lower limbs.", "Thorax (chest) and abdomen are regions of the trunk, not separate body parts; the neck is missing.", "Cranium is the skull, not the head; thorax and abdomen are regions of the trunk.", "The neck (collum) is missing, so there are fewer than seven parts.", "The head (caput) is missing; abdomen is only a region of the trunk."]}}}, {"n": "1.2", "q": "Під час падіння на сходах жінка 60 років травмувала нижню кінцівку. Яким терміном анатомічної номенклатури називається латинською мовою вислів «нижній»?", "o": ["Inferior.", "Superior.", "Cranialis.", "Internus.", "Distalis."], "a": [0], "e": ["Inferior — «нижній», протилежний до superior (верхній).", "Superior означає «верхній» — протилежне до потрібного.", "Cranialis — «черепний», тобто напрямок до голови (догори).", "Internus — «внутрішній» (ближче до порожнини), а не нижній.", "Distalis — «дальній» від початку кінцівки або тулуба."], "tr": {"ru": {"q": "При падении на лестнице женщина 60 лет травмировала нижнюю конечность. Каким термином анатомической номенклатуры называется на латыни выражение «нижний»?", "o": ["Inferior.", "Superior.", "Cranialis.", "Internus.", "Distalis."], "e": ["Inferior — «нижний», противоположный superior (верхний).", "Superior означает «верхний» — противоположное нужному.", "Cranialis — «черепной», т.е. направление к голове (вверх).", "Internus — «внутренний» (ближе к полости), а не нижний.", "Distalis — «дистальный», дальний от начала конечности или туловища."]}, "en": {"q": "A 60-year-old woman injured her lower limb falling on the stairs. Which term of anatomical nomenclature is the Latin for 'lower'?", "o": ["Inferior.", "Superior.", "Cranialis.", "Internus.", "Distalis."], "e": ["Inferior means 'lower', the opposite of superior (upper).", "Superior means 'upper' — the opposite of what is asked.", "Cranialis means 'cranial', i.e. towards the head (upwards).", "Internus means 'internal' (closer to a cavity), not lower.", "Distalis means 'distal', farther from the root of a limb or the trunk."]}}}, {"n": "1.3", "q": "У чоловіка 56 років, що хворіє на менінгіт лікар виявив позитивний симптом Керніга: неможливість розігнути нижню кінцівку в колінному суглобі, коли вона зігнута в кульшовому. Навколо якої осі виконує людина такі рухи, як «згинання» та «розгинання»?", "o": ["Axis frontalia.", "Axis sagittalia.", "Axis verticalia.", "Axis verticalia et axis sagittalia.", "Axis frontalia et axis verticalis."], "a": [0], "e": ["Згинання і розгинання виконуються навколо фронтальної осі (axis frontalis), що йде справа наліво.", "Навколо сагітальної осі (спереду назад) виконуються відведення і приведення.", "Навколо вертикальної осі виконується обертання (ротація).", "Вертикальна вісь відповідає за обертання, сагітальна — за відведення; згинання вони не забезпечують.", "Вертикальна вісь потрібна для обертання; правильна лише фронтальна."], "tr": {"ru": {"q": "У мужчины 56 лет, больного менингитом, врач выявил положительный симптом Кернига: невозможность разогнуть нижнюю конечность в коленном суставе, когда она согнута в тазобедренном. Вокруг какой оси человек выполняет такие движения, как «сгибание» и «разгибание»?", "o": ["Axis frontalia.", "Axis sagittalia.", "Axis verticalia.", "Axis verticalia et axis sagittalia.", "Axis frontalia et axis verticalis."], "e": ["Сгибание и разгибание выполняются вокруг фронтальной оси (axis frontalis), идущей справа налево.", "Вокруг сагиттальной оси (спереди назад) выполняются отведение и приведение.", "Вокруг вертикальной оси выполняется вращение (ротация).", "Вертикальная ось отвечает за вращение, сагиттальная — за отведение; сгибание они не обеспечивают.", "Вертикальная ось нужна для вращения; правильна только фронтальная."]}, "en": {"q": "A 56-year-old man with meningitis has a positive Kernig's sign: he cannot extend the lower limb at the knee when it is flexed at the hip. Around which axis are movements such as 'flexion' and 'extension' performed?", "o": ["Axis frontalia.", "Axis sagittalia.", "Axis verticalia.", "Axis verticalia et axis sagittalia.", "Axis frontalia et axis verticalis."], "e": ["Flexion and extension occur around the frontal axis (axis frontalis), running from right to left.", "Around the sagittal axis (front to back) abduction and adduction occur.", "Around the vertical axis rotation occurs.", "The vertical axis is for rotation and the sagittal for abduction; neither gives flexion.", "The vertical axis is for rotation; only the frontal axis is correct."]}}}, {"n": "1.4", "q": "У чоловіка під час дослідження виявлена пухлина правої півкулі великого мозку. Яка площина ділить тіло людини навпіл, на праву і ліву половини?", "o": ["Planum parasagittalia.", "Planum horizontalia.", "Planum frontalia.", "Planum medianum.", "Planum paramedianum."], "a": [3], "e": ["Серединна (медіанна) площина ділить тіло на праву і ліву половини.", "Парасагітальні площини паралельні серединній, але не проходять посередині тіла.", "Горизонтальна площина ділить тіло на верхню і нижню частини.", "Фронтальна площина ділить тіло на передню і задню частини.", "Парамедіанна — це інша назва площини, паралельної до серединної, а не самої середини."], "tr": {"ru": {"q": "У мужчины при обследовании выявлена опухоль правого полушария большого мозга. Какая плоскость делит тело человека пополам, на правую и левую половины?", "o": ["Planum parasagittalia.", "Planum horizontalia.", "Planum frontalia.", "Planum medianum.", "Planum paramedianum."], "e": ["Срединная (медианная) плоскость делит тело на правую и левую половины.", "Парасагиттальные плоскости параллельны срединной, но не проходят посередине тела.", "Горизонтальная плоскость делит тело на верхнюю и нижнюю части.", "Фронтальная плоскость делит тело на переднюю и заднюю части.", "Парамедианная — другое название плоскости, параллельной срединной, а не самой середины."]}, "en": {"q": "A tumour of the right cerebral hemisphere was found in a man. Which plane divides the human body in half into right and left halves?", "o": ["Planum parasagittalia.", "Planum horizontalia.", "Planum frontalia.", "Planum medianum.", "Planum paramedianum."], "e": ["The median plane divides the body into right and left halves.", "Parasagittal planes are parallel to the median plane but do not pass through the middle of the body.", "The horizontal plane divides the body into upper and lower parts.", "The frontal plane divides the body into anterior and posterior parts.", "Paramedian is another name for a plane parallel to the median, not the midline itself."]}}}, {"n": "1.5", "q": "У чоловіка 29 років ушкоджена стінка загальної сонної артерії. Для зупинки кровотечі цю артерію необхідно притиснути до сонного горбка шийного хребця. Який шийний хребець має сонний горбок?", "o": ["I.", "II.", "III.", "IV", "VI."], "a": [4], "e": ["У I шийного хребця (атланта) немає сонного горбка, бо в нього немає тіла.", "У II шийного хребця (осьового) немає сонного горбка.", "У III шийного хребця сонного горбка немає.", "Сонний горбок найвиражений на VI хребці; у IV хребця такого горбка немає.", "Сонний горбок (Chassaignac) — на передньому горбку поперечного відростка VI шийного хребця; до нього притискають сонну артерію."], "tr": {"ru": {"q": "У мужчины 29 лет повреждена стенка общей сонной артерии. Для остановки кровотечения эту артерию необходимо прижать к сонному бугорку шейного позвонка. Какой шейный позвонок имеет сонный бугорок?", "o": ["I.", "II.", "III.", "IV", "VI."], "e": ["У I шейного позвонка (атланта) нет сонного бугорка, так как у него нет тела.", "У II шейного позвонка (осевого) нет сонного бугорка.", "У III шейного позвонка сонного бугорка нет.", "Сонный бугорок наиболее выражен на VI позвонке; у IV позвонка такого бугорка нет.", "Сонный бугорок (Шассеньяка) — на переднем бугорке поперечного отростка VI шейного позвонка; к нему прижимают сонную артерию."]}, "en": {"q": "A 29-year-old man has an injured wall of the common carotid artery. To stop the bleeding, the artery must be pressed against the carotid tubercle of a cervical vertebra. Which cervical vertebra has the carotid tubercle?", "o": ["I.", "II.", "III.", "IV", "VI."], "e": ["The 1st cervical vertebra (atlas) has no carotid tubercle because it has no body.", "The 2nd cervical vertebra (axis) has no carotid tubercle.", "The 3rd cervical vertebra has no carotid tubercle.", "The carotid tubercle is most prominent on C6; C4 has no such tubercle.", "The carotid (Chassaignac's) tubercle is the anterior tubercle of the transverse process of C6; the carotid artery is pressed against it."]}}}, {"n": "1.6", "q": "До лікаря-невролога звернувся чоловік 48 років зі скаргами на біль в шийному відділі хребтового стовпа. Рентгенологічно виявлені метастази в тілах двох верхніх шийних хребців. Тіла яких шийних хребців уражені метастазами?", "o": ["I і II.", "II і III.", "III і IV.", "IV і V.", "IV і VI."], "a": [1], "e": ["У I шийного хребця (атланта) тіла немає, тому «I і II» не можуть бути двома верхніми тілами.", "Тіло є з II хребця (його зуб — це «тіло атланта»), тому два верхніх тіла — II і III.", "Тіла III і IV — не найвищі; вище розташоване тіло II.", "Тіла IV і V розташовані нижче, а не серед двох верхніх.", "Тіла IV і VI не є двома верхніми; до того ж вони не сусідні."], "tr": {"ru": {"q": "К врачу-неврологу обратился мужчина 48 лет с жалобами на боль в шейном отделе позвоночного столба. Рентгенологически выявлены метастазы в телах двух верхних шейных позвонков. Тела каких шейных позвонков поражены метастазами?", "o": ["I и II.", "II и III.", "III и IV.", "IV и V.", "IV и VI."], "e": ["У I шейного позвонка (атланта) тела нет, поэтому «I и II» не могут быть двумя верхними телами.", "Тело есть начиная со II позвонка (его зуб — это «тело атланта»), поэтому два верхних тела — II и III.", "Тела III и IV — не самые верхние; выше расположено тело II.", "Тела IV и V расположены ниже, а не среди двух верхних.", "Тела IV и VI не являются двумя верхними; к тому же они не соседние."]}, "en": {"q": "A 48-year-old man complains of pain in the cervical spine. X-ray shows metastases in the bodies of the two upper cervical vertebrae. The bodies of which cervical vertebrae are affected?", "o": ["I and II.", "II and III.", "III and IV.", "IV and V.", "IV and VI."], "e": ["C1 (atlas) has no body, so 'I and II' cannot be the two upper bodies.", "Bodies start from C2 (its dens is the 'body of the atlas'), so the two upper bodies are C2 and C3.", "C3 and C4 are not the highest; the body of C2 is above them.", "C4 and C5 lie lower, not among the two upper ones.", "C4 and C6 are not the two upper ones and are not even adjacent."]}}}, {"n": "1.7", "q": "У травматологічне відділення лікарні каретою швидкої медичної допомоги доставлено жінку з травмою грудного відділу хребтового стовпа. При рентгенологічному обстеженні виявлено ушкодження відростків V грудного хребця, які розташовані у лобовій площині. Які відростки грудного хребця розташовані у лобовій площині?", "o": ["Processus transversus.", "Processus spinosus.", "Processus transversus et processus spinosus.", "Processus transversus et processus articularis inferior.", "Processus articularis superior et processus articularis inferior."], "a": [4], "e": ["Поперечні відростки грудних хребців спрямовані назовні й дещо назад, а не лежать у лобовій площині як суглобові.", "Остистий відросток спрямований у сагітальній площині.", "Поєднання поперечного й остистого відростків не відповідає лобовій площині.", "Нижній суглобовий відросток правильний, але поперечний відросток у фронтальній площині не лежить.", "Суглобові відростки грудних хребців розташовані у лобовій (фронтальній) площині."], "tr": {"ru": {"q": "В травматологическое отделение больницы каретой скорой помощи доставлена женщина с травмой грудного отдела позвоночного столба. При рентгенологическом обследовании выявлено повреждение отростков V грудного позвонка, которые расположены во фронтальной плоскости. Какие отростки грудного позвонка расположены во фронтальной плоскости?", "o": ["Processus transversus.", "Processus spinosus.", "Processus transversus et processus spinosus.", "Processus transversus et processus articularis inferior.", "Processus articularis superior et processus articularis inferior."], "e": ["Поперечные отростки грудных позвонков направлены кнаружи и несколько назад, а не лежат во фронтальной плоскости, как суставные.", "Остистый отросток направлен в сагиттальной плоскости.", "Сочетание поперечного и остистого отростков не соответствует фронтальной плоскости.", "Нижний суставной отросток верен, но поперечный отросток во фронтальной плоскости не лежит.", "Суставные отростки грудных позвонков расположены во фронтальной плоскости."]}, "en": {"q": "A woman with a thoracic spine injury was brought to the trauma department. X-ray shows damage to the processes of T5 that lie in the frontal plane. Which processes of a thoracic vertebra lie in the frontal plane?", "o": ["Processus transversus.", "Processus spinosus.", "Processus transversus et processus spinosus.", "Processus transversus et processus articularis inferior.", "Processus articularis superior et processus articularis inferior."], "e": ["Transverse processes of thoracic vertebrae point laterally and somewhat backwards; they do not lie in the frontal plane like the articular ones.", "The spinous process lies in the sagittal plane.", "The combination of transverse and spinous processes does not correspond to the frontal plane.", "The inferior articular process is correct, but the transverse process does not lie in the frontal plane.", "The articular processes of thoracic vertebrae lie in the frontal plane."]}}}, {"n": "1.8", "q": "Під час падіння на сходах жінка 69 років травмувала кістки стопи. Яким терміном в анатомічній номенклатурі називається латинською мовою вислів «найвіддаленіший від тулуба»?", "o": ["Inferior.", "Proximlis.", "Cranialis.", "Internus.", "Distalis."], "a": [4], "e": ["Inferior — «нижній», а не «найвіддаленіший від тулуба».", "Proximalis — «ближній» до тулуба, протилежний до дальнього.", "Cranialis — «черепний», у напрямку голови.", "Internus — «внутрішній», стосується положення відносно порожнини.", "Distalis — «дальній», найвіддаленіший від тулуба (стопа дальша за стегно)."], "tr": {"ru": {"q": "При падении на лестнице женщина 69 лет травмировала кости стопы. Каким термином в анатомической номенклатуре называется на латыни выражение «наиболее удалённый от туловища»?", "o": ["Inferior.", "Proximlis.", "Cranialis.", "Internus.", "Distalis."], "e": ["Inferior — «нижний», а не «наиболее удалённый от туловища».", "Proximalis — «проксимальный», ближний к туловищу, противоположный дистальному.", "Cranialis — «черепной», в направлении головы.", "Internus — «внутренний», относится к положению относительно полости.", "Distalis — «дистальный», наиболее удалённый от туловища (стопа дистальнее бедра)."]}, "en": {"q": "A 69-year-old woman injured the bones of her foot falling on the stairs. Which term of anatomical nomenclature is the Latin for 'farthest from the trunk'?", "o": ["Inferior.", "Proximlis.", "Cranialis.", "Internus.", "Distalis."], "e": ["Inferior means 'lower', not 'farthest from the trunk'.", "Proximalis means 'proximal', closer to the trunk — the opposite of distal.", "Cranialis means 'cranial', towards the head.", "Internus means 'internal', relative to a cavity.", "Distalis means 'distal', farthest from the trunk (the foot is distal to the thigh)."]}}}, {"n": "1.9", "q": "Під час тренування баскетболіст 23 років травмував зв’язки, розташовані в порожнині колінного суглоба. Яким терміном в анатомічній номенклатурі називається латинською термін «внутрішній»?", "o": ["Externus.", "Proximlis.", "Cranialis.", "Internus.", "Distalis."], "a": [3], "e": ["Externus — «зовнішній», протилежний до внутрішнього.", "Proximalis — «ближній» до тулуба.", "Cranialis — «черепний», тобто ближчий до голови.", "Internus — «внутрішній», розташований ближче до порожнини (зв'язки всередині суглоба).", "Distalis — «дальній» від тулуба."], "tr": {"ru": {"q": "Во время тренировки баскетболист 23 лет травмировал связки, расположенные в полости коленного сустава. Каким термином в анатомической номенклатуре называется на латыни термин «внутренний»?", "o": ["Externus.", "Proximlis.", "Cranialis.", "Internus.", "Distalis."], "e": ["Externus — «наружный», противоположный внутреннему.", "Proximalis — «проксимальный», ближний к туловищу.", "Cranialis — «черепной», т.е. ближе к голове.", "Internus — «внутренний», расположенный ближе к полости (связки внутри сустава).", "Distalis — «дистальный», дальний от туловища."]}, "en": {"q": "During training a 23-year-old basketball player injured ligaments inside the knee joint cavity. Which term of anatomical nomenclature is the Latin for 'internal'?", "o": ["Externus.", "Proximlis.", "Cranialis.", "Internus.", "Distalis."], "e": ["Externus means 'external', the opposite of internal.", "Proximalis means 'proximal', closer to the trunk.", "Cranialis means 'cranial', closer to the head.", "Internus means 'internal', closer to a cavity (ligaments inside the joint).", "Distalis means 'distal', farther from the trunk."]}}}, {"n": "1.10", "q": "У лікарню госпіталізований чоловік 48 років зі скаргами на біль в шийному відділі хребта. Рентгенологічно виявлено перелом шийного хребця, який має дві дуги – коротку передню дугу, arcus anterior, та довгу задню дугу, arcus posterior, що з’єднані між собою бічними масами. Який шийний хребець ушкоджений?", "o": ["І.", "IІ.", "III.", "VІ.", "VІІ."], "a": [0], "e": ["Атлант (I шийний) не має тіла, а складається з передньої та задньої дуг, з'єднаних бічними масами.", "Осьовий хребець (II) має тіло і зуб, а не передню та задню дуги.", "У III хребця є тіло і розвинений остистий відросток, а дуг атланта немає.", "У VI хребця є тіло та сонний горбок, а передньої дуги немає.", "VII хребець має довгий остистий відросток («виступаючий»), а не дві дуги."], "tr": {"ru": {"q": "В больницу госпитализирован мужчина 48 лет с жалобами на боль в шейном отделе позвоночника. Рентгенологически выявлен перелом шейного позвонка, который имеет две дуги — короткую переднюю дугу, arcus anterior, и длинную заднюю дугу, arcus posterior, соединённые между собой латеральными массами. Какой шейный позвонок повреждён?", "o": ["І.", "IІ.", "III.", "VІ.", "VІІ."], "e": ["Атлант (I шейный) не имеет тела и состоит из передней и задней дуг, соединённых латеральными массами.", "Осевой позвонок (II) имеет тело и зуб, а не переднюю и заднюю дуги.", "У III позвонка есть тело и развитый остистый отросток, а дуг атланта нет.", "У VI позвонка есть тело и сонный бугорок, а передней дуги нет.", "VII позвонок имеет длинный остистый отросток («выступающий»), а не две дуги."]}, "en": {"q": "A 48-year-old man with neck pain was admitted. X-ray shows a fracture of a cervical vertebra that has two arches — a short anterior arch, arcus anterior, and a long posterior arch, arcus posterior, joined by lateral masses. Which cervical vertebra is injured?", "o": ["І.", "IІ.", "III.", "VІ.", "VІІ."], "e": ["The atlas (C1) has no body and consists of anterior and posterior arches joined by lateral masses.", "The axis (C2) has a body and a dens, not anterior and posterior arches.", "C3 has a body and a developed spinous process, not the arches of the atlas.", "C6 has a body and a carotid tubercle, no anterior arch.", "C7 has a long spinous process (vertebra prominens), not two arches."]}}}, {"n": "1.11", "q": "До лікаря-невролога звернувся чоловік 48 років зі скаргами на біль в шийному відділі хребта, запаморочення. Рентгенологічно виявлено метастази в шийному хребці, на поверхні дуги якого є недорозвинений остистий відросток – задній горбок та парна борозна хребтової артерії, sulcus a. vertebralis. Який шийний хребець ушкоджений?", "o": ["І.", "IІ.", "III.", "VІ.", "VІІ."], "a": [0], "e": ["На задній дузі атланта є задній горбок (замість остистого відростка) та борозна хребтової артерії.", "У II хребця є зуб і добре розвинений роздвоєний остистий відросток.", "У III хребця є тіло і короткий роздвоєний остистий відросток.", "У VI хребця є тіло та сонний горбок, остистий відросток розвинений.", "VII хребець має довгий нероздвоєний остистий відросток."], "tr": {"ru": {"q": "К врачу-неврологу обратился мужчина 48 лет с жалобами на боль в шейном отделе позвоночника, головокружение. Рентгенологически выявлены метастазы в шейном позвонке, на поверхности дуги которого есть недоразвитый остистый отросток — задний бугорок и парная борозда позвоночной артерии, sulcus a. vertebralis. Какой шейный позвонок повреждён?", "o": ["І.", "IІ.", "III.", "VІ.", "VІІ."], "e": ["На задней дуге атланта есть задний бугорок (вместо остистого отростка) и борозда позвоночной артерии.", "У II позвонка есть зуб и хорошо развитый раздвоенный остистый отросток.", "У III позвонка есть тело и короткий раздвоенный остистый отросток.", "У VI позвонка есть тело и сонный бугорок, остистый отросток развит.", "VII позвонок имеет длинный нераздвоенный остистый отросток."]}, "en": {"q": "A 48-year-old man complains of neck pain and dizziness. X-ray shows metastases in a cervical vertebra whose arch bears a rudimentary spinous process — the posterior tubercle — and a paired groove for the vertebral artery, sulcus a. vertebralis. Which cervical vertebra is affected?", "o": ["І.", "IІ.", "III.", "VІ.", "VІІ."], "e": ["The posterior arch of the atlas has a posterior tubercle (instead of a spinous process) and a groove for the vertebral artery.", "C2 has a dens and a well-developed bifid spinous process.", "C3 has a body and a short bifid spinous process.", "C6 has a body and a carotid tubercle; its spinous process is developed.", "C7 has a long non-bifid spinous process."]}}}, {"n": "1.12", "q": "У травматологічне відділення каретою швидкої медичної допомоги доставлено жінку 30 років з травмою хребтового стовпа. При рентгенологічному обстеженні виявлено ушкодження хребця: остистий відросток у нього найдовший, потовщений та нероздвоєний; відсутні передній та задній горбки на поперечних відростках; відсутній поперечний отвір на поперечному відростку. Який хребець ушкоджений?", "o": ["І.", "IІ.", "III.", "IV.", "VІІ."], "a": [4], "e": ["Хребець з найдовшим, потовщеним нероздвоєним остистим відростком — VII шийний (vertebra prominens); його поперечний отвір малий, а горбки слабко виражені.", "Атлант не має остистого відростка взагалі.", "Осьовий хребець має роздвоєний остистий відросток і зуб.", "У III хребця остистий відросток короткий і роздвоєний.", "У IV хребця остистий відросток короткий і роздвоєний; найдовший — у VII."], "tr": {"ru": {"q": "В травматологическое отделение каретой скорой помощи доставлена женщина 30 лет с травмой позвоночного столба. При рентгенологическом обследовании выявлено повреждение позвонка: остистый отросток у него самый длинный, утолщённый и нераздвоенный; отсутствуют передний и задний бугорки на поперечных отростках; отсутствует поперечное отверстие на поперечном отростке. Какой позвонок повреждён?", "o": ["І.", "IІ.", "III.", "IV.", "VІІ."], "e": ["Позвонок с самым длинным, утолщённым нераздвоенным остистым отростком — VII шейный (vertebra prominens); его поперечное отверстие малое, а бугорки слабо выражены.", "Атлант вообще не имеет остистого отростка.", "Осевой позвонок имеет раздвоенный остистый отросток и зуб.", "У III позвонка остистый отросток короткий и раздвоенный.", "У IV позвонка остистый отросток короткий и раздвоенный; самый длинный — у VII."]}, "en": {"q": "A 30-year-old woman with a spinal injury was brought by ambulance. X-ray shows damage to a vertebra whose spinous process is the longest, thickened and non-bifid; the transverse processes lack anterior and posterior tubercles; there is no transverse foramen. Which vertebra is injured?", "o": ["І.", "IІ.", "III.", "IV.", "VІІ."], "e": ["The vertebra with the longest, thickened, non-bifid spinous process is C7 (vertebra prominens); its transverse foramen is small and its tubercles are weak.", "The atlas has no spinous process at all.", "The axis has a bifid spinous process and a dens.", "C3 has a short bifid spinous process.", "C4 has a short bifid spinous process; the longest belongs to C7."]}}}, {"n": "1.13", "q": "Під час МРТ-обстеження пацієнта лікар у гіпофізі виділяє дві частки – lobus anterior et lobus posterior. Які площини використовує лікар для визначення анатомічних термінів «anterior» і «posterior»?", "o": ["Plana sagittalia.", "Planum coronalia.", "Plana horisontalia.", "Plana transversa.", "Planum paramedianum."], "a": [1], "e": ["Сагітальні площини ділять тіло на праву і ліву частини, а не на передню і задню.", "Термін «anterior/posterior» (передній/задній) визначають відносно фронтальної (лобової) площини.", "Горизонтальна площина визначає терміни «верхній» і «нижній».", "Поперечна (горизонтальна) площина визначає верхній/нижній, а не передній/задній.", "Парамедіанна площина — це сагітальна площина поруч із серединною."], "tr": {"ru": {"q": "Во время МРТ-обследования пациента врач в гипофизе выделяет две доли — lobus anterior et lobus posterior. Какие плоскости использует врач для определения анатомических терминов «anterior» и «posterior»?", "o": ["Plana sagittalia.", "Planum coronalia.", "Plana horisontalia.", "Plana transversa.", "Planum paramedianum."], "e": ["Сагиттальные плоскости делят тело на правую и левую части, а не на переднюю и заднюю.", "Термины «anterior/posterior» (передний/задний) определяют относительно фронтальной плоскости.", "Горизонтальная плоскость определяет термины «верхний» и «нижний».", "Поперечная (горизонтальная) плоскость определяет верхний/нижний, а не передний/задний.", "Парамедианная плоскость — сагиттальная плоскость рядом со срединной."]}, "en": {"q": "On MRI the doctor distinguishes two lobes of the pituitary gland — lobus anterior et lobus posterior. Which planes are used to define the anatomical terms 'anterior' and 'posterior'?", "o": ["Plana sagittalia.", "Planum coronalia.", "Plana horisontalia.", "Plana transversa.", "Planum paramedianum."], "e": ["Sagittal planes divide the body into right and left parts, not anterior and posterior.", "'Anterior/posterior' are defined relative to the frontal (coronal) plane.", "The horizontal plane defines 'superior' and 'inferior'.", "The transverse (horizontal) plane defines superior/inferior, not anterior/posterior.", "The paramedian plane is a sagittal plane next to the median one."]}}}, {"n": "1.14", "q": "Чоловік 60 років після травми плечового суглоба не може виконати відведення верхньої кінцівки від тулуба. Навколо якої осі виконує людина такі рухи, як відведення (abductio) і приведення (adductio)?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium."], "a": [1], "e": ["Навколо фронтальної осі відбувається згинання та розгинання.", "Відведення (abductio) і приведення (adductio) виконуються навколо сагітальної осі, що йде спереду назад.", "Навколо вертикальної осі виконується обертання.", "Поперечна вісь у номенклатурі прирівнюється до фронтальної й відповідає за згинання/розгинання.", "Корональна вісь — інша назва фронтальної; вона для згинання і розгинання."], "tr": {"ru": {"q": "Мужчина 60 лет после травмы плечевого сустава не может выполнить отведение верхней конечности от туловища. Вокруг какой оси человек выполняет такие движения, как отведение (abductio) и приведение (adductio)?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium."], "e": ["Вокруг фронтальной оси происходит сгибание и разгибание.", "Отведение (abductio) и приведение (adductio) выполняются вокруг сагиттальной оси, идущей спереди назад.", "Вокруг вертикальной оси выполняется вращение.", "Поперечная ось в номенклатуре приравнивается к фронтальной и отвечает за сгибание/разгибание.", "Корональная ось — другое название фронтальной; она для сгибания и разгибания."]}, "en": {"q": "After a shoulder injury a 60-year-old man cannot abduct the upper limb from the trunk. Around which axis are movements such as abduction (abductio) and adduction (adductio) performed?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium."], "e": ["Flexion and extension occur around the frontal axis.", "Abduction and adduction occur around the sagittal axis, which runs from front to back.", "Rotation occurs around the vertical axis.", "The transverse axis is equated with the frontal one and gives flexion/extension.", "The coronal axis is another name for the frontal axis; it is for flexion and extension."]}}}, {"n": "1.15", "q": "У чоловіка 48 років, хворого на остеопороз, лікар підозрює наявність стиснення стінки правої хребтової артерії, що проходить через поперечні отвори в поперечних відростках шийних хребців. Для підтвердження діагнозу лікар запропонував зробити хворому рентгенографію тих хребців, в яких проходить хребтова артерія. В якому шийному хребці через поперечний отвір на поперечних відростках шийних хребців проходить тільки вена?", "o": ["I.", "II.", "III.", "VI.", "VII."], "a": [4], "e": ["В отворі поперечного відростка I хребця (атланта) проходить хребтова артерія з веною.", "У II хребці через поперечний отвір проходить хребтова артерія.", "У III хребці в отворі проходять артерія і вена.", "У VI хребці через отвір проходить хребтова артерія (артерія входить саме в нього).", "У VII хребці поперечний отвір малий: через нього проходить лише хребтова вена, а артерія — вище."], "tr": {"ru": {"q": "У мужчины 48 лет, больного остеопорозом, врач подозревает сдавление стенки правой позвоночной артерии, проходящей через поперечные отверстия в поперечных отростках шейных позвонков. Для подтверждения диагноза врач предложил сделать рентгенографию тех позвонков, в которых проходит позвоночная артерия. В каком шейном позвонке через поперечное отверстие проходит только вена?", "o": ["I.", "II.", "III.", "VI.", "VII."], "e": ["В отверстии поперечного отростка I позвонка (атланта) проходит позвоночная артерия с веной.", "Во II позвонке через поперечное отверстие проходит позвоночная артерия.", "В III позвонке в отверстии проходят артерия и вена.", "В VI позвонке через отверстие проходит позвоночная артерия (артерия входит именно в него).", "В VII позвонке поперечное отверстие малое: через него проходит только позвоночная вена, а артерия — выше."]}, "en": {"q": "In a 48-year-old man with osteoporosis the doctor suspects compression of the right vertebral artery, which passes through the transverse foramina of cervical vertebrae. Through the transverse foramen of which cervical vertebra does only a vein pass?", "o": ["I.", "II.", "III.", "VI.", "VII."], "e": ["The transverse foramen of C1 (atlas) transmits the vertebral artery and vein.", "In C2 the vertebral artery passes through the transverse foramen.", "In C3 both artery and vein pass through the foramen.", "In C6 the vertebral artery passes (the artery enters precisely here).", "C7 has a small transverse foramen: only the vertebral vein passes through it; the artery enters higher."]}}}, {"n": "1.16", "q": "Каретою швидкої медичної допомоги доставлено в лікарню жінку 47 років з травмою грудного відділу хребта. Під час рентгенологічного обстеження у хворого виявлено компресійний перелом грудного хребця, який має лише одну верхню пів’ямку для головки ребра. Тіло якого грудного хребця має лише одну верхню пів`ямку?", "o": ["I.", "II.", "X.", "XI.", "XII."], "a": [2], "e": ["I грудний хребець має цілу верхню ямку і нижню пів'ямку.", "II грудний хребець має верхню та нижню пів'ямки.", "X грудний хребець має лише верхню пів'ямку на тілі.", "XI грудний хребець має цілу ямку на тілі, а не пів'ямку.", "XII грудний хребець має цілу ямку на тілі."], "tr": {"ru": {"q": "Каретой скорой помощи доставлена в больницу женщина 47 лет с травмой грудного отдела позвоночника. При рентгенологическом обследовании выявлен компрессионный перелом грудного позвонка, который имеет лишь одну верхнюю полуямку для головки ребра. Тело какого грудного позвонка имеет лишь одну верхнюю полуямку?", "o": ["I.", "II.", "X.", "XI.", "XII."], "e": ["I грудной позвонок имеет целую верхнюю ямку и нижнюю полуямку.", "II грудной позвонок имеет верхнюю и нижнюю полуямки.", "X грудной позвонок имеет только верхнюю полуямку на теле.", "XI грудной позвонок имеет целую ямку на теле, а не полуямку.", "XII грудной позвонок имеет целую ямку на теле."]}, "en": {"q": "A 47-year-old woman with a thoracic spine injury was admitted. X-ray shows a compression fracture of a thoracic vertebra that has only one superior demifacet for a rib head. The body of which thoracic vertebra has only a superior demifacet?", "o": ["I.", "II.", "X.", "XI.", "XII."], "e": ["T1 has a complete superior facet and an inferior demifacet.", "T2 has superior and inferior demifacets.", "T10 has only a superior demifacet on its body.", "T11 has a complete facet on its body, not a demifacet.", "T12 has a complete facet on its body."]}}}, {"n": "1.17", "q": "Жінку 50 років госпіталізовано з травмою хребтового стовпа. Під час рентгенологічного обстеження виявлено компресійний перелом хребців, поперечні відростки яких розташовані у лобовій площині, біля їх основи є додатковий відросток. Остисті відростки короткі, плоскі, їх кінці стовщені, спрямовані назад. Суглобові поверхні на суглобових відростках розташовані у стріловій площині, мають соскоподібний відросток. Хребці якого відділу хребтового стовпа ушкоджені?", "o": ["С I – С II.", "С III – С VI.", "T VII – T X.", "T XI – T XII.", "L I – L V."], "a": [4], "e": ["С I–II — атлант та осьовий хребець мають особливу будову, без таких відростків.", "С III–VI — шийні хребці з поперечними отворами та роздвоєними остистими відростками.", "T VII–X — грудні хребці з суглобовими відростками у фронтальній площині та ребровими ямками.", "T XI–XII — перехідні хребці з цілими ямками й початком додаткових відростків, але суглобові поверхні ще не сагітальні.", "Поперекові хребці: поперечні відростки у фронтальній площині, додатковий відросток, суглобові поверхні у сагітальній площині, соскоподібний відросток."], "tr": {"ru": {"q": "Женщина 50 лет госпитализирована с травмой позвоночного столба. При рентгенологическом обследовании выявлен компрессионный перелом позвонков, поперечные отростки которых расположены во фронтальной плоскости, у их основания есть добавочный отросток. Остистые отростки короткие, плоские, их концы утолщены, направлены назад. Суставные поверхности на суставных отростках расположены в сагиттальной плоскости, имеют сосцевидный отросток. Позвонки какого отдела позвоночного столба повреждены?", "o": ["С I – С II.", "С III – С VI.", "T VII – T X.", "T XI – T XII.", "L I – L V."], "e": ["C I–II — атлант и осевой позвонок имеют особое строение, без таких отростков.", "C III–VI — шейные позвонки с поперечными отверстиями и раздвоенными остистыми отростками.", "T VII–X — грудные позвонки с суставными отростками во фронтальной плоскости и рёберными ямками.", "T XI–XII — переходные позвонки с целыми ямками и началом добавочных отростков, но суставные поверхности ещё не сагиттальные.", "Поясничные позвонки: поперечные отростки во фронтальной плоскости, добавочный отросток, суставные поверхности в сагиттальной плоскости, сосцевидный отросток."]}, "en": {"q": "A 50-year-old woman with a spinal injury was admitted. X-ray shows compression fractures of vertebrae whose transverse processes lie in the frontal plane with an accessory process at their base. The spinous processes are short, flat, thickened at the ends and directed backwards. The articular surfaces lie in the sagittal plane and bear a mammillary process. Which region of the spine is injured?", "o": ["С I – С II.", "С III – С VI.", "T VII – T X.", "T XI – T XII.", "L I – L V."], "e": ["C1–C2 — the atlas and axis have a special structure without such processes.", "C3–C6 — cervical vertebrae with transverse foramina and bifid spinous processes.", "T7–T10 — thoracic vertebrae with articular processes in the frontal plane and costal facets.", "T11–T12 — transitional vertebrae with complete facets and early accessory processes, but their articular surfaces are not yet sagittal.", "Lumbar vertebrae: transverse processes in the frontal plane, accessory process, articular surfaces in the sagittal plane, mammillary process."]}}}, {"n": "1.18", "q": "Чоловік 60 років після отриманої травми плечового суглоба не може виконати обертання верхньої кінцівки у плечовому суглобі. Навколо якої осі виконує людина такі рухи, як обертання «rotation»?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium."], "a": [2], "e": ["Навколо фронтальної осі відбуваються згинання та розгинання.", "Навколо сагітальної осі — відведення і приведення.", "Обертання (rotatio) виконується навколо вертикальної осі.", "Поперечна вісь відповідає фронтальній і дає згинання/розгинання.", "Корональна — інша назва фронтальної осі; обертання вона не забезпечує."], "tr": {"ru": {"q": "Мужчина 60 лет после полученной травмы плечевого сустава не может выполнить вращение верхней конечности в плечевом суставе. Вокруг какой оси человек выполняет такие движения, как вращение «rotation»?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium."], "e": ["Вокруг фронтальной оси происходят сгибание и разгибание.", "Вокруг сагиттальной оси — отведение и приведение.", "Вращение (rotatio) выполняется вокруг вертикальной оси.", "Поперечная ось соответствует фронтальной и даёт сгибание/разгибание.", "Корональная — другое название фронтальной оси; вращение она не обеспечивает."]}, "en": {"q": "After a shoulder injury a 60-year-old man cannot rotate the upper limb at the shoulder joint. Around which axis are movements such as 'rotation' performed?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium."], "e": ["Flexion and extension occur around the frontal axis.", "Abduction and adduction occur around the sagittal axis.", "Rotation occurs around the vertical axis.", "The transverse axis corresponds to the frontal one and gives flexion/extension.", "Coronal is another name for the frontal axis; it does not provide rotation."]}}}, {"n": "1.19", "q": "У чоловіка 35 років після падіння лікар запідозрив перелом тіла грудного хребця, на тілі якого наявна ціла ямка для головки ребра та пів’ямка для головки наступного ребра. На тілі якого хребця на рентгенограмі лікар виявив характерні для хребця ознаки?", "o": ["T I.", "T II.", "T III.", "T VI.", "T VII."], "a": [0], "e": ["T I має цілу верхню ямку на тілі та нижню пів'ямку для II ребра.", "T II має верхню й нижню пів'ямки, цілої ямки на тілі немає.", "T III має верхню та нижню пів'ямки.", "T VI має верхню та нижню пів'ямки.", "T VII має верхню та нижню пів'ямки."], "tr": {"ru": {"q": "У мужчины 35 лет после падения врач заподозрил перелом тела грудного позвонка, на теле которого имеется целая ямка для головки ребра и полуямка для головки следующего ребра. На теле какого позвонка на рентгенограмме врач выявил характерные для позвонка признаки?", "o": ["T I.", "T II.", "T III.", "T VI.", "T VII."], "e": ["T I имеет целую верхнюю ямку на теле и нижнюю полуямку для II ребра.", "T II имеет верхнюю и нижнюю полуямки, целой ямки на теле нет.", "T III имеет верхнюю и нижнюю полуямки.", "T VI имеет верхнюю и нижнюю полуямки.", "T VII имеет верхнюю и нижнюю полуямки."]}, "en": {"q": "After a fall, a doctor suspects a fracture of a thoracic vertebral body that has a complete facet for a rib head and a demifacet for the head of the next rib. On the body of which vertebra did the doctor see these features on X-ray?", "o": ["T I.", "T II.", "T III.", "T VI.", "T VII."], "e": ["T1 has a complete superior facet on its body and an inferior demifacet for rib II.", "T2 has superior and inferior demifacets, no complete facet.", "T3 has superior and inferior demifacets.", "T6 has superior and inferior demifacets.", "T7 has superior and inferior demifacets."]}}}, {"n": "1.20", "q": "Каретою швидкої медичної допомоги в травматологічне відділення лікарні госпіталізовано жінку 47 років з травмою грудного відділу хребта. Під час рентгенологічного обстеження виявлено компресійний перелом грудного хребця, на тілі якого розташована тільки ціла ямка для головки ребра. Тіло якого грудного хребця має такі особливості?", "o": ["I.", "II.", "VI.", "X.", "XII."], "a": [4], "e": ["I хребець має цілу ямку і пів'ямку.", "II хребець має дві пів'ямки (верхню та нижню).", "VI хребець має дві пів'ямки.", "X хребець має лише верхню пів'ямку, а не цілу ямку.", "XII грудний хребець має лише цілу ямку для головки ребра."], "tr": {"ru": {"q": "Каретой скорой помощи в травматологическое отделение больницы госпитализирована женщина 47 лет с травмой грудного отдела позвоночника. При рентгенологическом обследовании выявлен компрессионный перелом грудного позвонка, на теле которого расположена только целая ямка для головки ребра. Тело какого грудного позвонка имеет такие особенности?", "o": ["I.", "II.", "VI.", "X.", "XII."], "e": ["I позвонок имеет целую ямку и полуямку.", "II позвонок имеет две полуямки (верхнюю и нижнюю).", "VI позвонок имеет две полуямки.", "X позвонок имеет только верхнюю полуямку, а не целую ямку.", "XII грудной позвонок имеет только целую ямку для головки ребра."]}, "en": {"q": "A 47-year-old woman with a thoracic spine injury was admitted. X-ray shows a compression fracture of a thoracic vertebra whose body has only one complete facet for a rib head. Which thoracic vertebra has these features?", "o": ["I.", "II.", "VI.", "X.", "XII."], "e": ["T1 has a complete facet and a demifacet.", "T2 has two demifacets (superior and inferior).", "T6 has two demifacets.", "T10 has only a superior demifacet, not a complete facet.", "T12 has only one complete facet for a rib head."]}}}, {"n": "1.21", "q": "У жінки 27 років травма поперекового відділу хребтового стовпа. Рентгенологічно виявлено перелом соскоподібного відростка другого поперекового хребця. На яких відростках ушкодженого хребця розміщені соскоподібні відростки?", "o": ["Processus costalis.", "Processus spinosus.", "Processus articularis inferior.", "Processus articularis superior.", "Processus articularis superior et processus articularis inferior."], "a": [3], "e": ["Реброві відростки — це зачатки ребер поперекових хребців, соскоподібних відростків на них немає.", "Остистий відросток спрямований назад; соскоподібного на ньому нема.", "На нижніх суглобових відростках соскоподібних виступів немає.", "Соскоподібні відростки (processus mammillares) розташовані на верхніх суглобових відростках поперекових хребців.", "Соскоподібні є лише на верхніх суглобових відростках, а не на обох."], "tr": {"ru": {"q": "У женщины 27 лет травма поясничного отдела позвоночного столба. Рентгенологически выявлен перелом сосцевидного отростка второго поясничного позвонка. На каких отростках повреждённого позвонка расположены сосцевидные отростки?", "o": ["Processus costalis.", "Processus spinosus.", "Processus articularis inferior.", "Processus articularis superior.", "Processus articularis superior et processus articularis inferior."], "e": ["Рёберные отростки — зачатки рёбер поясничных позвонков, сосцевидных отростков на них нет.", "Остистый отросток направлен назад; сосцевидного на нём нет.", "На нижних суставных отростках сосцевидных выступов нет.", "Сосцевидные отростки (processus mammillares) расположены на верхних суставных отростках поясничных позвонков.", "Сосцевидные есть только на верхних суставных отростках, а не на обоих."]}, "en": {"q": "A 27-year-old woman has a lumbar spine injury. X-ray shows a fracture of the mammillary process of L2. On which processes of this vertebra are the mammillary processes located?", "o": ["Processus costalis.", "Processus spinosus.", "Processus articularis inferior.", "Processus articularis superior.", "Processus articularis superior et processus articularis inferior."], "e": ["Costal processes are rudimentary ribs of lumbar vertebrae; they bear no mammillary processes.", "The spinous process points backwards; there is no mammillary process on it.", "There are no mammillary projections on the inferior articular processes.", "Mammillary processes (processus mammillares) lie on the superior articular processes of lumbar vertebrae.", "Mammillary processes are only on the superior articular processes, not on both."]}}}, {"n": "1.22", "q": "До лікаря звернувся чоловік 35 років зі скаргою на те, що ліве око не рухається присередньо. Як латиною позначається термін «присередній» – ближчий до серединної стрілової полощини?", "o": ["Proximalis.", "Distalis.", "Anterior.", "Lateralis.", "Medialis."], "a": [4], "e": ["Proximalis — «ближній» (до початку кінцівки).", "Distalis — «дальній» від початку кінцівки.", "Anterior — «передній».", "Lateralis — «бічний», тобто далі від серединної площини.", "Medialis — «присередній», ближчий до серединної площини."], "tr": {"ru": {"q": "К врачу обратился мужчина 35 лет с жалобой на то, что левый глаз не двигается медиально. Как на латыни обозначается термин «медиальный» — ближе к срединной сагиттальной плоскости?", "o": ["Proximalis.", "Distalis.", "Anterior.", "Lateralis.", "Medialis."], "e": ["Proximalis — «проксимальный» (ближе к началу конечности).", "Distalis — «дистальный», дальний от начала конечности.", "Anterior — «передний».", "Lateralis — «латеральный», т.е. дальше от срединной плоскости.", "Medialis — «медиальный», ближе к срединной плоскости."]}, "en": {"q": "A 35-year-old man complains that his left eye does not move medially. What is the Latin for 'medial' — closer to the median sagittal plane?", "o": ["Proximalis.", "Distalis.", "Anterior.", "Lateralis.", "Medialis."], "e": ["Proximalis means 'proximal' (closer to the root of a limb).", "Distalis means 'distal', farther from the root of a limb.", "Anterior means 'front'.", "Lateralis means 'lateral', i.e. farther from the median plane.", "Medialis means 'medial', closer to the median plane."]}}}, {"n": "1.23", "q": "У чоловіка 35 років діагностовано параліч лівої половини тіла, парез м’язів язика, лиця (контрактура Верніке – Манна). При цьому вогнище ураження розташоване у хворого в правій півкулі великого мозку. Відносно якої площини для позначення розташування органів застосовують терміни «лівий» і «правий»?", "o": ["Plana sagittalia.", "Plana frontalia.", "Plana horisontalia", "Plana transversalia.", "Plana paramediana."], "a": [0], "e": ["Терміни «лівий» і «правий» визначають відносно сагітальної площини.", "Фронтальна площина відповідає за «передній/задній».", "Горизонтальна площина — за «верхній/нижній».", "Поперечна (горизонтальна) площина — за «верхній/нижній».", "Парамедіанні площини — це сагітальні площини поруч із серединою, але термін не такий."], "tr": {"ru": {"q": "У мужчины 35 лет диагностирован паралич левой половины тела, парез мышц языка, лица (контрактура Вернике — Манна). При этом очаг поражения расположен у больного в правом полушарии большого мозга. Относительно какой плоскости для обозначения расположения органов применяют термины «левый» и «правый»?", "o": ["Plana sagittalia.", "Plana frontalia.", "Plana horisontalia", "Plana transversalia.", "Plana paramediana."], "e": ["Термины «левый» и «правый» определяют относительно сагиттальной плоскости.", "Фронтальная плоскость отвечает за «передний/задний».", "Горизонтальная плоскость — за «верхний/нижний».", "Поперечная (горизонтальная) плоскость — за «верхний/нижний».", "Парамедианные плоскости — сагиттальные плоскости рядом с серединой, но термин не тот."]}, "en": {"q": "A 35-year-old man has paralysis of the left half of the body and paresis of tongue and facial muscles (Wernicke–Mann contracture); the lesion is in the right cerebral hemisphere. Relative to which plane are the terms 'left' and 'right' used?", "o": ["Plana sagittalia.", "Plana frontalia.", "Plana horisontalia", "Plana transversalia.", "Plana paramediana."], "e": ["'Left' and 'right' are defined relative to the sagittal plane.", "The frontal plane defines 'anterior/posterior'.", "The horizontal plane defines 'superior/inferior'.", "The transverse (horizontal) plane defines 'superior/inferior'.", "Paramedian planes are sagittal planes near the midline, but this is not the term used."]}}}, {"n": "1.24", "q": "Жінка 25 років упала і зламала променеву кістку передпліччя в «типовому» місці. Характерною ознакою травми є неможливість виконувати обертання (rotatio). Навколо якої осі людина виконує такі рухи як обертання «rotation»?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium"], "a": [2], "e": ["Навколо фронтальної осі — згинання/розгинання.", "Навколо сагітальної осі — відведення/приведення.", "Обертання (rotatio) виконується навколо вертикальної осі.", "Поперечна вісь — згинання/розгинання.", "Корональна вісь — інша назва фронтальної."], "tr": {"ru": {"q": "Женщина 25 лет упала и сломала лучевую кость предплечья в «типичном» месте. Характерным признаком травмы является невозможность выполнять вращение (rotatio). Вокруг какой оси человек выполняет такие движения, как вращение «rotation»?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium"], "e": ["Вокруг фронтальной оси — сгибание/разгибание.", "Вокруг сагиттальной оси — отведение/приведение.", "Вращение (rotatio) выполняется вокруг вертикальной оси.", "Поперечная ось — сгибание/разгибание.", "Корональная ось — другое название фронтальной."]}, "en": {"q": "A 25-year-old woman fell and broke her radius in the 'typical' place. A characteristic sign is inability to rotate (rotatio). Around which axis is 'rotation' performed?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium"], "e": ["Around the frontal axis — flexion/extension.", "Around the sagittal axis — abduction/adduction.", "Rotation occurs around the vertical axis.", "The transverse axis gives flexion/extension.", "Coronal is another name for the frontal axis."]}}}, {"n": "1.25", "q": "Чоловік 28 років упав і травмував грудний відділ хребтового стовпа. Рентгенологічно діагностовано перелом грудних хребців, на тілах яких розташовані цілі ямки для головок ребер, а на поперечних відростках відсутні реброві ямки. Які грудні хребці ушкоджені?", "o": ["I–II.", "III–IV.", "VI–VIII.", "IX– X.", "XI–XII."], "a": [4], "e": ["I–II хребці мають особливу будову: атлант не має тіла.", "III–IV хребці — шийні, з поперечними отворами.", "У VI–VIII грудних хребців на тілах є по дві пів'ямки (верхня й нижня), а не цілі ямки.", "IX–X хребці: IX має пів'ямки, X лише верхню пів'ямку.", "XI–XII грудні хребці мають цілі ямки на тілах і не мають ребрових ямок на поперечних відростках."], "tr": {"ru": {"q": "Мужчина 28 лет упал и травмировал грудной отдел позвоночного столба. Рентгенологически диагностирован перелом грудных позвонков, на телах которых расположены целые ямки для головок рёбер, а на поперечных отростках отсутствуют рёберные ямки. Какие грудные позвонки повреждены?", "o": ["I–II.", "III–IV.", "VI–VIII.", "IX– X.", "XI–XII."], "e": ["I–II позвонки имеют особое строение: атлант не имеет тела.", "III–IV позвонки — шейные, с поперечными отверстиями.", "У VI–VIII грудных позвонков на телах по две полуямки (верхняя и нижняя), а не целые ямки.", "IX–X позвонки: IX имеет полуямки, X только верхнюю полуямку.", "XI–XII грудные позвонки имеют целые ямки на телах и не имеют рёберных ямок на поперечных отростках."]}, "en": {"q": "A 28-year-old man fell and injured his thoracic spine. X-ray shows fractures of thoracic vertebrae whose bodies have complete facets for rib heads and whose transverse processes lack costal facets. Which thoracic vertebrae are injured?", "o": ["I–II.", "III–IV.", "VI–VIII.", "IX–X.", "XI–XII."], "e": ["T1–T2: T1 has a complete facet and a demifacet, T2 two demifacets; both have costal facets on transverse processes.", "T3–T4 have two demifacets each and costal facets on transverse processes.", "T6–T8 have two demifacets (superior and inferior) on their bodies, not complete facets.", "T9–T10: T9 has demifacets, T10 only a superior demifacet.", "T11–T12 have complete facets on their bodies and no costal facets on transverse processes."]}}}, {"n": "1.26", "q": "Чоловік 35 років при падінні травмував шийний відділ хребта. Рентгенологічно виявлено перелом остистих відростків трьох верхніх шийних хребців. Остисті відростки яких шийних хребців ушкоджені?", "o": ["I, ІІ, ІІІ.", "II, ІІІ, IV.", "I, ІІІ, IV.", "І, ІІ, IV.", "ІІІ, ІV, V."], "a": [1], "e": ["Атлант (I) не має остистого відростка, тому в цій групі він зайвий.", "Остисті відростки II, III, IV хребців — роздвоєні й короткі; атланта в групі немає.", "У групі є атлант, який остистого відростка не має.", "У групі є атлант, а в переліку відсутній II хребець.", "III–V — не три верхні остисті відростки: пропущено II хребець, який є першим з роздвоєним остистим відростком."], "tr": {"ru": {"q": "Мужчина 35 лет при падении травмировал шейный отдел позвоночника. Рентгенологически выявлен перелом остистых отростков трёх верхних шейных позвонков. Остистые отростки каких шейных позвонков повреждены?", "o": ["I, ІІ, ІІІ.", "II, ІІІ, IV.", "I, ІІІ, IV.", "І, ІІ, IV.", "ІІІ, ІV, V."], "e": ["Атлант (I) не имеет остистого отростка, поэтому в этой группе он лишний.", "Остистые отростки II, III, IV позвонков — раздвоенные и короткие; атланта в группе нет.", "В группе есть атлант, у которого нет остистого отростка.", "В группе есть атлант, а в перечне отсутствует II позвонок.", "III–V — не три верхних остистых отростка: пропущен II позвонок, первый с раздвоенным остистым отростком."]}, "en": {"q": "A 35-year-old man injured his cervical spine in a fall. X-ray shows fractures of the spinous processes of the three upper cervical vertebrae. Which vertebrae have the injured spinous processes?", "o": ["I, II, III.", "II, III, IV.", "I, III, IV.", "I, II, IV.", "III, IV, V."], "e": ["The atlas (C1) has no spinous process, so it does not belong here.", "The spinous processes of C2, C3, C4 are bifid and short; the atlas is not in the group.", "The group includes the atlas, which has no spinous process.", "The group includes the atlas, and C2 is missing.", "C3–C5 are not the three upper spinous processes: C2, the first with a bifid spinous process, is missing."]}}}, {"n": "1.27", "q": "Чоловік 30 років травмував шийний відділ хребтового стовпа. Рентгенологічно діагностовано перелом хребця, на дузі якого відсутній остистий відросток. Який шийний хребець ушкоджено?", "o": ["I.", "II.", "III.", "VI.", "VII."], "a": [0], "e": ["Атлант (I шийний хребець) не має остистого відростка — замість нього задній горбок.", "У II хребця є розвинений роздвоєний остистий відросток.", "У III хребця є короткий роздвоєний остистий відросток.", "У VI хребця є короткий роздвоєний остистий відросток.", "У VII хребця найдовший нероздвоєний остистий відросток."], "tr": {"ru": {"q": "Мужчина 30 лет травмировал шейный отдел позвоночного столба. Рентгенологически диагностирован перелом позвонка, на дуге которого отсутствует остистый отросток. Какой шейный позвонок повреждён?", "o": ["I.", "II.", "III.", "VI.", "VII."], "e": ["Атлант (I шейный позвонок) не имеет остистого отростка — вместо него задний бугорок.", "У II позвонка есть развитый раздвоенный остистый отросток.", "У III позвонка есть короткий раздвоенный остистый отросток.", "У VI позвонка есть короткий раздвоенный остистый отросток.", "У VII позвонка самый длинный нераздвоенный остистый отросток."]}, "en": {"q": "A 30-year-old man injured his cervical spine. X-ray shows a fracture of a vertebra whose arch has no spinous process. Which cervical vertebra is injured?", "o": ["I.", "II.", "III.", "VI.", "VII."], "e": ["The atlas (C1) has no spinous process — a posterior tubercle replaces it.", "C2 has a well-developed bifid spinous process.", "C3 has a short bifid spinous process.", "C6 has a short bifid spinous process.", "C7 has the longest non-bifid spinous process."]}}}, {"n": "1.28", "q": "Чоловік 66 років отримав травму в ділянці поперекового відділу хребтового стовпа. Рентгенологічно виявлено перелом відростків III поперекового хребця, розташованих у стріловій площині. Які відростки III поперекового хребця розташовані у стріловій площині?", "o": ["Processus costalis.", "Processus spinosus.", "Processus articularis inferior.", "Processus articularis superior.", "Processus articularis superior, processus articularis inferior, processus spinosus."], "a": [4], "e": ["Реброві відростки — це зачатки ребер, вони розташовані у лобовій площині.", "Остистий відросток — у сагітальній площині, але він не єдиний.", "Нижній суглобовий відросток — лише один із відростків у сагітальній площині.", "Верхній суглобовий відросток — лише один з відростків.", "У сагітальній площині розташовані верхні та нижні суглобові відростки й остистий відросток."], "tr": {"ru": {"q": "Мужчина 66 лет получил травму в области поясничного отдела позвоночного столба. Рентгенологически выявлен перелом отростков III поясничного позвонка, расположенных в сагиттальной плоскости. Какие отростки III поясничного позвонка расположены в сагиттальной плоскости?", "o": ["Processus costalis.", "Processus spinosus.", "Processus articularis inferior.", "Processus articularis superior.", "Processus articularis superior, processus articularis inferior, processus spinosus."], "e": ["Рёберные отростки — зачатки рёбер, они расположены во фронтальной плоскости.", "Остистый отросток — в сагиттальной плоскости, но он не единственный.", "Нижний суставной отросток — лишь один из отростков в сагиттальной плоскости.", "Верхний суставной отросток — лишь один из отростков.", "В сагиттальной плоскости расположены верхние и нижние суставные отростки и остистый отросток."]}, "en": {"q": "A 66-year-old man injured his lumbar spine. X-ray shows fractures of the processes of L3 that lie in the sagittal plane. Which processes of L3 lie in the sagittal plane?", "o": ["Processus costalis.", "Processus spinosus.", "Processus articularis inferior.", "Processus articularis superior.", "Processus articularis superior, processus articularis inferior, processus spinosus."], "e": ["Costal processes are rudimentary ribs and lie in the frontal plane.", "The spinous process lies in the sagittal plane, but it is not the only one.", "The inferior articular process is only one of the processes in the sagittal plane.", "The superior articular process is only one of them.", "The superior and inferior articular processes and the spinous process lie in the sagittal plane."]}}}, {"n": "1.29", "q": "У чоловіка 50 років рентгенологічно виявлено деструкцію тих утворів поперекових хребців, які за положенням у просторі є головною ознакою для хребців поперекового відділу хребтового стовпа. Що є головною ознакою належності хребців до поперекового відділу хребтового стовпа?", "o": ["Положення processus articularis у plana sagittalis.", "Роздвоєний processus spinosus.", "Відсутність fossa costalis processus transversus.", "Foramen transversarium.", "Положення processus articularis у plana frontalis."], "a": [0], "e": ["Головна ознака поперекових хребців — суглобові відростки розташовані у сагітальній площині.", "Роздвоєний остистий відросток — ознака шийних хребців.", "Відсутність ребрової ямки на поперечному відростку — ознака, спільна для XI–XII грудних і поперекових, не головна.", "Foramen transversarium — ознака шийних хребців.", "Суглобові відростки у фронтальній площині — ознака грудних хребців."], "tr": {"ru": {"q": "У мужчины 50 лет рентгенологически выявлена деструкция тех образований поясничных позвонков, которые по положению в пространстве являются главным признаком позвонков поясничного отдела позвоночного столба. Что является главным признаком принадлежности позвонков к поясничному отделу позвоночного столба?", "o": ["Положение processus articularis в plana sagittalis.", "Раздвоенный processus spinosus.", "Отсутствие fossa costalis processus transversus.", "Foramen transversarium.", "Положение processus articularis в plana frontalis."], "e": ["Главный признак поясничных позвонков — суставные отростки расположены в сагиттальной плоскости.", "Раздвоенный остистый отросток — признак шейных позвонков.", "Отсутствие рёберной ямки на поперечном отростке — признак, общий для XI–XII грудных и поясничных, не главный.", "Foramen transversarium — признак шейных позвонков.", "Суставные отростки во фронтальной плоскости — признак грудных позвонков."]}, "en": {"q": "In a 50-year-old man X-ray shows destruction of those structures of lumbar vertebrae whose spatial position is the main feature of lumbar vertebrae. What is the main feature identifying a vertebra as lumbar?", "o": ["Position of processus articularis in plana sagittalis.", "Bifid processus spinosus.", "Absence of fossa costalis processus transversus.", "Foramen transversarium.", "Position of processus articularis in plana frontalis."], "e": ["The main feature of lumbar vertebrae is that their articular processes lie in the sagittal plane.", "A bifid spinous process is a feature of cervical vertebrae.", "No costal facet on the transverse process is shared by T11–T12 and lumbar vertebrae; it is not the main feature.", "Foramen transversarium is a feature of cervical vertebrae.", "Articular processes in the frontal plane are a feature of thoracic vertebrae."]}}}, {"n": "1.30", "q": "У чоловіка 54 років під час рентгенологічного дослідження виявлена пухлина верхньої частки правої легені. Середня та нижня частки правої легені та частки лівої легені – без патологічних змін. Які площини використовує лікар для визначення локалізації злоякісного процесу в легенях під час рентгенологічного дослідження?", "o": ["Plana transversa.", "Plana transversa та рlana sagittalis.", "Plana transversa та рlana frontalis.", "Plana sagittalis та рlana frontalis.", "Plana frontalis."], "a": [3], "e": ["Лише поперечні площини не дозволяють визначити положення частки спереду-ззаду та справа-зліва.", "Поперечні та сагітальні площини не охоплюють поділ на передній/задній.", "Поперечні та фронтальні площини не показують розподіл на праву й ліву частки.", "Локалізацію частки легені визначають за положенням у сагітальній і фронтальній площинах.", "Лише фронтальна площина визначає тільки передній/задній розподіл."], "tr": {"ru": {"q": "У мужчины 54 лет при рентгенологическом исследовании выявлена опухоль верхней доли правого лёгкого. Средняя и нижняя доли правого лёгкого и доли левого лёгкого — без патологических изменений. Какие плоскости использует врач для определения локализации злокачественного процесса в лёгких при рентгенологическом исследовании?", "o": ["Plana transversa.", "Plana transversa и рlana sagittalis.", "Plana transversa и рlana frontalis.", "Plana sagittalis и рlana frontalis.", "Plana frontalis."], "e": ["Только поперечные плоскости не позволяют определить положение доли спереди-сзади и справа-слева.", "Поперечные и сагиттальные плоскости не охватывают деление на передний/задний.", "Поперечные и фронтальные плоскости не показывают деление на правую и левую доли.", "Локализацию доли лёгкого определяют по положению в сагиттальной и фронтальной плоскостях.", "Только фронтальная плоскость определяет лишь передний/задний."]}, "en": {"q": "X-ray of a 54-year-old man shows a tumour of the upper lobe of the right lung; the other lobes are normal. Which planes does the doctor use to localise the process in the lungs on X-ray?", "o": ["Plana transversa.", "Plana transversa and рlana sagittalis.", "Plana transversa and рlana frontalis.", "Plana sagittalis and рlana frontalis.", "Plana frontalis."], "e": ["Transverse planes alone cannot show front-back and right-left position of a lobe.", "Transverse and sagittal planes do not cover the anterior/posterior division.", "Transverse and frontal planes do not show the right/left division.", "The lobe is localised by its position in the sagittal and frontal planes.", "The frontal plane alone defines only anterior/posterior."]}}}], "models": [["Шийний, грудний і поперековий хребці", "sf:9cd7985cec8942ed8507c76f235bd6b3", {"ru": "Шейный, грудной и поясничный позвонки", "en": "Cervical, thoracic and lumbar vertebrae"}], ["Хребтовий стовп за відділами", "sf:d6694f4a47ff4dc989f1aa1ce408ca1d", {"ru": "Позвоночный столб по отделам", "en": "Vertebral column by regions"}]]}, {"id": "topic2", "title": "2. Крижова кістка. Куприк. Ребра, груднина", "tr": {}, "questions": [{"n": "2.1", "q": "Дитина 7 років травмувала крижову кістку під час падіння. Рентгенологічне обстеження виявило ушкодження гребеня крижової кістки, який утворився шляхом зрощення остистих відростків крижових хребців. Який гребінь крижової кістки утворений зрощенням остистих відростків?", "o": ["Crista sacralis mediana.", "Crista sacralis medialis dexter.", "Crista sacralis medialis sinister.", "Crista sacralis lateralis dexter.", "Crista sacralis lateralis dexter."], "a": [0], "e": ["Серединний гребінь (crista sacralis mediana) утворений злиттям остистих відростків крижових хребців.", "Присередній гребінь — парний, утворений злиттям суглобових відростків, а не остистих.", "Лівий присередній гребінь — теж від суглобових відростків.", "Бічний гребінь — від злиття поперечних відростків.", "Правий бічний гребінь — від поперечних відростків, остисті в ньому не беруть участі."]}, {"n": "2.2", "q": "Лікар під час початку нападу ядухи у дитини 7 років використав подразнення рефлексогенної ділянки, яка розміщена в місці проєкції на шкіру непарної вирізки груднини. Яка вирізка груднини є непарною?", "o": ["Incisura costalis I.", "Incisura costalis II.", "Incisura jugularis.", "Incisura clavicularis.", "Incisura costalis VII."], "a": [2], "e": ["Реброва вирізка I — парна, до неї кріпиться хрящ I ребра.", "Реброва вирізка II — парна, на межі рукоятки й тіла груднини.", "Яремна вирізка (incisura jugularis) — єдина непарна вирізка на верхньому краї рукоятки груднини.", "Ключична вирізка — парна, для зчленування з ключицею.", "Реброва вирізка VII — парна, на нижньому краї тіла груднини."]}, {"n": "2.3", "q": "Дівчинка 5 років впала і травмувала крижову кістку. Рентгенологічно виявлено ушкодження гребенів крижової кістки, які утворились шляхом зрощення поперечних відростків крижових хребців. Які гребені крижової кістки ушкоджені?", "o": ["Серединний і правий присередній гребені.", "Правий бічний і лівий бічний гребені.", "Правий бічний і правий присередній гребені.", "Лівий бічний і лівий присередній гребені.", "Серединний і лівий присередній гребені."], "a": [1], "e": ["Серединний гребінь утворений остистими відростками, а присередній — суглобовими.", "Бічні гребені (правий і лівий) утворені злиттям поперечних відростків крижових хребців.", "Правий присередній утворений суглобовими, а не поперечними відростками.", "Присередній гребінь — від суглобових відростків; у відповіді має бути пара бічних.", "Серединний — від остистих, лівий присередній — від суглобових."]}, {"n": "2.4", "q": "Хлопчик 13 років після травми звернувся до хірурга зі скаргами на біль у лівій половині грудної клітки. Рентгенологічно виявлено перелом лівого ребра, яке з’єднується з ребровою вирізкою груднини, розташованою на рівні кута груднини. Яке ребро ушкоджене?", "o": ["I.", "II.", "III.", "IV.", "V."], "a": [1], "e": ["I ребро кріпиться до рукоятки груднини, а не на рівні її кута.", "II ребро з'єднується з ребровою вирізкою на рівні кута груднини (angulus sterni) — важливий орієнтир.", "III ребро кріпиться до тіла груднини нижче кута.", "IV ребро нижче рівня кута груднини.", "V ребро нижче кута, на тілі груднини."]}, {"n": "2.5", "q": "Дівчинка 14 років відчула сильний біль у грудній клітці при падінні. Під час рентгенологічного дослідження лікар виявив перелом ребра, на горбці якого відсутня суглобова поверхня. Яке ребро ушкоджене внаслідок падіння?", "o": ["II.", "III.", "VII.", "X.", "XII."], "a": [4], "e": ["На горбку II ребра суглобова поверхня є.", "На горбку III ребра суглобова поверхня є.", "На горбку VII ребра суглобова поверхня є для поперечного відростка.", "На горбку X ребра суглобова поверхня є.", "XII ребро (і XI) не має горбка із суглобовою поверхнею — воно не з'єднується з поперечним відростком."]}, {"n": "2.6", "q": "Лікар під час обстеження виявив у дитини 5 років болючість в ділянці вирізки груднини, що формує суглобову поверхню для суглоба плечового пояса. Яка вирізка груднини бере участь в утворенні суглоба плечового пояса?", "o": ["Incisura costalis I.", "Incisura costalis II.", "Incisura jugularis.", "Incisura clavicularis.", "Incisura costalis VII."], "a": [3], "e": ["Реброва вирізка I — для хряща I ребра.", "Реброва вирізка II — для хряща II ребра, на межі рукоятки й тіла.", "Яремна вирізка — це непарна вирізка на верхньому краї, плечовий пояс не утворює.", "Ключична вирізка (incisura clavicularis) утворює груднинно-ключичний суглоб — зчленування плечового пояса.", "Реброва вирізка VII — для хряща VII ребра на тілі груднини."]}, {"n": "2.7", "q": "Хлопчик 7 років при
