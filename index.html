вих діаметрах тиск нижчий.", "Порівняння з капілярами не пояснює високого тиску.", "Порівняння з капілярами не пояснює високого тиску."]}, {"n": "28.23", "q": "B урологічне відділення бригада швидкої медичної допомоги доставила жінку 45 років з нестерпним болем внизу живота. Під час рентгенологічного обстеження лікар виявив камінь в верхньому відділі тазової частини сечовода. Через які звуження вже пройшов камінь, викликаючи біль у жінки?", "o": ["Звуження в середній третині тазової частини сечоводу.", "Звуження в верхній третині черевної частини сечоводу.", "Звуження в нижній третині тазової частини сечоводу.", "Звуження при переході з ниркової миски у сечовід і звуження при переході черевної частини в тазову.", "Звуження у внутрішньостінковій частині сечоводу."], "a": [3], "e": ["Звуження в середині тазової частини камінь ще не пройшов.", "Окремого звуження у верхній третині черевної частини немає.", "Нижнє звуження лежить нижче каменя.", "Камінь пройшов звуження в місці переходу миски в сечовід і на межі черевної і тазової частин.", "Внутрішньостінкове звуження лежить нижче."]}, {"n": "28.24", "q": "Чоловіка 57 років госпіталізовано у лікарню для проведення планового обстеження. Пацієнту виконали цистоскопію для оцінки стану слизової оболонки. Уролог звернув увагу на гіперемію та набряк міжсечовідної складки в ділянці трикутника міхура. Вкажіть, між якими отворами розташована plica interureterica (міжсечовідна складка)?", "o": ["Ostium ureteris dextrum et sinistrum.", "Ostium ureteris dextrum i ostium urethrae internum.", "Ostium ureteris sinistrum i ostium urethrae internum.", "Ostium urethrae internum i ostium urethrae externum.", "Ostium ureteris dextrum i uvula vesicae."], "a": [0], "e": ["Міжсечовідна складка натягнута між вічками правого і лівого сечоводів.", "Між правим вічком і сечівником — бічна сторона трикутника.", "Між лівим вічком і сечівником — бічна сторона.", "Зовнішній отвір сечівника лежить поза міхуром.", "Язичок міхура лежить біля внутрішнього отвору сечівника."]}, {"n": "28.25", "q": "У хлопчика 10 років виявлені патологіні зміни в ендокринному комплексі нирки, який регулює нирковий кровообіг, впливаючи на рівень сечоутворення. Лабораторні дослідження підтвердили значне зниження продукції реніну (підвищує кровʼяний тиск у нормі). Які клітини продукують ренін?", "o": ["Юкстагломерулярні клітини.", "Епітеліоцити щільної плями.", "Юкставаскулярні клітини (клітини Гурмагтіга).", "Мезангіальні клітини.", "Ниркові інтерстиційні клітини."], "a": [0], "e": ["Ренін виробляють юкстагломерулярні клітини стінки приносної артеріоли.", "Щільна пляма — хеморецептор натрію.", "Клітини Гурмагтіга можуть брати участь, але основне джерело — юкстагломерулярні.", "Мезангіальні клітини — опорні.", "Інтерстиційні клітини виробляють простагландини."]}, {"n": "28.26", "q": "Чоловік 55 років звернувся до уролога зі скаргами на біль у поперековій ділянці та макрогематурію (наявність крові у сечі). Під час проведення комп'ютерної томографії виявлено пухлиноподібний утвір в нирковій пазусі (sinus renalis). Для уточнення діагнозу лікар повинен знати особливості макро- і мікробудови анатомічних утворів, що розташовані в нирковій пазусі. Які утвори розташовані в нирковій пазусі?", "o": ["Calices renales minores, calices renales majores, pelvis renalis, судини і нерви.", "Corpusculum renis.", "Ansa nephroni.", "Tubulus proximalis, tubulus contortus distalis.", "Ductus renalis colligens, ductus papillaris."], "a": [0], "e": ["У нирковій пазусі — малі і великі чашечки, ниркова миска, судини і нерви.", "Ниркове тільце лежить у кірковій речовині.", "Петля нефрона лежить у мозковій речовині.", "Канальці лежать у паренхімі.", "Збірні трубочки і сосочкові протоки лежать у паренхімі."]}, {"n": "28.27", "q": "Жінка 63-х років звернулася до лікаря зі скаргами на біль у поперековій ділянці та відчуття «пухлини» в животі. Під час проведення комп'ютерної томографії виявлено значне збільшення об'єму нирки та паранефральної клітковини через запальний процес (паранефрит). Для планування оперативного доступу хірург повинен чітко знати топографію оболонок, що оточують нирку, та їх послідовність від зовнішнього шару до внутрішнього. У якій послідовності розміщені оболонки, що оточують нирку, починаючи ззовні?", "o": ["Волокниста капсула, жирова капсула, ниркова фасція.", "Жирова капсула, волокниста капсула, ниркова фасція.", "Волокниста капсула, ниркова фасція, жирова капсула.", "Ниркова фасція, жирова капсула, волокниста капсула.", "Жирова капсула, ниркова фасція, волокниста капсула."], "a": [3], "e": ["Волокниста капсула найглибша.", "Жирова капсула не зовнішня.", "Порядок порушено.", "Ззовні всередину: ниркова фасція, жирова капсула, волокниста капсула.", "Ниркова фасція зовнішня."]}, {"n": "28.28", "q": "Пацієнтка 38 років звернулася до сімейного лікаря зі скаргами на набряки нижніх кінцівок та підвищений артеріальний тиск. В аналізі сечі – протеїнурія (2 г/добу), мікрогематурія. Для уточнення діагнозу проведено біопсію нирки. На гістологічному препараті кіркова речовина має чергування темних та світлих ділянок. Чим представлені світлі ділянки кіркової речовини нирки?", "o": ["Pars convoluta.", "Pars radiatа (radii medullares).", "Pyramides renales.", "Columnae renales.", "Papillae renales."], "a": [1], "e": ["Звивиста частина темна.", "Світлі ділянки — променева частина (мозкові промені).", "Піраміди — мозкова речовина.", "Ниркові стовпи — між пірамідами.", "Сосочки — верхівки пірамід."]}, {"n": "28.29", "q": "У жінки 45 років під час рентгенологічного обстеження було виявлено, що нирки розташовані нижче, ніж повинні бути в нормі. Як відомо, нормальне топографічне розміщення нирок забезпечує її фіксуючий апарат. Які утвори відносяться до фіксуючого апарату нирки?", "o": ["Внутрішньочеревний тиск.", "Ниркова ніжка.", "М’язове ложе нирки.", "Оболонки нирки.", "Все перераховане."], "a": [4], "e": ["Внутрішньочеревний тиск — лише один елемент.", "Ниркова ніжка — лише один елемент.", "М’язове ложе — лише один елемент.", "Оболонки (фасція, жирова капсула) — один з елементів.", "Фіксуючий апарат включає всі перелічені утвори."]}, {"n": "28.30", "q": "2-річний хлопчик госпіталізований в лікарню зі скаргами (зі слів матері) на періодичний біль у животі та поперековій ділянці. Під час проведення комп'ютерної томографії у дитини виявлено аномальне розташування ниркової тканини у вигляді кільця навколо аорти та нижньої порожнистої вени. Діагностована рідкісна вроджена аномалія розвитку нирок – геп anularis. За яких умов спостерігається аномалія розвитку нирок – геn anularis?", "o": ["При зрощенні присередніх країв обох нирок.", "При зрощенні тільки обох верхніх кінців правої і лівої нирок.", "При зрощенні тільки обох нижніх кінців правої і лівої нирок.", "При зрощенні верхнього кінця одної нирки з присереднім краєм другої нирки.", "При зрощенні обох нижніх кінців і обох верхніх кінців правої і лівої нирок."], "a": [4], "e": ["Зрощення присередніх країв — галетоподібна нирка.", "Зрощення верхніх кінців — підковоподібна.", "Зрощення нижніх кінців — підковоподібна.", "Зрощення кінця з краєм — S/L-подібна нирка.", "Кільцеподібна нирка — зрощення і верхніх, і нижніх кінців."]}, {"n": "28.31", "q": "У хлопчика 7 років проходить обстеження у нефролога перед школою. Під час проведення ультразвукового дослідження лікар звертає увагу, що ниркова миска відповідає деревоподібному типу – мішкоподібної форми безпосередньо впадають малі ниркові чашечки зливаються і утворюють 2–3 великі ниркові чашечки, які теж зливаючись, формують ниркову миску, яка переходить у сечовід. Який у дитини варіант розвитку ниркової миски?", "o": ["Зародкова форма.", "Фетальна форма.", "Зріла форма.", "Деревоподібний.", "Ампульний тип."], "a": [2], "e": ["Зародкова форма — миски немає.", "Фетальна форма — без великих чашечок.", "Деревоподібна (з великими чашечками і мискою) — зріла форма розвитку миски.", "Деревоподібний тип і є зрілою формою, правильна відповідь — зріла форма.", "Ампульний тип — фетальна форма."]}], "models": [["Нирки, наднирники і судини", "sf:17e3f54d85f34fafa53c752a9bc88b8d", {"ru": "Почки, надпочечники и сосуды", "en": "Kidneys, adrenals and vessels"}], ["Нирка на розрізі", "sf:fde537a7868b4f8db87450720dc7611f", {"ru": "Почка в разрезе", "en": "Kidney cross-section"}], ["Жіночі статеві і сечові органи", "sf:0ba41334eb384f5b999d7469f906d3ae", {"ru": "Женские половые и мочевые органы", "en": "Female reproductive and urinary systems"}]]}, {"id": "topic29", "title": "29. Чоловічі статеві органи", "tr": {"ru": "29. Мужские половые органы", "en": "29. Male genital organs"}, "questions": [{"n": "29.1", "q": "До лікаря сексопатолога звернувся хлопець 17 років. Аналізуючи скарги та обстеживши молоду людину, лікар поставив діагноз: порушення єякуляції в фазі виведення (накопичення секрету в передміхуровій частині чоловічого сечівника). Якою протокою надходить секрет (сперматозоїди і сім`яна рідина) в чоловічий сечівник?", "o": ["Ductus deferens.", "Ductus exсretorius.", "Ductus ejaculatorius.", "Ductus epididymidis.", "Ductuli prostatici."], "a": [2], "e": ["Сім’явиносна протока закінчується ампулою і в сечівник не відкривається.", "Вивідна протока сім’яного пухирця зливається з сім’явиносною.", "Сім’явипорскувальна протока відкривається в передміхурову частину сечівника і несе сперму.", "Протока придатка переходить у сім’явиносну.", "Проточки передміхурової залози несуть лише її секрет."]}, {"n": "29.2", "q": "До уролога звернувся чоловік 75 років зі скаргами на утруднене сечовипускання, слабкий струмінь сечі та відчуття неповного випорожнення сечового міхура. Під час обстеження лікар враховує вікові зміни в чоловічій статевій системі, що часто є причиною порушення прохідності сечівника. Яка частина сечівника найчастіше звужується з віком?", "o": ["Pars prostatica.", "Ostium externum urethrae masculinae.", "Fossa navicularis urethrae.", "Pars membranacea.", "Pars spongiosa."], "a": [0], "e": ["З віком розростається передміхурова залоза і звужує передміхурову частину сечівника.", "Зовнішній отвір з віком не звужується.", "Човноподібна ямка — розширення.", "Перетинчаста частина вузька від природи, але вікового звуження не дає.", "Губчаста частина з віком не звужується."]}, {"n": "29.3", "q": "До лікаря звернувся чоловік 25 років зі скаргами на те, що його дружина протягом 2-х років не може завагітнити. Лікар підозрює у пацієнта безпліддя. Серед причин безпліддя у чоловіків може бути ушкодження функції інтерстиціальних клітин Лейдіга, які продукують чоловічі статеві гормони. Де розташовані ці клітини?", "o": ["У яєчку.", "У над`яєчку.", "У передміхуровій залозі.", "У пухирчастій залозі.", "У цибулинно-сечівниковій залозі."], "a": [0], "e": ["Інтерстиційні клітини Лейдіга розташовані в стромі яєчка між звивистими канальцями.", "Придаток яєчка лише проводить і дозріває сперматозоїди.", "Передміхурова залоза виробляє секрет, а не тестостерон.", "Пухирчаста залоза виробляє рідку частину сперми.", "Цибулинно-сечівникова залоза виділяє слиз."]}, {"n": "29.4", "q": "До уролога звернувся чоловік 40 років зі скаргами на біль і припухлість правого яєчка. Після обстеження (УЗД, аналізи) виявлено пухлину яєчка, що потребує оперативного втручання. Під час операції хірург повинен розсікати калитку, щоб дістатися до білкової оболонки яєчка (tunica albuginea). Відомо, що яєчко має 7 оболонок, які відповідають шарам передньої черевної стінки. Яка оболонка буде розсічена останньою перед білковою оболонкою яєчка?", "o": ["Fascia spermatica interna.", "Fascia spermatica externa.", "Tunica dartos.", "Tunica vaginalis testis.", "Cutis."], "a": [3], "e": ["Внутрішня сім’яна фасція лежить поверхневіше піхвової оболонки.", "Зовнішня сім’яна фасція лежить ще поверхневіше.", "М’ясиста оболонка лежить під шкірою.", "Піхвова оболонка (похідна очеревини) — найглибша перед білковою оболонкою.", "Шкіра — найповерхневіша оболонка."]}, {"n": "29.5", "q": "До лікаря звернувся чоловік 26 років зі скаргами на те, що його дружина протягом 4-х років не може завагітнити. Лікар з'ясував, що чоловік в дитинстві хворів на епідемічний паротит («свинку»). Ускладненням цієї хвороби може бути ушкодження сперматогенного епітелію, що стає причиною безпліддя у чоловіків. У яких утворах яєчка визначається сперматогенний епітелій?", "o": ["Rete testis.", "Tubuli seminiferi recti.", "Tubuli seminiferi contorti.", "Ductuli efferentes testis.", "Ductuli aberrantes."], "a": [2], "e": ["Сітка яєчка — проводить сперматозоїди.", "Прямі канальці лише проводять.", "Сперматогенний епітелій вистилає звивисті сім’яні канальці.", "Виносні проточки проводять сперматозоїди в придаток.", "Відхильні проточки — рудименти."]}, {"n": "29.6", "q": "Чоловічі статеві клітини (сперматозоїди) продукуються тільки в tubuli seminiferi contorti. Потім по іншим канальцям і протокам сперматозоїди надходять до передміхурової частини чоловічого сечівника. У просвіті якої протоки статевих шляхів чоловіків, що продукують компоненти сперми, відсутні чоловічі статеві клітини?", "o": ["Ductus deferens.", "Tubuli seminiferi recti.", "Ductuli efferentes testis.", "Ductus epididymidis.", "Ductus exсretorius."], "a": [4], "e": ["Сім’явиносна протока містить сперматозоїди.", "Прямі канальці містять сперматозоїди.", "Виносні проточки містять сперматозоїди.", "Протока придатка містить сперматозоїди.", "Вивідна протока сім’яного пухирця несе лише секрет залози, сперматозоїдів у ній немає."]}, {"n": "29.7", "q": "В процесі опускання від місця закладки яєчко поступово рухається у напрямку глибокого кільця пахвинного канала і, просуваючись в калитку через пахвинний канал, огортається оболонками, які є похідними м’язів, фасцій і шкіри передньої черевної стінки. Похідним якої структури є м’яз-підіймач яєчка?", "o": ["Musculus transversus abdominis і musculus obliquus internus abdominis.", "Musculus obliquus externus abdominis i musculus transversus abdominis.", "Musculus transversus abdominis і fascia spermatica exsterna.", "Musculus transversus abdominis і fascia spermatica interna.", "Musculus iliopsoas."], "a": [0], "e": ["М’яз-підіймач яєчка утворений волокнами внутрішнього косого і поперечного м’язів живота.", "Зовнішній косий м’яз дає зовнішню сім’яну фасцію.", "Зовнішня сім’яна фасція — похідна апоневрозу зовнішнього косого.", "Внутрішня сім’яна фасція — похідна поперечної фасції.", "Клубово-поперековий м’яз не бере участі."]}, {"n": "29.8", "q": "До лікаря звернувся чоловік 35-ти років з проблемою утруднення єякуляції. Сім’явипорскувальна протока утворюється шляхом злиття сім’явиносної протоки і вивідної протоки сім’яного пухирця (пухирчастаї залози). Під час обстеження виявлено пухлину, яка стискає місце утворення сім’явипорскувальної протоки, що ускладнює подальше виведення її секрету. Куди відкривається вічко сім’явипорскувальної протоки?", "o": ["Pars prostatica urethraе masculinaе.", "Pars spongiosa urethraе masculinaе.", "Pars membranacea uretrhaе masculinaе.", "Ductuli prostatici.", "Rete testis."], "a": [0], "e": ["Сім’явипорскувальна протока відкривається в передміхурову частину сечівника на сім’яному горбку.", "Губчаста частина приймає протоки цибулинно-сечівникових залоз.", "У перетинчасту частину протоки не відкриваються.", "Проточки передміхурової залози — інші протоки.", "Сітка яєчка лежить у яєчку."]}, {"n": "29.9", "q": "У дитини 10 років травма яєчка ускладнилася запаленням його оболонок, серед яких є tunica vaginalіs testis. Похідним якого утвору є tunica vaginalіs testis?", "o": ["M. obliquus abdominis internus.", "Fascia investiens abdominis.", "Peritoneum.", "M. transversus abdominis.", "Fascia pelvis."], "a": [2], "e": ["Внутрішній косий м’яз дає м’яз-підіймач.", "Обгортальна фасція дає зовнішню сім’яну фасцію.", "Піхвова оболонка яєчка — похідна очеревини (піхвового відростка).", "Поперечний м’яз дає частину м’яза-підіймача.", "Тазова фасція не утворює оболонок яєчка."]}, {"n": "29.10", "q": "Чоловіку 45 років необхідно виконати катетеризацію сечового міхура на тлі затримки сечовиведення. Катетер був введений занадто швидко під час проведення процедури, що призвело до ушкодження слизової оболонки сечівника в ділянці довільного замикача і кровотечі. У якому місці сечівника лікар повинен бути особливо обережним і відчувати опір м'яких тканин при проходженні катетера?", "o": ["B bulbus penis.", "В ділянці fossa navicularis urethrae.", "B pars membranacea urethrae.", "B ділянці ostium urethrae internum.", "B pars prostatica urethrae."], "a": [2], "e": ["Цибулина — розширена частина губчастої частини.", "Човноподібна ямка — у головці.", "Перетинчаста частина проходить крізь сечо-статеву діафрагму з довільним замикачем — найвужче місце, де катетер зустрічає опір.", "Внутрішній отвір лежить у міхурі.", "Передміхурова частина ширша."]}, {"n": "29.11", "q": "До сексопатолога звернувся чоловік 30 років зі скаргами на безпліддя. Після проведення лабораторного обстеження лікар виявив недостатню кількість сперматозоїдів в еякуляті. Де продукуються чоловічі статеві клітини?", "o": ["Vesicula seminalis.", "Ductus ejaculatorius", "Ductus epididymidis.", "Tubuli seminiferi contorti.", "Ductus deferens."], "a": [3], "e": ["Пухирчаста залоза виробляє рідину.", "Сім’явипорскувальна протока лише проводить.", "Протока придатка забезпечує дозрівання.", "Сперматозоїди утворюються у звивистих сім’яних канальцях.", "Сім’явиносна протока лише проводить."]}, {"n": "29.12", "q": "До лікаря-сексопатолога звернулася сімейна пара зі скаргами на безпліддя: вони живуть подружнім життям 7 років без використання контрацепції, але вагітність не настає. Жінка пройшла повне обстеження в жіночій консультації та визнана здоровою. При обстеженні чоловіка виявлено знижену рухливість сперматозоїдів і недостатній об’єм рідкої частини сперми, яка необхідна для транспортування сперматозоїдів і створення оптимального середовища для їх виживання. Де продукується більша частина рідкої складової сперми?", "o": ["Epididymidis.", "Ductus deferens.", "Glandula seminalis et prostata.", "Tubuli seminiferi recti.", "Glandula bulbourethralis."], "a": [2], "e": ["Придаток яєчка забезпечує дозрівання сперматозоїдів.", "Сім’явиносна протока проводить сперматозоїди.", "Більшу частину рідини сперми виробляють пухирчасті залози і передміхурова залоза.", "Прямі канальці лише проводять.", "Цибулинно-сечівникові залози виділяють невелику кількість слизу."]}, {"n": "29.13", "q": "Хлопчик 7 років на прийомі у лікаря скаржиться на поступове збільшення правої половини калитки без болю. Батьки помітили, що припухлість не змінюється при зміні положення тіла. Під час огляду: калитка асиметрична, шкіра не змінена, пальпація безболісна, яєчко нечітко пальпується через наявність рідини. Після діафаноскопії (світло проходить крізь утворення, що свідчить про наявність рідини) встановлено діагноз: водянка яєчка (гідроцеле). Між якими оболонками яєчка локалізується патологічний вміст при водянці?", "o": ["Між шкірою і мʼязом-підіймачем яєчка.", "Між мʼясистою оболонкою i внутршньою сімʼяною фасцією.", "Між внутрішньою сімʼяною фацією і піхвовою оболонкою.", "Між шкірою і мʼясистою оболонкою.", "Між пристінковою і нутрощевою пластинками піхвової оболонки яєчка."], "a": [4], "e": ["Між шкірою і підіймачем рідина не накопичується.", "Між м’ясистою оболонкою і фасцією гідроцеле не виникає.", "Між фасцією і піхвовою оболонкою — не порожнина.", "Між шкірою і м’ясистою оболонкою — підшкірна клітковина.", "Водянка — накопичення рідини між пристінковою і нутрощевою пластинками піхвової оболонки."]}, {"n": "29.14", "q": "Чоловік 32 років звернувся до андролога зі скаргами на безпліддя протягом 2 років. Спермограма показала низьку рухливість сперматозоїдів та підвищену в’язкість еякуляту. Під час трансректального УЗД виявлено зменшення об’єму сім’яних пухирців, які розташовані позаду дна сечового міхура. Ці залози в нормі продукують секрет, що розріджує сперму та містить фруктозу для живлення сперматозоїдів. Для виведення секрету сім’яні пухирці мають вивідну протоку, яка з’єднується з сім'явиносною протокою. Як називається вивідна протока сім’яних пухирців?", "o": ["Ductus ejaculatorius.", "Ductus deferens.", "Ductus exсretorius.", "Ductus efferens.", "Ductus cysticus."], "a": [2], "e": ["Сім’явипорскувальна протока утворюється після злиття.", "Сім’явиносна протока йде від придатка.", "Вивідна протока сім’яного пухирця зливається з сім’явиносною протокою.", "Виносні проточки належать яєчку.", "Міхурова протока — жовчного міхура."]}, {"n": "29.15", "q": "Чоловік 45 років звернувся до уролога після дорожньо-транспортної пригоди зі скаргами на сильний біль у ділянці статевого члена та кровотечу. Під час огляду: наявні гематоми, деформація тіла статевого члена, ушкодження шкіри головки статевого члена. Лікар пояснює пацієту, що йому необхідно провести додаткові інструментальні методи обстеження для оцінки ступеня ушкодження внутрішньої будови статевого члена. Які структури складають внутрішню будову статевого члена?", "o": ["Cortex.", "Medulla.", "Pulpa rubra et pulpa alba.", "Parenchima et stroma penis.", "Corpora cavernosa, corpus spongiosum."], "a": [4], "e": ["Кори в статевому члені немає.", "Мозкової речовини в статевому члені немає.", "Пульпа — селезінка.", "Такий поділ для статевого члена не застосовують.", "Статевий член утворений двома печеристими тілами і губчастим тілом."]}, {"n": "29.16", "q": "В урологічне відділення госпіталізований чоловік 34 років зі скаргами на довготривале вип’ячування в пахвинній ділянці живота, безпліддя. Під час обстеження діагностована пахвинна кила, яка стискає вміст сім’яного канатика і порушує просування сперматозоїдів в наступні сім’явивідні шляхи. По якій протоці, яка є складовою частиною сім’яного канатика, просуваються сперматозоїди?", "o": ["Ductus epididymidis.", "Ductus exretorius.", "Ductus deferens.", "Ductus ejаculatorius.", "Ductus efferens."], "a": [2], "e": ["Протока придатка лежить у придатку.", "Вивідна протока сім’яного пухирця лежить у малому тазі.", "Сім’явиносна протока входить до складу сім’яного канатика.", "Сім’явипорскувальна протока лежить у простаті.", "Виносні проточки лежать у яєчку."]}, {"n": "29.17", "q": "У чоловіка 40 років діагностований гонорейний уретрит. Під час введення катетера у чоловічий сечівник лікар виявив гній у човноподібній ямці уретри (fossa navicularis urethrae). В якій частині статевого члена розташована fossa navicularis urethrae?", "o": ["Тілі статевого члена.", "Цибулині статевого члена.", "Шийці статевого члена.", "Головці статевого члена.", "Корені статевого члена."], "a": [3], "e": ["У тілі статевого члена — губчаста частина без ямки.", "У цибулині — розширення сечівника, не ямка.", "Шийка — звуження позаду головки.", "Човноподібна ямка — розширення сечівника в головці статевого члена.", "У корені статевого члена — цибулина."]}, {"n": "29.18", "q": "25-річний чоловік звернувся до лікаря зі скаргами на періодичний біль та дискомфорт у правій половині калитки, що посилюється під час фізичного навантаження. Під час огляду чоловіка в горизонтальному положенні яєчко піднімається догори, а в вертикальному положенні – опускається. Волокна яких м’язів приймають участь в утворенні musculus cremaster?", "o": ["Внутрішній косий та поперечний м’язи живота.", "Прямий м’яз живота.", "Зовнішній косий м’яз живота.", "Лобково-куприковий м’яз.", "Внутрішній затульний мʼяз."], "a": [0], "e": ["М’яз-підіймач яєчка утворений волокнами внутрішнього косого і поперечного м’язів живота.", "Прямий м’яз живота не дає волокон.", "Зовнішній косий м’яз дає фасцію.", "Лобково-куприковий м’яз — частина дна таза.", "Внутрішній затульний м’яз — м’яз таза."]}, {"n": "29.19", "q": "32-річний чоловік звернувся до лікаря з приводу безпліддя. Після проведення обстеження була виявлена двостороння пахвинна кила, яка потребувала хірургічного лікування у дитячому віці. Спермограма показала відсутність сперматозоїдів в еякуляті (азооспермія) при нормальному рівні статевих гормонів. Підозрюється обструкція сім’явиносної протоки. Яку функцію виконує сім’явиносна протока?", "o": ["Продукція сперматозоїдів", "Проведення сперматозоїдів від придатка яєчка до місця утворення сім’явипорскувальної протоки.", "Виділення передеякуляту.", "Вироблення тестостерону.", "Регуляція температури яєчка."], "a": [1], "e": ["Сперматозоїди утворюються в яєчку.", "Сім’явиносна протока проводить сперматозоїди від придатка до злиття з протокою пухирця.", "Передеякулят виділяють цибулинно-сечівникові залози.", "Тестостерон виробляють клітини Лейдіга.", "Температуру регулюють м’ясиста оболонка і м’яз-підіймач."]}, {"n": "29.20", "q": "40-річний чоловік звернувся у травматологічне відділення лікарні після падіння з велосипеду зі скаргами на біль в сечо-статевій ділянці, в статевому члені, неможливість сечовипускання. Під час огляду виявлено припухлість статевого члена та калитки. Уретрографія показала, що контрастна речовина проникає в м’які тканини статевого члена. Який відділ чоловічого сечівника травмований?", "o": ["Передміхурова частина (pars prostatica).", "Перетинчаста частина (pars membranacea).", "Губчаста частина (pars spongiosa).", "Внутрішній отвір сечівника (ostium urethrae internum).", "Зовнішній отвір сечівника (ostium urethrae externum)."], "a": [2], "e": ["Передміхурова частина лежить у тазі.", "Перетинчаста частина лежить у промежині.", "Контраст у тканинах статевого члена — розрив губчастої частини.", "Внутрішній отвір лежить у міхурі.", "Зовнішній отвір — кінець сечівника."]}, {"n": "29.21", "q": "35-річний чоловік звернувся до уролога зі скаргами на біль та відчуття печіння під час сечовипускання, а також виділення гною із зовнішнього отвору сечівника. В анамнезі – нещодавні незахищені статеві контакти. Під час обстеження виявлено набряк та почервоніння головки статевого члена навколо зовнішнього отвору сечівника. Лабораторний аналіз сечі показав наявність лейкоцитів та бактеріальної флори. Який відділ чоловічого сечівника найчастіше уражається при інфекційному уретриті?", "o": ["Передміхурова частина (pars prostatica).", "Перетинчаста частина (pars membranacea).", "Губчаста частина (pars spongiosa).", "Внутрішній отвір сечівника (ostium urethrae internum).", "Зовнішній отвір сечівника (ostium urethrae externum)."], "a": [2], "e": ["Передміхурова частина уражається рідше.", "Перетинчаста частина уражається рідше.", "Найчастіше запалюється губчаста (передня) частина сечівника, куди інфекція потрапляє через зовнішній отвір.", "Внутрішній отвір уражається рідко.", "Зовнішній отвір — вхідні ворота, але запалення охоплює губчасту частину."]}, {"n": "29.22", "q": "До лікаря звернувся 32-річний чоловік зі скаргами на дискомфорт та біль у промежині, що посилюється при тривалому сидінні. Він також зазначає про незначні гнійні виділення з сечівника, які з’являються після сечовипускання. В анамнезі – епізоди хронічного уретриту. Лікар запідозрив запалення цибулинно-сечівникових залоз. Де розташовані цибулинно-сечівникові залози?", "o": ["У товщі передміхурової залози.", "Позаду від перетинчастої частини сечівника, над цибулиною статевого члена, між м’язами промежини.", "У товщі цибулини статевого члена.", "У складі м’яза-підіймача відхідника.", "В підслизовій пластинці стінки сечівника."], "a": [1], "e": ["У простаті лежать її власні часточки.", "Цибулинно-сечівникові залози лежать позаду перетинчастої частини, над цибулиною, між м’язами промежини.", "У цибулині відкриваються їхні протоки, а не самі залози.", "У м’язі-підіймачі відхідника залоз немає.", "У підслизовій основі — дрібні залози Літтре."]}, {"n": "29.23", "q": "Однорічний хлопчик доставлений на консультацію до дитячого хірурга через відсутність одного яєчка в калитці. Під час огляду: праве яєчко в калитці не промацується, але виявлено при пальпації в пахвинному каналі. Лікар діагностує крипторхізм і рекомендує хірургічне лікування. Протягом якого місяца внутрішньоутробного розвитку яєчко проходить через пахвинний канал і опускається в калитку?", "o": ["3.", "5.", "6.", "7.", "8."], "a": [3], "e": ["На 3-му місяці яєчко ще в поперековій ділянці.", "На 5–6 місяці яєчко біля глибокого кільця.", "На 6-му місяці яєчко ще не пройшло канал.", "На 7-му місяці яєчко проходить пахвинний канал (у калитку — до 8–9-го місяця).", "На 8-му місяці яєчко вже в калитці."]}, {"n": "29.24", "q": "На гістологічному препараті яєчка студенти вивчають сперматогенний епітелій, який забезпечує процеси сперматогенезу. Цей епітелій складається з клітин, що диференціюються в сперматозоїди, та підтримуючих клітин. У яких анатомічних структурах яєчка розташований сперматогенний епітелій?", "o": ["Rete testis.", "Tubuli seminiferi recti.", "Tubuli seminiferi contorti.", "Ductuli efferentes testis.", "Ductuli aberrantes."], "a": [2], "e": ["Сітка яєчка лише проводить.", "Прямі канальці проводять.", "Сперматогенний епітелій вистилає звивисті сім’яні канальці.", "Виносні проточки проводять.", "Відхильні проточки — рудименти."]}, {"n": "29.25", "q": "До уролога звернувся чоловік 32 років зі скаргами на безпліддя. Під час обстеження встановлено, що у чоловіка в єякуляті замало рідкої частини сперми, внаслідок чого сперматозоїди малорухомі, не активні. Лікар запідозрив ушкодження пухирчастої залози, що продукує рідину, чи блокаду її протоки. По якій протоці пухирчастої залози рідка частина сперми збагачує вміст ампули сім'явиносної протоки?", "o": ["Ductus deferens.", "Ductus ejaculatorius.", "Ductuli efferentes testis.", "Ductus epididymidis.", "Ductus excretorius."], "a": [4], "e": ["Сім’явиносна протока несе сперматозоїди з придатка.", "Сім’явипорскувальна протока утворюється після злиття.", "Виносні проточки належать яєчку.", "Протока придатка — шлях сперматозоїдів.", "Вивідна протока пухирчастої залози несе її секрет у сім’явиносну протоку."]}, {"n": "29.26", "q": "До педіатра звернулася жінка з 5-річним хлопчиком зі скаргами на те, що з народження у дитини відсутнє одне яєчко в калитці. Біль та дискомфорт відсутні, загальний розвиток відповідає віку. Під час огляду: права половина калитки порожня, ліве яєчко пальпується. Пальпація правої пахвинної ділянки не виявило в пахвинному каналі утвору, що нагадує яєчко. Лікар запідозрив, що у дитини взагалі відсутнє праве яєчко. Як називається така вада розвитку?", "o": ["Крипторхізм.", "Монорхізм.", "Агенезія яєчка.", "Анорхізм.", "Гіпоплазія яєчка."], "a": [1], "e": ["Крипторхізм — неопущення яєчка.", "Монорхізм — вроджена відсутність одного яєчка.", "Агенезія — загальний термін для відсутності органа.", "Анорхізм — відсутність обох яєчок.", "Гіпоплазія — недорозвинення яєчка."]}, {"n": "29.27", "q": "Хлопчик 4 років доставлений до дитячого хірурга зі скаргами на збільшення лівої половини калитки, яке помітно під час плачу та фізичної активності. Батьки відзначають, що припухлість зменшується у спокої. При огляді: ліва половина калитки збільшена, пальпується м’який еластичний утвір, який легко вправляється в черевну порожнину. Під час ультразвукового дослідження виявлено кишкові петлі в калитці. Встановлено діагноз: пахвинна грижа. Аналог якої оболонки яєчка охоплює петлі тонкої кишки в грижевому мішку?", "o": ["Tunica dartos.", "Fascia spermatica externa.", "Fascia spermatica interna.", "Fascia cremasterica.", "Tunica vaginalis testis."], "a": [4], "e": ["М’ясиста оболонка лежить під шкірою.", "Зовнішня сім’яна фасція — похідна апоневрозу зовнішнього косого м’яза.", "Внутрішня сім’яна фасція — похідна поперечної фасції.", "Фасція м’яза-підіймача не утворює мішка.", "Грижовий мішок — незарощений піхвовий відросток очеревини, аналог піхвової оболонки яєчка."]}, {"n": "29.28", "q": "Чоловік 68 років госпіталізований до урологічного відділення зі скаргами на утруднене сечовипускання, часті нічні позиви (ніктурія) та відчуття неповного випорожнення сечового міхура. При пальцевому ректальному дослідженні лікар відзначив збільшення передміхурової залози. УЗД підтвердило наявність аденоми передміхурової залози — доброякісної пухлини, що здавлює предміхурову частину сечівника. знак інвазії в сусідні тканини не виявлено. З патологією якої структури повʼязаний цей діагноз?", "o": ["Залозистої паренхіми передміхурової залози.", "Капсули передміхурової залози.", "Мʼязової речовини передміхурової залози.", "Сім'явипорскувальної протоки.", "Слизової оболонки сечівника."], "a": [0], "e": ["Аденома передміхурової залози розвивається із залозистої паренхіми (навколосечівникових залоз).", "Капсула при аденомі розтягується, але не є джерелом.", "М’язова речовина не є джерелом аденоми.", "Сім’явипорскувальна протока не утворює аденоми.", "Слизова сечівника не утворює аденоми."]}, {"n": "29.29", "q": "До педіатра звернулася жінка з 3-річним хлопчиком зі скаргами на те, що з народження у дитини відсутні яєчки в калитці. Біль та дискомфорт відсутні, загальний розвиток відповідає віку. Під час огляду: права та ліва половини калитки порожні. Пальпація правої та лівої пахвинної ділянки не виявила в пахвинному каналі утворів, що нагадують яєчка. Лікар запідозрив, що у дитини взагалі відсутні обидва яєчка. Як називається така вада розвитку?", "o": ["Крипторхізм.", "Монорхізм.", "Агенезія яєчка", "Анорхізм.", "Гіпоплазія яєчка."], "a": [3], "e": ["Крипторхізм — неопущення яєчок.", "Монорхізм — відсутність одного яєчка.", "Агенезія — загальний термін.", "Анорхізм — вроджена відсутність обох яєчок.", "Гіпоплазія — недорозвинення."]}, {"n": "29.30", "q": "До педіатра звернулася жінка з 9-річним хлопчиком зі скаргами на те, що з народження у дитини відсутнє одне яєчко в калитці. Біль та дискомфорт відсутні, загальний розвиток відповідає віку. Під час огляду: права половина калитки порожня, ліве яєчко пальпується. Пальпація пахвинної ділянки виявило наявність в пахвинному каналі невеликого еластичного утвору, що нагадує яєчко. Лікар запідозрив порушення процесу опускання яєчка. Як називається вада розвитку неопущення яєчка в калитку?", "o": ["Крипторхізм.", "Монорхізм.", "Агенезія яєчка.", "Анорхізм.", "Гіпоплазія яєчка."], "a": [0], "e": ["Крипторхізм — неопущення яєчка в калитку (яєчко в пахвинному каналі).", "Монорхізм — відсутність одного яєчка.", "Агенезія — відсутність органа.", "Анорхізм — відсутність обох яєчок.", "Гіпоплазія — недорозвинення."]}, {"n": "29.31", "q": "Під час ендоскопічного дослідження слизової оболонки сечівника у чоловіка 58 років уролог бачить у проксимальній третині губчастої частини статевого члена два вічка проточків залоз, що розташовані між м’язами промежини. Вивідні протоки яких утворів відкриваються у губчасту частину чоловічого сечівника?", "o": ["Ductuli prostatici.", "Ductus glandulae bulbourethrales.", "Ductus ejaculatorii.", "Ductus excretorii.", "Ductus deferentes."], "a": [1], "e": ["Проточки простати відкриваються в передміхурову частину.", "Протоки цибулинно-сечівникових залоз відкриваються в губчасту частину сечівника.", "Сім’явипорскувальні протоки відкриваються в передміхурову частину.", "Вивідні протоки пухирців зливаються з сім’явиносними.", "Сім’явиносні протоки в сечівник не відкриваються."]}], "models": [["Чоловічі статеві органи", "sf:0d54b936029a46e7b93637ac417c8283", {"ru": "Мужские половые органы", "en": "Male genital system"}]]}, {"id": "topic30", "title": "30. Жіночі статеві органи. Промежина. Молочна залоза", "tr": {"ru": "30. Женские половые органы. Промежность. Молочная железа", "en": "30. Female genital organs. Perineum. Mammary gland"}, "questions": [{"n": "30.1", "q": "До гінеколога звернулася 16-річна дівчина зі скаргами на порушення менструального циклу. Лікар призначив ультразвукове дослідження органів малого таза. За допомогою УЗД лікар оглядає жіночі статеві органи, розміщені спереду прямої кишки. Які органи або їх частини розміщені спереду від прямої кишки у жінок?", "o": ["Задня поверхня матки і задня стінка піхви.", "Передня поверхня матки і передня стінка піхви.", "Маткові труби.", "Яєчники.", "Сечовий міхур."], "a": [0], "e": ["Спереду від прямої кишки у жінки лежать задня поверхня матки і задня стінка піхви.", "Передня поверхня матки і передня стінка піхви звернені до сечового міхура.", "Маткові труби лежать вище, у широкій зв’язці.", "Яєчники лежать на бічних стінках таза.", "Сечовий міхур лежить спереду від матки."]}, {"n": "30.2", "q": "До лікаря-гінеколога звернулась жінка 35 років зі скаргами на біль у лобковій ділянці живота. Лікар всебічно обстежив жінку і поставив діагноз – ендометрит (запалення слизової оболонки матки). Поверхня ендометрія тіла матки гладенька і лише в каналі шийки матки виявлені уражені запальним процесом складки слизової оболонки. Які складки ушкоджені?", "o": ["Plicae palmatae.", "Rugae vaginales.", "Columna rugarum anterior.", "Columna rugarum posterior.", "Plicae longitudinalаe."], "a": [0], "e": ["У каналі шийки матки слизова утворює пальмоподібні складки.", "Піхвові складки — у піхві.", "Передній стовп складок — у піхві.", "Задній стовп складок — у піхві.", "Поздовжні складки не характерні для каналу шийки."]}, {"n": "30.3", "q": "У лікарні під час пологів у жінки 28 років були виявлені розриви промежини, яку клініцисти називають промежиною у вузькому розумінні. Між якими анатомічними утворами знаходиться ця ділянка?", "o": ["Відхідником і куприком.", "Присінком піхви і відхідником.", "Відхідником і сідничими горбами.", "Куприком і зовнішніми статевими органами.", "Куприком і сідничими горбами."], "a": [1], "e": ["Між відхідником і куприком лежить задня частина промежинної ділянки.", "Промежина у вузькому розумінні — ділянка між присінком піхви і відхідником.", "Між відхідником і сідничими горбами — сідничо-відхідникові ямки.", "Від куприка до статевих органів — промежина в широкому розумінні.", "Між куприком і горбами — задня межа ділянки."]}, {"n": "30.4", "q": "Жінка 25 років госпіталізована у гінекологічне відділення з приводу пухлини яєчника. Під час проведення оперативного втручання лікарю необхідно розсікти зв’язку, що з’єднує яєчник з маткою. Яку саме?", "o": ["Ligamentum suspensorium ovarii.", "Ligamentum сardinale.", "Ligamentum latum uteri.", "Ligamentum ovarii proprium.", "Ligamentum rectouterinum."], "a": [3], "e": ["Зв’язка, що підвішує яєчник, іде до стінки таза.", "Кардинальна зв’язка фіксує шийку матки.", "Широка зв’язка — брижа матки.", "Власна зв’язка яєчника з’єднує яєчник з маткою.", "Прямокишково-маткова зв’язка йде до прямої кишки."]}, {"n": "30.5", "q": "До лікаря-гінеколога звернулась жінка 30 років, яка протягом 5 років подружнього життя не може завагітніти. Лікар оглянув пацієнтку і виявив, що у неї матка знаходиться в положенні retroflexio. Як визначається положення retroflexio uteri?", "o": ["Кутом між тілом і шийкою матки, відкритому вперед.", "Кутом між тілом і шийкою матки, відкритому назад.", "Дном матки направленому вперед.", "Дном матки направленому назад.", "Нахилом матки вліво."], "a": [1], "e": ["Кут, відкритий вперед, — anteflexio (норма).", "Retroflexio — кут між тілом і шийкою матки відкритий назад.", "Дно вперед — anteversio.", "Дно назад — retroversio, а не retroflexio.", "Нахил убік — lateropositio."]}, {"n": "30.6", "q": "До гінеколога звернулася жінка 28 років зі скаргами на порушення менструального циклу. Після обстеження виявлено, що відсутність менструації пов’язана з порушенням відторгнення поверхневого функціонального шару ендометрію на тлі ушкодження кінцевих відділів залоз слизової оболонки. Які залози слизової оболонки за будовою кінцевого відділу ушкоджені?", "o": ["Прості трубчасті залози, які досягають міометрію.", "Складні трубчасті залози.", "Прості альвеолярні залози.", "Складні альвеолярні залози.", "Прості трубчасті залози, які досягають серозної оболонки."], "a": [0], "e": ["Маткові залози — прості трубчасті, досягають міометрію.", "Складних трубчастих залоз в ендометрії немає.", "Альвеолярних залоз в ендометрії немає.", "Альвеолярних залоз в ендометрії немає.", "Залози не досягають серозної оболонки."]}, {"n": "30.7", "q": "У гінекологічне відділення лікарні госпіталізована жінка 33 років зі скаргами на гострий біль у правій пахвинній ділянці живота, затримку менструації. Обстеживши хвору, лікар поставив діагноз – розрив стінки маткової труби внаслідок трубної вагітності з подразненням її брижі. Як називається брижа маткової труби?", "o": ["Mesenterium.", "Mesovarium.", "Мesometrium.", "Mesosalpinx.", "Mesocolon sigmoideum."], "a": [3], "e": ["Mesenterium — брижа тонкої кишки.", "Mesovarium — брижа яєчника.", "Mesometrium — брижа матки.", "Брижа маткової труби — mesosalpinx.", "Mesocolon sigmoideum — брижа сигмоподібної кишки."]}, {"n": "30.8", "q": "Жінку 45 років госпіталізовано у лікарню з підозрою на пухлину матки. Після обстеження встановлено діагноз – фіброміома матки. У якій оболонці матки, чи в її прошарку, розміщується пухлина?", "o": ["Perimetrium.", "Endometrium.", "Myometrium.", "Parametrium.", "Tela subserosa."], "a": [2], "e": ["Периметрій — серозна оболонка.", "Ендометрій — слизова оболонка.", "Фіброміома — пухлина з м’язової оболонки (міометрію).", "Параметрій — навколоматкова клітковина.", "Підсерозна основа — тонкий прошарок."]}, {"n": "30.9", "q": "У гінекологічне відділення лікарні госпіталізовано жінку 55 років з патологією, яка потребує видалення яєчника. Під час оперативного втручання хірургу необхідно врахувати фіксуючий апарат яєчника. Що не входить до фіксуючого апарата яєчника?", "o": ["Ligamentum teres uteri.", "Ligamentum ovarii proprium.", "Ligamentum suspensorium ovarii.", "Mesovarium.", "Судини і нерви яєчника."], "a": [0], "e": ["Кругла зв’язка матки фіксує матку, а не яєчник.", "Власна зв’язка яєчника фіксує яєчник.", "Зв’язка, що підвішує яєчник, фіксує яєчник.", "Брижа яєчника фіксує яєчник.", "Судини і нерви також утримують яєчник."]}, {"n": "30.10", "q": "У жінки 45 років виявлено порушення фіксуючого апарату матки. Розміщуючись в порожнині малого таза, матка фіксується до бічних стінок таза зв’язкою, яку ще називають брижою матки. Яка це зв’язка?", "o": ["Mesovarium.", "Ligamentum teres uteri.", "Ligamentum cardinalе.", "Ligamentum latum uteri.", "Ligamentum ovarii proprium."], "a": [3], "e": ["Mesovarium — брижа яєчника.", "Кругла зв’язка йде в пахвинний канал.", "Кардинальна зв’язка фіксує шийку.", "Широка зв’язка матки — брижа матки, з’єднує її з бічними стінками таза.", "Власна зв’язка яєчника йде до яєчника."]}, {"n": "30.11", "q": "У жінки 31 років діагностована позаматкова вагітність. На тлі звуження простору маткової труби внаслідок сальпінгіту у жінки порушилося проходження заплідненої яйцеклітини в матку. Імплантація заплідненої яйцеклітини відбулася у найвужчому місці маткової труби, що в подальшому призвело до розриву її стінки і крововиливу. Де найвужче місце в матковій трубі?", "o": ["Infundibulum tubae uterinae.", "Pars uterina tubae uterinae.", "Isthmus tubae uterinae.", "Ampulla tubae uterinae.", "Mesosalpinx."], "a": [1], "e": ["Лійка — найширша частина.", "Маткова (внутрішньостінкова) частина — найвужча.", "Перешийок вузький, але маткова частина ще вужча.", "Ампула — найширша частина.", "Брижа маткової труби — не частина труби."]}, {"n": "30.12", "q": "У жінки 23 років під час оперативного втручання на органах малого таза виникла необхідність перев’язати маткову артерію біля шийки матки. Який утвір може бути випадково перев’язаний разом з arteria uterina?", "o": ["Сечовід.", "Маткова труба.", "Кругла зв’язка матки.", "Внутрішня клубова вена.", "Сечівник."], "a": [0], "e": ["Біля шийки матки маткова артерія перехрещується із сечоводом, тому його можна перев’язати випадково.", "Маткова труба лежить вище.", "Кругла зв’язка йде до пахвинного каналу.", "Внутрішня клубова вена лежить на стінці таза.", "Сечівник лежить нижче."]}, {"n": "30.13", "q": "У гінекологічне відділення лікарні госпіталізовано жінку 23 років з клінікою «гострого живота» і підозрою на запалення очеревини у прямокишково-матковій заглибині. Крізь який анатомічний утвір або його частину необхідно виконати пункцію заглибини для уточнення діагнозу?", "o": ["Pars anterior fornix vaginae.", "Pars posterior fornix vaginae.", "Cervix uteri.", "Rectum.", "Uretra feminina."], "a": [1], "e": ["Переднє склепіння прилягає до міхурово-маткової заглибини.", "Заднє склепіння піхви прилягає до прямокишково-маткової заглибини.", "Шийка матки — не шлях пункції.", "Через пряму кишку пункцію не роблять.", "Сечівник не прилягає до заглибини."]}, {"n": "30.14", "q": "Жінка 28 років на вулиці втратила свідомість. Карета невідкладної медичної допомоги доставила її в гінекологічне відділення лікарні. Пацієнтка скаржилась на гострий біль внизу живота, який віддає в ділянку відхідника, слабкість, запаморочення. У жінки зафіксовано прискорений пульс, блідість шкіри, падіння кров’яного тиску. У жінки діагностовано позаматкову вагітність, яка ускладнилася розривом стінки маткової труби. У якому утворі очеревинної порожнини зазвичай накопичується кров внаслідок розриву маткової труби?", "o": ["Прямокишково-матковій заглибині.", "Нижньому клубово-сліпокишковиму закутку.", "Правій брижовій пазусі.", "Лівій брижовій пазусі.", "Міжсигмоподібному закутку."], "a": [0], "e": ["Кров збирається в найнижчому місці — прямокишково-матковій заглибині.", "Клубово-сліпокишковий закуток лежить вище.", "Брижові пазухи лежать у середньому поверсі.", "Брижові пазухи лежать у середньому поверсі.", "Міжсигмоподібний закуток лежить вище."]}, {"n": "30.15", "q": "У гінекологічне відділення госпіталізована жінка 43 років зі скаргами на біль внизу живота, вздуття, закреп, часте сечовипускання, втрату ваги, загальну слабкість, порушення менструального циклу. Всебічно обстеживши жінку, лікар виявив пухлину правого яєчника, який необхідно видалити. У якому топографічному просторі лікар проводить оперативне втручання?", "o": ["Заочеревинному просторі.", "Залобковому просторі.", "У міхурово-матковій заглибині.", "Яєчниковій ямці.", "У прямокишково-міхуровій заглибині."], "a": [3], "e": ["Яєчник лежить не заочеревинно.", "Залобковий простір лежить спереду від міхура.", "Міхурово-маткова заглибина лежить спереду від матки.", "Яєчник розташований у яєчниковій ямці на бічній стінці таза.", "Прямокишково-міхурова заглибина є лише в чоловіків."]}, {"n": "30.16", "q": "Яйцеклітина відразу після овуляції потрапляє в очеревинну порожнину і захоплюється торочками маткової труби для просування у порожнину матки. Через які частини маткової труби яйцеклітина просувається послідовно у порожнину матки?", "o": ["Isthmus, ampulla, infundibulum, pars uterina.", "Ampulla, infundibulum, isthmus, pars uterina.", "Infundibulum, ampulla, isthmus, pars uterina.", "Infundibulum, isthmus, ampulla, pars uterina.", "Ampulla, isthmus, iInfundibulum, pars uterina."], "a": [2], "e": ["Порядок частин переплутаний.", "Порядок частин переплутаний.", "Яйцеклітина йде: лійка → ампула → перешийок → маткова частина.", "Порядок частин переплутаний.", "Порядок частин переплутаний."]}, {"n": "30.17", "q": "У гінекологічне відділення лікарні звернулася жінка 55 років з метою профілактичного огляду. Під час обстеження лікар-гінеколог оглядає вічко матки. Чим обмежена ця структура?", "o": ["Передньою і задньою губами.", "Присередньою і бічною губами.", "Правою і лівою губами.", "Верхньою і нижньою губами.", "Передньою і задньою стінками піхви."], "a": [0], "e": ["Вічко матки обмежене передньою і задньою губами шийки.", "Присередньої і бічної губ немає.", "Правої і лівої губ немає.", "Верхньої і нижньої губ немає.", "Стінки піхви оточують шийку, але не вічко."]}, {"n": "30.18", "q": "Жінка 25 років звернулась до лікаря-гінеколога зі скаргою на свербіж у ділянці піхви. Обстежуючи жінку, лікар звертає увагу на частини та структури органа. Яких утворів немає у піхві?", "o": ["Склепіння.", "Передньої стінки.", "Задньої стінки.", "Сосочків дівочої перетинки.", "Передньої і задньої губи."], "a": [4], "e": ["Склепіння — частина піхви.", "Передня стінка — частина піхви.", "Задня стінка — частина піхви.", "Сосочки дівочої перетинки — біля отвору піхви.", "Передня і задня губи належать шийці матки, а не піхві."]}, {"n": "30.19", "q": "Профілактичний огляд зовнішніх статевих органів жінки 58 років передбачає обстеження усіх утворів, що відкриваються у присінок піхви. Які утвори не відкриваються у присінок піхви?", "o": ["Отвір піхви.", "Зовнішне вічко сечівника.", "Протоки великих та малих присінкових залоз.", "Внутрішнє вічко сечівника.", "Присечівникові протоки."], "a": [3], "e": ["Отвір піхви відкривається в присінок.", "Зовнішнє вічко сечівника відкривається в присінок.", "Протоки присінкових залоз відкриваються в присінок.", "Внутрішнє вічко сечівника лежить у сечовому міхурі.", "Присечівникові протоки відкриваються біля зовнішнього отвору сечівника."]}, {"n": "30.20", "q": "Внутрішні жіночі статеві органи розвиваються з парамезонефральних протоків. Але деякі рудиментарні утвори є залишками первинної нирки. Які утвори у жінки не є залишками канальців первинної нирки?", "o": ["Еpoophоron.", "Paraophоron.", "Appendices vesiculosae.", "Ductus longitudinalis epoophori.", "Ductuli transversi."], "a": [2], "e": ["Надъяєчник — залишок канальців первинної нирки.", "Приъяєчник — залишок канальців первинної нирки.", "Пухирцеві привіски — залишки краніальних кінців проток, а не канальців.", "Поздовжня протока надъяєчника — залишок мезонефральної протоки разом із канальцями.", "Поперечні проточки — залишки канальців первинної нирки."]}, {"n": "30.21", "q": "До гінеколога звернулася жінка 49 років зі скаргами на біль внизу живота, що віддає в поперек, порушення менструального циклу, часті позиви до сечовипускання. Обстеживши жінку, лікар діагностував кісту яєчника, яку необхідно видалити. Під час оперативного втручання лікар спостерігає на зовнішній оболонці яєчника велику кількість кіст (полікістоз). Чим ззовні покритий яєчник?", "o": ["Peritoneum.", "Tunica albuginea.", "Tunica adventitia.", "Mesoovarium.", "Tunica mucosa."], "a": [1], "e": ["Яєчник очеревиною не вкритий (лише зародковий епітелій).", "Під зародковим епітелієм яєчник покритий білковою оболонкою.", "Адвентиції в яєчника немає.", "Брижа яєчника — зв’язка, а не оболонка.", "Слизової оболонки в яєчника немає."]}, {"n": "30.22", "q": "Під час планового огляду жінки 52 років гінеколог запідозрив у ділянці portio supravaginalis cervicis злоякісну пухлину. Припущення лікаря підтвердились після проведення МРТ – виявлена злоякісна пухлина (рак), яка потребує негайного оперативного втручання. Під час операції хірургу необхідно перев’язати маткову артерію. Між листками якої зв’язки проходить arteria uterina?", "o": ["Ligamentum latum uteri.", "Ligamentum teres uteri.", "Ligamentum cardinale.", "Mesosalpinx.", "Mesovarium."], "a": [0], "e": ["Маткова артерія проходить між листками біля основи широкої зв’язки матки.", "Кругла зв’язка не містить маткової артерії.", "Кардинальна зв’язка лежить нижче, біля шийки.", "У брижі труби проходять трубні гілки.", "У брижі яєчника — яєчникові гілки."]}, {"n": "30.23", "q": "До лікаря-гінеколога звернулась породілля 22 років зі скаргами на біль, набряклість в грудях, коричневі виділення із грудних сосків. Обстеживши жінку, лікар діагностував запальний процес жирової тканини та залозистих елементів грудної (молочної) залози. Які за будовою кінцевого відділу залози утворюють тіло груді?", "o": ["Складні альвеолярні.", "Прості трубчасті.", "Складні трубчасті.", "Складні альвеолярно-трубчасті.", "Прості альвеолярні."], "a": [3], "e": ["Молочна залоза має і трубчасті, і альвеолярні відділи.", "Прості трубчасті — неправильно.", "Складні трубчасті — неповно.", "Молочна залоза — складна альвеолярно-трубчаста залоза.", "Прості альвеолярні — неправильно."]}, {"n": "30.24", "q": "Під час профілактичного огляду грудей у жінок лікар звертає увагу на зміну розмірів та форми, ущільнення, рухливість, характер соска та ін. Чим представлене тіло грудної залози?", "o": ["Мозковою речовиною.", "Кірковою речовиною.", "М’язовою речовиною.", "Соском.", "Частками залози."], "a": [4], "e": ["Мозкової речовини немає.", "Кіркової речовини немає.", "М’язової речовини немає.", "Сосок — не тіло залози.", "Тіло грудної залози складається з 15–20 часток залози."]}, {"n": "30.25", "q": "До лікаря-гінеколога звернулась жінка 46 років зі скаргою на гострий біль внизу живота, озноб, високу температуру, гнійні виділення з неприємним запахом. Обстеживши жінку, лікар виявив гострий ендометрит. Запалення якої оболонки матки називається ендометритом?", "o": ["Слизової оболонки.", "Зовнішній поздовжній шар м’язової оболонки.", "Серозної оболонки.", "Зовнішній поздовжній шар м’язової оболонки.", "Середній коловий шар м’язової оболонки."], "a": [0], "e": ["Ендометрит — запалення слизової оболонки матки (ендометрію).", "Запалення м’язової оболонки — міометрит.", "Запалення серозної оболонки — периметрит.", "Запалення м’язової оболонки — міометрит.", "Запалення м’язової оболонки — міометрит."]}, {"n": "30.26", "q": "До лікаря-генетика звернулися батьки новонародженої дівчинки з ознаками порушення статевого розвитку: зовнішні статеві органи мають інтерсексні риси, а під час ультразвукового дослідження виявлено відсутність чітко сформованих яєчників. Генетичний аналіз показав наявність хромосомного набору 46ХХ, але з мутацією гена, що регулює диференціацію статевих залоз. Яка ембріональна структура є основою для розвитку статевих залоз на ранніх стадіях онтогенезу?", "o": ["Передня нирка.", "Потовшений целомічний епітелій біля закладки первинних нирок.", "Ектодерма.", "Зародковий епітелій біля кишкової трубки.", "Ентодерма."], "a": [1], "e": ["Передня нирка — рудиментарна.", "Статеві залози закладаються з потовщеного целомічного епітелію (статевих валиків) біля первинних нирок.", "Ектодерма дає шкіру і нервову систему.", "Біля кишкової трубки статеві залози не закладаються.", "Ентодерма дає епітелій кишки."]}, {"n": "30.27", "q": "До лікаря-гінеколога звернулася жінка 34 років зі скаргами на сильний біль у надлобковій ділянці живота, підвищення температури та гнійні виділення. Під час обстеження встановлено діагноз – гнійне запалення маткових труб (гнійний сальпінгіт). Враховуючи анатомічні особливості жіночої статевої системи, маткові труби відкриваються у черевну порожнину через лійку з торочками. Куди може потрапити гнійний ексудат із маткових труб?", "o": ["Заочеревинний простір.", "Пахвинний простір.", "В очеревинну порожнину або в порожнину матки.", "В порожнину прямої кишки.", "В порожнину великого таза."], "a": [2], "e": ["Заочеревинний простір не сполучається з трубами.", "Пахвинного простору немає.", "Маткові труби відкриваються в очеревинну порожнину і в порожнину матки.", "У пряму кишку гній прямо не потрапляє.", "Великий таз — частина черевної порожнини, але шлях — через очеревинну порожнину."]}, {"n": "30.28", "q": "До лікаря звернулася пацієнтка 56 років із скаргами на гострий біль в відхідниковій ділянці, набряк, почервоніння та ущільненням тканин навколо відхідника, високу температуру, озноб, слабкість, головний біль. Лікар діагностував у жінки парапроктит. Це запалення жирової клітковини (жирового тіла) сідничо-відхідникової ямки (corpus adiposum fossae ischioanalis). Чим утворена задня стінка цієї ямки?", "o": ["Фасцією великого сідничного м’яза.", "Фасцією, що покриває внутрішній затульний м’яз та сідничий горб.", "Поверхневим поперечним м’язом промежини.", "Зовнішнім м’язом-затискачем відхідника.", "Поверхневою фасцією промежини."], "a": [0], "e": ["Задня стінка сідничо-відхідникової ямки — великий сідничий м’яз (і крижово-горбова зв’язка).", "Фасція затульного м’яза — бічна стінка.", "Поверхневий поперечний м’яз — передня стінка.", "Зовнішній замикач — присередня стінка.", "Поверхнева фасція — не стінка ямки."]}, {"n": "30.29", "q": "До гінеколога звернулася жінка 28 років із проблемою безпліддя. Під час обстеження виявлено спайковий процес у маткових трубах, що може перешкоджати транспорту яйцеклітини. Лікар пояснює, що нормальний рух яйцеклітини відбувається завдяки перистальтиці труб і роботі війчастого епітелію. Через які частини маткової труби яйцеклітина просувається послідовно у порожнину матки?", "o": ["Isthmus, ampulla, infundibulum, pars uterina.", "Ampulla, infundibulum, isthmus, pars uterina.", "Infundibulum, ampulla, isthmus, pars uterina.", "Infundibulum, isthmus, ampulla, pars uterina.", "Ampulla, isthmus, ilnfundibulum, pars uterina."], "a": [2], "e": ["Порядок частин переплутаний.", "Порядок частин переплутаний.", "Яйцеклітина йде: лійка → ампула → перешийок → маткова частина.", "Ампула лежить перед перешийком.", "Порядок частин переплутаний."]}, {"n": "30.30", "q": "До гінеколога звернулася 25-річна жінка зі скаргами на свербіж і дискомфорт у ділянці піхви. Під час огляду лікар оцінює стан слизової оболонки та звертає увагу на анатомічні особливості цього органа. Піхва є частиною жіночих статевих шляхів, але має специфічну будову, яка відрізняється від інших органів статевої системи. Які є утвори піхви?", "o": ["Склепіння.", "Передня стінкa.", "Задня стінкa.", "Дівоча перетинка.", "Усі перераховані вище."], "a": [4], "e": ["Склепіння — лише одна частина.", "Передня стінка — лише одна частина.", "Задня стінка — лише одна частина.", "Дівоча перетинка — лише одна частина.", "Піхва має склепіння, передню і задню стінки та дівочу перетинку."]}], "models": [["Жіночі статеві органи", "sf:a7638a209026490fa3c8a3f9eecafcf9", {"ru": "Женские половые органы", "en": "Female reproductive organs"}], ["Жіночі статеві органи на розрізі", "sf:6c89dc45574c40b3981e8de6310d28d4", {"ru": "Женские половые органы в разрезе", "en": "Female reproductive organs (section)"}], ["Жіночі статеві і сечові органи", "sf:0ba41334eb384f5b999d7469f906d3ae", {"ru": "Женские половые и мочевые органы", "en": "Female reproductive and urinary systems"}]]}, {"id": "topic31a", "title": "31. Органи імунної системи", "tr": {"ru": "31. Органы иммунной системы", "en": "31. Organs of the immune system"}, "questions": [{"n": "31.1", "q": "До педіатра звернулися батьки 10-річної дівчинки зі скаргами на часті інфекційні захворювання, загальну слабкість та збільшення лімфатичних вузлів. Після обстеження лікар встановив патологічні зміни в лімфоїдних органах і пояснив, що порушення функції центральних органів імунної системи може призвести до дефіциту імунних клітин. Які органи відносяться до центральних органів імунної системи?", "o": ["Medulla ossium, thymus.", "Lien.", "Noduli lymphoidei solitarii.", "Tonsillae.", "Noduli lymphoidei aggregati."], "a": [0], "e": ["Центральні органи імунної системи — червоний кістковий мозок і загруднинна залоза.", "Селезінка — периферійний орган.", "Поодинокі вузлики — периферійні утвори.", "Мигдалики — периферійні органи.", "Скупчені вузлики — периферійні утвори."]}, {"n": "31.2", "q": "До імунолога звернувся 25-річний пацієнт зі скаргами на часті респіраторні інфекції та збільшені лімфатичні вузли. Лікар проводить обстеження периферійних органів імунної системи, щоб оцінити їх стан. Під час пояснення пацієнту він зазначає, що деякі органи не належать до периферійних, а виконують іншу функцію. Який орган не відноситься до периферійних органів імунної системи?", "o": ["Noduli lymphoidei solitarii.", "Thymus.", "Tonsillae.", "Noduli lymphoidei aggregati.", "Lien."], "a": [1], "e": ["Поодинокі вузлики — периферійні утвори.", "Загруднинна залоза — центральний орган імунної системи.", "Мигдалики — периферійні.", "Скупчені вузлики — периферійні.", "Селезінка — периферійна."]}, {"n": "31.3", "q": "До педіатра звернулася жінка з 8-річним хлопчиком, який став неуважним, гірше навчається у школі та має утруднене носове дихання. Мати також відзначає, що дитина часто дихає ротом і хропе вночі. Після огляду педіатр запідозрив гіпертрофію аденоїдів і направив хлопчика до ЛОР-лікаря для вирішення питання про їх видалення. Як називається цей мигдалик?", "o": ["Tonsilla tubaria dexter.", "Tonsilla lingualis.", "Tonsilla palatina.", "Tonsilla pharyngea.", "Tonsilla tubaria sinistra."], "a": [3], "e": ["Правий трубний мигдалик лежить біля отвору слухової труби.", "Язиковий мигдалик лежить у корені язика.", "Піднебінний мигдалик лежить між дужками.", "Аденоїди — збільшений глотковий мигдалик на склепінні носоглотки.", "Лівий трубний мигдалик лежить біля отвору слухової труби."]}, {"n": "31.4", "q": "До дільничного лікаря черговий раз звернувся 25-річний чоловік, який часто хворіє на різні інфекційні захворювання (ГРВІ, бактеріальні інфекції). Під час обстеження лікар виявив ознаки первинного імунодефіциту. Лабораторні дослідження показали низький рівень лімфоцитів та порушення утворення імунокомпетентних клітин. Причиною цього може бути дефект диференціювання стовбурових клітин. Де продукуються стовбурові клітини, що є попередниками клітин імунної системи?", "o": ["В червоному кістковому мозку.", "В жовтому кістковому мозку.", "В загруднинній залозі.", "В В-залежних зонах вторинних лімфоїдних органів.", "В селезінці."], "a": [0], "e": ["Стовбурові кровотворні клітини утворюються в червоному кістковому мозку.", "Жовтий кістковий мозок — жирова тканина.", "У загруднинній залозі дозрівають Т-лімфоцити.", "У В-залежних зонах В-клітини проліферують, а не утворюються з стовбурових.", "Селезінка — периферійний орган."]}, {"n": "31.5", "q": "До сімейного лікаря звернувся 18-річний юнак зі скаргами на часті запальні процеси у верхніх і нижніх дихальних шляхах: риніти, ларингіти, бронхіти, пневмонії. Лікар запідозрив порушення імунної системи та направив пацієнта на імунологічне дослідження. Результати показали недостатність клітинного імунітету, який забезпечується Т-лімфоцитами. В якому органі Т-лімфоцити стають повноцінними імунокомпетентними клітинами?", "o": ["В селезінці.", "В печінці.", "В лімфоїдних вузликах.", "В мигдаликах.", "В загруднинній залозі."], "a": [4], "e": ["У селезінці Т-клітини лише заселяють Т-зони.", "Печінка — орган ембріонального кровотворення.", "У вузликах — В-клітини.", "Мигдалики — периферійні органи.", "У загруднинній залозі Т-лімфоцити дозрівають і стають імунокомпетентними."]}, {"n": "31.6", "q": "До інфекціоніста звернувся 35-річний чоловік зі скаргами на постійну слабкість, втрату ваги та часті захворювання органів дихання (пневмонії, бронхіти). Лікар запідозрив імунодефіцит і призначив серологічні тести. Результати підтвердили діагноз СНІД (синдром набутого імунодефіциту). Це захворювання характеризується порушенням продукції клітин для клітинного та гуморального імунітету – В-лімфоцитів та претимічних лімфоцитів. Який орган продукує клітини для клітинного та гуморального імунітету?", "o": ["Мигдалики.", "Селезінка.", "Кістковий мозок.", "Паракортикальна зона лімфатичних вузлів.", "Периартеріальна зона лімфатичних вузлів."], "a": [2], "e": ["Мигдалики — периферійні органи.", "Селезінка — периферійний орган.", "Кістковий мозок утворює В-лімфоцити і попередників Т-лімфоцитів.", "Паракортикальна зона — Т-залежна зона вузла.", "Периартеріальна зона — у селезінці."]}, {"n": "31.7", "q": "До торакального хірурга направлено 6-річну дитину для оперативного втручання з приводу вродженої вади серця. Під час планування операції на органах грудної порожнини лікар повинен чітко знати топографію загруднинної залози, щоб уникнути її ушкодження, оскільки вона відіграє важливу роль у формуванні імунітету. Де знаходиться загруднинна залоза?", "o": ["В передній частині верхнього середостіння.", "В задній частині верхнього середостіння.", "В передній частині нижнього середостіння.", "В середній частині нижнього середостіння.", "B задній частині нижнього середостіння."], "a": [0], "e": ["Загруднинна залоза лежить у передній частині верхнього середостіння, за грудниною.", "У задньому верхньому середостінні — стравохід, трахея.", "Переднє нижнє середостіння — вузька щілина.", "Середнє середостіння містить серце.", "Заднє середостіння — аорта, стравохід."]}, {"n": "31.8", "q": "Хлопчик 8 років отримав травму — ударився лівим боком об щабель драбини. Після огляду та УЗД лікарі запідозрили внутрішню кровотечу. Під час лапаротомії виявлено розрив селезінки, що потребує її видалення (спленектомії). Для цього хірурги повинні перев’язати судини у ділянці воріт селезінки, щоб зупинити кровотечу. Де знаходяться ворота селезінки?", "o": ["На задньому кінці.", "На діафрагмовій поверхні.", "На верхньому краї.", "На нижньому краї.", "На нутрощевій поверхні."], "a": [4], "e": ["На задньому кінці воріт немає.", "Діафрагмова поверхня опукла, без воріт.", "Верхній край має вирізки.", "Нижній край тупий.", "Ворота селезінки розташовані на нутрощевій поверхні."]}, {"n": "31.9", "q": "У хірургічне відділення дитячої лікарні госпіталізований хлопчик з підозрою на розрив селезінки. Під час обстеження орієнтиром для знаходження селезінки служить ліва підреброва ділянка живота. На рівні яких ребер вздовж середньої пахвової лінії проєктується цей орган на грудну клітку?", "o": ["Між V та VІ ребрами.", "Між VII та VIІІ ребрами.", "Між IХ та Х ребрами.", "Між ІХ та ХІ ребрами.", "Між ХІ та ХІІ ребрами."], "a": [3], "e": ["V–VI ребра — надто високо.", "VII–VIII — надто високо.", "IX–X — неповний діапазон.", "Селезінка проєктується між IX і XI ребрами по середній пахвовій лінії.", "XI–XII — надто низько."]}, {"n": "31.10", "q": "У хірургічне відділення госпіталізована жінка з підозрою на інфаркт селезінки, який відбувся після септичного ендокардиту (захворювання внутрішньої оболонки серця). Під час оперативного втручання хірург звертає увагу на те, як покритий цей орган очеревиною і визначає, що селезінка вкрита:", "o": ["Інтраперітонеально.", "Мезоперітонеально.", "Не має відношення до очеревини.", "Екстраперітонеально.", "Знаходиться у заочеревинному просторі."], "a": [0], "e": ["Селезінка вкрита очеревиною з усіх боків (крім воріт) — інтраперитонеально.", "Мезоперитонеально — неправильно.", "Селезінка має відношення до очеревини.", "Не екстраперитонеально.", "Не заочеревинно."]}, {"n": "31.11", "q": "На практичних заняттях з анатомії студенти визначили: селезінка за принципом будови є паренхіматозним органом. Чим утворена паренхіма селезінки?", "o": ["Кірковою та мозковою речовиною.", "Червоним та жовтим тілом.", "Червоним та білястим тілом.", "Червоною та жовтою пульпою.", "Червоною та білою пульпою."], "a": [4], "e": ["Кора і мозкова речовина — у лімфатичного вузла, тимусу.", "Червоне і жовте тіло — неправильні терміни.", "Біле тіло — яєчник.", "Жовтої пульпи немає.", "Паренхіма селезінки — червона і біла пульпа."]}, {"n": "31.12", "q": "У дитячу лікарню госпіталізована дівчинка 10 років з внутрішньочеревною кровотечею. Під час оперативного втручання хірургом діагностовано розрив селезінки з ушкодженням її паренхіми (червоної та білої пульпи). Орган був видалений і направлений на патологоанатомічне дослідження. Яких структур не повинно бути в червоній пульпі?", "o": ["Селезінкових лімфоїдних вузликів.", "Лімфоцитів.", "Петель ретикулярної тканини.", "Лейкоцитів.", "Еритроцитів."], "a": [0], "e": ["Лімфоїдні вузлики належать білій пульпі.", "Лімфоцити є в червоній пульпі.", "Ретикулярна тканина — основа червоної пульпи.", "Лейкоцити є в червоній пульпі.", "Еритроцити — основний вміст червоної пульпи."]}, {"n": "31.13", "q": "Під час оперативного втручання хірург визначив розрив селезінки і необхідність видалення органа. Проводячи патологоанатомічне дослідження видаленої селезінки, лікар встановив ушкодження білої пульпи органа. Яких структур не повинно бути в білій пульпі селезінки?", "o": ["Лімфоїдних навколоартеріальних піхв.", "Селезінкових лімфоїдних вузликів.", "Мієлоїдної тканини.", "Центральної артерії вузлика.", "Петель ретикулярної тканини."], "a": [2], "e": ["Навколоартеріальні піхви — частина білої пульпи.", "Лімфоїдні вузлики — частина білої пульпи.", "Мієлоїдної тканини в білій пульпі немає.", "Центральна артерія — частина вузлика.", "Ретикулярна тканина — основа білої пульпи."]}, {"n": "31.14", "q": "У лікарню госпіталізовано чоловіка 40 років із підозрою на патологію, що уражає кістковий мозок. Відомо, що при ушкодженні кісткового мозку порушуються процеси кровотворення та імунного захисту організму. Це пояснюється тим, що кістковий мозок є центральним органом імунної системи, який забезпечує гуморальний імунітет шляхом продукції певних клітин. Які клітини синтезує кістковий мозок для реалізації гуморального імунітету?", "o": ["В-лімфоцити.", "Т-лімфоцити.", "Лейкоцити.", "Еритроцити.", "Моноцити."], "a": [0], "e": ["Для гуморального імунітету кістковий мозок утворює В-лімфоцити.", "Т-лімфоцити забезпечують клітинний імунітет.", "Лейкоцити — загальна назва.", "Еритроцити переносять кисень.", "Моноцити — фагоцити."]}, {"n": "31.15", "q": "Під час вивчення будови селезінки студент визначає, що селезінка – паренхіматозний орган. Що утворює строму цього органа?", "o": ["Червона пульпа.", "Очеревина.", "Біла пульпа.", "Ретикулярна сполучна тканина та селезінкові перекладки.", "Біла пульпа."], "a": [3], "e": ["Червона пульпа — паренхіма.", "Очеревина — зовнішній покрив.", "Біла пульпа — паренхіма.", "Строму селезінки утворюють ретикулярна тканина і селезінкові перекладки (з капсулою).", "Біла пульпа — паренхіма."]}, {"n": "31.16", "q": "У лікарню госпіталізовано чоловіка 40 років з підозрою на хворобу, пов’язану з ураженням кісткового мозку. Тиждень тому під час проведення лабораторного експерименту чоловік отримав гамма-опромінювання. Під час обстеження виявлені показники порушення кровотворної і імунної функції організму. Що продукує кістковий мозок для забезпечення гуморального імунітету в нормі?", "o": ["Моноцити.", "Еритроцити.", "В-лімфоцити.", "Лейкоцити.", "Т-лімфоцити."], "a": [2], "e": ["Моноцити не забезпечують гуморальний імунітет.", "Еритроцити не беруть участі в імунітеті.", "Кістковий мозок утворює В-лімфоцити — основу гуморального імунітету.", "Лейкоцити — загальна назва білих клітин крові, не специфічні для гуморального імунітету.", "Т-лімфоцити забезпечують клітинний імунітет і дозрівають у тимусі."]}, {"n": "31.17", "q": "Під час оперативного втручання з приводу видалення червоподібного відростка (апендектомія) хірург звернув увагу на особливість його стінки — наявність численних лімфоїдних утворів. Ці структури належать до периферійних органів імунної системи та відіграють важливу роль у формуванні місцевого імунного захисту травного каналу. Які елементи імунної системи виявляються в стінці червоподібного відростка?", "o": ["Скупчені лімфоїдні вузлики.", "Одинокі лімфоїдні вузлики.", "Слизові залози.", "Вузли червоподібного відростка.", "Приободовокишкові вузли."], "a": [0], "e": ["У стінці червоподібного відростка є численні скупчені лімфоїдні вузлики.", "Поодинокі вузлики теж є, але характерні скупчені.", "Слизові залози — не імунні утвори.", "Вузли відростка лежать у брижі.", "Приободовокишкові вузли — поза стінкою."]}, {"n": "31.18", "q": "Після оперативного втручання з приводу гнійного апендициту у підлітка 14 років, лікар виявив в стінці видаленого червоподібного відростка наявність елементів, які відносять до периферійних органів імунної систем. Які це елементи?", "o": ["Клубово-ободовокишкові вузли.", "Поодинокі лімфоїдні вузлики.", "Вузли червоподібного відростка.", "Скупчені лімфоїдні вузлики.", "Приободовокишкові вузли."], "a": [3], "e": ["Клубово-ободовокишкові вузли лежать поза стінкою.", "Поодинокі вузлики є, але характерні скупчені.", "Вузли відростка лежать у брижі.", "У стінці червоподібного відростка — скупчені лімфоїдні вузлики.", "Приободовокишкові вузли лежать поза стінкою."]}, {"n": "31.19", "q": "Під час обстеження 14-річної дівчинки, лікар виявив запалення трубного мигдалика. Біля якого отвору розташований трубний мигдалик?", "o": ["Внутрішнього слухового ходу.", "Перешийком слухової труби.", "Зовнішнього слухового ходу.", "Барабанного отвору слухової труби.", "Глоткового отвору слухової труби."], "a": [4], "e": ["Внутрішній слуховий хід — у піраміді скроневої кістки.", "Перешийок — найвужче місце труби.", "Зовнішній слуховий хід — у вусі.", "Барабанний отвір — у барабанній порожнині.", "Трубний мигдалик лежить біля глоткового отвору слухової труби."]}, {"n": "31.20", "q": "До лікаря звернувся чоловік 25 років, у якого під час огляду відмічається блідість шкіри, пастозність, добре розвинена жирова клітковина, спостерігається збільшення загруднинної залози. Результати обстеження чоловіка вказують на симптоми, що притаманні клінічній картині зоболімфатичного стану, в патогенезі якого є ушкодження паренхіми загруднинної залози. Чим представлена паренхіма загруднинної залози?", "o": ["Червоним і білястим тілом.", "Часточками.", "Залозистою паренхімою.", "Білою і червоною пульпою.", "Жовтим і білястим тілом."], "a": [1], "e": ["Червоне і біле тіло — не тимус.", "Паренхіма загруднинної залози складається з часточок (кірка і мозкова речовина).", "Залозиста паренхіма — простата.", "Пульпа — селезінка.", "Жовте тіло — яєчник."]}, {"n": "31.21", "q": "Оглядаючи мигдалики глоткового лімфоїдного кільця, студенти визначили, що кожний із мигдаликів має елементи, притаманні для них усіх. Які це елементи?", "o": ["Мигдаликові частки.", "Мигдаликові горбки.", "Мигдаликові крипти.", "Мигдаликові боріздки.", "Мигдаликові пазухи."], "a": [2], "e": ["Часток у мигдаликів немає.", "Горбків немає.", "Усі мигдалики мають крипти (заглиблення епітелію).", "Боріздки не є загальною ознакою.", "Пазух немає."]}, {"n": "31.22", "q": "На практичному занятті студенти вивчають особливості слизової оболонки тонкої кишки, підкреслюючи, що в слизовій оболонці трубчастих органів травного каналу є скупчені лімфоїдні вузлики. Де вони розташовані?", "o": ["У клубовій кишці та червоподібному відростку.", "У шлунку.", "У сигмоподібній ободовій кишці.", "У сліпій кишці.", "В ампулі прямої кишки."], "a": [0], "e": ["Скупчені лімфоїдні вузлики є в клубовій кишці і червоподібному відростку.", "У шлунку — поодинокі вузлики.", "У сигмоподібній кишці — поодинокі.", "У сліпій кишці — поодинокі.", "У прямій кишці — поодинокі."]}, {"n": "31.23", "q": "До лікаря звернулася мати з 9-річним хлопчиком, у якого спостерігаються скарги на біль у горлі та утруднене ковтання. Під час огляду лікар виявив запалення мигдаликів, розташованих у мигдаликових ямках між дужками м'якого піднебіння. Ці анатомічні утвори входять до глоткового лімфоїдного кільця, що виконує захисну функцію на межі ротової порожнини та глотки. Які саме мигдалики глоткового лімфоїдного кільця Пирогова–Вальдейєра уражені?", "o": ["Язиковий мигдалик.", "Глотковий мигдалик.", "Трубні мигдалики.", "Піднебінні мигдалики.", "Усі."], "a": [3], "e": ["Язиковий мигдалик лежить у корені язика.", "Глотковий мигдалик — на склепінні глотки.", "Трубні мигдалики — біля слухових труб.", "Піднебінні мигдалики лежать у мигдаликових ямках між дужками.", "Уражені лише піднебінні."]}, {"n": "31.24", "q": "На практичному занятті студенти вивчають особливості слизової оболонки клубової кишки. Як відомо, в клубовій кишці знаходяться скупчені лімфоїдні вузлики. Викладач просить продемонструвати скупчені лімфоїдні вузлики. Де розташовані скупчені лімфоїдні вузлики?", "o": ["В слизовій оболонці на стінці, переважено навпроти брижового краю кишки.", "В слизовій оболонці на стінці, до якої прикріплюється брижа.", "В серозній оболонці.", "В підсерозному прошарку.", "В коловому шарі м`язової оболонки."], "a": [0], "e": ["Бляшки Пеєра розташовані в слизовій оболонці, переважно навпроти брижового краю кишки.", "Біля брижового краю бляшок немає.", "Серозна оболонка лімфоїдних вузликів не містить.", "Підсерозна основа їх не містить.", "М’язова оболонка їх не містить."]}, {"n": "31.25", "q": "До оториноларинголога звернулася мати 6-річної дівчинки зі скаргами на утруднене носове дихання у дитини, хропіння під час сну та часті отити. Під час огляду дитини лікар виявив запалення глоткового мигдалика (аденоїдит), який значно збільшений у розмірах і перекриває носоглотку. Лікар рекомендує оперативне втручання (аденотомію), оскільки консервативне лікування не покращило стан дитини. Де знаходиться глотковий мигдалик?", "o": ["На задній стінці носової частини глотки.", "В трубно-глотковій складці.", "В надгортанній долинці.", "В гортанній частині глотки.", "В ротовій частині глотки."], "a": [0], "e": ["Глотковий мигдалик лежить на задньо-верхній стінці носової частини глотки.", "У трубно-глотковій складці — трубний мигдалик.", "У надгортанній долинці мигдалика немає.", "У гортанній частині мигдалика немає.", "У ротовій частині — піднебінні мигдалики."]}, {"n": "31.26", "q": "До лікаря-терапевта звернулася жінка 42 років зі скаргами на тупий біль у лівому підребер’ї, відчуття тяжкості після їжі та періодичну слабкість. Під час огляду виявлено: шкіра бліда, пульс прискорений. Лікар запідозрив спленомегалію (збільшення селезінки), що може бути пов’язане з анемією або інфекційним процесом. Для підтвердження діагнозу він проводить пальпацію органів черевної порожнини. В якій ділянці лікар пальпує селезінку?", "o": ["В правому підреберʼї.", "В лівому підреберʼї.", "В лівій бічній ділянці живота.", "В правій бічній ділянці живота.", "В пупковій ділянці."], "a": [1], "e": ["У правому підребер’ї — печінка.", "Селезінку пальпують у лівому підребер’ї.", "Ліва бічна ділянка — нижче.", "Права бічна ділянка — висхідна кишка.", "Пупкова ділянка — тонка кишка."]}, {"n": "31.27", "q": "До хірургічного відділення потрапив пацієнт 35 років після ДТП зі скаргами на біль у лівому підребер’ї та запаморочення. При огляді: блідість шкіри, тахікардія, артеріальний тиск знижений. УЗД показало вільну рідину в черевній порожнині та ушкодження селезінки. Лікар готується до операції та пояснює студентам, що селезінка має кілька поверхонь, які відповідають органам, що прилягають до неї. Це важливо для розуміння топографії та можливих ускладнень при травмі. Яких поверхонь немає на селезінці?", "o": ["Діафрагмової поверхні.", "Нутрощевої поверхні.", "Ниркової поверхні.", "Шлункової поверхні.", "Порожньокишкової поверхні."], "a": [4], "e": ["Діафрагмова поверхня є.", "Нутрощева поверхня є.", "Ниркова поверхня є.", "Шлункова поверхня є.", "Порожньокишкової поверхні на селезінці немає (є ободовокишкова)."]}, {"n": "31.28", "q": "До торакального хірурга звернувся пацієнт 25 років із пухлиною загруднинної, виявлению під час проведення КТ-обстеження. Лікар планує оперативне втручання та пояснює студентам, що важливо знати топографію загруднинної залози (thymus), оскільки вона розташована в передньому середостінні і прилягає до життєво важливих структур. До чого прилягає загруднинна залоза?", "o": ["До судин основи серця і осердя.", "До лівої легені.", "До правої легені.", "До щитоподібної залози.", "До гортанної частини глотки."], "a": [0], "e": ["Загруднинна залоза прилягає до судин основи серця і осердя.", "До легень прилягає лише краями.", "До легень прилягає лише краями.", "Щитоподібна залоза лежить вище.", "Гортанна частина глотки лежить вище."]}, {"n": "31.29", "q": "До ЛОР-лікаря звернулася мати 8-річної дівчинки зі скаргами на утруднене ковтання, біль у горлі та неприємний запах із ротової порожнини. При огляді лікар виявив гіпертрофію язикового мигдалика, який є частиною глоткового лімфоїдного кільця Пирогова–Вальдейєра. Лікар пояснює, що цей мигдалик може запалюватися так само, як піднебінні, викликаючи дискомфорт і порушення ковтання. В якій ділянці язика знаходиться язиковий мигдалик?", "o": ["На верхівці язика.", "На тілі язика.", "На корені язика.", "На спинкці язика.", "На нижній поверхні язика."], "a": [2], "e": ["На верхівці мигдалика немає.", "На тілі мигдалика немає.", "Язиковий мигдалик лежить у корені язика.", "Спинка — верхня поверхня тіла.", "На нижній поверхні мигдалика немає."]}, {"n": "31.30", "q": "Під час обстеження органів черевної порожнини хірург виявив опущення селезінки внаслідок порушення її фіксації. Яка зв’язка не бере участі в фіксації селезінки?", "o": ["Ligamentum phrenicоsplenicum.", "Ligamentum hepatorenale.", "Ligamentum lienorenale.", "Ligamentum splenocolicum.", "Ligamentum gastrolienale."], "a": [1], "e": ["Діафрагмово-селезінкова зв’язка фіксує селезінку.", "Печінково-ниркова зв’язка до селезінки не належить.", "Селезінково-ниркова зв’язка фіксує селезінку.", "Селезінково-ободова зв’язка фіксує селезінку.", "Шлунково-селезінкова зв’язка фіксує селезінку."]}], "models": [["Лімфатична система", "sf:14800d739ecb46678d7584a401b0aa77", {"ru": "Лимфатическая система", "en": "Lymphatic system"}], ["Будова лімфатичного вузла", "sf:cc6896de8309441aabcefecb2d3f9b50", {"ru": "Строен
