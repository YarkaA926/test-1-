на кістка (os sphenoidale).", "Піднебінна кістка (os palatinum)."], "a": [4], "e": ["Верхня щелепа утворює передні 2/3 піднебіння, без малих піднебінних отворів.", "Решітчаста кістка не бере участі в утворенні піднебіння.", "Лобова кістка не бере участі в утворенні піднебіння.", "Клиноподібна кістка не має піднебінних отворів.", "Малі піднебінні отвори розташовані на пірамідному відростку піднебінної кістки."]}, {"n": "5.18", "q": "У жінки 45 років з черепно-мозковою травмою під час рентгенологічного обстеження лікар виявив перелом кістки лицевого черепа. Лінія перелому проходить по щелепно-під'язиковій лінії (linea mylohyoidea). Яка кістка травмована?", "o": ["Верхня щелепа (maxilla).", "Сльозова кістка (os lacrimale).", "Вилична кістка (os zygomaticum).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [3], "e": ["Верхня щелепа не має щелепно-під'язикової лінії.", "Сльозова кістка не має такої лінії.", "Вилична кістка не має такої лінії.", "Щелепно-під'язикова лінія — на внутрішній поверхні тіла нижньої щелепи, місце кріплення однойменного м'яза.", "Піднебінна кістка не має такої лінії."]}, {"n": "5.19", "q": "З місця спортивних змагань у лікарню доставлений чоловік з травмою обличчя. Лікар на рентген-зображенні виявив перелом кістки лицевого черепа. Лінія перелому проходить через підочноямковий край (margo infraorbitalis). Яка кістка травмована?", "o": ["Сльозова кістка (os lacrimale).", "Верхня щелепа (maxilla).", "Носова кістка (os nasale).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Сльозова кістка розташована на присередній стінці очної ямки.", "Підочноямковий край утворений верхньою щелепою (разом з виличною кісткою).", "Носова кістка утворює спинку носа.", "Нижня щелепа не утворює країв очної ямки.", "Піднебінна кістка — глибоко в черепі."]}, {"n": "5.20", "q": "У хірургічне відділення доставлений чоловік 35 років з черепно-мозковою травмою. Лікар виявив ушкодження кістки черепа, яка приймає участь в утворенні бічної та нижньої стінок правої очної ямки. Яка кістка ушкоджена в цьому випадку?", "o": ["Права лобова кістка.", "Права вилична кістка.", "Права клиноподібна кістка.", "Права решітчаста кістка.", "Права верхня щелепа."], "a": [1], "e": ["Лобова кістка утворює верхню стінку очної ямки.", "Вилична кістка бере участь в утворенні і бічної, і нижньої стінок очної ямки.", "Клиноподібна кістка утворює бічну стінку ззаду, але не нижню.", "Решітчаста кістка утворює присередню стінку.", "Верхня щелепа утворює нижню стінку, але не бічну."]}, {"n": "5.21", "q": "У чоловіка 45 років гнійне запалення слизової оболонки носової порожнини поширилося у передню черепну ямку. Через який анатомічний утвір розповсюдилося запалення?", "o": ["Foramina cribrosa.", "Foramen ovale.", "Foramen ethmoidalae posterius.", "Foramen sphenopalatinum.", "Foramen rotundum."], "a": [0], "e": ["Отвори дірчастої пластинки (foramina cribrosa) з'єднують носову порожнину з передньою черепною ямкою.", "Овальний отвір з'єднує середню черепну ямку з підскроневою ямкою.", "Задній решітчастий отвір з'єднує очну ямку з порожниною черепа.", "Клино-піднебінний отвір з'єднує носову порожнину з крило-піднебінною ямкою.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою."]}, {"n": "5.22", "q": "Лікар, з метою знеболювання великих кутніх зубів, зробив пацієнту ін'єкцію анестетика (знеболюючої речовини) до утвору верхньої щелепи, що є місцем входу нервів з підскроневої ямки через foramina alveolaria до задніх зубних комірок. У ділянці якого утвору верхньої щелепи лікар зробив ін'єкцію анестетика?", "o": ["Sinus maxillaris.", "Processus frontalis", "Processus palatinus.", "Processus alveolaris.", "Tuber maxillae."], "a": [4], "e": ["Верхньощелепна пазуха — порожнина, а не місце ін'єкції.", "Лобовий відросток іде догори до лобової кістки.", "Піднебінний відросток утворює тверде піднебіння.", "Комірковий відросток містить комірки зубів, але comірчасті отвори для задніх зубів — на горбі.", "Горб верхньої щелепи (tuber maxillae) має коміркові отвори для задніх верхніх коміркових нервів."]}, {"n": "5.23", "q": "Під час проведення хірургічної операції з метою закриття вродженого розщеплення твердого піднебіння (уранопластики), при збиванні долотом крилоподібного гачка, ушкоджено великий піднебінний канал. Виникла кровотеча, яку можна зупинити лише шляхом тампонади каналу. Які кістки черепа утворюють цей канал?", "o": ["Піднебінна кістка та верхня щелепа.", "Піднебінна кістка та решітчаста кістка.", "Верхня щелепа та нижня носова раковина.", "Піднебінна кістка та нижня носова раковина.", "Піднебінна кістка та клиноподібна кістка."], "a": [0], "e": ["Великий піднебінний канал утворений великими піднебінними борознами піднебінної кістки та верхньої щелепи.", "Решітчаста кістка не бере участі в утворенні каналу.", "Нижня носова раковина не утворює піднебінного каналу.", "Нижня носова раковина не бере участі.", "Клиноподібна кістка лише межує ззаду, канал утворюють піднебінна кістка та верхня щелепа."]}, {"n": "5.24", "q": "Хірург, оперуючи жінку 50 років з пухлиною твердого піднебіння (palatum durum), видалив разом з пухлиною і третину тої частини верхньої щелепи (maxilla), що бере участь в утворенні кісткового піднебіння (palatum osseum). Яку частину верхньої щелепи видалив хірург?", "o": ["Тіло верхньої щелепи (corpus maxillae).", "Лобовий відросток (processus frontalis).", "Виличний відросток (processus zygomaticus).", "Піднебінний відросток (processus palatinus).", "Комірковий відросток (processus alveolaris)."], "a": [3], "e": ["Тіло верхньої щелепи містить пазуху, але піднебіння не утворює.", "Лобовий відросток іде догори.", "Виличний відросток з'єднується з виличною кісткою.", "Піднебінний відросток утворює передні 2/3 кісткового піднебіння.", "Комірковий відросток містить зуби, а не утворює піднебіння."]}, {"n": "5.25", "q": "У лікарню госпіталізовано чоловіка 45 років з травмою голови. Після обстеження лікар діагностував перелом кістки лицевого черепа. Лінія перелому проходить через виростковий відросток (processus condylaris). Яка кістка травмована?", "o": ["Верхня щелепа (maxilla).", "Нижня щелепа (mandibula).", "Вилична кістка (os zygomaticum).", "Сльозова кістка (os lacrimale).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Верхня щелепа не має виросткового відростка.", "Виростковий відросток — задній відросток гілки нижньої щелепи з голівкою для суглоба.", "Вилична кістка не має виросткового відростка.", "Сльозова кістка не має відростків.", "Піднебінна кістка не має виросткового відростка."]}, {"n": "5.26", "q": "У лікарню госпіталізовано чоловіка 45 років з черепно-мозковою травмою, що сталася під час дорожньо-транспортної пригоди. Після обстеження лікар виявив перелом кістки черепа. Лінія перелому проходить через підборідний виступ (protuberantia mentale). Яка кістка травмована?", "o": ["Нижня щелепа (mandibula).", "Верхня щелепа (maxilla).", "Вилична кістка (os zygomaticum).", "Леміш (vomer).", "Піднебінна кістка (os palatinum)."], "a": [0], "e": ["Підборідний виступ розташований на передній поверхні тіла нижньої щелепи.", "Верхня щелепа не має підборідного виступу.", "Вилична кістка не має підборідного виступу.", "Леміш — кістка носової перегородки.", "Піднебінна кістка розташована в піднебінні."]}, {"n": "5.27", "q": "У чоловіка 45 років, що госпіталізований в ЛОР-відділення лікарні, виявлена пухлина сльозового мішка в ділянці сльозової борозни. Які кістки лицевого черепа мають сльозову борозну?", "o": ["Піднебінна кістка та верхня щелепа.", "Сльозова кістка та верхня щелепа.", "Сльозова кістка та нижня носова раковина.", "Верхня щелепа та нижня носова раковина.", "Піднебінна кістка та нижня носова раковина."], "a": [1], "e": ["Піднебінна кістка не має сльозової борозни.", "Сльозову борозну мають сльозова кістка та лобовий відросток верхньої щелепи — разом вони утворюють ямку сльозового мішка.", "Нижня носова раковина має сльозовий відросток, але не борозну.", "Нижня носова раковина не має сльозової борозни.", "Піднебінна кістка та раковина не мають сльозової борозни."]}, {"n": "5.28", "q": "У лікарню каретою швидкої медичної допомоги доставлено чоловіка 56 років з травмою носа. Після рентгенологічного обстеження лікарем був діагностований перелом кістки лицевого черепа, що обмежує верхній край грушоподібного отвору кісткової носової порожнини. Яка кістка ушкоджена в даному випадку?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [3], "e": ["Сльозова кістка розташована в очній ямці.", "Верхня щелепа обмежує грушоподібний отвір знизу і з боків.", "Лобова кістка не обмежує грушоподібний отвір.", "Верхній край грушоподібного отвору утворюють носові кістки.", "Решітчаста кістка розташована глибше в носовій порожнині."]}, {"n": "5.29", "q": "Обстежуючи жінку 35 років, лікар діагностував розповсюдження запалення з ділянки іклової ямки в очну ямку. На якій кістці розташована іклова ямка?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [1], "e": ["Сльозова кістка — у присередній стінці очної ямки.", "Іклова ямка розташована на передній поверхні тіла верхньої щелепи під підочноямковим отвором.", "Лобова кістка не має іклової ямки.", "Носова кістка не має іклової ямки.", "Решітчаста кістка не має іклової ямки."]}, {"n": "5.30", "q": "В діагностичному центрі на МРТ у жінки 36 років виявлено звуження просвіту foramen jugulare dexter, що спричинило розвиток неврологічного захворювання. Між якими кістками черепа виявлено звуження яремного отвору?", "o": ["Потиличною та лобовою кістками.", "Скроневою та клиноподібною кістками.", "Потиличною та клиноподібною кістками.", "Скроневою та потиличною кістками.", "Клиноподібною та піднебінною кісткам"], "a": [3], "e": ["Лобова кістка не утворює яремного отвору.", "Клиноподібна кістка не утворює яремного отвору.", "Клиноподібна кістка не утворює яремного отвору.", "Яремний отвір утворений яремними вирізками скроневої та потиличної кісток.", "Піднебінна кістка розташована в лицевому черепі."]}], "models": [["Череп — розібраний на кістки", "o3d:exploded-skull", {"ru": "Череп, разобранный на кости", "en": "Exploded skull"}], ["Кістки черепа різними кольорами", "sf:d1d1aed420424c8db784391ad8261a2f", {"ru": "Кости черепа разными цветами", "en": "Colour-coded skull bones"}], ["Череп, що «розлітається» на кістки", "sf:252887e2e755427c90d9e3d0c6d3025f", {"ru": "Череп, «разлетающийся» на кости", "en": "Exploding skull animation"}]]}, {"id": "topic6", "title": "6. Очна ямка. Кісткова носова порожнина. Кісткове піднебіння", "tr": {}, "questions": [{"n": "6.1", "q": "Під час обстеження жінки 26 років лікар діагностував запалення слизової оболонки верхньощелепної пазухи (sinus maxillaris). Під час обстеження в одному із носових ходів був виявлений гній, що затікав з верхньощелепної пазухи. У який носовий хід відкривається вічко sinus maxillaris?", "o": ["Meatus nasi medius.", "Meatus nasi superior.", "Meatus nasi communis.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [0], "e": ["Верхньощелепна пазуха відкривається півмісяцевим розтвором у середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід — щілина біля перегородки, пазухи в нього не відкриваються.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід з'єднує носову порожнину з глоткою."]}, {"n": "6.2", "q": "У чоловіка 56 років, що страждає на хронічний риніт, з'явилися симптоми запалення слизової оболонки лобової пазухи. Через який утвір кісткової носової порожнини стало можливим розповсюдження інфекції в лобову пазуху та виникнення фронтиту?", "o": ["Клино-решітчастий закуток.", "Клино-піднебінний отвір.", "Півмісяцевий розтвір.", "Решітчасті комірки.", "Решітчасту лійку."], "a": [4], "e": ["У клино-решітчастий закуток відкривається клиноподібна пазуха.", "Клино-піднебінний отвір веде до крило-піднебінної ямки.", "Півмісяцевий розтвір — щілина, куди відкривається верхньощелепна пазуха; лобова — через лійку.", "Решітчасті комірки — окремі повітроносні порожнини.", "Лобова пазуха відкривається через решітчасту лійку в середній носовий хід."]}, {"n": "6.3", "q": "У жінки 23 роки після травми ока виникло гнійне запалення м'яких тканин очної ямки, яке пізніше поширилось у підскроневу ямку. Через який анатомічний утвір гнійний процес поширився у підскроневу ямку?", "o": ["Через нижню очноямкову щілину.", "Через круглий отвір.", "Через клинопіднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [0], "e": ["Нижня очноямкова щілина з'єднує очну ямку з підскроневою і крило-піднебінною ямками.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою, а не очну ямку.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Вилично-очноямковий отвір веде у канал виличної кістки, а не в підскроневу ямку."]}, {"n": "6.4", "q": "Жінка 58 років госпіталізована в нейрохірургічне відділення з внутрішньочерепною пухлиною. Додаткове обстеження хворої показало, що пухлина зруйнувала передню половину верхньої стінки очної ямки. Яка кістка ушкоджена пухлиною?", "o": ["Клиноподібна кістка.", "Скронева кістка.", "Лобова кістка.", "Решітчаста кістка.", "Носова кістка."], "a": [2], "e": ["Клиноподібна кістка (мале крило) утворює задню частину верхньої стінки.", "Скронева кістка не бере участі в утворенні очної ямки.", "Передню (більшу) частину верхньої стінки очної ямки утворює очноямкова частина лобової кістки.", "Решітчаста кістка утворює присередню стінку.", "Носова кістка не бере участі в утворенні очної ямки."]}, {"n": "6.5", "q": "У чоловіка 26 років після травми ока виникло гнійне запалення м'яких тканин очної ямки. Пізніше інфекція поширилась у крило-піднебінну ямку. Через який анатомічний утвір гнійний процес поширився у крило-піднебінну ямку?", "o": ["Через круглий отвір.", "Через нижню очноямкову щілину.", "Через клино-піднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [1], "e": ["Круглий отвір веде з крило-піднебінної ямки в середню черепну ямку, а не в очну ямку.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина веде в середню черепну ямку.", "Вилично-очноямковий отвір веде у вилично-лицевий і вилично-скроневий канальці."]}, {"n": "6.6", "q": "Лікар, обстежуючи носову порожнину жінки 26 років, виявив звуження одного із носових ходів доброякісною пухлиною в ділянці проєкції canalis incisivus. Який носовий хід звужений в даному випадку?", "o": ["Meatus nasi communis.", "Meatus nasi superior.", "Meatus nasi interior.", "Meatus nasi medius.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — щілина біля перегородки.", "Верхній носовий хід розташований високо, біля решітчастої кістки.", "Носовий отвір різцевого каналу відкривається на дні носової порожнини в ділянці нижнього носового ходу.", "Середній носовий хід — під середньою раковиною, туди відкриваються пазухи.", "Носоглотковий хід — задній відділ."]}, {"n": "6.7", "q": "Хірург виявив у чоловіка 52 років гнійне запалення шкіри в підочноямковій ділянці. Лікар прогнозує можливість поширення запалення в очну ямку. Через який анатомічний утвір можливо поширення інфекції в даному випадку?", "o": ["Canalis incisivus.", "Canalis pterygoideus.", "Canalis nasolacrimalis.", "Canalis infraorbitalis.", "Fissura orbitalis inferior."], "a": [3], "e": ["Різцевий канал з'єднує носову порожнину з ротовою.", "Крилоподібний канал з'єднує ділянку рваного отвору з крило-піднебінною ямкою.", "Носо-сльозовий канал з'єднує очну ямку з нижнім носовим ходом.", "Підочноямковий канал відкривається підочноямковим отвором на обличчі й веде до очної ямки — шлях інфекції з підочноямкової ділянки.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною та підскроневою ямками, а не з обличчям."]}, {"n": "6.8", "q": "У чоловіка 57 років з абсцесом в підскроневій ямці з'явилося ускладнення у вигляді запалення тканин, що оточують очне яблуко. Крізь яке сполучення підскроневої ямки з очною ямкою поширилося запалення?", "o": ["Canalis palatinus major.", "Fissura orbitalis superior.", "Foramen sphenopalatinum.", "Fissura orbitalis inferior.", "Canalis pterygoideus."], "a": [3], "e": ["Великий піднебінний канал з'єднує крило-піднебінну ямку з ротовою порожниною.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Нижня очноямкова щілина з'єднує очну ямку з підскроневою ямкою.", "Крилоподібний канал з'єднує ділянку рваного отвору з крило-піднебінною ямкою."]}, {"n": "6.9", "q": "У жінки 45 років, що страждає на запалення слизової оболонки клиноподібної пазухи, лікар спостерігає відтік мутної рідини з отвору цієї пазухи. У який відділ носової порожнини спочатку потрапляє ексудат з клиноподібної пазухи?", "o": ["Meatus nasi inferior.", "Infundibulum.", "Meatus nasi medius", "Recessus sphenoethmoidalis.", "Meatus nasi communis."], "a": [3], "e": ["У нижній носовий хід відкривається носо-сльозова протока.", "У решітчасту лійку відкривається лобова пазуха.", "У середній носовий хід відкриваються верхньощелепна, лобова пазухи та передні й середні решітчасті комірки.", "Клиноподібна пазуха відкривається в клино-решітчастий закуток над верхньою носовою раковиною.", "Загальний носовий хід не має отворів пазух."]}, {"n": "6.10", "q": "У чоловіка 26 років рентгенологічно виявлено скупчення гною у верхньощелепній пазусі справа. У який із носових ходів спочатку буде прямувати гній?", "o": ["У правий нижній носовий.", "У правий середній носовий.", "У правий верхній носовий.", "У правий загальний носовий.", "У правий носоглотковий."], "a": [1], "e": ["У нижній носовий хід відкривається носо-сльозова протока.", "Верхньощелепна пазуха відкривається в середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід не має отворів пазух.", "Носоглотковий хід веде в глотку."]}, {"n": "6.11", "q": "Після пластичної операції на піднебінні у чоловіка виникло ускладнення у вигляді запалення кістки у ділянці розташування малих піднебінних отворів (foramina palatina minora). Яка кістка уражена запаленням?", "o": ["Верхня щелепа (maxilla).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Клиноподібна кістка (os sphenoidale).", "Піднебінна кістка (os palatinum)."], "a": [4], "e": ["Верхня щелепа утворює передні 2/3 піднебіння, без малих піднебінних отворів.", "Решітчаста кістка не бере участі в утворенні піднебіння.", "Лобова кістка не бере участі в утворенні піднебіння.", "Клиноподібна кістка не має піднебінних отворів.", "Малі піднебінні отвори розташовані на пірамідному відростку піднебінної кістки."]}, {"n": "6.12", "q": "З місця спортивних змагань у лікарню доставлено спортсмена з травмою обличчя. Лікар встановив перелом кістки лицевого черепа. Лінія перелому проходить через підочноямковий край (margo infraorbitalis). Яка кістка травмована?", "o": ["Сльозова кістка (os lacrimale).", "Верхня щелепа (maxilla).", "Носова кістка (os nasale).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Сльозова кістка розташована на присередній стінці очної ямки.", "Підочноямковий край утворений верхньою щелепою (разом з виличною кісткою).", "Носова кістка утворює спинку носа.", "Нижня щелепа не утворює країв очної ямки.", "Піднебінна кістка — глибоко в черепі."]}, {"n": "6.13", "q": "У хірургічне відділення госпіталізовано чоловіка 46 років з черепно-мозковою травмою. Лікар, під час проведення МРТ-дослідження, виявив ушкодження кістки черепа, що приймає участь в утворенні бічної та нижньої стінок правої очної ямки. Яка кістка ушкоджена в цьому випадку?", "o": ["Права лобова кістка.", "Права вилична кістка.", "Права клиноподібна кістка.", "Права решітчаста кістка.", "Права верхня щелепа."], "a": [1], "e": ["Лобова кістка утворює верхню стінку очної ямки.", "Вилична кістка бере участь в утворенні і бічної, і нижньої стінок очної ямки.", "Клиноподібна кістка утворює бічну стінку ззаду, але не нижню.", "Решітчаста кістка утворює присередню стінку.", "Верхня щелепа утворює нижню стінку, але не бічну."]}, {"n": "6.14", "q": "У жінки 34 років після гнійного запалення слизової оболонки носової порожнини інфекція поширилася у передню черепну ямку. Через який анатомічний утвір розповсюдилось запалення?", "o": ["Foramina cribrosa.", "Foramen ovale.", "Foramen ethmoidale posterius.", "Foramen sphenopalatinum.", "Foramen rotundum."], "a": [0], "e": ["Отвори дірчастої пластинки (foramina cribrosa) з'єднують носову порожнину з передньою черепною ямкою.", "Овальний отвір з'єднує середню черепну ямку з підскроневою ямкою.", "Задній решітчастий отвір з'єднує очну ямку з порожниною черепа.", "Клино-піднебінний отвір з'єднує носову порожнину з крило-піднебінною ямкою.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою."]}, {"n": "6.15", "q": "Обстежуючи чоловіка 30 років, офтальмолог виявив у нього порушення відпливу сльози в нижній носовий хід. Крізь яке сполучення очної ямки з нижнім носовим ходом в даному випадку ускладнено проходження сльози?", "o": ["Носо-сльозовий канал.", "Передній решітчастий отвір.", "Верхню очноямкову щілину.", "Нижню очноямкову щілину.", "Задній решітчастий отвір."], "a": [0], "e": ["Носо-сльозовий канал з'єднує очну ямку з нижнім носовим ходом, через нього відтікає сльоза.", "Передній решітчастий отвір з'єднує очну ямку з передньою черепною ямкою.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною та підскроневою ямками.", "Задній решітчастий отвір веде до задніх решітчастих комірок."]}, {"n": "6.16", "q": "У жінки 40 років з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми ураження клиноподібної пазухи. Через який утвір стало можливим розповсюдження інфекції з носової порожнини в цю пазуху?", "o": ["Півмісяцевий розтвір.", "Клино-піднебінний отвір.", "Овальний отвір.", "Отвір клиноподібної пазухи.", "Круглий отвір."], "a": [3], "e": ["Через півмісяцевий розтвір сполучаються верхньощелепна пазуха та середній носовий хід.", "Клино-піднебінний отвір веде в крило-піднебінну ямку.", "Овальний отвір розташований у великому крилі й веде в підскроневу ямку.", "Клиноподібна пазуха відкривається власним отвором (apertura sinus sphenoidalis) у клино-решітчастий закуток.", "Круглий отвір пропускає верхньощелепний нерв."]}, {"n": "6.17", "q": "Хірург, оперуючи жінку 45 років з пухлиною твердого піднебіння (palatum durum), видалив разом із пухлиною частину верхньої щелепи (maxilla), що бере участь в утворенні кісткового піднебіння (palatum osseum). Яку частину верхньої щелепи видалив хірург?", "o": ["Тіло верхньої щелепи (corpus maxillae).", "Лобовий відросток (processus frontalis).", "Виличний відросток (processus zygomaticus).", "Піднебінний відросток (processus palatinus).", "Комірковий відросток (processus alveolaris)."], "a": [3], "e": ["Тіло верхньої щелепи містить пазуху, але піднебіння не утворює.", "Лобовий відросток іде догори.", "Виличний відросток з'єднується з виличною кісткою.", "Піднебінний відросток утворює передні 2/3 кісткового піднебіння.", "Комірковий відросток містить зуби, а не утворює піднебіння."]}, {"n": "6.18", "q": "У жінки 56 років з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми запалення верхньощелепної пазухи (гайморит). Через який утвір носової порожнини стало можливим розповсюдження інфекції у верхньощелепну пазуху?", "o": ["Клино-піднебінний отвір.", "Решітчасті комірки.", "Півмісяцевий розтвір.", "Решітчасту лійку.", "Клино-решітчастий закуток."], "a": [2], "e": ["Клино-піднебінний отвір веде в крило-піднебінну ямку.", "Решітчасті комірки — окремі пазухи решітчастої кістки.", "Верхньощелепна пазуха відкривається через півмісяцевий розтвір у середній носовий хід.", "Через решітчасту лійку відкривається лобова пазуха.", "У клино-решітчастий закуток відкривається клиноподібна пазуха."]}, {"n": "6.19", "q": "Лікар виявив у чоловіка 34 років ознаки ушкодження слизової оболонки носової порожнини (нежить) та симптоми подразнення оболон головного мозку. Лікар діагностував наявність фронтиту (запалення слизової оболонки лобової пазухи). З якого носового ходу стало можливим розповсюдження інфекції із носової порожнини у лобову пазуху?", "o": ["Meatus nasi communis.", "Meatus nasi superior.", "Meatus nasi medius.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — простір між раковинами і перегородкою.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Лобова пазуха відкривається в середній носовий хід.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід веде в глотку."]}, {"n": "6.20", "q": "У лікарню карета швидкої медичної допомоги доставила чоловіка 23 років з травмою носа. Лікар під час огляду встановив перелом кісток лицевого черепа, що обмежують грушоподібний отвір кісткової носової порожнини. Які кістки ушкоджені в даному випадку?", "o": ["Сльозова кістка, верхня щелепа.", "Верхня щелепа, лобова кістка.", "Лобова кістка, носові кістки", "Носова кістка, верхня щелепа.", "Решітчаста кістка, верхня щелепа."], "a": [3], "e": ["Сльозова кістка не обмежує грушоподібний отвір.", "Лобова кістка не обмежує грушоподібний отвір.", "Лобова кістка не входить до країв грушоподібного отвору.", "Грушоподібний отвір обмежений носовими кістками зверху та верхніми щелепами з боків і знизу.", "Решітчаста кістка розташована всередині носової порожнини."]}, {"n": "6.21", "q": "Обстежуючи жінку 45 років, лікар встановив розповсюдження запалення з ділянки іклової ямки в очну ямку. Через який утвір черепа поширилося запалення?", "o": ["Верхню очноямкову щілину.", "Передній решітчастий отвір.", "Підочноямковий канал.", "Нижню очноямкову щілину.", "Носо-сльозовий канал."], "a": [2], "e": ["Верхня очноямкова щілина з'єднує очну ямку з порожниною черепа.", "Передній решітчастий отвір з'єднує очну ямку з черепом.", "Підочноямковий канал відкривається підочноямковим отвором над ікловою ямкою і з'єднує її ділянку з очною ямкою.", "Нижня очноямкова щілина веде в крило-піднебінну ямку.", "Носо-сльозовий канал веде в нижній носовий хід."]}, {"n": "6.22", "q": "У чоловіка 32 років діагностовано запалення слизової оболонки лобової пазухи. У який носовий хід спочатку буде прямувати ексудат?", "o": ["Середній носовий хід.", "Спільний носовий хід.", "Верхній носовий хід.", "Нижній носовий хід.", "Носо-глотковий хід."], "a": [0], "e": ["Лобова пазуха відкривається через решітчасту лійку в середній носовий хід.", "Спільний носовий хід не має отворів пазух.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носо-глотковий хід — задній відділ, пазухи сюди не відкриваються."]}, {"n": "6.23", "q": "Жінка 46 років потрапила в нейрохірургічне відділення з внутрішньочерепною пухлиною. Додаткове обстеження хворої показало, що пухлина зруйнувала кістки, що утворюють верхню стінку очної ямки. Які кістки ушкоджені пухлиною?", "o": ["Клиноподібна кістка, піднебінна кістка.", "Очноямкова пластинка решітчастої кістки, луска лобової кістки.", "Очноямкова частина лобової кістки, велике крило клиноподібної кістки.", "Очноямкова частина лобової кістки, мале крило клиноподібної кістки.", "Очноямкова пластинка решітчастої кістки, очноямкова частина лобової кістки."], "a": [3], "e": ["Піднебінна кістка утворює нижню стінку, а не верхню.", "Очноямкова пластинка решітчастої кістки утворює присередню стінку; луска лобової кістки — склепіння.", "Велике крило клиноподібної кістки утворює бічну стінку.", "Верхню стінку утворюють очноямкова частина лобової кістки та мале крило клиноподібної кістки.", "Очноямкова пластинка решітчастої кістки утворює присередню стінку, а не верхню."]}, {"n": "6.24", "q": "Чоловіка 45 років госпіталізовано для корекції викривлення носової перегородки. Які кістки підлягають корекції в даному випадку?", "o": ["Носова кістка, вертикальна пластинка піднебінної кістки.", "Перпендикулярна пластинка решітчастої кістки, леміш.", "Перпендикулярна пластинка піднебінної кістки, леміш.", "Носова кістка, леміш.", "Горизонтальна пластинка піднебінної кістки, нижня носова раковина."], "a": [1], "e": ["Носова кістка утворює спинку носа, піднебінна кістка — бічну стінку і дно.", "Кісткову носову перегородку утворюють перпендикулярна пластинка решітчастої кістки та леміш.", "Перпендикулярна пластинка піднебінної кістки утворює бічну стінку носової порожнини.", "Носова кістка не входить до перегородки.", "Горизонтальна пластинка піднебінної кістки утворює дно, нижня раковина — бічну стінку."]}, {"n": "6.25", "q": "У жінки 48 років діагностовано гострий запальний процес слизової оболонки носо-сльозової протоки. З анамнезу стало відомо, що після перенесеного грипу протягом 10 днів були виділення з носу. З якого відділу носової порожнини інфекція проникла у носо-сльозовий канал?", "o": ["З нижнього носового ходу.", "З середнього носового ходу.", "З верхнього носового ходу.", "З присінку носа.", "З лобової пазухи."], "a": [0], "e": ["Носо-сльозова протока відкривається в нижній носовий хід — звідти інфекція могла піднятися.", "У середній носовий хід відкриваються пазухи, а не носо-сльозова протока.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Присінок носа не сполучається з носо-сльозовою протокою.", "Лобова пазуха відкривається в середній носовий хід."]}, {"n": "6.26", "q": "У хлопчика 10 років, хворого на гайморит, порушено сполучення верхньощелепної пазухи з середнім носовим ходом. Який утвір в нормі забезпечує надходження повітря з носового ходу до гайморової пазухи?", "o": ["Canalis nasolacrimalis.", "Foramina ethmoidalia.", "Infundibulum ethmoidale.", "Hiatus semilunaris.", "Recessus sphenoethmoidalis."], "a": [3], "e": ["Носо-сльозовий канал веде в нижній носовий хід.", "Решітчасті отвори з'єднують очну ямку з черепом.", "Решітчаста лійка — шлях від лобової пазухи.", "Півмісяцевий розтвір (hiatus semilunaris) з'єднує середній носовий хід з верхньощелепною пазухою.", "У клино-решітчастий закуток відкривається клиноподібна пазуха."]}, {"n": "6.27", "q": "Жінка 27 років звернулася до лікаря зі скаргами на головний біль, що виник після перенесеного риніту. Під час обстеження на рентгенограмі лікар виявив затемнення верхньощелепної пазухи. Яким шляхом розповсюдилася інфекція у верхньощелепну пазуху?", "o": ["Через решітчасту лійку.", "Через нижній носовий хід.", "Через верхньощелепний розтвір.", "Через задні решітчасті комірки.", "Через передні решітчасті комірки."], "a": [2], "e": ["Через решітчасту лійку відкривається лобова пазуха.", "У нижній носовий хід відкривається носо-сльозова протока.", "Інфекція проникає через верхньощелепний розтвір (hiatus maxillaris), що відкривається в середній носовий хід.", "Задні решітчасті комірки відкриваються у верхній носовий хід.", "Передні решітчасті комірки сполучаються з середнім носовим ходом, але не з пазухою."]}, {"n": "6.28", "q": "У жінки 30 років після травми ока виникло гнійне запалення м'яких тканин очної ямки. Пізніше інфекція поширилася у крило-піднебінну ямку. Через який анатомічний утвір гнійний процес поширився у крило-піднебінну ямку?", "o": ["Через круглий отвір.", "Через нижню очноямкову щілину.", "Через клино-піднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [1], "e": ["Круглий отвір веде з крило-піднебінної ямки в середню черепну ямку.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина веде в середню черепну ямку.", "Вилично-очноямковий отвір веде в канальці виличної кістки."]}, {"n": "6.29", "q": "У жінки 50 років на тлі довготривалого запалення слизової оболонки носової порожнини з'явилися симптоми ураження задніх комірок лабіринту решітчастої кістки. У який з носових ходів, що сполучається з задніми комірками лабіринту, буде потрапляти гній?", "o": ["Середній носовий хід.", "Спільний носовий хід.", "Верхній носовий хід.", "Нижній носовий хід.", "Носо-глотковий хід."], "a": [2], "e": ["У середній носовий хід відкриваються передні та середні решітчасті комірки.", "Спільний носовий хід не має отворів пазух.", "Задні решітчасті комірки відкриваються у верхній носовий хід.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носо-глотковий хід не сполучається з решітчастими комірками."]}, {"n": "6.30", "q": "Жінка 34 років потрапила в нейрохірургічне відділення лікарні з внутрішньочерепною пухлиною. Рентгенологічне обстеження хворої показало, що пухлина зруйнувала задні відділи нижньої стінки очної ямки. Яка кістка ушкоджена пухлиною?", "o": ["Клиноподібна кістка.", "Скронева кістка.", "Піднебінна кістка.", "Решітчаста кістка.", "Верхня щелепа."], "a": [2], "e": ["Клиноподібна кістка не утворює нижньої стінки очної ямки.", "Скронева кістка не бере участі в утворенні очної ямки.", "Задні відділи нижньої стінки утворює очноямковий відросток піднебінної кістки.", "Решітчаста кістка утворює присередню стінку.", "Верхня щелепа утворює передню й середню частини нижньої стінки."]}], "models": [["Сагітальний розріз черепа (носова порожнина)", "sf:5e73a548332742c8bc722d5f14ae35f0", {"ru": "Сагиттальный разрез черепа (носовая полость)", "en": "Sagittal section of skull (nasal cavity)"}], ["Череп з підписами", "o3d:overview-skull", {"ru": "Череп с подписями", "en": "Labelled skull"}]]}, {"id": "topic7", "title": "7. Очна ямка, кісткова носова порожнина, кісткове піднебіння (КРОК-1)", "tr": {}, "questions": [{"n": "7.1", "q": "Під час обстеження жінки, 26 років, лікар діагностував запалення в верхньощелепній пазусі (sinus maxillaris). При цьому в одному з носових ходів був виявлений гній, що затікав з верхньощелепної пазухи. В який носовий хід відкривається вічко sinus maxillaris?", "o": ["Meatus nasi medius.", "Meatus nasi superior.", "Meatus nasi communis.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [0], "e": ["Верхньощелепна пазуха відкривається півмісяцевим розтвором у середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід — щілина біля перегородки, пазухи в нього не відкриваються.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід з'єднує носову порожнину з глоткою."]}, {"n": "7.2", "q": "У чоловіка з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми запалення лобової пазухи (фронтит). Через який утвір кісткової носової порожнини стало можливим розповсюдження інфекції в цю пазуху?", "o": ["Клино-решітчастий закуток.", "Клино-піднебінний отвір", "Півмісяцевий розтвір.", "Решітчасті комірки.", "Решітчасту лійку."], "a": [4], "e": ["У клино-решітчастий закуток відкривається клиноподібна пазуха.", "Клино-піднебінний отвір веде до крило-піднебінної ямки.", "Півмісяцевий розтвір — щілина, куди відкривається верхньощелепна пазуха; лобова — через лійку.", "Решітчасті комірки — окремі повітроносні порожнини.", "Лобова пазуха відкривається через решітчасту лійку в середній носовий хід."]}, {"n": "7.3", "q": "У жінки після травми ока виникло гнійне запалення м'яких тканин очної ямки, яке пізніше поширилось у підскроневу ямку. Через який анатомічний утвір гнійний процес поширився у цю ямку?", "o": ["Через нижню очноямкову щілину.", "Через круглий отвір.", "Через клинопіднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [0], "e": ["Нижня очноямкова щілина з'єднує очну ямку з підскроневою і крило-піднебінною ямками.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою, а не очну ямку.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Вилично-очноямковий отвір веде у канал виличної кістки, а не в підскроневу ямку."]}, {"n": "7.4", "q": "Жінка госпіталізована в нейрохірургічне відділення з внутрішньочерепною пухлиною. Додаткове обстеження хворої показало, що пухлина зруйнувала передню половину верхньої стінки очної ямки. Яка кістка ушкоджена пухлиною?", "o": ["Клиноподібна кістка.", "Скронева кістка.", "Лобова кістка.", "Решітчаста кістка.", "Носова кістка."], "a": [2], "e": ["Клиноподібна кістка (мале крило) утворює задню частину верхньої стінки.", "Скронева кістка не бере участі в утворенні очної ямки.", "Передню (більшу) частину верхньої стінки очної ямки утворює очноямкова частина лобової кістки.", "Решітчаста кістка утворює присередню стінку.", "Носова кістка не бере участі в утворенні очної ямки."]}, {"n": "7.5", "q": "У чоловіка після травми ока виникло гнійне запалення м'яких тканин очної ямки. Пізніше інфекція поширилась у крило-піднебінну ямку. Через який анатомічний утвір гнійний процес поширився у цю ямку?", "o": ["Через круглий отвір.", "Через нижню очноямкову щілину.", "Через клино-піднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [1], "e": ["Круглий отвір веде з крило-піднебінної ямки в середню черепну ямку, а не в очну ямку.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина веде в середню черепну ямку.", "Вилично-очноямковий отвір веде у вилично-лицевий і вилично-скроневий канальці."]}, {"n": "7.6", "q": "Лікар, обстежуючи носову порожнину жінки, виявив звуження одного з носових ходів доброякісною пухлиною в ділянці проєкції canalis incisivus. Який носовий хід звужений в даному випадку?", "o": ["Meatus nasi communis.", "Meatus nasi superior", "Meatus nasi interior.", "Meatus nasi medius.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — щілина біля перегородки.", "Верхній носовий хід розташований високо, біля решітчастої кістки.", "Носовий отвір різцевого каналу відкривається на дні носової порожнини в ділянці нижнього носового ходу.", "Середній носовий хід — під середньою раковиною, туди відкриваються пазухи.", "Носоглотковий хід — задній відділ."]}, {"n": "7.7", "q": "Хірург виявив у чоловіка, 52 років, гнійне запалення шкіри в підочноямковій ділянці. Лікар прогнозує можливість поширення запалення в очну ямку. Через який анатомічний утвір можливо поширення інфекції в даному випадку?", "o": ["Canalis incisivus.", "Canalis pterygoideus.", "Canalis nasolacrimalis.", "Canalis infraorbitalis.", "Fissura orbitalis inferior."], "a": [3], "e": ["Різцевий канал з'єднує носову порожнину з ротовою.", "Крилоподібний канал з'єднує ділянку рваного отвору з крило-піднебінною ямкою.", "Носо-сльозовий канал з'єднує очну ямку з нижнім носовим ходом.", "Підочноямковий канал відкривається підочноямковим отвором на обличчі й веде до очної ямки — шлях інфекції з підочноямкової ділянки.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною та підскроневою ямками, а не з обличчям."]}, {"n": "7.8", "q": "У чоловіка з абсцесом в ділянці підскроневої ямки з'явилось ускладнення у вигляді запалення тканин, що оточують очне яблуко. Через яке сполучення підскроневої ямки з очною ямкою поширилось запалення?", "o": ["Canalis palatinus majus.", "Fissura orbitalis superior.", "Foramen sphenopalatinum.", "Fissura orbitalis inferior.", "Canalis pterygoideus."], "a": [3], "e": ["Великий піднебінний канал з'єднує крило-піднебінну ямку з ротовою порожниною.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Нижня очноямкова щілина з'єднує очну ямку з підскроневою ямкою.", "Крилоподібний канал з'єднує ділянку рваного отвору з крило-піднебінною ямкою."]}, {"n": "7.9", "q": "У жінки з запаленням клиноподібної пазухи лікар спостерігає відтік мутної рідини з отвору цієї пазухи. В яку частину порожнини носа спочатку потрапляє рідина з клиноподібної пазухи?", "o": ["Meatus nasi inferior.", "Infundibulum.", "Meatus nasi medius.", "Recessus sphenoethmoidalis.", "Meatus nasi communis."], "a": [3], "e": ["У нижній носовий хід відкривається носо-сльозова протока.", "У решітчасту лійку відкривається лобова пазуха.", "У середній носовий хід відкриваються верхньощелепна, лобова пазухи та передні й середні решітчасті комірки.", "Клиноподібна пазуха відкривається в клино-решітчастий закуток над верхньою носовою раковиною.", "Загальний носовий хід не має отворів пазух."]}, {"n": "7.10", "q": "У чоловіка рентгенологічно виявлено скупчення гною у верхньощелепній пазусі справа. В який з носових ходів спочатку буде прямувати гній?", "o": ["У правий нижній носовий.", "У правий середній носовий.", "У правий верхній носовий.", "У правий загальний носовий.", "У правий носоглотковий."], "a": [1], "e": ["У нижній носовий хід відкривається носо-сльозова протока.", "Верхньощелепна пазуха відкривається в середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід не має отворів пазух.", "Носоглотковий хід веде в глотку."]}, {"n": "7.11", "q": "Після пластичної операції на піднебінні у чоловіка виникло ускладнення у вигляді запалення кістки в ділянці розташування малих піднебінних отворів (foramina palatina minora). Яка кістка уражена запаленням?", "o": ["Верхня щелепа (maxilla).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Клиноподібна кістка (os sphenoidale).", "Піднебінна кістка (os palatinum)."], "a": [4], "e": ["Верхня щелепа утворює передні 2/3 піднебіння, без малих піднебінних отворів.", "Решітчаста кістка не бере участі в утворенні піднебіння.", "Лобова кістка не бере участі в утворенні піднебіння.", "Клиноподібна кістка не має піднебінних отворів.", "Малі піднебінні отвори розташовані на пірамідному відростку піднебінної кістки."]}, {"n": "7.12", "q": "З місця спортивних змагань у лікарню доставлено спортсмена з травмою обличчя. Лікар встановив перелом кістки лицевого черепа. Лінія перелому проходить через підочноямковий край (margo infraorbitalis). Яка кістка травмована?", "o": ["Сльозова кістка (os lacrimale).", "Верхня щелепа (maxilla).", "Носова кістка (os nasale).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Сльозова кістка розташована на присередній стінці очної ямки.", "Підочноямковий край утворений верхньою щелепою (разом з виличною кісткою).", "Носова кістка утворює спинку носа.", "Нижня щелепа не утворює країв очної ямки.", "Піднебінна кістка — глибоко в черепі."]}, {"n": "7.13", "q": "У хірургічне відділення госпіталізовано чоловіка з черепно-мозковою травмою. Лікар приймального відділення встановив ушкодження кістки черепа, яка приймає участь в утворенні бічної та нижньої стінок правої очної ямки. Яка кістка ушкоджена в цьому випадку?", "o": ["Права лобова кістка.", "Права вилична кістка.", "Права клиноподібна кістка.", "Права решітчаста кістка.", "Права верхня щелепа."], "a": [1], "e": ["Лобова кістка утворює верхню стінку очної ямки.", "Вилична кістка бере участь в утворенні і бічної, і нижньої стінок очної ямки.", "Клиноподібна кістка утворює бічну стінку ззаду, але не нижню.", "Решітчаста кістка утворює присередню стінку.", "Верхня щелепа утворює нижню стінку, але не бічну."]}, {"n": "7.14", "q": "У жінки при гнійному запаленні носової порожнини це запалення поширилось у передню черепну ямку. Через який анатомічний утвір розповсюдилось запалення?", "o": ["Foramina cribrosa.", "Foramen ovale.", "Foramen ethmoidale posterius.", "Foramen sphenopalatinum.", "Foramen rotundum."], "a": [0], "e": ["Отвори дірчастої пластинки (foramina cribrosa) з'єднують носову порожнину з передньою черепною ямкою.", "Овальний отвір з'єднує середню черепну ямку з підскроневою ямкою.", "Задній решітчастий отвір з'єднує очну ямку з порожниною черепа.", "Клино-піднебінний отвір з'єднує носову порожнину з крило-піднебінною ямкою.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою."]}, {"n": "7.15", "q": "Обстежуючи чоловіка, 30 років, офтальмолог виявив у нього порушення відпливу сльози в нижній носовий хід. Через яке сполучення очної ямки з нижнім носовим ходом в даному випадку ускладнено проходження сльози?", "o": ["Носо-сльозовий канал.", "Передній решітчастий отвір.", "Верхню очноямкову щілину.", "Нижню очноямкову щілину.", "Задній решітчастий отвір."], "a": [0], "e": ["Носо-сльозовий канал з'єднує очну ямку з нижнім носовим ходом, через нього відтікає сльоза.", "Передній решітчастий отвір з'єднує очну ямку з передньою черепною ямкою.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною та підскроневою ямками.", "Задній решітчастий отвір веде до задніх решітчастих комірок."]}, {"n": "7.16", "q": "У жінки з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми ураження клиноподібної пазухи. Через який утвір стало можливим розповсюдження інфекції з носової порожнини в цю пазуху?", "o": ["Півмісяцевий розтвір.", "Клино-піднебінний отвір", "Овальний отвір.", "Отвір клиноподібної пазухи.", "Круглий отвір."], "a": [3], "e": ["Через півмісяцевий розтвір сполучаються верхньощелепна пазуха та середній носовий хід.", "Клино-піднебінний отвір веде в крило-піднебінну ямку.", "Овальний отвір розташований у великому крилі й веде в підскроневу ямку.", "Клиноподібна пазуха відкривається власним отвором (apertura sinus sphenoidalis) у клино-решітчастий закуток.", "Круглий отвір пропускає верхньощелепний нерв."]}, {"n": "7.17", "q": "Хірург, оперуючи жінку з пухлиною твердого піднебіння (palatum durum), видалив разом з пухлиною і третину тої частини верхньої щелепи (maxilla), що бере участь в утворенні кісткового піднебіння (palatum osseum). Третину якої частини верхньої щелепи видалив хірург?", "o": ["Тіла верхньої щелепи (corpus maxillae).", "Лобового відростка (processus frontalis).", "Виличного відростка (processus zygomaticus).", "Піднебінного відростка (processus palatinus).", "Коміркового відростка (processus alveolaris)."], "a": [3], "e": ["Тіло верхньої щелепи містить пазуху, але піднебіння не утворює.", "Лобовий відросток іде догори.", "Виличний відросток з'єднується з виличною кісткою.", "Піднебінний відросток утворює передні 2/3 кісткового піднебіння.", "Комірковий відросток містить зуби, а не утворює піднебіння."]}, {"n": "7.18", "q": "У жінки з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми запалення верхньощелепної пазухи (гайморит). Через який утвір носової порожнини стало можливим розповсюдження інфекції в цю пазуху?", "o": ["Клино-піднебінний отвір.", "Решітчасті комірки.", "Півмісяцевий розтвір.", "Решітчасту лійку.", "Клино-решітчастий закуток."], "a": [2], "e": ["Клино-піднебінний отвір веде в крило-піднебінну ямку.", "Решітчасті комірки — окремі пазухи решітчастої кістки.", "Верхньощелепна пазуха відкривається через півмісяцевий розтвір у середній носовий хід.", "Через решітчасту лійку відкривається лобова пазуха.", "У клино-решітчастий закуток відкривається клиноподібна пазуха."]}, {"n": "7.19", "q": "Лікар при обстеженні хворого виявив ознаки ушкодження слизової оболонки носової порожнини (нежить) та симптоми подразнення оболон головного мозку. Лікар діагностував наявність фронтиту (запалення слизової оболонки лобової пазухи). З якого носового ходу стало можливим розповсюдження інфекції з носової порожнини в цю пазуху?", "o": ["Meatus nasi communis.", "Meatus nasi superior.", "Meatus nasi medius.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — простір між раковинами і перегородкою.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Лобова пазуха відкривається в середній носовий хід.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід веде в глотку."]}, {"n": "7.20", "q": "В лікарню машина швидкої медичної допомоги доставила чоловіка з травмою носа. Лікар встановив перелом кістки черепа, що обмежує верхній край грушоподібного отвору кісткової носової порожнини. Яка кістка ушкоджена в даному випадку?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [3], "e": ["Сльозова кістка розташована в очній ямці.", "Верхня щелепа обмежує грушоподібний отвір знизу і з боків.", "Лобова кістка не обмежує грушоподібний отвір.", "Верхній край грушоподібного отвору утворюють носові кістки.", "Решітчаста кістка розташована глибше всередині носової порожнини."]}, {"n": "7.21", "q": "Обстежуючи жінку, 45 років, лікар встановив розповсюдження запалення з ділянки іклової ямки в очну ямку. Через який утвір черепа поширилося запалення?", "o": ["Верхню очноямкову щілину.", "Передній решітчастий отвір", "Підочноямковий канал.", "Нижню очноямкову щілину.", "Носо-сльозовий канал."], "a": [2], "e": ["Верхня очноямкова щілина з'єднує очну ямку з порожниною черепа.", "Передній решітчастий отвір з'єднує очну ямку з черепом.", "Підочноямковий канал відкривається підочноямковим отвором над ікловою ямкою і з'єднує її ділянку з очною ямкою.", "Нижня очноямкова щілина веде в крило-піднебінну ямку.", "Носо-сльозовий канал веде в нижній носовий хід."]}, {"n": "7.22", "q": "У чоловіка діагностовано запалення слизової оболонки лобової пазухи. В який з носових ходів спочатку буде прямувати запальна рідина?", "o": ["Середній носовий хід.", "Спільний носовий хід.", "Верхній носовий хід.", "Нижній носовий хід.", "Носо-глотковий хід."], "a": [0], "e": ["Лобова пазуха відкривається через решітчасту лійку в середній носовий хід.", "Спільний носовий хід не має отворів пазух.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носо-глотковий хід — задній відділ, пазухи сюди не відкриваються."]}, {"n": "7.23", "q": "Жінка потрапила в нейрохірургічне відділення з внутрішньочерепною пухлиною. Додаткове обстеження хворої показало, що пухлина зруйнувала кістки, що утворюють верхню стінку очної ямки. Які кістки ушкоджені пухлиною?", "o": ["Клиноподібна кістка, піднебінна кістка.", "Очноямкова пластинка решітчастої кістки, луска лобової кістки.", "Очноямкова частина лобової кістки, велике крило клиноподібної кістки.", "Очноямкова частина лобової кістки, мале крило клиноподібної кістки.", "Очноямкова пластинка решітчастої кістки, очноямкова частина лобової кістки."], "a": [3], "e": ["Піднебінна кістка утворює нижню стінку, а не верхню.", "Очноямкова пластинка решітчастої кістки утворює присередню стінку; луска лобової кістки — склепіння.", "Велике крило клиноподібної кістки утворює бічну стінку.", "Верхню стінку утворюють очноямкова частина лобової кістки та мале крило клиноподібної кістки.", "Очноямкова пластинка решітчастої кістки утворює присередню стінку, а не верхню."]}, {"n": "7.24", "q": "Чоловік госпіталізований для корекції викривлення носової перегородки. Які кістки підлягають корекції в даному випадку?", "o": ["Носова кістка, вертикальна пластинка піднебінної кістки.", "Перпендикулярна пластинка решітчастої кістки, леміш.", "Перпендикулярна пластинка піднебінної кістки, леміш.", "Носова кістка, леміш.", "Горизонтальна пластинка піднебінної кістки, нижня носова раковина."], "a": [1], "e": ["Носова кістка утворює спинку носа, піднебінна кістка — бічну стінку і дно.", "Кісткову носову перегородку утворюють перпендикулярна пластинка решітчастої кістки та леміш.", "Перпендикулярна пластинка піднебінної кістки утворює бічну стінку носової порожнини.", "Носова кістка не входить до перегородки.", "Горизонтальна пластинка піднебінної кістки утворює дно, нижня раковина — бічну стінку."]}, {"n": "7.25", "q": "У жінки, 48 років, діагностовано гострий запальний процес слизової оболонки носо-сльозової протоки. З анамнезу стало відомо, що після перенесеного грипу протягом 10 днів були виділення з носу. З якого відділу носової порожнини інфекція могла проникнути у носо-сльозовий канал?", "o": ["З нижнього носового ходу.", "З середнього носового ходу.", "З верхнього носового ходу.", "З присінку носа.", "З лобової пазухи."], "a": [0], "e": ["Носо-сльозова протока відкривається в нижній носовий хід — звідти інфекція могла піднятися.", "У середній носовий хід відкриваються пазухи, а не носо-сльозова протока.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Присінок носа не сполучається з носо-сльозовою протокою.", "Лобова пазуха відкривається в середній носовий хід."]}, {"n": "7.26", "q": "У хворого хлопчика на гайморит порушено сполучення верхньощелепної пазухи з середнім носовим ходом. Який утвір в нормі забезпечує надходження повітря з носового ходу до гайморової пазухи?", "o": ["Canalis nasolacrimalis.", "Foramina ethmoidalia.", "Infundibulum ethmoidale.", "Hiatus semilunaris.", "Recessus sphenoethmoidalis."], "a": [3], "e": ["Носо-сльозовий канал веде в нижній носовий хід.", "Решітчасті отвори з'єднують очну ямку з черепом.", "Решітчаста лійка — шлях від лобової пазухи.", "Півмісяцевий розтвір (hiatus semilunaris) з'єднує середній носовий хід з верхньощелепною пазухою.", "У клино-решітчастий закуток відкривається клиноподібна пазуха."]}, {"n": "7.27", "q": "Жінка, 27 років, звернулась до лікаря зі скаргами на головний біль після перенесеного риніту. При обстеженні на рентгенограмі — затемнення верхньощелепної пазухи. Яким шляхом розповсюдилась інфекція у верхньощелепну пазуху?", "o": ["Через решітчасту лійку.", "Через нижній носовий хід.", "Через верхньощелепний розтвір.", "Через задні решітчасті комірки.", "Через передні решітчасті комірки."], "a": [2], "e": ["Через решітчасту лійку відкривається лобова пазуха.", "У нижній носовий хід відкривається носо-сльозова протока.", "Інфекція проникає через верхньощелепний розтвір (hiatus maxillaris), що відкривається в середній носовий хід.", "Задні решітчасті комірки відкриваються у верхній носовий хід.", "Передні решітчасті комірки сполучаються з середнім носовим ходом, але не з пазухою."]}, {"n": "7.28", "q": "У жінки після травми ока виникло гнійне запалення м'яких тканин очної ямки. Пізніше це запалення поширилось у крило-піднебінну ямку. Через який анатомічний утвір гнійний процес поширився у цю ямку?", "o": ["Через круглий отвір", "Через нижню очноямкову щілину.", "Через клино-піднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [1], "e": ["Круглий отвір веде з крило-піднебінної ямки в середню черепну ямку, а не в очну ямку.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина веде в середню черепну ямку.", "Вилично-очноямковий отвір веде у вилично-лицевий і вилично-скроневий канальці."]}, {"n": "7.29", "q": "Жінка потрапила в лікарню з гнійним запаленням комірок соскоподібного відростка. Запалення поширилося у черепну ямку, яка має загальну стінку з цим відростком. В яку ямку черепа розповсюдилося запалення із соскоподібного відростка?", "o": ["В середню черепну ямку.", "В передню черепну ямку.", "В підскроневу ямку.", "В крило-піднебінну ямку.", "В задню черепну ямку."], "a": [4], "e": ["Середня черепна ямка межує з передньою поверхнею піраміди та покрівлею барабанної порожнини, а не з соскоподібним відростком.", "Передня черепна ямка розташована над очними ямками й носовою порожниною.", "Підскронева ямка — зовнішня ямка під виличною дугою, не черепна.", "Крило-піднебінна ямка розташована позаду верхньої щелепи.", "Соскоподібний відросток прилягає до задньої черепної ямки: на його внутрішній поверхні борозна сигмоподібної пазухи."]}, {"n": "7.30", "q": "У жінки з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми ураження задніх комірок лабіринту решітчастої кістки. У який з носових ходів буде потрапляти гній?", "o": ["Середній носовий хід.", "Спільний носовий хід.", "Верхній носовий хід.", "Нижній носовий хід.", "Носо-глотковий хід."], "a": [2], "e": ["У середній носовий хід відкриваються передні та середні решітчасті комірки.", "Спільний носовий хід не має отворів пазух.", "Задні решітчасті комірки відкриваються у верхній носовий хід.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носо-глотковий хід не сполучається з решітчастими комірками."]}], "models": [["Сагітальний розріз черепа (носова порожнина)", "sf:5e73a548332742c8bc722d5f14ae35f0", {"ru": "Сагиттальный разрез черепа (носовая полость)", "en": "Sagittal section of skull (nasal cavity)"}], ["Череп з підписами", "o3d:overview-skull", {"ru": "Череп с подписями", "en": "Labelled skull"}]]}, {"id": "topic8", "title": "8. Кістки верхньої кінцівки (ossa membri superioris)", "tr": {}, "questions": [{"n": "8.1", "q": "Під час проведення рентгенографії верхньої кінцівки у жінки 34 років виявлена тріщина на задній поверхні діафіза плечової кістки в місці борозни, до якої прилягає довга гілка плечового сплетення. В ділянці якої борозни ушкоджена плечова кістка?", "o": ["Міжгорбкова борозна.", "Передня бічна ліктьова борозна.", "Борозна ліктьового нерва.", "Борозна серединного нерва.", "Борозна променевого нерва."], "a": [4], "e": ["Міжгорбкова борозна — на передній поверхні проксимального кінця, для сухожилка довгої голівки двоголового м'яза.", "Передньої бічної ліктьової борозни на плечовій кістці немає — це борозна в м'яких тканинах ліктьової ямки.", "Борозна ліктьового нерва — на задній поверхні присереднього надвиростка, не на діафізі.", "Борозни серединного нерва на плечовій кістці немає.", "Борозна променевого нерва спірально огинає задню поверхню діафіза плечової кістки."]}, {"n": "8.2", "q": "У дитини 2-х років рентгенолог спостерігає темні смуги на місці хряща, що відокремлює ядра скостеніння головки плечової кістки. У якому віці ядра скостеніння зливаються в єдину головку плечової кістки?", "o": ["0–1 рік.", "1–2 роки", "2–3 роки.", "4–6 років.", "6–8 років."], "a": [3], "e": ["У 0–1 рік ядра скостеніння головки тільки з'являються.", "У 1–2 роки ядра ще розділені хрящем.", "У 2–3 роки ядра ще не злилися.", "Ядра скостеніння головки, великого й малого горбків зливаються в єдину головку приблизно у 4–6 років.", "У 6–8 років головка вже сформована, але ще відокремлена від діафіза епіфізарним хрящем."]}, {"n": "8.3", "q": "Вивчаючи рентгенограму кисті дитини, лікар побачив ядра скостеніння тільки в os capitatum, os hamatum та os triquetrum. Скільки років дитині?", "o": ["6 місяців.", "1 рік.", "3 роки.", "4 роки.", "5 років."], "a": [2], "e": ["До 6 місяців ядро є лише в головчастій (і гачкуватій) кістках, тригранна ще без ядра.", "У 1 рік є ядра головчастої й гачкуватої кісток, тригранна ще без ядра.", "Ядро тригранної кістки з'являється близько 3 років, поки є лише головчаста, гачкувата і тригранна.", "У 4 роки з'являється ядро півмісяцевої кістки.", "У 5 років вже є ядро і в човноподібній кістці."]}, {"n": "8.4", "q": "Чоловіка 50 років госпіталізовано в хірургічне відділення лікарні з раною ліктьового суглоба в ділянці присереднього краю передпліччя. Лікар констатує, що у чоловіка ушкоджений відросток, який спереду межує з блоковою вирізкою та формує її передню губу. Який відросток ушкоджено?", "o": ["Бічний надвиросток.", "Вінцевий відросток.", "Шилоподібний відросток ліктьової кістки.", "Шилоподібний відросток променевої кістки.", "Дзьобоподібний відросток."], "a": [1], "e": ["Бічний надвиросток належить плечовій кістці.", "Вінцевий відросток ліктьової кістки утворює передній край (губу) блокової вирізки.", "Шилоподібний відросток ліктьової кістки — на дистальному кінці.", "Шилоподібний відросток променевої кістки — на дистальному кінці.", "Дзьобоподібний відросток належить лопатці."]}, {"n": "8.5", "q": "У чоловіка 54 років рентгенологічно визначено внутрішньосуглобовий перелом проксимального епіфіза плечової кістки. Який утвір плечової кістки ушкоджений?", "o": ["Головка плечової кістки.", "Хірургічна шийка", "Гребінь великого горбка.", "Гребінь малого горбка.", "Малий горбок."], "a": [0], "e": ["Головка плечової кістки — єдиний утвір у списку, розташований усередині суглоба.", "Хірургічна шийка розташована нижче горбків, поза суглобом.", "Гребінь великого горбка лежить поза суглобовою порожниною.", "Гребінь малого горбка лежить поза суглобовою порожниною.", "Малий горбок лежить поза суглобовою порожниною."]}, {"n": "8.6", "q": "Лікар проводить огляд юнака із травмою верхньої кінцівки, яку він отримав під час падіння на витягнуту руку з опорою на долоню. Після рентгенологічного обстеження лікар констатував перелом зап'ястової суглобової поверхні кістки передпліччя, що розташована на боці великого пальця кисті, та кістки проксимального ряду зап'ястка, що контактують між собою. Перелом яких кісток діагностований у юнака?", "o": ["Ulna та os pisiforme.", "Radius та os scaphoideum.", "Ulna та os hamatum.", "Radius та os lunatum.", "Ulna та os capitatum."], "a": [1], "e": ["Ліктьова кістка лежить з боку мізинця і не контактує з горохоподібною кісткою суглобом.", "Променева кістка розташована з боку великого пальця й з'єднується з човноподібною кісткою в променево-зап'ястковому суглобі.", "Ліктьова кістка не з'єднується з гачкуватою кісткою.", "Півмісяцева кістка з'єднується з променевою, але типовий перелом при падінні на долоню — човноподібної.", "Головчаста кістка належить до дистального ряду."]}, {"n": "8.7", "q": "Медичний експерт досліджує кисть дитини. На рентгенограмі виявлено наявність ядер скостеніння в os capitatum, os hamatum, os triquetrum, os lunatum. В os scaphoideum ядро скостеніння відсутнє. Скільки років дитині?", "o": ["До 3 місяців.", "До 1 року.", "До 3 років.", "До 4 років.", "До 5 років."], "a": [4], "e": ["До 3 місяців немає ще жодних ядер, крім головчастої.", "До 1 року є ядра головчастої і гачкуватої кісток, інших немає.", "До 3 років немає ядра півмісяцевої кістки.", "До 4 років ще немає ядра півмісяцевої кістки, а тут воно вже є.", "Ядро в човноподібній кістці з'являється близько 5 років, тому дитині до 5 років."]}, {"n": "8.8", "q": "Жінка 50 років після падіння звернулася у травматологічне відділення лікарні зі скаргами на біль у плечовій ділянці та обмеження рухів у плечовому суглобі. Під час рентгенологічного обстеження виявлено перелом плечової кістки у «типовому» місці. Яка анатомічна ділянка плечової кістки найімовірніше ушкоджена?", "o": ["Шийка лопатки.", "Надплечовий кінець ключиці.", "Анатомічна шийка плечової кістки.", "Хірургічна шийка плечової кістки.", "Дельтоподібна горбистість."], "a": [3], "e": ["Шийка лопатки не входить до плечової кістки.", "Надплечовий кінець ключиці — частина ключиці.", "Анатомічна шийка ламається рідко.", "Хірургічна шийка — «типове» місце перелому плечової кістки, особливо у літніх.", "Дельтоподібна горбистість — на діафізі, рідше місце перелому."]}, {"n": "8.9", "q": "Вивчаючи рентгенограму плечової ділянки підлітка, лікар помилково сприйняв ядро скостеніння акроміона лопатки за уламок кістки. У якому віці формується повний синостоз лопатки?", "o": ["9–10 років.", "11–12 років.", "13–14 років.", "15–16 років.", "18–24 роки."], "a": [4], "e": ["У 9–10 років лопатка ще має окремі ядра скостеніння.", "У 11–12 років ядро акроміона тільки з'являється.", "У 13–14 років синостоз ще не завершений.", "У 15–16 років синостоз ще триває.", "Повний синостоз лопатки (з акроміоном) завершується у 18–24 роки."]}, {"n": "8.10", "q": "Жінка 46 років під час падіння на лікоть отримала перелом головочки на нижньому наростку однієї з кісток верхньої кінцівки. Яка з перерахованих кісток має головочку на нижньому наростку кістки?", "o": ["Плечова кістка.", "Ліктьова кістка.", "Променева кістка.", "Лопатка.", "Ключиця."], "a": [0], "e": ["Головочка (capitulum humeri) розташована на виростку дистального кінця плечової кістки.", "Ліктьова кістка має блокову вирізку, а не головочку.", "Променева кістка має головку на проксимальному кінці, а не головочку на виростку.", "Лопатка має суглобову западину.", "Ключиця не має головочки."]}, {"n": "8.11", "q": "У жінки 46 років після падіння виявлено перелом кістки верхньої кінцівки, одразу проксимальніше надвиростків. Перелом якої кістки має місце в цьому випадку?", "o": ["Плечова кістка.", "Ліктьова кістка.", "Променева кістка.", "Лопатка.", "Ключиця."], "a": [0], "e": ["Надвиростки (медіальний і латеральний) є лише на дистальному кінці плечової кістки.", "Ліктьова кістка не має надвиростків.", "Променева кістка не має надвиростків.", "Лопатка не має надвиростків.", "Ключиця не має надвиростків."]}, {"n": "8.12", "q": "У чоловіка 37 років внаслідок виробничої травми ушкоджено нижню третину передньої плечової ділянки. Який утвір, що розташований на дистальному наростку плечової кістки, ушкоджений?", "o": ["Хірургічна шийка.", "Присередній надвиросток.", "Анатомічна шийка.", "Надплечовий відросток.", "Дзьобоподібний відросток."], "a": [1], "e": ["Хірургічна шийка — на проксимальному кінці плечової кістки.", "Присередній надвиросток розташований на дистальному кінці плечової кістки.", "Анатомічна шийка — на проксимальному кінці.", "Надплечовий відросток (акроміон) належить лопатці.", "Дзьобоподібний відросток належить лопатці."]}, {"n": "8.13", "q": "В травматологічне відділення госпіталізовано юнака з травмою кисті. Діагностовано перелом кістки проксимального ряду кісток зап'ястка, яка з'єднується із кісткою-трапецією. Яка кістка зазнала ушкодження?", "o": ["Головчаста кістка.", "Півмісяцева кістка.", "Човноподібна кістка.", "Горохоподібна кістка.", "Тригранна кістка."], "a": [2], "e": ["Головчаста кістка належить до дистального ряду.", "Півмісяцева кістка не з'єднується з трапецією.", "Човноподібна кістка проксимального ряду з'єднується з кісткою-трапецією.", "Горохоподібна кістка з'єднується лише з тригранною.", "Тригранна кістка з'єднується з гачкуватою, а не з трапецією."]}, {"n": "8.14", "q": "До приймального відділення госпіталізовано чоловіка 50 років із виробничою травмою. Рентгенологічно діагностовано перелом кістки зап'ястка, що з'єднується з першою п'ястковою кісткою. Яка кістка ушкоджена?", "o": ["Півмісяцева.", "Гачкувата.", "Човноподібна.", "Тригранна.", "Кістка-трапеція."], "a": [4], "e": ["Півмісяцева кістка не з'єднується з п'ястковими кістками.", "Гачкувата кістка з'єднується з IV–V п'ястковими кістками.", "Човноподібна кістка належить до проксимального ряду.", "Тригранна кістка — проксимальний ряд.", "Кістка-трапеція утворює сідлоподібний суглоб з I п'ястковою кісткою."]}, {"n": "8.15", "q": "До лікарні звернулася жінка 65 років із травмою кисті. Під час рентгенологічного обстеження діагностовано перелом п'ясткової кістки, яка своєю основою контактує з головчастою кісткою. Перелом якої кістки встановлено?", "o": ["Os metacarpale I.", "Os metacarpale II.", "Os metacarpale III.", "Os metacarpale IV.", "Os metacarpale V."], "a": [2], "e": ["I п'ясткова кістка з'єднується з кісткою-трапецією.", "II п'ясткова кістка з'єднується з трапецієподібною кісткою (і частково з трапецією та головчастою).", "III п'ясткова кістка з'єднується основою з головчастою кісткою.", "IV п'ясткова кістка з'єднується з гачкуватою кісткою (частково з головчастою).", "V п'ясткова кістка з'єднується з гачкуватою кісткою."]}, {"n": "8.16", "q": "Під час автомобільної аварії дитина отримала перелом кістки верхньої кінцівки зі зміщенням уламків. Лікар проводить огляд рентгенограми, на якій описує лінію перелому вздовж блокової вирізки на проксимальному кінці травмованої кістки. Яка кістка ушкоджена?", "o": ["Променева.", "Ліктьова.", "Човноподібна.", "Півмісяцева.", "Плечова."], "a": [1], "e": ["Променева кістка має на проксимальному кінці головку, а не блокову вирізку.", "Блокова вирізка розташована на проксимальному кінці ліктьової кістки.", "Човноподібна кістка — кістка зап'ястка.", "Півмісяцева кістка — кістка зап'ястка.", "Плечова кістка має блок, а не блокову вирізку."]}, {"n": "8.17", "q": "У травматологічне відділення лікарні госпіталізовано юнака. Під час обстеження діагностовано перелом відростка кістки передпліччя, який разом із вінцевим відростком утворює блокову вирізку (incisura trochlearis). Який відросток та яка кістка зазнали перелому?", "o": ["Дзьобоподібний відросток лопатки.", "Надплечовий відросток лопатки.", "Ліктьовий відросток ліктьової кістки.", "Шилоподібний відросток променевої кістки.", "Шилоподібний відросток ліктьової кістки."], "a": [2], "e": ["Дзьобоподібний відросток належить лопатці.", "Надплечовий відросток належить лопатці.", "Ліктьовий відросток (olecranon) разом з вінцевим утворює блокову вирізку ліктьової кістки.", "Шилоподібний відросток променевої кістки — на дистальному кінці.", "Шилоподібний відросток ліктьової кістки — на дистальному кінці."]}, {"n": "8.18", "q": "Після дорожньо-транспортної пригоди у лікарню госпіталізовано чоловіка 70 років. Під час обстеження встановлено перелом утвору лопатки, який є продовженням її ості. Який анатомічний утвір лопатки ушкоджений?", "o": ["Angulus inferior.", "Angulus superior.", "Tuberculum supraglenoidale.", "Processus coracoideus.", "Acromion."], "a": [4], "e": ["Нижній кут лопатки — місце сходження присереднього та бічного країв.", "Верхній кут лопатки — між верхнім і присереднім краями.", "Надсуглобовий горбок — над суглобовою западиною.", "Дзьобоподібний відросток відходить від верхнього краю.", "Акроміон — бічне продовження ості лопатки."]}, {"n": "8.19", "q": "У травматологічне відділення госпіталізовано юнака з травмою кисті. Рентгенологічно діагностовано перелом кістки проксимального ряду кісток зап'ястка, яка з'єднується з кісткою-трапецією та має горбок, обернений у бік долоні. Яка кістка зазнала травмування?", "o": ["Півмісяцева.", "Гачкувата.", "Човноподібна.", "Тригранна.", "Горохоподібна."], "a": [2], "e": ["Півмісяцева кістка не з'єднується з трапецією.", "Гачкувата кістка має гачок, обернений до долоні, але належить до дистального ряду.", "Човноподібна кістка має горбок, обернений у бік долоні, і з'єднується з трапецією.", "Тригранна кістка не з'єднується з трапецією.", "Горохоподібна кістка не з'єднується з трапецією."]}, {"n": "8.20", "q": "У травматологічне відділення лікарні звернувся чоловік 34 років зі скаргами на гострий біль у плечовому суглобі та обмеження рухів в ньому після виробничої травми. На рентгенограмі діагностовано перелом дзьобоподібного відростка та ушкодження склепіння плеча. Перелом якої кістки має місце в цьому випадку?", "o": ["Плечової кістки.", "Ліктьової кістки.", "Променевої кістки.", "Лопатки.", "Ключиці."], "a": [3], "e": ["Плечова кістка не має дзьобоподібного відростка.", "Ліктьова кістка має вінцевий відросток, не дзьобоподібний.", "Променева кістка не має дзьобоподібного відростка.", "Дзьобоподібний відросток належить лопатці; разом з акроміоном і зв'язкою утворює склепіння плеча.", "Ключиця не має дзьобоподібного відростка."]}, {"n": "8.21", "q": "Жінку після падіння на долонну поверхню кисті турбує біль у ділянці анатомічної табакерки і обмеження рухів великого пальця. Під час рентгенологічного обстеження діагностовано перелом кістки зап'ястка, суглобова поверхня якої контактує з бічною частиною зап'ясткової суглобової поверхні променевої кістки. Яка кістка ушкоджена?", "o": ["Os hamatum.", "Os scaphoideum.", "Os pisiforme.", "Os trapezium.", "Os triquetrum."], "a": [1], "e": ["Гачкувата кістка — дистальний ряд, з боку мізинця.", "Човноподібна кістка з'єднується з бічною частиною зап'ясткової поверхні променевої кістки і лежить в анатомічній табакерці.", "Горохоподібна кістка розташована з боку мізинця.", "Трапеція — дистальний ряд, не з'єднується з променевою кісткою.", "Тригранна кістка не контактує з променевою кісткою."]}, {"n": "8.22", "q": "Чоловік 37 років отримав виробничу травму нижньої третини плеча. Під час рентгенологічного обстеження у травмпункті виявлено ушкодження у присередній частині виростка плечової кістки (condylus humeri). Яка структура ушкоджена?", "o": ["Головочка плечової кістки (capitulum humeri).", "Блок плечової кістки (trochlea humeri).", "Вінцева ямка (fossa coronoidea).", "Присередній надвиросток (epicondylus medialis).", "Бічний надвиросток (epicondylus lateralis)."], "a": [1], "e": ["Головочка розташована у бічній частині виростка.", "Блок плечової кістки — присередня частина виростка, зчленовується з ліктьовою кісткою.", "Вінцева ямка — заглибина над блоком, не частина виростка.", "Присередній надвиросток — виступ над виростком, а не частина виростка.", "Бічний надвиросток — з бічного боку."]}, {"n": "8.23", "q": "Юнак звернувся до лікарні із травмою верхньої кінцівки, яку отримав внаслідок падіння на витягнуту руку з опорою на долоню під час гри в баскетбол. На рентгенівському знімку лікар описав лінію перелому вздовж ліктьової вирізки на дистальному кінці травмованої кістки. Утвір якої кістки ушкоджений?", "o": ["Плечова кістка.", "Ліктьова кістка.", "Променева кістка.", "Лопатка.", "Ключиця."], "a": [2], "e": ["Плечова кістка не має ліктьової вирізки.", "Ліктьова кістка має променеву вирізку, а не ліктьову.", "Ліктьова вирізка розташована на дистальному кінці променевої кістки.", "Лопатка не має ліктьової вирізки.", "Ключиця не має ліктьової вирізки."]}, {"n": "8.24", "q": "У травматологічне відділення лікарні госпіталізовано чоловіка 65 років з травмою верхньої кінцівки. Рентгенологічно виявлено перелом кістки грудного пояса. Лінія перелому проходить вздовж трапецієподібної лінії біля конусоподібного горбка. Яка кістка верхньої кінцівки зазнала ушкодження?", "o": ["Clavicula.", "Ulna.", "Radius.", "Scapula.", "Os scaphoideum."], "a": [0], "e": ["Трапецієподібна лінія і конусоподібний горбок розташовані на нижній поверхні ключиці.", "Ліктьова кістка не належить до грудного пояса.", "Променева кістка не належить до грудного пояса.", "Лопатка належить до пояса, але цих утворів не має.", "Човноподібна кістка — кістка зап'ястка."]}, {"n": "8.25", "q": "У травматологічне відділення лікарні госпіталізовано чоловіка 45 років з травмою кисті. Після обстеження діагностовано перелом кістки, яка своєю основою з'єднується з кісткою-трапецією. Яка кістка травмована в цьому випадку?", "o": ["Os metacarpale I.", "Os metacarpale II.", "Os metacarpale III.", "Os metacarpale IV.", "Os metacarpale V."], "a": [0], "e": ["I п'ясткова кістка з'єднується основою з кісткою-трапецією.", "II п'ясткова кістка з'єднується переважно з трапецієподібною кісткою.", "III п'ясткова кістка з'єднується з головчастою кісткою.", "IV п'ясткова кістка з'єднується з гачкуватою.", "V п'ясткова кістка з'єднується з гачкуватою."]}, {"n": "8.26", "q": "Чоловік 37 років у виробничих умовах отримав перелом кістки зап'ястка, яка контактує одночасно з променевою кісткою та півмісяцевою кісткою? Яка це кістка?", "o": ["Головчаста.", "Човноподібна.", "Горохоподібна.", "Тригранна.", "Трапецієподібна."], "a": [1], "e": ["Головчаста кістка — дистальний ряд, з променевою не контактує.", "Човноподібна кістка з'єднується з променевою кісткою і з півмісяцевою кісткою.", "Горохоподібна кістка з'єднується лише з тригранною.", "Тригранна кістка з'єднується з півмісяцевою, але не з променевою кісткою.", "Трапецієподібна кістка — дистальний ряд."]}, {"n": "8.27", "q": "У лікарню госпіталізовано чоловіка 32 років із глибокою різаною раною верхньої кінцівки. Під час обстеження виявлено ушкодження ліктьового нерва в ділянці ліктьової борозни. Яка кістка має борозну ліктьового нерва?", "o": ["Променева кістка.", "Ліктьова кістка.", "Ключиця.", "Лопатка.", "Плечова кістка."], "a": [4], "e": ["Променева кістка не має борозни ліктьового нерва.", "Ліктьова кістка не має борозни ліктьового нерва.", "Ключиця не має такої борозни.", "Лопатка не має такої борозни.", "Борозна ліктьового нерва — на задній поверхні присереднього надвиростка плечової кістки."]}, {"n": "8.28", "q": "Жінка 60 років посковзнулася на льоду та впала на руку. Жінка скаржиться на біль у плечовій ділянці, що посилюється при рухах у плечовому суглобі. Під час огляду хворої виявлено укорочення верхньої кінцівки. Рентгенологічно встановлено перелом плечової кістки між проксимальним кінцем і її діафізом. У ділянці якого утвору плечової кістки діагностований перелом?", "o": ["Анатомічної шийки плечової кістки.", "Хірургічної шийки плечової кістки.", "Внутрішньосуглобовий перелом головки плечової кістки.", "Діафіза плечової кістки.", "Дистального епіфіза плечової кістки."], "a": [1], "e": ["Анатомічна шийка відмежовує головку від горбків.", "Хірургічна шийка — місце переходу проксимального кінця в діафіз нижче горбків.", "Головка — внутрішньосуглобовий утвір.", "Діафіз розташований нижче хірургічної шийки.", "Дистальний епіфіз — біля ліктьового суглоба."]}, {"n": "8.29", "q": "Під час операції з приводу перелому кістки верхньої кінцівки хірург з'єднує за допомогою металевої пластини уламки кістки в ділянці дельтоподібної горбистості. Яка кістка верхньої кінцівки ушкоджена?", "o": ["Променева кістка.", "Ліктьова кістка.", "Ключиця.", "Лопатка.", "Плечова кістка."], "a": [4], "e": ["Променева кістка має горбистість променевої кістки.", "Ліктьова кістка має горбистість ліктьової кістки.", "Ключиця не має дельтоподібної горбистості.", "Лопатка не має дельтоподібної горбистості.", "Дельтоподібна горбистість — на бічній поверхні діафіза плечової кістки."]}, {"n": "8.30", "q": "Рентгенолог, вивчаючи рентгенограму кисті, знаходить перелом кістки, з якою з'єднуються суглобові поверхні основи четвертої та п'ятої п'ясткових кісток. Перелом якої кістки встановив рентгенолог?", "o": ["Os scaphoideum.", "Os capitatum.", "Os pisiforme.", "Os triquetrum.", "Os hamatum."], "a": [4], "e": ["Човноподібна кістка — проксимальний ряд.", "Головчаста кістка з'єднується з III п'ястковою кісткою.", "Горохоподібна кістка не з'єднується з п'ястковими кістками.", "Тригранна кістка не з'єднується з п'ястковими кістками.", "Гачкувата кістка з'єднується з основами IV та V п'ясткових кісток."]}], "models": [["Верхня кінцівка", "o3d:upper-limb", {"ru": "Верхняя конечность", "en": "Upper limb"}], ["Кисть і зап'ясток", "o3d:hand", {"ru": "Кисть и запястье", "en": "Hand and wrist"}], ["Кістки руки різними кольорами", "sf:cd61a00896f24338b394f44772b5a45d", {"ru": "Кости руки разными цветами", "en": "Colour-coded arm bones"}]]}, {"id": "topic9", "title": "9. Кістки нижньої кінцівки (ossa membri inferioris)", "tr": {}, "questions": [{"n": "9.1", "q": "Стопа людини еволюційно пристосована до функції опори та амортизації, що забезпечується її жорсткою кістковою структурою та меншою рухливістю порівняно з кистю. Яка кількість кісток утворює тверду основу стопи?", "o": ["5.", "8.", "10.", "12.", "15."], "a": [3], "e": ["5 — це лише плеснові кістки.", "8 — кількість кісток зап'ястка кисті, а не основи стопи.", "10 кісток недостатньо для твердої основи стопи.", "Тверду основу стопи утворюють 12 кісток: 7 кісток заплесна та 5 плеснових.", "15 — більше, ніж кісток у твердій основі (фаланги до неї не входять)."]}, {"n": "9.2", "q": "Вивчаючи рентгенограму дитини 9 місяців, лікар виявив недорозвинення кульшової западини з формуванням вродженого вивиху головки стегнової кістки в articulatio coxae. Патологія пов'язана з порушенням закладки ядер скостеніння в кістках, що утворюють кульшову западину. В тілах сідничої та лобкової кісток виявлені центри скостеніння. В тілі клубової кістки ядро відсутнє. На якому місяці в нормі з'являється центр скостеніння в клубовій кістці?", "o": ["7.", "5.", "6.", "8.", "9."], "a": [3], "e": ["7-й місяць не відповідає ключу тесту.", "5-й місяць не відповідає ключу тесту.", "6-й місяць не відповідає ключу тесту.", "За ключем тесту — 8-й місяць. ⚠️ У більшості підручників ядро клубової кістки з'являється найпершим, на 3–4-му місяці внутрішньоутробного розвитку; уточніть у викладача.", "9-й місяць не відповідає ключу тесту."]}, {"n": "9.3", "q": "Травматолог, оглядаючи р
