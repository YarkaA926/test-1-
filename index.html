.", "III-V зябрової дуги.", "IV–V зябрової дуги."], "a": [1], "e": ["Із I (щелепної) дуги розвиваються жувальні м'язи та трійчастий нерв.", "Із II (під'язикової) дуги розвиваються мімічні м'язи та лицевий нерв.", "Із III дуги — шило-глотковий м'яз і язикоглотковий нерв.", "III–V дуги дають м'язи глотки й гортані.", "IV–V дуги — м'язи гортані й глотки, блукаючий нерв."]}, {"n": "15.30", "q": "У відділення щелепно-лицевої хірургії з вогнепальним пораненням госпіталізовано чоловіка 36 років. Після огляду хворого та рентгенологічного обстеження лікар виявив, що куля пройшла крізь кістку черепа біля підборідного отвору (foramen mentale) з ушкодженням судинно-нервового пучка та однойменного м'яза лиця. Крізь яку кістку пройшла куля?", "o": ["Верхню щелепу (maxilla).", "Леміш (vomer).", "Виличну кістку (os zygomaticum).", "Нижню щелепу (mandibula).", "Піднебінну кістку (os palatinum)."], "a": [3], "e": ["Верхня щелепа має підочноямковий отвір.", "Леміш — кістка носової перегородки.", "Вилична кістка має вилично-лицевий отвір.", "Підборідний отвір розташований на тілі нижньої щелепи.", "Піднебінна кістка має піднебінні отвори."]}], "models": [["Жувальний м'яз", "sf:6608f6a82eae49c18e4b1ce852557fb2", {"ru": "Жевательная мышца", "en": "Masseter"}], ["М'язи всього тіла", "sf:d32f5724fc294048888d03d215b9a1ff", {"ru": "Мышцы всего тела", "en": "Whole-body muscles"}]]}, {"id": "topic16", "title": "16. М’язи шиї. Топографія шиї, фасцій та клітковинних просторів", "tr": {"ru": "16. Мышцы шеи. Топография шеи, фасций и клетчаточных пространств", "en": "16. Neck muscles. Topography of the neck, fasciae and cellular spaces"}, "questions": [{"n": "16.1", "q": "У реанімаційне відділення госпіталізовано чоловіка 34 років з тяжким отруєнням невідомого походження. Для проведення комплексу лікувальних заходів необхідно виконати катетеризацію та введення лікарських речовин у підключичну вену. У якому топографічному просторі шиї розташована підключична вена?", "o": ["Spatium interaponeuroticum suprasternale.", "Spatium interscalenum.", "Spatium pretracheale.", "Spatium antescalenum.", "Trigonum omotrapezoideum."], "a": [3], "e": ["Надгруднинний міжапоневротичний простір лежить над груднинною вирізкою між листками фасції; там яремна венозна дуга, а не підключична вена.", "Міждрабинчастий простір (між переднім і середнім драбинчастими м’язами) містить підключичну артерію і плечове сплетення, вена сюди не входить.", "Передтрахейний простір лежить перед трахеєю; тут непарне щитоподібне венозне сплетення, а не підключична вена.", "Підключична вена проходить у переддрабинчастому просторі — попереду від переднього драбинчастого м’яза, тому його використовують для катетеризації.", "Лопатково-трапецієподібний трикутник — ділянка бічної шиї з гілками шийного сплетення і додатковим нервом; це трикутник, а не міжм’язовий простір."]}, {"n": "16.2", "q": "До лікаря-педіатра звернулася мати однорічної дівчинки зі скаргою на те, що у її дитини голова постійно повернена в лівий бік. Лікар діагностував кривошию внаслідок недорозвинення м'яза шиї. Який м’яз шиї недорозвинений у дитини?", "o": ["Груднинно-ключично-соскоподібний м’яз.", "Підшкірний м’яз.", "Двочеревцевий м’яз.", "Довгий м’яз шиї.", "Шило-під’язиковий м’яз."], "a": [0], "e": ["Вроджена м’язова кривошия виникає через вкорочення (недорозвинення) груднинно-ключично-соскоподібного м’яза.", "Platysma — тонкий підшкірний м’яз, він натягує шкіру шиї і не утримує положення голови.", "Двочеревцевий м’яз опускає нижню щелепу і піднімає під’язикову кістку, кривошиї не спричиняє.", "Довгий м’яз шиї згинає шийний відділ хребта вперед; однобічного стійкого повороту голови не дає.", "Шило-під’язиковий м’яз тягне під’язикову кістку назад і вгору, на положення голови не впливає."]}, {"n": "16.3", "q": "Чоловік 55 років скаржиться на біль під час рухів в бічній ділянці шиї. Найменше болю пацієнт відчуває коли нахиляє голову вліво, одночасно піднімає її і повертає обличчя у протилежний бік. Функція якого м’яза порушена?", "o": ["Musculus sternocleidomastoideus sinister.", "Musculus sternocleidomastoideus dexter.", "Musculus trapezius sinister.", "Musculus trapezius dexter.", "Musculus sternohyoideus."], "a": [0], "e": ["Лівий ГКС-м’яз нахиляє голову вліво і повертає обличчя вправо; біль найменший, коли ушкоджений м’яз скорочений і не розтягується, отже ушкоджено лівий.", "Правий ГКС-м’яз при такому русі (нахил вліво, обличчя вправо) розтягується, тому біль посилювався б, а не зменшувався.", "Трапецієподібний м’яз розгинає голову і піднімає лопатку; описаний рух не є його функцією.", "Правий трапецієподібний м’яз так само не виконує нахилу з поворотом обличчя в протилежний бік.", "Груднинно-під’язиковий м’яз лише опускає під’язикову кістку, на рухи голови не впливає."]}, {"n": "16.4", "q": "У жінки 37 років внаслідок потрапляння стороннього предмету в дихальні шляхи виник кашель, а згодом з'явилися ознаки асфіксії. Хворій проведена трахетомія в ділянці шиї, що обмежена верхнім черевцем m. omohyoideus, m. sternocleidomastoideus та серединною лінією шиї. У якому трикутнику шиї проведено хірургічне втручання?", "o": ["Trigonum caroticum.", "Trigonum omotracheale.", "Trigonum submandibulare.", "Trigonum omotrapezoideum.", "Trigonum omoclaviculare."], "a": [1], "e": ["Сонний трикутник обмежений ГКС-м’язом, заднім черевцем двочеревцевого і верхнім черевцем лопатково-під’язикового м’язів; серединна лінія його не обмежує.", "Лопатково-трахейний трикутник обмежений серединною лінією, ГКС-м’язом і верхнім черевцем лопатково-під’язикового м’яза — саме тут роблять трахеотомію.", "Піднижньощелепний трикутник обмежений нижньою щелепою і обома черевцями двочеревцевого м’яза.", "Лопатково-трапецієподібний трикутник лежить у бічній ділянці шиї, позаду ГКС-м’яза.", "Лопатково-ключичний трикутник обмежений ключицею, ГКС-м’язом і нижнім черевцем лопатково-під’язикового м’яза."]}, {"n": "16.5", "q": "Чоловіку 60 років під час проведення МРТ-обстеження діагностовано злоякісну пухлину гортані. Хворому необхідно проведення ургентної операції – накладання трахеостоми (введеня металевої трубки в трахею). Які м'язи шиї повинен розсунути хірург, не ушкоджуючи їх, щоб здійснити доступ до трахеї під час операції?", "o": ["Шило-під’язикові м’язи.", "Підборідно-під’язикові м’язи.", "Груднинно-ключично-соскоподібні м’язи.", "Двочеревцеві м’язи.", "Груднинно-під’язикові м’язи."], "a": [4], "e": ["Шило-під’язикові м’язи лежать вище під’язикової кістки, далеко від трахеї.", "Підборідно-під’язикові м’язи належать до дна ротової порожнини, доступу до трахеї не прикривають.", "ГКС-м’язи лежать збоку і в доступі до трахеї по серединній лінії не заважають.", "Двочеревцеві м’язи розташовані над під’язиковою кісткою, а трахеостому накладають нижче гортані.", "Груднинно-під’язикові м’язи лежать попереду трахеї обабіч серединної лінії; хірург розсуває їх по білій лінії шиї."]}, {"n": "16.6", "q": "У чоловіка 45 років виявлено запалення піднижньощелепної слинної залози. Під час огляду хворого лікар визначає болючість і припухлість під тілом нижньої щелепи. Для визначення місця проведення хірургічного доступа до залози під час оперативного втручання лікар використовує топографічні орієнтири та трикутники шиї. На який трикутник шиї проєктується піднижньощелепна слинна залоза?", "o": ["Trigonum omotracheale.", "Trigonum caroticum.", "Trigonum omoclaviculare.", "Trigonum submandibulare.", "Trigonum omotrapezoideum."], "a": [3], "e": ["Лопатково-трахейний трикутник лежить нижче під’язикової кістки, там щитоподібна залоза і трахея.", "Сонний трикутник містить судинно-нервовий пучок шиї, а не піднижньощелепну залозу.", "Лопатково-ключичний трикутник розташований над ключицею, далеко від щелепи.", "Піднижньощелепна залоза лежить у піднижньощелепному трикутнику між тілом нижньої щелепи і двочеревцевим м’язом.", "Лопатково-трапецієподібний трикутник — бічна ділянка шиї, слинних залоз там немає."]}, {"n": "16.7", "q": "У хірургічне відділення доставлено чоловіка 23 років з проникаючим пораненням шиї, яке ускладнилося запаленням клітковини передтрахейного простору. Лікар оцінює можливість розповсюдження інфекції. Куди може поширитись інфекція з передтрахейного простору?", "o": ["В міждрабинчастий простір.", "В грудну порожнину – заднє середостіння.", "В сонну піхву.", "В грудну порожнину – переднє середостіння.", "В надгруднинний простір."], "a": [3], "e": ["Міждрабинчастий простір не сполучається з передтрахейним, він лежить збоку між драбинчастими м’язами.", "Із заднім середостінням сполучається позадунутрощевий простір, а не передтрахейний.", "Сонна піхва — окремий фасціальний футляр судинно-нервового пучка, з передтрахейним простором прямо не сполучена.", "Передтрахейний простір донизу переходить у переднє середостіння, тому інфекція поширюється саме туди.", "Надгруднинний простір лежить поверхневіше (між листками власної фасції) і з передтрахейним не сполучений."]}, {"n": "16.8", "q": "У хірургічне відділення доставлено юнака 17 років з різаною раною шиї. Під час обстеження виявлено ушкодження груднинно-ключично-соскоподібного м’яза. Цей м'яз є важливим орієнтиром для визначення ділянок та трикутників шиї. Який трикутник шиї цей м’яз не обмежує?", "o": ["Trigonum omoclaviculare.", "Trigonum omotrapezoideum.", "Trigonum caroticum.", "Trigonum submandibulare.", "Trigonum omotracheale."], "a": [3], "e": ["Лопатково-ключичний трикутник спереду обмежений ГКС-м’язом.", "Лопатково-трапецієподібний трикутник спереду обмежений заднім краєм ГКС-м’яза.", "Сонний трикутник ззаду обмежений переднім краєм ГКС-м’яза.", "Піднижньощелепний трикутник утворений нижньою щелепою і черевцями двочеревцевого м’яза, ГКС-м’яз його не обмежує.", "Лопатково-трахейний трикутник збоку обмежений ГКС-м’язом."]}, {"n": "16.9", "q": "У чоловіка 54 років глибока різана рана вздовж І-го міжребрового простору справа з ушкодженням м'язових волокон глибокого м'яза шиї, що фіксуються до зовнішньої поверхні ІІ-ребра. Який м’яз шиї ушкоджено?", "o": ["Musculus scalenus medius.", "Musculus scalenus anterior.", "Musculus scalenus posterior.", "Musculus omohyoideus.", "Musculus stemocleidomastoideus."], "a": [2], "e": ["Середній драбинчастий м’яз прикріплюється до I ребра позаду борозни підключичної артерії.", "Передній драбинчастий м’яз прикріплюється до горбка переднього драбинчастого м’яза I ребра.", "Задній драбинчастий м’яз — єдиний, що прикріплюється до зовнішньої поверхні II ребра.", "Лопатково-під’язиковий м’яз іде від лопатки до під’язикової кістки, до ребер не кріпиться.", "ГКС-м’яз прикріплюється до груднини, ключиці і соскоподібного відростка, а не до ребер."]}, {"n": "16.10", "q": "У чоловіка 34 років під час доржньо-транспортої пригоди розпочалася кровотеча із загальної сонної артерії. Під час обробки рани було накладено судинний затискач на стінку ушкодженої судини в сонному трикутнику шиї. Крім того, в рані лікар побачив уражені волокна м'яза, який описує границі як сонного трикутника шиї, так і піднижньощелепного трикутника. Який м’яз є спільним у цих трикутниках?", "o": ["Musculus stemocleidomastoideus.", "Venter posterior musculі digastrici.", "Venter anterior musculі digastrici.", "Venter superior musculі omohyoidei.", "Venter inferior musculі omohyoidei."], "a": [1], "e": ["ГКС-м’яз обмежує сонний трикутник, але піднижньощелепного не обмежує.", "Заднє черевце двочеревцевого м’яза — верхня межа сонного і водночас нижня межа піднижньощелепного трикутника.", "Переднє черевце двочеревцевого м’яза обмежує піднижньощелепний і підпідборідний трикутники, сонного — ні.", "Верхнє черевце лопатково-під’язикового м’яза обмежує сонний трикутник, але не піднижньощелепний.", "Нижнє черевце лопатково-під’язикового м’яза обмежує трикутники бічної ділянки шиї."]}, {"n": "16.11", "q": "У жінки 45 років внаслідок травми ушкоджена внутрішня яремна вена, що проходить у складі судинно-нервового пучка шиї. Цей пучок розташований позаду м’яза, волокна якого разом із двочеревцевим та лопатково-під’язиковим м'язами обмежують сонний трикутник. Який це м’яз?", "o": ["Musculus sternohyoideus.", "Musculus sternocleidomastoideus.", "Musculus sternothyreoideus.", "Musculus scalenus anterior.", "Musculus scalenus medius."], "a": [1], "e": ["Груднинно-під’язиковий м’яз лежить попереду трахеї і не обмежує сонного трикутника.", "Сонний трикутник обмежений ГКС-м’язом, двочеревцевим і лопатково-під’язиковим м’язами; судинно-нервовий пучок лежить під ГКС-м’язом.", "Груднинно-щитоподібний м’яз прикриває щитоподібну залозу, межею сонного трикутника не є.", "Передній драбинчастий м’яз лежить глибше і не входить у межі сонного трикутника.", "Середній драбинчастий м’яз — глибокий м’яз бічної групи, до меж сонного трикутника не належить."]}, {"n": "16.12", "q": "У чоловіка 23 років внаслідок падіння з велосипеда травмовані передні гілки плечового сплетення, які проходять у spatium interscalenum. Які м’язи обмежують міждрабинчастий простір шиї?", "o": ["Musculus scalenus medius et musculus scalenus posterior.", "Musculus scalenus anterior et musculus sternocleidomastoideus.", "Muscuusl scalenus anterior et musculus scalenus medius.", "Musculus scalenus anterior et musculus longus colli.", "Musculus scalenus posterior et musculus trapezius."], "a": [2], "e": ["Між середнім і заднім драбинчастими м’язами немає топографічного простору з плечовим сплетенням.", "Між переднім драбинчастим і ГКС-м’язами розташований переддрабинчастий простір (там підключична вена).", "Міждрабинчастий простір обмежений переднім і середнім драбинчастими м’язами (і I ребром знизу); тут плечове сплетення і підключична артерія.", "Довгий м’яз шиї лежить на тілах хребців медіальніше і не обмежує міждрабинчастого простору.", "Задній драбинчастий і трапецієподібний м’язи не утворюють міждрабинчастого простору."]}, {"n": "16.13", "q": "У чоловіка 45 років діагностовано захворювання жовчного міхура і жовчних проток. Під час обстеження лікарем виявлено підсилення болю при натисканні на місце прєкції волокон діафрагмового нерва (позитивний «френікус-симптом»). У якому утворі шиї можна притиснути діафрагмовий нерв для підтвердження діагнозу?", "o": ["Fossa supraclavicularis major.", "Fossa supraclavicularis minor.", "Spatium antescalenum.", "Spatium intescalenum.", "Spatium pretracheale."], "a": [1], "e": ["Велика надключична ямка лежить над ключицею в лопатково-ключичному трикутнику; тут притискають підключичну артерію.", "Мала надключична ямка — між груднинною і ключичною ніжками ГКС-м’яза; тут під м’язом проходить діафрагмовий нерв, тому тиснуть саме сюди.", "Переддрабинчастий простір лежить глибоко, пальцем його безпосередньо не досягти.", "Міждрабинчастий простір містить плечове сплетення; діафрагмовий нерв лежить попереду переднього драбинчастого м’яза.", "Передтрахейний простір лежить перед трахеєю, діафрагмового нерва там немає."]}, {"n": "16.14", "q": "Під час оперативного втручання у чоловіка 45 років, хворого на рак язика, лікарю необхідно перев’язати язикову артерію. На який трикутник шиї проєктується язикова артерія?", "o": ["Trigonum omotrapezoideum.", "Trigonum omoclaviculare.", "Trigonum linguale.", "Trigonum omotracheale.", "Trigonum submandibulare."], "a": [2], "e": ["Лопатково-трапецієподібний трикутник — бічна шия, язикової артерії тут немає.", "Лопатково-ключичний трикутник лежить над ключицею, далеко від язикової артерії.", "Язиковий трикутник (Пирогова) у межах піднижньощелепного трикутника — місце для перев’язки язикової артерії.", "Лопатково-трахейний трикутник лежить нижче під’язикової кістки, язикова артерія вище.", "Піднижньощелепний трикутник містить язиковий трикутник, але точне місце доступу — саме трикутник Пирогова."]}, {"n": "16.15", "q": "У чоловіка 29 років внаслідок ножового поранення ушкоджена стінка загальної сонної артерії. Для зупинки кровотечі цю артерію необхідно притиснути до сонного горбка поперечного відростка шийного хребця. Який шийний хребець на поперечному відростку має сонний горбок?", "o": ["C I.", "C II.", "C IV.", "C V.", "C VI."], "a": [4], "e": ["C I (атлант) має передній і задній горбки на дугах, але не сонний горбок.", "C II (осьовий хребець) сонного горбка не має.", "На C IV передній горбок не виражений як сонний.", "C V сонного горбка не має.", "Передній горбок поперечного відростка C VI великий і називається сонним; до нього притискають загальну сонну артерію."]}, {"n": "16.16", "q": "У чоловіка 28 років після дорожньо-транспортної пригоди виник біль при повороті голови убік. Також відзначається утруднення під час глибокого вдиху. За даними МРТ-дослідження встановлено запалення передніх гілок шийного сплетення та порушення функції м’язів, які піднімають перші два ребра. Які м’язи ушкоджені?", "o": ["Надпід’язикові м’язи шиї.", "Підпід’язикові м’язи шиї.", "Присередня група глибоких м’язів шиї.", "Бічна група глибоких м’язів шиї.", "Musculus sternocleidomastoideus."], "a": [3], "e": ["Надпід’язикові м’язи опускають нижню щелепу і піднімають під’язикову кістку, ребер не піднімають.", "Підпід’язикові м’язи опускають під’язикову кістку і гортань.", "Присередня (передхребтова) група — довгі м’язи голови і шиї, прямі м’язи голови; вони згинають шию.", "Бічна група глибоких м’язів шиї — драбинчасті м’язи; вони піднімають I та II ребра і допомагають вдиху.", "ГКС-м’яз повертає і нахиляє голову, ребер безпосередньо не піднімає."]}, {"n": "16.17", "q": "Після хірургічного втручання у ділянці піднижньощелепного трикутника шиї у пацієнтки 40 років з’явилося порушення рухів під’язикової кістки назад і вгору, що ускладнило ковтання. Піл час ревізії рани лікар визначив, що ушкоджено волокна м’яза, що проходять разом із заднім черевцем двочеревцевого м’яза. Який м’яз ушкоджено?", "o": ["Musculus mylohyoideus.", "Musculus geniohyoideus.", "Musculus sternohyoideus.", "Musculus stylohyoideus.", "Musculus digastricus."], "a": [3], "e": ["Щелепно-під’язиковий м’яз утворює дно ротової порожнини і піднімає під’язикову кістку вгору.", "Підборідно-під’язиковий м’яз тягне під’язикову кістку вперед.", "Груднинно-під’язиковий м’яз опускає під’язикову кістку.", "Шило-під’язиковий м’яз іде поруч із заднім черевцем двочеревцевого і тягне під’язикову кістку назад і вгору.", "Двочеревцевий м’яз — сам орієнтир; його заднє черевце не ушкоджене за умовою, ушкоджено м’яз поруч із ним."]}, {"n": "16.18", "q": "У чоловіка 34 років під час МРТ-дослідження виявлено посттравматичне ушкодження м’язів, що розташовані вище під’язикової кістки. Яку функцію виконують ці м’язи?", "o": ["Піднімають нижню щелепу.", "Опускають нижню щелепу.", "Порушення розгинання голови.", "Опускають під’язикову кістку.", "Опускають щитоподібний хрящ гортані."], "a": [1], "e": ["Нижню щелепу піднімають жувальні м’язи, а не надпід’язикові.", "Надпід’язикові м’язи при фіксованій під’язиковій кістці опускають нижню щелепу (відкривають рот).", "Розгинання голови виконують м’язи потилиці і шиї ззаду, не надпід’язикові.", "Опускають під’язикову кістку підпід’язикові м’язи.", "Щитоподібний хрящ опускає груднинно-щитоподібний м’яз (підпід’язикова група)."]}, {"n": "16.19", "q": "Після травматичного ушкодження стінки внутрішньої яремної вени у чоловіка 50 років виникла підшкірна гематома в ділянці шиї. Крововилив обмежений заднім черевцем двочеревцевого м’яза, верхнім черевцем лопатково-під’язикового м’яза і переднім краєм m. sternocleidomastoideus. В якому просторі шиї лікар спостерігає гематому?", "o": ["Trigonum caroticum.", "Trigonum omotrapezoideum.", "Trigonum omoclaviculare.", "Trigonum submandibulare.", "Trigonum submentale."], "a": [0], "e": ["Сонний трикутник обмежений заднім черевцем двочеревцевого, верхнім черевцем лопатково-під’язикового м’язів і переднім краєм ГКС-м’яза.", "Лопатково-трапецієподібний трикутник лежить позаду ГКС-м’яза.", "Лопатково-ключичний трикутник обмежений ключицею і нижнім черевцем лопатково-під’язикового м’яза.", "Піднижньощелепний трикутник обмежений нижньою щелепою і обома черевцями двочеревцевого м’яза.", "Підпідборідний трикутник обмежений передніми черевцями двочеревцевих м’язів і під’язиковою кісткою."]}, {"n": "16.20", "q": "Чоловіку 25 років проведена трахеотомія з приводу звуження (стенозу) просвіту гортані. Хірургічний доступ здійснюється у трикутнику, який спереду обмежений серединною лінією шиї, збоку – переднім краєм m. sternocleidomastoideus, а зверху – venter superiors m. omohyoidei. В якому трикутнику виконано доступ під час операції?", "o": ["Trigonum omotracheale (musculare).", "Trigonum caroticum.", "Trigonum submentale.", "Trigonum omoclaviculare.", "Trigonum submandibulare."], "a": [0], "e": ["Лопатково-трахейний (м’язовий) трикутник: серединна лінія, ГКС-м’яз і верхнє черевце лопатково-під’язикового м’яза.", "Сонний трикутник лежить латеральніше і вище, межі інші.", "Підпідборідний трикутник розташований над під’язиковою кісткою.", "Лопатково-ключичний трикутник лежить над ключицею в бічній ділянці.", "Піднижньощелепний трикутник лежить під тілом нижньої щелепи."]}, {"n": "16.21", "q": "У чоловіка 45 років під час проведення катетеризації підключичної вени випадково порушена її стінка, після чого виникла підшкірна гематома в трикутнику шиї, що обмежений ключицею, m. sternocleidomastoideus та нижнім черевцем m. omohyoideus. В якому трикутнику шиї візуалізується гаматома?", "o": ["Trigonum caroticum.", "Trigonum omoclaviculare.", "Trigonum submentale.", "Trigonum omotrapezoideum.", "Trigonum submandibulare."], "a": [1], "e": ["Сонний трикутник обмежений двочеревцевим, лопатково-під’язиковим і ГКС-м’язами, а не ключицею.", "Лопатково-ключичний трикутник: ключиця, ГКС-м’яз і нижнє черевце лопатково-під’язикового м’яза; тут проєктується підключична вена.", "Підпідборідний трикутник лежить під підборіддям.", "Лопатково-трапецієподібний трикутник обмежений трапецієподібним м’язом, а не ключицею.", "Піднижньощелепний трикутник лежить під нижньою щелепою."]}, {"n": "16.22", "q": "У чоловіка 30 років після падіння з драбини під час МРТ-обстеження діагностовано перелом ключиці, першого правого ребра та ушкодження передніх гілок плечового сплетення у міждрабинчастому просторі шиї. Між якими м'язами розташовні гілки плечового сплетення?", "o": ["Musculi scalenus medius et posterior.", "Musculus scalenus anterior et musculus sternocleidomastoideus.", "Musculi scalenus anterior et medius.", "Musculus scalenus anterior et musculus longus colli.", "Musculus scalenus posterior et musculus trapezius."], "a": [2], "e": ["Між середнім і заднім драбинчастими м’язами плечове сплетення не проходить.", "Між переднім драбинчастим і ГКС-м’язами — переддрабинчастий простір з підключичною веною.", "Гілки плечового сплетення проходять у міждрабинчастому просторі між переднім і середнім драбинчастими м’язами.", "Довгий м’яз шиї лежить медіальніше, на хребцях.", "Задній драбинчастий і трапецієподібний м’язи не обмежують простору для плечового сплетення."]}, {"n": "16.23", "q": "У жінки 40 років діагностовано пухлину дна ротової порожнини. Під час планування тактики оперативного втручання лікар вирішив здійснити доступ у ротову порожнину через м'язи, що утворюють її нижню стінку. Які м’язи шиї утворюють дно ротової порожнини?", "o": ["Щелепно-під’язиковий, двочеревцевий, підборідно-під’язиковий мʼязи.", "Шило-під’язиковий, підборідно-під’язиковий мʼязи.", "Щелепно-під’язиковий, двочеревцевий мʼязи.", "Щелепно-під’язиковий мʼязи.", "Підборідно-під’язиковий, шило-під’язиковий, двочеревцевий мʼязи."], "a": [0], "e": ["Дно ротової порожнини утворюють щелепно-під’язиковий (діафрагма рота), а також двочеревцевий і підборідно-під’язиковий м’язи.", "Шило-під’язиковий м’яз до дна рота не входить; без щелепно-під’язикового дна не буде.", "Не названо підборідно-під’язиковий м’яз, який посилює дно рота.", "Щелепно-під’язиковий м’яз — основа дна, але його доповнюють ще двочеревцевий і підборідно-під’язиковий.", "Шило-під’язиковий м’яз до дна ротової порожнини не належить, а щелепно-під’язиковий пропущено."]}, {"n": "16.24", "q": "Чоловік 32 років звернувся до лікаря зі скаргами на постійний біль у передній ділянці шиї, який посилюється при рухах голови. Після проведення МРТ-дослідження діагностовано ушкодження передніх гілок шийного сплетення, які іннервують глибокі м’язи шиї. Які глибокі м’язи шиї ушкоджені?", "o": ["Musculus geniohyoideus, musculus digastricus.", "Musculus scalenus anterior, musculus scalenus medius, musculus scalenus posterior, musculus longus capitis et cervicis.", "Musculus digastricus, musculus mylohyoideus.", "Musculus platysma, musculus sternocleidomastoideus.", "Musculus digastricus, musculus stylohyoidtus."], "a": [1], "e": ["Підборідно-під’язиковий і двочеревцевий — надпід’язикові (поверхневі) м’язи.", "Глибокі м’язи шиї: драбинчасті (бічна група), довгий м’яз голови і шиї (присередня група); іннервуються гілками шийного сплетення.", "Двочеревцевий і щелепно-під’язиковий належать до надпід’язикових м’язів.", "Platysma і ГКС-м’яз — поверхневі м’язи шиї.", "Двочеревцевий і шило-під’язиковий — надпід’язикові м’язи."]}, {"n": "16.25", "q": "У чоловіка 45 років діагностовано запалення піднебінного мигдалика (ангіна). Щоб запобігти ускладнень оториноларинголог планує видалення мигдалика. При цьому хірурги завжди пам’ятають, що збоку від мигдаликової ямки (на відстані 1–1,5 см) розташований судинно-нервовий пучок шиї. У яку шийну ділянку проєктується судинно-нервовий пучок шиї?", "o": ["Regio retrosternocleidomastoideus.", "Trigonum omoclaviculare.", "Trigonum submentale.", "Trigonum omotrapezoideum.", "Trigonum submandibulare."], "a": [0], "e": ["Судинно-нервовий пучок шиї лежить під ГКС-м’язом, тобто проєктується на груднинно-ключично-соскоподібну ділянку.", "Лопатково-ключичний трикутник містить підключичні судини і плечове сплетення.", "Підпідборідний трикутник містить лімфовузли, судинно-нервового пучка шиї там немає.", "Лопатково-трапецієподібний трикутник містить гілки шийного сплетення і додатковий нерв.", "Піднижньощелепний трикутник містить слинну залозу і лицеві судини, але не основний пучок шиї."]}, {"n": "16.26", "q": "Чоловіка 34 років госпіталізовано у лікарню з різаною раною шиї. Під час хірургічної обробки рани, хірург виявив: ушкодження діафрагмового нерва, волокна якого лежать на musculus scalenus anterior; стиснення гематомою передніх гілок плечового сплетення, розташованих між переднім та середнім драбинчастими м'язами. Який простір шиї обмежують musculus scalenus anterior і musculus scalenus medius?", "o": ["Міждрабинчастий простір.", "Переддрабинчастий простір.", "Надгруднинний простір.", "Передтрахейний простір.", "Позадунутрощевий простір."], "a": [0], "e": ["Простір між переднім і середнім драбинчастими м’язами називається міждрабинчастим.", "Переддрабинчастий простір — між переднім драбинчастим і ГКС-м’язами.", "Надгруднинний простір лежить над груднинною вирізкою між листками фасції.", "Передтрахейний простір лежить перед трахеєю.", "Позадунутрощевий простір лежить позаду глотки і стравоходу."]}, {"n": "16.27", "q": "У лікарню госпіталізовано чоловіка 20 років із поверхневим ножевим пораненням в бічній шийній ділянці. Виконуючи хірургічну обробку рани, лікар перевірив цілісність гілок шийного сплетення, що виходять з-під заднього краю musculus sternocleidomastoideus. У якому трикутнику шиї лікар виконав хірургічну обробку рани?", "o": ["Лопатково-трапецієподібному трикутнику.", "Лопатково-ключичному трикутнику.", "Лопатково-трахейному трикутнику.", "Сонному трикутнику.", "Піднижньощелепному трикутнику."], "a": [0], "e": ["Гілки шийного сплетення виходять з-під заднього краю ГКС-м’яза (нервова точка) у лопатково-трапецієподібному трикутнику.", "Лопатково-ключичний трикутник лежить нижче, над ключицею.", "Лопатково-трахейний трикутник лежить спереду від ГКС-м’яза.", "Сонний трикутник лежить спереду від ГКС-м’яза, а не в бічній ділянці.", "Піднижньощелепний трикутник розташований під нижньою щелепою."]}, {"n": "16.28", "q": "Внаслідок ножового поранення у чоловіка ушкоджена шийна петля (ansa cervicalis), гілки якої іннервують підпід’язикові м’язи і один із м’язів надпід’язикової групи. Який м’яз надпід’язикової групи м'язів шиї ушкоджений?", "o": ["Musculus scaleni, musculus infrahyoidei.", "Musculus sternocleidomastoideus, musculus omohyoideus.", "Musculus longus colli, musculus longus capitis.", "Musculus geniohyoideus.", "Musculus rectus capitis anterior, musculus rectus capitis lateralis."], "a": [3], "e": ["Драбинчасті м’язи і підпід’язикові іннервуються з різних джерел; це не надпід’язиковий м’яз.", "ГКС-м’яз іннервує додатковий нерв, лопатково-під’язиковий — підпід’язиковий м’яз.", "Довгі м’язи шиї і голови — глибокі передхребтові м’язи.", "Підборідно-під’язиковий м’яз отримує волокна C1 (через під’язиковий нерв) — це надпід’язиковий м’яз, пов’язаний із шийною петлею.", "Прямі м’язи голови — глибокі м’язи, не надпід’язикові."]}, {"n": "16.29", "q": "Хірург, обробляючи потерпілому 20 років краї різаної рани в передньому трикутнику шиї, запобіг кровотечі з яремної венозної дуги, що лежить в просторі між поверхневою і глибокою пластинками власної фасції шиї. У якому просторі розташована на шиї аrcus venosus juguli?", "o": ["Міждрабинчастому просторі.", "Переддрабинчастому просторі.", "Надгруднинному просторі.", "Передтрахейному просторі.", "Позаднутрощевому просторі."], "a": [2], "e": ["Міждрабинчастий простір містить плечове сплетення і підключичну артерію.", "Переддрабинчастий простір містить підключичну вену.", "Яремна венозна дуга лежить у надгруднинному міжапоневротичному просторі між поверхневою і глибокою пластинками власної фасції шиї.", "Передтрахейний простір лежить глибше, перед трахеєю.", "Позадунутрощевий простір лежить позаду глотки і стравоходу."]}, {"n": "16.30", "q": "У травматологічне відділення каретою швидкої медичної допомоги госпіталізовано жінку з травмою шиї. Під час МРТ-обстеження у жінки діагностовано перелом під’язикової кістки, виявлено ушкодження підпід’язикових м’язів та фасції шиї, що утворює фасціальні піхви для кожного м’яза з цієї групи. Яка фасція ушкоджена?", "o": ["Поверхнева фасція шиї.", "Поверхневий листок власної фасції шиї.", "Глибокий листок власної фасції шиї.", "Внутрішньогрудна фасція шиї.", "Позаднутрощева фасція шиї."], "a": [2], "e": ["Поверхнева фасція шиї містить platysma, але піхв для підпід’язикових м’язів не утворює.", "Поверхневий листок власної фасції утворює піхви для ГКС- і трапецієподібного м’язів.", "Глибокий листок власної фасції (передтрахейна пластинка) утворює фасціальні піхви для підпід’язикових м’язів.", "Внутрішньогрудна фасція вистеляє грудну порожнину, на шиї її немає.", "Позадунутрощевої фасції як окремої фасції шиї немає; глибше лежить передхребтова пластинка."]}], "models": [["М'язи шиї: основні форми", "sf:d3f34f219df84271aacfbeb93782f11a", {"ru": "Мышцы шеи: основные формы", "en": "Neck muscles: main shapes"}], ["М'язи голови і шиї (кольорові)", "sf:99717ac9c0434ac59fc5efd3d1dc3471", {"ru": "Мышцы головы и шеи (цветные)", "en": "Head and neck muscles (colour-coded)"}], ["М'язи всього тіла", "sf:d32f5724fc294048888d03d215b9a1ff", {"ru": "Мышцы всего тела", "en": "Whole-body muscles"}]]}, {"id": "topic17", "title": "17. М’язи верхньої кінцівки: м’язи грудного пояса, плеча, передпліччя", "tr": {"ru": "17. Мышцы верхней конечности: мышцы плечевого пояса, плеча, предплечья", "en": "17. Upper limb muscles: shoulder girdle, arm, forearm"}, "questions": [{"n": "17.1", "q": "Після травми верхньої кінцівки юнак не може виконати розгинання в ліктьовому суглобі. Порушення функції якого м'яза може викликати цей стан?", "o": ["Musculus teres major.", "Musculus infraspinatus.", "Musculus levator scapulae.", "Musculus triceps brachii.", "Musculus subscapularis."], "a": [3], "e": ["Великий круглий м’яз приводить, розгинає і привертає плече, на ліктьовий суглоб не діє.", "Підостьовий м’яз відвертає плече, ліктя не розгинає.", "М’яз-підіймач лопатки піднімає лопатку, до плеча й передпліччя не прикріплюється.", "Триголовий м’яз плеча прикріплюється до ліктьового відростка і є головним розгиначем передпліччя в ліктьовому суглобі.", "Підлопатковий м’яз привертає плече, ліктя не розгинає."]}, {"n": "17.2", "q": "У підлітка 16 років виявлено травму плечового суглоба. Під час проведення МРТ-дослідження лікар виявив на знімку ушкодження підсуглобового горбка лопатки та відрив від нього сухожилка м’яза. Сухожилок якого м'яза, що починається в цьому місці, зазнав ушкодження?", "o": ["Caput longum musculus tricipitis brachii.", "Caput breve musculus bicipitis brachii.", "Caput mediale musculus tricipitis brachii.", "Caput laterale musculus tricipitis brachii.", "Caput longum musculus bicipitis brachii."], "a": [0], "e": ["Довга головка триголового м’яза плеча починається від підсуглобового горбка лопатки.", "Коротка головка двоголового м’яза починається від дзьобоподібного відростка.", "Присередня головка триголового м’яза починається від задньої поверхні плечової кістки нижче борозни променевого нерва.", "Бічна головка триголового м’яза починається від плечової кістки вище борозни променевого нерва.", "Довга головка двоголового м’яза починається від надсуглобового (а не підсуглобового) горбка."]}, {"n": "17.3", "q": "Жінка 34 років травмувала праву кисть. Під час огляду у хворого виявлена різана рана у ділянці підвищення великого пальця правої кисті. Який м’яз ушкоджено, якщо кінцева фаланга І пальця не згинається?", "o": ["Musculus opponens pollicis.", "Musculus flexor pollicis brevis.", "Musculus abductor pollicis brevis.", "Musculus flexor pollicis longus.", "Musculus adductor pollicis."], "a": [3], "e": ["Протиставний м’яз великого пальця протиставляє палець, фаланг не згинає.", "Короткий згинач великого пальця згинає проксимальну фалангу, кінцеву — ні.", "Короткий відвідний м’яз відводить великий палець.", "Довгий згинач великого пальця прикріплюється до дистальної фаланги і єдиний згинає її; його сухожилок проходить у ділянці тенара.", "Привідний м’яз приводить великий палець, кінцеву фалангу не згинає."]}, {"n": "17.4", "q": "Під час падіння з висоти юнак ушкодив передню плечову ділянку. Після проведення МРТ-обстеження хірург діагностував розрив двоголового м’яза плеча. Які функції верхньої кінцівки будуть порушені?", "o": ["Згинання та відвертання передпліччя в ліктьовому суглобі, згинання плеча у плечовому суглобі.", "Згинання та привертання передпліччя в ліктьовому суглобі, згинання плеча у плечовому.", "Згинання передпліччя в ліктьовому суглобі та кисті.", "Згинання верхньої кінцівки у плечовому, ліктьовому суглобах та кисті.", "Згинання верхньої кінцівки у плечовому суглобі та відведення плеча."], "a": [0], "e": ["Двоголовий м’яз згинає плече (довга головка), згинає передпліччя і відвертає його (супінація) — усе це випадає.", "Двоголовий м’яз не привертає, а навпаки відвертає передпліччя.", "Кисть двоголовий м’яз не згинає, бо до неї не прикріплюється.", "Згинання кисті виконують м’язи передпліччя, а не двоголовий.", "Відведення плеча — функція дельтоподібного і надостьового м’язів."]}, {"n": "17.5", "q": "Після травми кісток грудного пояса чоловік скаржиться на неможливість виконати відведення у плечовому суглобі. Які м'язи виконують відведення в плечовому суглобі?", "o": ["Musculus teres major et musculus subscapularis.", "Musculus deltoideus et musculus supraspinatus.", "Musculus supraspinatus et musculus teres major.", "Musculus teres minor et musculus deltoideus.", "Musculus subscapularis et musculus coracobrachialis."], "a": [1], "e": ["Великий круглий і підлопатковий м’язи приводять і привертають плече.", "Відведення плеча виконують дельтоподібний м’яз (основний) і надостьовий (починає рух).", "Великий круглий м’яз приводить плече, а не відводить.", "Малий круглий м’яз приводить і відвертає плече.", "Підлопатковий і дзьобо-плечовий м’язи привертають, приводять і згинають плече."]}, {"n": "17.6", "q": "Чоловік 43 років отримав виробничу травму у ділянці плечового суглоба. Рентгенологічно у хворого діагностовано перелом надплечового відростка лопатки та відрив м’язових волокон, що починаються від нього. У хворого обмежене відведення верхньої кінцівки у плечовому суглобі. Який м’яз ушкоджений?", "o": ["Musculus infraspinatus.", "Musculus latissimus dorsi.", "Musculus teres major.", "Musculus deltoideus.", "Musculus coracobrachialis."], "a": [3], "e": ["Підостьовий м’яз починається від підостьової ямки.", "Найширший м’яз спини починається від хребців, крижів і клубового гребеня.", "Великий круглий м’яз починається від нижнього кута лопатки.", "Від надплечового відростка починається середня частина дельтоподібного м’яза — головного відвідника плеча.", "Дзьобо-плечовий м’яз починається від дзьобоподібного відростка."]}, {"n": "17.7", "q": "Чоловіка 45 років госпіталізовано до травматологічного відділення лікарні з різаною раною передньої передплічної ділянки ближче до присереднього краю. Під час обстеження лікар виявив порушення функції двох м'язів передпліччя − ліктьового м'яза-згинача і ліктьового м'яза-розгинача зап'ястка. Який рух не може виконати чоловік при одночасному скороченні ушкоджених м'язів?", "o": ["Згинання кисті.", "Розгинання і відведення кисті.", "Приведення кисті.", "Відведення кисті.", "Розгинання кисті."], "a": [2], "e": ["Згинання кисті збереглося б завдяки променевому згиначу зап’ястка і згиначам пальців.", "Розгинання з відведенням виконують променеві розгиначі зап’ястка.", "Ліктьові згинач і розгинач зап’ястка при спільному скороченні приводять кисть (ліктьове відхилення).", "Відведення кисті виконують променеві згинач і розгиначі.", "Розгинання кисті збереглося б завдяки променевим розгиначам зап’ястка."]}, {"n": "17.8", "q": "Під час огляду травматолог у жінки 45 років виявив ушкодження функції малого круглого м’яза. Який рух у плечовому суглобі буде обмежений?", "o": ["Відведення.", "Відвертання, відведення.", "Привертання, приведення.", "Приведення, відвертання.", "Згинання."], "a": [3], "e": ["Відведення плеча виконують дельтоподібний і надостьовий м’язи.", "Малий круглий м’яз не відводить плече.", "Привертання — функція підлопаткового і великого круглого м’язів.", "Малий круглий м’яз приводить плече і відвертає його (обертає назовні).", "Згинання плеча виконують дельтоподібний (передня частина), дзьобо-плечовий, двоголовий м’язи."]}, {"n": "17.9", "q": "Жінка 25 років травмувала при падінні променеву кістку в типовому місці. Під час цієї травми порущується функція комбінованих між собою проксимального та дистального променево-ліктьових суглобів. Характерною ознакою цього перелому є неможливість виконувати обертання (rotatio) – привертання та відвертання. Навколо якої осі людина виконує rotatio?", "o": ["Лобової.", "Стрілової.", "Вертикальної.", "Поперечної.", "Серединної."], "a": [2], "e": ["Навколо лобової осі виконуються згинання і розгинання.", "Навколо стрілової осі виконуються відведення і приведення.", "Привертання і відвертання передпліччя — обертання навколо вертикальної (поздовжньої) осі.", "Поперечна вісь — інша назва лобової; навколо неї згинання/розгинання.", "Серединної осі руху в анатомії не виділяють."]}, {"n": "17.10", "q": "До приймального відділення лікарні госпіталізовано чоловіка 23 років із переломом верхньої третини плечової кістки зі зміщенням уламків, внаслідок чого були ушкоджені судини і нерви, що проходять через чотиристоронній отвір на задній стінці пахвової порожнини. Якими утворами обмежений чотиристоронній отвір?", "o": ["Musculus teres major, musculus latissimus dorsi, musculus biceps brachii, musculus brachialis.", "Musculus teres major, musculus teres minor, musculus triceps brachii, musculus brachialis.", "Musculus latissimus dorsi, musculus infraspinatus, musculus coracobrachialis, musculus brachialis.", "Musculus teres major, musculus teres minor, musculus triceps brachii, humerus.", "Musculus teres major, musculus biceps brachii, os humeri, musculus brachialis"], "a": [3], "e": ["Двоголовий і плечовий м’язи не обмежують отворів задньої стінки пахвової порожнини.", "Плечовий м’яз лежить на передній поверхні плеча і в утворенні отвору не бере участі.", "Підостьовий, дзьобо-плечовий і плечовий м’язи не утворюють чотиристороннього отвору.", "Чотиристоронній отвір: зверху малий круглий, знизу великий круглий м’яз, медіально довга головка триголового м’яза, латерально плечова кістка.", "Двоголовий і плечовий м’язи не належать до меж цього отвору."]}, {"n": "17.11", "q": "Велосипедист упав на лікоть і зламав ліктьовий відросток ліктьової кістки, внаслідок чого ушкодив ліктьовий нерв у задній присередній ліктьовій борозні. Чим утворена задня присередня ліктьова борозна?", "o": ["Musculus brachioradialis, olecranon.", "Musculus brachialis, musculus brachioradialis.", "Musculus triceps brachii.", "Olecranon, epicondilus medialis ossis humeri.", "Epicondilus medialis ossis humeri, musculus brachialis."], "a": [3], "e": ["Плечо-променевий м’яз лежить з латерального боку, далеко від ліктьового нерва.", "Плечовий і плечо-променевий м’язи утворюють передню бічну ліктьову борозну.", "Триголовий м’яз прикріплюється до ліктьового відростка, але борозни не утворює.", "Задня присередня ліктьова борозна лежить між ліктьовим відростком і присереднім надвиростком плечової кістки; тут ліктьовий нерв.", "Присередній надвиросток і плечовий м’яз утворюють передню присередню борозну."]}, {"n": "17.12", "q": "Юнака 17 років госпіталізовано в хірургічне відділення з різаною раною лопаткової ділянки спини. Хірург виявив ушкодження волокон дельтоподібного м’яза в місці початку його волокон від ості лопатки. Ушкодження цієї порції волокон дельтоподібного м’яза порушує певні довільні рухи у плечовому суглобі. Які рухи в плечовому суглобі у нього будуть порушені?", "o": ["Відведення, привертання.", "Відведення, відвертання.", "Згинання.", "Розгинання.", "Приведення, привертання."], "a": [1], "e": ["Остьова частина дельтоподібного м’яза не привертає плече; привертає ключична частина.", "Остьова частина дельтоподібного м’яза разом з усім м’язом бере участь у відведенні і відвертає (обертає назовні) плече; вона також розгинає його.", "Згинає плече ключична (передня) частина дельтоподібного м’яза.", "Розгинання — теж функція задньої частини, але варіант не враховує відведення і відвертання.", "Приведення і привертання не є функціями остьової частини дельтоподібного м’яза."]}, {"n": "17.13", "q": "Чоловіка 45 років госпіталізовано в хірургічне відділення лікарні з різаною раною вздовж бічного краю передпліччя. Під час обстеження виявлено, що у чоловіка перерізані м’язи: довгий і короткий променеві м’язи-розгиначі зап’ястка, плечо-променевий м’яз. Які рухи виконують ці м’язи при одночасному скороченні в нормі?", "o": ["Згинання кисті.", "Розгинання кисті і зап’ястка, відведення кисті.", "Відведення кисті.", "Приведення кисті.", "Розгинання і привертання кисті."], "a": [1], "e": ["Ці м’язи лежать на розгинальній поверхні і кисть не згинають.", "Довгий і короткий променеві розгиначі розгинають і відводять кисть; плечо-променевий м’яз приєднується як допоміжний.", "Відведення кисті є, але неповна відповідь — розгинання також випадає.", "Приведення кисті виконують ліктьові м’язи зап’ястка.", "Привертання кисті ці м’язи не виконують."]}, {"n": "17.14", "q": "Під час спортивного змаганння боєць отримав травму кісток грудного пояса. На рентгенограммі лікар виявив перелом дзьобоподібного відростка лопатки, внасліок чого хворий не може привести верхню кінцівку до тулуба, порушене згинаня в плечовому і ліктьовому суглобах. Функція яких м’язів порушена?", "o": ["Musculus brachialis.", "Musculus biceps brachii, musculus brachioradialis.", "Musculus brachialis, musculus biceps brachii, musculus pectoralis minor", "Musculus coracobrachialis, musculus biceps brachii, musculus pectoralis minor.", "Musculus brachialis, musculus coracobrachialis."], "a": [3], "e": ["Плечовий м’яз починається від плечової кістки, від дзьобоподібного відростка — ні.", "Плечо-променевий м’яз починається від латерального надвиростка, не від дзьобоподібного відростка.", "Плечовий м’яз до дзьобоподібного відростка не кріпиться.", "До дзьобоподібного відростка кріпляться дзьобо-плечовий, коротка головка двоголового і малий грудний м’язи — їхні функції й випали.", "Плечовий м’яз не пов’язаний з дзьобоподібним відростком."]}, {"n": "17.15", "q": "У спортсмена 20 років після травми під час МРТ-обстеження діагностовано перелом лопатки в ділянці її нижнього кута, внаслідок чого юнак не може приводити верхню кінцівку до тулуба та в повному обсязі привертати плече. Функція якого м’яза порушена?", "o": ["Musculus teres minor.", "Musculus supraspinatus.", "Musculus brachialis.", "Musculus infraspinatus.", "Musculus teres major."], "a": [4], "e": ["Малий круглий м’яз починається від латерального краю лопатки і відвертає плече.", "Надостьовий м’яз відводить плече.", "Плечовий м’яз згинає передпліччя.", "Підостьовий м’яз відвертає плече.", "Великий круглий м’яз починається від нижнього кута лопатки, приводить і привертає плече."]}, {"n": "17.16", "q": "Чоловік отримав на виробництві травму нижньої третини передньої передплічної ділянки, внаслідок чого порушено згинання в II–V міжфалангових суглобах кисті (пальці в кулак). Який м’яз найбільше ушкоджений внаслідок травми?", "o": ["Musculus flexor carpi ulnaris.", "Musculus flexor carpi radialis.", "Musculus brachioradialis.", "Musculus flexor digitorum profundus.", "Musculus pronator teres."], "a": [3], "e": ["Ліктьовий згинач зап’ястка згинає і приводить кисть, на пальці не діє.", "Променевий згинач зап’ястка згинає і відводить кисть.", "Плечо-променевий м’яз згинає передпліччя.", "Глибокий згинач пальців згинає II–V пальці в міжфалангових суглобах (особливо дистальних), стискаючи кисть у кулак.", "Круглий привертач привертає передпліччя."]}, {"n": "17.17", "q": "Дитина 10 років під час гри впала та вдарилася долонею. Після цього вона не може протиставити великий палець іншим пальцям кисті, що ускладнює захоплення дрібних предметів. Який м’яз імовірно ушкоджений?", "o": ["Musculus opponens pollicis.", "Musculus flexor pollicis longus.", "Musculus extensor pollicis longus.", "Musculus abductor pollicis brevis.", "Musculus adductor pollicis."], "a": [0], "e": ["Протиставний м’яз великого пальця забезпечує протиставлення — без нього не захопити дрібні предмети.", "Довгий згинач великого пальця згинає дистальну фалангу.", "Довгий розгинач великого пальця розгинає палець.", "Короткий відвідний м’яз відводить великий палець.", "Привідний м’яз приводить великий палець."]}, {"n": "17.18", "q": "Після падіння у чоловіка 32 років спостерігається набряк та крововилив вздовж бічного краю передпліччя. Чоловік не може розігнути та відвести кисть. Які м’язи імовірно ушкоджені?", "o": ["Musculus flexor carpi radialis та musculus flexor carpi ulnaris.", "Musculus flexor digitorum superficialis.", "Musculus extensor carpi radialis longus і brevis, musculus brachioradialis.", "Musculus brachioradialis.", "Musculus supinator."], "a": [2], "e": ["Згиначі зап’ястка лежать на передній поверхні і згинають кисть.", "Поверхневий згинач пальців згинає середні фаланги.", "Променеві розгиначі зап’ястка (довгий і короткий) і плечо-променевий м’яз лежать уздовж бічного краю: розгинають і відводять кисть.", "Плечо-променевий м’яз сам кисть не розгинає.", "Відвертач обертає передпліччя назовні."]}, {"n": "17.19", "q": "19. Пацієнт скаржиться на труднощі при стисканні кисті в кулак, особливо при згинанні дистальних фаланг II–V пальців у міжфалангових суглобах. Який м’яз ушкоджений?", "o": ["Musculus flexor digitorum profundus.", "Musculus flexor carpi ulnaris.", "Musculus flexor pollicis longus.", "Musculus extensor digitorum.", "Musculus palmaris longus."], "a": [0], "e": ["Глибокий згинач пальців прикріплюється до дистальних фаланг II–V пальців і згинає їх.", "Ліктьовий згинач зап’ястка діє на кисть, а не на фаланги.", "Довгий згинач великого пальця діє лише на I палець.", "Розгинач пальців розгинає, а не згинає пальці.", "Довгий долонний м’яз натягує долонний апоневроз."]}, {"n": "17.20", "q": "Дитина 5 років після травми не може тримати предмети між великим і вказівним пальцем (ослаблений пінцетний хапальний рух). Який м’яз ушкоджений?", "o": ["Musculus adductor pollicis.", "Musculus abductor pollicis brevis.", "Musculus flexor pollicis brevis.", "Musculus opponens pollicis.", "Musculus extensor pollicis brevis."], "a": [0], "e": ["Привідний м’яз великого пальця притискає його до вказівного — основа пінцетного (ключового) захоплення.", "Короткий відвідний м’яз відводить великий палець від долоні.", "Короткий згинач згинає проксимальну фалангу I пальця.", "Протиставний м’яз протиставляє палець, але утримання між I і II пальцем забезпечує привідний.", "Короткий розгинач розгинає проксимальну фалангу."]}, {"n": "17.21", "q": "У чоловіка 34 років після травми верхньої третини передпліччя відзначається неможливість обертання досередини. Який м’яз імовірно ушкоджений?", "o": ["Musculus pronator teres.", "Musculus supinator.", "Musculus flexor carpi radialis.", "Musculus extensor carpi ulnaris.", "Musculus palmaris longus."], "a": [0], "e": ["Круглий привертач лежить у верхній третині передпліччя і обертає його досередини (пронація).", "Відвертач обертає передпліччя назовні.", "Променевий згинач зап’ястка згинає і відводить кисть.", "Ліктьовий розгинач зап’ястка розгинає і приводить кисть.", "Довгий долонний м’яз натягує долонний апоневроз."]}, {"n": "17.22", "q": "Чоловік 32 років після падіння не може утримувати кисть у нейтральному положенні між пронацією і супінацією, ускладнено згинання в ліктьовому суглобі. Який м’яз ушкоджений?", "o": ["Musculus brachioradialis.", "Musculus biceps brachii.", "Musculus pronator teres.", "Musculus supinator.", "Musculus triceps brachii."], "a": [0], "e": ["Плечо-променевий м’яз згинає передпліччя і встановлює його в середнє положення між пронацією і супінацією.", "Двоголовий м’яз згинає і відвертає передпліччя, а не утримує нейтральну позицію.", "Круглий привертач обертає передпліччя досередини.", "Відвертач обертає передпліччя назовні.", "Триголовий м’яз розгинає передпліччя."]}, {"n": "17.23", "q": "Чоловік 45 років травмував кисть на виробництві. У лікарню звернувся зі скаргами на неможливість виконати розгинання великого пальця. Лікар виявив гематому на тильній поверхні кисті в ділянці «анатомічної табакерки» та запідозрив ушкодження сухожилка м'яза, що її оточує. Який м’яз ушкоджено?", "o": ["Musculus extensor pollicis longus.", "Musculus abductor pollicis brevis.", "Musculus flexor pollicis longus.", "Musculus opponens pollicis.", "Musculus adductor pollicis."], "a": [0], "e": ["Довгий розгинач великого пальця обмежує «анатомічну табакерку» з присереднього боку і розгинає палець.", "Короткий відвідний м’яз лежить у тенарі на долонній поверхні.", "Довгий згинач великого пальця лежить на долонній поверхні і згинає палець.", "Протиставний м’яз — долонний м’яз тенара.", "Привідний м’яз лежить у долоні."]}, {"n": "17.24", "q": "Введення ліків у венозне русло чи забір крові для дослідження зручно проводити в ліктьовій ямці у зв’язку з тим, що безпосередньо під шкірою у передній ліктьовій ділянці проходить серединна вена ліктя. Чим обмежена ліктьова ямка?", "o": ["Musculus brachialis, musculus brachioradialis, musculus pronator teres.", "Musculus biceps brachii, musculus brachioradialis, musculus pronator teres.", "Musculus biceps brachii, musculus brachioradialis, musculus flexor carpi ulnaris.", "Musculus biceps brachii, musculus brachioradialis, musculus flexor carpi radialis.", "Musculus brachioradialis, musculus pronator teres, musculus flexor carpi ulnaris."], "a": [0], "e": ["Ліктьова ямка: латерально плечо-променевий м’яз, медіально круглий привертач, дно — плечовий м’яз.", "Двоголовий м’яз лише проходить сухожилком у ямку, її межею не вважається.", "Ліктьовий згинач зап’ястка не обмежує ліктьову ямку.", "Променевий згинач зап’ястка не є межею ліктьової ямки.", "Ліктьовий згинач зап’ястка не належить до меж ямки."]}, {"n": "17.25", "q": "Чоловік 43 років отримав травму кисті і нижньої третини передпліччя на виробництві. Пацієнт не може обертати кисть долонею донизу (пронація ускладнена). Який м’яз ушкоджений?", "o": ["Musculus pronator quadratus.", "Musculus supinator.", "Musculus flexor carpi ulnaris.", "Musculus palmaris longus.", "Musculus flexor carpi radialis."], "a": [0], "e": ["Квадратний привертач лежить у нижній третині передпліччя і є головним привертачем.", "Відвертач обертає передпліччя назовні.", "Ліктьовий згинач зап’ястка згинає і приводить кисть.", "Довгий долонний м’яз натягує долонний апоневроз.", "Променевий згинач зап’ястка згинає і відводить кисть."]}, {"n": "17.26", "q": "Після падіння на плече хлопчик 6 років скаржиться на біль і слабкість при згинанні верхньої кінцівки у плечовому суглобі. При спробі підняти руку вперед, сила згинання значно знижена. Який м’яз імовірно ушкоджений?", "o": ["Musculus coracobrachialis.", "Musculus deltoideus.", "Musculus pectoralis major.", "Musculus supraspinatus.", "Musculus latissimus dorsi."], "a": [0], "e": ["Дзьобо-плечовий м’яз згинає і приводить плече; при його ушкодженні сила згинання знижується.", "Дельтоподібний м’яз переважно відводить плече (згинає лише ключична частина).", "Великий грудний м’яз переважно приводить і привертає плече.", "Надостьовий м’яз відводить плече.", "Найширший м’яз спини розгинає і приводить плече."]}, {"n": "17.27", "q": "Після ножового поранення кисті чоловік 46 років не може відвести II і IV пальці від III (середнього пальця). При спробі відведення пальців вони залишаються в нейтральному положенні. Пацієнт не може зігнути проксимальні фаланги пальців, розігнути дистальні. Яка група м’язів ушкоджена?", "o": ["Musculi interossei dorsales.", "Musculi interossei palmares.", "Musculi lumbricales.", "Musculus flexor digitorum profundus.", "Musculus flexor digitorum superficialis."], "a": [0], "e": ["Тильні міжкісткові м’язи відводять II і IV пальці від III, згинають проксимальні і розгинають дистальні фаланги.", "Долонні міжкісткові м’язи приводять пальці до середнього.", "Червоподібні м’язи згинають проксимальні і розгинають дистальні фаланги, але пальців не відводять.", "Глибокий згинач згинає дистальні фаланги.", "Поверхневий згинач згинає середні фаланги."]}, {"n": "17.28", "q": "Юнак отримав травму кисті при падінні з велосипеду. На рентгенограмі діагностовано відрив гачка гачкуватої кістки. Під час огляду пацієнта лікар виявив крововилив в ділянці підвищення мізинця. Пацієнт не може протиставити мізинець великому пальцю, що ускладнює захоплення дрібних предметів. Який м’яз зазнав ушкодження?", "o": ["Musculus opponens digiti minimi.", "Musculus abductor digiti minimi.", "Musculus flexor digiti minimi brevis.", "Musculus extensor digitorum.", "Musculus palmaris brevis."], "a": [0], "e": ["Протиставний м’яз мізинця прикріплюється від гачка гачкуватої кістки і протиставляє мізинець.", "Відвідний м’яз мізинця відводить мізинець.", "Короткий згинач мізинця згинає проксимальну фалангу.", "Розгинач пальців лежить на тилі передпліччя.", "Короткий долонний м’яз зморщує шкіру гіпотенара."]}, {"n": "17.29", "q": "Чоловік 25 років отримав травму кисті на виробництві. Під час огляду хворого лікар виявив крововилив у ділянці підвищення великого пальця (тенара). Пацієнт не може зігнути великий палець. При спробі стиснути кисть в кулак, великий палець залишається випрямленим. Який м’яз ушкоджено?", "o": ["Musculus flexor pollicis brevis.", "Musculus abductor pollicis brevis.", "Musculus extensor pollicis longus.", "Musculus opponens pollicis.", "Musculus adductor pollicis."], "a": [0], "e": ["Короткий згинач великого пальця лежить у тенарі і згинає проксимальну фалангу; при його ушкодженні палець лишається випрямленим.", "Короткий відвідний м’яз відводить, а не згинає палець.", "Довгий розгинач розгинає палець і лежить на тилі.", "Протиставний м’яз протиставляє палець.", "Привідний м’яз приводить палець."]}, {"n": "17.30", "q": "Після травми передпліччя у чоловіка 57 років порушено приведення кисті. При спробі згинання у променево-зап'ястковому кисть помітно відхиляється в напрямку бічного (променевого) краю передпліччя. Який м’яз ушкоджений?", "o": ["Musculus flexor carpi ulnaris.", "Musculus flexor carpi radialis.", "Musculus extensor carpi radialis brevis.", "Musculus palmaris longus.", "Musculus extensor digitorum."], "a": [0], "e": ["Ліктьовий згинач зап’ястка згинає і приводить кисть; без нього при згинанні кисть відхиляється в променевий бік.", "Променевий згинач зап’ястка відводить кисть — він цілий і тягне її латерально.", "Короткий променевий розгинач розгинає кисть.", "Довгий долонний м’яз натягує долонний апоневроз.", "Розгинач пальців розгинає пальці."]}], "models": [["М'язи, що з'єднують тулуб з рукою", "o3d:upper-limb-axio-appendicular-muscles&subset=muscle-and-ligament-parts-hidden", {"ru": "Мышцы, соединяющие туловище с рукой", "en": "Axio-appendicular muscles"}], ["М'язи плеча", "o3d:upper-limb-arm-muscles&subset=ligament-parts-hidden", {"ru": "Мышцы плеча", "en": "Arm muscles"}], ["М'язи передпліччя (передня група)", "o3d:upper-limb-forearm-anterior-compartment-muscles", {"ru": "Мышцы предплечья (передняя группа)", "en": "Forearm muscles (anterior group)"}], ["Обертальна манжета плеча", "o3d:rotator-cuff", {"ru": "Вращательная манжета плеча", "en": "Rotator cuff"}]]}, {"id": "topic18", "title": "18. М’язи кисті. Фасції верхньої кінцівки. Топографія верхньої кінцівки", "tr": {"ru": "18. Мышцы кисти. Фасции и топография верхней конечности", "en": "18. Hand muscles. Fasciae and topography of the upper limb"}, "questions": [{"n": "18.1", "q": "У чоловіка 23 років гнійне запалення кінцевої фаланги мізинця розповсюдилось на кисть і передпліччя. По якому навколосухожилковому утвору поширився гнійний процес на передпліччя?", "o": ["Canalis carpi radialis.", "Vagina tendinis Musculus flexoris pollicis longi.", "Vagina communis tendinum flexorum.", "Vagina synoviales digitorum manus.", "Canalis carpi ulnaris."], "a": [2], "e": ["Променевий канал зап’ястка містить сухожилок променевого згинача зап’ястка, з мізинцем не пов’язаний.", "Піхва довгого згинача великого пальця продовжується з I пальця, а не з мізинця.", "Синовіальна піхва V пальця переходить у загальну піхву згиначів, яка тягнеться на передпліччя — шлях поширення гною.", "Синовіальні піхви II–IV пальців ізольовані і на передпліччя не переходять.", "Ліктьовий канал зап’ястка містить ліктьові судини і нерв, а не сухожилки."]}, {"n": "18.2", "q": "У чоловіка 40 років діагностовано тріщину задньої поверхні тіла плечової кістки. Наявні симптоми ураження променевого нерва у ділянці canalis humeromuscularis. Яким м’язом обмежений цей канал?", "o": ["Musculus anconeus.", "Musculus biceps brachii.", "Musculus coracobrachialis.", "Musculus brachialis.", "Musculus triceps brachii."], "a": [4], "e": ["Ліктьовий м’яз лежить біля ліктя і не обмежує плечо-м’язового каналу.", "Двоголовий м’яз лежить на передній поверхні плеча.", "Дзьобо-плечовий м’яз лежить спереду і медіально, каналу не утворює.", "Плечовий м’яз лежить спереду на плечовій кістці.", "Плечо-м’язовий канал лежить між плечовою кісткою (борозна променевого нерва) і триголовим м’язом."]}, {"n": "18.3", "q": "До травматологічного відділення лікарні доставлено чоловіка поважного віку без свідомості. Лікар вимірює пульс у ділянці нижньої третини променевої борозни передпліччя. Сухожилками яких м’язів обмежена променева борозна передпліччя?", "o": ["Musculus brachioradialis, musculus flexor carpi radialis.", "Musculus flexor carpi radialis, musculus flexor digitorum superficialis.", "Musculus flexor carpi ulnaris, musculus flexor digitorum profundus.", "Musculus brachioradialis, musculus flexor carpi ulnaris.", "Musculus flexor carpi ulnaris, musculus flexor carpi radialis."], "a": [0], "e": ["Променева борозна передпліччя лежить між сухожилками плечо-променевого м’яза і променевого згинача зап’ястка — тут промацують пульс.", "Між променевим згиначем і поверхневим згиначем пальців лежить серединна борозна з серединним нервом.", "Ці м’язи обмежують ліктьову ділянку, а не променеву борозну.", "Плечо-променевий і ліктьовий згинач лежать на протилежних краях передпліччя.", "Між згиначами зап’ястка лежать кілька борозен; променева обмежена плечо-променевим м’язом."]}, {"n": "18.4", "q": "Після травми кисті у чоловіка 32 років виникло ускладнення – запалення піхв сухожилків м'язів на долонній поверхні фаланг пальців кисті. При ураженні долонної поверхні яких пальців кисті є загроза розповсюдження інфекції на передпліччя?", "o": ["Від 2 і З.", "Від 1 і 5.", "Від 3 і 4.", "Від 2 пальця.", "Від 3 пальця."], "a": [1], "e": ["Піхви II–III пальців ізольовані на рівні пальців.", "Піхва I пальця продовжується в піхву довгого згинача великого пальця, піхва V — у загальну піхву згиначів; обидві йдуть на передпліччя.", "Піхви III і IV пальців закінчуються на рівні головок п’ясткових кісток.", "Піхва II пальця не сполучена з піхвами долоні.", "Піхва III пальця ізольована."]}, {"n": "18.5", "q": "Введення ліків у венозне русло чи забір венозної крові для дослідження зручно проводити в ліктьовій ямці у зв’язку з тим, що безпосередньо під шкірою у передній ліктьовій ділянці проходить серединна вена ліктя. Чим обмежена ліктьова ямка?", "o": ["Musculus biceps brachii, musculus brachialis, musculus brachioradialis, musculus pronator teres.", "Musculus biceps brachii, musculus brachioradialis, musculus pronator teres.", "Musculus biceps brachii, musculus brachioradialis, musculus flexor carpi ulnaris.", "Musculus biceps brachii, musculus brachioradialis, musculus flexor carpi radialis.", "Musculus brachioradialis, musculus pronator teres, musculus flexor carpi ulnaris."], "a": [0], "e": ["Ліктьова ямка: латерально плечо-променевий м’яз, медіально круглий привертач, дно — плечовий м’яз, зверху — сухожилок двоголового м’яза.", "Не враховано плечовий м’яз, що утворює дно ямки.", "Ліктьовий згинач зап’ястка межею ліктьової ямки не є.", "Променевий згинач зап’ястка межею ліктьової ямки не є.", "Ліктьовий згинач зап’ястка не обмежує ямку."]}, {"n": "18.6", "q": "Велосипедист упав на лікоть і травмував ліктьовий відросток ліктьової кістки, внаслідок чого ушкодив ліктьовий нерв та судини, що проходить в задній присередній ліктьовій борозні. Чим утворена задня присередня ліктьова борозна?", "o": ["Musculus brachioradialis, olecranon.", "Musculus brachialis, musculus brachioradialis.", "Musculus triceps brachii.", "Olecranon, epicondilus medialis ossis humeri.", "Epicondilus medialis ossis humeri, musculus brachialis."], "a": [3], "e": ["Плечо-променевий м’яз лежить з латерального боку ліктя.", "Плечовий і плечо-променевий м’язи утворюють передню бічну борозну.", "Триголовий м’яз борозни не утворює.", "Задня присередня ліктьова борозна лежить між ліктьовим відростком і присереднім надвиростком плечової кістки.", "Присередній надвиросток і плечовий м’яз утворюють передню присередню ділянку."]}, {"n": "18.7", "q": "Чоловік 56 років упав на лікоть, внаслідок чого ушкодив променевий нерв та судину, які розташовані в передній бічній ліктьовій борозні. Між якими м’язами розташована ця борозна?", "o": ["Musculus brachialis, musculus brachioradialis.", "Musculus biceps brachii, musculus brachioradialis.", "Musculus brachioradialis, musculus flexor carpi ulnaris.", "Musculus brachioradialis, musculus flexor carpi radialis.", "Musculus brachioradialis, musculus pronator teres."], "a": [0], "e": ["Передня бічна ліктьова борозна лежить між плечовим і плечо-променевим м’язами; тут променевий нерв і судини.", "Двоголовий м’яз не є межею цієї борозни.", "Ліктьовий згинач зап’ястка лежить на медіальному боці.", "Променевий згинач зап’ястка не обмежує борозну.", "Плечовий і круглий привертач обмежують передню присередню борозну."]}, {"n": "18.8", "q": "Після колото-різаної рани долоні чоловік 34 років не може міцно тримати предмети. При спробі захопити предмет між II–V пальцями, у хворого спостерігається слабкість і неможливість щільного притискання пальців один до одного. Які м’язи ушкоджені?", "o": ["Musculi interossei palmares.", "Musculi interossei dorsales.", "Musculi lumbricales.", "Musculus flexor digitorum profundus.", "Musculus flexor digitorum superficialis."], "a": [0], "e": ["Долонні міжкісткові м’язи приводять II, IV, V пальці до середнього і щільно зводять пальці.", "Тильні міжкісткові м’язи відводять пальці.", "Червоподібні м’язи згинають проксимальні і розгинають дистальні фаланги.", "Глибокий згинач згинає дистальні фаланги, а не зводить пальці.", "Поверхневий згинач згинає середні фаланги."]}, {"n": "18.9", "q": "У підлітка важка травма – зруйновані суглобові поверхні променево-зап’ясткового суглоба (art. radiocarpalis), Ушкоджені сухожилки м’язів, що проходять у каналі зап’ястка. Сухожилки яких мʼязів проходять у каналі зап’ястка?", "o": ["Musculus brachioradialis, musculus flexor digitorum superficialis, musculus flexor digitorum profundus.", "Musculus flexor carpi radialis, musculus flexor digitorum superficialis, musculus flexor digitorum profundus.", "Musculus flexor digitorum profundus, musculus flexor digitorum superficialis, musculus flexoris pollicis longi.", "Musculus flexor digitorum superficialis, musculus flexor carpi ulnaris.", "Musculus flexor carpi ulnaris, musculus flexor digitorum profundus."], "a": [2], "e": ["Плечо-променевий м’яз прикріплюється до шилоподібного відростка променевої кістки і в канал не входить.", "Променевий згинач зап’ястка проходить в окремому променевому каналі.", "У каналі зап’ястка: сухожилки поверхневого і глибокого згиначів пальців, довгого згинача великого пальця та серединний нерв.", "Ліктьовий згинач зап’ястка прикріплюється до горохоподібної кістки поза каналом.", "Ліктьовий згинач зап’ястка в канал не входить."]}, {"n": "18.10", "q": "Чоловік посковзнувся на тротуарі і при падінні вдарився кистю. Чоловік скаржиться на біль, обмеження рухів в променево-зап’ястковому суглобі. Ушкоджено сухожилок м’яза, що проходять у променевому каналі зап’ястка. Сухожилок якого м’яза проходять у променевому каналі зап’ястка?", "o": ["Musculus brachioradialis.", "Musculus flexor carpi radialis.", "Musculus flexor digitorum profundus.", "Musculus flexor digitorum superficialis.", "Musculus flexor carpi ulnaris."], "a": [1], "e": ["Плечо-променевий м’яз до зап’ястка не доходить.", "У променевому каналі зап’ястка проходить сухожилок променевого згинача зап’ястка.", "Глибокий згинач пальців проходить у каналі зап’ястка.", "Поверхневий згинач пальців проходить у каналі зап’ястка.", "Ліктьовий згинач зап’ястка прикріплюється до горохоподібної кістки."]}, {"n": "18.11", "q": "Під час військових навчань у медичний пункт доставлено бійця з травмою кисті. Чоловік скаржиться на різкий біль в ділянці проєкції ліктьового канала зап’ястка. Що проходить в ліктьовому каналі зап’ястка?", "o": ["Musculus brachioradialis.", "Nervus ulnaris, arteria ulnaris, v.v. ulnaris.", "Musculus flexor digitorum profundus.", "Musculus flexor digitorum superficialis.", "Musculus flexor carpi ulnaris."], "a": [1], "e": ["Плечо-променевий м’яз до зап’ястка не доходить.", "У ліктьовому каналі зап’ястка проходять ліктьовий нерв, ліктьова артерія і вени.", "Глибокий згинач проходить у каналі зап’ястка.", "Поверхневий згинач проходить у каналі зап’ястка.", "Ліктьовий згинач зап’ястка прикріплюється до горохоподібної кістки, через канал не йде."]}, {"n": "18.12", "q": "У чоловіка 32 років після травми кисті рентгенологічно діагностовано перелом фаланг пальців кисті, виявлені ознаки ушкодження сухожилків поверхневого та глибокого м’язів-згиначів II–IV пальців. Які синовіальні піхви оточують ушкоджені сухожилки цих м’язів?", "o": ["Vaginae synovialis digitorum manus.", "Vagina communis tendinum musculorum flexorum.", "Vagina tendinis musculi flexores pollicis longi.", "Vagina tendinis musculi flexorescarpi radialis.", "Vaginae fibrosae digitorum manus."], "a": [0], "e": ["Сухожилки згиначів II–IV пальців оточені ізольованими синовіальними піхвами пальців.", "Загальна піхва згиначів охоплює сухожилки на рівні зап’ястка і долоні, на II–IV пальцях її немає.", "Піхва довгого згинача великого пальця стосується лише I пальця.", "Піхва променевого згинача зап’ястка не пов’язана з пальцями.", "Фіброзні піхви не є синовіальними."]}, {"n": "18.13", "q": "До приймального відділення потрапив чоловік 67 років після падіння з висоти. Під час ренгенологічного обстеження лікар виявив перелом лопатки зі зміщенням уламків, внаслідок чого були ушкоджені судини і нерви, що проходять через трибічний отвір задньої стінки пахвової порожнини. Якими структурами обмежений тристоронній отвір?", "o": ["Musculus teres major, musculus latissimus dorsi, musculus triceps brachii.", "Musculus teres major, musculus teres minor, musculus triceps brachii.", "Musculus teres major, musculus latissimus dorsi, musculus infraspinatus,", "Musculus teres major, musculus teres minor, musculus supraspinatus,", "Musculus teres major, musculus triceps brachii, musculus brachialis."], "a": [1], "e": ["Найширший м’яз спини межею тристороннього отвору не є.", "Тристоронній отвір: зверху малий круглий, знизу великий круглий м’яз, латерально довга головка триголового м’яза.", "Підостьовий м’яз не обмежує отвір.", "Надостьовий м’яз лежить вище і отвору не обмежує.", "Плечовий м’яз лежить на передній поверхні плеча."]}, {"n": "18.14", "q": "Чоловік 35 років у виробничих умовах отримав різану рану у ділянці підвищення великого пальця долоні. Виявлено обмеження відведення великого пальця кисті. Функція якого м’яза ушкоджена?", "o": ["Musculus opponens pollicis.", "Musculus palmaris brevis.", "Musculus abductor pollicis brevis.", "Musculus flexor pollicis brevis.", "Musculus adductor pollicis."], "a": [2], "e": ["Протиставний м’яз протиставляє палець.", "Короткий долонний м’яз лежить на гіпотенарі.", "Короткий відвідний м’яз великого пальця лежить поверхнево в тенарі і відводить палець.", "Короткий згинач згинає проксимальну фалангу.", "Привідний м’яз приводить палець."]}, {"n": "18.15", "q": "До приймального відділення доставлено чоловіка 30 років із переломом верхньої третини плечової кістки зі зміщенням уламків. Внаслідок травми були ушкоджені судини і нерви, що проходять через чотирибічний отвір на задній стінці пахвової порожнини. Якими структурами обмежений чотиристоронній отвір?", "o": ["Musculus teres major, musculus latissimus dorsi, musculus biceps brachii, musculus brachialis.", "Musculus teres major, musculus teres minor, musculus triceps brachii, musculus brachialis.", "Musculus latissimus dorsi, musculus infraspinatus, musculus coracobrachialis, musculus brachialis.", "Musculus teres major, musculus teres minor, musculus triceps brachii, os humeri.", "Musculus teres major, musculus biceps brachii, os humeri, musculus brachialis."], "a": [3], "e": ["Двоголовий і плечовий м’язи не обмежують отворів задньої стінки пахвової порожнини.", "Плечовий м’яз не є межею чотиристороннього отвору.", "Підостьовий, дзьобо-плечовий і плечовий м’язи отвору не обмежують.", "Чотиристоронній отвір: малий круглий (зверху), великий круглий (знизу), довга головка триголового (медіально), плечова кістка (латерально).", "Двоголовий і плечовий м’язи тут ні до чого."]}, {"n": "18.16", "q": "Чоловіка 62 років госпіталізовано у хірургічне відділення лікарні з різаною раною бічного краю передпліччя. Під час обстеження виявлено, що у хворого перерізані волокна м’язів: довгого і короткого променевого м’язів-розгиначів зап’ястка, променевого м’яза-згинача зап’ястка. Які рухи виконують ці м’язи при одночасному скороченні в нормі?", "o": ["Згинання зап'ястка і кисті в променево-зап'ястковому суглобі, приведення.", "Розгинання зап'ястка і кисті в променево-зап'ястковому суглобі, відведення кисті.", "Привертання кисті.", "Приведення кисті.", "Розгинання і приведення кисті."], "a": [1], "e": ["Ці м’язи переважно не згинають і не приводять кисть.", "Два променеві розгиначі разом із променевим згиначем при спільному скороченні відводять кисть, переважно з розгинанням.", "Привертання кисті виконують привертачі передпліччя.", "Приведення виконують ліктьові м’язи зап’ястка.", "Приведення виконують ліктьові м’язи, а не променеві."]}, {"n": "18.17", "q": "У чоловіка 45 років після перелому ребер грудної клітки справа виник крововилив у м’язі, що утворює присередню стінку пахвової ямки. Який м’яз утворює присердню стінку fossa axillaris?", "o": ["Musculus pectoralis minor.", "Musculus pectoralis major.", "Musculus serratus anterior.", "Musculus subclavius.", "Musculus subscapularis."], "a": [2], "e": ["Малий грудний м’яз утворює передню стінку пахвової ямки.", "Великий грудний м’яз утворює передню стінку.", "Присередня стінка пахвової ямки утворена переднім зубчастим м’язом на бічній поверхні грудної клітки.", "Підключичний м’яз лежить під ключицею.", "Підлопатковий м’яз утворює задню стінку."]}, {"n": "18.18", "q": "У постраждалого внаслідок ножового поранення виявлено ушкодження м’язів, що утворюють передню стінку пахвової ямки. Які м’язи грудної клітки формують цю стінку?", "o": ["Musculus pectoralis minor, musculus subclavius.", "Musculus pectoralis minor, musculus pectoralis major.", "Musculus serratus anterior, musculus subclavius.", "Musculus serratus anterior, musculus pectoralis major.", "Musculus serratus anterior, musculus pectoralis minor."], "a": [1], "e": ["Підключичний м’яз лежить під ключицею і передньої стінки не утворює.", "Передня стінка пахвової ямки утворена великим і малим грудними м’язами.", "Передній зубчастий м’яз утворює присередню стінку.", "Передній зубчастий м’яз — присередня стінка.", "Передній зубчастий м’яз — присередня стінка, а не передня."]}, {"n": "18.19", "q": "Під час проведення рентгенографії плеча у жінки виявлена тріщина на задній поверхні тіла плечової кістки в місці борозни, до якої прилягає довга гілка плечового сплетення. В ділянці якої борозни ушкоджено плечову кістку?", "o": ["Міжгорбкової борозни.", "Передньої бічної ліктьової борозни.", "Борозни ліктьового нерва.", "Борозни серединного нерва.", "Борозни променевого нерва."], "a": [4], "e": ["Міжгорбкова борозна на передній поверхні містить сухожилок довгої головки двоголового м’яза.", "Передня бічна ліктьова борозна лежить на лікті, не на тілі плечової кістки.", "Борозна ліктьового нерва на задній поверхні присереднього надвиростка, не на тілі.", "Окремої борозни серединного нерва на плечовій кістці немає.", "Борозна променевого нерва спірально огинає задню поверхню тіла плечової кістки."]}, {"n": "18.20", "q": "У травматологічний пункт потрапив чоловік 38 років з травмою правої кисті. Під час огляду лікар виявив різану рану у ділянці підвищення великого пальця правої кисті. Чоловік не може протиставити великий палець мізинцю. Який м’яз ушкоджений?", "o": ["Musculus adductor pollicis.", "Musculus flexor pollicis longus.", "Musculus abductor pollicis brevis.", "Musculus opponens pollicis.", "Musculus flexor pollicis brevis."], "a": [3], "e": ["Привідний м’яз приводить, а не протиставляє палець.", "Довгий згинач згинає дистальну фалангу.", "Короткий відвідний м’яз відводить палець.", "Протиставний м’яз великого пальця протиставляє його мізинцю.", "Короткий згинач згинає проксимальну фалангу."]}, {"n": "18.21", "q": "Чоловіка 52 років після падіння на долонну поверхню кисті турбує біль і обмеження рухів в art. radiocarpalis. Рентгенологічно підтверджено ушкодження долонного краю зап’ясткової суглобової поверхні променевої кістки та розрив сухожилка м’яза, в якому розташована горохоподібна кістка. Між волокнами сухожилка якого м’яза розташована горохоподібна кістка?", "o": ["Musculus brachioradialis.", "Musculus flexor carpi radialis.", "Musculus flexor digitorum profundus.", "Musculus flexor digitorum superficialis.", "Musculus flexor carpi ulnaris."], "a": [4], "e": ["Плечо-променевий м’яз прикріплюється до шилоподібного відростка променевої кістки.", "Променевий згинач прикріплюється до основи II п’ясткової кістки.", "Глибокий згинач прикріплюється до дистальних фаланг.", "Поверхневий згинач прикріплюється до середніх фаланг.", "Горохоподібна кістка — сесамоподібна кістка в сухожилку ліктьового згинача зап’ястка."]}, {"n": "18.22", "q": "Підліток 15 років отримав різану рану передньої зап'ясткової ділянки. Розсічені присередні волокна тримача м’язів-згиначів в місці його прикріплення до кісток зап’ястка. До яких кісток присередньо прикріплюється тримач м’язів-згиначів?", "o": ["Os hamatum, os triquetrum.", "Os triquetrum, os pisiforme.", "Os capitatum, os pisiforme.", "Os lunatum, os hamatum,", "Os hamatum, os pisiforme."], "a": [4], "e": ["Тригранна кістка не є місцем прикріплення тримача.", "Тригранна кістка не є місцем прикріплення тримача.", "Головчаста кістка лежить у центрі зап’ястка.", "Півмісяцева кістка не є місцем прикріплення тримача.", "Присередньо тримач м’язів-згиначів прикріплюється до горохоподібної кістки і гачка гачкуватої кістки."]}, {"n": "18.23", "q": "У лікарню госпіталізовано чоловіка 39 років з травмою лівої кисті. Під час огляду виявлена різана рана в ділянці підвищення великого пальця. Який м’яз ушкоджено, якщо чоловік не може привести великий палець до вказівного пальця кисті?", "o": ["Musculus adductor pollicis.", "Musculus flexor pollicis longus.", "Musculus abductor pollicis brevis.", "Musculus opponens pollicis.", "Musculus flexor pollicis brevis."], "a": [0], "e": ["Привідний м’яз великого пальця приводить його до вказівного.", "Довгий згинач згинає дистальну фалангу.", "Короткий відвідний м’яз відводить палець.", "Протиставний м’яз протиставляє палець.", "Короткий згинач згинає проксимальну фалангу."]}, {"n": "18.24", "q": "Чоловік 56 років упав на лікоть, внаслідок чого ушкодив нижню ліктьову обхідну артерію і передню гілку ліктьової поворотньої артерії, які анастомозують між собою в передній присередній ліктьовій борозні. Між якими м’язами розташована ця борозна?", "o": ["Musculus brachialis, musculus pronator teres.", "Musculus biceps brachii, musculus brachioradialis.", "Musculus brachioradialis, musculus flexor carpi ulnaris.", "Musculus brachioradialis, musculus flexor carpi radialis.", "Musculus brachioradialis, musculus pronator teres."], "a": [0], "e": ["Передня присередня ліктьова борозна лежить між плечовим м’язом і круглим привертачем.", "Двоголовий і плечо-променевий м’язи — орієнтири латеральної ділянки.", "Плечо-променевий і ліктьовий згинач лежать на протилежних краях.", "Плечо-променевий м’яз належить до латеральної борозни.", "Плечо-променевий м’яз і круглий привертач обмежують ліктьову ямку."]}, {"n": "18.25", "q": "У чоловіка 40 років травматичне ушкодження верхньої кінцівки у ділянці променево-зап’ясткового суглоба. Травмовані волокна тримача м’язів-згиначів в місцях його прикріплення латерально до кісток зап’ястка. До яких кісток збоку прикріплюється тримач м’язів-згиначів?", "o": ["Os scaphoideum, os trapezium.", "Os scaphoideum, os trapeoideum.", "Os trapeoideum, os lunatum.", "Os scaphoideum, os lunatum.", "Os trapeoideum. os capitatum."], "a": [0], "e": ["Латерально тримач м’язів-згиначів прикріплюється до горбків човноподібної і трапецієподібної кісток.", "Кістка-трапецієподібна (trapezoideum) не є місцем прикріплення тримача.", "Трапецієподібна (trapezoideum) і півмісяцева кістки не є місцем прикріплення.", "Півмісяцева кістка не є місцем прикріплення.", "Трапецієподібна і головчаста кістки не є місцем прикріплення."]}, {"n": "18.26", "q": "У лікарню госпіталізовано чоловіка 45 років з різаною раною передньої зап'ясткової ділянки ближче до присереднього края передпліччя. Під час обробки рани хірург виявив ушкодження волокон n. ulnaris, ліктьової артерії в ліктьовій борозні. Сухожилками яких м’язів обмежена ліктьова борозна передпліччя?", "o": ["M. brachioradialis, m. flexor carpi radialis.", "M. flexor carpi radialis, m. flexor digitorum profundus.", "M. flexor carpi ulnaris, m. flexor digitorum superficialis.", "M. brachioradialis, m. flexor carpi ulnaris.", "M. flexor carpi ulnaris, m. flexor carpi radialis."], "a": [2], "e": ["Плечо-променевий м’яз і променевий згинач обмежують променеву борозну.", "Між променевим і глибоким згиначем немає ліктьової борозни.", "Ліктьова борозна передпліччя лежить між ліктьовим згиначем зап’ястка і поверхневим згиначем пальців; тут ліктьовий нерв і артерія.", "Плечо-променевий і ліктьовий згинач лежать на протилеж
