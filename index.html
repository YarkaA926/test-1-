<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Тести</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#1b1f24; --muted:#6b7280; --line:#e3e6ea;
  --accent:#2f6fed; --accent-t:#fff;
  --ok-bg:#d9f5df; --ok-line:#2da44e; --ok-t:#12501f;
  --bad-bg:#fde0e0; --bad-line:#e5484d; --bad-t:#7a1418;
}
.dark{
  --bg:#12151a; --card:#1c2128; --text:#e8ebef; --muted:#9aa4b2; --line:#2c333c;
  --accent:#4c8dff; --accent-t:#fff;
  --ok-bg:#12351d; --ok-line:#3fb950; --ok-t:#b8f0c4;
  --bad-bg:#401618; --bad-line:#f85149; --bad-t:#ffc9c7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:20px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;background:var(--accent);color:var(--accent-t);cursor:pointer}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
.topic{cursor:pointer}
.topic .t{font-weight:600}
.topic .s{color:var(--muted);font-size:13px;margin-top:4px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin-bottom:8px}
.back{background:none;border:0;color:var(--accent);font-size:15px;padding:4px 0;cursor:pointer}
.q{font-size:17px;margin:12px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;font-size:16px;cursor:pointer}
.opt .l{flex:0 0 26px;height:26px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-t)}
.opt.ok .l{background:var(--ok-line);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-t)}
.opt.bad .l{background:var(--bad-line);color:#fff}
.opt.locked{cursor:default}
.opt.dim{opacity:.8}
.opt .tx{display:flex;flex-direction:column;gap:6px}
.opt .ex{font-size:13.5px;line-height:1.4;color:var(--muted)}
.opt.ok .ex{color:var(--ok-t);opacity:.9}
.opt.bad .ex{color:var(--bad-t);opacity:.9}
.opt .ex b{font-weight:700}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.foot .in{max-width:640px;margin:0 auto}
.big{font-size:44px;font-weight:800;text-align:center;margin:10px 0 0}
.mut{color:var(--muted);text-align:center;margin-bottom:12px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.sw input{width:22px;height:22px}
.rev{font-size:14px;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rev:last-child{border:0;margin:0;padding:0}
.rev b.g{color:var(--ok-line)} .rev b.r{color:var(--bad-line)}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;border-radius:9px;padding:9px;font-size:15px;font-weight:600;background:transparent;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--text)}
.m3d{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:8px;padding:4px 9px;cursor:pointer}
.mitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font-size:15px;cursor:pointer}
.mitem .src{margin-left:auto;font-size:11px;color:var(--muted)}
.gh{font-weight:700;margin:16px 0 8px;font-size:15px}
.note{font-size:12.5px;color:var(--muted);line-height:1.4}
#viewer{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
#viewer.on{display:flex}
#viewer .vt{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#viewer .vt b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer .vt button{border:0;background:var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer}
#viewer iframe{flex:1;border:0;width:100%;background:#000}
#viewer .vc{font-size:11px;color:var(--muted);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .in{background:var(--bg);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetIn"></div></div>
<div id="viewer"><div class="vt"><b id="vTitle"></b><button onclick="openExt()">↗ Окремо</button><button onclick="closeViewer()">✕</button></div><iframe id="vFrame" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe><div class="vc" id="vCredit"></div></div>
<script>
const DATA = [{"id": "topic1", "title": "1. Анатомічна номенклатура. Осі і площини тіла людини. Форма та пропорції тіла людини. Загальні ознаки хребців. Характерні ознаки будови шийних, грудних, поперекових хребців.", "questions": [{"n": "1.1", "q": "Тіло людини складається з семи основних частин: голови, шиї, тулуба, верхніх та нижніх кінцівок. Який варіант вказує латинською послідовно сім частин тіла людини зверху вниз?", "o": ["Caput, collum, truncus, membri superiores et inferiores.", "Caput, thorax, abdomen, membri superiores et inferiores.", "Cranium, thorax, abdomen, membri superiores et inferiores.", "Caput, truncus, membri superiores et inferiores.", "Collum, abdomen, membri superiores et inferiores."], "a": [0], "e": ["Усі сім частин у правильному порядку зверху вниз: голова, шия, тулуб, верхні та нижні кінцівки.", "Thorax (груди) і abdomen (живіт) — це відділи тулуба, а не окремі частини тіла; шию пропущено.", "Cranium — це череп, а не голова; thorax і abdomen — відділи тулуба.", "Пропущено шию (collum), тому частин менше, ніж сім.", "Пропущено голову (caput); abdomen — лише відділ тулуба."]}, {"n": "1.2", "q": "Під час падіння на сходах жінка 60 років травмувала нижню кінцівку. Яким терміном анатомічної номенклатури називається латинською мовою вислів «нижній»?", "o": ["Inferior.", "Superior.", "Cranialis.", "Internus.", "Distalis."], "a": [0], "e": ["Inferior — «нижній», протилежний до superior (верхній).", "Superior означає «верхній» — протилежне до потрібного.", "Cranialis — «черепний», тобто напрямок до голови (догори).", "Internus — «внутрішній» (ближче до порожнини), а не нижній.", "Distalis — «дальній» від початку кінцівки або тулуба."]}, {"n": "1.3", "q": "У чоловіка 56 років, що хворіє на менінгіт лікар виявив позитивний симптом Керніга: неможливість розігнути нижню кінцівку в колінному суглобі, коли вона зігнута в кульшовому. Навколо якої осі виконує людина такі рухи, як «згинання» та «розгинання»?", "o": ["Axis frontalia.", "Axis sagittalia.", "Axis verticalia.", "Axis verticalia et axis sagittalia.", "Axis frontalia et axis verticalis."], "a": [0], "e": ["Згинання і розгинання виконуються навколо фронтальної осі (axis frontalis), що йде справа наліво.", "Навколо сагітальної осі (спереду назад) виконуються відведення і приведення.", "Навколо вертикальної осі виконується обертання (ротація).", "Вертикальна вісь відповідає за обертання, сагітальна — за відведення; згинання вони не забезпечують.", "Вертикальна вісь потрібна для обертання; правильна лише фронтальна."]}, {"n": "1.4", "q": "У чоловіка під час дослідження виявлена пухлина правої півкулі великого мозку. Яка площина ділить тіло людини навпіл, на праву і ліву половини?", "o": ["Planum parasagittalia.", "Planum horizontalia.", "Planum frontalia.", "Planum medianum.", "Planum paramedianum."], "a": [3], "e": ["Серединна (медіанна) площина ділить тіло на праву і ліву половини.", "Парасагітальні площини паралельні серединній, але не проходять посередині тіла.", "Горизонтальна площина ділить тіло на верхню і нижню частини.", "Фронтальна площина ділить тіло на передню і задню частини.", "Парамедіанна — це інша назва площини, паралельної до серединної, а не самої середини."]}, {"n": "1.5", "q": "У чоловіка 29 років ушкоджена стінка загальної сонної артерії. Для зупинки кровотечі цю артерію необхідно притиснути до сонного горбка шийного хребця. Який шийний хребець має сонний горбок?", "o": ["I.", "II.", "III.", "IV", "VI."], "a": [4], "e": ["У I шийного хребця (атланта) немає сонного горбка, бо в нього немає тіла.", "У II шийного хребця (осьового) немає сонного горбка.", "У III шийного хребця сонного горбка немає.", "Сонний горбок найвиражений на VI хребці; у IV хребця такого горбка немає.", "Сонний горбок (Chassaignac) — на передньому горбку поперечного відростка VI шийного хребця; до нього притискають сонну артерію."]}, {"n": "1.6", "q": "До лікаря-невролога звернувся чоловік 48 років зі скаргами на біль в шийному відділі хребтового стовпа. Рентгенологічно виявлені метастази в тілах двох верхніх шийних хребців. Тіла яких шийних хребців уражені метастазами?", "o": ["I і II.", "II і III.", "III і IV.", "IV і V.", "IV і VI."], "a": [1], "e": ["У I шийного хребця (атланта) тіла немає, тому «I і II» не можуть бути двома верхніми тілами.", "Тіло є з II хребця (його зуб — це «тіло атланта»), тому два верхніх тіла — II і III.", "Тіла III і IV — не найвищі; вище розташоване тіло II.", "Тіла IV і V розташовані нижче, а не серед двох верхніх.", "Тіла IV і VI не є двома верхніми; до того ж вони не сусідні."]}, {"n": "1.7", "q": "У травматологічне відділення лікарні каретою швидкої медичної допомоги доставлено жінку з травмою грудного відділу хребтового стовпа. При рентгенологічному обстеженні виявлено ушкодження відростків V грудного хребця, які розташовані у лобовій площині. Які відростки грудного хребця розташовані у лобовій площині?", "o": ["Processus transversus.", "Processus spinosus.", "Processus transversus et processus spinosus.", "Processus transversus et processus articularis inferior.", "Processus articularis superior et processus articularis inferior."], "a": [4], "e": ["Поперечні відростки грудних хребців спрямовані назовні й дещо назад, а не лежать у лобовій площині як суглобові.", "Остистий відросток спрямований у сагітальній площині.", "Поєднання поперечного й остистого відростків не відповідає лобовій площині.", "Нижній суглобовий відросток правильний, але поперечний відросток у фронтальній площині не лежить.", "Суглобові відростки грудних хребців розташовані у лобовій (фронтальній) площині."]}, {"n": "1.8", "q": "Під час падіння на сходах жінка 69 років травмувала кістки стопи. Яким терміном в анатомічній номенклатурі називається латинською мовою вислів «найвіддаленіший від тулуба»?", "o": ["Inferior.", "Proximlis.", "Cranialis.", "Internus.", "Distalis."], "a": [4], "e": ["Inferior — «нижній», а не «найвіддаленіший від тулуба».", "Proximalis — «ближній» до тулуба, протилежний до дальнього.", "Cranialis — «черепний», у напрямку голови.", "Internus — «внутрішній», стосується положення відносно порожнини.", "Distalis — «дальній», найвіддаленіший від тулуба (стопа дальша за стегно)."]}, {"n": "1.9", "q": "Під час тренування баскетболіст 23 років травмував зв’язки, розташовані в порожнині колінного суглоба. Яким терміном в анатомічній номенклатурі називається латинською термін «внутрішній»?", "o": ["Externus.", "Proximlis.", "Cranialis.", "Internus.", "Distalis."], "a": [3], "e": ["Externus — «зовнішній», протилежний до внутрішнього.", "Proximalis — «ближній» до тулуба.", "Cranialis — «черепний», тобто ближчий до голови.", "Internus — «внутрішній», розташований ближче до порожнини (зв'язки всередині суглоба).", "Distalis — «дальній» від тулуба."]}, {"n": "1.10", "q": "У лікарню госпіталізований чоловік 48 років зі скаргами на біль в шийному відділі хребта. Рентгенологічно виявлено перелом шийного хребця, який має дві дуги – коротку передню дугу, arcus anterior, та довгу задню дугу, arcus posterior, що з’єднані між собою бічними масами. Який шийний хребець ушкоджений?", "o": ["І.", "IІ.", "III.", "VІ.", "VІІ."], "a": [0], "e": ["Атлант (I шийний) не має тіла, а складається з передньої та задньої дуг, з'єднаних бічними масами.", "Осьовий хребець (II) має тіло і зуб, а не передню та задню дуги.", "У III хребця є тіло і розвинений остистий відросток, а дуг атланта немає.", "У VI хребця є тіло та сонний горбок, а передньої дуги немає.", "VII хребець має довгий остистий відросток («виступаючий»), а не дві дуги."]}, {"n": "1.11", "q": "До лікаря-невролога звернувся чоловік 48 років зі скаргами на біль в шийному відділі хребта, запаморочення. Рентгенологічно виявлено метастази в шийному хребці, на поверхні дуги якого є недорозвинений остистий відросток – задній горбок та парна борозна хребтової артерії, sulcus a. vertebralis. Який шийний хребець ушкоджений?", "o": ["І.", "IІ.", "III.", "VІ.", "VІІ."], "a": [0], "e": ["На задній дузі атланта є задній горбок (замість остистого відростка) та борозна хребтової артерії.", "У II хребця є зуб і добре розвинений роздвоєний остистий відросток.", "У III хребця є тіло і короткий роздвоєний остистий відросток.", "У VI хребця є тіло та сонний горбок, остистий відросток розвинений.", "VII хребець має довгий нероздвоєний остистий відросток."]}, {"n": "1.12", "q": "У травматологічне відділення каретою швидкої медичної допомоги доставлено жінку 30 років з травмою хребтового стовпа. При рентгенологічному обстеженні виявлено ушкодження хребця: остистий відросток у нього найдовший, потовщений та нероздвоєний; відсутні передній та задній горбки на поперечних відростках; відсутній поперечний отвір на поперечному відростку. Який хребець ушкоджений?", "o": ["І.", "IІ.", "III.", "IV.", "VІІ."], "a": [4], "e": ["Хребець з найдовшим, потовщеним нероздвоєним остистим відростком — VII шийний (vertebra prominens); його поперечний отвір малий, а горбки слабко виражені.", "Атлант не має остистого відростка взагалі.", "Осьовий хребець має роздвоєний остистий відросток і зуб.", "У III хребця остистий відросток короткий і роздвоєний.", "У IV хребця остистий відросток короткий і роздвоєний; найдовший — у VII."]}, {"n": "1.13", "q": "Під час МРТ-обстеження пацієнта лікар у гіпофізі виділяє дві частки – lobus anterior et lobus posterior. Які площини використовує лікар для визначення анатомічних термінів «anterior» і «posterior»?", "o": ["Plana sagittalia.", "Planum coronalia.", "Plana horisontalia.", "Plana transversa.", "Planum paramedianum."], "a": [1], "e": ["Сагітальні площини ділять тіло на праву і ліву частини, а не на передню і задню.", "Термін «anterior/posterior» (передній/задній) визначають відносно фронтальної (лобової) площини.", "Горизонтальна площина визначає терміни «верхній» і «нижній».", "Поперечна (горизонтальна) площина визначає верхній/нижній, а не передній/задній.", "Парамедіанна площина — це сагітальна площина поруч із серединною."]}, {"n": "1.14", "q": "Чоловік 60 років після травми плечового суглоба не може виконати відведення верхньої кінцівки від тулуба. Навколо якої осі виконує людина такі рухи, як відведення (abductio) і приведення (adductio)?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium."], "a": [1], "e": ["Навколо фронтальної осі відбувається згинання та розгинання.", "Відведення (abductio) і приведення (adductio) виконуються навколо сагітальної осі, що йде спереду назад.", "Навколо вертикальної осі виконується обертання.", "Поперечна вісь у номенклатурі прирівнюється до фронтальної й відповідає за згинання/розгинання.", "Корональна вісь — інша назва фронтальної; вона для згинання і розгинання."]}, {"n": "1.15", "q": "У чоловіка 48 років, хворого на остеопороз, лікар підозрює наявність стиснення стінки правої хребтової артерії, що проходить через поперечні отвори в поперечних відростках шийних хребців. Для підтвердження діагнозу лікар запропонував зробити хворому рентгенографію тих хребців, в яких проходить хребтова артерія. В якому шийному хребці через поперечний отвір на поперечних відростках шийних хребців проходить тільки вена?", "o": ["I.", "II.", "III.", "VI.", "VII."], "a": [4], "e": ["В отворі поперечного відростка I хребця (атланта) проходить хребтова артерія з веною.", "У II хребці через поперечний отвір проходить хребтова артерія.", "У III хребці в отворі проходять артерія і вена.", "У VI хребці через отвір проходить хребтова артерія (артерія входить саме в нього).", "У VII хребці поперечний отвір малий: через нього проходить лише хребтова вена, а артерія — вище."]}, {"n": "1.16", "q": "Каретою швидкої медичної допомоги доставлено в лікарню жінку 47 років з травмою грудного відділу хребта. Під час рентгенологічного обстеження у хворого виявлено компресійний перелом грудного хребця, який має лише одну верхню пів’ямку для головки ребра. Тіло якого грудного хребця має лише одну верхню пів`ямку?", "o": ["I.", "II.", "X.", "XI.", "XII."], "a": [2], "e": ["I грудний хребець має цілу верхню ямку і нижню пів'ямку.", "II грудний хребець має верхню та нижню пів'ямки.", "X грудний хребець має лише верхню пів'ямку на тілі.", "XI грудний хребець має цілу ямку на тілі, а не пів'ямку.", "XII грудний хребець має цілу ямку на тілі."]}, {"n": "1.17", "q": "Жінку 50 років госпіталізовано з травмою хребтового стовпа. Під час рентгенологічного обстеження виявлено компресійний перелом хребців, поперечні відростки яких розташовані у лобовій площині, біля їх основи є додатковий відросток. Остисті відростки короткі, плоскі, їх кінці стовщені, спрямовані назад. Суглобові поверхні на суглобових відростках розташовані у стріловій площині, мають соскоподібний відросток. Хребці якого відділу хребтового стовпа ушкоджені?", "o": ["С I – С II.", "С III – С VI.", "T VII – T X.", "T XI – T XII.", "L I – L V."], "a": [4], "e": ["С I–II — атлант та осьовий хребець мають особливу будову, без таких відростків.", "С III–VI — шийні хребці з поперечними отворами та роздвоєними остистими відростками.", "T VII–X — грудні хребці з суглобовими відростками у фронтальній площині та ребровими ямками.", "T XI–XII — перехідні хребці з цілими ямками й початком додаткових відростків, але суглобові поверхні ще не сагітальні.", "Поперекові хребці: поперечні відростки у фронтальній площині, додатковий відросток, суглобові поверхні у сагітальній площині, соскоподібний відросток."]}, {"n": "1.18", "q": "Чоловік 60 років після отриманої травми плечового суглоба не може виконати обертання верхньої кінцівки у плечовому суглобі. Навколо якої осі виконує людина такі рухи, як обертання «rotation»?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium."], "a": [2], "e": ["Навколо фронтальної осі відбуваються згинання та розгинання.", "Навколо сагітальної осі — відведення і приведення.", "Обертання (rotatio) виконується навколо вертикальної осі.", "Поперечна вісь відповідає фронтальній і дає згинання/розгинання.", "Корональна — інша назва фронтальної осі; обертання вона не забезпечує."]}, {"n": "1.19", "q": "У чоловіка 35 років після падіння лікар запідозрив перелом тіла грудного хребця, на тілі якого наявна ціла ямка для головки ребра та пів’ямка для головки наступного ребра. На тілі якого хребця на рентгенограмі лікар виявив характерні для хребця ознаки?", "o": ["T I.", "T II.", "T III.", "T VI.", "T VII."], "a": [0], "e": ["T I має цілу верхню ямку на тілі та нижню пів'ямку для II ребра.", "T II має верхню й нижню пів'ямки, цілої ямки на тілі немає.", "T III має верхню та нижню пів'ямки.", "T VI має верхню та нижню пів'ямки.", "T VII має верхню та нижню пів'ямки."]}, {"n": "1.20", "q": "Каретою швидкої медичної допомоги в травматологічне відділення лікарні госпіталізовано жінку 47 років з травмою грудного відділу хребта. Під час рентгенологічного обстеження виявлено компресійний перелом грудного хребця, на тілі якого розташована тільки ціла ямка для головки ребра. Тіло якого грудного хребця має такі особливості?", "o": ["I.", "II.", "VI.", "X.", "XII."], "a": [4], "e": ["I хребець має цілу ямку і пів'ямку.", "II хребець має дві пів'ямки (верхню та нижню).", "VI хребець має дві пів'ямки.", "X хребець має лише верхню пів'ямку, а не цілу ямку.", "XII грудний хребець має лише цілу ямку для головки ребра."]}, {"n": "1.21", "q": "У жінки 27 років травма поперекового відділу хребтового стовпа. Рентгенологічно виявлено перелом соскоподібного відростка другого поперекового хребця. На яких відростках ушкодженого хребця розміщені соскоподібні відростки?", "o": ["Processus costalis.", "Processus spinosus.", "Processus articularis inferior.", "Processus articularis superior.", "Processus articularis superior et processus articularis inferior."], "a": [3], "e": ["Реброві відростки — це зачатки ребер поперекових хребців, соскоподібних відростків на них немає.", "Остистий відросток спрямований назад; соскоподібного на ньому нема.", "На нижніх суглобових відростках соскоподібних виступів немає.", "Соскоподібні відростки (processus mammillares) розташовані на верхніх суглобових відростках поперекових хребців.", "Соскоподібні є лише на верхніх суглобових відростках, а не на обох."]}, {"n": "1.22", "q": "До лікаря звернувся чоловік 35 років зі скаргою на те, що ліве око не рухається присередньо. Як латиною позначається термін «присередній» – ближчий до серединної стрілової полощини?", "o": ["Proximalis.", "Distalis.", "Anterior.", "Lateralis.", "Medialis."], "a": [4], "e": ["Proximalis — «ближній» (до початку кінцівки).", "Distalis — «дальній» від початку кінцівки.", "Anterior — «передній».", "Lateralis — «бічний», тобто далі від серединної площини.", "Medialis — «присередній», ближчий до серединної площини."]}, {"n": "1.23", "q": "У чоловіка 35 років діагностовано параліч лівої половини тіла, парез м’язів язика, лиця (контрактура Верніке – Манна). При цьому вогнище ураження розташоване у хворого в правій півкулі великого мозку. Відносно якої площини для позначення розташування органів застосовують терміни «лівий» і «правий»?", "o": ["Plana sagittalia.", "Plana frontalia.", "Plana horisontalia", "Plana transversalia.", "Plana paramediana."], "a": [0], "e": ["Терміни «лівий» і «правий» визначають відносно сагітальної площини.", "Фронтальна площина відповідає за «передній/задній».", "Горизонтальна площина — за «верхній/нижній».", "Поперечна (горизонтальна) площина — за «верхній/нижній».", "Парамедіанні площини — це сагітальні площини поруч із серединою, але термін не такий."]}, {"n": "1.24", "q": "Жінка 25 років упала і зламала променеву кістку передпліччя в «типовому» місці. Характерною ознакою травми є неможливість виконувати обертання (rotatio). Навколо якої осі людина виконує такі рухи як обертання «rotation»?", "o": ["Axis frontalis.", "Axis sagittalia.", "Axis verticalis.", "Axis transversa.", "Axis coronarium"], "a": [2], "e": ["Навколо фронтальної осі — згинання/розгинання.", "Навколо сагітальної осі — відведення/приведення.", "Обертання (rotatio) виконується навколо вертикальної осі.", "Поперечна вісь — згинання/розгинання.", "Корональна вісь — інша назва фронтальної."]}, {"n": "1.25", "q": "Чоловік 28 років упав і травмував грудний відділ хребтового стовпа. Рентгенологічно діагностовано перелом грудних хребців, на тілах яких розташовані цілі ямки для головок ребер, а на поперечних відростках відсутні реброві ямки. Які грудні хребці ушкоджені?", "o": ["I–II.", "III–IV.", "VI–VIII.", "IX– X.", "XI–XII."], "a": [4], "e": ["I–II хребці мають особливу будову: атлант не має тіла.", "III–IV хребці — шийні, з поперечними отворами.", "У VI–VIII грудних хребців на тілах є по дві пів'ямки (верхня й нижня), а не цілі ямки.", "IX–X хребці: IX має пів'ямки, X лише верхню пів'ямку.", "XI–XII грудні хребці мають цілі ямки на тілах і не мають ребрових ямок на поперечних відростках."]}, {"n": "1.26", "q": "Чоловік 35 років при падінні травмував шийний відділ хребта. Рентгенологічно виявлено перелом остистих відростків трьох верхніх шийних хребців. Остисті відростки яких шийних хребців ушкоджені?", "o": ["I, ІІ, ІІІ.", "II, ІІІ, IV.", "I, ІІІ, IV.", "І, ІІ, IV.", "ІІІ, ІV, V."], "a": [1], "e": ["Атлант (I) не має остистого відростка, тому в цій групі він зайвий.", "Остисті відростки II, III, IV хребців — роздвоєні й короткі; атланта в групі немає.", "У групі є атлант, який остистого відростка не має.", "У групі є атлант, а в переліку відсутній II хребець.", "III–V — не три верхні остисті відростки: пропущено II хребець, який є першим з роздвоєним остистим відростком."]}, {"n": "1.27", "q": "Чоловік 30 років травмував шийний відділ хребтового стовпа. Рентгенологічно діагностовано перелом хребця, на дузі якого відсутній остистий відросток. Який шийний хребець ушкоджено?", "o": ["I.", "II.", "III.", "VI.", "VII."], "a": [0], "e": ["Атлант (I шийний хребець) не має остистого відростка — замість нього задній горбок.", "У II хребця є розвинений роздвоєний остистий відросток.", "У III хребця є короткий роздвоєний остистий відросток.", "У VI хребця є короткий роздвоєний остистий відросток.", "У VII хребця найдовший нероздвоєний остистий відросток."]}, {"n": "1.28", "q": "Чоловік 66 років отримав травму в ділянці поперекового відділу хребтового стовпа. Рентгенологічно виявлено перелом відростків III поперекового хребця, розташованих у стріловій площині. Які відростки III поперекового хребця розташовані у стріловій площині?", "o": ["Processus costalis.", "Processus spinosus.", "Processus articularis inferior.", "Processus articularis superior.", "Processus articularis superior, processus articularis inferior, processus spinosus."], "a": [4], "e": ["Реброві відростки — це зачатки ребер, вони розташовані у лобовій площині.", "Остистий відросток — у сагітальній площині, але він не єдиний.", "Нижній суглобовий відросток — лише один із відростків у сагітальній площині.", "Верхній суглобовий відросток — лише один з відростків.", "У сагітальній площині розташовані верхні та нижні суглобові відростки й остистий відросток."]}, {"n": "1.29", "q": "У чоловіка 50 років рентгенологічно виявлено деструкцію тих утворів поперекових хребців, які за положенням у просторі є головною ознакою для хребців поперекового відділу хребтового стовпа. Що є головною ознакою належності хребців до поперекового відділу хребтового стовпа?", "o": ["Положення processus articularis у plana sagittalis.", "Роздвоєний processus spinosus.", "Відсутність fossa costalis processus transversus.", "Foramen transversarium.", "Положення processus articularis у plana frontalis."], "a": [0], "e": ["Головна ознака поперекових хребців — суглобові відростки розташовані у сагітальній площині.", "Роздвоєний остистий відросток — ознака шийних хребців.", "Відсутність ребрової ямки на поперечному відростку — ознака, спільна для XI–XII грудних і поперекових, не головна.", "Foramen transversarium — ознака шийних хребців.", "Суглобові відростки у фронтальній площині — ознака грудних хребців."]}, {"n": "1.30", "q": "У чоловіка 54 років під час рентгенологічного дослідження виявлена пухлина верхньої частки правої легені. Середня та нижня частки правої легені та частки лівої легені – без патологічних змін. Які площини використовує лікар для визначення локалізації злоякісного процесу в легенях під час рентгенологічного дослідження?", "o": ["Plana transversa.", "Plana transversa та рlana sagittalis.", "Plana transversa та рlana frontalis.", "Plana sagittalis та рlana frontalis.", "Plana frontalis."], "a": [3], "e": ["Лише поперечні площини не дозволяють визначити положення частки спереду-ззаду та справа-зліва.", "Поперечні та сагітальні площини не охоплюють поділ на передній/задній.", "Поперечні та фронтальні площини не показують розподіл на праву й ліву частки.", "Локалізацію частки легені визначають за положенням у сагітальній і фронтальній площинах.", "Лише фронтальна площина визначає тільки передній/задній розподіл."]}], "models": [["Шийний, грудний і поперековий хребці", "sf:9cd7985cec8942ed8507c76f235bd6b3"], ["Хребтовий стовп за відділами", "sf:d6694f4a47ff4dc989f1aa1ce408ca1d"]]}, {"id": "topic2", "title": "2. Крижова кістка. Куприк. Ребра, груднина", "questions": [{"n": "2.1", "q": "Дитина 7 років травмувала крижову кістку під час падіння. Рентгенологічне обстеження виявило ушкодження гребеня крижової кістки, який утворився шляхом зрощення остистих відростків крижових хребців. Який гребінь крижової кістки утворений зрощенням остистих відростків?", "o": ["Crista sacralis mediana.", "Crista sacralis medialis dexter.", "Crista sacralis medialis sinister.", "Crista sacralis lateralis dexter.", "Crista sacralis lateralis dexter."], "a": [0], "e": ["Серединний гребінь (crista sacralis mediana) утворений злиттям остистих відростків крижових хребців.", "Присередній гребінь — парний, утворений злиттям суглобових відростків, а не остистих.", "Лівий присередній гребінь — теж від суглобових відростків.", "Бічний гребінь — від злиття поперечних відростків.", "Правий бічний гребінь — від поперечних відростків, остисті в ньому не беруть участі."]}, {"n": "2.2", "q": "Лікар під час початку нападу ядухи у дитини 7 років використав подразнення рефлексогенної ділянки, яка розміщена в місці проєкції на шкіру непарної вирізки груднини. Яка вирізка груднини є непарною?", "o": ["Incisura costalis I.", "Incisura costalis II.", "Incisura jugularis.", "Incisura clavicularis.", "Incisura costalis VII."], "a": [2], "e": ["Реброва вирізка I — парна, до неї кріпиться хрящ I ребра.", "Реброва вирізка II — парна, на межі рукоятки й тіла груднини.", "Яремна вирізка (incisura jugularis) — єдина непарна вирізка на верхньому краї рукоятки груднини.", "Ключична вирізка — парна, для зчленування з ключицею.", "Реброва вирізка VII — парна, на нижньому краї тіла груднини."]}, {"n": "2.3", "q": "Дівчинка 5 років впала і травмувала крижову кістку. Рентгенологічно виявлено ушкодження гребенів крижової кістки, які утворились шляхом зрощення поперечних відростків крижових хребців. Які гребені крижової кістки ушкоджені?", "o": ["Серединний і правий присередній гребені.", "Правий бічний і лівий бічний гребені.", "Правий бічний і правий присередній гребені.", "Лівий бічний і лівий присередній гребені.", "Серединний і лівий присередній гребені."], "a": [1], "e": ["Серединний гребінь утворений остистими відростками, а присередній — суглобовими.", "Бічні гребені (правий і лівий) утворені злиттям поперечних відростків крижових хребців.", "Правий присередній утворений суглобовими, а не поперечними відростками.", "Присередній гребінь — від суглобових відростків; у відповіді має бути пара бічних.", "Серединний — від остистих, лівий присередній — від суглобових."]}, {"n": "2.4", "q": "Хлопчик 13 років після травми звернувся до хірурга зі скаргами на біль у лівій половині грудної клітки. Рентгенологічно виявлено перелом лівого ребра, яке з’єднується з ребровою вирізкою груднини, розташованою на рівні кута груднини. Яке ребро ушкоджене?", "o": ["I.", "II.", "III.", "IV.", "V."], "a": [1], "e": ["I ребро кріпиться до рукоятки груднини, а не на рівні її кута.", "II ребро з'єднується з ребровою вирізкою на рівні кута груднини (angulus sterni) — важливий орієнтир.", "III ребро кріпиться до тіла груднини нижче кута.", "IV ребро нижче рівня кута груднини.", "V ребро нижче кута, на тілі груднини."]}, {"n": "2.5", "q": "Дівчинка 14 років відчула сильний біль у грудній клітці при падінні. Під час рентгенологічного дослідження лікар виявив перелом ребра, на горбці якого відсутня суглобова поверхня. Яке ребро ушкоджене внаслідок падіння?", "o": ["II.", "III.", "VII.", "X.", "XII."], "a": [4], "e": ["На горбку II ребра суглобова поверхня є.", "На горбку III ребра суглобова поверхня є.", "На горбку VII ребра суглобова поверхня є для поперечного відростка.", "На горбку X ребра суглобова поверхня є.", "XII ребро (і XI) не має горбка із суглобовою поверхнею — воно не з'єднується з поперечним відростком."]}, {"n": "2.6", "q": "Лікар під час обстеження виявив у дитини 5 років болючість в ділянці вирізки груднини, що формує суглобову поверхню для суглоба плечового пояса. Яка вирізка груднини бере участь в утворенні суглоба плечового пояса?", "o": ["Incisura costalis I.", "Incisura costalis II.", "Incisura jugularis.", "Incisura clavicularis.", "Incisura costalis VII."], "a": [3], "e": ["Реброва вирізка I — для хряща I ребра.", "Реброва вирізка II — для хряща II ребра, на межі рукоятки й тіла.", "Яремна вирізка — це непарна вирізка на верхньому краї, плечовий пояс не утворює.", "Ключична вирізка (incisura clavicularis) утворює груднинно-ключичний суглоб — зчленування плечового пояса.", "Реброва вирізка VII — для хряща VII ребра на тілі груднини."]}, {"n": "2.7", "q": "Хлопчик 7 років при падінні травмував крижову кістку. Рентгенологічно виявлено ушкодження гребенів крижової кістки, які утворились шляхом зрощення суглобових відростків крижових хребців. Які гребені крижової кістки утворені злиттям суглобових відростків крижової кістки?", "o": ["Серединний і лівий присередній гребені.", "Правий присередній і лівий присередній гребені.", "Правий бічний і лівий бічний гребені.", "Правий присередній і лівий бічний гребені.", "Лівий присередній і правий бічний гребені."], "a": [1], "e": ["Серединний гребінь — від остистих відростків, а не від суглобових.", "Присередні (правий і лівий) гребені утворені злиттям суглобових відростків.", "Бічні гребені утворені поперечними відростками.", "Правий присередній правильний, але лівий бічний — від поперечних відростків.", "Лівий присередній правильний, але правий бічний — від поперечних відростків."]}, {"n": "2.8", "q": "Дівчинка 10 років травмувала грудну клітку. Рентгенологічно виявлено перелом правого найдовшого ребра. Яке ребро є найдовшим?", "o": ["II.", "III.", "IV.", "V.", "VII."], "a": [4], "e": ["II ребро коротке й широке, найдовшим не є.", "III ребро коротше за VII.", "IV ребро коротше за VII.", "V ребро коротше за VII.", "VII ребро є найдовшим серед усіх ребер."]}, {"n": "2.9", "q": "Лікар виявив у жінки 56 років почервоніння і болючість шкіри в ділянці суглоба, що утворений хрящем ребра і вирізкою на груднині, що розташована між її частинами. Яка вирізка на груднині утворена двома її частинами?", "o": ["Incisura costalis I.", "Incisura costalis II.", "Incisura costalis III.", "Incisura clavicularis.", "Incisura jugularis."], "a": [1], "e": ["Реброва вирізка I — на рукоятці груднини, а не між її частинами.", "Реброва вирізка II утворена на межі рукоятки й тіла груднини — її формують обидві частини.", "Реброва вирізка III — на тілі груднини.", "Ключична вирізка — на рукоятці, для ключиці.", "Яремна вирізка — на верхньому краї рукоятки."]}, {"n": "2.10", "q": "У чоловіка 52 років, що скаржився на біль та обмеження рухів у поперековому відділі хребтового стовпа, лікар-невролог виявив ушкодження крижово-поперекового з’єднання. Які відростки п’ятого поперекового хребця ушкоджені?", "o": ["Верхні суглобові відростки.", "Нижні суглобові відростки.", "Верхні і нижні суглобові відростки.", "Верхні суглобові і поперечні відростки.", "Нижні суглобові і поперечні відростки."], "a": [1], "e": ["Верхні суглобові відростки L5 з'єднуються з нижніми суглобовими відростками L4.", "Нижні суглобові відростки L5 зчленовуються з верхніми суглобовими відростками крижової кістки — це крижово-поперекове з'єднання.", "Верхні відростки L5 беруть участь у з'єднанні з L4, а не з крижовою кісткою.", "Поперечні відростки — не суглобові; у поєднанні з верхніми суглобовими відповідь також неправильна.", "Поперечні відростки — не суглобові; нижні суглобові відростки самі без них."]}, {"n": "2.11", "q": "У чоловіка 35 років під час рентгенологічного дослідження виявлено перелом в ділянці правого присереднього гребеня крижової кістки. Ліві гребені крижової кістки – без патологічних змін. Як називається площина, якою користується рентгенолог для опису патологічних змін крижової кістки?", "o": ["Горизонтальна.", "Стрілова.", "Лобова.", "Поперечна.", "Присерединна."], "a": [1], "e": ["Горизонтальна площина ділить тіло на верхню та нижню частини, а не на праву й ліву.", "Стрілова (сагітальна) площина розрізняє праву й ліву половини, тому нею описують правий і лівий присередні гребені.", "Лобова площина розрізняє передню та задню поверхні.", "Поперечна (горизонтальна) площина — верх і низ.", "«Присерединна» — не основна площина для опису, а лише паралельна до серединної."]}, {"n": "2.12", "q": "Крижова кістка людини має дві поверхні – тазову поверхню і спинну поверхню. Стосовно якої площини називають ці поверхні?", "o": ["Plana sagittalia.", "Plana frontalia.", "Plana horizontalia.", "Plana transversalia.", "Plana paramediana."], "a": [1], "e": ["Сагітальні площини розрізняють праву й ліву частини.", "Тазова (передня) та спинна (задня) поверхні називаються відносно лобової (фронтальної) площини.", "Горизонтальна площина розрізняє верхні й нижні частини.", "Поперечна площина розрізняє верх і низ.", "Парамедіанні — паралельні до серединної, розрізняють право/ліво."]}, {"n": "2.13", "q": "Жінка 50 років звернулася до хірурга зі скаргами на біль у лівій половині грудної клітки. Рентгенологічно виявлений перелом останього справжнього ребра в місці його з’єднання з ребровою вирізкою на тілі груднини. Яке ребро ушкоджено?", "o": ["VI.", "VII.", "III.", "IV.", "V."], "a": [1], "e": ["VI ребро — справжнє, але не останнє.", "VII ребро — останнє справжнє ребро, яке з'єднується з тілом груднини.", "III ребро — верхнє справжнє ребро.", "IV ребро — справжнє, але не останнє.", "V ребро — справжнє, але не останнє."]}, {"n": "2.14", "q": "До лікаря звернувся чоловік 45 років зі скаргою на біль в ділянці проєкції крижової кістки, що виникла після падіння. Рентгенологічно діагностовано перелом присереднього крижового гребеня. Яким терміном в анатомічній номенклатурі позначається латинською мовою термін «присередній»?", "o": ["Proximalis.", "Distalis.", "Anterior.", "Lateralis.", "Medialis."], "a": [4], "e": ["Proximalis означає «ближній».", "Distalis означає «дальній».", "Anterior означає «передній».", "Lateralis означає «бічний», тобто далі від серединної площини.", "Medialis означає «присередній», ближчий до серединної площини."]}, {"n": "2.15", "q": "Лікар виявив у чоловіка почервоніння і болючість шкіри в ділянці суглоба, утвореного хрящем ребра і вирізкою на груднині, що розташована на рівні кута груднини. Яке ребро розташовано на рівні кута груднини?", "o": ["I.", "II.", "III.", "IV.", "V."], "a": [1], "e": ["I ребро кріпиться до рукоятки груднини.", "II ребро з'єднується з вирізкою на рівні кута груднини.", "III ребро кріпиться до тіла груднини нижче кута.", "IV ребро нижче кута груднини.", "V ребро нижче кута груднини."]}, {"n": "2.16", "q": "Жінка 36 років травмувала грудну клітку, після чого звернулася до хірурга зі скаргами на біль у правій половині грудної клітки. Рентгенологічно виявлено перелом ребер, головки яких з’єднується з повною ребровою ямкою на тілі хребців. Які ребра ушкоджені?", "o": ["II.", "III–IV.", "VI–VII.", "VIII–X.", "XI–XII."], "a": [4], "e": ["II ребро має головку з двома ямками (гребінь є).", "III–IV ребра мають гребінь головки і дві площини.", "VI–VII ребра мають гребінь головки, їх головки з'єднуються з двома пів'ямками.", "VIII–X ребра мають гребінь головки і дві пів'ямки.", "XI–XII ребра мають головку лише з однією суглобовою поверхнею: вона з'єднується з повною ямкою на тілі хребця."]}, {"n": "2.17", "q": "Чоловік 40 років відчув сильний біль після падіння. Лікар виявив перелом тіла ребра, горбок якого немає суглобової поверхні для з'єднання з поперечними відростками. Яке ребро ушкоджене у чоловіка?", "o": ["I.", "III.", "VII.", "X.", "XII."], "a": [4], "e": ["I ребро має горбок із суглобовою поверхнею.", "III ребро має горбок із суглобовою поверхнею.", "VII ребро має суглобову поверхню на горбку.", "X ребро має суглобову поверхню на горбку.", "XII ребро не має горбка із суглобовою поверхнею."]}, {"n": "2.18", "q": "На 8-му тижні внутрішньоутробного розвитку у зародка починається заміна хрящового скелета на кістковий. У якому віці крижові хребці людини зростаються в єдину крижову кістку?", "o": ["У віці 1–2 років.", "У віці 3–7 років.", "У віці 8–12 років.", "У віці 13–20 років.", "У віці 17–25 років."], "a": [4], "e": ["У віці 1–2 років крижові хребці ще окремі.", "У 3–7 років зрощення ще не відбулося.", "У 8–12 років крижові хребці розділені міжхребцевими дисками.", "У 13–20 років зрощення ще триває, воно завершується пізніше.", "Крижові хребці зростаються в єдину кістку приблизно у віці 17–25 років."]}, {"n": "2.19", "q": "Крижова кістка складається із крижових хребців, які зростаються в одну суцільну кістку в кінці пубертатного періоду (періоду статевого дозрівання). Яка кількість хребців в нормі утворює крижову кістку?", "o": ["3.", "4.", "5.", "6.", "7."], "a": [2], "e": ["Три хребці — замало для крижової кістки.", "Чотири хребці — менше за норму.", "Крижова кістка складається з п'яти зрощених хребців.", "Шість хребців — більше за норму (бувають варіанти, але норма — п'ять).", "Сім хребців — не відповідає нормі."]}, {"n": "2.20", "q": "У чоловіка 50 років виявлена злоякісна пухлина прямої кишки, яка росте у бік передньої (тазової) поверхні, facies pelviсa, крижової кістки. На тазовій поверхні помітні лінії – місця зрощення тіл крижових хребців. Яку назву мають ці анатомічні утвори?", "o": ["Lineae transversae.", "Lineae arcuatfe.", "Lineae terminalis.", "Присередні крижові гребені.", "Бічні крижові гребені."], "a": [0], "e": ["Lineae transversae — поперечні лінії на тазовій поверхні, місця зрощення тіл крижових хребців.", "Lineae arcuatae — дугоподібні лінії клубової кістки.", "Linea terminalis — межова лінія таза (між великим і малим тазом).", "Присередні крижові гребені утворені суглобовими відростками на спинній поверхні.", "Бічні крижові гребені утворені поперечними відростками на спинній поверхні."]}, {"n": "2.21", "q": "У чоловіка 45 років після травми хребтового стовпа рентгенологічно діагностовано перелом бічної частини крижової кістки (partes laterales). Внаслідок цієї травми у хворого ушкоджена суглобова поверхня, яка зчленовується з однойменною поверхнею клубової кістки. Яка поверхня ушкоджена?", "o": ["Facies auricularis.", "Facies articularis superior.", "Facies articularis inferior.", "Facies articularis anterior.", "Facies articularis posterior."], "a": [4], "e": ["За анатомією саме вушкоподібна поверхня (facies auricularis) з'єднується з однойменною поверхнею клубової кістки. ⚠️ У ключі тесту відмічено інший варіант — схоже на помилку в ключі, уточніть у викладача.", "Facies articularis superior — верхній суглобовий відросток, зчленування з L5.", "Нижньої суглобової поверхні для клубової кістки немає; верхівка крижової кістки з'єднується з куприком.", "Facies articularis anterior — такої суглобової поверхні на крижовій кістці немає.", "⚠️ У ключі тесту правильною відмічено цю відповідь, але поверхні з такою назвою на крижовій кістці в номенклатурі немає; з клубовою кісткою зчленовується facies auricularis."]}, {"n": "2.22", "q": "Чоловіка 45 років госпіталізовано після дорожно-транспортної пригоди до травматологічного відділення лікарні. Після проведення рентгенологічного дослідження лікар діагностував перелом тіл всіх справжніх ребер справа. Які ребра ушкоджені?", "o": ["I–II.", "I–V.", "I–VII.", "I–VIII.", "I–XII."], "a": [2], "e": ["I–II — лише верхні два справжні ребра.", "I–V — не всі справжні ребра.", "Справжні ребра (costae verae) — з I по VII, вони з'єднуються з грудниною безпосередньо своїми хрящами.", "I–VIII — VIII ребро несправжнє.", "I–XII — включає несправжні та коливні ребра."]}, {"n": "2.23", "q": "Чоловіка 50 років госпіталізовано після дорожно-транспортної пригоди у травматологічне відділення лікарні. Після проведення рентгенологічного дослідження лікар діагностував перелом тіл всіх лівих несправжніх ребер (costae spuriae). Які ребра ушкоджені?", "o": ["I–II.", "III –IV.", "IV–V.", "VI–VII", "VIII–X."], "a": [4], "e": ["I–II — справжні ребра.", "III–IV — справжні ребра.", "IV–V — справжні ребра.", "VI–VII — справжні ребра.", "Несправжні ребра (costae spuriae) — VIII–X: їхні хрящі приєднуються до хряща вищого ребра."]}, {"n": "2.24", "q": "Чоловіка госпіталізовано після дорожно-транспортної пригоди до травматологічного відділення лікарні. Після проведення рентгенологічного дослідження лікар діагностував перелом тіл коливних ребер. Які ребра ушкоджені?", "o": ["I–II.", "I–IV.", "I–VII.", "VII–X.", "XI–XII."], "a": [4], "e": ["I–II — справжні ребра.", "I–IV — справжні ребра.", "I–VII — справжні ребра.", "VII–X — справжнє і несправжні ребра.", "Коливні ребра (costae fluctuantes) — XI–XII: вони вільно закінчуються в м'язах."]}, {"n": "2.25", "q": "У жінки 48 років після рентгенологічного дослідження на знімку виявлено: ушкодження суглобової поверхні головок ребер, а також візуалізовано розрив зв’язки, волокна якої починаються від гребеня головки ребра та прикріплюється до міжхребцевого диска. Які ребра мають гребінь головки ребра?", "o": ["I–II.", "II–IX.", "II–X.", "II–XI.", "II–XII."], "a": [2], "e": ["I–II: у I ребра гребеня головки немає, головка має одну поверхню.", "II–IX: пропущено X ребро, яке теж має гребінь головки.", "Гребінь головки ребра (crista capitis costae) є у II–X ребер.", "II–XI: у XI ребра гребеня немає.", "II–XII: у XI та XII ребер гребеня головки немає."]}, {"n": "2.26", "q": "Чоловік 25 років був госпіталізований після падіння з велосипеду до травматологічного відділення лікарні. Після проведення рентгенологічного дослідження лікар діагностував перелом ребер, у яких горбок ребра співпадає з кутом ребра. Які ребра ушкоджені?", "o": ["I–II.", "II–VII.", "VIII–IX.", "IX–X.", "XI–XII."], "a": [0], "e": ["У I–II ребер горбок співпадає з кутом ребра.", "У II–VII ребер кут розташований дистальніше від горбка.", "У VIII–IX ребер кут окремий від горбка.", "У IX–X ребер кут відділений від горбка.", "У XI–XII ребер горбка немає."]}, {"n": "2.27", "q": "У чоловіка 35 років під час проведення рентгенологічного дослідження лікар діагностував перелом ребра, на тілі якого відсутній кут ребра. Яке ребро ушкоджене?", "o": ["I.", "II.", "VIII.", "X.", "XII."], "a": [0], "e": ["I ребро не має кута ребра, бо горбок і кут практично співпадають.", "У II ребра кут є.", "У VIII ребра кут є.", "У X ребра кут є.", "XII ребро коротке, з нечітким кутом, але класичною відповіддю на «ребро без кута» є I ребро."]}, {"n": "2.28", "q": "Чоловіка 26 років госпіталізовано в лікарню з переломом ребер та кровотечею в грудній порожнині. Внаслідок травми виник розрив стінки міжребрових артерій, які проходять в борозні ребра (sulcus costae). У якому місці ребра проходить sulcus costae?", "o": ["Margo superior.", "Margo inferior.", "Caput coste.", "Angulus costae.", "Collum costae."], "a": [1], "e": ["Верхній край ребра — не місце борозни судин.", "Борозна ребра (sulcus costae) проходить по нижньому краю ребра.", "Головка ребра — частина, що з'єднується з тілом хребця.", "Кут ребра — місце вигину тіла ребра.", "Шийка ребра — звужена частина між головкою та горбком."]}, {"n": "2.29", "q": "Жінка 26 років госпіталізована в лікарню з запаленням плеври. Лікар призначив проведення пункції плевральної порожнини. Проведення пункції проводять в міжребровому просторі. Під час маніпуляції необхідно запобігти ушкодження міжребрових судин та нервів, які проходять в борозні ребра (sulcus costae). У якому місці проведення пункції плевральної порожнини безпечно?", "o": ["Margo superior.", "Margo inferior.", "Caput coste.", "Angulus costae.", "Collum costae."], "a": [0], "e": ["Верхній край ребра безпечний для пункції — судини й нерв лежать у борозні нижнього краю.", "Нижній край ребра небезпечний: у борозні проходять міжреброві судини та нерв.", "Головка ребра — не місце для проведення пункції, вона з'єднується з хребцем.", "Кут ребра — вигин тіла, не є місцем пункції.", "Шийка ребра — розташована біля хребта, не місце пункції."]}, {"n": "2.30", "q": "Чоловік 45 років госпіталізований після дорожно-транспортної пригоди у травматологічне відділення лікарні з артеріальною кровотечею. Після проведення рентгенологічного дослідження лікар діагностував перелом ребра, до верхньої поверхі якого прилягає підключичні артерія та вена, стінки яких ушкоджені внаслідок травми. Яке ребро ушкоджено?", "o": ["I.", "II.", "VIII.", "X.", "XII."], "a": [0], "e": ["Підключичні артерія та вена прилягають до верхньої поверхні I ребра (борозни підключичних артерії та вени).", "До II ребра підключичні судини не прилягають.", "До VIII ребра підключичні судини не прилягають.", "До X ребра підключичні судини не прилягають.", "До XII ребра підключичні судини не прилягають."]}], "models": [["Грудна клітка: ребра, груднина", "sf:0f1aa77bf02e4d438f8630bd6c53b12e"], ["Скелет тулуба з крижовою кісткою", "sf:601a448ecdcc446fae033341c601f7d2"]]}, {"id": "topic3", "title": "3. Лобова кістка, тімʼяна кістка, потилична кістка, решітчаста кістка", "questions": [{"n": "3.1", "q": "У лікарню госпіталізована дитина 8 років з черепно-мозковою травмою. Лікар діагностував перелом кістки черепа. Лінія перелому проходить через верхню каркову лінію (linea nuchalis superior). Яка кістка травмована?", "o": ["Лобова кістка (os frontale).", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Скронева кістка (os temporale).", "Решітчаста кістка (os ethmoidale)."], "a": [1], "e": ["На лобовій кістці каркових ліній немає — вони на потиличній.", "Верхня каркова лінія (linea nuchalis superior) розташована на зовнішній поверхні потиличної луски.", "На тім'яній кістці є верхня і нижня скроневі лінії, а не каркові.", "На скроневій кістці каркових ліній немає.", "Решітчаста кістка лежить усередині черепа між очними ямками, каркових ліній на ній немає."]}, {"n": "3.2", "q": "У лікарню бригадою швидкої медичної допомоги госпіталізовано дівчинку 10 років з черепно-мозковою травмою. Лікар діагностував перелом кістки черепа. Лінія перелому на рентгенограмі проходить через її стріловий край. Яка кістка травмована?", "o": ["Лобова кістка (os frontale).", "Потилична кістка (os occipitale).", "Решітчаста кістка (os ethmoidale).", "Скронева кістка (os temporale).", "Тім'яна кістка (os parietale)."], "a": [4], "e": ["Лобова кістка не має стрілового краю.", "Потилична кістка має ламбдоподібний і соскоподібний краї.", "Решітчаста кістка не має стрілового краю.", "Скронева кістка має тім'яний і клиноподібний краї.", "Стріловий край (margo sagittalis) має тім'яна кістка — ним вона з'єднується з протилежною у стріловому шві."]}, {"n": "3.3", "q": "У лікарню госпіталізовано хлопчика 6 років з переломом тім'яної кістки в ділянці соскоподібного кута, внаслідок чого виникла кровотеча з пазухи твердої оболони головного мозку. У ділянці якої борозни ушкоджена пазуха твердої оболони головного мозку?", "o": ["Борозни верхньої стрілової пазухи (sulcus sinus sagittalis superioris).", "Борозни нижньої кам'янистої пазухи (sulcus sinus petrosi inferioris).", "Борозни верхньої кам'янистої пазухи (sulcus sinus petrosi superioris).", "Борозни поперечної пазухи (sulcus sinus transversi).", "Борозни сигмоподібної пазухи (sulcus sinus sigmoidea)."], "a": [4], "e": ["Борозна верхньої стрілової пазухи проходить вздовж стрілового краю тім'яних кісток.", "Борозна нижньої кам'янистої пазухи — на скроневій і потиличній кістках біля кам'янистої частини.", "Борозна верхньої кам'янистої пазухи — на верхньому краї піраміди скроневої кістки.", "Борозна поперечної пазухи проходить переважно на потиличній кістці.", "Біля соскоподібного кута тім'яної кістки на її внутрішній поверхні проходить борозна сигмоподібної пазухи."]}, {"n": "3.4", "q": "Каретою швидкої медичної допомоги в лікарню доставлено дитину 10 років з черепно-мозковою травмою. У лікарні під час обстеження виявлено ушкодження пазухи твердої оболони головного мозку (sinus durae matris) в тому місці, де стінка пазухи прилягає до борозни на внутрішній поверхні лобової луски (squama frontalis). У ділянці якої борозни ушкоджена пазуха твердої оболони головного мозку?", "o": ["Борозни поперечної пазухи.", "Борозни верхньої кам'янистої.", "Борозни верхньої стрілової пазухи.", "Борозни нижньої кам'янистої пазухи.", "Борозни сигмоподібної пазухи."], "a": [2], "e": ["Борозна поперечної пазухи — на потиличній кістці.", "Борозна верхньої кам'янистої пазухи — на піраміді скроневої кістки.", "На внутрішній поверхні лобової луски по серединній лінії проходить борозна верхньої стрілової пазухи.", "Борозна нижньої кам'янистої пазухи — між скроневою та потиличною кістками.", "Борозна сигмоподібної пазухи — на скроневій, тім'яній і потиличній кістках ззаду."]}, {"n": "3.5", "q": "У лікарню госпіталізовано дівчинку 2-ох років з черепно-мозковою травмою. Після рентгенологічного обстеження лікар діагностував перелом кістки черепа. Лінія перелому проходить через crista occipitalis externa. Яка кістка травмована?", "o": ["Лобова кістка (os frontale).", "Скронева кістка (os temporale).", "Тім'яна кістка (os parietale).", "Потилична кістка (os occipitale).", "Решітчаста кістка (os ethmoidale)."], "a": [3], "e": ["На лобовій кістці немає зовнішнього потиличного гребеня.", "На скроневій кістці потиличного гребеня немає.", "На тім'яній кістці потиличного гребеня немає.", "Crista occipitalis externa — зовнішній потиличний гребінь на потиличній лусці.", "Решітчаста кістка розташована в передній частині черепа."]}, {"n": "3.6", "q": "У нейрохірургічну клініку госпіталізована дитина першого року життя з пухлиною головного мозку. Дитині була зроблена операція. Під час операції разом з пухлиною був видалений півнячий гребінь (crista galli). Частину якої кістки черепа видалили в цьому випадку?", "o": ["Потиличної кістки (os occipitale).", "Решітчастої кістки (os ethmoidale).", "Клиноподібної кістки (os sphenoidale).", "Тім'яної кістки (os parietale).", "Лобової кістки (os frontale)."], "a": [1], "e": ["Потилична кістка утворює задню частину основи черепа, півнячого гребеня не має.", "Півнячий гребінь (crista galli) — частина перпендикулярної пластинки решітчастої кістки над дірчастою пластинкою.", "Клиноподібна кістка має турецьке сідло, а не півнячий гребінь.", "Тім'яна кістка утворює склепіння черепа.", "Лобова кістка має лобовий гребінь, а півнячий гребінь лежить у її решітчастій вирізці, але належить решітчастій кістці."]}, {"n": "3.7", "q": "Обстежуючи хлопчика 3-ох років, лікар виявив пухлину головного мозку. Пухлина розташована на дірчастій пластинці (lamina cribrosa). До якої кістки черепа прилягає пухлина?", "o": ["Лобової кістки (os frontale).", "Потиличної кістки (os occipitale).", "Тім'яної кістки (os parietale).", "Решітчастої кістки (os ethmoidale).", "Клиноподібної кістки (os sphenoidale)."], "a": [3], "e": ["Лобова кістка охоплює решітчасту вирізкою, але дірчаста пластинка їй не належить.", "Потилична кістка — у задній черепній ямці.", "Тім'яна кістка утворює склепіння.", "Дірчаста пластинка (lamina cribrosa) належить решітчастій кістці, через неї проходять нюхові нитки.", "Клиноподібна кістка розташована позаду решітчастої."]}, {"n": "3.8", "q": "В онкологічне відділення лікарні госпіталізовано дівчинку 2-ох років з пухлиною, що розташована в носовій частині глотки. Після додаткового обстеження лікар виявив, що пухлина вросла в глотковий горбок (tuberculum pharyngeum). Яка кістка уражена пухлиною?", "o": ["Лобова кістка (os frontale).", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Скронева кістка (os temporale).", "Решітчаста кістка (os ethmoidale)."], "a": [1], "e": ["Лобова кістка не має глоткового горбка.", "Глотковий горбок (tuberculum pharyngeum) — на нижній поверхні основної частини потиличної кістки, до нього кріпиться глотка.", "Тім'яна кістка утворює склепіння.", "Скронева кістка не має глоткового горбка.", "Решітчаста кістка розташована у передній частині основи черепа."]}, {"n": "3.9", "q": "У лікарню каретою швидкої медичної допомоги доставлено юнака 12 років з травмою голови. Після рентгенологічного дослідження лікар виявив перелом кістки черепа. Лінія перелому проходить через надперенісся (glabella). Яка кістка травмована?", "o": ["Тім'яна кістка (os parietale).", "Лобова кістка (os frontale).", "Потилична кістка (os occipitale).", "Решітчаста кістка (os ethmoidale).", "Носова кістка (os nasale)."], "a": [1], "e": ["Тім'яна кістка утворює склепіння, надперенісся не має.", "Надперенісся (glabella) — гладка ділянка лобової луски між надбрівними дугами.", "Потилична кістка розташована ззаду.", "Решітчаста кістка лежить глибше, між очними ямками.", "Носова кістка лежить нижче надперенісся."]}, {"n": "3.10", "q": "У лікарню госпіталізовано чоловіка 45 років з ножовим пораненням ока. Після обстеження лікар також виявив ушкодження кістки черепа в ділянці ямки сльозової залози. Яка кістка черепа ушкоджена?", "o": ["Потилична кістка (os occipitale).", "Решітчаста кістка (os ethmoidale).", "Тім'яна кістка (os parietale).", "Лобова кістка (os frontale).", "Скронева кістка (os temporale)."], "a": [3], "e": ["Потилична кістка не бере участі в утворенні очної ямки.", "Решітчаста кістка утворює присередню стінку очної ямки.", "Тім'яна кістка не входить до очної ямки.", "Ямка сльозової залози — на очноямковій частині лобової кістки, біля виличного відростка.", "Скронева кістка не утворює стінок очної ямки."]}, {"n": "3.11", "q": "У чоловіка 20 років під час рентгенологічного обстеження виявлено ушкодження правої очноямкової частини лобової кістки. Як називається площина, що ділить тіло людини навпіл, на праву та ліву половини?", "o": ["Горизонтальна площина.", "Стрілова площина.", "Лобова площина.", "Поперечна площина.", "Присерединна площина."], "a": [1], "e": ["Горизонтальна площина ділить тіло на верхню і нижню частини.", "Стрілова (серединна) площина ділить тіло на праву і ліву половини.", "Лобова площина ділить тіло на передню і задню частини.", "Поперечна площина — те саме, що горизонтальна.", "Присерединні площини паралельні серединній, але не ділять тіло навпіл."]}, {"n": "3.12", "q": "З місця спортивних змагань у лікарню госпіталізовано хлопчика з травмою обличчя. Лікар під час МРТ-обстеження встановив перелом кістки черепа. Лінія перелому проходить вздовж підочноямкового краю (margo infraorbitalis). Яка кістка травмована?", "o": ["Лобова кістка (os frontale).", "Верхня щелепа (maxilla).", "Носова кістка (os nasale).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Лобова кістка утворює надочноямковий край.", "Підочноямковий край (margo infraorbitalis) утворює верхня щелепа (з участю виличної кістки).", "Носова кістка утворює спинку носа.", "Нижня щелепа не входить до очної ямки.", "Піднебінна кістка має невеликий очноямковий відросток глибоко в очній ямці."]}, {"n": "3.13", "q": "У лікарню каретою швидкої медичної допомоги госпіталізовано дівчину з черепно-мозковою травмою. Після обстеження виникла необхідність хірургічного втручання. Під час операції нейрохірург обробляє рану в ділянці надперенісся. Яка кістка ушкоджена?", "o": ["Лобова кістка (os frontale).", "Носова кістка (os nasale).", "Клиноподібна кістка (os sphenoidale).", "Верхня щелепа (maxilla).", "Решітчаста кістка (os ethmoidale)."], "a": [0], "e": ["Надперенісся (glabella) розташоване на лобовій кістці.", "Носова кістка лежить нижче надперенісся.", "Клиноподібна кістка розташована в основі черепа.", "Верхня щелепа — у середній частині обличчя.", "Решітчаста кістка лежить глибоко між очними ямками."]}, {"n": "3.14", "q": "У хірургічне відділення госпіталізовано хлопчика з травмою обличчя. Лікар приймального відділення встановив ушкодження кістки черепа, яка приймає участь в утворенні кісткової носової перегородки. Яка кістка ушкоджена в цьому випадку?", "o": ["Лобова кістка (os frontale).", "Носова кістка (os nasale).", "Клиноподібна кістка (os sphenoidale).", "Верхня щелепа (maxilla).", "Решітчаста кістка (os ethmoidale)."], "a": [4], "e": ["Лобова кістка утворює носову ость, але основна частина перегородки — не вона.", "Носова кістка утворює спинку носа.", "Клиноподібна кістка має гребінь, але основна частина перегородки утворена іншими кістками.", "Верхня щелепа має носовий гребінь, але перегородку переважно утворює перпендикулярна пластинка решітчастої кістки разом з лемешем.", "Перпендикулярна пластинка решітчастої кістки утворює верхню частину кісткової носової перегородки."]}, {"n": "3.15", "q": "У чоловіка 20 років на тлі гнійного запалення слизової оболонки носової порожнини процес поширився у передню черепну ямку. Через який анатомічний утвір розповсюдилось запалення?", "o": ["Foramina cribrosa.", "Foramen ovale.", "Foramen ethmoidalae posterius.", "Foramen sphenopalatinum.", "Foramen rotundum."], "a": [0], "e": ["Отвори дірчастої пластинки (foramina cribrosa) з'єднують носову порожнину з передньою черепною ямкою.", "Овальний отвір — у середній черепній ямці, з'єднує її з підскроневою ямкою.", "Задній решітчастий отвір з'єднує очну ямку з порожниною черепа, а не носову порожнину.", "Клино-піднебінний отвір з'єднує носову порожнину з крило-піднебінною ямкою.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою."]}, {"n": "3.16", "q": "У лікарню госпіталізовано чоловіка з травмою голови. Після обстеження лікар встановив перелом кістки мозкового черепа. Лінія перелому проходить через виличний відросток. Яка кістка травмована?", "o": ["Скронева кістка (os temporale).", "Нижня щелепа (mandibula).", "Вилична кістка (os zygomaticum).", "Клиноподібна кістка (os sphenoidale).", "Піднебінна кістка (os palatinum)."], "a": [0], "e": ["Виличний відросток скроневої кістки — частина мозкового черепа.", "Нижня щелепа належить до лицевого черепа.", "Вилична кістка — кістка лицевого черепа.", "Клиноподібна кістка не має виличного відростка.", "Піднебінна кістка — кістка лицевого черепа."]}, {"n": "3.17", "q": "У дитячу лікарню каретою швидкої медичної допомоги доставлено дитину 8 місяців з травмою голови у ділянці переднього тім'ячка. Рентгенологічно виявлено ушкодження кістки, що обмежує це тім'ячко спереду. Яка кістка ушкоджена?", "o": ["Скронева кістка (os temporale).", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Клиноподібна кістка (os sphenoidale).", "Лобова кістка (os frontale)."], "a": [4], "e": ["Скронева кістка не межує з переднім тім'ячком.", "Потилична кістка обмежує заднє тім'ячко.", "Тім'яні кістки обмежують переднє тім'ячко ззаду.", "Клиноподібна кістка обмежує клиноподібне тім'ячко.", "Спереду переднє тім'ячко обмежене двома половинами лобової кістки."]}, {"n": "3.18", "q": "У дівчинки з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми запалення лобової пазухи (фронтит). Через який утвір стало можливим розповсюдження інфекції в лобову пазуху?", "o": ["Клино-піднебінний отвір.", "Решітчасті комірки.", "Півмісяцевий розтвір.", "Решітчасту лійку.", "Клино-решітчастий закуток."], "a": [3], "e": ["Клино-піднебінний отвір веде в крило-піднебінну ямку.", "Решітчасті комірки відкриваються в носові ходи, але не є шляхом до лобової пазухи.", "Півмісяцевий розтвір — щілина в середньому носовому ході, лобова пазуха відкривається через лійку.", "Лобова пазуха відкривається в середній носовий хід через решітчасту лійку (infundibulum ethmoidale).", "Клино-решітчастий закуток — місце відкриття клиноподібної пазухи."]}, {"n": "3.19", "q": "Чоловік звернувся до лікаря зі скаргами на нежить та головний біль. Після рентгенологічного обстеження лікар виявив фронтит (запалення слизової оболонки лобової пазухи). З якого носового ходу стало можливим розповсюдження інфекції з носової порожнини в лобову пазуху?", "o": ["Meatus nasi communis.", "Meatus nasi superior.", "Meatus nasi medius.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — простір між раковинами і перегородкою.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Лобова пазуха відкривається в середній носовий хід.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід веде в глотку."]}, {"n": "3.20", "q": "У лікарню каретою швидкої медичної допомоги госпіталізовано чоловіка з травмою носа. Лікар діагностував перелом кістки черепа, що обмежує верхній край грушоподібного отвору кісткової носової порожнини. Яка кістка ушкоджена в даному випадку?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [3], "e": ["Сльозова кістка розташована в очній ямці.", "Верхня щелепа обмежує грушоподібний отвір знизу і з боків.", "Лобова кістка не обмежує грушоподібний отвір.", "Верхній край грушоподібного отвору утворюють носові кістки.", "Решітчаста кістка розташована глибше всередині носової порожнини."]}, {"n": "3.21", "q": "Обстежуючи жінку 35 років, лікар виявив розповсюдження запалення з ділянки надочноямкового отвору в очну ямку. На якій кістці розташований надочноямковий отвір?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [2], "e": ["Сльозова кістка — у присередній стінці очної ямки.", "Верхня щелепа має підочноямковий отвір, а не надочноямковий.", "Надочноямковий отвір (вирізка) розташований на надочноямковому краї лобової кістки.", "Носова кістка не має надочноямкового отвору.", "Решітчаста кістка має решітчасті отвори, а не надочноямковий."]}, {"n": "3.22", "q": "У хірургічне відділення госпіталізовано чоловіка 20 років з черепно-мозковою травмою. Після проведення рентгенологічного дослідження лікар виявив на Ro-зображенні ушкодження очноямкової пластинки однієї із кісток мозкового черепа, яка приймає участь в утворенні присередньої стінки правої очної ямки. Яка кістка ушкоджена в цьому випадку?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [4], "e": ["Сльозова кістка утворює присередню стінку, але це не кістка мозкового черепа.", "Верхня щелепа — кістка лицевого черепа.", "Лобова кістка утворює переважно верхню стінку.", "Носова кістка не бере участі в утворенні очної ямки.", "Очноямкова пластинка решітчастої кістки утворює присередню стінку очної ямки."]}, {"n": "3.23", "q": "У чоловіка 45 років під час обстеження лікар-онколог виявив пухлину стовбура головного мозку, яка проростає в кістку мозкового черепа, що утворює схил. Яка кістка ушкоджена в цьому випадку?", "o": ["Скронева кістка (os temporale).", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale)."], "a": [1], "e": ["Скронева кістка не утворює схилу.", "Схил (clivus) утворений основною частиною потиличної кістки разом з тілом клиноподібної.", "Тім'яна кістка утворює склепіння.", "Решітчаста кістка лежить у передній черепній ямці.", "Лобова кістка утворює передню черепну ямку."]}, {"n": "3.24", "q": "У ЛОР-відділення лікарні звернувся чоловік 50 років зі скаргами на втрату будь-якого запаху. При об'єктивному обстеженні носової порожнини ушкоджень не виявлено. Лікар припустив, що виникло порушення проведення нервового імпульсу на рівні ділянки периферійного відділу нюхового мозку. Через утвір якої кістки мозкового черепа волокна нюхового нерва потрапляють в порожнину черепа?", "o": ["Скроневої кістки (os temporale).", "Потиличної кістки (os occipitale).", "Тім'яної кістки (os parietale).", "Решітчастої кістки (os ethmoidale).", "Клиноподібної кістки (os sphenoidale)."], "a": [3], "e": ["Скронева кістка не має отворів для нюхових ниток.", "Потилична кістка не пропускає нюхових ниток.", "Тім'яна кістка утворює склепіння.", "Нюхові нитки проходять через отвори дірчастої пластинки решітчастої кістки.", "Клиноподібна кістка пропускає зоровий нерв, а не нюхові нитки."]}, {"n": "3.25", "q": "У чоловіка 67 років внаслідок підвищеного артеріального тиску на тлі гіпертонічної хвороби стався розрив стінки arteria basilaris, що прилягає до схилу на основі черепа. Які кістки черепа утворюють схил?", "o": ["Скронева кістка (os temporale) та потилична кістка (os occipitale).", "Потилична кістка (os occipitale) та тім'яна кістка (os parietale).", "Потилична кістка (os occipitale) та клиноподібна (os sphenoidale).", "Решітчаста кістка (os ethmoidale) та клиноподібна (os sphenoidale).", "Лобова кістка (os frontale) та клиноподібна (os sphenoidale)."], "a": [2], "e": ["Скронева кістка не бере участі в утворенні схилу.", "Тім'яна кістка утворює склепіння, а не схил.", "Схил утворюють основна частина потиличної кістки і тіло клиноподібної кістки.", "Решітчаста кістка розташована в передній черепній ямці.", "Лобова кістка утворює передню черепну ямку."]}, {"n": "3.26", "q": "Внаслідок травми лицевої ділянки голови ушкоджена верхня стінка правої очної ямки. Чоловік втратив можливість піднімати верхню повіку правого ока і дивитися вгору. Яка кістка, що спереду утворює верхню стінку правої очної ямки, ушкоджена?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [2], "e": ["Сльозова кістка утворює присередню стінку.", "Верхня щелепа утворює нижню стінку очної ямки.", "Верхню стінку очної ямки спереду утворює очноямкова частина лобової кістки.", "Носова кістка не входить до очної ямки.", "Решітчаста кістка утворює присередню стінку."]}, {"n": "3.27", "q": "У нейрохірургічне відділення госпіталізовано чоловіка з тромбозом внутрішньої яремної вени у ділянці яремного отвору. Внаслідок цього виявлені симптоми стиснення черепних нервів, волокна яких також проходять через цей отвір. Яка з кісток черепа приймає участь в утворенні яремного отвору?", "o": ["Сльозова кістка.", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale)."], "a": [1], "e": ["Сльозова кістка розташована в очній ямці.", "Яремний отвір утворений яремними вирізками потиличної та скроневої кісток.", "Тім'яна кістка утворює склепіння.", "Решітчаста кістка лежить у передній черепній ямці.", "Лобова кістка утворює передню черепну ямку."]}, {"n": "3.28", "q": "У чоловіка 45 років спостерігається зниження виділення секрету сльозовою залозою у сполучнооболонковий мішок, що призвело до висихання волокнистої оболонки очного яблука. Симптоми з'явилися після травми кісток бічної стінки очної ямки. На якій кістці лежить сльозова залоза?", "o": ["Сльозова кістка.", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale)."], "a": [4], "e": ["Сльозова кістка містить ямку сльозового мішка, а не залози.", "Потилична кістка не бере участі в утворенні очної ямки.", "Тім'яна кістка не бере участі в утворенні очної ямки.", "Решітчаста кістка утворює присередню стінку.", "Сльозова залоза лежить у ямці на очноямковій частині лобової кістки."]}, {"n": "3.29", "q": "У лікарню госпіталізовано чоловіка 45 років з переломом кісток основи черепа в ділянці великого потиличного отвору. Лікар встановив ушкодження під'язикового нерва в місці його проходження через одноіменний канал. До якої частини потиличної кістки відноситься canalis nervi hypoglossi?", "o": ["Основної частини.", "Великого отвору.", "Потиличної луски.", "Бічної частини.", "Схилу."], "a": [3], "e": ["Основна частина утворює схил і глотковий горбок.", "Великий отвір — це отвір, а не частина кістки.", "Потилична луска розташована ззаду.", "Канал під'язикового нерва проходить через бічну частину над потиличним виростком.", "Схил — частина основної частини."]}, {"n": "3.30", "q": "Потерпілому 32 років із травмою носа і носовою кровотечею лікар здійснив передню тампонаду носової порожнини. На МРТ-зображенні виявлено перелом носової перегородки та середньої носової раковини. Утвори якої кістки ушкоджені?", "o": ["Сльозової кістки (os lacrimale).", "Потиличної кістки (os occipitale).", "Тім'яної кістки (os parietale).", "Решітчастої кістки (os ethmoidale).", "Лобової кістки (os frontale)."], "a": [3], "e": ["Сльозова кістка розташована в очній ямці.", "Потилична кістка не бере участі в утворенні носової порожнини.", "Тім'яна кістка не бере участі в утворенні носової порожнини.", "Середня носова раковина і перпендикулярна пластинка (частина носової перегородки) належать решітчастій кістці.", "Лобова кістка утворює лише невелику частину склепіння носової порожнини."]}], "models": [["Череп — розібраний на кістки", "o3d:exploded-skull"], ["Череп з підписами", "o3d:overview-skull"], ["Кістки черепа різними кольорами", "sf:d1d1aed420424c8db784391ad8261a2f"]]}, {"id": "topic4", "title": "4. Скронева кістка, клиноподібна кістка (os temporale, os shpenoideum)", "questions": [{"n": "4.1", "q": "Жінку 45 років госпіталізовано в лікарню з гнійним запаленням барабанної порожнини. У хворої протягом тижня спостерігалися ознаки запалення слизової оболонки носової порожнини і глотки, що призвело до поширення інфекції в барабанну порожнину за ходом слухової труби (tuba auditiva). Через який канал скроневої кістки інфекція потрапила в барабанну порожнину?", "o": ["М'язово-трубний канал (canalis musculotubarius).", "Барабанний каналець (canaliculus tympanicus).", "Сонний канал (canalis caroticus).", "Каналець барабанної струни (canaliculus chordae tympani).", "Канал лицевого нерва (canalis nervi facialis)."], "a": [0], "e": ["М'язово-трубний канал містить півканал слухової труби, що з'єднує барабанну порожнину з носоглоткою — шлях інфекції з глотки.", "Барабанний каналець пропускає барабанний нерв (від IX пари), з глоткою не сполучається.", "Сонний канал пропускає внутрішню сонну артерію.", "Каналець барабанної струни пропускає chorda tympani в барабанну порожнину.", "Канал лицевого нерва пропускає VII нерв до шило-соскоподібного отвору."]}, {"n": "4.2", "q": "У лікарню госпіталізовано чоловіка 55 років з травмою ока. Крім ушкодження очного яблука, лікар діагностував перелом очноямкової поверхні (facies orbitalis) клиноподібної кістки (os sphenoidale). На якій частині клиноподібної кістки розташована facies orbitalis?", "o": ["Тіло (corpus).", "Мале крило (ala minor).", "Велике крило (ala major).", "Крилоподібний відросток (processus pterygoideus).", "Турецьке сідло (sella turcica)."], "a": [2], "e": ["Тіло клиноподібної кістки містить пазуху і турецьке сідло, очноямкової поверхні не має.", "Мале крило утворює частину верхньої стінки очної ямки і обмежує зоровий канал, але facies orbitalis — на великому крилі.", "Очноямкова поверхня (facies orbitalis) — одна з поверхонь великого крила, утворює бічну стінку очної ямки.", "Крилоподібний відросток спрямований донизу, до очної ямки не належить.", "Турецьке сідло — заглибина на верхній поверхні тіла для гіпофіза."]}, {"n": "4.3", "q": "У нейрохірургічне відділення лікарні госпіталізовано жінку 56 років із внутрішньочерепною пухлиною. Додаткове обстеження виявило, що уражені пухлиною клиноподібна і потилична кістки в місці їх зрощення на основі черепа. Яка частина клиноподібної кістки уражена пухлиною?", "o": ["Правий крилоподібний відросток (processus pterygoideus dexter).", "Мале крило (ala minor).", "Велике крило (ala major).", "Тіло (corpus).", "Лівий крилоподібний відросток (processus pterygoideus sinister)."], "a": [3], "e": ["Крилоподібний відросток спрямований донизу й не з'єднується з потиличною кісткою.", "Мале крило розташоване спереду, з потиличною кісткою не контактує.", "Велике крило з'єднується зі скроневою, лобовою, тім'яною кістками, але не з потиличною.", "Тіло клиноподібної кістки зростається з основною частиною потиличної, утворюючи схил.", "Лівий крилоподібний відросток спрямований донизу й не межує з потиличною кісткою."]}, {"n": "4.4", "q": "У нейрохірургічне відділення лікарні госпіталізовано жінку 46 років з пухлиною гіпофіза. КТ-обстеження хворої виявило, що пухлина зруйнувала спинку турецького сідла. Яка кістка ушкоджена пухлиною?", "o": ["Скронева кістка (os temporale).", "Клиноподібна кістка (os sphenoidale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Потилична кістка (os occipitale)."], "a": [1], "e": ["Скронева кістка не має турецького сідла.", "Турецьке сідло зі спинкою (dorsum sellae) — на тілі клиноподібної кістки.", "Решітчаста кістка розташована спереду, у передній черепній ямці.", "Лобова кістка утворює передню черепну ямку.", "Потилична кістка утворює задню черепну ямку; схил лише продовжує спинку сідла."]}, {"n": "4.5", "q": "У чоловіка 34 років діагностовано стиснення chorda tympani в місці її виходу із барабанної порожнини в підскроневу ямку через одну із щілин скроневої кістки. У ділянці якої щілини стиснута барабанна струна (chorda tympani)?", "o": ["Fissura petrotympanica.", "Fissura tympanomastoidea.", "Fissura petrosquamosa.", "Fissura sphenopetrosa.", "Fissura petrooccipitalis."], "a": [0], "e": ["Через кам'янисто-барабанну щілину (Глазерову) chorda tympani виходить з барабанної порожнини.", "Барабанно-соскоподібна щілина пропускає вушну гілку блукаючого нерва.", "Кам'янисто-лускова щілина — межа між пірамідою та лускою, chorda tympani не проходить.", "Клино-кам'яниста щілина — між клиноподібною кісткою та пірамідою.", "Кам'янисто-потилична щілина — між пірамідою та потиличною кісткою."]}, {"n": "4.6", "q": "До лікаря-стоматолога звернувся чоловік зі скаргами на біль у ділянці проєкції скронево-нижньощелепного суглоба, що виникає під час жування. Після обстеження лікар встановив запалення утвору скроневої кістки, що розташований спереду від нижньощелепної ямки та під основою виличного відростка. Який утвір скроневої кістки уражений?", "o": ["Дугове підвищення (eminentia arcuata).", "Суглобовий горбок (tuberculum articulare).", "Барабанне кільце (anulus tympanicus).", "Шилоподібний відросток (processus styloideus).", "Соскоподібний відросток (processus mastoideus)."], "a": [1], "e": ["Дугове підвищення — на передній поверхні піраміди, над переднім півколовим каналом.", "Суглобовий горбок (tuberculum articulare) лежить спереду від нижньощелепної ямки під основою виличного відростка.", "Барабанне кільце — зачаток барабанної частини у новонароджених.", "Шилоподібний відросток розташований позаду й нижче, до суглоба не входить.", "Соскоподібний відросток лежить позаду зовнішнього слухового ходу."]}, {"n": "4.7", "q": "Для уточнення діагнозу лікар направив у діагностичний центр чоловіка 45 років з симптомами порушення функцій VII та VIII пар черепних нервів. Після МРТ-обстеження виявлено, що нерви стиснуті пухлиною в лівому внутрішньому слуховому отворі (porus acusticus internus). Біля отвору якої кістки пухлина стискає нерви?", "o": ["Лівої скроневої кістки.", "Клиноподібної кістки.", "Лівої потиличної кістки.", "Лівої тім'яної кістки.", "Решітчастої кістки."], "a": [0], "e": ["Внутрішній слуховий отвір розташований на задній поверхні піраміди скроневої кістки; через нього проходять VII і VIII нерви.", "Клиноподібна кістка не має слухового отвору.", "На потиличній кістці внутрішнього слухового отвору немає.", "Тім'яна кістка не має слухових отворів.", "Решітчаста кістка розташована в передній черепній ямці."]}, {"n": "4.8", "q": "У онкологічне відділення лікарні госпіталізовано чоловіка з позачерепною пухлиною голови. Під час операції хірург видалив разом із пухлиною частину стінки зовнішнього слухового ходу (meatus acusticus externus). Части
