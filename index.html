ну якої кістки видалив хірург?", "o": ["Лобової кістки (os frontale).", "Скроневої кістки (os temporale).", "Решітчастої кістки (os ethmoidale).", "Клиноподібної кістки (os sphenoidale).", "Потиличної кістки (os occipitale)."], "a": [1], "e": ["Лобова кістка не утворює слухового ходу.", "Стінки кісткового зовнішнього слухового ходу утворює переважно барабанна частина скроневої кістки.", "Решітчаста кістка — у передній частині черепа.", "Клиноподібна кістка не утворює слухового ходу.", "Потилична кістка не утворює слухового ходу."]}, {"n": "4.9", "q": "У нейрохірургічну клініку госпіталізовано чоловіка з внутрішньочерепною пухлиною. Після обстеження встановлено, що пухлина звужує простір, який обмежений великим і малим крилами клиноподібної кістки. Який простір звужує пухлина?", "o": ["Верхню очноямкову щілину (fissura orbitalis superior).", "Остистий отвір (foramen spinosum).", "Овальний отвір (foramen ovale).", "Круглий отвір (foramen rotundum).", "Крилоподібний канал (canalis pterygoideus)."], "a": [0], "e": ["Верхня очноямкова щілина обмежена великим і малим крилами клиноподібної кістки.", "Остистий отвір розташований у великому крилі, пропускає середню оболонну артерію.", "Овальний отвір у великому крилі пропускає нижньощелепний нерв.", "Круглий отвір у великому крилі пропускає верхньощелепний нерв.", "Крилоподібний канал проходить в основі крилоподібного відростка."]}, {"n": "4.10", "q": "Лікар діагностичного центру виявив у чоловіка внутрішньочерепну пухлину, що росте в покрівлю барабанної порожнини (tegmen tympani). Яка частина скроневої кістки зруйнована пухлиною?", "o": ["Кам'яниста частина (pars petrosa).", "Лускова частина (pars squamosa).", "Барабанна частина (pars tympanica).", "Соскоподібний відросток (processus mastoideus).", "Шилоподібний відросток (processus styloideus)."], "a": [0], "e": ["Покрівля барабанної порожнини (tegmen tympani) — частина передньої поверхні кам'янистої частини (піраміди).", "Лускова частина утворює бічну стінку черепа.", "Барабанна частина утворює стінки зовнішнього слухового ходу.", "Соскоподібний відросток містить соскоподібні комірки, але покрівля барабанної порожнини не на ньому.", "Шилоподібний відросток — місце кріплення м'язів та зв'язок."]}, {"n": "4.11", "q": "Після дорожньо-транспортної пригоди у лікарню госпіталізовано жінку з переломом скроневої кістки, який ускладнений кровотечею з пазухи твердої оболони головного мозку. Розрив стінки пазухи виник в тому місці, де вона прилягає до борозни на внутрішній (мозковій) поверхні соскоподібного відростка скроневої кістки. У ділянці якої борозни ушкоджена пазуха твердої оболони головного мозку?", "o": ["Борозни верхньої стрілової пазухи (sulcus sinus sagittalis superioris).", "Борозни нижньої кам'янистої пазухи (sulcus sinus petrosi inferioris).", "Борозни сигмоподібної пазухи (sulcus sinus sigmoidei).", "Борозни верхньої кам'янистої пазухи (sulcus sinus petrosi superioris).", "Борозни поперечної пазухи (sulcus sinus transversi)."], "a": [2], "e": ["Борозна верхньої стрілової пазухи — по серединній лінії склепіння.", "Борозна нижньої кам'янистої пазухи — на задньому краї піраміди.", "На внутрішній поверхні соскоподібного відростка проходить борозна сигмоподібної пазухи.", "Борозна верхньої кам'янистої пазухи — на верхньому краї піраміди.", "Борозна поперечної пазухи — на потиличній кістці."]}, {"n": "4.12", "q": "У лікарню госпіталізовано чоловіка 57 років з гнійним запаленням глибоких лімфатичних вузлів шиї. Запалення поширилося на нерв, волокна якого через канал скроневої кістки, вхідним отвором якого є fossula petrosa, потрапляють в барабанну порожнину. На якій поверхні скроневої кістки розташована кам'яниста ямочка та який канал скроневої кістки в ній починається?", "o": ["На передній поверхні піраміди, барабанний каналець.", "На задній поверхні піраміди, барабанний каналець.", "На нижній поверхні піраміди, барабанний каналець.", "На нижній поверхні піраміди, соскоподібний каналець.", "На нижній поверхні піраміди, каналець барабанної струни."], "a": [2], "e": ["На передній поверхні піраміди — розтвори каналів кам'янистих нервів, а не кам'яниста ямочка.", "На задній поверхні — внутрішній слуховий отвір, кам'яниста ямочка не там.", "Кам'яниста ямочка — на нижній поверхні піраміди, у ній починається барабанний каналець для барабанного нерва.", "Соскоподібний каналець починається в яремній ямці, а не в кам'янистій ямочці.", "Каналець барабанної струни відходить від каналу лицевого нерва."]}, {"n": "4.13", "q": "У лікарню госпіталізовано жінку 53 років з черепно-мозковою травмою. Рентгенологічно у неї виявлено перелом шилоподібного відростка (processus styloideus). Яка кістка ушкоджена?", "o": ["Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Клиноподібна кістка (os sphenoidale).", "Скронева кістка (os temporale).", "Потилична кістка (os occipitale)."], "a": [3], "e": ["Решітчаста кістка не має шилоподібного відростка.", "Лобова кістка не має шилоподібного відростка.", "Клиноподібна кістка має крилоподібні відростки, а не шилоподібний.", "Шилоподібний відросток відходить від нижньої поверхні піраміди скроневої кістки.", "Потилична кістка має виростки, а не шилоподібний відросток."]}, {"n": "4.14", "q": "Виконуючи обстеження жінки 45 років, нейрохірург виявив звуження просвіту внутрішньої сонної артерії в місці її розташування на сонній борозні (sulcus caroticus) в середній черепній ямці. На якій кістці знаходиться звужена ділянка внутрішньої сонної артерії?", "o": ["Потиличній кістці (os occipitale).", "Скроневій кістці (os temporale).", "Решітчастій кістці (os ethmoidale).", "Лобовій кістці (os frontale).", "Клиноподібній кістці (os sphenoidale)."], "a": [4], "e": ["Потилична кістка не має сонної борозни.", "Сонний канал проходить у піраміді скроневої кістки, але сонна борозна — в іншому місці.", "Решітчаста кістка розташована в передній черепній ямці.", "Лобова кістка утворює передню черепну ямку.", "Сонна борозна розташована на бічній поверхні тіла клиноподібної кістки."]}, {"n": "4.15", "q": "Під час операції по закриттю вродженого розщеплення піднебіння (уранопластики), при збиванні долотом крилоподібного гачка, ушкоджено великий піднебінний канал і нерв, що проходить в цьому каналі. На якому утворі клиноподібної кістки розташований крилоподібний гачок?", "o": ["Lamina medialis processus pterygoidei.", "Ala minor.", "Ala major.", "Corpus.", "Lamina lateralis processus pterygoidei."], "a": [0], "e": ["Крилоподібний гачок — на кінці присередньої пластинки крилоподібного відростка.", "Мале крило розташоване вгорі, гачка не має.", "Велике крило не має крилоподібного гачка.", "Тіло — центральна частина з пазухою.", "Бічна пластинка крилоподібного відростка гачка не має."]}, {"n": "4.16", "q": "У лікарню каретою швидкої медичної допомоги доставлено юнака з травмою голови. Після рентгенологічного обстеження лікар виявив перелом кістки черепа. Лінія перелому проходить через підскроневий гребінь. Яка кістка травмована?", "o": ["Тім'яна кістка (os parietale).", "Клиноподібна кістка (os sphenoidale).", "Потилична кістка (os occipitale).", "Решітчаста кістка (os ethmoidale).", "Носова кістка (os nasale)."], "a": [1], "e": ["Тім'яна кістка не має підскроневого гребеня.", "Підскроневий гребінь розташований на скроневій поверхні великого крила клиноподібної кістки.", "Потилична кістка не має підскроневого гребеня.", "Решітчаста кістка не має підскроневого гребеня.", "Носова кістка не має підскроневого гребеня."]}, {"n": "4.17", "q": "У лікарню госпіталізовано жінку 64 років, у якої на тлі травми нижньої щелепи виникло порушення смакової чутливості на слизовій оболонці передніх 2/3 язика. Лікар впевнений, що хвороба обумовлена ураженням нервових волокон барабанної струни, в місці її виходу з барабанної порожнини через щілину скроневої кістки. Крізь яку щілину скроневої кістки барабанна струна виходить з барабанної порожнини?", "o": ["Fissura petrotympanica.", "Fissura tympanomastoidea.", "Fissura petrosquamosa.", "Fissura sphenopetrosa.", "Fissura petrooccipitalis."], "a": [0], "e": ["Барабанна струна виходить з барабанної порожнини через кам'янисто-барабанну щілину.", "Барабанно-соскоподібна щілина пропускає вушну гілку блукаючого нерва.", "Кам'янисто-лускова щілина — межа між частинами скроневої кістки.", "Клино-кам'яниста щілина — між клиноподібною кісткою та пірамідою.", "Кам'янисто-потилична щілина — між пірамідою та потиличною кісткою."]}, {"n": "4.18", "q": "У нейрохірургічне відділення госпіталізовано чоловіка 54 років зі скаргами на відсутність чутливості шкіри нижньої повіки, бічної поверхні зовнішнього носа, верхньої губи. Лікар під час огляду діагностував запалення другої гілки трійчастого нерва. Через який утвір гілки цього нерва виходять із середньої черепної ямки в крило-піднебінну ямку?", "o": ["Круглий отвір.", "Рваний отвір.", "Овальний отвір.", "Нижню очноямкову щілину.", "Верхню очноямкову щілину."], "a": [0], "e": ["Верхньощелепний нерв (друга гілка V пари) виходить з середньої черепної ямки через круглий отвір у крило-піднебінну ямку.", "Рваний отвір закритий хрящем; через нього проходять кам'янисті нерви.", "Через овальний отвір проходить нижньощелепний нерв (третя гілка).", "Нижня очноямкова щілина з'єднує крило-піднебінну ямку з очною ямкою, але не з черепною ямкою.", "Через верхню очноямкову щілину проходить перша гілка (очний нерв)."]}, {"n": "4.19", "q": "У чоловіка 45 років з черепно-мозковою травмою лікар виявив перелом кістки основи черепа. Лінія перелому проходить через остистий і овальний отвори. Яка кістка ушкоджена?", "o": ["Лобова кістка (os frontale).", "Скронева кістка (os temporale).", "Решітчаста кістка (os ethmoidale).", "Клиноподібна кістка (os sphenoidale).", "Потилична кістка (os occipitale)."], "a": [3], "e": ["Лобова кістка не має остистого та овального отворів.", "Скронева кістка лише межує з ними, але отвори розташовані не на ній.", "Решітчаста кістка має дірчасту пластинку.", "Остистий і овальний отвори розташовані у великому крилі клиноподібної кістки.", "Потилична кістка має великий отвір та яремний."]}, {"n": "4.20", "q": "У дитини 6 років гнійне запалення середнього вуха ускладнилося гнійним запаленням комірок соскоподібного відростка. Виникла необхідність трепанації (розтину) соскоподібного відростка. На якій кістці черепа проводить трепанацію лікар та про близьке розташування якої венозної пазухи слід пам'ятати хірургу, щоб уникнути її травмування?", "o": ["На скроневій кістці, сигмоподібної.", "На скроневій кістці, верхньої стрілової.", "На потиличній кістці, сигмоподібної.", "На скроневій кістці, поперечної.", "На потиличній кістці, поперечної."], "a": [0], "e": ["Соскоподібний відросток належить скроневій кістці, а на його внутрішній поверхні проходить сигмоподібна пазуха.", "Верхня стрілова пазуха проходить по склепінню, далеко від соскоподібного відростка.", "Соскоподібний відросток — на скроневій кістці, а не на потиличній.", "Поперечна пазуха лежить на потиличній кістці, вище й позаду.", "Соскоподібний відросток не належить потиличній кістці."]}, {"n": "4.21", "q": "У чоловіка 56 років після запалення лімфатичних вузлів голови виникло стиснення рубцем волокон лицевого нерва біля отвору, через який він виходить із скроневої кістки на зовнішню поверхню основи черепа. Біля якого отвору стиснутий лицевий нерв?", "o": ["Шило-соскоподібного (foramen stylomastoideum).", "Внутрішнього слухового (porus acusticus internus).", "Соскоподібного (foramen mastoideum).", "Круглого (foramen rotundum).", "Зовнішнього слухового (porus acusticus externus)."], "a": [0], "e": ["Лицевий нерв виходить з черепа через шило-соскоподібний отвір.", "Через внутрішній слуховий отвір лицевий нерв входить у піраміду.", "Соскоподібний отвір пропускає випускну вену.", "Круглий отвір пропускає верхньощелепний нерв.", "Зовнішній слуховий отвір веде в зовнішній слуховий хід."]}, {"n": "4.22", "q": "У чоловіка 56 років ушкоджена барабанна перетинка. Лікар виявив порушення передачі звукових коливань барабанною перетинкою до перилімфи присінку внутрішнього вуха через систему слухових кісточок. Лікар підозрює порушення іннервації m. tensor tympani та m. stapedius, які забезпечують ступінь натягування барабанної перетинки і зміщення стремінця. На якій кістці бере початок m. tensor tympani та через який канал скроневої кістки потрапляє в барабанну порожнину", "o": ["Клиноподібній кістці, каналець барабанної струни.", "Скроневій кістці, м'язово-трубний канал (canalis musculotubarius).", "Клиноподібній кістці, м'язово-трубний канал (canalis musculotubarius).", "Клиноподібній кістці, барабанний каналець (canaliculus tympanicus).", "Скроневій кістці, барабанний каналець (canaliculus tympanicus)."], "a": [2], "e": ["Каналець барабанної струни пропускає chorda tympani, а не м'яз.", "М'язово-трубний канал правильний, але м'яз починається не лише від скроневої кістки.", "M. tensor tympani починається від великого крила клиноподібної кістки (та хряща слухової труби) і проходить у м'язово-трубному каналі.", "Барабанний каналець пропускає барабанний нерв.", "Барабанний каналець пропускає нерв, а м'яз починається від клиноподібної кістки."]}, {"n": "4.23", "q": "У чоловіка 25 років на МРТ-зображенні виявлена травма тім'яної, потиличної та скроневої кісток черепа, що супроводжується сильною кровотечею з пазухи твердої оболони головного мозку, яка прилягає до цих кісток. У місці якої борозни виникла кровотеча?", "o": ["Верхньої стрілової пазухи (sulcus sinus sagittalis superioris).", "Сигмоподібної пазухи (sulcus sinus sigmoidei).", "Поперечної пазухи (sulcus sinus transversi).", "Нижньої стрілової пазухи (sulcus sinus sagittalis inferioris).", "Потиличної пазухи (sulcus sinus occipitalis)."], "a": [2], "e": ["Верхня стрілова пазуха лежить між тім'яними кістками по серединній лінії.", "Сигмоподібна пазуха лежить переважно на скроневій кістці.", "Поперечна пазуха прилягає до потиличної кістки й соскоподібного кута тім'яної, переходячи в сигмоподібну біля скроневої.", "Нижня стрілова пазуха лежить у серпі мозку і борозни на кістках не утворює.", "Потилична пазуха лежить у серпі мозочка біля внутрішнього потиличного гребеня."]}, {"n": "4.24", "q": "У лікарню госпіталізована жінка 45 років з черепно-мозковою травмою. На МРТ-зображенні діагностовано перелом пластинок крилоподібного відростка. Яка кістка травмована?", "o": ["Тім'яна кістка (os parietale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Потилична кістка (os occipitale).", "Клиноподібна кістка (os sphenoidale)."], "a": [4], "e": ["Тім'яна кістка не має крилоподібного відростка.", "Решітчаста кістка не має крилоподібного відростка.", "Лобова кістка не має крилоподібного відростка.", "Потилична кістка не має крилоподібного відростка.", "Крилоподібні відростки з присередньою і бічною пластинками належать клиноподібній кістці."]}, {"n": "4.25", "q": "У лікарню потрапив чоловік з черепно-мозковою травмою. Рентгенологічно у пацієнта виявлено перелом кістки черепа. Лінія перелому проходить через соскоподібний відросток (processus mastoideus). Яка кістка ушкоджена?", "o": ["Клиноподібна кістка (os sphenoidale).", "Скронева кістка (os temporale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Потилична кістка (os occipitale)."], "a": [1], "e": ["Клиноподібна кістка не має соскоподібного відростка.", "Соскоподібний відросток належить скроневій кістці.", "Решітчаста кістка не має соскоподібного відростка.", "Лобова кістка не має соскоподібного відростка.", "Потилична кістка має соскоподібний край, але не відросток."]}, {"n": "4.26", "q": "У лікарню госпіталізована жінка 50 років із ознаками тромбозу пазухи твердої оболони головного мозку. Під час МРТ-обстеження діагностовано тромбоз пазухи твердої оболони мозку в борозні, що розташована по верхньому краю піраміди скроневої кістки. У ділянці якої борозни виникло ушкодження?", "o": ["Борозни верхньої стрілової пазухи (sulcus sinus sagittalis superioris).", "Борозни нижньої кам'янистої пазухи (sulcus sinus petrosi inferioris).", "Борозни сигмоподібної пазухи (sulcus sinus sigmoidei).", "Борозни верхньої кам'янистої пазухи (sulcus sinus petrosi superioris).", "Борозни поперечної пазухи (sulcus sinus transversi)."], "a": [3], "e": ["Борозна верхньої стрілової пазухи — по серединній лінії склепіння.", "Борозна нижньої кам'янистої пазухи — по задньому краю піраміди.", "Борозна сигмоподібної пазухи — на внутрішній поверхні соскоподібної частини.", "Борозна верхньої кам'янистої пазухи проходить уздовж верхнього краю піраміди скроневої кістки.", "Борозна поперечної пазухи — на потиличній кістці."]}, {"n": "4.27", "q": "У чоловіка 56 років внаслідок гнійного запалення середнього вуха виникло руйнування задньої стінки барабанної порожнини з поширенням гною до печери соскоподібного відростка. Це ускладнилося ушкодженням нерва, що проходить в каналі скроневої кістки по задній стінці барабанної порожнини та виходить з черепа через шило-соскоподібний отвір. Який канал скроневої кістки ушкоджений?", "o": ["М'язово-трубний канал (canalis musculotubarius).", "Барабанний каналець (canaliculus tympanicus).", "Сонний канал (canalis caroticus).", "Каналець барабанної струни (canaliculus chordae tympani).", "Канал лицевого нерва (canalis nervi facialis)."], "a": [4], "e": ["М'язово-трубний канал пов'язує барабанну порожнину з глоткою.", "Барабанний каналець пропускає барабанний нерв.", "Сонний канал пропускає внутрішню сонну артерію.", "Каналець барабанної струни пропускає chorda tympani.", "Канал лицевого нерва проходить по присередній і задній стінках барабанної порожнини та закінчується шило-соскоподібним отвором."]}, {"n": "4.28", "q": "У нейрохірургічну клініку госпіталізовано жінку 57 років із ознаками внутрішньочерепної пухлини. Під час хірургічного втручання основний етап операції був здійснений у ділянці трійчастого втиснення (impressio trigeminalis). На якій кістці був здійснений основний етап операції?", "o": ["Клиноподібної кістки (os sphenoidale).", "Скроневої кістки (os temporale).", "Решітчастої кістки (os ethmoidale).", "Лобової кістки (os frontale).", "Потиличної кістки (os occipitale)."], "a": [1], "e": ["Клиноподібна кістка трійчастого втиснення не має.", "Трійчасте втиснення — на передній поверхні верхівки піраміди скроневої кістки, тут лежить трійчастий вузол.", "Решітчаста кістка розташована в передній черепній ямці.", "Лобова кістка утворює передню черепну ямку.", "Потилична кістка утворює задню черепну ямку."]}, {"n": "4.29", "q": "У чоловіка 54 років після проведення МРТ-дослідження лікар виявив пухлину, що стискає нерви на передній поверхні кам'янистої частини скроневої кістки. Визначте, які отвори для виходу нервів з барабанної порожнини розташовані на передній поверхні кам'янистої частини скроневої кістки?", "o": ["Шило-соскоподібний та соскоподібний.", "Зовнішній та внутрішній отвори сонного каналу.", "Зовнішній та внутрішній слухові отвори.", "Отвори канальців присінка і завитки.", "Розтвори каналів великого і малого кам'янистих нервів."], "a": [4], "e": ["Шило-соскоподібний і соскоподібний отвори — на нижній і зовнішній поверхнях.", "Отвори сонного каналу — на нижній поверхні та верхівці піраміди.", "Зовнішній слуховий отвір — збоку, внутрішній — на задній поверхні.", "Отвори канальців присінка і завитки — на задній і нижній поверхнях піраміди.", "На передній поверхні піраміди — розтвори каналів великого і малого кам'янистих нервів."]}, {"n": "4.30", "q": "У лікарню потрапила жінка 35 років з черепно-мозковою травмою. Травма супроводжувалася кровотечею із пазухи твердої оболони головного мозку в тому місці, де вона прилягає до соскоподібного кута (angulus mastoideus) тім'яної кістки (os parietale) та утворює на ній борозну. У ділянці якої борозни виникла кровотеча", "o": ["Борозни верхньої стрілової пазухи (sulcus sinus sagittalis superioris).", "Борозни нижньої кам'янистої пазухи (sulcus sinus petrosi inferioris).", "Борозни сигмоподібної пазухи (sulcus sinus sigmoidei).", "Борозни верхньої кам'янистої пазухи (sulcus sinus petrosi superioris).", "Борозни поперечної пазухи (sulcus sinus transversi)."], "a": [2], "e": ["Борозна верхньої стрілової пазухи — по стріловому краю тім'яних кісток.", "Борозна нижньої кам'янистої пазухи — на задньому краї піраміди.", "Біля соскоподібного кута тім'яної кістки проходить борозна сигмоподібної пазухи.", "Борозна верхньої кам'янистої пазухи — на верхньому краї піраміди.", "Борозна поперечної пазухи — на потиличній кістці."]}], "models": [["Клиноподібна кістка", "sf:bbcdb2732b6f405090369221fa7fa0e5"], ["Клиноподібна кістка (розділена навпіл)", "sf:773c16965d69411a8f082a2143b4a100"], ["Скронева кістка (скан)", "sf:fed5c349bc4a4455b9cf0892eaa5e727"], ["Череп — розібраний на кістки", "o3d:exploded-skull"]]}, {"id": "topic5", "title": "5. Лицевий череп (viscerocranium)", "questions": [{"n": "5.1", "q": "Жінка звернулася до оториноларинголога зі скаргами на головний біль та нежить. Лікар діагностував запалення слизової оболонки верхньощелепної пазухи (гайморит). Яка кістка ушкоджена?", "o": ["Maxilla.", "Os ethmoidale.", "Os frontale.", "Os sphenoidale.", "Os palatinum."], "a": [0], "e": ["Верхньощелепна (гайморова) пазуха розташована в тілі верхньої щелепи.", "Решітчаста кістка містить решітчасті комірки, а не гайморову пазуху.", "Лобова кістка містить лобову пазуху (фронтит).", "Клиноподібна кістка містить клиноподібну пазуху (сфеноїдит).", "Піднебінна кістка не має пазухи."]}, {"n": "5.2", "q": "У лікарню каретою швидкої медичної допомоги доставлено чоловіка 35 років з черепно-мозковою травмою. Після рентгенологічного обстеження лікар діагностував перелом кістки черепа. Лінія перелому проходить через вінцевий відросток. Яка кістка травмована?", "o": ["Верхня щелепа (maxilla).", "Нижня щелепа (mandibula).", "Вилична кістка (os zygomaticum).", "Сльозова кістка (os lacrimale).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Верхня щелепа має лобовий, виличний, піднебінний і комірковий відростки, але не вінцевий.", "Вінцевий відросток (processus coronoideus) — передній відросток гілки нижньої щелепи, до нього кріпиться скроневий м'яз.", "Вилична кістка має лобовий і скроневий відростки.", "Сльозова кістка не має вінцевого відростка.", "Піднебінна кістка має пірамідний, очноямковий і клиноподібний відростки."]}, {"n": "5.3", "q": "У відділення щелепно-лицевої хірургії з вогнепальним пораненням госпіталізовано чоловіка 45 років. Під час рентгенологічного обстеження лікар виявив, що куля уразила кістку черепа біля підборідного отвору (foramen mentale). Яка кістка ушкоджена?", "o": ["Верхня щелепа (maxilla).", "Леміш (vomer).", "Вилична кістка (os zygomaticum).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [3], "e": ["Верхня щелепа має підочноямковий отвір, а не підборідний.", "Леміш не має отворів на обличчі.", "Вилична кістка має вилично-лицевий отвір.", "Підборідний отвір (foramen mentale) розташований на тілі нижньої щелепи під другим малим кутнім зубом.", "Піднебінна кістка має великий і малі піднебінні отвори."]}, {"n": "5.4", "q": "У жінки 36 років лікар діагностував запалення слизової оболонки верхньощелепної пазухи (sinus maxillaris). Під час обстеження в одному із носових ходів був виявлений гній, що витікав з верхньощелепної пазухи. В якому носовому ході лікар побачив гній?", "o": ["Meatus nasi medius.", "Meatus nasi superior.", "Meatus nasi communis.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [0], "e": ["Верхньощелепна пазуха відкривається півмісяцевим розтвором у середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід — щілина біля перегородки, пазухи в нього не відкриваються.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід з'єднує носову порожнину з глоткою."]}, {"n": "5.5", "q": "У хлопчика 12 років внаслідок довготривалого запалення слизової оболонки носової порожнини з'явилися симптоми запалення лобової пазухи (фронтит). Через який анатомічний утвір кісткової носової порожнини стало можливим розповсюдження інфекції в лобову пазуху?", "o": ["Клино-решітчастий закуток.", "Клино-піднебінний отвір.", "Півмісяцевий розтвір.", "Решітчасті комірки.", "Решітчасту лійку."], "a": [4], "e": ["У клино-решітчастий закуток відкривається клиноподібна пазуха.", "Клино-піднебінний отвір веде до крило-піднебінної ямки.", "Півмісяцевий розтвір — щілина, куди відкривається верхньощелепна пазуха; лобова — через лійку.", "Решітчасті комірки — окремі повітроносні порожнини.", "Лобова пазуха відкривається через решітчасту лійку в середній носовий хід."]}, {"n": "5.6", "q": "У жінки 23 років після дорожньо-транспортної пригоди виник крововилив та гнійне запалення м'яких тканин виличної ділянки обличчя. Лікар передбачає ушкодження стінки судини, яка виходить на лице через отвір виличної кістки. У ділянці якого отвору розташована гематома?", "o": ["Вилично-очноямкового.", "Вилично-скроневого.", "Вилично-лицевого.", "Круглого.", "Остистого."], "a": [2], "e": ["Вилично-очноямковий отвір веде всередину кістки з боку очної ямки.", "Вилично-скроневий отвір виходить у скроневу ямку.", "Вилично-лицевий отвір відкривається на лицевій поверхні виличної кістки — через нього судини й нерв виходять на обличчя.", "Круглий отвір розташований у клиноподібній кістці.", "Остистий отвір — у великому крилі клиноподібної кістки."]}, {"n": "5.7", "q": "Жінка 34 років потрапила в нейрохірургічне відділення лікарні з внутрішньочерепною пухлиною. Рентгенологічне обстеження хворої показало, що пухлина зруйнувала передні відділи нижньої стінки очної ямки. Яка кістка ушкоджена пухлиною?", "o": ["Клиноподібна кістка.", "Скронева кістка.", "Лобова кістка.", "Решітчаста кістка.", "Верхня щелепа."], "a": [4], "e": ["Клиноподібна кістка не утворює нижньої стінки очної ямки.", "Скронева кістка не бере участі в утворенні очної ямки.", "Лобова кістка утворює верхню стінку.", "Решітчаста кістка утворює присередню стінку.", "Нижню стінку очної ямки спереду утворює очноямкова поверхня верхньої щелепи."]}, {"n": "5.8", "q": "У хірургічне відділення лікарні госпіталізовано чоловіка 22 років з вогнепальним пораненням голови. Після МРТ-обстеження виявлено перелом шийки нижньої щелепи (collum mandibulae). У ділянці якого утвору нижньої щелепи розташовано ушкодження?", "o": ["Виросткового відростка (processus condylaris).", "Вінцевого відростка (processus coronoideus).", "Верхньої підборідної ості (spina mentalis superior).", "Язичка нижньої щелепи (lingula mandibulae).", "Нижньої підборідної ості (spina mentalis inferior)."], "a": [0], "e": ["Шийка нижньої щелепи — частина виросткового відростка під його головкою.", "Вінцевий відросток — передній відросток гілки, без шийки.", "Верхня підборідна ость — на внутрішній поверхні тіла, для підборідно-язикового м'яза.", "Язичок нижньої щелепи — пластинка біля отвору нижньої щелепи.", "Нижня підборідна ость — для підборідно-під'язикового м'яза."]}, {"n": "5.9", "q": "У лікарню госпіталізовано чоловіка 55 років з ножовим пораненням передньої шийної ділянки, внаслідок чого було ушкоджено великий ріг (cornu majus) кістки. Яка кістка ушкоджена?", "o": ["Верхня щелепа (maxilla).", "Під'язикова кістка (os hyoideum).", "Вилична кістка (os zygomaticum).", "Сльозова кістка (os lacrimale).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Верхня щелепа не має рогів.", "Під'язикова кістка має тіло, великі та малі роги; розташована на передній поверхні шиї.", "Вилична кістка не має рогів.", "Сльозова кістка не має рогів.", "Піднебінна кістка не має рогів."]}, {"n": "5.10", "q": "Жінка 45 років звернулася до лікаря зі скаргою на ускладнення носового дихання. Після обстеження лікар виявив викривлення кістки, яка утворює задньонижню частину кісткової носової перегородки. Яка кістка викривлена?", "o": ["Верхня щелепа (maxilla).", "Нижня щелепа (mandibula).", "Вилична кістка (os zygomaticum).", "Леміш (vomer).", "Піднебінна кістка (os palatinum)."], "a": [3], "e": ["Верхня щелепа утворює носовий гребінь, але не задньонижню частину перегородки.", "Нижня щелепа не бере участі в утворенні носової порожнини.", "Вилична кістка не входить до носової порожнини.", "Леміш (vomer) утворює задньонижню частину кісткової носової перегородки.", "Піднебінна кістка утворює дно та частину бічної стінки носової порожнини."]}, {"n": "5.11", "q": "У чоловіка 25 років після дорожньо-транспортної травми діагностовано руйнацію кісток лицевого черепа на присередній стінці очної ямки. Які кістки лицевого черепа ушкоджені?", "o": ["Верхня щелепа, сльозова кістка.", "Верхня щелепа, решітчаста кістка.", "Верхня щелепа, клиноподібна.", "Піднебінна кістка, сльозова кістка.", "Решітчаста кістка, сльозова кістка."], "a": [0], "e": ["Із кісток лицевого черепа присередню стінку очної ямки утворюють лобовий відросток верхньої щелепи та сльозова кістка.", "Решітчаста кістка теж є в присередній стінці, але вона належить до мозкового черепа.", "Клиноподібна кістка — мозковий череп і утворює задню частину стінки.", "Піднебінна кістка утворює задню частину нижньої стінки.", "Решітчаста кістка належить до мозкового черепа."]}, {"n": "5.12", "q": "У лікарню госпіталізовано чоловіка з вогнепальним пораненням суглоба, в утворенні якого приймає участь нижня щелепа (mandibula). Лікар виявив на рентгензображенні ушкодження суглобових поверхонь обох кісток, що утворюють цей суглоб. Яка кістка, крім нижньої щелепи, ушкоджена?", "o": ["Клиноподібна кістка (os sphenoidale).", "Скронева кістка (os temporale).", "Верхня щелепа (maxilla).", "Вилична кістка (os zygomaticum).", "Потилична кістка (os occipitale)."], "a": [1], "e": ["Клиноподібна кістка не утворює скронево-нижньощелепного суглоба.", "Скронево-нижньощелепний суглоб утворений голівкою нижньої щелепи та нижньощелепною ямкою скроневої кістки.", "Верхня щелепа не утворює суглоба з нижньою.", "Вилична кістка не утворює суглоба з нижньою щелепою.", "Потилична кістка утворює суглоб з атлантом."]}, {"n": "5.13", "q": "Лікар, обстежуючи носову порожнину у жінки 54 років, виявив звуження одного із носових ходів доброякісною пухлиною в ділянці проєкції canalis incisivus. Який носовий хід звужений в даному випадку?", "o": ["Meatus nasi communis.", "Meatus nasi superior.", "Meatus nasi interior.", "Meatus nasi medius.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — щілина біля перегородки.", "Верхній носовий хід розташований високо, біля решітчастої кістки.", "Носовий отвір різцевого каналу відкривається на дні носової порожнини в ділянці нижнього носового ходу.", "Середній носовий хід — під середньою раковиною, туди відкриваються пазухи.", "Носоглотковий хід — задній відділ."]}, {"n": "5.14", "q": "До хірурга звернулася жінка з гнійним запаленням шкіри в ділянці підочноямкового отвору. Лікар прогнозує можливість поширення запалення в очну ямку. На якій кістці розташований підочноямковий отвір?", "o": ["Клиноподібна кістка (os sphenoidale).", "Скронева кістка (os temporale).", "Верхня щелепа (maxilla).", "Нижня щелепа (mandibula).", "Вилична кістка (os zygomaticum)."], "a": [2], "e": ["Клиноподібна кістка не має підочноямкового отвору.", "Скронева кістка не має підочноямкового отвору.", "Підочноямковий отвір розташований на передній поверхні тіла верхньої щелепи під підочноямковим краєм.", "Нижня щелепа має підборідний отвір.", "Вилична кістка має вилично-лицевий отвір."]}, {"n": "5.15", "q": "У чоловіка 43 років діагностована емпієма жирового тіла очної ямки. Процес ускладнився ушкодженням очноямкового відростка кістки лицевого черепа, що утворює задню частину нижньої стінки очної ямки. Яка кістка ушкоджена?", "o": ["Нижня носова раковина.", "Піднебінна кістка.", "Верхня щелепа", "Нижня щелепа.", "Вилична кістка."], "a": [1], "e": ["Нижня носова раковина не має очноямкового відростка.", "Очноямковий відросток піднебінної кістки утворює задню частину нижньої стінки очної ямки.", "Верхня щелепа утворює передню і середню частини нижньої стінки.", "Нижня щелепа не бере участі в утворенні очної ямки.", "Вилична кістка утворює бічну і частину нижньої стінки спереду."]}, {"n": "5.16", "q": "У чоловіка 60 років рентгенологічно виявлено скупчення гною у верхньощелепній пазусі справа. В який із носових ходів носової порожнини спочатку буде прямувати гній?", "o": ["У правий нижній носовий.", "У правий середній носовий.", "У правий верхній носовий.", "У правий загальний носовий.", "У правий носоглотковий."], "a": [1], "e": ["У нижній носовий хід відкривається носо-сльозова протока.", "Верхньощелепна пазуха відкривається в середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід не має отворів пазух.", "Носоглотковий хід веде в глотку."]}, {"n": "5.17", "q": "Після пластичної операції на піднебінні у хлопчика 5 років виникло ускладнення у вигляді запалення кістки в ділянці розташування малих піднебінних отворів (foramina palatina minora). Яка кістка уражена?", "o": ["Верхня щелепа (maxilla).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale)", "Клиноподібна кістка (os sphenoidale).", "Піднебінна кістка (os palatinum)."], "a": [4], "e": ["Верхня щелепа утворює передні 2/3 піднебіння, без малих піднебінних отворів.", "Решітчаста кістка не бере участі в утворенні піднебіння.", "Лобова кістка не бере участі в утворенні піднебіння.", "Клиноподібна кістка не має піднебінних отворів.", "Малі піднебінні отвори розташовані на пірамідному відростку піднебінної кістки."]}, {"n": "5.18", "q": "У жінки 45 років з черепно-мозковою травмою під час рентгенологічного обстеження лікар виявив перелом кістки лицевого черепа. Лінія перелому проходить по щелепно-під'язиковій лінії (linea mylohyoidea). Яка кістка травмована?", "o": ["Верхня щелепа (maxilla).", "Сльозова кістка (os lacrimale).", "Вилична кістка (os zygomaticum).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [3], "e": ["Верхня щелепа не має щелепно-під'язикової лінії.", "Сльозова кістка не має такої лінії.", "Вилична кістка не має такої лінії.", "Щелепно-під'язикова лінія — на внутрішній поверхні тіла нижньої щелепи, місце кріплення однойменного м'яза.", "Піднебінна кістка не має такої лінії."]}, {"n": "5.19", "q": "З місця спортивних змагань у лікарню доставлений чоловік з травмою обличчя. Лікар на рентген-зображенні виявив перелом кістки лицевого черепа. Лінія перелому проходить через підочноямковий край (margo infraorbitalis). Яка кістка травмована?", "o": ["Сльозова кістка (os lacrimale).", "Верхня щелепа (maxilla).", "Носова кістка (os nasale).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Сльозова кістка розташована на присередній стінці очної ямки.", "Підочноямковий край утворений верхньою щелепою (разом з виличною кісткою).", "Носова кістка утворює спинку носа.", "Нижня щелепа не утворює країв очної ямки.", "Піднебінна кістка — глибоко в черепі."]}, {"n": "5.20", "q": "У хірургічне відділення доставлений чоловік 35 років з черепно-мозковою травмою. Лікар виявив ушкодження кістки черепа, яка приймає участь в утворенні бічної та нижньої стінок правої очної ямки. Яка кістка ушкоджена в цьому випадку?", "o": ["Права лобова кістка.", "Права вилична кістка.", "Права клиноподібна кістка.", "Права решітчаста кістка.", "Права верхня щелепа."], "a": [1], "e": ["Лобова кістка утворює верхню стінку очної ямки.", "Вилична кістка бере участь в утворенні і бічної, і нижньої стінок очної ямки.", "Клиноподібна кістка утворює бічну стінку ззаду, але не нижню.", "Решітчаста кістка утворює присередню стінку.", "Верхня щелепа утворює нижню стінку, але не бічну."]}, {"n": "5.21", "q": "У чоловіка 45 років гнійне запалення слизової оболонки носової порожнини поширилося у передню черепну ямку. Через який анатомічний утвір розповсюдилося запалення?", "o": ["Foramina cribrosa.", "Foramen ovale.", "Foramen ethmoidalae posterius.", "Foramen sphenopalatinum.", "Foramen rotundum."], "a": [0], "e": ["Отвори дірчастої пластинки (foramina cribrosa) з'єднують носову порожнину з передньою черепною ямкою.", "Овальний отвір з'єднує середню черепну ямку з підскроневою ямкою.", "Задній решітчастий отвір з'єднує очну ямку з порожниною черепа.", "Клино-піднебінний отвір з'єднує носову порожнину з крило-піднебінною ямкою.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою."]}, {"n": "5.22", "q": "Лікар, з метою знеболювання великих кутніх зубів, зробив пацієнту ін'єкцію анестетика (знеболюючої речовини) до утвору верхньої щелепи, що є місцем входу нервів з підскроневої ямки через foramina alveolaria до задніх зубних комірок. У ділянці якого утвору верхньої щелепи лікар зробив ін'єкцію анестетика?", "o": ["Sinus maxillaris.", "Processus frontalis", "Processus palatinus.", "Processus alveolaris.", "Tuber maxillae."], "a": [4], "e": ["Верхньощелепна пазуха — порожнина, а не місце ін'єкції.", "Лобовий відросток іде догори до лобової кістки.", "Піднебінний відросток утворює тверде піднебіння.", "Комірковий відросток містить комірки зубів, але comірчасті отвори для задніх зубів — на горбі.", "Горб верхньої щелепи (tuber maxillae) має коміркові отвори для задніх верхніх коміркових нервів."]}, {"n": "5.23", "q": "Під час проведення хірургічної операції з метою закриття вродженого розщеплення твердого піднебіння (уранопластики), при збиванні долотом крилоподібного гачка, ушкоджено великий піднебінний канал. Виникла кровотеча, яку можна зупинити лише шляхом тампонади каналу. Які кістки черепа утворюють цей канал?", "o": ["Піднебінна кістка та верхня щелепа.", "Піднебінна кістка та решітчаста кістка.", "Верхня щелепа та нижня носова раковина.", "Піднебінна кістка та нижня носова раковина.", "Піднебінна кістка та клиноподібна кістка."], "a": [0], "e": ["Великий піднебінний канал утворений великими піднебінними борознами піднебінної кістки та верхньої щелепи.", "Решітчаста кістка не бере участі в утворенні каналу.", "Нижня носова раковина не утворює піднебінного каналу.", "Нижня носова раковина не бере участі.", "Клиноподібна кістка лише межує ззаду, канал утворюють піднебінна кістка та верхня щелепа."]}, {"n": "5.24", "q": "Хірург, оперуючи жінку 50 років з пухлиною твердого піднебіння (palatum durum), видалив разом з пухлиною і третину тої частини верхньої щелепи (maxilla), що бере участь в утворенні кісткового піднебіння (palatum osseum). Яку частину верхньої щелепи видалив хірург?", "o": ["Тіло верхньої щелепи (corpus maxillae).", "Лобовий відросток (processus frontalis).", "Виличний відросток (processus zygomaticus).", "Піднебінний відросток (processus palatinus).", "Комірковий відросток (processus alveolaris)."], "a": [3], "e": ["Тіло верхньої щелепи містить пазуху, але піднебіння не утворює.", "Лобовий відросток іде догори.", "Виличний відросток з'єднується з виличною кісткою.", "Піднебінний відросток утворює передні 2/3 кісткового піднебіння.", "Комірковий відросток містить зуби, а не утворює піднебіння."]}, {"n": "5.25", "q": "У лікарню госпіталізовано чоловіка 45 років з травмою голови. Після обстеження лікар діагностував перелом кістки лицевого черепа. Лінія перелому проходить через виростковий відросток (processus condylaris). Яка кістка травмована?", "o": ["Верхня щелепа (maxilla).", "Нижня щелепа (mandibula).", "Вилична кістка (os zygomaticum).", "Сльозова кістка (os lacrimale).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Верхня щелепа не має виросткового відростка.", "Виростковий відросток — задній відросток гілки нижньої щелепи з голівкою для суглоба.", "Вилична кістка не має виросткового відростка.", "Сльозова кістка не має відростків.", "Піднебінна кістка не має виросткового відростка."]}, {"n": "5.26", "q": "У лікарню госпіталізовано чоловіка 45 років з черепно-мозковою травмою, що сталася під час дорожньо-транспортної пригоди. Після обстеження лікар виявив перелом кістки черепа. Лінія перелому проходить через підборідний виступ (protuberantia mentale). Яка кістка травмована?", "o": ["Нижня щелепа (mandibula).", "Верхня щелепа (maxilla).", "Вилична кістка (os zygomaticum).", "Леміш (vomer).", "Піднебінна кістка (os palatinum)."], "a": [0], "e": ["Підборідний виступ розташований на передній поверхні тіла нижньої щелепи.", "Верхня щелепа не має підборідного виступу.", "Вилична кістка не має підборідного виступу.", "Леміш — кістка носової перегородки.", "Піднебінна кістка розташована в піднебінні."]}, {"n": "5.27", "q": "У чоловіка 45 років, що госпіталізований в ЛОР-відділення лікарні, виявлена пухлина сльозового мішка в ділянці сльозової борозни. Які кістки лицевого черепа мають сльозову борозну?", "o": ["Піднебінна кістка та верхня щелепа.", "Сльозова кістка та верхня щелепа.", "Сльозова кістка та нижня носова раковина.", "Верхня щелепа та нижня носова раковина.", "Піднебінна кістка та нижня носова раковина."], "a": [1], "e": ["Піднебінна кістка не має сльозової борозни.", "Сльозову борозну мають сльозова кістка та лобовий відросток верхньої щелепи — разом вони утворюють ямку сльозового мішка.", "Нижня носова раковина має сльозовий відросток, але не борозну.", "Нижня носова раковина не має сльозової борозни.", "Піднебінна кістка та раковина не мають сльозової борозни."]}, {"n": "5.28", "q": "У лікарню каретою швидкої медичної допомоги доставлено чоловіка 56 років з травмою носа. Після рентгенологічного обстеження лікарем був діагностований перелом кістки лицевого черепа, що обмежує верхній край грушоподібного отвору кісткової носової порожнини. Яка кістка ушкоджена в даному випадку?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [3], "e": ["Сльозова кістка розташована в очній ямці.", "Верхня щелепа обмежує грушоподібний отвір знизу і з боків.", "Лобова кістка не обмежує грушоподібний отвір.", "Верхній край грушоподібного отвору утворюють носові кістки.", "Решітчаста кістка розташована глибше в носовій порожнині."]}, {"n": "5.29", "q": "Обстежуючи жінку 35 років, лікар діагностував розповсюдження запалення з ділянки іклової ямки в очну ямку. На якій кістці розташована іклова ямка?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [1], "e": ["Сльозова кістка — у присередній стінці очної ямки.", "Іклова ямка розташована на передній поверхні тіла верхньої щелепи під підочноямковим отвором.", "Лобова кістка не має іклової ямки.", "Носова кістка не має іклової ямки.", "Решітчаста кістка не має іклової ямки."]}, {"n": "5.30", "q": "В діагностичному центрі на МРТ у жінки 36 років виявлено звуження просвіту foramen jugulare dexter, що спричинило розвиток неврологічного захворювання. Між якими кістками черепа виявлено звуження яремного отвору?", "o": ["Потиличною та лобовою кістками.", "Скроневою та клиноподібною кістками.", "Потиличною та клиноподібною кістками.", "Скроневою та потиличною кістками.", "Клиноподібною та піднебінною кісткам"], "a": [3], "e": ["Лобова кістка не утворює яремного отвору.", "Клиноподібна кістка не утворює яремного отвору.", "Клиноподібна кістка не утворює яремного отвору.", "Яремний отвір утворений яремними вирізками скроневої та потиличної кісток.", "Піднебінна кістка розташована в лицевому черепі."]}], "models": [["Череп — розібраний на кістки", "o3d:exploded-skull"], ["Кістки черепа різними кольорами", "sf:d1d1aed420424c8db784391ad8261a2f"], ["Череп, що «розлітається» на кістки", "sf:252887e2e755427c90d9e3d0c6d3025f"]]}, {"id": "topic6", "title": "6. Очна ямка. Кісткова носова порожнина. Кісткове піднебіння", "questions": [{"n": "6.1", "q": "Під час обстеження жінки 26 років лікар діагностував запалення слизової оболонки верхньощелепної пазухи (sinus maxillaris). Під час обстеження в одному із носових ходів був виявлений гній, що затікав з верхньощелепної пазухи. У який носовий хід відкривається вічко sinus maxillaris?", "o": ["Meatus nasi medius.", "Meatus nasi superior.", "Meatus nasi communis.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [0], "e": ["Верхньощелепна пазуха відкривається півмісяцевим розтвором у середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід — щілина біля перегородки, пазухи в нього не відкриваються.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід з'єднує носову порожнину з глоткою."]}, {"n": "6.2", "q": "У чоловіка 56 років, що страждає на хронічний риніт, з'явилися симптоми запалення слизової оболонки лобової пазухи. Через який утвір кісткової носової порожнини стало можливим розповсюдження інфекції в лобову пазуху та виникнення фронтиту?", "o": ["Клино-решітчастий закуток.", "Клино-піднебінний отвір.", "Півмісяцевий розтвір.", "Решітчасті комірки.", "Решітчасту лійку."], "a": [4], "e": ["У клино-решітчастий закуток відкривається клиноподібна пазуха.", "Клино-піднебінний отвір веде до крило-піднебінної ямки.", "Півмісяцевий розтвір — щілина, куди відкривається верхньощелепна пазуха; лобова — через лійку.", "Решітчасті комірки — окремі повітроносні порожнини.", "Лобова пазуха відкривається через решітчасту лійку в середній носовий хід."]}, {"n": "6.3", "q": "У жінки 23 роки після травми ока виникло гнійне запалення м'яких тканин очної ямки, яке пізніше поширилось у підскроневу ямку. Через який анатомічний утвір гнійний процес поширився у підскроневу ямку?", "o": ["Через нижню очноямкову щілину.", "Через круглий отвір.", "Через клинопіднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [0], "e": ["Нижня очноямкова щілина з'єднує очну ямку з підскроневою і крило-піднебінною ямками.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою, а не очну ямку.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Вилично-очноямковий отвір веде у канал виличної кістки, а не в підскроневу ямку."]}, {"n": "6.4", "q": "Жінка 58 років госпіталізована в нейрохірургічне відділення з внутрішньочерепною пухлиною. Додаткове обстеження хворої показало, що пухлина зруйнувала передню половину верхньої стінки очної ямки. Яка кістка ушкоджена пухлиною?", "o": ["Клиноподібна кістка.", "Скронева кістка.", "Лобова кістка.", "Решітчаста кістка.", "Носова кістка."], "a": [2], "e": ["Клиноподібна кістка (мале крило) утворює задню частину верхньої стінки.", "Скронева кістка не бере участі в утворенні очної ямки.", "Передню (більшу) частину верхньої стінки очної ямки утворює очноямкова частина лобової кістки.", "Решітчаста кістка утворює присередню стінку.", "Носова кістка не бере участі в утворенні очної ямки."]}, {"n": "6.5", "q": "У чоловіка 26 років після травми ока виникло гнійне запалення м'яких тканин очної ямки. Пізніше інфекція поширилась у крило-піднебінну ямку. Через який анатомічний утвір гнійний процес поширився у крило-піднебінну ямку?", "o": ["Через круглий отвір.", "Через нижню очноямкову щілину.", "Через клино-піднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [1], "e": ["Круглий отвір веде з крило-піднебінної ямки в середню черепну ямку, а не в очну ямку.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина веде в середню черепну ямку.", "Вилично-очноямковий отвір веде у вилично-лицевий і вилично-скроневий канальці."]}, {"n": "6.6", "q": "Лікар, обстежуючи носову порожнину жінки 26 років, виявив звуження одного із носових ходів доброякісною пухлиною в ділянці проєкції canalis incisivus. Який носовий хід звужений в даному випадку?", "o": ["Meatus nasi communis.", "Meatus nasi superior.", "Meatus nasi interior.", "Meatus nasi medius.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — щілина біля перегородки.", "Верхній носовий хід розташований високо, біля решітчастої кістки.", "Носовий отвір різцевого каналу відкривається на дні носової порожнини в ділянці нижнього носового ходу.", "Середній носовий хід — під середньою раковиною, туди відкриваються пазухи.", "Носоглотковий хід — задній відділ."]}, {"n": "6.7", "q": "Хірург виявив у чоловіка 52 років гнійне запалення шкіри в підочноямковій ділянці. Лікар прогнозує можливість поширення запалення в очну ямку. Через який анатомічний утвір можливо поширення інфекції в даному випадку?", "o": ["Canalis incisivus.", "Canalis pterygoideus.", "Canalis nasolacrimalis.", "Canalis infraorbitalis.", "Fissura orbitalis inferior."], "a": [3], "e": ["Різцевий канал з'єднує носову порожнину з ротовою.", "Крилоподібний канал з'єднує ділянку рваного отвору з крило-піднебінною ямкою.", "Носо-сльозовий канал з'єднує очну ямку з нижнім носовим ходом.", "Підочноямковий канал відкривається підочноямковим отвором на обличчі й веде до очної ямки — шлях інфекції з підочноямкової ділянки.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною та підскроневою ямками, а не з обличчям."]}, {"n": "6.8", "q": "У чоловіка 57 років з абсцесом в підскроневій ямці з'явилося ускладнення у вигляді запалення тканин, що оточують очне яблуко. Крізь яке сполучення підскроневої ямки з очною ямкою поширилося запалення?", "o": ["Canalis palatinus major.", "Fissura orbitalis superior.", "Foramen sphenopalatinum.", "Fissura orbitalis inferior.", "Canalis pterygoideus."], "a": [3], "e": ["Великий піднебінний канал з'єднує крило-піднебінну ямку з ротовою порожниною.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Нижня очноямкова щілина з'єднує очну ямку з підскроневою ямкою.", "Крилоподібний канал з'єднує ділянку рваного отвору з крило-піднебінною ямкою."]}, {"n": "6.9", "q": "У жінки 45 років, що страждає на запалення слизової оболонки клиноподібної пазухи, лікар спостерігає відтік мутної рідини з отвору цієї пазухи. У який відділ носової порожнини спочатку потрапляє ексудат з клиноподібної пазухи?", "o": ["Meatus nasi inferior.", "Infundibulum.", "Meatus nasi medius", "Recessus sphenoethmoidalis.", "Meatus nasi communis."], "a": [3], "e": ["У нижній носовий хід відкривається носо-сльозова протока.", "У решітчасту лійку відкривається лобова пазуха.", "У середній носовий хід відкриваються верхньощелепна, лобова пазухи та передні й середні решітчасті комірки.", "Клиноподібна пазуха відкривається в клино-решітчастий закуток над верхньою носовою раковиною.", "Загальний носовий хід не має отворів пазух."]}, {"n": "6.10", "q": "У чоловіка 26 років рентгенологічно виявлено скупчення гною у верхньощелепній пазусі справа. У який із носових ходів спочатку буде прямувати гній?", "o": ["У правий нижній носовий.", "У правий середній носовий.", "У правий верхній носовий.", "У правий загальний носовий.", "У правий носоглотковий."], "a": [1], "e": ["У нижній носовий хід відкривається носо-сльозова протока.", "Верхньощелепна пазуха відкривається в середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід не має отворів пазух.", "Носоглотковий хід веде в глотку."]}, {"n": "6.11", "q": "Після пластичної операції на піднебінні у чоловіка виникло ускладнення у вигляді запалення кістки у ділянці розташування малих піднебінних отворів (foramina palatina minora). Яка кістка уражена запаленням?", "o": ["Верхня щелепа (maxilla).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Клиноподібна кістка (os sphenoidale).", "Піднебінна кістка (os palatinum)."], "a": [4], "e": ["Верхня щелепа утворює передні 2/3 піднебіння, без малих піднебінних отворів.", "Решітчаста кістка не бере участі в утворенні піднебіння.", "Лобова кістка не бере участі в утворенні піднебіння.", "Клиноподібна кістка не має піднебінних отворів.", "Малі піднебінні отвори розташовані на пірамідному відростку піднебінної кістки."]}, {"n": "6.12", "q": "З місця спортивних змагань у лікарню доставлено спортсмена з травмою обличчя. Лікар встановив перелом кістки лицевого черепа. Лінія перелому проходить через підочноямковий край (margo infraorbitalis). Яка кістка травмована?", "o": ["Сльозова кістка (os lacrimale).", "Верхня щелепа (maxilla).", "Носова кістка (os nasale).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Сльозова кістка розташована на присередній стінці очної ямки.", "Підочноямковий край утворений верхньою щелепою (разом з виличною кісткою).", "Носова кістка утворює спинку носа.", "Нижня щелепа не утворює країв очної ямки.", "Піднебінна кістка — глибоко в черепі."]}, {"n": "6.13", "q": "У хірургічне відділення госпіталізовано чоловіка 46 років з черепно-мозковою травмою. Лікар, під час проведення МРТ-дослідження, виявив ушкодження кістки черепа, що приймає участь в утворенні бічної та нижньої стінок правої очної ямки. Яка кістка ушкоджена в цьому випадку?", "o": ["Права лобова кістка.", "Права вилична кістка.", "Права клиноподібна кістка.", "Права решітчаста кістка.", "Права верхня щелепа."], "a": [1], "e": ["Лобова кістка утворює верхню стінку очної ямки.", "Вилична кістка бере участь в утворенні і бічної, і нижньої стінок очної ямки.", "Клиноподібна кістка утворює бічну стінку ззаду, але не нижню.", "Решітчаста кістка утворює присередню стінку.", "Верхня щелепа утворює нижню стінку, але не бічну."]}, {"n": "6.14", "q": "У жінки 34 років після гнійного запалення слизової оболонки носової порожнини інфекція поширилася у передню черепну ямку. Через який анатомічний утвір розповсюдилось запалення?", "o": ["Foramina cribrosa.", "Foramen ovale.", "Foramen ethmoidale posterius.", "Foramen sphenopalatinum.", "Foramen rotundum."], "a": [0], "e": ["Отвори дірчастої пластинки (foramina cribrosa) з'єднують носову порожнину з передньою черепною ямкою.", "Овальний отвір з'єднує середню черепну ямку з підскроневою ямкою.", "Задній решітчастий отвір з'єднує очну ямку з порожниною черепа.", "Клино-піднебінний отвір з'єднує носову порожнину з крило-піднебінною ямкою.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою."]}, {"n": "6.15", "q": "Обстежуючи чоловіка 30 років, офтальмолог виявив у нього порушення відпливу сльози в нижній носовий хід. Крізь яке сполучення очної ямки з нижнім носовим ходом в даному випадку ускладнено проходження сльози?", "o": ["Носо-сльозовий канал.", "Передній решітчастий отвір.", "Верхню очноямкову щілину.", "Нижню очноямкову щілину.", "Задній решітчастий отвір."], "a": [0], "e": ["Носо-сльозовий канал з'єднує очну ямку з нижнім носовим ходом, через нього відтікає сльоза.", "Передній решітчастий отвір з'єднує очну ямку з передньою черепною ямкою.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною та підскроневою ямками.", "Задній решітчастий отвір веде до задніх решітчастих комірок."]}, {"n": "6.16", "q": "У жінки 40 років з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми ураження клиноподібної пазухи. Через який утвір стало можливим розповсюдження інфекції з носової порожнини в цю пазуху?", "o": ["Півмісяцевий розтвір.", "Клино-піднебінний отвір.", "Овальний отвір.", "Отвір клиноподібної пазухи.", "Круглий отвір."], "a": [3], "e": ["Через півмісяцевий розтвір сполучаються верхньощелепна пазуха та середній носовий хід.", "Клино-піднебінний отвір веде в крило-піднебінну ямку.", "Овальний отвір розташований у великому крилі й веде в підскроневу ямку.", "Клиноподібна пазуха відкривається власним отвором (apertura sinus sphenoidalis) у клино-решітчастий закуток.", "Круглий отвір пропускає верхньощелепний нерв."]}, {"n": "6.17", "q": "Хірург, оперуючи жінку 45 років з пухлиною твердого піднебіння (palatum durum), видалив разом із пухлиною частину верхньої щелепи (maxilla), що бере участь в утворенні кісткового піднебіння (palatum osseum). Яку частину верхньої щелепи видалив хірург?", "o": ["Тіло верхньої щелепи (corpus maxillae).", "Лобовий відросток (processus frontalis).", "Виличний відросток (processus zygomaticus).", "Піднебінний відросток (processus palatinus).", "Комірковий відросток (processus alveolaris)."], "a": [3], "e": ["Тіло верхньої щелепи містить пазуху, але піднебіння не утворює.", "Лобовий відросток іде догори.", "Виличний відросток з'єднується з виличною кісткою.", "Піднебінний відросток утворює передні 2/3 кісткового піднебіння.", "Комірковий відросток містить зуби, а не утворює піднебіння."]}, {"n": "6.18", "q": "У жінки 56 років з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми запалення верхньощелепної пазухи (гайморит). Через який утвір носової порожнини стало можливим розповсюдження інфекції у верхньощелепну пазуху?", "o": ["Клино-піднебінний отвір.", "Решітчасті комірки.", "Півмісяцевий розтвір.", "Решітчасту лійку.", "Клино-решітчастий закуток."], "a": [2], "e": ["Клино-піднебінний отвір веде в крило-піднебінну ямку.", "Решітчасті комірки — окремі пазухи решітчастої кістки.", "Верхньощелепна пазуха відкривається через півмісяцевий розтвір у середній носовий хід.", "Через решітчасту лійку відкривається лобова пазуха.", "У клино-решітчастий закуток відкривається клиноподібна пазуха."]}, {"n": "6.19", "q": "Лікар виявив у чоловіка 34 років ознаки ушкодження слизової оболонки носової порожнини (нежить) та симптоми подразнення оболон головного мозку. Лікар діагностував наявність фронтиту (запалення слизової оболонки лобової пазухи). З якого носового ходу стало можливим розповсюдження інфекції із носової порожнини у лобову пазуху?", "o": ["Meatus nasi communis.", "Meatus nasi superior.", "Meatus nasi medius.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — простір між раковинами і перегородкою.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Лобова пазуха відкривається в середній носовий хід.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід веде в глотку."]}, {"n": "6.20", "q": "У лікарню карета швидкої медичної допомоги доставила чоловіка 23 років з травмою носа. Лікар під час огляду встановив перелом кісток лицевого черепа, що обмежують грушоподібний отвір кісткової носової порожнини. Які кістки ушкоджені в даному випадку?", "o": ["Сльозова кістка, верхня щелепа.", "Верхня щелепа, лобова кістка.", "Лобова кістка, носові кістки", "Носова кістка, верхня щелепа.", "Решітчаста кістка, верхня щелепа."], "a": [3], "e": ["Сльозова кістка не обмежує грушоподібний отвір.", "Лобова кістка не обмежує грушоподібний отвір.", "Лобова кістка не входить до країв грушоподібного отвору.", "Грушоподібний отвір обмежений носовими кістками зверху та верхніми щелепами з боків і знизу.", "Решітчаста кістка розташована всередині носової порожнини."]}, {"n": "6.21", "q": "Обстежуючи жінку 45 років, лікар встановив розповсюдження запалення з ділянки іклової ямки в очну ямку. Через який утвір черепа поширилося запалення?", "o": ["Верхню очноямкову щілину.", "Передній решітчастий отвір.", "Підочноямковий канал.", "Нижню очноямкову щілину.", "Носо-сльозовий канал."], "a": [2], "e": ["Верхня очноямкова щілина з'єднує очну ямку з порожниною черепа.", "Передній решітчастий отвір з'єднує очну ямку з черепом.", "Підочноямковий канал відкривається підочноямковим отвором над ікловою ямкою і з'єднує її ділянку з очною ямкою.", "Нижня очноямкова щілина веде в крило-піднебінну ямку.", "Носо-сльозовий канал веде в нижній носовий хід."]}, {"n": "6.22", "q": "У чоловіка 32 років діагностовано запалення слизової оболонки лобової пазухи. У який носовий хід спочатку буде прямувати ексудат?", "o": ["Середній носовий хід.", "Спільний носовий хід.", "Верхній носовий хід.", "Нижній носовий хід.", "Носо-глотковий хід."], "a": [0], "e": ["Лобова пазуха відкривається через решітчасту лійку в середній носовий хід.", "Спільний носовий хід не має отворів пазух.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носо-глотковий хід — задній відділ, пазухи сюди не відкриваються."]}, {"n": "6.23", "q": "Жінка 46 років потрапила в нейрохірургічне відділення з внутрішньочерепною пухлиною. Додаткове обстеження хворої показало, що пухлина зруйнувала кістки, що утворюють верхню стінку очної ямки. Які кістки ушкоджені пухлиною?", "o": ["Клиноподібна кістка, піднебінна кістка.", "Очноямкова пластинка решітчастої кістки, луска лобової кістки.", "Очноямкова частина лобової кістки, велике крило клиноподібної кістки.", "Очноямкова частина лобової кістки, мале крило клиноподібної кістки.", "Очноямкова пластинка решітчастої кістки, очноямкова частина лобової кістки."], "a": [3], "e": ["Піднебінна кістка утворює нижню стінку, а не верхню.", "Очноямкова пластинка решітчастої кістки утворює присередню стінку; луска лобової кістки — склепіння.", "Велике крило клиноподібної кістки утворює бічну стінку.", "Верхню стінку утворюють очноямкова частина лобової кістки та мале крило клиноподібної кістки.", "Очноямкова пластинка решітчастої кістки утворює присередню стінку, а не верхню."]}, {"n": "6.24", "q": "Чоловіка 45 років госпіталізовано для корекції викривлення носової перегородки. Які кістки підлягають корекції в даному випадку?", "o": ["Носова кістка, вертикальна пластинка піднебінної кістки.", "Перпендикулярна пластинка решітчастої кістки, леміш.", "Перпендикулярна пластинка піднебінної кістки, леміш.", "Носова кістка, леміш.", "Горизонтальна пластинка піднебінної кістки, нижня носова раковина."], "a": [1], "e": ["Носова кістка утворює спинку носа, піднебінна кістка — бічну стінку і дно.", "Кісткову носову перегородку утворюють перпендикулярна пластинка решітчастої кістки та леміш.", "Перпендикулярна пластинка піднебінної кістки утворює бічну стінку носової порожнини.", "Носова кістка не входить до перегородки.", "Горизонтальна пластинка піднебінної кістки утворює дно, нижня раковина — бічну стінку."]}, {"n": "6.25", "q": "У жінки 48 років діагностовано гострий запальний процес слизової оболонки носо-сльозової протоки. З анамнезу стало відомо, що після перенесеного грипу протягом 10 днів були виділення з носу. З якого відділу носової порожнини інфекція проникла у носо-сльозовий канал?", "o": ["З нижнього носового ходу.", "З середнього носового ходу.", "З верхнього носового ходу.", "З присінку носа.", "З лобової пазухи."], "a": [0], "e": ["Носо-сльозова протока відкривається в нижній носовий хід — звідти інфекція могла піднятися.", "У середній носовий хід відкриваються пазухи, а не носо-сльозова протока.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Присінок носа не сполучається з носо-сльозовою протокою.", "Лобова пазуха відкривається в середній носовий хід."]}, {"n": "6.26", "q": "У хлопчика 10 років, хворого на гайморит, порушено сполучення верхньощелепної пазухи з середнім носовим ходом. Який утвір в нормі забезпечує надходження повітря з носового ходу до гайморової пазухи?", "o": ["Canalis nasolacrimalis.", "Foramina ethmoidalia.", "Infundibulum ethmoidale.", "Hiatus semilunaris.", "Recessus sphenoethmoidalis."], "a": [3], "e": ["Носо-сльозовий канал веде в нижній носовий хід.", "Решітчасті отвори з'єднують очну ямку з черепом.", "Решітчаста лійка — шлях від лобової пазухи.", "Півмісяцевий розтвір (hiatus semilunaris) з'єднує середній носовий хід з верхньощелепною пазухою.", "У клино-решітчастий закуток відкривається клиноподібна пазуха."]}, {"n": "6.27", "q": "Жінка 27 років звернулася до лікаря зі скаргами на головний біль, що виник після перенесеного риніту. Під час обстеження на рентгенограмі лікар виявив затемнення верхньощелепної пазухи. Яким шляхом розповсюдилася інфекція у верхньощелепну пазуху?", "o": ["Через решітчасту лійку.", "Через нижній носовий хід.", "Через верхньощелепний розтвір.", "Через задні решітчасті комірки.", "Через передні решітчасті комірки."], "a": [2], "e": ["Через решітчасту лійку відкривається лобова пазуха.", "У нижній носовий хід відкривається носо-сльозова протока.", "Інфекція проникає через верхньощелепний розтвір (hiatus maxillaris), що відкривається в середній носовий хід.", "Задні решітчасті комірки відкриваються у верхній носовий хід.", "Передні решітчасті комірки сполучаються з середнім носовим ходом, але не з пазухою."]}, {"n": "6.28", "q": "У жінки 30 років після травми ока виникло гнійне запалення м'яких тканин очної ямки. Пізніше інфекція поширилася у крило-піднебінну ямку. Через який анатомічний утвір гнійний процес поширився у крило-піднебінну ямку?", "o": ["Через круглий отвір.", "Через нижню очноямкову щілину.", "Через клино-піднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [1], "e": ["Круглий отвір веде з крило-піднебінної ямки в середню черепну ямку.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина веде в середню черепну ямку.", "Вилично-очноямковий отвір веде в канальці виличної кістки."]}, {"n": "6.29", "q": "У жінки 50 років на тлі довготривалого запалення слизової оболонки носової порожнини з'явилися симптоми ураження задніх комірок лабіринту решітчастої кістки. У який з носових ходів, що сполучається з задніми комірками лабіринту, буде потрапляти гній?", "o": ["Середній носовий хід.", "Спільний носовий хід.", "Верхній носовий хід.", "Нижній носовий хід.", "Носо-глотковий хід."], "a": [2], "e": ["У середній носовий хід відкриваються передні та середні решітчасті комірки.", "Спільний носовий хід не має отворів пазух.", "Задні решітчасті комірки відкриваються у верхній носовий хід.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носо-глотковий хід не сполучається з решітчастими комірками."]}, {"n": "6.30", "q": "Жінка 34 років потрапила в нейрохірургічне відділення лікарні з внутрішньочерепною пухлиною. Рентгенологічне обстеження хворої показало, що пухлина зруйнувала задні відділи нижньої стінки очної ямки. Яка кістка ушкоджена пухлиною?", "o": ["Клиноподібна кістка.", "Скронева кістка.", "Піднебінна кістка.", "Решітчаста кістка.", "Верхня щелепа."], "a": [2], "e": ["Клиноподібна кістка не утворює нижньої стінки очної ямки.", "Скронева кістка не бере участі в утворенні очної ямки.", "Задні відділи нижньої стінки утворює очноямковий відросток піднебінної кістки.", "Решітчаста кістка утворює присередню стінку.", "Верхня щелепа утворює передню й середню частини нижньої стінки."]}], "models": [["Сагітальний розріз черепа (носова порожнина)", "sf:5e73a548332742c8bc722d5f14ae35f0"], ["Череп з підписами", "o3d:overview-skull"]]}, {"id": "topic7", "title": "7. Очна ямка, кісткова носова порожнина, кісткове піднебіння (КРОК-1)", "questions": [{"n": "7.1", "q": "Під час обстеження жінки, 26 років, лікар діагностував запалення в верхньощелепній пазусі (sinus maxillaris). При цьому в одному з носових ходів був виявлений гній, що затікав з верхньощелепної пазухи. В який носовий хід відкривається вічко sinus maxillaris?", "o": ["Meatus nasi medius.", "Meatus nasi superior.", "Meatus nasi communis.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [0], "e": ["Верхньощелепна пазуха відкривається півмісяцевим розтвором у середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід — щілина біля перегородки, пазухи в нього не відкриваються.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід з'єднує носову порожнину з глоткою."]}, {"n": "7.2", "q": "У чоловіка з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми запалення лобової пазухи (фронтит). Через який утвір кісткової носової порожнини стало можливим розповсюдження інфекції в цю пазуху?", "o": ["Клино-решітчастий закуток.", "Клино-піднебінний отвір", "Півмісяцевий розтвір.", "Решітчасті комірки.", "Решітчасту лійку."], "a": [4], "e": ["У клино-решітчастий закуток відкривається клиноподібна пазуха.", "Клино-піднебінний отвір веде до крило-піднебінної ямки.", "Півмісяцевий розтвір — щілина, куди відкривається верхньощелепна пазуха; лобова — через лійку.", "Решітчасті комірки — окремі повітроносні порожнини.", "Лобова пазуха відкривається через решітчасту лійку в середній носовий хід."]}, {"n": "7.3", "q": "У жінки після травми ока виникло гнійне запалення м'яких тканин очної ямки, яке пізніше поширилось у підскроневу ямку. Через який анатомічний утвір гнійний процес поширився у цю ямку?", "o": ["Через нижню очноямкову щілину.", "Через круглий отвір.", "Через клинопіднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [0], "e": ["Нижня очноямкова щілина з'єднує очну ямку з підскроневою і крило-піднебінною ямками.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою, а не очну ямку.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Вилично-очноямковий отвір веде у канал виличної кістки, а не в підскроневу ямку."]}, {"n": "7.4", "q": "Жінка госпіталізована в нейрохірургічне відділення з внутрішньочерепною пухлиною. Додаткове обстеження хворої показало, що пухлина зруйнувала передню половину верхньої стінки очної ямки. Яка кістка ушкоджена пухлиною?", "o": ["Клиноподібна кістка.", "Скронева кістка.", "Лобова кістка.", "Решітчаста кістка.", "Носова кістка."], "a": [2], "e": ["Клиноподібна кістка (мале крило) утворює задню частину верхньої стінки.", "Скронева кістка не бере участі в утворенні очної ямки.", "Передню (більшу) частину верхньої стінки очної ямки утворює очноямкова частина лобової кістки.", "Решітчаста кістка утворює присередню стінку.", "Носова кістка не бере участі в утворенні очної ямки."]}, {"n": "7.5", "q": "У чоловіка після травми ока виникло гнійне запалення м'яких тканин очної ямки. Пізніше інфекція поширилась у крило-піднебінну ямку. Через який анатомічний утвір гнійний процес поширився у цю ямку?", "o": ["Через круглий отвір.", "Через нижню очноямкову щілину.", "Через клино-піднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [1], "e": ["Круглий отвір веде з крило-піднебінної ямки в середню черепну ямку, а не в очну ямку.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина веде в середню черепну ямку.", "Вилично-очноямковий отвір веде у вилично-лицевий і вилично-скроневий канальці."]}, {"n": "7.6", "q": "Лікар, обстежуючи носову порожнину жінки, виявив звуження одного з носових ходів доброякісною пухлиною в ділянці проєкції canalis incisivus. Який носовий хід звужений в даному випадку?", "o": ["Meatus nasi communis.", "Meatus nasi superior", "Meatus nasi interior.", "Meatus nasi medius.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — щілина біля перегородки.", "Верхній носовий хід розташований високо, біля решітчастої кістки.", "Носовий отвір різцевого каналу відкривається на дні носової порожнини в ділянці нижнього носового ходу.", "Середній носовий хід — під середньою раковиною, туди відкриваються пазухи.", "Носоглотковий хід — задній відділ."]}, {"n": "7.7", "q": "Хірург виявив у чоловіка, 52 років, гнійне запалення шкіри в підочноямковій ділянці. Лікар прогнозує можливість поширення запалення в очну ямку. Через який анатомічний утвір можливо поширення інфекції в даному випадку?", "o": ["Canalis incisivus.", "Canalis pterygoideus.", "Canalis nasolacrimalis.", "Canalis infraorbitalis.", "Fissura orbitalis inferior."], "a": [3], "e": ["Різцевий канал з'єднує носову порожнину з ротовою.", "Крилоподібний канал з'єднує ділянку рваного отвору з крило-піднебінною ямкою.", "Носо-сльозовий канал з'єднує очну ямку з нижнім носовим ходом.", "Підочноямковий канал відкривається підочноямковим отвором на обличчі й веде до очної ямки — шлях інфекції з підочноямкової ділянки.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною та підскроневою ямками, а не з обличчям."]}, {"n": "7.8", "q": "У чоловіка з абсцесом в ділянці підскроневої ямки з'явилось ускладнення у вигляді запалення тканин, що оточують очне яблуко. Через яке сполучення підскроневої ямки з очною ямкою поширилось запалення?", "o": ["Canalis palatinus majus.", "Fissura orbitalis superior.", "Foramen sphenopalatinum.", "Fissura orbitalis inferior.", "Canalis pterygoideus."], "a": [3], "e": ["Великий піднебінний канал з'єднує крило-піднебінну ямку з ротовою порожниною.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Нижня очноямкова щілина з'єднує очну ямку з підскроневою ямкою.", "Крилоподібний канал з'єднує ділянку рваного отвору з крило-піднебінною ямкою."]}, {"n": "7.9", "q": "У жінки з запаленням клиноподібної пазухи лікар спостерігає відтік мутної рідини з отвору цієї пазухи. В яку частину порожнини носа спочатку потрапляє рідина з клиноподібної пазухи?", "o": ["Meatus nasi inferior.", "Infundibulum.", "Meatus nasi medius.", "Recessus sphenoethmoidalis.", "Meatus nasi communis."], "a": [3], "e": ["У нижній носовий хід відкривається носо-сльозова протока.", "У решітчасту лійку відкривається лобова пазуха.", "У середній носовий хід відкриваються верхньощелепна, лобова пазухи та передні й середні решітчасті комірки.", "Клиноподібна пазуха відкривається в клино-решітчастий закуток над верхньою носовою раковиною.", "Загальний носовий хід не має отворів пазух."]}, {"n": "7.10", "q": "У чоловіка рентгенологічно виявлено скупчення гною у верхньощелепній пазусі справа. В який з носових ходів спочатку буде прямувати гній?", "o": ["У правий нижній носовий.", "У правий середній носовий.", "У правий верхній носовий.", "У правий загальний носовий.", "У правий носоглотковий."], "a": [1], "e": ["У нижній носовий хід відкривається носо-сльозова протока.", "Верхньощелепна пазуха відкривається в середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід не має отворів пазух.", "Носоглотковий хід веде в глотку."]}, {"n": "7.11", "q": "Після пластичної операції на піднебінні у чоловіка виникло ускладнення у вигляді запалення кістки в ділянці розташування малих піднебінних отворів (foramina palatina minora). Яка кістка уражена запаленням?", "o": ["Верхня щелепа (maxilla).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Клиноподібна кістка (os sphenoidale).", "Піднебінна кістка (os palatinum)."], "a": [4], "e": ["Верхня щелепа утворює передні 2/3 піднебіння, без малих піднебінних отворів.", "Решітчаста кістка не бере участі в утворенні піднебіння.", "Лобова кістка не бере участі в утворенні піднебіння.", "Клиноподібна кістка не має піднебінних отворів.", "Малі піднебінні отвори розташовані на пірамідному відростку піднебінної кістки."]}, {"n": "7.12", "q": "З місця спортивних змагань у лікарню доставлено спортсмена з травмою обличчя. Лікар встановив перелом кістки лицевого черепа. Лінія перелому проходить через підочноямковий край (margo infraorbitalis). Яка кістка травмована?", "o": ["Сльозова кістка (os lacrimale).", "Верхня щелепа (maxilla).", "Носова кістка (os nasale).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Сльозова кістка розташована на присередній стінці очної ямки.", "Підочноямковий край утворений верхньою щелепою (разом з виличною кісткою).", "Носова кістка утворює спинку носа.", "Нижня щелепа не утворює країв очної ямки.", "Піднебінна кістка — глибоко в черепі."]}, {"n": "7.13", "q": "У хірургічне відділення госпіталізовано чоловіка з черепно-мозковою травмою. Лікар приймального відділення встановив ушкодження кістки черепа, яка приймає участь в утворенні бічної та нижньої стінок правої очної ямки. Яка кістка ушкоджена в цьому випадку?", "o": ["Права лобова кістка.", "Права вилична кістка.", "Права клиноподібна кістка.", "Права решітчаста кістка.", "Права верхня щелепа."], "a": [1], "e": ["Лобова кістка утворює верхню стінку очної ямки.", "Вилична кістка бере участь в утворенні і бічної, і нижньої стінок очної ямки.", "Клиноподібна кістка утворює бічну стінку ззаду, але не нижню.", "Решітчаста кістка утворює присередню стінку.", "Верхня щелепа утворює нижню стінку, але не бічну."]}, {"n": "7.14", "q": "У жінки при гнійному запаленні носової порожнини це запалення поширилось у передню черепну ямку. Через який анатомічний утвір розповсюдилось запалення?", "o": ["Foramina cribrosa.", "Foramen ovale.", "Foramen ethmoidale posterius.", "Foramen sphenopalatinum.", "Foramen rotundum."], "a": [0], "e": ["Отвори дірчастої пластинки (foramina cribrosa) з'єднують носову порожнину з передньою черепною ямкою.", "Овальний отвір з'єднує середню черепну ямку з підскроневою ямкою.", "Задній решітчастий отвір з'єднує очну ямку з порожниною черепа.", "Клино-піднебінний отвір з'єднує носову порожнину з крило-піднебінною ямкою.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою."]}, {"n": "7.15", "q": "Обстежуючи чоловіка, 30 років, офтальмолог виявив у нього порушення відпливу сльози в нижній носовий хід. Через яке сполучення очної ямки з нижнім носовим ходом в даному випадку ускладнено проходження сльози?", "o": ["Носо-сльозовий канал.", "Передній решітчастий отвір.", "Верхню очноямкову щілину.", "Нижню очноямкову щілину.", "Задній решітчастий отвір."], "a": [0], "e": ["Носо-сльозовий канал з'єднує очну ямку з нижнім носовим ходом, через нього відтікає сльоза.", "Передній решітчастий отвір з'єднує очну ямку з передньою черепною ямкою.", "Верхня очноямкова щілина з'єднує очну ямку з середньою черепною ямкою.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною та підскроневою ямками.", "Задній решітчастий отвір веде до задніх решітчастих комірок."]}, {"n": "7.16", "q": "У жінки з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми ураження клиноподібної пазухи. Через який утвір стало можливим розповсюдження інфекції з носової порожнини в цю пазуху?", "o": ["Півмісяцевий розтвір.", "Клино-піднебінний отвір", "Овальний отвір.", "Отвір клиноподібної пазухи.", "Круглий отвір."], "a": [3], "e": ["Через півмісяцевий розтвір сполучаються верхньощелепна пазуха та середній носовий хід.", "Клино-піднебінний отвір веде в крило-піднебінну ямку.", "Овальний отвір розташований у великому крилі й веде в підскроневу ямку.", "Клиноподібна пазуха відкривається власним отвором (apertura sinus sphenoidalis) у клино-решітчастий закуток.", "Круглий отвір пропускає верхньощелепний нерв."]}, {"n": "7.17", "q": "Хірург, оперуючи жінку з пухлиною твердого піднебіння (palatum durum), видалив разом з пухлиною і третину тої частини верхньої щелепи (maxilla), що бере участь в утворенні кісткового піднебіння (palatum osseum). Третину якої частини верхньої щелепи видалив хірург?", "o": ["Тіла верхньої щелепи (corpus maxillae).", "Лобового відростка (processus frontalis).", "Виличного відростка (processus zygomaticus).", "Піднебінного відростка (processus palatinus).", "Коміркового відростка (processus alveolaris)."], "a": [3], "e": ["Тіло верхньої щелепи містить пазуху, але піднебіння не утворює.", "Лобовий відросток іде догори.", "Виличний відросток з'єднується з виличною кісткою.", "Піднебінний відросток утворює передні 2/3 кісткового піднебіння.", "Комірковий відросток містить зуби, а не утворює піднебіння."]}, {"n": "7.18", "q": "У жінки з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми запалення верхньощелепної пазухи (гайморит). Через який утвір носової порожнини стало можливим розповсюдження інфекції в цю пазуху?", "o": ["Клино-піднебінний отвір.", "Решітчасті комірки.", "Півмісяцевий розтвір.", "Решітчасту лійку.", "Клино-решітчастий закуток."], "a": [2], "e": ["Клино-піднебінний отвір веде в крило-піднебінну ямку.", "Решітчасті комірки — окремі пазухи решітчастої кістки.", "Верхньощелепна пазуха відкривається через півмісяцевий розтвір у середній носовий хід.", "Через решітчасту лійку відкривається лобова пазуха.", "У клино-решітчасти
