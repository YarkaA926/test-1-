них краях.", "Між згиначами зап’ястка лежать кілька борозен, ліктьова обмежена поверхневим згиначем."]}, {"n": "18.27", "q": "Чоловік 38 років упав на лікоть, внаслідок чого ушкодив променеву обхідну артерію і променеву поворотну артерію, які анастомозують між собою в зідній бічній ліктьовій борозні. Чим обмежена ця борозна?", "o": ["Musculus brachioradialis, olecranon.", "Musculus brachialis, musculus brachioradialis.", "Olecranon, epicondilus lateralis ossis humeri.", "Olecranon, epicondilus medialis ossis humeri.", "Epicondilus medialis ossis humeri, musculus brachialis."], "a": [2], "e": ["Плечо-променевий м’яз не є межею задньої бічної борозни.", "Плечовий і плечо-променевий м’язи обмежують передню бічну борозну.", "Задня бічна ліктьова борозна лежить між ліктьовим відростком і бічним надвиростком плечової кістки.", "Ліктьовий відросток і присередній надвиросток обмежують задню присередню борозну.", "Присередній надвиросток і плечовий м’яз — орієнтири присередньої ділянки."]}, {"n": "18.28", "q": "Після травми задньої зап'ясткової ділянки кисті у чоловіка 44 років виникло ускладнення – запалення синовіальної піхви м'язів-розгиначів пальців та розгинача вказівного пальця. У якому каналі тримача м'язів-розгиначів проходять сухожилки м'язів-розгиначів пальців та сухожилок розгинача вказівного пальця?", "o": ["1.", "2.", "3.", "4.", "5."], "a": [3], "e": ["У 1-му каналі — довгий відвідний і короткий розгинач великого пальця.", "У 2-му каналі — довгий і короткий променеві розгиначі зап’ястка.", "У 3-му каналі — довгий розгинач великого пальця.", "У 4-му каналі проходять розгинач пальців і розгинач вказівного пальця.", "У 5-му каналі — розгинач мізинця."]}, {"n": "18.29", "q": "Після травматичногo ушкодження м’яких тканин плеча у чоловіка 34 років виникла артеріальна кровотеча. Для її тимчасової зупинки застосоване пальцеве притиснення плечової артерії (аrteria brachialis) в ділянці sulcus bicipitalis medialis. Чим обмежена ця борозна?", "o": ["Musculus triceps brachii, musculus coracobrachialis.", "Присередніми краєм musculus biceps brachii, musculus brachialis.", "Musculus biceps brachii, musculus coracobrachialis.", "Musculus brachioradialis, musculus biceps brachii, os humeri, musculus brachialis.", "Musculus coracobrachialis, musculus brachialis."], "a": [1], "e": ["Триголовий м’яз лежить позаду, присередню двоголову борозну не обмежує.", "Присередня двоголова борозна лежить між присереднім краєм двоголового м’яза і плечовим м’язом; тут плечова артерія.", "Дзьобо-плечовий м’яз обмежує борозну лише у верхній частині.", "Плечо-променевий м’яз лежить на передпліччі.", "Без двоголового м’яза борозна не утворюється."]}, {"n": "18.30", "q": "Після ушкодження м’яких тканин плеча у чоловіка виникла венозна кровотеча з головної вени та ушкоджені гілки променевого нерва, які розташовані у бічній двоголовій борозні плеча. Для тимчасової зупинки кровотечі застосовано пальцеве притиснення vena cephalica в ділянці sulcus bicipitalis lateralis. Які утвори обмежують цю борозну?", "o": ["Musculus brachialis, musculus triceps brachii.", "Бічний край musculus biceps brachii, musculus brachialis.", "Musculus biceps brachii, musculus coracobrachialis.", "Musculus brachioradialis, musculus biceps brachii, os humeri, musculus brachialis.", "Musculus coracobrachialis, musculus brachialis."], "a": [1], "e": ["Триголовий м’яз лежить позаду і бічної двоголової борозни не обмежує.", "Бічна двоголова борозна лежить між бічним краєм двоголового і плечовим м’язами; тут головна вена.", "Дзьобо-плечовий м’яз лежить медіально.", "Плечо-променевий м’яз лежить на передпліччі.", "Дзьобо-плечовий м’яз лежить медіально, до бічної борозни не належить."]}], "models": [["Кисть і зап'ясток", "o3d:hand", {"ru": "Кисть и запястье", "en": "Hand and wrist"}], ["М'язи передпліччя (передня група)", "o3d:upper-limb-forearm-anterior-compartment-muscles", {"ru": "Мышцы предплечья (передняя группа)", "en": "Forearm muscles (anterior group)"}], ["Верхня кінцівка", "o3d:upper-limb", {"ru": "Верхняя конечность", "en": "Upper limb"}]]}, {"id": "topic20", "title": "20. М’язи стопи. Фасції нижньої кінцівки і топографія нижньої кінцівки", "tr": {"ru": "20. Мышцы стопы. Фасции и топография нижней конечности", "en": "20. Foot muscles. Fasciae and topography of the lower limb"}, "questions": [{"n": "20.1", "q": "У жінки 45 років виявлено стегнову килу. Який утвір на передній стегновій ділянці є зовнішнім отвором стегнового капалу?", "o": ["Anulus femoralis.", "Lacuna vasorum.", "Lacuna musculorum.", "Hiatus saphenus.", "Anulus inguinalis superficialis."], "a": [3], "e": ["Стегнове кільце — внутрішній, а не зовнішній отвір стегнового каналу.", "Судинна затока — простір під пахвинною зв’язкою, у ній лежить стегнове кільце.", "М’язова затока містить клубово-поперековий м’яз і стегновий нерв.", "Зовнішнім отвором стегнового каналу є підшкірний розтвір (hiatus saphenus) широкої фасції.", "Поверхневе пахвинне кільце — отвір пахвинного каналу, а не стегнового."]}, {"n": "20.2", "q": "Жінці 40 років необхідно провести диференційну діагностику між стегновою килою і запаленням глибокого пахвинного лімфатичного вузла, що закриває стегнове кільце. У якому топографічному просторі на стегні міститься стегнове кільце?", "o": ["У стегновому трикутнику.", "У м’язовій затоці.", "У судинній затоці.", "У привідному каналі.", "У підколінній ямці."], "a": [2], "e": ["Стегновий трикутник лежить нижче, на стегні.", "М’язова затока містить клубово-поперековий м’яз і стегновий нерв.", "Стегнове кільце — присередня частина судинної затоки, медіальніше стегнової вени.", "Привідний канал лежить у середній третині стегна.", "Підколінна ямка лежить позаду коліна."]}, {"n": "20.3", "q": "У чоловіка 45 років під час ДТП травмована нижня кінцівка. У лікарні під час огляду хворого виявлені чисельні рвані рани на гомілки та стопи. На МРТ візуалізовано ушкодження волокон м’язів гомілки та відрив їх сухожилків від підошвової поверхні присередньої клиноподібної кістки. Функція яких м’язів порушена?", "o": ["Musculus extensor hallucis longus, musculus tibialis posterior, musculus fibularis drevis.", "Musculus tibialis anterior, musculus fibularis longus, musculus tibialis posterior.", "Musculus fibularis longus, musculus tibialis posterior, musculus flexor hallucis longus.", "Musculus fibularis longus, musculus tibialis posterior, musculus extensor hallucis longus.", "Musculus fibularis longus, musculus tibialis posterior, musculus fibularis drevis."], "a": [1], "e": ["Довгий розгинач великого пальця прикріплюється до дистальної фаланги I пальця, а не до клиноподібної кістки.", "До підошвової поверхні присередньої клиноподібної кістки прикріплюються передній великогомілковий, довгий малогомілковий і задній великогомілковий м’язи.", "Довгий згинач великого пальця прикріплюється до дистальної фаланги I пальця.", "Довгий розгинач великого пальця до клиноподібної кістки не прикріплюється.", "Короткий малогомілковий м’яз прикріплюється до горбистості V плеснової кістки."]}, {"n": "20.4", "q": "Жінку 45 років прооперовано з приводу стегнової кили. Під час оперативного втручання хірург ушив внутрішній отвір стегнового каналу – стегнове кільце. Чим обмежене стегнове кільце?", "o": ["Musculus iliopsoas, ligamentum pectineale, os pubis.", "Ligamentum inguinale, ligamentum pectineale, ligamentum lacunare, vena femoralis.", "Ligamentum inguinale, os pubis, arteria femoralis.", "Ligamentum lacunare, arteria femoralis, musculus iliopsoas.", "Ligamentum inguinale, os pubis, ligamentum lacunare."], "a": [1], "e": ["Клубово-поперековий м’яз лежить у м’язовій затоці, стегнового кільця не обмежує.", "Стегнове кільце: спереду пахвинна зв’язка, ззаду гребінна зв’язка, медіально затокова зв’язка, латерально стегнова вена.", "Стегнова артерія не прилягає до стегнового кільця, між ними вена.", "Артерія і клубово-поперековий м’яз не обмежують кільце.", "Немає латеральної межі — стегнової вени; лобкова кістка вкрита гребінною зв’язкою."]}, {"n": "20.5", "q": "У чоловіка виявлені ознаки тромбозу вен нижньої кінцівки. Лікарю необхідно провести хірургічну маніпуляцію на стегновій вені у ділянці судинної затоки. Чим обмежена судинна затока?", "o": ["Musculus pectineus, os pubis, arteria femoralis.", "Ligamentum inguinale, ligamentum lacunare, os pubis, arcus iliopectineus.", "Ligamentum inguinale, os ilium, musculus sartorius.", "Arcus iliopectineus, os ilium, vena femoralis.", "Musculus iliopsoas, ligamentum inguinale, os pubis."], "a": [1], "e": ["Гребінний м’яз і стегнова артерія не є межами затоки.", "Судинна затока: спереду пахвинна зв’язка, медіально затокова зв’язка, ззаду лобкова кістка (гребінь), латерально клубово-гребінна дуга.", "Клубова кістка і кравецький м’яз обмежують м’язову затоку.", "Стегнова вена лежить усередині затоки, а не обмежує її.", "Клубово-поперековий м’яз лежить у м’язовій затоці."]}, {"n": "20.6", "q": "Внаслідок аварії у чоловіка 34 років з’явився сильний біль і набряк в передній гомілковій ділянці та на тилі стопи. У хворого обмежене відвертання стопи, тильне згинання стопи неможливе. На МРТ лікар виявив ушкодження волокон нижнього тримача м’язів-розгиначів та розрив піхви сухожилка м’яза, що проходить у присередньому кістково-волокнистому каналі. Функція якого з м’язів гомілки вірогідно постраждала?", "o": ["Musculus flexor digitorum longus.", "Musculus tibialis anterior.", "Musculus flexor hallucis longus.", "Musculus fibularis longus.", "Musculus fibularis brevis."], "a": [1], "e": ["Довгий згинач пальців проходить позаду присередньої кісточки.", "Передній великогомілковий м’яз проходить у присередньому каналі під нижнім тримачем розгиначів; згинає стопу тильно і відвертає її.", "Довгий згинач великого пальця проходить позаду присередньої кісточки.", "Довгий малогомілковий м’яз проходить позаду бічної кісточки.", "Короткий малогомілковий м’яз проходить позаду бічної кісточки."]}, {"n": "20.7", "q": "Чоловік 25 років отримав під час бійки ножове поранення на передній стегновій ділянці. Лікар зупинив венозну кровотечу з підшкірної вени в межах стегнового трикутника. Який м’яз, окрім кравецького м’яза утворює межі стегнового трикутника?", "o": ["M. adductor longus.", "M. gracilis.", "M. adductor brevis.", "M. quadriceps femoris.", "M. semitendinosus."], "a": [0], "e": ["Стегновий трикутник обмежений пахвинною зв’язкою, кравецьким і довгим привідним м’язами.", "Тонкий м’яз лежить медіальніше і межею трикутника не є.", "Короткий привідний м’яз лежить глибше довгого.", "Чотириголовий м’яз утворює частину дна, але не межу.", "Півсухожилковий м’яз лежить на задній поверхні стегна."]}, {"n": "20.8", "q": "У жінки 40 років виявлено вип’ячування в ділянці стегнового трикутника. Обстеження хворої виявило, що стегнова кила утворила стегновий канал і вийшла через підшкірний розтвір (зовнішній отвір стегнового каналу) під шкіру стегна. Чим обмежений підшкірний розтвір?", "o": ["Серпоподібний край широкої фасції стегна та його нижній ріг, пахвинна зв’язка.", "Серпоподібний край широкої фасції стегна та його верхній ріг, m. gracilis.", "Серпоподібний край широкої фасції стегна, пахвинна зв’язка, m. sartorius.", "Серпоподібний край широкої фасції стегна та його верхній ріг, пахвинна зв’язка.", "Серпоподібний край широкої фасції стегна та його верхній ріг та нижній ріг."], "a": [4], "e": ["Пахвинна зв’язка не є межею підшкірного розтвору.", "Тонкий м’яз до розтвору не прилягає.", "Кравецький м’яз і пахвинна зв’язка не обмежують розтвір.", "Нижній ріг теж обмежує розтвір, пахвинна зв’язка — ні.", "Підшкірний розтвір обмежений серпоподібним краєм широкої фасції з верхнім і нижнім рогами."]}, {"n": "20.9", "q": "У чоловіка 50 років внаслідок виробничої травми передньої стегнової ділянки уражений стегновий нерв, який проходить в м’язовій затоці. Чим обмежена м’язова затока?", "o": ["Ligamentum inquinale, ligamentum lacunare, os pubis.", "Ligamentum inquinale, ligamentum lacunare, ligamentum pectineale.", "Ligamentum inquinale, os ilium, arcus ileopectineus.", "Ligamentum inquinale, os ilium, ligamentum pectineale.", "Ligamentum inquinale, arcus ileopectineus, os pubis."], "a": [2], "e": ["Ці утвори обмежують судинну затоку.", "Затокова і гребінна зв’язки належать до стегнового кільця.", "М’язова затока: спереду пахвинна зв’язка, ззаду і латерально клубова кістка, медіально клубово-гребінна дуга.", "Гребінна зв’язка — межа стегнового кільця.", "Лобкова кістка належить до судинної затоки."]}, {"n": "20.10", "q": "Під час виконання фізичних вправ у 15-річного учня раптово виник біль у кульшовому суглобі при відвертанні та відведенні нижньої кінцівки. Травматолог виявив ушкодження musculus piriformis, сухожилок якого виходить із порожнини малого таза через великий сідничий отвір. Чим обмежений великий сідничий отвір?", "o": ["Крижово-остьовою зв'язкою і крижово-горбовою зв'язкою.", "Крижово-остьовою зв'язкою і великою сідничою вирізкою.", "Крижово-остьовою зв'язкою і малою сідничою вирізкою.", "Крижово-остьовою зв'язкою і затульною перетинкою.", "Крижово-остьовою зв'язкою і клубово-поперковою зв'язкою."], "a": [1], "e": ["Крижово-горбова зв’язка обмежує малий сідничий отвір, а не великий.", "Великий сідничий отвір утворений великою сідничою вирізкою і крижово-остьовою зв’язкою.", "Мала сіднича вирізка обмежує малий сідничий отвір.", "Затульна перетинка закриває затульний отвір.", "Клубово-поперекова зв’язка не обмежує сідничий отвір."]}, {"n": "20.11", "q": "Під час автомобільної аварії у хлопчика 10 років травмовані кістки тазового пояса, виникла значна кровотеча. Під час обстеження лікар виявив перелом тіла клубової та гілок лобкової кісток. При обробці рани в судинній затоці зупинена кровотеча із стегнової артерії. Який утвір обмежує судинну затоку присередньо?", "o": ["Ligamentum inquinale.", "Ligamentum pectineale.", "Ligamentum lacunare.", "Аrcus ileopectineus.", "Vena femoralis."], "a": [2], "e": ["Пахвинна зв’язка обмежує затоку спереду.", "Гребінна зв’язка лежить ззаду (у стегнового кільця).", "Присередньою межею судинної затоки є затокова зв’язка.", "Клубово-гребінна дуга — латеральна межа судинної затоки.", "Стегнова вена лежить усередині затоки."]}, {"n": "20.12", "q": "Під час автомобільної аварії у чоловіка 42 років візуалізується глибока розсічена рана на передній стегновій ділянці, спостерігається значна артеріальна кровотеча, ушкоджені м’язи присередньої групи стегна. Лікар терміново наклав судинний затискач на стегнову артерію в межах привідного каналу. Чим обмежений привідний канал Гунтера?", "o": ["M. adductor magnus, vastus medialis, septum intermusculare vastoadductorium femoris.", "M. adductor longus, vastus medialis, septum intermusculare vastoadductorium femoris.", "M. adductor brevis, vastus medialis, septum intermusculare vastoadductorium femoris.", "M. adductor magnus, vastus lateralis, septum intermusculare vastoadductorium femoris.", "M. gracilis, vastus medialis, septum intermusculare vastoadductorium femoris."], "a": [0], "e": ["Привідний канал: медіально великий привідний м’яз, латерально присередній широкий м’яз, спереду широко-привідна перетинка.", "Довгий привідний м’яз лише частково обмежує вхід, основна стінка — великий привідний.", "Короткий привідний м’яз лежить вище і глибше.", "Бічний широкий м’яз лежить латерально на стегні.", "Тонкий м’яз каналу не обмежує."]}, {"n": "20.13", "q": "Хірург, виконуючи ревізію глибокої різаної рани на бічній закісточковій ділянці, виявив у чоловіка 45 років розрив волокон тримача м'язів, що розташований між бічною кісточкою та п'ятковою кісткою. Внаслідок травми ушкоджені синовіальні піхви сухожилків м'язів, що лежать в кістково-волокнистому каналі під цим тримачем. Тримач яких м'язів ушкоджений?", "o": ["Тримач м'язів-згиначів.", "Верхній тримач м'язів-розгиначів.", "Нижній тримач м'язів-розгиначів.", "Верхній тримач малогомілкових м'язів.", "Нижній тримач малогомілкових м'язів."], "a": [3], "e": ["Тримач згиначів лежить з присереднього боку, між присередньою кісточкою і п’ятковою кісткою.", "Верхній тримач розгиначів лежить на передній поверхні гомілки.", "Нижній тримач розгиначів лежить на тилі стопи.", "Верхній тримач малогомілкових м’язів натягнутий між бічною кісточкою і п’ятковою кісткою над сухожилками малогомілкових м’язів.", "Нижній тримач малогомілкових м’язів лежить нижче, на бічній поверхні п’яткової кістки."]}, {"n": "20.14", "q": "Внаслідок аварії у чоловіка 34 років з’явився сильний біль і набряк в передній гомілковій ділянці та на тилі стопи. У хворого обмежене тильне згинання стопи. На МРТ лікар виявив ушкодження волокон нижнього тримача м’язів-розгиначів та розрив піхви сухожилка м’яза, що проходить у бічному кістково-волокнистому каналі. Піхва якого м’яза гомілки вірогідно постраждала?", "o": ["Vagina tendinum m. extensoris digitorum longi.", "Vagina tendinum m. tibialis anterior.", "Vagina tendinum m. extensoris hallucis longi.", "Vagina tendinum m. flexoris hallucis longi.", "Vagina tendinum m. flexoris digitorum longi."], "a": [0], "e": ["У бічному каналі під нижнім тримачем розгиначів проходить довгий розгинач пальців.", "Передній великогомілковий м’яз проходить у присередньому каналі.", "Довгий розгинач великого пальця проходить у середньому каналі.", "Довгий згинач великого пальця лежить позаду присередньої кісточки.", "Довгий згинач пальців лежить позаду присередньої кісточки."]}, {"n": "20.15", "q": "До приймального відділення лікарні доставлено чоловіка 34 років з множинними різаними ранами в нижній третині передньої стегнової та колінної ділянках, сильною кровотечею. Лікар терміново наклав судинний затискач на стегнову артерію в місці її виходу в підколінну ямку через привідний розтвір. Між сухожилками якого м’яза та стегновою кісткою розташований привідний розтвір?", "o": ["Між сухожилками m. adductor magnus.", "Між сухожилками m. sartorius.", "Між сухожилками m. adductor longus.", "Між сухожилками m. gracilis, m. sartorius.", "Між сухожилками m. vastus lateralis."], "a": [0], "e": ["Привідний розтвір утворений між сухожилками великого привідного м’яза і стегновою кісткою.", "Кравецький м’яз розтвору не утворює.", "Довгий привідний м’яз прикріплюється вище, розтвору не утворює.", "Тонкий і кравецький м’язи йдуть до гомілки, розтвору не утворюють.", "Бічний широкий м’яз лежить латерально."]}, {"n": "20.16", "q": "У чоловіка 67 років рентгенологічно встановлено перелом великогомілкової кістки. Лікар виявив ушкодження сухожилка м’яза, що проходить відразу позаду і знизу присередньої кісточки в другому каналі під retinaculum musculorum flexorum. Сухожилок якого м’яза уражений?", "o": ["Musculus tibialis posterior.", "Musculus flexor digitorum longus.", "Musculus flexor hallucis longus", "Musculus fibularis longus.", "Musculus fibularis brevis."], "a": [1], "e": ["У першому каналі під тримачем згиначів — задній великогомілковий м’яз.", "У другому каналі проходить сухожилок довгого згинача пальців.", "У третьому каналі — довгий згинач великого пальця.", "Довгий малогомілковий м’яз проходить позаду бічної кісточки.", "Короткий малогомілковий м’яз проходить позаду бічної кісточки."]}, {"n": "20.17", "q": "Під час автомобільної аварії чоловік 40 років отримав перелом великогомілкової кістки у середній третині зі зміщенням уламків. Внаслідок травми виникла сильна кровотеча із задньої великогомілкової артерії, що проходить у canalis cruropopliteus. Чим обмежений цей канал?", "o": ["Musculus flexor hallucis longus, musculus soleus, musculus tibialis anterior.", "Musculus gastrocnemius, musculus soleus, musculus flexor digitorum longus.", "Musculus gastrocnemius, musculus flexor digitorum longus, musculus flexor hallucis longus.", "Musculus soleus, musculus flexor hallucis longus, musculus flexor hallucis brevis.", "Musculus soleus, musculus tibialis posterior, musculus flexor hallucis longus."], "a": [4], "e": ["Передній великогомілковий м’яз лежить у передній групі.", "Литковий м’яз не обмежує канал.", "Литковий м’яз лежить поверхневіше камбалоподібного.", "Короткий згинач великого пальця лежить на стопі.", "Гомілково-підколінний канал: ззаду камбалоподібний, спереду задній великогомілковий, латерально довгий згинач великого пальця."]}, {"n": "20.18", "q": "У приймальне відділення лікарні доставлено чоловіка 34 років із різаною раною нижньої третини гомілки зі сторони малогомілкового краю стопи. Під час обстеження виявлено, що чоловік не може привертати і зігнути стопу. Які м’язи ушкоджені?", "o": ["Musculus fibularis longus, musculus tibialis anterior.", "Musculus fibularis longus, musculus fibularis brevis.", "Musculus tibialis anterior, musculus tibialis posterior.", "Musculus tibialis anterior, musculus flexor hallucis longus.", "Musculus tibialis posterior, musculus flexor hallucis longus."], "a": [1], "e": ["Передній великогомілковий м’яз розгинає стопу.", "Довгий і короткий малогомілкові м’язи лежать з малогомілкового боку, привертають (піднімають бічний край) і згинають стопу.", "Великогомілкові м’язи відвертають стопу.", "Ці м’язи не привертають стопу.", "Ці м’язи не привертають стопу."]}, {"n": "20.19", "q": "До приймального відділення лікарні доставлений чоловік із глибокою різаною раною нижньої третини передньої гомілкової ділянки, внаслідок чого він не може відвертати стопу. Лікар виявив ушкодження волокон тримача м'язів-розгиначів. Який м’яз, що проходить в присередньому кістково-волокнистому каналі під тримачем, ушкоджений?", "o": ["Musculus extensor hallucis longus.", "Musculus extensor digitorum longus.", "Musculus tibialis anterior.", "Musculus tibialis posterior.", "Musculus flexor hallucis longus."], "a": [2], "e": ["Довгий розгинач великого пальця проходить у середньому каналі.", "Довгий розгинач пальців проходить у бічному каналі.", "Передній великогомілковий м’яз проходить у присередньому каналі під тримачем розгиначів і відвертає стопу.", "Задній великогомілковий м’яз лежить позаду присередньої кісточки.", "Довгий згинач великого пальця лежить позаду присередньої кісточки."]}, {"n": "20.20", "q": "При падінні з висоти на гострий предмет чоловік 50 років травмував верхню частину передньої стегнової ділянки під пахвинною зв'язкою. На МРТ виявлений перелом тіла клубової кістки, ушкодження волокон стегнового нерва та м'яза, що розташовані в м’язовій затоці. Який м’яз розташований у м’язовій затоці?", "o": ["Musculus pectineus.", "Musculus sartorius.", "Musculus iliopsoas.", "Musculus vastus medialis.", "Musculus vastus lateralis."], "a": [2], "e": ["Гребінний м’яз лежить у дні стегнового трикутника.", "Кравецький м’яз проходить попереду м’язової затоки.", "У м’язовій затоці проходять клубово-поперековий м’яз і стегновий нерв.", "Присередній широкий м’яз лежить на стегні.", "Бічний широкий м’яз лежить на стегні."]}, {"n": "20.21", "q": "Після падіння з велосипеда юнак отримав травму нижньої кінцівки. Внаслідок травми хворий не може в достатньому обсязі згинати стегно і гомілку, закидати ушкоджену ногу на здорову. Лікар на МРТ-зображенні виявив накопичення серозної рідини в сумці кравецького м’яза та гусячій сумці, що лежить під поверхневою гусячою лапкою. Сухожилки яких м’язів утворюють pes anserinus superficialis?", "o": ["M. sartorius, m. gracilis, m. vastus lateralis.", "M. sartorius, m. gracilis. m. semitendinosus.", "M. sartorius, m. gracilis, m. semimemdranosus.", "M. sartorius, m. gracilis, m. vastus medialis.", "M. sartorius, m. gracilis, m. popliteus."], "a": [1], "e": ["Бічний широкий м’яз не входить до гусячої лапки.", "Поверхнева гусяча лапка утворена сухожилками кравецького, тонкого і півсухожилкового м’язів.", "Півперетинчастий м’яз утворює глибоку гусячу лапку.", "Присередній широкий м’яз не входить до гусячої лапки.", "Підколінний м’яз лежить у підколінній ямці."]}, {"n": "20.22", "q": "Внаслідок травми у жінки 45 років діагностовано перелом сідничої кістки в ділянці сідничого горба та сідничої ості. У хворої обмежене обертання стегна назовні. На МРТ лікар виявив розрив волокон внутрішнього затульного та близнюкових м’язів в межах малого сідничого отвору. Чим обмежений малий сідничий отвір?", "o": ["Великою сідничою вирізкою, m. gemellus superior, m. gemellus inferior.", "Великою сідничою вирізкою, крижово-горбовою зв’язкою, крижово-остьовою зв’язкою.", "Малою сідничою вирізкою, крижово-горбовою зв’язкою, крижово-остьовою зв’язкою.", "Малою сідничою вирізкою, крижово-горбовою зв’язкою, гребінною зв’язкою.", "Малою сідничою вирізкою, крижово-горбовою зв’язкою, затоковою зв’язкою."], "a": [2], "e": ["Велика сіднича вирізка обмежує великий сідничий отвір.", "Велика сіднича вирізка — межа великого отвору.", "Малий сідничий отвір обмежений малою сідничою вирізкою, крижово-горбовою і крижово-остьовою зв’язками.", "Гребінна зв’язка лежить на лобковій кістці.", "Затокова зв’язка лежить біля стегнового кільця."]}, {"n": "20.23", "q": "У чоловіка 34 років рентгенологічно встановлено перелом великогомілкової кістки. Лікар виявив ушкодження піхви сухожилка м’яза, що проходить відразу позаду і знизу присередньої кісточки в першому каналі під retinaculum musculorum flexorum. Сухожилок якого м’яза уражений?", "o": ["Musculus tibialis posterior.", "Musculus flexor digitorum longus.", "Musculus flexor hallucis longus", "Musculus fibularis longus.", "Musculus fibularis brevis."], "a": [0], "e": ["У першому каналі під тримачем згиначів проходить задній великогомілковий м’яз.", "Довгий згинач пальців проходить у другому каналі.", "Довгий згинач великого пальця проходить у третьому каналі.", "Довгий малогомілковий м’яз проходить позаду бічної кісточки.", "Короткий малогомілковий м’яз проходить позаду бічної кісточки."]}, {"n": "20.24", "q": "У чоловіка 67 років рентгенологічно діагностовано перелом великогомілкової кістки. Лікар виявив ушкодження піхви сухожилка м’яза, що проходить позаду присередньої кісточки в третьому каналі під retinaculum musculorum flexorum. Сухожилок якого м’яза уражений?", "o": ["Musculus tibialis posterior.", "Musculus flexor digitorum longus.", "Musculus flexor hallucis longus", "Musculus fibularis longus.", "Musculus fibularis brevis."], "a": [2], "e": ["Задній великогомілковий м’яз проходить у першому каналі.", "Довгий згинач пальців проходить у другому каналі.", "У третьому каналі проходить довгий згинач великого пальця.", "Довгий малогомілковий м’яз проходить позаду бічної кісточки.", "Короткий малогомілковий м’яз проходить позаду бічної кісточки."]}, {"n": "20.25", "q": "При падінні з висоти чоловік отримав перелом великого вертлюга стегнової кістки, внаслідок чого не може відводити стегно. Функція яких м’язів таза порушена?", "o": ["Musculus gluteus maximus, musculus gluteus medius, musculus gluteus minimus.", "Musculus gluteus medius, musculus piriformis, musculus gemellus superior.", "Musculus gluteus minimus, musculus gemellus inferior, musculus piriformis.", "Musculus gluteus medius, musculus gluteus minimus, musculus piriformis.", "Musculus gluteus medius, musculus gluteus minimus, musculus quadratus femoris."], "a": [3], "e": ["Великий сідничий м’яз прикріплюється до сідничої горбистості, а не до великого вертлюга.", "Верхній близнюковий м’яз відвертає стегно.", "Нижній близнюковий м’яз відвертає стегно.", "Середній і малий сідничі та грушоподібний м’язи прикріплюються до великого вертлюга і відводять стегно.", "Квадратний м’яз стегна прикріплюється до міжвертлюгового гребеня і відвертає стегно."]}, {"n": "20.26", "q": "У чоловіка 40 років внаслідок ножового поранення передньої стегнової ділянки уражений стегновий нерв, який проходить в м’язовій затоці. Чим обмежена м’язова затока присередньо?", "o": ["Оs pubis.", "Ligamentum lacunare.", "Аrcus ileopectineus.", "Ligamentum pectineale.", "Ligamentum inquinale."], "a": [2], "e": ["Лобкова кістка обмежує судинну затоку.", "Затокова зв’язка — присередня межа судинної затоки.", "Присередньо м’язова затока обмежена клубово-гребінною дугою.", "Гребінна зв’язка — межа стегнового кільця.", "Пахвинна зв’язка обмежує затоку спереду."]}, {"n": "20.27", "q": "Під час фінальної гри баскетболіст ушкодив праву гомілку, внаслідок чого стало неможливим згинати праву стопу в надп'ятково-гомілковому суглобі. Лікар команди встановив, що ушкоджено сухожилок м'яза, який прикріплюється до tuber calcanei. Сухожилок якого м’яза ушкоджено?", "o": ["Musculus triceps surae.", "Musculus extensoris hallucis longi.", "Musculus tibialis anterioris.", "Musculus biceps femoris.", "Musculus sartorii."], "a": [0], "e": ["Триголовий м’яз литки (п’ятковий сухожилок) прикріплюється до п’яткового горба і згинає стопу.", "Довгий розгинач великого пальця розгинає палець.", "Передній великогомілковий м’яз розгинає стопу.", "Двоголовий м’яз стегна прикріплюється до головки малогомілкової кістки.", "Кравецький м’яз прикріплюється до великогомілкової кістки."]}, {"n": "20.28", "q": "У клініку госпіталізована дитина 5 років з різаною раною підошви правої стопи. Під час хірургічної обробки рани лікар виявив розрив сухожилка м’яза на підошві в проєкції os cuboideum. У чоловіка обмежено згинання в надп'ятково-гомілковому суглобі та опускання присереднього краю стопи. Функція якого м’яза порушена?", "o": ["Musculus triceps surae.", "Musculus tibialis anterior.", "Musculus extensor digitorum longus.", "Musculus quadriceps femoris.", "Musculus fibularis longus."], "a": [4], "e": ["Триголовий м’яз прикріплюється до п’яткового горба, а не на підошві біля кубоподібної кістки.", "Передній великогомілковий м’яз розгинає стопу.", "Довгий розгинач пальців розгинає пальці.", "Чотириголовий м’яз діє на коліно.", "Сухожилок довгого малогомілкового м’яза проходить у борозні кубоподібної кістки, згинає стопу і опускає її присередній край."]}, {"n": "20.29", "q": "Під час виконання фізичних вправ у 15-річного учня раптово виник біль у кульшовому суглобі при відвертанні та відведенні нижньої кінцівки. Травматолог виявив ушкодження одного із м’язів тазового пояса, сухожилок якого виходить із порожнини малого таза через великий сідничий отвір. Функція якого м’яза порушена?", "o": ["Musculus obturatorius internus.", "Musculus piriformis.", "Musculus gluteus medius.", "Musculus obturatorius externus.", "Musculus quadratus femoris."], "a": [1], "e": ["Внутрішній затульний м’яз виходить через малий сідничий отвір.", "Грушоподібний м’яз виходить через великий сідничий отвір, відвертає і відводить стегно.", "Середній сідничий м’яз лежить поза тазом.", "Зовнішній затульний м’яз лежить на затульній перетинці ззовні.", "Квадратний м’яз стегна лежить поза тазом."]}, {"n": "20.30", "q": "Хірург, виконуючи у чоловіка 45 років ревізію глибокої різаної рани на присередній закісточковій ділянці, виявив позаду присередньої кісточки ушкодження сухожилка м’яза, який на гомілці розташований між довгим м’язом-згиначем пальців та довгим м’язом-згиначем великого пальця. Сухожилок якого м’яза ушкоджений?", "o": ["Підошвовий м’яз.", "Задній великогомілковий м’яз.", "Передній великогомілковий м’яз.", "Зовнішній затульний м’яз.", "Довгий малогомілковий м’яз."], "a": [1], "e": ["Підошвовий м’яз лежить між литковим і камбалоподібним.", "Задній великогомілковий м’яз лежить глибоко між довгим згиначем пальців і довгим згиначем великого пальця.", "Передній великогомілковий м’яз лежить на передній поверхні гомілки.", "Зовнішній затульний м’яз — м’яз таза.", "Довгий малогомілковий м’яз лежить у бічній групі."]}], "models": [["Гомілковостопний суглоб і стопа", "o3d:zone-ankle", {"ru": "Голеностопный сустав и стопа", "en": "Ankle and foot"}], ["Нижня кінцівка", "o3d:lower-limb", {"ru": "Нижняя конечность", "en": "Lower limb"}], ["М'язи всього тіла", "sf:d32f5724fc294048888d03d215b9a1ff", {"ru": "Мышцы всего тела", "en": "Whole-body muscles"}]]}, {"id": "topic22a", "title": "22. Ротова порожнина. Піднебіння. Язик", "tr": {"ru": "22. Ротовая полость. Нёбо. Язык", "en": "22. Oral cavity. Palate. Tongue"}, "questions": [{"n": "22.1", "q": "Чоловік 25 років звернувся у лікарню зі скаргами на утруднене ковтання. Під час обстеження ротової порожнини лікар виявив пухлиноподібне підвищення на корені язика в ділянці сліпого отвору, 1–2 см в діаметрі. Лікар запідозрив розростання залишків залози, клітини якої мігрували на язик через ваду розвитку – незарощення протоки, що функціонувала в ембріональному періоді. Призначено додаткове обстеження. Наявність клітин якої залози підтвердило обстеження?", "o": ["Під’язикової залози.", "Прищитоподібної залози.", "Гіпофіза.", "Загруднинної залози.", "Щитоподібної залози."], "a": [4], "e": ["Під’язикова залоза закладається на дні ротової порожнини, а не через сліпий отвір.", "Прищитоподібні залози розвиваються з III–IV глоткових кишень.", "Гіпофіз розвивається з кишені Ратке і проміжного мозку.", "Загруднинна залоза розвивається з III глоткових кишень.", "Щитоподібна залоза закладається в ділянці сліпого отвору і опускається по щитоподібно-язиковій протоці; її залишки дають язикову щитоподібну тканину."]}, {"n": "22.2", "q": "Мати звернулася до стоматолога, запідозривши у своєї дитини ознаки патології язика. Лікар діагностував вроджену ваду розвитку – аплазію м’язів язика. З чого розвиваються м’язи язика?", "o": ["Мезодерми нижньощелепних відростків І-ої зябрової дуги.", "Мезодерми верхньощелепних відростків І-ої зябрової дуги.", "Потиличних міотомів.", "Мезодерми ІІІ, ІV зябрових дуг.", "Мезодерми ІІ-ої зябрової дуги."], "a": [2], "e": ["Нижньощелепні відростки I дуги дають жувальні м’язи, не м’язи язика.", "Верхньощелепні відростки дають частини верхньої щелепи і піднебіння.", "М’язи язика розвиваються з потиличних (передвушних) міотомів, тому їх іннервує під’язиковий нерв.", "III–IV зяброві дуги дають м’язи глотки і гортані.", "II зяброва дуга дає мімічні м’язи."]}, {"n": "22.3", "q": "Дитині 2-х років виконали оперативне втручання з приводу вади розвитку – розщеплення верхньої губи (так звана «заяча губа»). Унаслідок незрошення яких утворів виникає ця вада розвитку?", "o": ["Незрощення середнього лобового і верхньощелепного відростка І-ої зябрової дуги.", "Незрощення піднебінних валків верхньощелепних відростків І-ої зябрової дуги.", "Незрощення другої зябрової дуги.", "Незрощення третьої зябрової дуги.", "Незрощення верхньо- і нижньощелепних відростків І-ої зябрової дуги."], "a": [0], "e": ["Заяча губа виникає через незрощення присереднього носового (середнього лобового) відростка з верхньощелепним відростком I дуги.", "Незрощення піднебінних валків дає розщілину піднебіння (вовча паща).", "II зяброва дуга бере участь у розвитку під’язикової кістки і мімічних м’язів.", "III зяброва дуга до губи не причетна.", "Незрощення верхньо- і нижньощелепних відростків дає макростомію."]}, {"n": "22.4", "q": "Під час обстеження лікар виявив у чоловіка 45 років набряк слизової оболонки дужок м’якого піднебіння, гіпертрофію та запалення лімфоїдної тканини, що розташована між цими дужками (гострий тонзиліт). Який із мигдаликів міститься між дужками м’якого піднебіння?", "o": ["Tonsilla palatina.", "Tonsilla pharyngealis.", "Tonsilla tubaria.", "Tonsilla lingualis."], "a": [0], "e": ["Піднебінний мигдалик лежить у мигдаликовій ямці між піднебінно-язиковою і піднебінно-глотковою дужками.", "Глотковий мигдалик лежить на склепінні глотки.", "Трубний мигдалик лежить біля глоткового отвору слухової труби.", "Язиковий мигдалик лежить у корені язика."]}, {"n": "22.5", "q": "Чоловік 45 років звернувся до лікаря зі скаргами на утруднене ковтання. Під час огляду ротової порожнини лікар виявив невелику виразку на слизовій оболонці передньої (трикутної) складки зіва. Який м’яз розташований в цій дужці?", "o": ["Musculus рalatoglossus.", "Musculus stiloglossus.", "Musculus palatopharingeus.", "Musculus genioglossus.", "Musculus hyoglossus."], "a": [0], "e": ["У передній (піднебінно-язиковій) дужці лежить піднебінно-язиковий м’яз.", "Шило-язиковий м’яз іде від шилоподібного відростка в язик і дужки не утворює.", "Піднебінно-глотковий м’яз лежить у задній дужці.", "Підборідно-язиковий м’яз лежить у товщі язика.", "Під’язиково-язиковий м’яз лежить збоку в язиці."]}, {"n": "22.6", "q": "Під час огляду ротової порожнини у дівчинки 10 років виявлена неможливість висувати язик вперед за межі ротової порожнини. Який м’яз язика ушкоджений?", "o": ["Підборідно-язиковий м’яз.", "Під’язиково-язиковий м’яз.", "Шило-язиковий м’яз.", "Верхній повздовжній м’яз.", "Нижній повздовжній м’яз."], "a": [0], "e": ["Підборідно-язиковий м’яз висуває язик вперед.", "Під’язиково-язиковий м’яз тягне язик униз і назад.", "Шило-язиковий м’яз тягне язик назад і вгору.", "Верхній поздовжній м’яз вкорочує язик і піднімає верхівку.", "Нижній поздовжній м’яз вкорочує язик і опускає верхівку."]}, {"n": "22.7", "q": "У відділення хірургічної стоматології госпіталізована новонароджена дівчинка, у якої при смоктанні молоко потрапляє до носової порожнини. При обстеженні виявлена розщілина твердого піднебіння, яка була наслідком незрощення присереднього носового відростка з верхньощелепним відростком І-ої зябрової дуги. Між якими утворами знаходиться розщілина?", "o": ["Processus palatinus maxillae dextrae et sinistrae.", "Os incisivum et processus palatinus maxillae.", "Laminae horizontalis ossis palatini dextrum et sinistrum.", "Processus palatinus maxillae et lamina horizontalis os palatinum.", "В ділянці canalis incisivus."], "a": [1], "e": ["Між піднебінними відростками правої і лівої верхніх щелеп розташована серединна розщілина.", "Розщілина між різцевою кісткою (похідною присереднього носового відростка) і піднебінним відростком верхньої щелепи — бічна (передня) розщілина.", "Горизонтальні пластинки піднебінних кісток утворюють задню частину піднебіння.", "Між піднебінним відростком і горизонтальною пластинкою проходить поперечний шов.", "Різцевий канал лежить спереду по серединній лінії, а не між цими відростками."]}, {"n": "22.8", "q": "Під час огляду ротової порожнини у дитини спостерігається неможливість сплощення язика і відтягнення його донизу і назад. Який м’яз язика ушкоджений?", "o": ["Підборідно-під’язиковий.", "Під’язиково-язиковий.", "Шило-язиковий.", "Верхній повздовжній.", "Нижній повздовжній."], "a": [1], "e": ["Підборідно-під’язиковий м’яз не належить до м’язів язика.", "Під’язиково-язиковий м’яз сплощує язик і тягне його донизу і назад.", "Шило-язиковий м’яз тягне язик вгору і назад.", "Верхній поздовжній м’яз піднімає верхівку.", "Нижній поздовжній м’яз вкорочує язик."]}, {"n": "22.9", "q": "До стоматолога звернулась жінка зі скаргою на втрату смаку на верхівці язика. Лікар виявив, що внаслідок паління сигарет спостерігається атрофія смакових рецепторів. Які сосочки язика редуковані?", "o": ["Filiformes.", "Conicea.", "Foliatae.", "Fungiformes.", "Vallatae."], "a": [3], "e": ["Ниткоподібні сосочки смакових бруньок не мають.", "Конічні сосочки — рецептори загальної чутливості.", "Листоподібні сосочки лежать на бічних краях.", "Грибоподібні сосочки розташовані переважно на верхівці і краях язика; вони містять смакові бруньки.", "Жолобуваті сосочки лежать перед межовою борозною на корені."]}, {"n": "22.10", "q": "У чоловіка під час видалення лімфоїдного утвору, що розташований в мигдаликовій ямці (тонзилектомії) виникла надзвичайно сильна кровотеча із сонної артерії, яка проходить на відстані 1–1,5 см позаду цієї ямки. Під час видалення якого мигдалика виникла кровотеча?", "o": ["Tonsilla pharyngealis.", "Tonsilla palatinae.", "Tonsilla tubaria.", "Tonsilla lingualis.", "Noduli limphoidei solitarii."], "a": [1], "e": ["Глотковий мигдалик лежить на склепінні глотки.", "Піднебінний мигдалик лежить у мигдаликовій ямці; позаду неї проходить внутрішня сонна артерія.", "Трубний мигдалик лежить біля глоткового отвору слухової труби.", "Язиковий мигдалик лежить у корені язика.", "Поодинокі лімфоїдні вузлики розсіяні по слизовій оболонці."]}, {"n": "22.11", "q": "У новонародженої дитини педіатр помітив, що вуздечка язика простягається до самого кінчика язика. Яка ваду розвитку виявив у дитини лікар?", "o": ["Складчастий язик.", "Анкілоглосія.", "Недорозвинений язик.", "Заяча губа.", "Роздвоєний язик."], "a": [1], "e": ["Складчастий язик має глибокі борозни, вуздечка нормальна.", "Анкілоглосія — коротка вуздечка язика, що доходить до верхівки і обмежує його рухи.", "Недорозвинений язик (мікроглосія) — це зменшення розмірів язика.", "Заяча губа — вада верхньої губи.", "Роздвоєний язик — незрощення бічних горбків язика."]}, {"n": "22.12", "q": "До невролога звернувся 62-річний пацієнт зі скаргами на порушення мовлення та неможливість підняти верхівку язика під час артикуляції. При огляді виявлено парез внутрішніх м’язів язика. За вкорочення язика та підняття його верхівки доверху відповідає певний м’яз, і його функція критично важлива для процесів ковтання та чіткої вимови. Який мʼяз вкорочує язик і піднімає доверху верхівку язика?", "o": ["Поздовжній нижній мʼяз язика.", "Поздовжній верхній мʼяз язика.", "Поперечний м’яз язика.", "Вертикальний м’яз язика.", "Діагональний мʼяз язика."], "a": [1], "e": ["Нижній поздовжній м’яз вкорочує язик, але опускає верхівку.", "Верхній поздовжній м’яз вкорочує язик і піднімає його верхівку.", "Поперечний м’яз звужує і подовжує язик.", "Вертикальний м’яз сплощує язик.", "Діагонального м’яза язика немає."]}, {"n": "22.13", "q": "У чоловіка 45 років діагностовано пухлину на слизовій оболонці дна ротової порожнини. Під час огляду лікар звернув увагу на порушення функції м’язів, що утворюють нижню стінку власне ротової порожнини, пов’язавши це з розповсюдженням злоякісного процесу. Які м’язи утворюють дно ротової порожнини?", "o": ["Щелепно-під’язиковий, двочеревцевий, підборідно-під’язиковий.", "Шило-язиковий.", "Підборідно-язиковий, двочеревцевий.", "Підборідно-язиковий.", "Підборідно-язиковий, шило-язиковий, двочеревцевий."], "a": [0], "e": ["Дно ротової порожнини утворюють щелепно-під’язиковий, двочеревцевий і підборідно-під’язиковий м’язи.", "Шило-язиковий м’яз належить до м’язів язика.", "Підборідно-язиковий м’яз лежить у язиці, а не у дні рота.", "Підборідно-язиковий м’яз — м’яз язика.", "Ці м’язи переважно належать до язика."]}, {"n": "22.14", "q": "У підлітка під час бійки травмована під’язикова кістка, що викликало порушення акту ковтання. Який м’яз, що бере початок від тіла та великих рогів під’язикової кістки, ушкоджений?", "o": ["Щелепно-під’язиковий.", "Шило-язиковий.", "Підборідно-язиковий.", "Під’язиково-язиковий.", "Двочеревцевий."], "a": [3], "e": ["Щелепно-під’язиковий м’яз прикріплюється до тіла під’язикової кістки, але починається від нижньої щелепи.", "Шило-язиковий м’яз починається від шилоподібного відростка.", "Підборідно-язиковий м’яз починається від підборідної ості.", "Під’язиково-язиковий м’яз починається від тіла і великих рогів під’язикової кістки.", "Двочеревцевий м’яз починається від соскоподібної вирізки і нижньої щелепи."]}, {"n": "22.15", "q": "У дитини 8 років діагностовано гнійне запалення слизової оболонки середнього вуха. Запальний процес почався у носовій частині глотки. Через слухову трубу інфекція потрапила до барабанної порожнини. У дитини виявлено гіпертрофію мигдалика, який розташований біля входу у слухову трубу. Який мигдалик ушкоджений?", "o": ["Tonsilla pharyngealis.", "Tonsilla palatinae.", "Tonsilla tubaria.", "Tonsilla lingualis.", "Noduli limphoidei solitarii."], "a": [2], "e": ["Глотковий мигдалик лежить на склепінні, а не біля труби.", "Піднебінний мигдалик лежить у зіві.", "Трубний мигдалик лежить біля глоткового отвору слухової труби.", "Язиковий мигдалик лежить у корені язика.", "Поодинокі вузлики не утворюють мигдалика."]}, {"n": "22.16", "q": "У лікарню звернулася жінка 38 років зі скаргами на втрату відчуття дотику їжі на слизовій оболонці передніх 2/3 язика після перенесеного гострого вірусного респіраторного захворювання. Хвора не відчуває температуру їжі, що часто призводить до опіку слизової оболонки язика без больового синдрому. Які сосочки язика ушкоджені?", "o": ["Fungiformes.", "Lentiformes.", "Foliatae.", "Filiformes.", "Vallatae."], "a": [3], "e": ["Грибоподібні сосочки переважно смакові.", "Сочевицеподібних сосочків у людини немає.", "Листоподібні сосочки смакові.", "Ниткоподібні сосочки на передніх 2/3 язика — рецептори дотику, температури і болю.", "Жолобуваті сосочки смакові, лежать на корені."]}, {"n": "22.17", "q": "Внаслідок ушкодження ядра язико-глоткового нерва у стовбурі головного мозку у чоловіка 34 років спостерігається відсутність відчуття смаку на слизовій обонці задньої третини язика та порушення слиновиділення. Хворий зовсім не відчуває гіркий смак їжі. Які сосочки язика ушкоджені?", "o": ["Fungiformes.", "Conicea.", "Foliatae.", "Filiformes.", "Vallatae."], "a": [4], "e": ["Грибоподібні сосочки лежать на передніх 2/3 язика.", "Конічні сосочки не смакові.", "Листоподібні сосочки лежать на краях язика.", "Ниткоподібні сосочки не смакові.", "Жолобуваті сосочки лежать на межі тіла і кореня, іннервуються язико-глотковим нервом і сприймають гірке."]}, {"n": "22.18", "q": "Чоловіка 34 років госпіталізовано у неврологічне відділення лікарні. Під час огляду виявлено: відхилення язика вбік, неможливість зігнути язик, піднімаючи його верхівку спостерігаються атрофічні зміни половини язика, розлади мовлення, утруднене ковтання. Цей стан обумовлений ушкодженням під’язикового нерва. Ушкодження яких із зазначаних м’язів призводить до вказаних симптомів?", "o": ["Musculus transversus linguae.", "Musculus longitudinalis superior.", "Musculus hyoglossus.", "Musculus verticalis linguae.", "Musculus longitudinalis inferior"], "a": [1], "e": ["Поперечний м’яз звужує язик.", "Верхній поздовжній м’яз вигинає язик догори, піднімаючи верхівку; він іннервується під’язиковим нервом.", "Під’язиково-язиковий м’яз опускає язик, не піднімає верхівку.", "Вертикальний м’яз сплощує язик.", "Нижній поздовжній м’яз опускає верхівку."]}, {"n": "22.19", "q": "У відділення щелепно-лицевої хіруругії з вогнепальним пораненням госпіталізовано чоловіка. Після рентгенологічного обстеження лікар виявив, що куля пройшла крізь кістку в ротовій порожнині біля підборідного отвору (foramen mentale). Яка кістка ушкоджена?", "o": ["Верхня щелепа (maxilla).", "Леміш (vomer).", "Вилична кістка (os zygomaticum).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [3], "e": ["Підборідного отвору на верхній щелепі немає.", "Леміш входить до носової перегородки.", "Вилична кістка утворює вилицю.", "Підборідний отвір лежить на зовнішній поверхні тіла нижньої щелепи.", "Піднебінна кістка не має підборідного отвору."]}, {"n": "22.20", "q": "До щелепно-лицевого хірурга звернувся 5-річний хлопчик із вродженою розщілиною піднебіння (вовча паща). Для відновлення анатомії важливо знати, які кісткові структури формують тверде (кісткове) піднебіння, адже саме їх дефект призводить до порушення функцій ковтання та мовлення. Які структури утворюють кісткове піднебіння?", "o": ["Піднебінні відростки верхніх щелеп, горизонтальні пластинки піднебінних кісток.", "Піднебінні відростки верхніх щелеп, вертикальні пластинки піднебінних кісток.", "Верхньощелепні відростки, горизонтальні пластинки піднебінних кісток.", "Піднебінні відростки верхніх щелеп, піднебінні кістки.", "Верхні щелепи, горизонтальні пластинки піднебінних кісток."], "a": [0], "e": ["Тверде піднебіння утворене піднебінними відростками верхніх щелеп і горизонтальними пластинками піднебінних кісток.", "Вертикальні пластинки піднебінних кісток утворюють стінку носової порожнини.", "Верхньощелепні відростки — ембріональні структури.", "Піднебінна кістка має й вертикальну пластинку, яка в піднебінні не бере участі.", "Тверде піднебіння утворює лише піднебінний відросток верхньої щелепи."]}, {"n": "22.21", "q": "До оториноларинголога звернувся 45-річний пацієнт зі скаргами на утруднене ковтання та потрапляння рідини в носову порожнину. Під час огляду виявлено парез м'язів м’якого піднебіння. Лікар пояснює студентам, що під час ковтання м’язи м’якого піднебіння відіграють важливу роль, забезпечуючи підняття піднебінної завіски та закриття носоглотки. Вкажіть мʼяз мʼякого піднебіння:", "o": ["Щелепно-язиковий мʼяз.", "М’яз язичка.", "Двочеревцевий мʼяз.", "Підборідно-язиковий мʼяз.", "Поперечний м’яз язика."], "a": [1], "e": ["Щелепно-язикового м’яза немає.", "М’яз язичка належить до м’яза м’якого піднебіння, він вкорочує язичок.", "Двочеревцевий м’яз — надпід’язиковий.", "Підборідно-язиковий м’яз належить до язика.", "Поперечний м’яз — внутрішній м’яз язика."]}, {"n": "22.22", "q": "Щелепно-лицевий хірург оглянув 6-річного хлопчика із вродженою розщілиною м’якого піднебіння, що призводить до порушення мовлення та потрапляння їжі в носову порожнину. Під час консультації лікар пояснює батькам, що м’яке піднебіння має кілька анатомічних частин, і знання їх структури є критично важливим для планування пластичної операції. 3 яких частин складається мʼяке піднебіння?", "o": ["Язичок.", "Піднебінна завіска.", "Піднебінно-язикова дужка.", "Піднебінно-глоткова дужка.", "Все перераховане."], "a": [4], "e": ["Язичок — лише одна частина м’якого піднебіння.", "Піднебінна завіска — лише частина.", "Піднебінно-язикова дужка — лише частина.", "Піднебінно-глоткова дужка — лише частина.", "М’яке піднебіння включає піднебінну завіску з язичком і дві пари дужок."]}, {"n": "22.23", "q": "До стоматолога звернувся 25-річний пацієнт зі скаргами на дискомфорт у ділянці язика та зміну смакових відчуттів. Під час огляду лікар відзначає, що вздовж межової лінії язика розташовані великі сосочки, які містять смакові рецептори і можуть запалюватися при хронічному фарингіті або травмі. Знання їх анатомічного розташування важливе для діагностики та лікування. Які сосочки розташовані вздовж межової лінії язика?", "o": ["Papillae conicae.", "Papillae fungiformes.", "Papillae vallatae.", "Papillae filiformes.", "Papillae foliatae."], "a": [2], "e": ["Конічні сосочки розсіяні на спинці язика.", "Грибоподібні сосочки лежать на верхівці і краях.", "Жолобуваті сосочки (7–12) лежать уздовж межової борозни.", "Ниткоподібні сосочки вкривають спинку язика.", "Листоподібні сосочки лежать на бічних краях."]}, {"n": "22.24", "q": "До лікаря-отоларинголога звернулася 30-річна жінка зі скаргами на біль і печіння по краях язика після перенесеного вірусного фарингіту. Під час огляду виявлено збільшення сосочків язика уздовж бічних його країв, які відповідають за сприйняття смаку, особливо кислого і солоного. Які сосочки знаходяться по краям язика?", "o": ["Papillae conicae.", "Papillae fungiformes.", "Papillae vallatae.", "Papillae filiformes.", "Papillae foliatae."], "a": [4], "e": ["Конічні сосочки розсіяні на спинці.", "Грибоподібні сосочки лежать на верхівці і краях, але не утворюють складок.", "Жолобуваті сосочки лежать уздовж межової борозни.", "Ниткоподібні сосочки вкривають спинку.", "Листоподібні сосочки утворюють складки на бічних краях язика і сприймають кисле і солоне."]}, {"n": "22.25", "q": "До лікаря-отоларинголога звернувся 40-річний пацієнт зі скаргами на втрату смаку після перенесеного грипу. Під час огляду язика не виявлено патологічних змін, але лікар пояснює хворому, що смакові відчуття забезпечують спеціальні сосочки, які містять смакові бруньки. Знання їх анатомії допомагає зрозуміти причини порушення смаку. Які сосочки відносяться до смакових рецепторів?", "o": ["Papillae conicae, papillae fungiformes, papillae vallatae.", "Papillae fungiformes, papillae vallatae, papillae foliatae.", "Papillae vallatae, papillae conicae, papillae filiformes.", "Papillae filiformes, papillae vallatae, papillae foliatae.", "Papillae foliatae, papillae conicae, papillae vallatae."], "a": [1], "e": ["Конічні сосочки смакових бруньок не мають.", "Смакові бруньки містять грибоподібні, жолобуваті і листоподібні сосочки.", "Конічні і ниткоподібні сосочки не смакові.", "Ниткоподібні сосочки не смакові.", "Конічні сосочки не смакові."]}, {"n": "22.26", "q": "До стоматолога звернувся 27-річний пацієнт зі скаргами на відчуття шорсткості та болю на язиці після механічної травми. Під час огляду лікар пояснює, що біль і тактильні відчуття забезпечують сосочки, які не містять смакових бруньок, але виконують функцію рецепторів загальної чутливості (дотик, температура, біль). Які сосочки відносяться до рецепторів загальної чутливості?", "o": ["Papillae conicae, papillae filiformes.", "Papillae fungiformes, papillae foliatae.", "Papillae vallatae, papillae conicae.", "Papillae filiformes, papillae vallatae.", "Papillae foliatae, papillae conicae, papillae vallatae."], "a": [0], "e": ["Конічні і ниткоподібні сосочки — рецептори загальної чутливості, смакових бруньок не мають.", "Грибоподібні і листоподібні сосочки смакові.", "Жолобуваті сосочки смакові.", "Жолобуваті сосочки смакові.", "Листоподібні і жолобуваті сосочки смакові."]}, {"n": "22.27", "q": "До оториноларинголога звернувся 35-річний пацієнт зі скаргами на біль у горлі та утруднене ковтання. При огляді лікар виявляє гіперемію та набряк піднебінних дужок, а також збільшення мигдаликів. Ці анатомічні утвори формують межі зіву (fauces), який є важливою ділянкою для проходження їжі з ротової порожнини в глотку. Які анатомічні утвори обмежують зів?", "o": ["Мʼяке піднебіння, корінь язика.", "Мʼяке піднебіння, корінь язика, трубний валик.", "Мʼяке піднебіння, надгортанник.", "Піднебінно-язикові дужки, корінь язика.", "Піднебінно-язикові та піднебінно-глоткові дужки, корінь язика"], "a": [3], "e": ["Без піднебінно-язикових дужок межі зіву неповні.", "Трубний валик лежить у носоглотці.", "Надгортанник лежить нижче, в гортанній частині глотки.", "Зів обмежений з боків піднебінно-язиковими дужками і знизу коренем язика (зверху — м’яким піднебінням).", "Піднебінно-глоткові дужки лежать позаду зіву, на межі з глоткою."]}, {"n": "22.28", "q": "До стоматолога звернувся 45-річний пацієнт зі скаргами на біль і набряк у ділянці щоки, що посилюється під час їжі. Під час огляду ротової порожнини лікар виявляє гнійні виділення з вічка протоки привушної слинної залози, що свідчить про сіаладеніт. Куди відкривається протока привушної слинної залози?", "o": ["Caruncula sublingualis.", "Vestibulum oris.", "Foramen caecum linguae.", "Commissura labiorum.", "Plica sublingualis."], "a": [1], "e": ["На під’язиковому м’ясці відкриваються протоки піднижньощелепної і під’язикової залоз.", "Протока привушної залози відкривається у присінок рота напроти II верхнього великого кутнього зуба.", "Сліпий отвір — залишок щитоподібно-язикової протоки.", "Кут рота не є місцем впадіння протоки.", "На під’язиковій складці відкриваються малі протоки під’язикової залози."]}, {"n": "22.29", "q": "До оториноларинголога звернувся 48-річний пацієнт зі скаргами на утруднене ковтання після операції на шиї. При огляді хворого виявлено порушення функції м'яза язика, який тягне корінь язика назад і вверх. Які мʼязи ушкоджені?", "o": ["Підʼязиково-язикові мʼязи.", "Підборідно-язикові мʼязи.", "Шило-язикові мʼязи.", "Піднебінно-язикові мʼязи.", "Піднебінно-глоткові мʼязи."], "a": [2], "e": ["Під’язиково-язиковий м’яз тягне язик униз і назад.", "Підборідно-язиковий м’яз висуває язик вперед.", "Шило-язиковий м’яз тягне корінь язика назад і вгору.", "Піднебінно-язиковий м’яз звужує зів.", "Піднебінно-глотковий м’яз піднімає глотку."]}, {"n": "22.30", "q": "До логопеда звернувся 7-річний хлопчик із порушенням вимови звуків «л» та «р». Під час обстеження лікар виявив обмежену рухливість язика та труднощі з його вкороченням під час артикуляційних вправ. За вкорочення язика відповідає певний внутрішній м’яз і його функція важлива для формування правильної мови. Який мʼяз вкорочує язик?", "o": ["Поздовжній нижній мʼяз язика.", "Підборідно-язиковий мʼяз язика.", "Поперечний м’яз язика.", "Вертикальний м’яз язика.", "Шило-язикові мʼяз язика."], "a": [0], "e": ["Нижній поздовжній м’яз вкорочує язик і опускає верхівку.", "Підборідно-язиковий м’яз висуває язик вперед.", "Поперечний м’яз звужує і подовжує язик.", "Вертикальний м’яз сплощує язик.", "Шило-язиковий м’яз — зовнішній м’яз язика."]}], "models": [["Глотка і дно ротової порожнини", "sf:b262c70bf9bd49c2a5428581b754f24b", {"ru": "Глотка и дно полости рта", "en": "Pharynx and floor of the mouth"}], ["Зуби, ясна і язик", "sf:c4c569f0e08948e2a572007a7a5726f2", {"ru": "Зубы, дёсны и язык", "en": "Teeth, gums and tongue"}], ["Сагітальний розріз черепа (носова порожнина)", "sf:5e73a548332742c8bc722d5f14ae35f0", {"ru": "Сагиттальный разрез черепа (носовая полость)", "en": "Sagittal section of skull (nasal cavity)"}]]}, {"id": "topic22b", "title": "22. Слинні залози. Зуби", "tr": {"ru": "22. Слюнные железы. Зубы", "en": "22. Salivary glands. Teeth"}, "questions": [{"n": "22.1", "q": "Чоловіку 25 років після перелому нижньої щелепи проведена імобілізація (нижня щелепа фіксована до верхньої щелепи). Ротова щілина повністю закрита, діастеми (міжзубні проміжки) відсутні. Лікар планує завести в ротову порожнину зонд для ентерального харчування. Крізь який анатомічний утвір слід встановити зонд?", "o": ["Замолярну ямку.", "Великий піднебінний простір.", "Змикальну щілину.", "Щито-язикову протоку.", "мМигдаликову пазуху."], "a": [0], "e": ["Позаду останніх великих кутніх зубів є замолярний простір, через який присінок сполучається з власне ротовою порожниною навіть при зімкнутих зубах.", "Великого піднебінного простору як анатомічного проходу немає.", "Змикальна щілина при імобілізації щелеп закрита.", "Щитоподібно-язикова протока заростає ще в ембріогенезі.", "Мигдаликова пазуха лежить у зіві і не є шляхом введення зонда."]}, {"n": "22.2", "q": "Чоловік 39 років скаржиться на періодичний біль та сухість у ротовій порожнині після перенесеного гострого паротиту. Під час огляду щоки на боці ураження слизова оболонка гіперемована, є невеликий набряк у ділянці вивідної протоки привушної слинної залози. Лікар планує зібрати секрет слинної залози для аналізу. На якому рівні на внутрішній поверхні щоки потрібно шукати сосочок привушної протоки?", "o": ["На рівні 3 верхнього великого кутнього зуба.", "На рівні 2 верхнього малого кутнього зуба.", "На рівні 2 верхнього великого кутнього зуба.", "На рівні 1 верхнього великого кутнього зуба.", "На рівні 2 нижнього великого кутнього зуба."], "a": [2], "e": ["Напроти III верхнього кутнього зуба протока не відкривається.", "Малі кутні зуби лежать попереду від місця відкриття протоки.", "Сосочок привушної протоки лежить на слизовій щоки напроти II верхнього великого кутнього зуба.", "I великий кутній зуб — трохи попереду від справжнього місця.", "Протока відкривається на рівні верхніх, а не нижніх зубів."]}, {"n": "22.3", "q": "Жінка 45 років скаржиться на біль у ротовій порожнині під язиком, що з’являється під час прийому їжі. При пальпації у ділянці під’язикового м`ясця (caruncula sublingualis) відчувається щільний утвір, з вічка якого виділяється невелика кількість мутного секрету. Вивідна протока якої слинної залози відкривається у цьому місці?", "o": ["Щитоподібної.", "Губних.", "Під’язикової.", "Привушної.", "Язикових."], "a": [2], "e": ["Щитоподібна залоза не є слинною і протоки не має.", "Губні залози — дрібні, відкриваються на слизовій губ.", "На під’язиковому м’ясці відкриваються протоки під’язикової (велика протока) і піднижньощелепної залоз.", "Протока привушної залози відкривається у присінок рота.", "Язикові залози відкриваються на язиці."]}, {"n": "22.4", "q": "Чоловік 25 років скаржиться на періодичний біль та набряк у привушно-жувальній ділянці голови, особливо під час їди. Для уточнення діагнозу лікар планує виконати сіалографію привушної слинної залози, ввівши рентгеноконтрастну речовину безпосередньо у її вивідну протоку (ductus parotideus). Де розташований сосочок привушної протоки?", "o": ["На слизовій оболонці щоки напроти ІІ-го верхнього великого кутнього зуба.", "На слизовій оболонці щоки напроти ІІ-го нижнього великого кутнього зуба.", "На слизовій оболонці щоки напроти верхнього ІІ-го малого кутнього зуба.", "На під’язиковому м`ясці.", "На під`язиковій складці."], "a": [0], "e": ["Сосочок привушної протоки лежить на слизовій щоки напроти II верхнього великого кутнього зуба.", "Протока відкривається на рівні верхніх, а не нижніх зубів.", "Малі кутні зуби лежать попереду від сосочка.", "На під’язиковому м’ясці відкриваються інші залози.", "На під’язиковій складці відкриваються малі протоки під’язикової залози."]}, {"n": "22.5", "q": "Під час лікування зубів лікар-стоматолог розташував ватний тампон у присінку ротової порожнини. Чим обмежений присінок ротової порожнини?", "o": ["Губами і щоками.", "Твердим піднебінням, губами і щоками.", "Губами і щоками ззовні, зубами і яснами зсередини.", "Зубами, яснами, твердим піднебінням.", "М`яким піднебінням, дном ротової порожнини, зубами і яснами."], "a": [2], "e": ["Не названа внутрішня межа присінка.", "Тверде піднебіння обмежує власне ротову порожнину.", "Присінок рота обмежений губами і щоками ззовні, зубами і яснами зсередини.", "Зуби, ясна і піднебіння — межі власне ротової порожнини.", "М’яке піднебіння і дно рота обмежують власне ротову порожнину."]}, {"n": "22.6", "q": "Чоловік 35 років скаржиться на біль та набряк слизової оболонки на нижній стінці (дні) ротової порожнини, що посилюються під час прийому їжі. Хворий відзначає утруднене ковтання та підвищене слиновиділення. Лікар запідозрив ушкодження однієї із великих слинних залоз – піднижньощелепної. Де відкривається вивідна протока піднижньощелепної слинної залози?", "o": ["На слизовій оболонці щоки (вucca).", "На під’язиковому м`ясці власне ротової порожнини (сaruncula sublingualis).", "На ясенному сосочку власне ротової порожнини (papilla gingivalis).", "На сліпому отворі язика (foramen caecum linguae).", "На під’язиковій складці власне ротової порожнини (plica sublingualis)."], "a": [1], "e": ["На слизовій щоки відкривається протока привушної залози.", "Протока піднижньощелепної залози відкривається на під’язиковому м’ясці.", "Ясенні сосочки — частина ясен, протоки там не відкриваються.", "Сліпий отвір — залишок щитоподібно-язикової протоки.", "На під’язиковій складці відкриваються малі протоки під’язикової залози."]}, {"n": "22.7", "q": "Під час профілактичного стоматологічного огляду у чоловіка 34 років виявлено, що передні зуби верхньої щелепи піднебінною поверхнею своїх коронок виступають вперед та перекривають на 1/3 губну поверхню зубів нижньощелепної зубної дуги. Який вид прикусу має таке розташування зубів?", "o": ["Прогенії.", "Відкритому прикусу.", "Ортогнатії.", "Закритому прикусу.", "Прямому прикусу."], "a": [2], "e": ["При прогенії нижні різці виступають вперед.", "При відкритому прикусі між зубами лишається щілина.", "Ортогнатія — нормальний прикус: верхні різці перекривають нижні приблизно на 1/3 коронки.", "Закритий (глибокий) прикус — надмірне перекриття.", "При прямому прикусі краї різців збігаються."]}, {"n": "22.8", "q": "Під час огляду ротової порожнини у чоловіка виявлено неправильне співвідношення між верхніми та нижніми кутніми зубами (нижня щелепа зміщена вбік відносно верхньої щелепи), що порушує нормальний контакт зубних рядів при змиканні. Якому типу прикусу відповідає таке розміщення зубів?", "o": ["Ортогнатії.", "Прогенії.", "Прямому прикусу.", "Відкритому прикусу.", "Перехресному прикусу."], "a": [4], "e": ["Ортогнатія — нормальний прикус.", "При прогенії нижня щелепа виступає вперед.", "При прямому прикусі краї різців збігаються.", "При відкритому прикусі між зубами щілина.", "Перехресний прикус — зміщення нижньої щелепи вбік, кутні зуби змикаються неправильно."]}, {"n": "22.9", "q": "Оглядаючи ротову порожнину дитини стоматолог побачив, що нижні різці розташовані дещо попереду від верхніх різців (внаслідок надмірного розвитку нижньої щелепи). Який тип прикусу у дитини спостерігає лікар?", "o": ["Фізіологічна прогнатія.", "Закритий прикус.", "Фізіологічна прогенія.", "Фізіологічна ортогенія.", "Фізіологічна ортогнатія."], "a": [2], "e": ["При прогнатії верхні різці виступають вперед.", "Закритий прикус — глибоке перекриття.", "Прогенія — нижні різці розташовані попереду від верхніх через переважний розвиток нижньої щелепи.", "Ортогенія — вигаданий термін.", "Ортогнатія — нормальне перекриття верхніми різцями нижніх."]}, {"n": "22.10", "q": "До стоматолога звернувся 33-річний пацієнт зі скаргами на біль та набряк у ділянці другого верхнього премоляра. Об’єктивно: запалення зубної комірки верхньої щелепи (альвеоліт) цього зуба, болючість при накушуванні. Яка частина зуба першою зазнає ураження при такому патологічному процесі?", "o": ["Корінь зуба (radix dentis).", "Шийка зуба (collum dentis).", "Коронкова порожнина (cavitas coronae).", "Канал кореня зуба (canalis radicis dentis).", "Коронка зуба (corona dentis)."], "a": [0], "e": ["Зубна комірка оточує корінь зуба, тому при альвеоліті першим уражається корінь (окістя кореня).", "Шийка лежить на рівні ясен.", "Порожнина коронки лежить усередині коронки.", "Канал кореня уражається вже вторинно.", "Коронка виступає над яснами."]}, {"n": "22.11", "q": "На профілактичний огляд до стоматолога прийшла дитина з батьками. Під час огляду ротової порожнини лікар помітив, що на верхній щелепі з обох боків прорізалися перші постійні бічні різці. Який орієнтовний вік дитини?", "o": ["5–6 років.", "6–7 років.", "7–8 років.", "9–10 років.", "12–13 років."], "a": [2], "e": ["У 5–6 років ще не прорізуються постійні різці.", "У 6–7 років прорізуються перші моляри і присередні різці.", "Бічні постійні різці прорізуються приблизно у 7–8 (до 9) років.", "У 9–10 років прорізуються перші малі кутні зуби.", "У 12–13 років прорізуються другі великі кутні зуби."]}, {"n": "22.12", "q": "Під час проведення профілактичного огляду ротової порожнини стоматолог помітив появу у дитини в зубному ряду перших постійних ікол. Який орієнтовний вік дитини?", "o": ["5–6 років.", "6–7 років.", "8–9 років.", "9–10 років.", "11–12 років."], "a": [4], "e": ["У 5–6 років постійних ікол ще немає.", "У 6–7 років прорізуються перші моляри.", "У 8–9 років прорізуються бічні різці.", "У 9–10 років прорізуються перші малі кутні.", "Постійні ікла прорізуються приблизно в 11–12 років."]}, {"n": "22.13", "q": "На профілактичний огляд до стоматолога прийшла дитина разом із матір’ю. Під час огляду ротової порожнини лікар виявив, що в дистальних ділянках нижньої щелепи прорізалися перші великі кутні постійні зуби (перші моляри). Інші зуби – молочні. Який орієнтовний вік дитини?", "o": ["6–7 років.", "8–9 років.", "10–11 років.", "11–12 років.", "12–13 років."], "a": [0], "e": ["Перші постійні великі кутні зуби прорізуються першими з постійних, у 6–7 років.", "У 8–9 років прорізуються бічні різці.", "У 10–11 років прорізуються малі кутні зуби.", "У 11–12 років — ікла і другі малі кутні.", "У 12–13 років — другі великі кутні."]}, {"n": "22.14", "q": "Лікар-стоматолог під час профілактичного огляду в школі обстежує ротову порожнину дівчинки 9 років. Лікар звернув увагу, що під час змикання зубів різальні краї верхніх присередніх різців збігаються з різальними краями нижніх різців, без перекриття. Який вид прикусу виявив лікар?", "o": ["Фізіологічна прогнатія.", "Прямий прикус.", "Фізіологічна ортогнатія.", "Фізіологічна ортогенія.", "Фізіологічна прогенія."], "a": [1], "e": ["При прогнатії верхні різці значно виступають вперед.", "Прямий прикус: різальні краї верхніх і нижніх різців збігаються без перекриття.", "При ортогнатії верхні різці перекривають нижні.", "Ортогенії немає.", "При прогенії нижні різці виступають вперед."]}, {"n": "22.15", "q": "На прийом до лікаря-стоматолога прийшов 10-річний хлопчик. При змиканні верхньощелепної та нижньощелепної зубних дуг лікар помітив, що між передніми зубами залишається щілина, тоді як бічні зуби змикаються нормально. Який патологічний прикус виявив лікар?", "o": ["Патологічний (трансверзальний), або перехресний.", "Патологічна прогенія.", "Відкритий.", "Патологічна прогнатія.", "Закритий."], "a": [2], "e": ["Перехресний прикус — бічне зміщення.", "При прогенії нижні різці виступають вперед.", "Відкритий прикус: при змиканні між передніми зубами лишається щілина.", "При прогнатії верхні різці виступають вперед.", "Закритий прикус — глибоке перекриття."]}, {"n": "22.16", "q": "Під час вивчення рентгенограми кісток лицевого черепа стоматолог звернув увагу, що корінь одного із зубів на верхній щелепі має роздвоєння на верхівці. Лікар зазначив, що така особливість зустрічається приблизно у половини людей. Який зуб має таку анатомічну особливість?", "o": ["Перший верхній малий кутній зуб.", "Другий верхній малий кутній зуб.", "Перший верхній великий кутній зуб", "Другий нижній малий кутній зуб.", "Перший в нижній малий кутній зуб."], "a": [0], "e": ["Перший верхній малий кутній зуб приблизно у половини людей має роздвоєний корінь.", "Другий верхній малий кутній зуб зазвичай має один корінь.", "Перший верхній великий кутній зуб має три корені.", "Нижні малі кутні зуби мають один корінь.", "Нижні малі кутні зуби мають один корінь."]}, {"n": "22.17", "q": "До лікаря-стоматолога звернувся підліток 15 років зі скаргами на неестетичний вигляд передніх зубів. Під час огляду: центральні різці верхньої щелепи мають бочкоподібну форму (ширші в ділянці шийки зуба), ріжучий край вищерблений. Поверхня емалі вкрита горизонтальними борозенками, зуби виглядають недорозвиненими. Яка вада розвитку зубів діагностована у чоловіка?", "o": ["Макродентія.", "Мікродентія.", "Зуби Гетчінсона (вроджений сифіліс).", "Гіподонтія.", "Гіпердонтія."], "a": [2], "e": ["Макродентія — збільшені зуби.", "Мікродентія — зменшені зуби.", "Зуби Гетчінсона: бочкоподібні різці з півмісяцевою вищербленістю краю, ознака вродженого сифілісу.", "Гіподонтія — менша кількість зубів.", "Гіпердонтія — надкомплектні зуби."]}, {"n": "22.18", "q": "Під час профілактичного огляду 5-річної дівчинки стоматолог описує розташування зубів за зубною формулою, де кожна цифра позначає порядковий номер зуба, рахуючи від серединної вертикальної лінії. Скільки зубів розташовано в одній половині зубної дуги у дитини цього віку?", "o": ["5.", "6.", "8.", "16.", "32."], "a": [0], "e": ["У п’ятирічної дитини молочний прикус: 5 зубів у половині щелепи (2 різці, ікло, 2 кутні).", "6 зубів у половині щелепи не буває ні в молочному, ні в постійному прикусі.", "8 зубів — постійний прикус.", "16 — кількість зубів на одній щелепі дорослого.", "32 — повний постійний прикус."]}, {"n": "22.19", "q": "Лікар-стоматолог проводить профілактичний огляд ротової порожнини у 30-річного чоловіка. Для опису порядку розташування зубів він користується зубною формулою, де кожна цифра відповідає певному зубу, починаючи від серединної лінії (між присередніми різцями). Скількі зубів розташовано у верхньощелепній зубній дузі, починаючи від серединної вертикальної лінії з кожного боку у дорослої людини?", "o": ["4.", "6.", "8.", "16.", "32."], "a": [2], "e": ["4 зуби — неповна половина.", "6 — не відповідає ні молочному, ні постійному прикусу.", "У дорослого в кожній половині щелепи 8 зубів.", "16 — кількість на всій щелепі.", "32 — усі зуби."]}, {"n": "22.20", "q": "Лікар-стоматолог оглянув чоловіка з гострим зубним болем. Під час обстеження діагностований пульпіт (запалення м’яких тканин зуба). Чим утворена пульпа зуба?", "o": ["Дентин, пухка сполучна тканина.", "Пухка сполучна тканина, кровоносні та лімфатичні судини, нерви.", "Кровоносні судини та нерви.", "Пухка сполучна тканина, дентин і нерви.", "Дентин, лімфатичні судини та нерви."], "a": [1], "e": ["Дентин — тверда тканина, не пульпа.", "Пульпа — пухка сполучна тканина з кровоносними і лімфатичними судинами та нервами.", "Без сполучної тканини пульпа неповна.", "Дентин не входить до пульпи.", "Дентин не входить до пульпи."]}, {"n": "22.21", "q": "У дівчинки батьки помітили появу за першими постійними великими кутніми зубами нові кутні зуби. Вони хвилюються чи це нормальний процес і чи не передчасне прорізування. Під час огляду стоматолог пояснив, що це постійні другі великі кутні зуби (другі моляри), які зазвичай прорізуються у певному віковому періоді. Які терміни прорізування постійних других великих кутніх зубів?", "o": ["6–7 років.", "7–8 років.", "10 років.", "11–12 років.", "16–24 роки."], "a": [3], "e": ["У 6–7 років прорізуються перші моляри.", "У 7–8 років — різці.", "У 10 років — малі кутні.", "Другі постійні великі кутні зуби прорізуються приблизно в 11–13 років.", "У 16–24 роки — зуби мудрості."]}, {"n": "22.22", "q": "Під час огляду ротової порожнини у чоловіка 45 років стоматолог виявив каріозну порожнину на поверхні коронки другого малого кутнього зуба, яка повернена до першого великого кутнього зуба. Яка поверхня коронки зуба уражена?", "o": ["Facies occlusalis.", "Facies vestibularis.", "Facies mesialis.", "Facies lingualis.", "Facies distalis."], "a": [4], "e": ["Жувальна поверхня звернена до зубів протилежної щелепи.", "Присінкова поверхня звернена до губ і щік.", "Присередня поверхня звернена до середини дуги (до попереднього зуба).", "Язикова поверхня звернена до язика.", "Поверхня, звернена від середини дуги до наступного зуба (до I моляра), — дистальна."]}, {"n": "22.23", "q": "23. Cтоматолог виявив каріозну порожнину ураженої емалі між двома верхніми центральними різцями. Які поверхні коронки зубів потрібно відпрепарувати лікарю?", "o": ["Facies contactus distalis.", "Facies labialis.", "Facies ocdusialis.", "Facies lingualis.", "Facies contactus mesialis."], "a": [4], "e": ["Дистальна поверхня звернена від середини, до бічних різців.", "Губна поверхня звернена до губи.", "Жувальної поверхні в різців немає.", "Язикова (піднебінна) поверхня звернена всередину.", "Між центральними різцями стикаються присередні контактні поверхні."]}, {"n": "22.24", "q": "До стоматологічної клініки звернувся 42-річний чоловік зі скаргами на сильний біль у верхньому великому кутньому зубі. Під час рентгенологічного дослідження виявлено каріозне ураження з поширенням на корені зуба. Лікар пояснює, що цей зуб має три корені, що ускладнює проведення ендодонтичного лікування та потребує особливої техніки при пломбуванні каналів. Які зуби мають три кореня?", "o": ["Верхні великі кутні зуби.", "Верхні малі кутні зуби.", "Нижні малі кутні зуби.", "Нижні великі кутні зуби.", "Всі великі кутні зуби."], "a": [0], "e": ["Верхні великі кутні зуби мають три корені (два щічні, один піднебінний).", "Верхні малі кутні зуби мають 1–2 корені.", "Нижні малі кутні зуби мають один корінь.", "Нижні великі кутні зуби мають два корені.", "Нижні великі кутні зуби мають два корені."]}, {"n": "22.25", "q": "До дитячого стоматолога звернулася мама 2-річної дитини зі скаргами на затримку прорізування зубів. Під час огляду дитини лікар відзначає наявність лише кількох різців і пояснює, що у цьому віці формується повний комплект молочних зубів, який має певну формулу. Знання цієї формули допомагає оцінити норму та виявити можливі порушення розвитку зубного ряду. Яка формула молочних зубів?", "o": ["2.1.0.2.", "2.0.1.1.", "1.2.0.2.", "0.2.1.2.", "1.2.2.0."], "a": [0], "e": ["Молочні зуби: 2 різці, 1 ікло, 0 малих кутніх, 2 великих кутні.", "Молочних малих кутніх зубів немає, а великих кутніх два.", "Різців у половині щелепи два, а не один.", "Різців два, не нуль.", "Молочних малих кутніх не буває."]}, {"n": "22.26", "q": "До стоматолога звернувся підліток для профілактичного огляду. Лікар відзначає, що у пацієнта вже прорізалися всі різці, ікла, малі та великі кутні зуби, але ще відсутні запізнілі зуби («зуби мудрості). Щоб оцінити, чи відповідає кількість зубів віковій нормі, стоматолог користується формулою постійних зубів, яка відображає кількість і типи зубів у кожній половині щелепи. Яка формула постійних зубів?", "o": ["2.1.2.3.", "2.2.1.3.", "2.2.3.1.", "1.2.2.3.", "3.2.1.1."], "a": [0], "e": ["Постійні зуби: 2 різці, 1 ікло, 2 малих кутні, 3 великих кутні.", "Ікол по одному, не по два.", "Малих кутніх два, великих три.", "Різців два, ікол одне.", "Різців два, ікол одне."]}, {"n": "22.27", "q": "До лікаря звернувся 45-річний чоловік зі скаргами на біль і набряк у ділянці перед вухом, що посилюється під час жування. При огляді відзначається асиметрія обличчя та збільшення слинної залози. Температура тіла – 38 °C. Лікар запідозрив паротит (запалення привушної слинної залози) та призначив ультразвукове дослідження. Де розташована glandula parotidea?", "o": ["На зовнішній поверхні гілки нижньої щелепи і заднього краю m. masseter.", "На внутрішній поверхні гілки нижньої щелепи і заднього краю m. masseter.", "На зовнішній поверхні гілки нижньої щелепи і переднього краю m. masseter.", "На внутрішній поверхні гілки нижньої щелепи і переднього краю m. masseter.", "На передній поверхні гілки нижньої щелепи і внутрішнього краю m. masseter."], "a": [0], "e": ["Привушна залоза лежить на зовнішній поверхні гілки нижньої щелепи і заднього краю жувального м’яза (і в занижньощелепній ямці).", "Внутрішня поверхня гілки прилягає до присереднього крилоподібного м’яза.", "Залоза лежить біля заднього, а не переднього краю жувального м’яза.", "На внутрішній поверхні залози немає.", "Передній край жувального м’яза — місце, де проходить привушна протока."]}, {"n": "22.28", "q": "До стоматолога звернулася 32-річна жінка зі скаргами на біль і набряк під нижньою щелепою, що посилюється під час прийому їжі. Пацієнтка зазначає, що симптоми з’явилися після перенесеної ангіни. При пальпації виявлено болюче ущільнення на дні ротової порожнини, а також збільшення ділянкових лімфатичних вузлів. Лікар запідозрив сіалоаденіт піднижньощелепної слинної залози. Де топографічно розташована glandula submandibularis?", "o": ["У піднижньощелепному трикутнику.", "У м’язовому трикутнику.", "У підборідному трикутнику.", "У занижньощеленній ямці.", "У язиковому трикутнику."], "a": [0], "e": ["Піднижньощелепна залоза лежить у піднижньощелепному трикутнику.", "М’язовий трикутник лежить нижче під’язикової кістки.", "Підборідний трикутник містить лімфовузли.", "У занижньощелепній ямці лежить привушна залоза.", "Язиковий трикутник — частина піднижньощелепного, залоза більша за нього."]}, {"n": "22.29", "q": "Педіатр оглядає дитину у якої вже є різці та ікла, але з’явилися набряклість і почервоніння ясен у задніх відділах коміркової дуги нижньої щелепи. Це ознаки прорізування перших нижніх молочних великих кутніх зубів. У яких місяцях життя дитини прорізуються молочні перші нижні великі кутні зуби?", "o": ["6–8 місяців.", "7–9 місяців.", "12–16 місяців.", "16–17 місяців.", "18–20 місяців."], "a": [2], "e": ["У 6–8 місяців прорізуються присередні нижні різці.", "У 7–9 місяців — верхні присередні різці.", "Перші молочні великі кутні зуби прорізуються у 12–16 місяців.", "У 16–17 місяців — ікла.", "У 18–20 місяців — ікла/другі молочні кутні."]}, {"n": "22.30", "q": "У дівчинки ясна між різцями та молочними кутніми зубами набряклі та болючі при дотику. Це ознаки прорізування молочних ікол, які з’являються після різців і перед першими молочними великими кутніми зубами. Які терміни прорізування молочних ікол?", "o": ["6–8 місяців.", "7–9 місяців.", "12–15 місяців.", "15–20 місяців.", "20–24 місяці."], "a": [3], "e": ["У 6–8 місяців прорізуються присередні різці.", "У 7–9 місяців — різці.", "У 12–15 місяців — перші молочні кутні.", "Молочні ікла прорізуються у 16–20 місяців.", "У 20–24 місяці — другі молочні кутні."]}], "models": [["Зуби, ясна і язик", "sf:c4c569f0e08948e2a572007a7a5726f2", {"ru": "Зубы, дёсны и язык", "en": "Teeth, gums and tongue"}], ["Щелепи і зуби (анімація)", "sf:11d687b08cd94937831430cccb9a6870", {"ru": "Челюсти и зубы (анимация)", "en": "Jaws and teeth (animated)"}], ["Травна система", "sf:2d3771dd6b8940ffa2312bd97aca6fc3", {"ru": "Пищеварительная система", "en": "Digestive system"}]]}, {"id": "topic23", "title": "23. Глотка. Стравохід. Шлунок. Ділянки живота", "tr": {"ru": "23. Глотка. Пищевод. Желудок. Области живота", "en": "23. Pharynx. Esophagus. Stomach. Abdominal regions"}, "questions": [{"n": "23.1", "q": "У підлітка після травми слизової оболонки ротової частини глотки виявлено заглотковий абсцес. Лікар планує розріз тканин задньої стінки глотки з метою видалення гною. На рівні яких хребців знаходиться ротова частина глотки?", "o": ["На рівні I–II шийних.", "На рівні II–III шийних.", "На рівні III шийного.", "На рівні IV–V шийних.", "На рівні V–VI шийних."], "a": [2], "e": ["На рівні I–II шийних хребців лежить носова частина глотки.", "II–III — частково охоплює носоглотку; класично ротова частина відповідає III хребцю.", "Ротова частина глотки роз
