й закуток відкривається клиноподібна пазуха."]}, {"n": "7.19", "q": "Лікар при обстеженні хворого виявив ознаки ушкодження слизової оболонки носової порожнини (нежить) та симптоми подразнення оболон головного мозку. Лікар діагностував наявність фронтиту (запалення слизової оболонки лобової пазухи). З якого носового ходу стало можливим розповсюдження інфекції з носової порожнини в цю пазуху?", "o": ["Meatus nasi communis.", "Meatus nasi superior.", "Meatus nasi medius.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — простір між раковинами і перегородкою.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Лобова пазуха відкривається в середній носовий хід.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід веде в глотку."]}, {"n": "7.20", "q": "В лікарню машина швидкої медичної допомоги доставила чоловіка з травмою носа. Лікар встановив перелом кістки черепа, що обмежує верхній край грушоподібного отвору кісткової носової порожнини. Яка кістка ушкоджена в даному випадку?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [3], "e": ["Сльозова кістка розташована в очній ямці.", "Верхня щелепа обмежує грушоподібний отвір знизу і з боків.", "Лобова кістка не обмежує грушоподібний отвір.", "Верхній край грушоподібного отвору утворюють носові кістки.", "Решітчаста кістка розташована глибше всередині носової порожнини."]}, {"n": "7.21", "q": "Обстежуючи жінку, 45 років, лікар встановив розповсюдження запалення з ділянки іклової ямки в очну ямку. Через який утвір черепа поширилося запалення?", "o": ["Верхню очноямкову щілину.", "Передній решітчастий отвір", "Підочноямковий канал.", "Нижню очноямкову щілину.", "Носо-сльозовий канал."], "a": [2], "e": ["Верхня очноямкова щілина з'єднує очну ямку з порожниною черепа.", "Передній решітчастий отвір з'єднує очну ямку з черепом.", "Підочноямковий канал відкривається підочноямковим отвором над ікловою ямкою і з'єднує її ділянку з очною ямкою.", "Нижня очноямкова щілина веде в крило-піднебінну ямку.", "Носо-сльозовий канал веде в нижній носовий хід."]}, {"n": "7.22", "q": "У чоловіка діагностовано запалення слизової оболонки лобової пазухи. В який з носових ходів спочатку буде прямувати запальна рідина?", "o": ["Середній носовий хід.", "Спільний носовий хід.", "Верхній носовий хід.", "Нижній носовий хід.", "Носо-глотковий хід."], "a": [0], "e": ["Лобова пазуха відкривається через решітчасту лійку в середній носовий хід.", "Спільний носовий хід не має отворів пазух.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носо-глотковий хід — задній відділ, пазухи сюди не відкриваються."]}, {"n": "7.23", "q": "Жінка потрапила в нейрохірургічне відділення з внутрішньочерепною пухлиною. Додаткове обстеження хворої показало, що пухлина зруйнувала кістки, що утворюють верхню стінку очної ямки. Які кістки ушкоджені пухлиною?", "o": ["Клиноподібна кістка, піднебінна кістка.", "Очноямкова пластинка решітчастої кістки, луска лобової кістки.", "Очноямкова частина лобової кістки, велике крило клиноподібної кістки.", "Очноямкова частина лобової кістки, мале крило клиноподібної кістки.", "Очноямкова пластинка решітчастої кістки, очноямкова частина лобової кістки."], "a": [3], "e": ["Піднебінна кістка утворює нижню стінку, а не верхню.", "Очноямкова пластинка решітчастої кістки утворює присередню стінку; луска лобової кістки — склепіння.", "Велике крило клиноподібної кістки утворює бічну стінку.", "Верхню стінку утворюють очноямкова частина лобової кістки та мале крило клиноподібної кістки.", "Очноямкова пластинка решітчастої кістки утворює присередню стінку, а не верхню."]}, {"n": "7.24", "q": "Чоловік госпіталізований для корекції викривлення носової перегородки. Які кістки підлягають корекції в даному випадку?", "o": ["Носова кістка, вертикальна пластинка піднебінної кістки.", "Перпендикулярна пластинка решітчастої кістки, леміш.", "Перпендикулярна пластинка піднебінної кістки, леміш.", "Носова кістка, леміш.", "Горизонтальна пластинка піднебінної кістки, нижня носова раковина."], "a": [1], "e": ["Носова кістка утворює спинку носа, піднебінна кістка — бічну стінку і дно.", "Кісткову носову перегородку утворюють перпендикулярна пластинка решітчастої кістки та леміш.", "Перпендикулярна пластинка піднебінної кістки утворює бічну стінку носової порожнини.", "Носова кістка не входить до перегородки.", "Горизонтальна пластинка піднебінної кістки утворює дно, нижня раковина — бічну стінку."]}, {"n": "7.25", "q": "У жінки, 48 років, діагностовано гострий запальний процес слизової оболонки носо-сльозової протоки. З анамнезу стало відомо, що після перенесеного грипу протягом 10 днів були виділення з носу. З якого відділу носової порожнини інфекція могла проникнути у носо-сльозовий канал?", "o": ["З нижнього носового ходу.", "З середнього носового ходу.", "З верхнього носового ходу.", "З присінку носа.", "З лобової пазухи."], "a": [0], "e": ["Носо-сльозова протока відкривається в нижній носовий хід — звідти інфекція могла піднятися.", "У середній носовий хід відкриваються пазухи, а не носо-сльозова протока.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Присінок носа не сполучається з носо-сльозовою протокою.", "Лобова пазуха відкривається в середній носовий хід."]}, {"n": "7.26", "q": "У хворого хлопчика на гайморит порушено сполучення верхньощелепної пазухи з середнім носовим ходом. Який утвір в нормі забезпечує надходження повітря з носового ходу до гайморової пазухи?", "o": ["Canalis nasolacrimalis.", "Foramina ethmoidalia.", "Infundibulum ethmoidale.", "Hiatus semilunaris.", "Recessus sphenoethmoidalis."], "a": [3], "e": ["Носо-сльозовий канал веде в нижній носовий хід.", "Решітчасті отвори з'єднують очну ямку з черепом.", "Решітчаста лійка — шлях від лобової пазухи.", "Півмісяцевий розтвір (hiatus semilunaris) з'єднує середній носовий хід з верхньощелепною пазухою.", "У клино-решітчастий закуток відкривається клиноподібна пазуха."]}, {"n": "7.27", "q": "Жінка, 27 років, звернулась до лікаря зі скаргами на головний біль після перенесеного риніту. При обстеженні на рентгенограмі — затемнення верхньощелепної пазухи. Яким шляхом розповсюдилась інфекція у верхньощелепну пазуху?", "o": ["Через решітчасту лійку.", "Через нижній носовий хід.", "Через верхньощелепний розтвір.", "Через задні решітчасті комірки.", "Через передні решітчасті комірки."], "a": [2], "e": ["Через решітчасту лійку відкривається лобова пазуха.", "У нижній носовий хід відкривається носо-сльозова протока.", "Інфекція проникає через верхньощелепний розтвір (hiatus maxillaris), що відкривається в середній носовий хід.", "Задні решітчасті комірки відкриваються у верхній носовий хід.", "Передні решітчасті комірки сполучаються з середнім носовим ходом, але не з пазухою."]}, {"n": "7.28", "q": "У жінки після травми ока виникло гнійне запалення м'яких тканин очної ямки. Пізніше це запалення поширилось у крило-піднебінну ямку. Через який анатомічний утвір гнійний процес поширився у цю ямку?", "o": ["Через круглий отвір", "Через нижню очноямкову щілину.", "Через клино-піднебінний отвір.", "Через верхню очноямкову щілину.", "Через вилично-очноямковий отвір."], "a": [1], "e": ["Круглий отвір веде з крило-піднебінної ямки в середню черепну ямку, а не в очну ямку.", "Нижня очноямкова щілина з'єднує очну ямку з крило-піднебінною ямкою.", "Клино-піднебінний отвір з'єднує крило-піднебінну ямку з носовою порожниною.", "Верхня очноямкова щілина веде в середню черепну ямку.", "Вилично-очноямковий отвір веде у вилично-лицевий і вилично-скроневий канальці."]}, {"n": "7.29", "q": "Жінка потрапила в лікарню з гнійним запаленням комірок соскоподібного відростка. Запалення поширилося у черепну ямку, яка має загальну стінку з цим відростком. В яку ямку черепа розповсюдилося запалення із соскоподібного відростка?", "o": ["В середню черепну ямку.", "В передню черепну ямку.", "В підскроневу ямку.", "В крило-піднебінну ямку.", "В задню черепну ямку."], "a": [4], "e": ["Середня черепна ямка межує з передньою поверхнею піраміди та покрівлею барабанної порожнини, а не з соскоподібним відростком.", "Передня черепна ямка розташована над очними ямками й носовою порожниною.", "Підскронева ямка — зовнішня ямка під виличною дугою, не черепна.", "Крило-піднебінна ямка розташована позаду верхньої щелепи.", "Соскоподібний відросток прилягає до задньої черепної ямки: на його внутрішній поверхні борозна сигмоподібної пазухи."]}, {"n": "7.30", "q": "У жінки з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми ураження задніх комірок лабіринту решітчастої кістки. У який з носових ходів буде потрапляти гній?", "o": ["Середній носовий хід.", "Спільний носовий хід.", "Верхній носовий хід.", "Нижній носовий хід.", "Носо-глотковий хід."], "a": [2], "e": ["У середній носовий хід відкриваються передні та середні решітчасті комірки.", "Спільний носовий хід не має отворів пазух.", "Задні решітчасті комірки відкриваються у верхній носовий хід.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носо-глотковий хід не сполучається з решітчастими комірками."]}], "models": [["Сагітальний розріз черепа (носова порожнина)", "sf:5e73a548332742c8bc722d5f14ae35f0"], ["Череп з підписами", "o3d:overview-skull"]]}, {"id": "topic8", "title": "8. Кістки верхньої кінцівки (ossa membri superioris)", "questions": [{"n": "8.1", "q": "Під час проведення рентгенографії верхньої кінцівки у жінки 34 років виявлена тріщина на задній поверхні діафіза плечової кістки в місці борозни, до якої прилягає довга гілка плечового сплетення. В ділянці якої борозни ушкоджена плечова кістка?", "o": ["Міжгорбкова борозна.", "Передня бічна ліктьова борозна.", "Борозна ліктьового нерва.", "Борозна серединного нерва.", "Борозна променевого нерва."], "a": [4], "e": ["Міжгорбкова борозна — на передній поверхні проксимального кінця, для сухожилка довгої голівки двоголового м'яза.", "Передньої бічної ліктьової борозни на плечовій кістці немає — це борозна в м'яких тканинах ліктьової ямки.", "Борозна ліктьового нерва — на задній поверхні присереднього надвиростка, не на діафізі.", "Борозни серединного нерва на плечовій кістці немає.", "Борозна променевого нерва спірально огинає задню поверхню діафіза плечової кістки."]}, {"n": "8.2", "q": "У дитини 2-х років рентгенолог спостерігає темні смуги на місці хряща, що відокремлює ядра скостеніння головки плечової кістки. У якому віці ядра скостеніння зливаються в єдину головку плечової кістки?", "o": ["0–1 рік.", "1–2 роки", "2–3 роки.", "4–6 років.", "6–8 років."], "a": [3], "e": ["У 0–1 рік ядра скостеніння головки тільки з'являються.", "У 1–2 роки ядра ще розділені хрящем.", "У 2–3 роки ядра ще не злилися.", "Ядра скостеніння головки, великого й малого горбків зливаються в єдину головку приблизно у 4–6 років.", "У 6–8 років головка вже сформована, але ще відокремлена від діафіза епіфізарним хрящем."]}, {"n": "8.3", "q": "Вивчаючи рентгенограму кисті дитини, лікар побачив ядра скостеніння тільки в os capitatum, os hamatum та os triquetrum. Скільки років дитині?", "o": ["6 місяців.", "1 рік.", "3 роки.", "4 роки.", "5 років."], "a": [2], "e": ["До 6 місяців ядро є лише в головчастій (і гачкуватій) кістках, тригранна ще без ядра.", "У 1 рік є ядра головчастої й гачкуватої кісток, тригранна ще без ядра.", "Ядро тригранної кістки з'являється близько 3 років, поки є лише головчаста, гачкувата і тригранна.", "У 4 роки з'являється ядро півмісяцевої кістки.", "У 5 років вже є ядро і в човноподібній кістці."]}, {"n": "8.4", "q": "Чоловіка 50 років госпіталізовано в хірургічне відділення лікарні з раною ліктьового суглоба в ділянці присереднього краю передпліччя. Лікар констатує, що у чоловіка ушкоджений відросток, який спереду межує з блоковою вирізкою та формує її передню губу. Який відросток ушкоджено?", "o": ["Бічний надвиросток.", "Вінцевий відросток.", "Шилоподібний відросток ліктьової кістки.", "Шилоподібний відросток променевої кістки.", "Дзьобоподібний відросток."], "a": [1], "e": ["Бічний надвиросток належить плечовій кістці.", "Вінцевий відросток ліктьової кістки утворює передній край (губу) блокової вирізки.", "Шилоподібний відросток ліктьової кістки — на дистальному кінці.", "Шилоподібний відросток променевої кістки — на дистальному кінці.", "Дзьобоподібний відросток належить лопатці."]}, {"n": "8.5", "q": "У чоловіка 54 років рентгенологічно визначено внутрішньосуглобовий перелом проксимального епіфіза плечової кістки. Який утвір плечової кістки ушкоджений?", "o": ["Головка плечової кістки.", "Хірургічна шийка", "Гребінь великого горбка.", "Гребінь малого горбка.", "Малий горбок."], "a": [0], "e": ["Головка плечової кістки — єдиний утвір у списку, розташований усередині суглоба.", "Хірургічна шийка розташована нижче горбків, поза суглобом.", "Гребінь великого горбка лежить поза суглобовою порожниною.", "Гребінь малого горбка лежить поза суглобовою порожниною.", "Малий горбок лежить поза суглобовою порожниною."]}, {"n": "8.6", "q": "Лікар проводить огляд юнака із травмою верхньої кінцівки, яку він отримав під час падіння на витягнуту руку з опорою на долоню. Після рентгенологічного обстеження лікар констатував перелом зап'ястової суглобової поверхні кістки передпліччя, що розташована на боці великого пальця кисті, та кістки проксимального ряду зап'ястка, що контактують між собою. Перелом яких кісток діагностований у юнака?", "o": ["Ulna та os pisiforme.", "Radius та os scaphoideum.", "Ulna та os hamatum.", "Radius та os lunatum.", "Ulna та os capitatum."], "a": [1], "e": ["Ліктьова кістка лежить з боку мізинця і не контактує з горохоподібною кісткою суглобом.", "Променева кістка розташована з боку великого пальця й з'єднується з човноподібною кісткою в променево-зап'ястковому суглобі.", "Ліктьова кістка не з'єднується з гачкуватою кісткою.", "Півмісяцева кістка з'єднується з променевою, але типовий перелом при падінні на долоню — човноподібної.", "Головчаста кістка належить до дистального ряду."]}, {"n": "8.7", "q": "Медичний експерт досліджує кисть дитини. На рентгенограмі виявлено наявність ядер скостеніння в os capitatum, os hamatum, os triquetrum, os lunatum. В os scaphoideum ядро скостеніння відсутнє. Скільки років дитині?", "o": ["До 3 місяців.", "До 1 року.", "До 3 років.", "До 4 років.", "До 5 років."], "a": [4], "e": ["До 3 місяців немає ще жодних ядер, крім головчастої.", "До 1 року є ядра головчастої і гачкуватої кісток, інших немає.", "До 3 років немає ядра півмісяцевої кістки.", "До 4 років ще немає ядра півмісяцевої кістки, а тут воно вже є.", "Ядро в човноподібній кістці з'являється близько 5 років, тому дитині до 5 років."]}, {"n": "8.8", "q": "Жінка 50 років після падіння звернулася у травматологічне відділення лікарні зі скаргами на біль у плечовій ділянці та обмеження рухів у плечовому суглобі. Під час рентгенологічного обстеження виявлено перелом плечової кістки у «типовому» місці. Яка анатомічна ділянка плечової кістки найімовірніше ушкоджена?", "o": ["Шийка лопатки.", "Надплечовий кінець ключиці.", "Анатомічна шийка плечової кістки.", "Хірургічна шийка плечової кістки.", "Дельтоподібна горбистість."], "a": [3], "e": ["Шийка лопатки не входить до плечової кістки.", "Надплечовий кінець ключиці — частина ключиці.", "Анатомічна шийка ламається рідко.", "Хірургічна шийка — «типове» місце перелому плечової кістки, особливо у літніх.", "Дельтоподібна горбистість — на діафізі, рідше місце перелому."]}, {"n": "8.9", "q": "Вивчаючи рентгенограму плечової ділянки підлітка, лікар помилково сприйняв ядро скостеніння акроміона лопатки за уламок кістки. У якому віці формується повний синостоз лопатки?", "o": ["9–10 років.", "11–12 років.", "13–14 років.", "15–16 років.", "18–24 роки."], "a": [4], "e": ["У 9–10 років лопатка ще має окремі ядра скостеніння.", "У 11–12 років ядро акроміона тільки з'являється.", "У 13–14 років синостоз ще не завершений.", "У 15–16 років синостоз ще триває.", "Повний синостоз лопатки (з акроміоном) завершується у 18–24 роки."]}, {"n": "8.10", "q": "Жінка 46 років під час падіння на лікоть отримала перелом головочки на нижньому наростку однієї з кісток верхньої кінцівки. Яка з перерахованих кісток має головочку на нижньому наростку кістки?", "o": ["Плечова кістка.", "Ліктьова кістка.", "Променева кістка.", "Лопатка.", "Ключиця."], "a": [0], "e": ["Головочка (capitulum humeri) розташована на виростку дистального кінця плечової кістки.", "Ліктьова кістка має блокову вирізку, а не головочку.", "Променева кістка має головку на проксимальному кінці, а не головочку на виростку.", "Лопатка має суглобову западину.", "Ключиця не має головочки."]}, {"n": "8.11", "q": "У жінки 46 років після падіння виявлено перелом кістки верхньої кінцівки, одразу проксимальніше надвиростків. Перелом якої кістки має місце в цьому випадку?", "o": ["Плечова кістка.", "Ліктьова кістка.", "Променева кістка.", "Лопатка.", "Ключиця."], "a": [0], "e": ["Надвиростки (медіальний і латеральний) є лише на дистальному кінці плечової кістки.", "Ліктьова кістка не має надвиростків.", "Променева кістка не має надвиростків.", "Лопатка не має надвиростків.", "Ключиця не має надвиростків."]}, {"n": "8.12", "q": "У чоловіка 37 років внаслідок виробничої травми ушкоджено нижню третину передньої плечової ділянки. Який утвір, що розташований на дистальному наростку плечової кістки, ушкоджений?", "o": ["Хірургічна шийка.", "Присередній надвиросток.", "Анатомічна шийка.", "Надплечовий відросток.", "Дзьобоподібний відросток."], "a": [1], "e": ["Хірургічна шийка — на проксимальному кінці плечової кістки.", "Присередній надвиросток розташований на дистальному кінці плечової кістки.", "Анатомічна шийка — на проксимальному кінці.", "Надплечовий відросток (акроміон) належить лопатці.", "Дзьобоподібний відросток належить лопатці."]}, {"n": "8.13", "q": "В травматологічне відділення госпіталізовано юнака з травмою кисті. Діагностовано перелом кістки проксимального ряду кісток зап'ястка, яка з'єднується із кісткою-трапецією. Яка кістка зазнала ушкодження?", "o": ["Головчаста кістка.", "Півмісяцева кістка.", "Човноподібна кістка.", "Горохоподібна кістка.", "Тригранна кістка."], "a": [2], "e": ["Головчаста кістка належить до дистального ряду.", "Півмісяцева кістка не з'єднується з трапецією.", "Човноподібна кістка проксимального ряду з'єднується з кісткою-трапецією.", "Горохоподібна кістка з'єднується лише з тригранною.", "Тригранна кістка з'єднується з гачкуватою, а не з трапецією."]}, {"n": "8.14", "q": "До приймального відділення госпіталізовано чоловіка 50 років із виробничою травмою. Рентгенологічно діагностовано перелом кістки зап'ястка, що з'єднується з першою п'ястковою кісткою. Яка кістка ушкоджена?", "o": ["Півмісяцева.", "Гачкувата.", "Човноподібна.", "Тригранна.", "Кістка-трапеція."], "a": [4], "e": ["Півмісяцева кістка не з'єднується з п'ястковими кістками.", "Гачкувата кістка з'єднується з IV–V п'ястковими кістками.", "Човноподібна кістка належить до проксимального ряду.", "Тригранна кістка — проксимальний ряд.", "Кістка-трапеція утворює сідлоподібний суглоб з I п'ястковою кісткою."]}, {"n": "8.15", "q": "До лікарні звернулася жінка 65 років із травмою кисті. Під час рентгенологічного обстеження діагностовано перелом п'ясткової кістки, яка своєю основою контактує з головчастою кісткою. Перелом якої кістки встановлено?", "o": ["Os metacarpale I.", "Os metacarpale II.", "Os metacarpale III.", "Os metacarpale IV.", "Os metacarpale V."], "a": [2], "e": ["I п'ясткова кістка з'єднується з кісткою-трапецією.", "II п'ясткова кістка з'єднується з трапецієподібною кісткою (і частково з трапецією та головчастою).", "III п'ясткова кістка з'єднується основою з головчастою кісткою.", "IV п'ясткова кістка з'єднується з гачкуватою кісткою (частково з головчастою).", "V п'ясткова кістка з'єднується з гачкуватою кісткою."]}, {"n": "8.16", "q": "Під час автомобільної аварії дитина отримала перелом кістки верхньої кінцівки зі зміщенням уламків. Лікар проводить огляд рентгенограми, на якій описує лінію перелому вздовж блокової вирізки на проксимальному кінці травмованої кістки. Яка кістка ушкоджена?", "o": ["Променева.", "Ліктьова.", "Човноподібна.", "Півмісяцева.", "Плечова."], "a": [1], "e": ["Променева кістка має на проксимальному кінці головку, а не блокову вирізку.", "Блокова вирізка розташована на проксимальному кінці ліктьової кістки.", "Човноподібна кістка — кістка зап'ястка.", "Півмісяцева кістка — кістка зап'ястка.", "Плечова кістка має блок, а не блокову вирізку."]}, {"n": "8.17", "q": "У травматологічне відділення лікарні госпіталізовано юнака. Під час обстеження діагностовано перелом відростка кістки передпліччя, який разом із вінцевим відростком утворює блокову вирізку (incisura trochlearis). Який відросток та яка кістка зазнали перелому?", "o": ["Дзьобоподібний відросток лопатки.", "Надплечовий відросток лопатки.", "Ліктьовий відросток ліктьової кістки.", "Шилоподібний відросток променевої кістки.", "Шилоподібний відросток ліктьової кістки."], "a": [2], "e": ["Дзьобоподібний відросток належить лопатці.", "Надплечовий відросток належить лопатці.", "Ліктьовий відросток (olecranon) разом з вінцевим утворює блокову вирізку ліктьової кістки.", "Шилоподібний відросток променевої кістки — на дистальному кінці.", "Шилоподібний відросток ліктьової кістки — на дистальному кінці."]}, {"n": "8.18", "q": "Після дорожньо-транспортної пригоди у лікарню госпіталізовано чоловіка 70 років. Під час обстеження встановлено перелом утвору лопатки, який є продовженням її ості. Який анатомічний утвір лопатки ушкоджений?", "o": ["Angulus inferior.", "Angulus superior.", "Tuberculum supraglenoidale.", "Processus coracoideus.", "Acromion."], "a": [4], "e": ["Нижній кут лопатки — місце сходження присереднього та бічного країв.", "Верхній кут лопатки — між верхнім і присереднім краями.", "Надсуглобовий горбок — над суглобовою западиною.", "Дзьобоподібний відросток відходить від верхнього краю.", "Акроміон — бічне продовження ості лопатки."]}, {"n": "8.19", "q": "У травматологічне відділення госпіталізовано юнака з травмою кисті. Рентгенологічно діагностовано перелом кістки проксимального ряду кісток зап'ястка, яка з'єднується з кісткою-трапецією та має горбок, обернений у бік долоні. Яка кістка зазнала травмування?", "o": ["Півмісяцева.", "Гачкувата.", "Човноподібна.", "Тригранна.", "Горохоподібна."], "a": [2], "e": ["Півмісяцева кістка не з'єднується з трапецією.", "Гачкувата кістка має гачок, обернений до долоні, але належить до дистального ряду.", "Човноподібна кістка має горбок, обернений у бік долоні, і з'єднується з трапецією.", "Тригранна кістка не з'єднується з трапецією.", "Горохоподібна кістка не з'єднується з трапецією."]}, {"n": "8.20", "q": "У травматологічне відділення лікарні звернувся чоловік 34 років зі скаргами на гострий біль у плечовому суглобі та обмеження рухів в ньому після виробничої травми. На рентгенограмі діагностовано перелом дзьобоподібного відростка та ушкодження склепіння плеча. Перелом якої кістки має місце в цьому випадку?", "o": ["Плечової кістки.", "Ліктьової кістки.", "Променевої кістки.", "Лопатки.", "Ключиці."], "a": [3], "e": ["Плечова кістка не має дзьобоподібного відростка.", "Ліктьова кістка має вінцевий відросток, не дзьобоподібний.", "Променева кістка не має дзьобоподібного відростка.", "Дзьобоподібний відросток належить лопатці; разом з акроміоном і зв'язкою утворює склепіння плеча.", "Ключиця не має дзьобоподібного відростка."]}, {"n": "8.21", "q": "Жінку після падіння на долонну поверхню кисті турбує біль у ділянці анатомічної табакерки і обмеження рухів великого пальця. Під час рентгенологічного обстеження діагностовано перелом кістки зап'ястка, суглобова поверхня якої контактує з бічною частиною зап'ясткової суглобової поверхні променевої кістки. Яка кістка ушкоджена?", "o": ["Os hamatum.", "Os scaphoideum.", "Os pisiforme.", "Os trapezium.", "Os triquetrum."], "a": [1], "e": ["Гачкувата кістка — дистальний ряд, з боку мізинця.", "Човноподібна кістка з'єднується з бічною частиною зап'ясткової поверхні променевої кістки і лежить в анатомічній табакерці.", "Горохоподібна кістка розташована з боку мізинця.", "Трапеція — дистальний ряд, не з'єднується з променевою кісткою.", "Тригранна кістка не контактує з променевою кісткою."]}, {"n": "8.22", "q": "Чоловік 37 років отримав виробничу травму нижньої третини плеча. Під час рентгенологічного обстеження у травмпункті виявлено ушкодження у присередній частині виростка плечової кістки (condylus humeri). Яка структура ушкоджена?", "o": ["Головочка плечової кістки (capitulum humeri).", "Блок плечової кістки (trochlea humeri).", "Вінцева ямка (fossa coronoidea).", "Присередній надвиросток (epicondylus medialis).", "Бічний надвиросток (epicondylus lateralis)."], "a": [1], "e": ["Головочка розташована у бічній частині виростка.", "Блок плечової кістки — присередня частина виростка, зчленовується з ліктьовою кісткою.", "Вінцева ямка — заглибина над блоком, не частина виростка.", "Присередній надвиросток — виступ над виростком, а не частина виростка.", "Бічний надвиросток — з бічного боку."]}, {"n": "8.23", "q": "Юнак звернувся до лікарні із травмою верхньої кінцівки, яку отримав внаслідок падіння на витягнуту руку з опорою на долоню під час гри в баскетбол. На рентгенівському знімку лікар описав лінію перелому вздовж ліктьової вирізки на дистальному кінці травмованої кістки. Утвір якої кістки ушкоджений?", "o": ["Плечова кістка.", "Ліктьова кістка.", "Променева кістка.", "Лопатка.", "Ключиця."], "a": [2], "e": ["Плечова кістка не має ліктьової вирізки.", "Ліктьова кістка має променеву вирізку, а не ліктьову.", "Ліктьова вирізка розташована на дистальному кінці променевої кістки.", "Лопатка не має ліктьової вирізки.", "Ключиця не має ліктьової вирізки."]}, {"n": "8.24", "q": "У травматологічне відділення лікарні госпіталізовано чоловіка 65 років з травмою верхньої кінцівки. Рентгенологічно виявлено перелом кістки грудного пояса. Лінія перелому проходить вздовж трапецієподібної лінії біля конусоподібного горбка. Яка кістка верхньої кінцівки зазнала ушкодження?", "o": ["Clavicula.", "Ulna.", "Radius.", "Scapula.", "Os scaphoideum."], "a": [0], "e": ["Трапецієподібна лінія і конусоподібний горбок розташовані на нижній поверхні ключиці.", "Ліктьова кістка не належить до грудного пояса.", "Променева кістка не належить до грудного пояса.", "Лопатка належить до пояса, але цих утворів не має.", "Човноподібна кістка — кістка зап'ястка."]}, {"n": "8.25", "q": "У травматологічне відділення лікарні госпіталізовано чоловіка 45 років з травмою кисті. Після обстеження діагностовано перелом кістки, яка своєю основою з'єднується з кісткою-трапецією. Яка кістка травмована в цьому випадку?", "o": ["Os metacarpale I.", "Os metacarpale II.", "Os metacarpale III.", "Os metacarpale IV.", "Os metacarpale V."], "a": [0], "e": ["I п'ясткова кістка з'єднується основою з кісткою-трапецією.", "II п'ясткова кістка з'єднується переважно з трапецієподібною кісткою.", "III п'ясткова кістка з'єднується з головчастою кісткою.", "IV п'ясткова кістка з'єднується з гачкуватою.", "V п'ясткова кістка з'єднується з гачкуватою."]}, {"n": "8.26", "q": "Чоловік 37 років у виробничих умовах отримав перелом кістки зап'ястка, яка контактує одночасно з променевою кісткою та півмісяцевою кісткою? Яка це кістка?", "o": ["Головчаста.", "Човноподібна.", "Горохоподібна.", "Тригранна.", "Трапецієподібна."], "a": [1], "e": ["Головчаста кістка — дистальний ряд, з променевою не контактує.", "Човноподібна кістка з'єднується з променевою кісткою і з півмісяцевою кісткою.", "Горохоподібна кістка з'єднується лише з тригранною.", "Тригранна кістка з'єднується з півмісяцевою, але не з променевою кісткою.", "Трапецієподібна кістка — дистальний ряд."]}, {"n": "8.27", "q": "У лікарню госпіталізовано чоловіка 32 років із глибокою різаною раною верхньої кінцівки. Під час обстеження виявлено ушкодження ліктьового нерва в ділянці ліктьової борозни. Яка кістка має борозну ліктьового нерва?", "o": ["Променева кістка.", "Ліктьова кістка.", "Ключиця.", "Лопатка.", "Плечова кістка."], "a": [4], "e": ["Променева кістка не має борозни ліктьового нерва.", "Ліктьова кістка не має борозни ліктьового нерва.", "Ключиця не має такої борозни.", "Лопатка не має такої борозни.", "Борозна ліктьового нерва — на задній поверхні присереднього надвиростка плечової кістки."]}, {"n": "8.28", "q": "Жінка 60 років посковзнулася на льоду та впала на руку. Жінка скаржиться на біль у плечовій ділянці, що посилюється при рухах у плечовому суглобі. Під час огляду хворої виявлено укорочення верхньої кінцівки. Рентгенологічно встановлено перелом плечової кістки між проксимальним кінцем і її діафізом. У ділянці якого утвору плечової кістки діагностований перелом?", "o": ["Анатомічної шийки плечової кістки.", "Хірургічної шийки плечової кістки.", "Внутрішньосуглобовий перелом головки плечової кістки.", "Діафіза плечової кістки.", "Дистального епіфіза плечової кістки."], "a": [1], "e": ["Анатомічна шийка відмежовує головку від горбків.", "Хірургічна шийка — місце переходу проксимального кінця в діафіз нижче горбків.", "Головка — внутрішньосуглобовий утвір.", "Діафіз розташований нижче хірургічної шийки.", "Дистальний епіфіз — біля ліктьового суглоба."]}, {"n": "8.29", "q": "Під час операції з приводу перелому кістки верхньої кінцівки хірург з'єднує за допомогою металевої пластини уламки кістки в ділянці дельтоподібної горбистості. Яка кістка верхньої кінцівки ушкоджена?", "o": ["Променева кістка.", "Ліктьова кістка.", "Ключиця.", "Лопатка.", "Плечова кістка."], "a": [4], "e": ["Променева кістка має горбистість променевої кістки.", "Ліктьова кістка має горбистість ліктьової кістки.", "Ключиця не має дельтоподібної горбистості.", "Лопатка не має дельтоподібної горбистості.", "Дельтоподібна горбистість — на бічній поверхні діафіза плечової кістки."]}, {"n": "8.30", "q": "Рентгенолог, вивчаючи рентгенограму кисті, знаходить перелом кістки, з якою з'єднуються суглобові поверхні основи четвертої та п'ятої п'ясткових кісток. Перелом якої кістки встановив рентгенолог?", "o": ["Os scaphoideum.", "Os capitatum.", "Os pisiforme.", "Os triquetrum.", "Os hamatum."], "a": [4], "e": ["Човноподібна кістка — проксимальний ряд.", "Головчаста кістка з'єднується з III п'ястковою кісткою.", "Горохоподібна кістка не з'єднується з п'ястковими кістками.", "Тригранна кістка не з'єднується з п'ястковими кістками.", "Гачкувата кістка з'єднується з основами IV та V п'ясткових кісток."]}], "models": [["Верхня кінцівка", "o3d:upper-limb"], ["Кисть і зап'ясток", "o3d:hand"], ["Кістки руки різними кольорами", "sf:cd61a00896f24338b394f44772b5a45d"]]}, {"id": "topic9", "title": "9. Кістки нижньої кінцівки (ossa membri inferioris)", "questions": [{"n": "9.1", "q": "Стопа людини еволюційно пристосована до функції опори та амортизації, що забезпечується її жорсткою кістковою структурою та меншою рухливістю порівняно з кистю. Яка кількість кісток утворює тверду основу стопи?", "o": ["5.", "8.", "10.", "12.", "15."], "a": [3], "e": ["5 — це лише плеснові кістки.", "8 — кількість кісток зап'ястка кисті, а не основи стопи.", "10 кісток недостатньо для твердої основи стопи.", "Тверду основу стопи утворюють 12 кісток: 7 кісток заплесна та 5 плеснових.", "15 — більше, ніж кісток у твердій основі (фаланги до неї не входять)."]}, {"n": "9.2", "q": "Вивчаючи рентгенограму дитини 9 місяців, лікар виявив недорозвинення кульшової западини з формуванням вродженого вивиху головки стегнової кістки в articulatio coxae. Патологія пов'язана з порушенням закладки ядер скостеніння в кістках, що утворюють кульшову западину. В тілах сідничої та лобкової кісток виявлені центри скостеніння. В тілі клубової кістки ядро відсутнє. На якому місяці в нормі з'являється центр скостеніння в клубовій кістці?", "o": ["7.", "5.", "6.", "8.", "9."], "a": [3], "e": ["7-й місяць не відповідає ключу тесту.", "5-й місяць не відповідає ключу тесту.", "6-й місяць не відповідає ключу тесту.", "За ключем тесту — 8-й місяць. ⚠️ У більшості підручників ядро клубової кістки з'являється найпершим, на 3–4-му місяці внутрішньоутробного розвитку; уточніть у викладача.", "9-й місяць не відповідає ключу тесту."]}, {"n": "9.3", "q": "Травматолог, оглядаючи рентгенограму кісток нижньої кінцівки у жінки 60 років, звернув увагу на зміни структури наколінної поверхні однієї з кісток. У якій кістці спостерігає травматолог?", "o": ["Os coxae.", "Os femoris.", "Patella.", "Tibia.", "Fibula."], "a": [1], "e": ["Кульшова кістка має кульшову западину, а не наколінну поверхню.", "Наколінна поверхня (facies patellaris) — на передній поверхні дистального кінця стегнової кістки; з нею з'єднується наколінок.", "Наколінок має суглобову поверхню, але «наколінна поверхня» — утвір стегнової кістки.", "Великогомілкова кістка має верхню суглобову поверхню для виростків стегна.", "Малогомілкова кістка не бере участі в колінному суглобі."]}, {"n": "9.4", "q": "До певного віку у дітей на рентгенограмі можна бачити хрящові прошарки між кістками в ділянці кульшової западини. У якому віці відбувається повне зрощення кісток, що утворюють кульшову западину?", "o": ["5–6.", "9–10.", "11–13.", "13–16.", "17–20."], "a": [3], "e": ["У 5–6 років кістки западини ще розділені Y-подібним хрящем.", "У 9–10 років хрящ ще зберігається.", "У 11–13 років зрощення лише починається.", "Кістки кульшової западини повністю зростаються у 13–16 років.", "У 17–20 років зрощення вже давно завершене."]}, {"n": "9.5", "q": "Під час розслаблення пасивних «затяжок» стопи її склепіння опускаються, стопа сплощується, що призводить до плоскостопості. Які кістки беруть участь у формуванні найвищого поперечного склепіння стопи?", "o": ["Плеснові кістки.", "П'яткова кістка, кубоподібна кістка.", "Човноподібна, клиноподібні, кубоподібна", "Кубоподібна, п'яткова, плеснові кістки.", "Плеснові кістки, п'яткова кістка."], "a": [2], "e": ["Плеснові кістки утворюють передню, нижчу частину поперечного склепіння.", "П'яткова і кубоподібна кістки утворюють бічне поздовжнє склепіння.", "Найвище поперечне склепіння утворюють човноподібна, клиноподібні та кубоподібна кістки.", "Ці кістки утворюють бічне поздовжнє склепіння.", "Плеснові та п'яткова кістки — кінцеві точки опори поздовжніх склепінь."]}, {"n": "9.6", "q": "Студент вивчає статеві ознаки та відмінності таза дорослої людини, порівнюючи жіночий і чоловічий таз. Він констатує, що у чоловіків підлобковий кут гострий і становить 50–60°, а у жінок — значно більший. Яка величина підлобкового кута у жінок?", "o": ["55–65°.", "60–65°.", "65–70°.", "70–75°.", "75–100°."], "a": [4], "e": ["55–65° — значення, близьке до чоловічого кута.", "60–65° — близько до чоловічого кута.", "65–70° — менше за жіночий кут.", "70–75° — менше за типовий жіночий кут.", "У жінок підлобковий кут тупий — приблизно 75–100° (дуга)."]}, {"n": "9.7", "q": "Під час вибору акушером тактики проведення пологів важливим є вимірювання поперечного діаметра виходу з малого таза. Цей розмір повинен бути дещо більшим за розмір головки плода. Між якими кістковими утворами акушер розміщує ніжки тазоміра?", "o": ["Сідничими горбами.", "Нижніми гілками лобкових кісток.", "Нижніми передніми клубовими остями.", "Остями сідничих кісток.", "Межовими лініями."], "a": [0], "e": ["Поперечний діаметр виходу з малого таза вимірюють між внутрішніми поверхнями сідничих горбів.", "Нижні гілки лобкових кісток обмежують підлобковий кут.", "Нижні передні клубові ості — над кульшовою западиною, до виходу таза не належать.", "Сідничі ості використовують для вимірювання міжостьового розміру порожнини, а не виходу.", "Межова лінія — це межа входу в малий таз."]}, {"n": "9.8", "q": "Після невдалого стрибка з висоти спортсмен був доставлений у травматологічне відділення лікарні зі скаргами на різкий біль та набряк у ділянці правої стопи. Під час обстеження права стопа у її задній третині різко болюча при пальпації, наявний крововилив на підошві, рухи у надп'ятково-гомілковому суглобі можливі у повному обсязі. Яка кістка ушкоджена?", "o": ["П'яткова кістка.", "Великогомілкова кістка.", "Надп'яткова кістка.", "Фаланги пальців стопи.", "Малогомілкова кістка."], "a": [0], "e": ["П'яткова кістка утворює задню третину стопи; падіння на п'яти з висоти — типовий механізм її перелому.", "Великогомілкова кістка належить гомілці, а не стопі.", "Надп'яткова кістка утворює надп'ятково-гомілковий суглоб; рухи в ньому збережені.", "Фаланги розташовані в передній частині стопи.", "Малогомілкова кістка — кістка гомілки."]}, {"n": "9.9", "q": "Хокеїст внаслідок падіння на коліно відчув різкий біль та хруст у ділянці лівого колінного суглоба. Під час огляду виявлено сильний набряк тканин у лівій колінній ділянці та верхній третині лівої гомілки, крововилив і біль на передній поверхні лівого колінного суглоба. Яка кістка ушкоджена?", "o": ["Наколінок.", "Малогомілкова кістка.", "Сіднича кістка.", "Стегнова кістка.", "Великогомілкова кістка."], "a": [0], "e": ["Наколінок лежить на передній поверхні колінного суглоба й ламається при падінні на коліно.", "Малогомілкова кістка — бічна кістка гомілки, не на передній поверхні коліна.", "Сіднича кістка — частина таза.", "Стегнова кістка ламається в іншому місці при такому механізмі.", "Великогомілкова кістка лежить нижче, на гомілці."]}, {"n": "9.10", "q": "Після автомобільної аварії у водія спостерігається деформація у середній третині лівої гомілки, сильний біль, особливо під час спроби рухати лівою нижньою кінцівкою. З рани виступає кінець кістки тригранного перерізу. Яка кістка ушкоджена?", "o": ["Великогомілкова кістка.", "Малогомілкова кістка.", "Стегнова кістка.", "Наколінок.", "Надп'яткова кістка."], "a": [0], "e": ["Тіло великогомілкової кістки має тригранну форму перерізу, а передній край розташований під шкірою.", "Малогомілкова кістка тонка, менш тригранна, розташована глибше.", "Стегнова кістка — у стегні, а не в гомілці.", "Наколінок — сесамоподібна кістка біля колінного суглоба.", "Надп'яткова кістка — кістка стопи."]}, {"n": "9.11", "q": "Будівник упав з висоти та вдарився лівою половиною тіла, після чого відчув сильний біль у верхній третині лівого стегна. Чоловік не може стати на ліву ногу, рухи у кульшовому суглобі лівої нижньої кінцівки виконати не вдається, посилюється набряк, з'являються ознаки крововиливу. Яка кістка ушкоджена?", "o": ["Стегнова.", "Малогомілкова кістка.", "Крижова", "Наколінок.", "Лобкова."], "a": [0], "e": ["Біль у верхній третині стегна і неможливість рухів у кульшовому суглобі вказують на перелом стегнової кістки.", "Малогомілкова кістка — на гомілці.", "Крижова кістка — у тазі, не в стегні.", "Наколінок — у колінній ділянці.", "Лобкова кістка — частина таза."]}, {"n": "9.12", "q": "У чоловіка 56 років діагностовано перелом кістки одразу над її присередньою кісточкою (malleolus medialis). Яка кістка була ушкоджена?", "o": ["Femur.", "Tibia.", "Fibula.", "Patella.", "Talus."], "a": [1], "e": ["Стегнова кістка не має кісточок.", "Присередня кісточка (malleolus medialis) — виступ дистального кінця великогомілкової кістки.", "Малогомілкова кістка утворює бічну кісточку.", "Наколінок не має кісточок.", "Надп'яткова кістка зчленовується з кісточками, але сама кісточок не має."]}, {"n": "9.13", "q": "У чоловіка 25 років після спортивної травми діагностовано перелом бічної кісточки (malleolus lateralis). Яка кістка ушкоджена?", "o": ["Великогомілкова кістка.", "Малогомілкова кістка", "Стегнова кістка.", "Наколінок.", "П'яткова кістка."], "a": [1], "e": ["Великогомілкова кістка утворює присередню кісточку.", "Бічна кісточка — дистальний кінець малогомілкової кістки.", "Стегнова кістка не має кісточок.", "Наколінок не має кісточок.", "П'яткова кістка не має кісточок."]}, {"n": "9.14", "q": "У чоловіка 45 років після падіння діагностовано перелом кістки, що утворює западину, яка разом зі стегновою кісткою утворює articulatio coxae. Яка кістка ушкоджена?", "o": ["Стегнова кістка.", "Кульшова кістка.", "Крижова кістка.", "Великогомілкова кістка.", "Малогомілкова кістка."], "a": [1], "e": ["Стегнова кістка дає головку, а не западину.", "Кульшова западина утворена кульшовою кісткою (зрощені клубова, сіднича і лобкова).", "Крижова кістка не утворює кульшового суглоба.", "Великогомілкова кістка не утворює кульшового суглоба.", "Малогомілкова кістка не утворює кульшового суглоба."]}, {"n": "9.15", "q": "Жінка 86 років госпіталізована у лікарню з травмою, отриманою під час падіння. Рентгенологічно діагностовано перелом кістки правої кінцівки, при чому лінія перелому проходить через великий і малий вертлюги цієї кістки. Перелом якої кістки діагностовано у жінки?", "o": ["Humerus.", "Os femoris.", "Radius.", "Ulna.", "Tibia."], "a": [1], "e": ["Плечова кістка має горбки, а не вертлюги.", "Великий і малий вертлюги — на проксимальному кінці стегнової кістки; вертлюгові переломи типові для літніх.", "Променева кістка не має вертлюгів.", "Ліктьова кістка не має вертлюгів.", "Великогомілкова кістка не має вертлюгів."]}, {"n": "9.16", "q": "У жінок у вертикальному положенні тіла площина верхнього отвору малого таза нахилена вперед і вниз, утворюючи з горизонтальною площиною кут 55–60° — нахил таза (inclinatio pelvis). Чим обмежена верхня межа малого таза?", "o": ["Linea intermedia.", "Linea arcuata.", "Linea glutea inferior.", "Linea glutea anterior.", "Linea (sulcus) limitans."], "a": [4], "e": ["Linea intermedia — на клубовому гребені, між зовнішньою і внутрішньою губами.", "Linea arcuata — лише частина межової лінії на клубовій кістці.", "Нижня сіднична лінія — на зовнішній поверхні клубової кістки.", "Передня сіднична лінія — на зовнішній поверхні клубової кістки.", "Верхню межу малого таза утворює межова лінія (linea terminalis)."]}, {"n": "9.17", "q": "Чоловік 25 років отримав спортивну травму нижньої кінцівки. Після рентгенологічного обстеження діагностовано перелом кістки нижньої кінцівки. Лінія перелому проходить між основою та верхівкою цієї кістки. Перелом якої кістки встановлено у чоловіка?", "o": ["Fibula.", "Os coxae.", "Os femoris.", "Patella.", "Tibia."], "a": [3], "e": ["Малогомілкова кістка має голівку і кісточку.", "Кульшова кістка не має основи та верхівки.", "Стегнова кістка має головку та виростки.", "Наколінок має основу (вгорі) і верхівку (внизу).", "Великогомілкова кістка має виростки та присередню кісточку."]}, {"n": "9.18", "q": "У лікарню звернулася жінка 67 років із травмою стопи. Під час рентгенологічного обстеження діагностовано перелом кістки стопи, яка своєю основою прилягає до присередньої клиноподібної кістки. Перелом якої кістки має місце?", "o": ["Os metatarsale I.", "Os cuboideum.", "Os naviculare.", "Os metatarsale III.", "Calcaneus."], "a": [0], "e": ["I плеснова кістка основою з'єднується з присередньою клиноподібною кісткою.", "Кубоподібна кістка з'єднується з IV–V плесновими кістками.", "Човноподібна кістка з'єднується з клиноподібними, а не з основою плеснових.", "III плеснова кістка з'єднується з бічною клиноподібною кісткою.", "П'яткова кістка не з'єднується з клиноподібними."]}, {"n": "9.19", "q": "Травматолог виявив на рентгенограмі стопи у постраждалого перелом кістки, яка має суглобову поверхню, що з'єднує її з усіма клиноподібними кістками. Перелом якої кістки діагностував лікар?", "o": ["Os metatarsale I.", "Os cuboideum.", "Os naviculare.", "Talus.", "Calcaneus."], "a": [2], "e": ["I плеснова кістка з'єднується лише з присередньою клиноподібною.", "Кубоподібна кістка з'єднується з бічною клиноподібною, але не з усіма.", "Човноподібна кістка спереду має суглобові поверхні для всіх трьох клиноподібних кісток.", "Надп'яткова кістка з'єднується з човноподібною, а не з клиноподібними.", "П'яткова кістка з'єднується з кубоподібною."]}, {"n": "9.20", "q": "До поліклініки звернувся чоловік 43 років з виробничою травмою стопи. На рентгенограмі виявлено перелом кістки заплесна, яка контактує з IV і V плесновими кістками. Перелом якої кістки діагностував лікар?", "o": ["Calcaneus.", "Os naviculare.", "Os cuneiforme mediale.", "Os cuboideum.", "Talus."], "a": [3], "e": ["П'яткова кістка з'єднується з кубоподібною, але не з плесновими.", "Човноподібна кістка з'єднується з клиноподібними.", "Присередня клиноподібна кістка з'єднується з I плесновою.", "Кубоподібна кістка спереду з'єднується з основами IV та V плеснових кісток.", "Надп'яткова кістка не контактує з плесновими."]}, {"n": "9.21", "q": "Жінка 45 років звернулася до лікаря-травматолога зі скаргами на біль в одному із суглобів нижньої кінцівки. На рентгенограмі виявлено суттєві зміни в ділянці facies lunata. На якій кістці нижньої кінцівки є півмісяцева поверхня?", "o": ["Patella.", "Tibia.", "Os coxae.", "Os femoris.", "Fibula."], "a": [2], "e": ["Наколінок не має півмісяцевої поверхні.", "Великогомілкова кістка не має півмісяцевої поверхні.", "Півмісяцева поверхня (facies lunata) — суглобова частина кульшової западини кульшової кістки.", "Стегнова кістка має головку, яка зчленовується з півмісяцевою поверхнею.", "Малогомілкова кістка не має півмісяцевої поверхні."]}, {"n": "9.22", "q": "Лікар-рентгенолог під час дослідження рентгенограми звертає увагу на зміни вушкоподібної поверхні однієї із кісток тазового пояса. Яка кістка нижньої кінцівки має вушкоподібну поверхню?", "o": ["Os femoris.", "Fibula.", "Tibia.", "Os sacrum.", "Patella."], "a": [3], "e": ["Стегнова кістка не має вушкоподібної поверхні.", "Малогомілкова кістка не має вушкоподібної поверхні.", "Великогомілкова кістка не має вушкоподібної поверхні.", "Вушкоподібна поверхня є на бічній частині крижової кістки (і на клубовій кістці) — утворює крижово-клубовий суглоб.", "Наколінок не має вушкоподібної поверхні."]}, {"n": "9.23", "q": "Лікар-невролог під час обстеження жінки 46 років попередньо діагностує стиснення затульного нерва в місці його прилягання до затульної борозни (sulcus obturatorius) на одній із кісток тазового пояса. На якій кістці нижньої кінцівки знаходиться затульна борозна?", "o": ["Patella.", "Fibula.", "Os femoris.", "Tibia.", "Os coxae."], "a": [4], "e": ["Наколінок не має затульної борозни.", "Малогомілкова кістка не має затульної борозни.", "Стегнова кістка не має затульної борозни.", "Великогомілкова кістка не має затульної борозни.", "Затульна борозна — на верхній гілці лобкової кістки, тобто кульшової кістки."]}, {"n": "9.24", "q": "У лікарню госпіталізовано чоловіка 28 років з переломом кістки нижньої кінцівки. На рентгенограмі лінія перелому візуалізується уздовж тіла кістки, одразу проксимальніше від її присереднього та бічного виростків. Яка кістка зазнала перелому?", "o": ["Talus.", "Os femoris.", "Os coxae.", "Fibula.", "Tibia."], "a": [1], "e": ["Надп'яткова кістка не має виростків.", "Присередній і бічний виростки є на дистальному кінці стегнової кістки; перелом над ними — надвиростковий перелом стегна.", "Кульшова кістка не має виростків.", "Малогомілкова кістка не має виростків.", "Великогомілкова кістка має виростки на проксимальному кінці, але лінія перелому описана над ними уздовж тіла, що характерно для стегна."]}, {"n": "9.25", "q": "Травматолог виявив на рентгенограмі у чоловіка 45 років перелом кістки нижньої кінцівки одразу над бічною кісточкою. Перелом якої кістки спостерігає лікар в даному випадку?", "o": ["Os coxae.", "Fibula.", "Talus.", "Tibia.", "Os femoris."], "a": [1], "e": ["Кульшова кістка не має кісточок.", "Бічна кісточка належить малогомілковій кістці.", "Надп'яткова кістка не має кісточок.", "Великогомілкова кістка має присередню кісточку.", "Стегнова кістка не має кісточок."]}, {"n": "9.26", "q": "У лікарню госпіталізовано жінку 52 років з травмою нижньої кінцівки. Після рентгенологічного обстеження лікарем діагностовано перелом дистального наростку кістки з ушкодженням її присередньої кісточки, кісточкової борозни. Перелом якої кістки діагностовано у жінки?", "o": ["Fibula.", "Talus.", "Os femoris.", "Calcaneus.", "Tibia."], "a": [4], "e": ["Малогомілкова кістка має бічну кісточку.", "Надп'яткова кістка не має кісточок.", "Стегнова кістка не має кісточок.", "П'яткова кістка не має кісточок.", "Присередня кісточка і кісточкова борозна — на дистальному кінці великогомілкової кістки."]}, {"n": "9.27", "q": "Травматолог під час операції на одному із суглобів нижньої кінцівки підшиває зв'язку, відірвану від переднього міжвиросткового поля. До якої кістки лікар фіксує відірвану зв'язку?", "o": ["Tibia.", "Os femoris.", "Fibula.", "Calcaneus.", "Talus."], "a": [0], "e": ["Переднє міжвиросткове поле — на верхній поверхні великогомілкової кістки; від нього починається передня хрестоподібна зв'язка.", "Стегнова кістка має міжвиросткову ямку, а не поле.", "Малогомілкова кістка не має міжвиросткового поля.", "П'яткова кістка не має міжвиросткового поля.", "Надп'яткова кістка не має міжвиросткового поля."]}, {"n": "9.28", "q": "До травматологічного відділення лікарні доставлено чоловіка 28 років зі спортивною травмою. Під час обстеження діагностовано відрив волокон внутрішньокапсульної зв'язки в одному із суглобів нижньої кінцівки, яка в нормі починається від заднього міжвиросткового поля. До якої кістки лікар фіксує відірвану зв'язку?", "o": ["Os femoris.", "Tibia", "Calcaneus.", "Talus.", "Fibula."], "a": [1], "e": ["Стегнова кістка має міжвиросткову ямку, а не поле.", "Заднє міжвиросткове поле розташоване на великогомілковій кістці; від нього йде задня хрестоподібна зв'язка.", "П'яткова кістка не має міжвиросткового поля.", "Надп'яткова кістка не має міжвиросткового поля.", "Малогомілкова кістка не має міжвиросткового поля."]}, {"n": "9.29", "q": "Внаслідок падіння з висоти жінка 27 років отримала травму нижньої кінцівки. Після проведення рентгенологічного обстеження діагностовано перелом кістки нижньої кінцівки. Лінія перелому проходить через середину linea aspera. Яка кістка нижньої кінцівки ушкоджена?", "o": ["Fibula.", "Tibia.", "Talus.", "Os femoris.", "Os coxae."], "a": [3], "e": ["Малогомілкова кістка не має шорсткої лінії.", "Великогомілкова кістка має камбалоподібну лінію, а не шорстку.", "Надп'яткова кістка не має шорсткої лінії.", "Шорстка лінія (linea aspera) — на задній поверхні тіла стегново
