 падінні травмував крижову кістку. Рентгенологічно виявлено ушкодження гребенів крижової кістки, які утворились шляхом зрощення суглобових відростків крижових хребців. Які гребені крижової кістки утворені злиттям суглобових відростків крижової кістки?", "o": ["Серединний і лівий присередній гребені.", "Правий присередній і лівий присередній гребені.", "Правий бічний і лівий бічний гребені.", "Правий присередній і лівий бічний гребені.", "Лівий присередній і правий бічний гребені."], "a": [1], "e": ["Серединний гребінь — від остистих відростків, а не від суглобових.", "Присередні (правий і лівий) гребені утворені злиттям суглобових відростків.", "Бічні гребені утворені поперечними відростками.", "Правий присередній правильний, але лівий бічний — від поперечних відростків.", "Лівий присередній правильний, але правий бічний — від поперечних відростків."]}, {"n": "2.8", "q": "Дівчинка 10 років травмувала грудну клітку. Рентгенологічно виявлено перелом правого найдовшого ребра. Яке ребро є найдовшим?", "o": ["II.", "III.", "IV.", "V.", "VII."], "a": [4], "e": ["II ребро коротке й широке, найдовшим не є.", "III ребро коротше за VII.", "IV ребро коротше за VII.", "V ребро коротше за VII.", "VII ребро є найдовшим серед усіх ребер."]}, {"n": "2.9", "q": "Лікар виявив у жінки 56 років почервоніння і болючість шкіри в ділянці суглоба, що утворений хрящем ребра і вирізкою на груднині, що розташована між її частинами. Яка вирізка на груднині утворена двома її частинами?", "o": ["Incisura costalis I.", "Incisura costalis II.", "Incisura costalis III.", "Incisura clavicularis.", "Incisura jugularis."], "a": [1], "e": ["Реброва вирізка I — на рукоятці груднини, а не між її частинами.", "Реброва вирізка II утворена на межі рукоятки й тіла груднини — її формують обидві частини.", "Реброва вирізка III — на тілі груднини.", "Ключична вирізка — на рукоятці, для ключиці.", "Яремна вирізка — на верхньому краї рукоятки."]}, {"n": "2.10", "q": "У чоловіка 52 років, що скаржився на біль та обмеження рухів у поперековому відділі хребтового стовпа, лікар-невролог виявив ушкодження крижово-поперекового з’єднання. Які відростки п’ятого поперекового хребця ушкоджені?", "o": ["Верхні суглобові відростки.", "Нижні суглобові відростки.", "Верхні і нижні суглобові відростки.", "Верхні суглобові і поперечні відростки.", "Нижні суглобові і поперечні відростки."], "a": [1], "e": ["Верхні суглобові відростки L5 з'єднуються з нижніми суглобовими відростками L4.", "Нижні суглобові відростки L5 зчленовуються з верхніми суглобовими відростками крижової кістки — це крижово-поперекове з'єднання.", "Верхні відростки L5 беруть участь у з'єднанні з L4, а не з крижовою кісткою.", "Поперечні відростки — не суглобові; у поєднанні з верхніми суглобовими відповідь також неправильна.", "Поперечні відростки — не суглобові; нижні суглобові відростки самі без них."]}, {"n": "2.11", "q": "У чоловіка 35 років під час рентгенологічного дослідження виявлено перелом в ділянці правого присереднього гребеня крижової кістки. Ліві гребені крижової кістки – без патологічних змін. Як називається площина, якою користується рентгенолог для опису патологічних змін крижової кістки?", "o": ["Горизонтальна.", "Стрілова.", "Лобова.", "Поперечна.", "Присерединна."], "a": [1], "e": ["Горизонтальна площина ділить тіло на верхню та нижню частини, а не на праву й ліву.", "Стрілова (сагітальна) площина розрізняє праву й ліву половини, тому нею описують правий і лівий присередні гребені.", "Лобова площина розрізняє передню та задню поверхні.", "Поперечна (горизонтальна) площина — верх і низ.", "«Присерединна» — не основна площина для опису, а лише паралельна до серединної."]}, {"n": "2.12", "q": "Крижова кістка людини має дві поверхні – тазову поверхню і спинну поверхню. Стосовно якої площини називають ці поверхні?", "o": ["Plana sagittalia.", "Plana frontalia.", "Plana horizontalia.", "Plana transversalia.", "Plana paramediana."], "a": [1], "e": ["Сагітальні площини розрізняють праву й ліву частини.", "Тазова (передня) та спинна (задня) поверхні називаються відносно лобової (фронтальної) площини.", "Горизонтальна площина розрізняє верхні й нижні частини.", "Поперечна площина розрізняє верх і низ.", "Парамедіанні — паралельні до серединної, розрізняють право/ліво."]}, {"n": "2.13", "q": "Жінка 50 років звернулася до хірурга зі скаргами на біль у лівій половині грудної клітки. Рентгенологічно виявлений перелом останього справжнього ребра в місці його з’єднання з ребровою вирізкою на тілі груднини. Яке ребро ушкоджено?", "o": ["VI.", "VII.", "III.", "IV.", "V."], "a": [1], "e": ["VI ребро — справжнє, але не останнє.", "VII ребро — останнє справжнє ребро, яке з'єднується з тілом груднини.", "III ребро — верхнє справжнє ребро.", "IV ребро — справжнє, але не останнє.", "V ребро — справжнє, але не останнє."]}, {"n": "2.14", "q": "До лікаря звернувся чоловік 45 років зі скаргою на біль в ділянці проєкції крижової кістки, що виникла після падіння. Рентгенологічно діагностовано перелом присереднього крижового гребеня. Яким терміном в анатомічній номенклатурі позначається латинською мовою термін «присередній»?", "o": ["Proximalis.", "Distalis.", "Anterior.", "Lateralis.", "Medialis."], "a": [4], "e": ["Proximalis означає «ближній».", "Distalis означає «дальній».", "Anterior означає «передній».", "Lateralis означає «бічний», тобто далі від серединної площини.", "Medialis означає «присередній», ближчий до серединної площини."]}, {"n": "2.15", "q": "Лікар виявив у чоловіка почервоніння і болючість шкіри в ділянці суглоба, утвореного хрящем ребра і вирізкою на груднині, що розташована на рівні кута груднини. Яке ребро розташовано на рівні кута груднини?", "o": ["I.", "II.", "III.", "IV.", "V."], "a": [1], "e": ["I ребро кріпиться до рукоятки груднини.", "II ребро з'єднується з вирізкою на рівні кута груднини.", "III ребро кріпиться до тіла груднини нижче кута.", "IV ребро нижче кута груднини.", "V ребро нижче кута груднини."]}, {"n": "2.16", "q": "Жінка 36 років травмувала грудну клітку, після чого звернулася до хірурга зі скаргами на біль у правій половині грудної клітки. Рентгенологічно виявлено перелом ребер, головки яких з’єднується з повною ребровою ямкою на тілі хребців. Які ребра ушкоджені?", "o": ["II.", "III–IV.", "VI–VII.", "VIII–X.", "XI–XII."], "a": [4], "e": ["II ребро має головку з двома ямками (гребінь є).", "III–IV ребра мають гребінь головки і дві площини.", "VI–VII ребра мають гребінь головки, їх головки з'єднуються з двома пів'ямками.", "VIII–X ребра мають гребінь головки і дві пів'ямки.", "XI–XII ребра мають головку лише з однією суглобовою поверхнею: вона з'єднується з повною ямкою на тілі хребця."]}, {"n": "2.17", "q": "Чоловік 40 років відчув сильний біль після падіння. Лікар виявив перелом тіла ребра, горбок якого немає суглобової поверхні для з'єднання з поперечними відростками. Яке ребро ушкоджене у чоловіка?", "o": ["I.", "III.", "VII.", "X.", "XII."], "a": [4], "e": ["I ребро має горбок із суглобовою поверхнею.", "III ребро має горбок із суглобовою поверхнею.", "VII ребро має суглобову поверхню на горбку.", "X ребро має суглобову поверхню на горбку.", "XII ребро не має горбка із суглобовою поверхнею."]}, {"n": "2.18", "q": "На 8-му тижні внутрішньоутробного розвитку у зародка починається заміна хрящового скелета на кістковий. У якому віці крижові хребці людини зростаються в єдину крижову кістку?", "o": ["У віці 1–2 років.", "У віці 3–7 років.", "У віці 8–12 років.", "У віці 13–20 років.", "У віці 17–25 років."], "a": [4], "e": ["У віці 1–2 років крижові хребці ще окремі.", "У 3–7 років зрощення ще не відбулося.", "У 8–12 років крижові хребці розділені міжхребцевими дисками.", "У 13–20 років зрощення ще триває, воно завершується пізніше.", "Крижові хребці зростаються в єдину кістку приблизно у віці 17–25 років."]}, {"n": "2.19", "q": "Крижова кістка складається із крижових хребців, які зростаються в одну суцільну кістку в кінці пубертатного періоду (періоду статевого дозрівання). Яка кількість хребців в нормі утворює крижову кістку?", "o": ["3.", "4.", "5.", "6.", "7."], "a": [2], "e": ["Три хребці — замало для крижової кістки.", "Чотири хребці — менше за норму.", "Крижова кістка складається з п'яти зрощених хребців.", "Шість хребців — більше за норму (бувають варіанти, але норма — п'ять).", "Сім хребців — не відповідає нормі."]}, {"n": "2.20", "q": "У чоловіка 50 років виявлена злоякісна пухлина прямої кишки, яка росте у бік передньої (тазової) поверхні, facies pelviсa, крижової кістки. На тазовій поверхні помітні лінії – місця зрощення тіл крижових хребців. Яку назву мають ці анатомічні утвори?", "o": ["Lineae transversae.", "Lineae arcuatfe.", "Lineae terminalis.", "Присередні крижові гребені.", "Бічні крижові гребені."], "a": [0], "e": ["Lineae transversae — поперечні лінії на тазовій поверхні, місця зрощення тіл крижових хребців.", "Lineae arcuatae — дугоподібні лінії клубової кістки.", "Linea terminalis — межова лінія таза (між великим і малим тазом).", "Присередні крижові гребені утворені суглобовими відростками на спинній поверхні.", "Бічні крижові гребені утворені поперечними відростками на спинній поверхні."]}, {"n": "2.21", "q": "У чоловіка 45 років після травми хребтового стовпа рентгенологічно діагностовано перелом бічної частини крижової кістки (partes laterales). Внаслідок цієї травми у хворого ушкоджена суглобова поверхня, яка зчленовується з однойменною поверхнею клубової кістки. Яка поверхня ушкоджена?", "o": ["Facies auricularis.", "Facies articularis superior.", "Facies articularis inferior.", "Facies articularis anterior.", "Facies articularis posterior."], "a": [4], "e": ["За анатомією саме вушкоподібна поверхня (facies auricularis) з'єднується з однойменною поверхнею клубової кістки. ⚠️ У ключі тесту відмічено інший варіант — схоже на помилку в ключі, уточніть у викладача.", "Facies articularis superior — верхній суглобовий відросток, зчленування з L5.", "Нижньої суглобової поверхні для клубової кістки немає; верхівка крижової кістки з'єднується з куприком.", "Facies articularis anterior — такої суглобової поверхні на крижовій кістці немає.", "⚠️ У ключі тесту правильною відмічено цю відповідь, але поверхні з такою назвою на крижовій кістці в номенклатурі немає; з клубовою кісткою зчленовується facies auricularis."]}, {"n": "2.22", "q": "Чоловіка 45 років госпіталізовано після дорожно-транспортної пригоди до травматологічного відділення лікарні. Після проведення рентгенологічного дослідження лікар діагностував перелом тіл всіх справжніх ребер справа. Які ребра ушкоджені?", "o": ["I–II.", "I–V.", "I–VII.", "I–VIII.", "I–XII."], "a": [2], "e": ["I–II — лише верхні два справжні ребра.", "I–V — не всі справжні ребра.", "Справжні ребра (costae verae) — з I по VII, вони з'єднуються з грудниною безпосередньо своїми хрящами.", "I–VIII — VIII ребро несправжнє.", "I–XII — включає несправжні та коливні ребра."]}, {"n": "2.23", "q": "Чоловіка 50 років госпіталізовано після дорожно-транспортної пригоди у травматологічне відділення лікарні. Після проведення рентгенологічного дослідження лікар діагностував перелом тіл всіх лівих несправжніх ребер (costae spuriae). Які ребра ушкоджені?", "o": ["I–II.", "III –IV.", "IV–V.", "VI–VII", "VIII–X."], "a": [4], "e": ["I–II — справжні ребра.", "III–IV — справжні ребра.", "IV–V — справжні ребра.", "VI–VII — справжні ребра.", "Несправжні ребра (costae spuriae) — VIII–X: їхні хрящі приєднуються до хряща вищого ребра."]}, {"n": "2.24", "q": "Чоловіка госпіталізовано після дорожно-транспортної пригоди до травматологічного відділення лікарні. Після проведення рентгенологічного дослідження лікар діагностував перелом тіл коливних ребер. Які ребра ушкоджені?", "o": ["I–II.", "I–IV.", "I–VII.", "VII–X.", "XI–XII."], "a": [4], "e": ["I–II — справжні ребра.", "I–IV — справжні ребра.", "I–VII — справжні ребра.", "VII–X — справжнє і несправжні ребра.", "Коливні ребра (costae fluctuantes) — XI–XII: вони вільно закінчуються в м'язах."]}, {"n": "2.25", "q": "У жінки 48 років після рентгенологічного дослідження на знімку виявлено: ушкодження суглобової поверхні головок ребер, а також візуалізовано розрив зв’язки, волокна якої починаються від гребеня головки ребра та прикріплюється до міжхребцевого диска. Які ребра мають гребінь головки ребра?", "o": ["I–II.", "II–IX.", "II–X.", "II–XI.", "II–XII."], "a": [2], "e": ["I–II: у I ребра гребеня головки немає, головка має одну поверхню.", "II–IX: пропущено X ребро, яке теж має гребінь головки.", "Гребінь головки ребра (crista capitis costae) є у II–X ребер.", "II–XI: у XI ребра гребеня немає.", "II–XII: у XI та XII ребер гребеня головки немає."]}, {"n": "2.26", "q": "Чоловік 25 років був госпіталізований після падіння з велосипеду до травматологічного відділення лікарні. Після проведення рентгенологічного дослідження лікар діагностував перелом ребер, у яких горбок ребра співпадає з кутом ребра. Які ребра ушкоджені?", "o": ["I–II.", "II–VII.", "VIII–IX.", "IX–X.", "XI–XII."], "a": [0], "e": ["У I–II ребер горбок співпадає з кутом ребра.", "У II–VII ребер кут розташований дистальніше від горбка.", "У VIII–IX ребер кут окремий від горбка.", "У IX–X ребер кут відділений від горбка.", "У XI–XII ребер горбка немає."]}, {"n": "2.27", "q": "У чоловіка 35 років під час проведення рентгенологічного дослідження лікар діагностував перелом ребра, на тілі якого відсутній кут ребра. Яке ребро ушкоджене?", "o": ["I.", "II.", "VIII.", "X.", "XII."], "a": [0], "e": ["I ребро не має кута ребра, бо горбок і кут практично співпадають.", "У II ребра кут є.", "У VIII ребра кут є.", "У X ребра кут є.", "XII ребро коротке, з нечітким кутом, але класичною відповіддю на «ребро без кута» є I ребро."]}, {"n": "2.28", "q": "Чоловіка 26 років госпіталізовано в лікарню з переломом ребер та кровотечею в грудній порожнині. Внаслідок травми виник розрив стінки міжребрових артерій, які проходять в борозні ребра (sulcus costae). У якому місці ребра проходить sulcus costae?", "o": ["Margo superior.", "Margo inferior.", "Caput coste.", "Angulus costae.", "Collum costae."], "a": [1], "e": ["Верхній край ребра — не місце борозни судин.", "Борозна ребра (sulcus costae) проходить по нижньому краю ребра.", "Головка ребра — частина, що з'єднується з тілом хребця.", "Кут ребра — місце вигину тіла ребра.", "Шийка ребра — звужена частина між головкою та горбком."]}, {"n": "2.29", "q": "Жінка 26 років госпіталізована в лікарню з запаленням плеври. Лікар призначив проведення пункції плевральної порожнини. Проведення пункції проводять в міжребровому просторі. Під час маніпуляції необхідно запобігти ушкодження міжребрових судин та нервів, які проходять в борозні ребра (sulcus costae). У якому місці проведення пункції плевральної порожнини безпечно?", "o": ["Margo superior.", "Margo inferior.", "Caput coste.", "Angulus costae.", "Collum costae."], "a": [0], "e": ["Верхній край ребра безпечний для пункції — судини й нерв лежать у борозні нижнього краю.", "Нижній край ребра небезпечний: у борозні проходять міжреброві судини та нерв.", "Головка ребра — не місце для проведення пункції, вона з'єднується з хребцем.", "Кут ребра — вигин тіла, не є місцем пункції.", "Шийка ребра — розташована біля хребта, не місце пункції."]}, {"n": "2.30", "q": "Чоловік 45 років госпіталізований після дорожно-транспортної пригоди у травматологічне відділення лікарні з артеріальною кровотечею. Після проведення рентгенологічного дослідження лікар діагностував перелом ребра, до верхньої поверхі якого прилягає підключичні артерія та вена, стінки яких ушкоджені внаслідок травми. Яке ребро ушкоджено?", "o": ["I.", "II.", "VIII.", "X.", "XII."], "a": [0], "e": ["Підключичні артерія та вена прилягають до верхньої поверхні I ребра (борозни підключичних артерії та вени).", "До II ребра підключичні судини не прилягають.", "До VIII ребра підключичні судини не прилягають.", "До X ребра підключичні судини не прилягають.", "До XII ребра підключичні судини не прилягають."]}], "models": [["Грудна клітка: ребра, груднина", "sf:0f1aa77bf02e4d438f8630bd6c53b12e", {"ru": "Грудная клетка: рёбра, грудина", "en": "Thoracic cage: ribs, sternum"}], ["Скелет тулуба з крижовою кісткою", "sf:601a448ecdcc446fae033341c601f7d2", {"ru": "Скелет туловища с крестцом", "en": "Trunk skeleton with sacrum"}]]}, {"id": "topic3", "title": "3. Лобова кістка, тімʼяна кістка, потилична кістка, решітчаста кістка", "tr": {}, "questions": [{"n": "3.1", "q": "У лікарню госпіталізована дитина 8 років з черепно-мозковою травмою. Лікар діагностував перелом кістки черепа. Лінія перелому проходить через верхню каркову лінію (linea nuchalis superior). Яка кістка травмована?", "o": ["Лобова кістка (os frontale).", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Скронева кістка (os temporale).", "Решітчаста кістка (os ethmoidale)."], "a": [1], "e": ["На лобовій кістці каркових ліній немає — вони на потиличній.", "Верхня каркова лінія (linea nuchalis superior) розташована на зовнішній поверхні потиличної луски.", "На тім'яній кістці є верхня і нижня скроневі лінії, а не каркові.", "На скроневій кістці каркових ліній немає.", "Решітчаста кістка лежить усередині черепа між очними ямками, каркових ліній на ній немає."]}, {"n": "3.2", "q": "У лікарню бригадою швидкої медичної допомоги госпіталізовано дівчинку 10 років з черепно-мозковою травмою. Лікар діагностував перелом кістки черепа. Лінія перелому на рентгенограмі проходить через її стріловий край. Яка кістка травмована?", "o": ["Лобова кістка (os frontale).", "Потилична кістка (os occipitale).", "Решітчаста кістка (os ethmoidale).", "Скронева кістка (os temporale).", "Тім'яна кістка (os parietale)."], "a": [4], "e": ["Лобова кістка не має стрілового краю.", "Потилична кістка має ламбдоподібний і соскоподібний краї.", "Решітчаста кістка не має стрілового краю.", "Скронева кістка має тім'яний і клиноподібний краї.", "Стріловий край (margo sagittalis) має тім'яна кістка — ним вона з'єднується з протилежною у стріловому шві."]}, {"n": "3.3", "q": "У лікарню госпіталізовано хлопчика 6 років з переломом тім'яної кістки в ділянці соскоподібного кута, внаслідок чого виникла кровотеча з пазухи твердої оболони головного мозку. У ділянці якої борозни ушкоджена пазуха твердої оболони головного мозку?", "o": ["Борозни верхньої стрілової пазухи (sulcus sinus sagittalis superioris).", "Борозни нижньої кам'янистої пазухи (sulcus sinus petrosi inferioris).", "Борозни верхньої кам'янистої пазухи (sulcus sinus petrosi superioris).", "Борозни поперечної пазухи (sulcus sinus transversi).", "Борозни сигмоподібної пазухи (sulcus sinus sigmoidea)."], "a": [4], "e": ["Борозна верхньої стрілової пазухи проходить вздовж стрілового краю тім'яних кісток.", "Борозна нижньої кам'янистої пазухи — на скроневій і потиличній кістках біля кам'янистої частини.", "Борозна верхньої кам'янистої пазухи — на верхньому краї піраміди скроневої кістки.", "Борозна поперечної пазухи проходить переважно на потиличній кістці.", "Біля соскоподібного кута тім'яної кістки на її внутрішній поверхні проходить борозна сигмоподібної пазухи."]}, {"n": "3.4", "q": "Каретою швидкої медичної допомоги в лікарню доставлено дитину 10 років з черепно-мозковою травмою. У лікарні під час обстеження виявлено ушкодження пазухи твердої оболони головного мозку (sinus durae matris) в тому місці, де стінка пазухи прилягає до борозни на внутрішній поверхні лобової луски (squama frontalis). У ділянці якої борозни ушкоджена пазуха твердої оболони головного мозку?", "o": ["Борозни поперечної пазухи.", "Борозни верхньої кам'янистої.", "Борозни верхньої стрілової пазухи.", "Борозни нижньої кам'янистої пазухи.", "Борозни сигмоподібної пазухи."], "a": [2], "e": ["Борозна поперечної пазухи — на потиличній кістці.", "Борозна верхньої кам'янистої пазухи — на піраміді скроневої кістки.", "На внутрішній поверхні лобової луски по серединній лінії проходить борозна верхньої стрілової пазухи.", "Борозна нижньої кам'янистої пазухи — між скроневою та потиличною кістками.", "Борозна сигмоподібної пазухи — на скроневій, тім'яній і потиличній кістках ззаду."]}, {"n": "3.5", "q": "У лікарню госпіталізовано дівчинку 2-ох років з черепно-мозковою травмою. Після рентгенологічного обстеження лікар діагностував перелом кістки черепа. Лінія перелому проходить через crista occipitalis externa. Яка кістка травмована?", "o": ["Лобова кістка (os frontale).", "Скронева кістка (os temporale).", "Тім'яна кістка (os parietale).", "Потилична кістка (os occipitale).", "Решітчаста кістка (os ethmoidale)."], "a": [3], "e": ["На лобовій кістці немає зовнішнього потиличного гребеня.", "На скроневій кістці потиличного гребеня немає.", "На тім'яній кістці потиличного гребеня немає.", "Crista occipitalis externa — зовнішній потиличний гребінь на потиличній лусці.", "Решітчаста кістка розташована в передній частині черепа."]}, {"n": "3.6", "q": "У нейрохірургічну клініку госпіталізована дитина першого року життя з пухлиною головного мозку. Дитині була зроблена операція. Під час операції разом з пухлиною був видалений півнячий гребінь (crista galli). Частину якої кістки черепа видалили в цьому випадку?", "o": ["Потиличної кістки (os occipitale).", "Решітчастої кістки (os ethmoidale).", "Клиноподібної кістки (os sphenoidale).", "Тім'яної кістки (os parietale).", "Лобової кістки (os frontale)."], "a": [1], "e": ["Потилична кістка утворює задню частину основи черепа, півнячого гребеня не має.", "Півнячий гребінь (crista galli) — частина перпендикулярної пластинки решітчастої кістки над дірчастою пластинкою.", "Клиноподібна кістка має турецьке сідло, а не півнячий гребінь.", "Тім'яна кістка утворює склепіння черепа.", "Лобова кістка має лобовий гребінь, а півнячий гребінь лежить у її решітчастій вирізці, але належить решітчастій кістці."]}, {"n": "3.7", "q": "Обстежуючи хлопчика 3-ох років, лікар виявив пухлину головного мозку. Пухлина розташована на дірчастій пластинці (lamina cribrosa). До якої кістки черепа прилягає пухлина?", "o": ["Лобової кістки (os frontale).", "Потиличної кістки (os occipitale).", "Тім'яної кістки (os parietale).", "Решітчастої кістки (os ethmoidale).", "Клиноподібної кістки (os sphenoidale)."], "a": [3], "e": ["Лобова кістка охоплює решітчасту вирізкою, але дірчаста пластинка їй не належить.", "Потилична кістка — у задній черепній ямці.", "Тім'яна кістка утворює склепіння.", "Дірчаста пластинка (lamina cribrosa) належить решітчастій кістці, через неї проходять нюхові нитки.", "Клиноподібна кістка розташована позаду решітчастої."]}, {"n": "3.8", "q": "В онкологічне відділення лікарні госпіталізовано дівчинку 2-ох років з пухлиною, що розташована в носовій частині глотки. Після додаткового обстеження лікар виявив, що пухлина вросла в глотковий горбок (tuberculum pharyngeum). Яка кістка уражена пухлиною?", "o": ["Лобова кістка (os frontale).", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Скронева кістка (os temporale).", "Решітчаста кістка (os ethmoidale)."], "a": [1], "e": ["Лобова кістка не має глоткового горбка.", "Глотковий горбок (tuberculum pharyngeum) — на нижній поверхні основної частини потиличної кістки, до нього кріпиться глотка.", "Тім'яна кістка утворює склепіння.", "Скронева кістка не має глоткового горбка.", "Решітчаста кістка розташована у передній частині основи черепа."]}, {"n": "3.9", "q": "У лікарню каретою швидкої медичної допомоги доставлено юнака 12 років з травмою голови. Після рентгенологічного дослідження лікар виявив перелом кістки черепа. Лінія перелому проходить через надперенісся (glabella). Яка кістка травмована?", "o": ["Тім'яна кістка (os parietale).", "Лобова кістка (os frontale).", "Потилична кістка (os occipitale).", "Решітчаста кістка (os ethmoidale).", "Носова кістка (os nasale)."], "a": [1], "e": ["Тім'яна кістка утворює склепіння, надперенісся не має.", "Надперенісся (glabella) — гладка ділянка лобової луски між надбрівними дугами.", "Потилична кістка розташована ззаду.", "Решітчаста кістка лежить глибше, між очними ямками.", "Носова кістка лежить нижче надперенісся."]}, {"n": "3.10", "q": "У лікарню госпіталізовано чоловіка 45 років з ножовим пораненням ока. Після обстеження лікар також виявив ушкодження кістки черепа в ділянці ямки сльозової залози. Яка кістка черепа ушкоджена?", "o": ["Потилична кістка (os occipitale).", "Решітчаста кістка (os ethmoidale).", "Тім'яна кістка (os parietale).", "Лобова кістка (os frontale).", "Скронева кістка (os temporale)."], "a": [3], "e": ["Потилична кістка не бере участі в утворенні очної ямки.", "Решітчаста кістка утворює присередню стінку очної ямки.", "Тім'яна кістка не входить до очної ямки.", "Ямка сльозової залози — на очноямковій частині лобової кістки, біля виличного відростка.", "Скронева кістка не утворює стінок очної ямки."]}, {"n": "3.11", "q": "У чоловіка 20 років під час рентгенологічного обстеження виявлено ушкодження правої очноямкової частини лобової кістки. Як називається площина, що ділить тіло людини навпіл, на праву та ліву половини?", "o": ["Горизонтальна площина.", "Стрілова площина.", "Лобова площина.", "Поперечна площина.", "Присерединна площина."], "a": [1], "e": ["Горизонтальна площина ділить тіло на верхню і нижню частини.", "Стрілова (серединна) площина ділить тіло на праву і ліву половини.", "Лобова площина ділить тіло на передню і задню частини.", "Поперечна площина — те саме, що горизонтальна.", "Присерединні площини паралельні серединній, але не ділять тіло навпіл."]}, {"n": "3.12", "q": "З місця спортивних змагань у лікарню госпіталізовано хлопчика з травмою обличчя. Лікар під час МРТ-обстеження встановив перелом кістки черепа. Лінія перелому проходить вздовж підочноямкового краю (margo infraorbitalis). Яка кістка травмована?", "o": ["Лобова кістка (os frontale).", "Верхня щелепа (maxilla).", "Носова кістка (os nasale).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Лобова кістка утворює надочноямковий край.", "Підочноямковий край (margo infraorbitalis) утворює верхня щелепа (з участю виличної кістки).", "Носова кістка утворює спинку носа.", "Нижня щелепа не входить до очної ямки.", "Піднебінна кістка має невеликий очноямковий відросток глибоко в очній ямці."]}, {"n": "3.13", "q": "У лікарню каретою швидкої медичної допомоги госпіталізовано дівчину з черепно-мозковою травмою. Після обстеження виникла необхідність хірургічного втручання. Під час операції нейрохірург обробляє рану в ділянці надперенісся. Яка кістка ушкоджена?", "o": ["Лобова кістка (os frontale).", "Носова кістка (os nasale).", "Клиноподібна кістка (os sphenoidale).", "Верхня щелепа (maxilla).", "Решітчаста кістка (os ethmoidale)."], "a": [0], "e": ["Надперенісся (glabella) розташоване на лобовій кістці.", "Носова кістка лежить нижче надперенісся.", "Клиноподібна кістка розташована в основі черепа.", "Верхня щелепа — у середній частині обличчя.", "Решітчаста кістка лежить глибоко між очними ямками."]}, {"n": "3.14", "q": "У хірургічне відділення госпіталізовано хлопчика з травмою обличчя. Лікар приймального відділення встановив ушкодження кістки черепа, яка приймає участь в утворенні кісткової носової перегородки. Яка кістка ушкоджена в цьому випадку?", "o": ["Лобова кістка (os frontale).", "Носова кістка (os nasale).", "Клиноподібна кістка (os sphenoidale).", "Верхня щелепа (maxilla).", "Решітчаста кістка (os ethmoidale)."], "a": [4], "e": ["Лобова кістка утворює носову ость, але основна частина перегородки — не вона.", "Носова кістка утворює спинку носа.", "Клиноподібна кістка має гребінь, але основна частина перегородки утворена іншими кістками.", "Верхня щелепа має носовий гребінь, але перегородку переважно утворює перпендикулярна пластинка решітчастої кістки разом з лемешем.", "Перпендикулярна пластинка решітчастої кістки утворює верхню частину кісткової носової перегородки."]}, {"n": "3.15", "q": "У чоловіка 20 років на тлі гнійного запалення слизової оболонки носової порожнини процес поширився у передню черепну ямку. Через який анатомічний утвір розповсюдилось запалення?", "o": ["Foramina cribrosa.", "Foramen ovale.", "Foramen ethmoidalae posterius.", "Foramen sphenopalatinum.", "Foramen rotundum."], "a": [0], "e": ["Отвори дірчастої пластинки (foramina cribrosa) з'єднують носову порожнину з передньою черепною ямкою.", "Овальний отвір — у середній черепній ямці, з'єднує її з підскроневою ямкою.", "Задній решітчастий отвір з'єднує очну ямку з порожниною черепа, а не носову порожнину.", "Клино-піднебінний отвір з'єднує носову порожнину з крило-піднебінною ямкою.", "Круглий отвір з'єднує середню черепну ямку з крило-піднебінною ямкою."]}, {"n": "3.16", "q": "У лікарню госпіталізовано чоловіка з травмою голови. Після обстеження лікар встановив перелом кістки мозкового черепа. Лінія перелому проходить через виличний відросток. Яка кістка травмована?", "o": ["Скронева кістка (os temporale).", "Нижня щелепа (mandibula).", "Вилична кістка (os zygomaticum).", "Клиноподібна кістка (os sphenoidale).", "Піднебінна кістка (os palatinum)."], "a": [0], "e": ["Виличний відросток скроневої кістки — частина мозкового черепа.", "Нижня щелепа належить до лицевого черепа.", "Вилична кістка — кістка лицевого черепа.", "Клиноподібна кістка не має виличного відростка.", "Піднебінна кістка — кістка лицевого черепа."]}, {"n": "3.17", "q": "У дитячу лікарню каретою швидкої медичної допомоги доставлено дитину 8 місяців з травмою голови у ділянці переднього тім'ячка. Рентгенологічно виявлено ушкодження кістки, що обмежує це тім'ячко спереду. Яка кістка ушкоджена?", "o": ["Скронева кістка (os temporale).", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Клиноподібна кістка (os sphenoidale).", "Лобова кістка (os frontale)."], "a": [4], "e": ["Скронева кістка не межує з переднім тім'ячком.", "Потилична кістка обмежує заднє тім'ячко.", "Тім'яні кістки обмежують переднє тім'ячко ззаду.", "Клиноподібна кістка обмежує клиноподібне тім'ячко.", "Спереду переднє тім'ячко обмежене двома половинами лобової кістки."]}, {"n": "3.18", "q": "У дівчинки з довготривалим запаленням слизової оболонки носової порожнини з'явилися симптоми запалення лобової пазухи (фронтит). Через який утвір стало можливим розповсюдження інфекції в лобову пазуху?", "o": ["Клино-піднебінний отвір.", "Решітчасті комірки.", "Півмісяцевий розтвір.", "Решітчасту лійку.", "Клино-решітчастий закуток."], "a": [3], "e": ["Клино-піднебінний отвір веде в крило-піднебінну ямку.", "Решітчасті комірки відкриваються в носові ходи, але не є шляхом до лобової пазухи.", "Півмісяцевий розтвір — щілина в середньому носовому ході, лобова пазуха відкривається через лійку.", "Лобова пазуха відкривається в середній носовий хід через решітчасту лійку (infundibulum ethmoidale).", "Клино-решітчастий закуток — місце відкриття клиноподібної пазухи."]}, {"n": "3.19", "q": "Чоловік звернувся до лікаря зі скаргами на нежить та головний біль. Після рентгенологічного обстеження лікар виявив фронтит (запалення слизової оболонки лобової пазухи). З якого носового ходу стало можливим розповсюдження інфекції з носової порожнини в лобову пазуху?", "o": ["Meatus nasi communis.", "Meatus nasi superior.", "Meatus nasi medius.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — простір між раковинами і перегородкою.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Лобова пазуха відкривається в середній носовий хід.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід веде в глотку."]}, {"n": "3.20", "q": "У лікарню каретою швидкої медичної допомоги госпіталізовано чоловіка з травмою носа. Лікар діагностував перелом кістки черепа, що обмежує верхній край грушоподібного отвору кісткової носової порожнини. Яка кістка ушкоджена в даному випадку?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [3], "e": ["Сльозова кістка розташована в очній ямці.", "Верхня щелепа обмежує грушоподібний отвір знизу і з боків.", "Лобова кістка не обмежує грушоподібний отвір.", "Верхній край грушоподібного отвору утворюють носові кістки.", "Решітчаста кістка розташована глибше всередині носової порожнини."]}, {"n": "3.21", "q": "Обстежуючи жінку 35 років, лікар виявив розповсюдження запалення з ділянки надочноямкового отвору в очну ямку. На якій кістці розташований надочноямковий отвір?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [2], "e": ["Сльозова кістка — у присередній стінці очної ямки.", "Верхня щелепа має підочноямковий отвір, а не надочноямковий.", "Надочноямковий отвір (вирізка) розташований на надочноямковому краї лобової кістки.", "Носова кістка не має надочноямкового отвору.", "Решітчаста кістка має решітчасті отвори, а не надочноямковий."]}, {"n": "3.22", "q": "У хірургічне відділення госпіталізовано чоловіка 20 років з черепно-мозковою травмою. Після проведення рентгенологічного дослідження лікар виявив на Ro-зображенні ушкодження очноямкової пластинки однієї із кісток мозкового черепа, яка приймає участь в утворенні присередньої стінки правої очної ямки. Яка кістка ушкоджена в цьому випадку?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [4], "e": ["Сльозова кістка утворює присередню стінку, але це не кістка мозкового черепа.", "Верхня щелепа — кістка лицевого черепа.", "Лобова кістка утворює переважно верхню стінку.", "Носова кістка не бере участі в утворенні очної ямки.", "Очноямкова пластинка решітчастої кістки утворює присередню стінку очної ямки."]}, {"n": "3.23", "q": "У чоловіка 45 років під час обстеження лікар-онколог виявив пухлину стовбура головного мозку, яка проростає в кістку мозкового черепа, що утворює схил. Яка кістка ушкоджена в цьому випадку?", "o": ["Скронева кістка (os temporale).", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale)."], "a": [1], "e": ["Скронева кістка не утворює схилу.", "Схил (clivus) утворений основною частиною потиличної кістки разом з тілом клиноподібної.", "Тім'яна кістка утворює склепіння.", "Решітчаста кістка лежить у передній черепній ямці.", "Лобова кістка утворює передню черепну ямку."]}, {"n": "3.24", "q": "У ЛОР-відділення лікарні звернувся чоловік 50 років зі скаргами на втрату будь-якого запаху. При об'єктивному обстеженні носової порожнини ушкоджень не виявлено. Лікар припустив, що виникло порушення проведення нервового імпульсу на рівні ділянки периферійного відділу нюхового мозку. Через утвір якої кістки мозкового черепа волокна нюхового нерва потрапляють в порожнину черепа?", "o": ["Скроневої кістки (os temporale).", "Потиличної кістки (os occipitale).", "Тім'яної кістки (os parietale).", "Решітчастої кістки (os ethmoidale).", "Клиноподібної кістки (os sphenoidale)."], "a": [3], "e": ["Скронева кістка не має отворів для нюхових ниток.", "Потилична кістка не пропускає нюхових ниток.", "Тім'яна кістка утворює склепіння.", "Нюхові нитки проходять через отвори дірчастої пластинки решітчастої кістки.", "Клиноподібна кістка пропускає зоровий нерв, а не нюхові нитки."]}, {"n": "3.25", "q": "У чоловіка 67 років внаслідок підвищеного артеріального тиску на тлі гіпертонічної хвороби стався розрив стінки arteria basilaris, що прилягає до схилу на основі черепа. Які кістки черепа утворюють схил?", "o": ["Скронева кістка (os temporale) та потилична кістка (os occipitale).", "Потилична кістка (os occipitale) та тім'яна кістка (os parietale).", "Потилична кістка (os occipitale) та клиноподібна (os sphenoidale).", "Решітчаста кістка (os ethmoidale) та клиноподібна (os sphenoidale).", "Лобова кістка (os frontale) та клиноподібна (os sphenoidale)."], "a": [2], "e": ["Скронева кістка не бере участі в утворенні схилу.", "Тім'яна кістка утворює склепіння, а не схил.", "Схил утворюють основна частина потиличної кістки і тіло клиноподібної кістки.", "Решітчаста кістка розташована в передній черепній ямці.", "Лобова кістка утворює передню черепну ямку."]}, {"n": "3.26", "q": "Внаслідок травми лицевої ділянки голови ушкоджена верхня стінка правої очної ямки. Чоловік втратив можливість піднімати верхню повіку правого ока і дивитися вгору. Яка кістка, що спереду утворює верхню стінку правої очної ямки, ушкоджена?", "o": ["Сльозова кістка.", "Верхня щелепа.", "Лобова кістка.", "Носова кістка.", "Решітчаста кістка."], "a": [2], "e": ["Сльозова кістка утворює присередню стінку.", "Верхня щелепа утворює нижню стінку очної ямки.", "Верхню стінку очної ямки спереду утворює очноямкова частина лобової кістки.", "Носова кістка не входить до очної ямки.", "Решітчаста кістка утворює присередню стінку."]}, {"n": "3.27", "q": "У нейрохірургічне відділення госпіталізовано чоловіка з тромбозом внутрішньої яремної вени у ділянці яремного отвору. Внаслідок цього виявлені симптоми стиснення черепних нервів, волокна яких також проходять через цей отвір. Яка з кісток черепа приймає участь в утворенні яремного отвору?", "o": ["Сльозова кістка.", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale)."], "a": [1], "e": ["Сльозова кістка розташована в очній ямці.", "Яремний отвір утворений яремними вирізками потиличної та скроневої кісток.", "Тім'яна кістка утворює склепіння.", "Решітчаста кістка лежить у передній черепній ямці.", "Лобова кістка утворює передню черепну ямку."]}, {"n": "3.28", "q": "У чоловіка 45 років спостерігається зниження виділення секрету сльозовою залозою у сполучнооболонковий мішок, що призвело до висихання волокнистої оболонки очного яблука. Симптоми з'явилися після травми кісток бічної стінки очної ямки. На якій кістці лежить сльозова залоза?", "o": ["Сльозова кістка.", "Потилична кістка (os occipitale).", "Тім'яна кістка (os parietale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale)."], "a": [4], "e": ["Сльозова кістка містить ямку сльозового мішка, а не залози.", "Потилична кістка не бере участі в утворенні очної ямки.", "Тім'яна кістка не бере участі в утворенні очної ямки.", "Решітчаста кістка утворює присередню стінку.", "Сльозова залоза лежить у ямці на очноямковій частині лобової кістки."]}, {"n": "3.29", "q": "У лікарню госпіталізовано чоловіка 45 років з переломом кісток основи черепа в ділянці великого потиличного отвору. Лікар встановив ушкодження під'язикового нерва в місці його проходження через одноіменний канал. До якої частини потиличної кістки відноситься canalis nervi hypoglossi?", "o": ["Основної частини.", "Великого отвору.", "Потиличної луски.", "Бічної частини.", "Схилу."], "a": [3], "e": ["Основна частина утворює схил і глотковий горбок.", "Великий отвір — це отвір, а не частина кістки.", "Потилична луска розташована ззаду.", "Канал під'язикового нерва проходить через бічну частину над потиличним виростком.", "Схил — частина основної частини."]}, {"n": "3.30", "q": "Потерпілому 32 років із травмою носа і носовою кровотечею лікар здійснив передню тампонаду носової порожнини. На МРТ-зображенні виявлено перелом носової перегородки та середньої носової раковини. Утвори якої кістки ушкоджені?", "o": ["Сльозової кістки (os lacrimale).", "Потиличної кістки (os occipitale).", "Тім'яної кістки (os parietale).", "Решітчастої кістки (os ethmoidale).", "Лобової кістки (os frontale)."], "a": [3], "e": ["Сльозова кістка розташована в очній ямці.", "Потилична кістка не бере участі в утворенні носової порожнини.", "Тім'яна кістка не бере участі в утворенні носової порожнини.", "Середня носова раковина і перпендикулярна пластинка (частина носової перегородки) належать решітчастій кістці.", "Лобова кістка утворює лише невелику частину склепіння носової порожнини."]}], "models": [["Череп — розібраний на кістки", "o3d:exploded-skull", {"ru": "Череп, разобранный на кости", "en": "Exploded skull"}], ["Череп з підписами", "o3d:overview-skull", {"ru": "Череп с подписями", "en": "Labelled skull"}], ["Кістки черепа різними кольорами", "sf:d1d1aed420424c8db784391ad8261a2f", {"ru": "Кости черепа разными цветами", "en": "Colour-coded skull bones"}]]}, {"id": "topic4", "title": "4. Скронева кістка, клиноподібна кістка (os temporale, os shpenoideum)", "tr": {}, "questions": [{"n": "4.1", "q": "Жінку 45 років госпіталізовано в лікарню з гнійним запаленням барабанної порожнини. У хворої протягом тижня спостерігалися ознаки запалення слизової оболонки носової порожнини і глотки, що призвело до поширення інфекції в барабанну порожнину за ходом слухової труби (tuba auditiva). Через який канал скроневої кістки інфекція потрапила в барабанну порожнину?", "o": ["М'язово-трубний канал (canalis musculotubarius).", "Барабанний каналець (canaliculus tympanicus).", "Сонний канал (canalis caroticus).", "Каналець барабанної струни (canaliculus chordae tympani).", "Канал лицевого нерва (canalis nervi facialis)."], "a": [0], "e": ["М'язово-трубний канал містить півканал слухової труби, що з'єднує барабанну порожнину з носоглоткою — шлях інфекції з глотки.", "Барабанний каналець пропускає барабанний нерв (від IX пари), з глоткою не сполучається.", "Сонний канал пропускає внутрішню сонну артерію.", "Каналець барабанної струни пропускає chorda tympani в барабанну порожнину.", "Канал лицевого нерва пропускає VII нерв до шило-соскоподібного отвору."]}, {"n": "4.2", "q": "У лікарню госпіталізовано чоловіка 55 років з травмою ока. Крім ушкодження очного яблука, лікар діагностував перелом очноямкової поверхні (facies orbitalis) клиноподібної кістки (os sphenoidale). На якій частині клиноподібної кістки розташована facies orbitalis?", "o": ["Тіло (corpus).", "Мале крило (ala minor).", "Велике крило (ala major).", "Крилоподібний відросток (processus pterygoideus).", "Турецьке сідло (sella turcica)."], "a": [2], "e": ["Тіло клиноподібної кістки містить пазуху і турецьке сідло, очноямкової поверхні не має.", "Мале крило утворює частину верхньої стінки очної ямки і обмежує зоровий канал, але facies orbitalis — на великому крилі.", "Очноямкова поверхня (facies orbitalis) — одна з поверхонь великого крила, утворює бічну стінку очної ямки.", "Крилоподібний відросток спрямований донизу, до очної ямки не належить.", "Турецьке сідло — заглибина на верхній поверхні тіла для гіпофіза."]}, {"n": "4.3", "q": "У нейрохірургічне відділення лікарні госпіталізовано жінку 56 років із внутрішньочерепною пухлиною. Додаткове обстеження виявило, що уражені пухлиною клиноподібна і потилична кістки в місці їх зрощення на основі черепа. Яка частина клиноподібної кістки уражена пухлиною?", "o": ["Правий крилоподібний відросток (processus pterygoideus dexter).", "Мале крило (ala minor).", "Велике крило (ala major).", "Тіло (corpus).", "Лівий крилоподібний відросток (processus pterygoideus sinister)."], "a": [3], "e": ["Крилоподібний відросток спрямований донизу й не з'єднується з потиличною кісткою.", "Мале крило розташоване спереду, з потиличною кісткою не контактує.", "Велике крило з'єднується зі скроневою, лобовою, тім'яною кістками, але не з потиличною.", "Тіло клиноподібної кістки зростається з основною частиною потиличної, утворюючи схил.", "Лівий крилоподібний відросток спрямований донизу й не межує з потиличною кісткою."]}, {"n": "4.4", "q": "У нейрохірургічне відділення лікарні госпіталізовано жінку 46 років з пухлиною гіпофіза. КТ-обстеження хворої виявило, що пухлина зруйнувала спинку турецького сідла. Яка кістка ушкоджена пухлиною?", "o": ["Скронева кістка (os temporale).", "Клиноподібна кістка (os sphenoidale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Потилична кістка (os occipitale)."], "a": [1], "e": ["Скронева кістка не має турецького сідла.", "Турецьке сідло зі спинкою (dorsum sellae) — на тілі клиноподібної кістки.", "Решітчаста кістка розташована спереду, у передній черепній ямці.", "Лобова кістка утворює передню черепну ямку.", "Потилична кістка утворює задню черепну ямку; схил лише продовжує спинку сідла."]}, {"n": "4.5", "q": "У чоловіка 34 років діагностовано стиснення chorda tympani в місці її виходу із барабанної порожнини в підскроневу ямку через одну із щілин скроневої кістки. У ділянці якої щілини стиснута барабанна струна (chorda tympani)?", "o": ["Fissura petrotympanica.", "Fissura tympanomastoidea.", "Fissura petrosquamosa.", "Fissura sphenopetrosa.", "Fissura petrooccipitalis."], "a": [0], "e": ["Через кам'янисто-барабанну щілину (Глазерову) chorda tympani виходить з барабанної порожнини.", "Барабанно-соскоподібна щілина пропускає вушну гілку блукаючого нерва.", "Кам'янисто-лускова щілина — межа між пірамідою та лускою, chorda tympani не проходить.", "Клино-кам'яниста щілина — між клиноподібною кісткою та пірамідою.", "Кам'янисто-потилична щілина — між пірамідою та потиличною кісткою."]}, {"n": "4.6", "q": "До лікаря-стоматолога звернувся чоловік зі скаргами на біль у ділянці проєкції скронево-нижньощелепного суглоба, що виникає під час жування. Після обстеження лікар встановив запалення утвору скроневої кістки, що розташований спереду від нижньощелепної ямки та під основою виличного відростка. Який утвір скроневої кістки уражений?", "o": ["Дугове підвищення (eminentia arcuata).", "Суглобовий горбок (tuberculum articulare).", "Барабанне кільце (anulus tympanicus).", "Шилоподібний відросток (processus styloideus).", "Соскоподібний відросток (processus mastoideus)."], "a": [1], "e": ["Дугове підвищення — на передній поверхні піраміди, над переднім півколовим каналом.", "Суглобовий горбок (tuberculum articulare) лежить спереду від нижньощелепної ямки під основою виличного відростка.", "Барабанне кільце — зачаток барабанної частини у новонароджених.", "Шилоподібний відросток розташований позаду й нижче, до суглоба не входить.", "Соскоподібний відросток лежить позаду зовнішнього слухового ходу."]}, {"n": "4.7", "q": "Для уточнення діагнозу лікар направив у діагностичний центр чоловіка 45 років з симптомами порушення функцій VII та VIII пар черепних нервів. Після МРТ-обстеження виявлено, що нерви стиснуті пухлиною в лівому внутрішньому слуховому отворі (porus acusticus internus). Біля отвору якої кістки пухлина стискає нерви?", "o": ["Лівої скроневої кістки.", "Клиноподібної кістки.", "Лівої потиличної кістки.", "Лівої тім'яної кістки.", "Решітчастої кістки."], "a": [0], "e": ["Внутрішній слуховий отвір розташований на задній поверхні піраміди скроневої кістки; через нього проходять VII і VIII нерви.", "Клиноподібна кістка не має слухового отвору.", "На потиличній кістці внутрішнього слухового отвору немає.", "Тім'яна кістка не має слухових отворів.", "Решітчаста кістка розташована в передній черепній ямці."]}, {"n": "4.8", "q": "У онкологічне відділення лікарні госпіталізовано чоловіка з позачерепною пухлиною голови. Під час операції хірург видалив разом із пухлиною частину стінки зовнішнього слухового ходу (meatus acusticus externus). Частину якої кістки видалив хірург?", "o": ["Лобової кістки (os frontale).", "Скроневої кістки (os temporale).", "Решітчастої кістки (os ethmoidale).", "Клиноподібної кістки (os sphenoidale).", "Потиличної кістки (os occipitale)."], "a": [1], "e": ["Лобова кістка не утворює слухового ходу.", "Стінки кісткового зовнішнього слухового ходу утворює переважно барабанна частина скроневої кістки.", "Решітчаста кістка — у передній частині черепа.", "Клиноподібна кістка не утворює слухового ходу.", "Потилична кістка не утворює слухового ходу."]}, {"n": "4.9", "q": "У нейрохірургічну клініку госпіталізовано чоловіка з внутрішньочерепною пухлиною. Після обстеження встановлено, що пухлина звужує простір, який обмежений великим і малим крилами клиноподібної кістки. Який простір звужує пухлина?", "o": ["Верхню очноямкову щілину (fissura orbitalis superior).", "Остистий отвір (foramen spinosum).", "Овальний отвір (foramen ovale).", "Круглий отвір (foramen rotundum).", "Крилоподібний канал (canalis pterygoideus)."], "a": [0], "e": ["Верхня очноямкова щілина обмежена великим і малим крилами клиноподібної кістки.", "Остистий отвір розташований у великому крилі, пропускає середню оболонну артерію.", "Овальний отвір у великому крилі пропускає нижньощелепний нерв.", "Круглий отвір у великому крилі пропускає верхньощелепний нерв.", "Крилоподібний канал проходить в основі крилоподібного відростка."]}, {"n": "4.10", "q": "Лікар діагностичного центру виявив у чоловіка внутрішньочерепну пухлину, що росте в покрівлю барабанної порожнини (tegmen tympani). Яка частина скроневої кістки зруйнована пухлиною?", "o": ["Кам'яниста частина (pars petrosa).", "Лускова частина (pars squamosa).", "Барабанна частина (pars tympanica).", "Соскоподібний відросток (processus mastoideus).", "Шилоподібний відросток (processus styloideus)."], "a": [0], "e": ["Покрівля барабанної порожнини (tegmen tympani) — частина передньої поверхні кам'янистої частини (піраміди).", "Лускова частина утворює бічну стінку черепа.", "Барабанна частина утворює стінки зовнішнього слухового ходу.", "Соскоподібний відросток містить соскоподібні комірки, але покрівля барабанної порожнини не на ньому.", "Шилоподібний відросток — місце кріплення м'язів та зв'язок."]}, {"n": "4.11", "q": "Після дорожньо-транспортної пригоди у лікарню госпіталізовано жінку з переломом скроневої кістки, який ускладнений кровотечею з пазухи твердої оболони головного мозку. Розрив стінки пазухи виник в тому місці, де вона прилягає до борозни на внутрішній (мозковій) поверхні соскоподібного відростка скроневої кістки. У ділянці якої борозни ушкоджена пазуха твердої оболони головного мозку?", "o": ["Борозни верхньої стрілової пазухи (sulcus sinus sagittalis superioris).", "Борозни нижньої кам'янистої пазухи (sulcus sinus petrosi inferioris).", "Борозни сигмоподібної пазухи (sulcus sinus sigmoidei).", "Борозни верхньої кам'янистої пазухи (sulcus sinus petrosi superioris).", "Борозни поперечної пазухи (sulcus sinus transversi)."], "a": [2], "e": ["Борозна верхньої стрілової пазухи — по серединній лінії склепіння.", "Борозна нижньої кам'янистої пазухи — на задньому краї піраміди.", "На внутрішній поверхні соскоподібного відростка проходить борозна сигмоподібної пазухи.", "Борозна верхньої кам'янистої пазухи — на верхньому краї піраміди.", "Борозна поперечної пазухи — на потиличній кістці."]}, {"n": "4.12", "q": "У лікарню госпіталізовано чоловіка 57 років з гнійним запаленням глибоких лімфатичних вузлів шиї. Запалення поширилося на нерв, волокна якого через канал скроневої кістки, вхідним отвором якого є fossula petrosa, потрапляють в барабанну порожнину. На якій поверхні скроневої кістки розташована кам'яниста ямочка та який канал скроневої кістки в ній починається?", "o": ["На передній поверхні піраміди, барабанний каналець.", "На задній поверхні піраміди, барабанний каналець.", "На нижній поверхні піраміди, барабанний каналець.", "На нижній поверхні піраміди, соскоподібний каналець.", "На нижній поверхні піраміди, каналець барабанної струни."], "a": [2], "e": ["На передній поверхні піраміди — розтвори каналів кам'янистих нервів, а не кам'яниста ямочка.", "На задній поверхні — внутрішній слуховий отвір, кам'яниста ямочка не там.", "Кам'яниста ямочка — на нижній поверхні піраміди, у ній починається барабанний каналець для барабанного нерва.", "Соскоподібний каналець починається в яремній ямці, а не в кам'янистій ямочці.", "Каналець барабанної струни відходить від каналу лицевого нерва."]}, {"n": "4.13", "q": "У лікарню госпіталізовано жінку 53 років з черепно-мозковою травмою. Рентгенологічно у неї виявлено перелом шилоподібного відростка (processus styloideus). Яка кістка ушкоджена?", "o": ["Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Клиноподібна кістка (os sphenoidale).", "Скронева кістка (os temporale).", "Потилична кістка (os occipitale)."], "a": [3], "e": ["Решітчаста кістка не має шилоподібного відростка.", "Лобова кістка не має шилоподібного відростка.", "Клиноподібна кістка має крилоподібні відростки, а не шилоподібний.", "Шилоподібний відросток відходить від нижньої поверхні піраміди скроневої кістки.", "Потилична кістка має виростки, а не шилоподібний відросток."]}, {"n": "4.14", "q": "Виконуючи обстеження жінки 45 років, нейрохірург виявив звуження просвіту внутрішньої сонної артерії в місці її розташування на сонній борозні (sulcus caroticus) в середній черепній ямці. На якій кістці знаходиться звужена ділянка внутрішньої сонної артерії?", "o": ["Потиличній кістці (os occipitale).", "Скроневій кістці (os temporale).", "Решітчастій кістці (os ethmoidale).", "Лобовій кістці (os frontale).", "Клиноподібній кістці (os sphenoidale)."], "a": [4], "e": ["Потилична кістка не має сонної борозни.", "Сонний канал проходить у піраміді скроневої кістки, але сонна борозна — в іншому місці.", "Решітчаста кістка розташована в передній черепній ямці.", "Лобова кістка утворює передню черепну ямку.", "Сонна борозна розташована на бічній поверхні тіла клиноподібної кістки."]}, {"n": "4.15", "q": "Під час операції по закриттю вродженого розщеплення піднебіння (уранопластики), при збиванні долотом крилоподібного гачка, ушкоджено великий піднебінний канал і нерв, що проходить в цьому каналі. На якому утворі клиноподібної кістки розташований крилоподібний гачок?", "o": ["Lamina medialis processus pterygoidei.", "Ala minor.", "Ala major.", "Corpus.", "Lamina lateralis processus pterygoidei."], "a": [0], "e": ["Крилоподібний гачок — на кінці присередньої пластинки крилоподібного відростка.", "Мале крило розташоване вгорі, гачка не має.", "Велике крило не має крилоподібного гачка.", "Тіло — центральна частина з пазухою.", "Бічна пластинка крилоподібного відростка гачка не має."]}, {"n": "4.16", "q": "У лікарню каретою швидкої медичної допомоги доставлено юнака з травмою голови. Після рентгенологічного обстеження лікар виявив перелом кістки черепа. Лінія перелому проходить через підскроневий гребінь. Яка кістка травмована?", "o": ["Тім'яна кістка (os parietale).", "Клиноподібна кістка (os sphenoidale).", "Потилична кістка (os occipitale).", "Решітчаста кістка (os ethmoidale).", "Носова кістка (os nasale)."], "a": [1], "e": ["Тім'яна кістка не має підскроневого гребеня.", "Підскроневий гребінь розташований на скроневій поверхні великого крила клиноподібної кістки.", "Потилична кістка не має підскроневого гребеня.", "Решітчаста кістка не має підскроневого гребеня.", "Носова кістка не має підскроневого гребеня."]}, {"n": "4.17", "q": "У лікарню госпіталізовано жінку 64 років, у якої на тлі травми нижньої щелепи виникло порушення смакової чутливості на слизовій оболонці передніх 2/3 язика. Лікар впевнений, що хвороба обумовлена ураженням нервових волокон барабанної струни, в місці її виходу з барабанної порожнини через щілину скроневої кістки. Крізь яку щілину скроневої кістки барабанна струна виходить з барабанної порожнини?", "o": ["Fissura petrotympanica.", "Fissura tympanomastoidea.", "Fissura petrosquamosa.", "Fissura sphenopetrosa.", "Fissura petrooccipitalis."], "a": [0], "e": ["Барабанна струна виходить з барабанної порожнини через кам'янисто-барабанну щілину.", "Барабанно-соскоподібна щілина пропускає вушну гілку блукаючого нерва.", "Кам'янисто-лускова щілина — межа між частинами скроневої кістки.", "Клино-кам'яниста щілина — між клиноподібною кісткою та пірамідою.", "Кам'янисто-потилична щілина — між пірамідою та потиличною кісткою."]}, {"n": "4.18", "q": "У нейрохірургічне відділення госпіталізовано чоловіка 54 років зі скаргами на відсутність чутливості шкіри нижньої повіки, бічної поверхні зовнішнього носа, верхньої губи. Лікар під час огляду діагностував запалення другої гілки трійчастого нерва. Через який утвір гілки цього нерва виходять із середньої черепної ямки в крило-піднебінну ямку?", "o": ["Круглий отвір.", "Рваний отвір.", "Овальний отвір.", "Нижню очноямкову щілину.", "Верхню очноямкову щілину."], "a": [0], "e": ["Верхньощелепний нерв (друга гілка V пари) виходить з середньої черепної ямки через круглий отвір у крило-піднебінну ямку.", "Рваний отвір закритий хрящем; через нього проходять кам'янисті нерви.", "Через овальний отвір проходить нижньощелепний нерв (третя гілка).", "Нижня очноямкова щілина з'єднує крило-піднебінну ямку з очною ямкою, але не з черепною ямкою.", "Через верхню очноямкову щілину проходить перша гілка (очний нерв)."]}, {"n": "4.19", "q": "У чоловіка 45 років з черепно-мозковою травмою лікар виявив перелом кістки основи черепа. Лінія перелому проходить через остистий і овальний отвори. Яка кістка ушкоджена?", "o": ["Лобова кістка (os frontale).", "Скронева кістка (os temporale).", "Решітчаста кістка (os ethmoidale).", "Клиноподібна кістка (os sphenoidale).", "Потилична кістка (os occipitale)."], "a": [3], "e": ["Лобова кістка не має остистого та овального отворів.", "Скронева кістка лише межує з ними, але отвори розташовані не на ній.", "Решітчаста кістка має дірчасту пластинку.", "Остистий і овальний отвори розташовані у великому крилі клиноподібної кістки.", "Потилична кістка має великий отвір та яремний."]}, {"n": "4.20", "q": "У дитини 6 років гнійне запалення середнього вуха ускладнилося гнійним запаленням комірок соскоподібного відростка. Виникла необхідність трепанації (розтину) соскоподібного відростка. На якій кістці черепа проводить трепанацію лікар та про близьке розташування якої венозної пазухи слід пам'ятати хірургу, щоб уникнути її травмування?", "o": ["На скроневій кістці, сигмоподібної.", "На скроневій кістці, верхньої стрілової.", "На потиличній кістці, сигмоподібної.", "На скроневій кістці, поперечної.", "На потиличній кістці, поперечної."], "a": [0], "e": ["Соскоподібний відросток належить скроневій кістці, а на його внутрішній поверхні проходить сигмоподібна пазуха.", "Верхня стрілова пазуха проходить по склепінню, далеко від соскоподібного відростка.", "Соскоподібний відросток — на скроневій кістці, а не на потиличній.", "Поперечна пазуха лежить на потиличній кістці, вище й позаду.", "Соскоподібний відросток не належить потиличній кістці."]}, {"n": "4.21", "q": "У чоловіка 56 років після запалення лімфатичних вузлів голови виникло стиснення рубцем волокон лицевого нерва біля отвору, через який він виходить із скроневої кістки на зовнішню поверхню основи черепа. Біля якого отвору стиснутий лицевий нерв?", "o": ["Шило-соскоподібного (foramen stylomastoideum).", "Внутрішнього слухового (porus acusticus internus).", "Соскоподібного (foramen mastoideum).", "Круглого (foramen rotundum).", "Зовнішнього слухового (porus acusticus externus)."], "a": [0], "e": ["Лицевий нерв виходить з черепа через шило-соскоподібний отвір.", "Через внутрішній слуховий отвір лицевий нерв входить у піраміду.", "Соскоподібний отвір пропускає випускну вену.", "Круглий отвір пропускає верхньощелепний нерв.", "Зовнішній слуховий отвір веде в зовнішній слуховий хід."]}, {"n": "4.22", "q": "У чоловіка 56 років ушкоджена барабанна перетинка. Лікар виявив порушення передачі звукових коливань барабанною перетинкою до перилімфи присінку внутрішнього вуха через систему слухових кісточок. Лікар підозрює порушення іннервації m. tensor tympani та m. stapedius, які забезпечують ступінь натягування барабанної перетинки і зміщення стремінця. На якій кістці бере початок m. tensor tympani та через який канал скроневої кістки потрапляє в барабанну порожнину", "o": ["Клиноподібній кістці, каналець барабанної струни.", "Скроневій кістці, м'язово-трубний канал (canalis musculotubarius).", "Клиноподібній кістці, м'язово-трубний канал (canalis musculotubarius).", "Клиноподібній кістці, барабанний каналець (canaliculus tympanicus).", "Скроневій кістці, барабанний каналець (canaliculus tympanicus)."], "a": [2], "e": ["Каналець барабанної струни пропускає chorda tympani, а не м'яз.", "М'язово-трубний канал правильний, але м'яз починається не лише від скроневої кістки.", "M. tensor tympani починається від великого крила клиноподібної кістки (та хряща слухової труби) і проходить у м'язово-трубному каналі.", "Барабанний каналець пропускає барабанний нерв.", "Барабанний каналець пропускає нерв, а м'яз починається від клиноподібної кістки."]}, {"n": "4.23", "q": "У чоловіка 25 років на МРТ-зображенні виявлена травма тім'яної, потиличної та скроневої кісток черепа, що супроводжується сильною кровотечею з пазухи твердої оболони головного мозку, яка прилягає до цих кісток. У місці якої борозни виникла кровотеча?", "o": ["Верхньої стрілової пазухи (sulcus sinus sagittalis superioris).", "Сигмоподібної пазухи (sulcus sinus sigmoidei).", "Поперечної пазухи (sulcus sinus transversi).", "Нижньої стрілової пазухи (sulcus sinus sagittalis inferioris).", "Потиличної пазухи (sulcus sinus occipitalis)."], "a": [2], "e": ["Верхня стрілова пазуха лежить між тім'яними кістками по серединній лінії.", "Сигмоподібна пазуха лежить переважно на скроневій кістці.", "Поперечна пазуха прилягає до потиличної кістки й соскоподібного кута тім'яної, переходячи в сигмоподібну біля скроневої.", "Нижня стрілова пазуха лежить у серпі мозку і борозни на кістках не утворює.", "Потилична пазуха лежить у серпі мозочка біля внутрішнього потиличного гребеня."]}, {"n": "4.24", "q": "У лікарню госпіталізована жінка 45 років з черепно-мозковою травмою. На МРТ-зображенні діагностовано перелом пластинок крилоподібного відростка. Яка кістка травмована?", "o": ["Тім'яна кістка (os parietale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Потилична кістка (os occipitale).", "Клиноподібна кістка (os sphenoidale)."], "a": [4], "e": ["Тім'яна кістка не має крилоподібного відростка.", "Решітчаста кістка не має крилоподібного відростка.", "Лобова кістка не має крилоподібного відростка.", "Потилична кістка не має крилоподібного відростка.", "Крилоподібні відростки з присередньою і бічною пластинками належать клиноподібній кістці."]}, {"n": "4.25", "q": "У лікарню потрапив чоловік з черепно-мозковою травмою. Рентгенологічно у пацієнта виявлено перелом кістки черепа. Лінія перелому проходить через соскоподібний відросток (processus mastoideus). Яка кістка ушкоджена?", "o": ["Клиноподібна кістка (os sphenoidale).", "Скронева кістка (os temporale).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale).", "Потилична кістка (os occipitale)."], "a": [1], "e": ["Клиноподібна кістка не має соскоподібного відростка.", "Соскоподібний відросток належить скроневій кістці.", "Решітчаста кістка не має соскоподібного відростка.", "Лобова кістка не має соскоподібного відростка.", "Потилична кістка має соскоподібний край, але не відросток."]}, {"n": "4.26", "q": "У лікарню госпіталізована жінка 50 років із ознаками тромбозу пазухи твердої оболони головного мозку. Під час МРТ-обстеження діагностовано тромбоз пазухи твердої оболони мозку в борозні, що розташована по верхньому краю піраміди скроневої кістки. У ділянці якої борозни виникло ушкодження?", "o": ["Борозни верхньої стрілової пазухи (sulcus sinus sagittalis superioris).", "Борозни нижньої кам'янистої пазухи (sulcus sinus petrosi inferioris).", "Борозни сигмоподібної пазухи (sulcus sinus sigmoidei).", "Борозни верхньої кам'янистої пазухи (sulcus sinus petrosi superioris).", "Борозни поперечної пазухи (sulcus sinus transversi)."], "a": [3], "e": ["Борозна верхньої стрілової пазухи — по серединній лінії склепіння.", "Борозна нижньої кам'янистої пазухи — по задньому краю піраміди.", "Борозна сигмоподібної пазухи — на внутрішній поверхні соскоподібної частини.", "Борозна верхньої кам'янистої пазухи проходить уздовж верхнього краю піраміди скроневої кістки.", "Борозна поперечної пазухи — на потиличній кістці."]}, {"n": "4.27", "q": "У чоловіка 56 років внаслідок гнійного запалення середнього вуха виникло руйнування задньої стінки барабанної порожнини з поширенням гною до печери соскоподібного відростка. Це ускладнилося ушкодженням нерва, що проходить в каналі скроневої кістки по задній стінці барабанної порожнини та виходить з черепа через шило-соскоподібний отвір. Який канал скроневої кістки ушкоджений?", "o": ["М'язово-трубний канал (canalis musculotubarius).", "Барабанний каналець (canaliculus tympanicus).", "Сонний канал (canalis caroticus).", "Каналець барабанної струни (canaliculus chordae tympani).", "Канал лицевого нерва (canalis nervi facialis)."], "a": [4], "e": ["М'язово-трубний канал пов'язує барабанну порожнину з глоткою.", "Барабанний каналець пропускає барабанний нерв.", "Сонний канал пропускає внутрішню сонну артерію.", "Каналець барабанної струни пропускає chorda tympani.", "Канал лицевого нерва проходить по присередній і задній стінках барабанної порожнини та закінчується шило-соскоподібним отвором."]}, {"n": "4.28", "q": "У нейрохірургічну клініку госпіталізовано жінку 57 років із ознаками внутрішньочерепної пухлини. Під час хірургічного втручання основний етап операції був здійснений у ділянці трійчастого втиснення (impressio trigeminalis). На якій кістці був здійснений основний етап операції?", "o": ["Клиноподібної кістки (os sphenoidale).", "Скроневої кістки (os temporale).", "Решітчастої кістки (os ethmoidale).", "Лобової кістки (os frontale).", "Потиличної кістки (os occipitale)."], "a": [1], "e": ["Клиноподібна кістка трійчастого втиснення не має.", "Трійчасте втиснення — на передній поверхні верхівки піраміди скроневої кістки, тут лежить трійчастий вузол.", "Решітчаста кістка розташована в передній черепній ямці.", "Лобова кістка утворює передню черепну ямку.", "Потилична кістка утворює задню черепну ямку."]}, {"n": "4.29", "q": "У чоловіка 54 років після проведення МРТ-дослідження лікар виявив пухлину, що стискає нерви на передній поверхні кам'янистої частини скроневої кістки. Визначте, які отвори для виходу нервів з барабанної порожнини розташовані на передній поверхні кам'янистої частини скроневої кістки?", "o": ["Шило-соскоподібний та соскоподібний.", "Зовнішній та внутрішній отвори сонного каналу.", "Зовнішній та внутрішній слухові отвори.", "Отвори канальців присінка і завитки.", "Розтвори каналів великого і малого кам'янистих нервів."], "a": [4], "e": ["Шило-соскоподібний і соскоподібний отвори — на нижній і зовнішній поверхнях.", "Отвори сонного каналу — на нижній поверхні та верхівці піраміди.", "Зовнішній слуховий отвір — збоку, внутрішній — на задній поверхні.", "Отвори канальців присінка і завитки — на задній і нижній поверхнях піраміди.", "На передній поверхні піраміди — розтвори каналів великого і малого кам'янистих нервів."]}, {"n": "4.30", "q": "У лікарню потрапила жінка 35 років з черепно-мозковою травмою. Травма супроводжувалася кровотечею із пазухи твердої оболони головного мозку в тому місці, де вона прилягає до соскоподібного кута (angulus mastoideus) тім'яної кістки (os parietale) та утворює на ній борозну. У ділянці якої борозни виникла кровотеча", "o": ["Борозни верхньої стрілової пазухи (sulcus sinus sagittalis superioris).", "Борозни нижньої кам'янистої пазухи (sulcus sinus petrosi inferioris).", "Борозни сигмоподібної пазухи (sulcus sinus sigmoidei).", "Борозни верхньої кам'янистої пазухи (sulcus sinus petrosi superioris).", "Борозни поперечної пазухи (sulcus sinus transversi)."], "a": [2], "e": ["Борозна верхньої стрілової пазухи — по стріловому краю тім'яних кісток.", "Борозна нижньої кам'янистої пазухи — на задньому краї піраміди.", "Біля соскоподібного кута тім'яної кістки проходить борозна сигмоподібної пазухи.", "Борозна верхньої кам'янистої пазухи — на верхньому краї піраміди.", "Борозна поперечної пазухи — на потиличній кістці."]}], "models": [["Клиноподібна кістка", "sf:bbcdb2732b6f405090369221fa7fa0e5", {"ru": "Клиновидная кость", "en": "Sphenoid bone"}], ["Клиноподібна кістка (розділена навпіл)", "sf:773c16965d69411a8f082a2143b4a100", {"ru": "Клиновидная кость (разделена пополам)", "en": "Sphenoid bone (split)"}], ["Скронева кістка (скан)", "sf:fed5c349bc4a4455b9cf0892eaa5e727", {"ru": "Височная кость (скан)", "en": "Temporal bone (scan)"}], ["Череп — розібраний на кістки", "o3d:exploded-skull", {"ru": "Череп, разобранный на кости", "en": "Exploded skull"}]]}, {"id": "topic5", "title": "5. Лицевий череп (viscerocranium)", "tr": {}, "questions": [{"n": "5.1", "q": "Жінка звернулася до оториноларинголога зі скаргами на головний біль та нежить. Лікар діагностував запалення слизової оболонки верхньощелепної пазухи (гайморит). Яка кістка ушкоджена?", "o": ["Maxilla.", "Os ethmoidale.", "Os frontale.", "Os sphenoidale.", "Os palatinum."], "a": [0], "e": ["Верхньощелепна (гайморова) пазуха розташована в тілі верхньої щелепи.", "Решітчаста кістка містить решітчасті комірки, а не гайморову пазуху.", "Лобова кістка містить лобову пазуху (фронтит).", "Клиноподібна кістка містить клиноподібну пазуху (сфеноїдит).", "Піднебінна кістка не має пазухи."]}, {"n": "5.2", "q": "У лікарню каретою швидкої медичної допомоги доставлено чоловіка 35 років з черепно-мозковою травмою. Після рентгенологічного обстеження лікар діагностував перелом кістки черепа. Лінія перелому проходить через вінцевий відросток. Яка кістка травмована?", "o": ["Верхня щелепа (maxilla).", "Нижня щелепа (mandibula).", "Вилична кістка (os zygomaticum).", "Сльозова кістка (os lacrimale).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Верхня щелепа має лобовий, виличний, піднебінний і комірковий відростки, але не вінцевий.", "Вінцевий відросток (processus coronoideus) — передній відросток гілки нижньої щелепи, до нього кріпиться скроневий м'яз.", "Вилична кістка має лобовий і скроневий відростки.", "Сльозова кістка не має вінцевого відростка.", "Піднебінна кістка має пірамідний, очноямковий і клиноподібний відростки."]}, {"n": "5.3", "q": "У відділення щелепно-лицевої хірургії з вогнепальним пораненням госпіталізовано чоловіка 45 років. Під час рентгенологічного обстеження лікар виявив, що куля уразила кістку черепа біля підборідного отвору (foramen mentale). Яка кістка ушкоджена?", "o": ["Верхня щелепа (maxilla).", "Леміш (vomer).", "Вилична кістка (os zygomaticum).", "Нижня щелепа (mandibula).", "Піднебінна кістка (os palatinum)."], "a": [3], "e": ["Верхня щелепа має підочноямковий отвір, а не підборідний.", "Леміш не має отворів на обличчі.", "Вилична кістка має вилично-лицевий отвір.", "Підборідний отвір (foramen mentale) розташований на тілі нижньої щелепи під другим малим кутнім зубом.", "Піднебінна кістка має великий і малі піднебінні отвори."]}, {"n": "5.4", "q": "У жінки 36 років лікар діагностував запалення слизової оболонки верхньощелепної пазухи (sinus maxillaris). Під час обстеження в одному із носових ходів був виявлений гній, що витікав з верхньощелепної пазухи. В якому носовому ході лікар побачив гній?", "o": ["Meatus nasi medius.", "Meatus nasi superior.", "Meatus nasi communis.", "Meatus nasi interior.", "Meatus nasopharyngeus."], "a": [0], "e": ["Верхньощелепна пазуха відкривається півмісяцевим розтвором у середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід — щілина біля перегородки, пазухи в нього не відкриваються.", "У нижній носовий хід відкривається носо-сльозова протока.", "Носоглотковий хід з'єднує носову порожнину з глоткою."]}, {"n": "5.5", "q": "У хлопчика 12 років внаслідок довготривалого запалення слизової оболонки носової порожнини з'явилися симптоми запалення лобової пазухи (фронтит). Через який анатомічний утвір кісткової носової порожнини стало можливим розповсюдження інфекції в лобову пазуху?", "o": ["Клино-решітчастий закуток.", "Клино-піднебінний отвір.", "Півмісяцевий розтвір.", "Решітчасті комірки.", "Решітчасту лійку."], "a": [4], "e": ["У клино-решітчастий закуток відкривається клиноподібна пазуха.", "Клино-піднебінний отвір веде до крило-піднебінної ямки.", "Півмісяцевий розтвір — щілина, куди відкривається верхньощелепна пазуха; лобова — через лійку.", "Решітчасті комірки — окремі повітроносні порожнини.", "Лобова пазуха відкривається через решітчасту лійку в середній носовий хід."]}, {"n": "5.6", "q": "У жінки 23 років після дорожньо-транспортної пригоди виник крововилив та гнійне запалення м'яких тканин виличної ділянки обличчя. Лікар передбачає ушкодження стінки судини, яка виходить на лице через отвір виличної кістки. У ділянці якого отвору розташована гематома?", "o": ["Вилично-очноямкового.", "Вилично-скроневого.", "Вилично-лицевого.", "Круглого.", "Остистого."], "a": [2], "e": ["Вилично-очноямковий отвір веде всередину кістки з боку очної ямки.", "Вилично-скроневий отвір виходить у скроневу ямку.", "Вилично-лицевий отвір відкривається на лицевій поверхні виличної кістки — через нього судини й нерв виходять на обличчя.", "Круглий отвір розташований у клиноподібній кістці.", "Остистий отвір — у великому крилі клиноподібної кістки."]}, {"n": "5.7", "q": "Жінка 34 років потрапила в нейрохірургічне відділення лікарні з внутрішньочерепною пухлиною. Рентгенологічне обстеження хворої показало, що пухлина зруйнувала передні відділи нижньої стінки очної ямки. Яка кістка ушкоджена пухлиною?", "o": ["Клиноподібна кістка.", "Скронева кістка.", "Лобова кістка.", "Решітчаста кістка.", "Верхня щелепа."], "a": [4], "e": ["Клиноподібна кістка не утворює нижньої стінки очної ямки.", "Скронева кістка не бере участі в утворенні очної ямки.", "Лобова кістка утворює верхню стінку.", "Решітчаста кістка утворює присередню стінку.", "Нижню стінку очної ямки спереду утворює очноямкова поверхня верхньої щелепи."]}, {"n": "5.8", "q": "У хірургічне відділення лікарні госпіталізовано чоловіка 22 років з вогнепальним пораненням голови. Після МРТ-обстеження виявлено перелом шийки нижньої щелепи (collum mandibulae). У ділянці якого утвору нижньої щелепи розташовано ушкодження?", "o": ["Виросткового відростка (processus condylaris).", "Вінцевого відростка (processus coronoideus).", "Верхньої підборідної ості (spina mentalis superior).", "Язичка нижньої щелепи (lingula mandibulae).", "Нижньої підборідної ості (spina mentalis inferior)."], "a": [0], "e": ["Шийка нижньої щелепи — частина виросткового відростка під його головкою.", "Вінцевий відросток — передній відросток гілки, без шийки.", "Верхня підборідна ость — на внутрішній поверхні тіла, для підборідно-язикового м'яза.", "Язичок нижньої щелепи — пластинка біля отвору нижньої щелепи.", "Нижня підборідна ость — для підборідно-під'язикового м'яза."]}, {"n": "5.9", "q": "У лікарню госпіталізовано чоловіка 55 років з ножовим пораненням передньої шийної ділянки, внаслідок чого було ушкоджено великий ріг (cornu majus) кістки. Яка кістка ушкоджена?", "o": ["Верхня щелепа (maxilla).", "Під'язикова кістка (os hyoideum).", "Вилична кістка (os zygomaticum).", "Сльозова кістка (os lacrimale).", "Піднебінна кістка (os palatinum)."], "a": [1], "e": ["Верхня щелепа не має рогів.", "Під'язикова кістка має тіло, великі та малі роги; розташована на передній поверхні шиї.", "Вилична кістка не має рогів.", "Сльозова кістка не має рогів.", "Піднебінна кістка не має рогів."]}, {"n": "5.10", "q": "Жінка 45 років звернулася до лікаря зі скаргою на ускладнення носового дихання. Після обстеження лікар виявив викривлення кістки, яка утворює задньонижню частину кісткової носової перегородки. Яка кістка викривлена?", "o": ["Верхня щелепа (maxilla).", "Нижня щелепа (mandibula).", "Вилична кістка (os zygomaticum).", "Леміш (vomer).", "Піднебінна кістка (os palatinum)."], "a": [3], "e": ["Верхня щелепа утворює носовий гребінь, але не задньонижню частину перегородки.", "Нижня щелепа не бере участі в утворенні носової порожнини.", "Вилична кістка не входить до носової порожнини.", "Леміш (vomer) утворює задньонижню частину кісткової носової перегородки.", "Піднебінна кістка утворює дно та частину бічної стінки носової порожнини."]}, {"n": "5.11", "q": "У чоловіка 25 років після дорожньо-транспортної травми діагностовано руйнацію кісток лицевого черепа на присередній стінці очної ямки. Які кістки лицевого черепа ушкоджені?", "o": ["Верхня щелепа, сльозова кістка.", "Верхня щелепа, решітчаста кістка.", "Верхня щелепа, клиноподібна.", "Піднебінна кістка, сльозова кістка.", "Решітчаста кістка, сльозова кістка."], "a": [0], "e": ["Із кісток лицевого черепа присередню стінку очної ямки утворюють лобовий відросток верхньої щелепи та сльозова кістка.", "Решітчаста кістка теж є в присередній стінці, але вона належить до мозкового черепа.", "Клиноподібна кістка — мозковий череп і утворює задню частину стінки.", "Піднебінна кістка утворює задню частину нижньої стінки.", "Решітчаста кістка належить до мозкового черепа."]}, {"n": "5.12", "q": "У лікарню госпіталізовано чоловіка з вогнепальним пораненням суглоба, в утворенні якого приймає участь нижня щелепа (mandibula). Лікар виявив на рентгензображенні ушкодження суглобових поверхонь обох кісток, що утворюють цей суглоб. Яка кістка, крім нижньої щелепи, ушкоджена?", "o": ["Клиноподібна кістка (os sphenoidale).", "Скронева кістка (os temporale).", "Верхня щелепа (maxilla).", "Вилична кістка (os zygomaticum).", "Потилична кістка (os occipitale)."], "a": [1], "e": ["Клиноподібна кістка не утворює скронево-нижньощелепного суглоба.", "Скронево-нижньощелепний суглоб утворений голівкою нижньої щелепи та нижньощелепною ямкою скроневої кістки.", "Верхня щелепа не утворює суглоба з нижньою.", "Вилична кістка не утворює суглоба з нижньою щелепою.", "Потилична кістка утворює суглоб з атлантом."]}, {"n": "5.13", "q": "Лікар, обстежуючи носову порожнину у жінки 54 років, виявив звуження одного із носових ходів доброякісною пухлиною в ділянці проєкції canalis incisivus. Який носовий хід звужений в даному випадку?", "o": ["Meatus nasi communis.", "Meatus nasi superior.", "Meatus nasi interior.", "Meatus nasi medius.", "Meatus nasopharyngeus."], "a": [2], "e": ["Загальний носовий хід — щілина біля перегородки.", "Верхній носовий хід розташований високо, біля решітчастої кістки.", "Носовий отвір різцевого каналу відкривається на дні носової порожнини в ділянці нижнього носового ходу.", "Середній носовий хід — під середньою раковиною, туди відкриваються пазухи.", "Носоглотковий хід — задній відділ."]}, {"n": "5.14", "q": "До хірурга звернулася жінка з гнійним запаленням шкіри в ділянці підочноямкового отвору. Лікар прогнозує можливість поширення запалення в очну ямку. На якій кістці розташований підочноямковий отвір?", "o": ["Клиноподібна кістка (os sphenoidale).", "Скронева кістка (os temporale).", "Верхня щелепа (maxilla).", "Нижня щелепа (mandibula).", "Вилична кістка (os zygomaticum)."], "a": [2], "e": ["Клиноподібна кістка не має підочноямкового отвору.", "Скронева кістка не має підочноямкового отвору.", "Підочноямковий отвір розташований на передній поверхні тіла верхньої щелепи під підочноямковим краєм.", "Нижня щелепа має підборідний отвір.", "Вилична кістка має вилично-лицевий отвір."]}, {"n": "5.15", "q": "У чоловіка 43 років діагностована емпієма жирового тіла очної ямки. Процес ускладнився ушкодженням очноямкового відростка кістки лицевого черепа, що утворює задню частину нижньої стінки очної ямки. Яка кістка ушкоджена?", "o": ["Нижня носова раковина.", "Піднебінна кістка.", "Верхня щелепа", "Нижня щелепа.", "Вилична кістка."], "a": [1], "e": ["Нижня носова раковина не має очноямкового відростка.", "Очноямковий відросток піднебінної кістки утворює задню частину нижньої стінки очної ямки.", "Верхня щелепа утворює передню і середню частини нижньої стінки.", "Нижня щелепа не бере участі в утворенні очної ямки.", "Вилична кістка утворює бічну і частину нижньої стінки спереду."]}, {"n": "5.16", "q": "У чоловіка 60 років рентгенологічно виявлено скупчення гною у верхньощелепній пазусі справа. В який із носових ходів носової порожнини спочатку буде прямувати гній?", "o": ["У правий нижній носовий.", "У правий середній носовий.", "У правий верхній носовий.", "У правий загальний носовий.", "У правий носоглотковий."], "a": [1], "e": ["У нижній носовий хід відкривається носо-сльозова протока.", "Верхньощелепна пазуха відкривається в середній носовий хід.", "У верхній носовий хід відкриваються задні решітчасті комірки.", "Загальний носовий хід не має отворів пазух.", "Носоглотковий хід веде в глотку."]}, {"n": "5.17", "q": "Після пластичної операції на піднебінні у хлопчика 5 років виникло ускладнення у вигляді запалення кістки в ділянці розташування малих піднебінних отворів (foramina palatina minora). Яка кістка уражена?", "o": ["Верхня щелепа (maxilla).", "Решітчаста кістка (os ethmoidale).", "Лобова кістка (os frontale)", "Клиноподіб
